  *{ box-sizing: border-box; }

  body{
    margin: 0;
    padding: 24px 16px 40px;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #1d2126;
    color: #e8e4dd;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  h1{
    margin: 0;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: .02em;
  }

  .panel{
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: #262b31;
    border: 1px solid #363c44;
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 14px;
  }

  .panel label{ display: flex; align-items: center; gap: 8px; }

  button{
    font: inherit;
    padding: 6px 16px;
    border-radius: 6px;
    border: 1px solid #4a525c;
    background: #333a42;
    color: #e8e4dd;
    cursor: pointer;
  }
  button:hover{ background: #3d454e; }

  input[type=range]{ width: 150px; accent-color: #a8392f; }

  /* ---- scena ---- */
  .scene{
    position: relative;
    width: 100%;
    max-width: 1280px;
    overflow: hidden;
    background: #ffffff;
    border-radius: 10px;
    border: 1px solid #3a4048;
    height: calc(499px * var(--scale) + 27px * var(--scale) + var(--ballast) + 10px);
    min-height: 120px;
    user-select: none;
  }

  /* nasip ispod pruge */
  .ballast{
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: calc(var(--ballast) + 27px * var(--scale));
    background: linear-gradient(#efe9e1 0%, #e4dcd1 45%, #d8cfc2 100%);
  }

  /* pruga – isječak iz same slike, ponavlja se i klizi ulijevo */
  .rails{
    position: absolute;
    left: 0; right: 0;
    bottom: var(--ballast);
    height: calc(27px * var(--scale));
    background-image: var(--tile);
    background-repeat: repeat-x;
    background-size: calc(296px * var(--scale)) calc(27px * var(--scale));
    animation: roll var(--roll) linear infinite;
  }
  @keyframes roll{
    from{ background-position-x: 0; }
    to  { background-position-x: calc(-296px * var(--scale)); }
  }

  /* ---- vlak ---- */
  .train{
    position: absolute;
    bottom: calc(var(--ballast) + 27px * var(--scale));
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: flex-end;
    white-space: nowrap;
  }

  .car{
    position: relative;
    flex: 0 0 auto;
    width: calc(1024px * var(--scale));
    height: calc(499px * var(--scale));   /* donji dio slike (pruga) je odrezan */
    overflow: hidden;
    animation: bob .26s steps(1) infinite alternate;
  }

  .car img{
    position: absolute;
    left: 0; top: 0;
    width: calc(1024px * var(--scale));
    height: auto;
    display: block;
    pointer-events: none;
  }

  /* spajanje vagona – slike imaju prazan rub pa ih uvlačimo */
  .car + .car{ margin-left: calc(-98px * var(--scale)); }

  .car:nth-child(2){ animation-delay: .07s; }
  .car:nth-child(3){ animation-delay: .13s; }
  .car:nth-child(4){ animation-delay: .19s; }

  @keyframes bob{
    from{ transform: translateY(0); }
    to  { transform: translateY(calc(-1px - 2px * var(--scale))); }
  }

  /* tri faze lokomotive – izmjenjuju se u krug */
  .loco img{ opacity: 0; }
  .loco img.f1{ animation: fr1 var(--chuff) steps(1) infinite; }
  .loco img.f2{ animation: fr2 var(--chuff) steps(1) infinite; }
  .loco img.f3{ animation: fr3 var(--chuff) steps(1) infinite; }

  @keyframes fr1{ 0%,33.3%{opacity:1} 33.4%,100%{opacity:0} }
  @keyframes fr2{ 0%,33.3%{opacity:0} 33.4%,66.6%{opacity:1} 66.7%,100%{opacity:0} }
  @keyframes fr3{ 0%,66.6%{opacity:0} 66.7%,100%{opacity:1} }

  /* način 2: vlak prolazi kroz kadar, pruga miruje */
  .scene.prolazak .rails{ animation: none; }
  .scene.prolazak .train{
    left: 0;
    transform: none;
    animation: cross var(--cross) linear infinite;
  }
  @keyframes cross{
    from{ transform: translateX(calc(-1px * var(--trainw))); }
    to  { transform: translateX(calc(1px * var(--scenew))); }
  }

  .scene.stop *{ animation-play-state: paused !important; }

  .hint{
    margin: 0;
    font-size: 13px;
    color: #9aa2ac;
    text-align: center;
    max-width: 640px;
    line-height: 1.5;
  }

  .greska{
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: #fff;
    color: #a8392f;
    font-size: 14px;
    text-align: center;
    padding: 20px;
  }
  .scene.greska-vidljiva .greska{ display: flex; }
</style>
</head>
<body>

<h1>Demo – vlak u pokretu</h1>

<div class="panel">
  <button id="gumbStop">Stani</button>
  <label>Brzina
    <input type="range" id="brzina" min="80" max="1200" step="20" value="420">
  </label>
  <label>
    <input type="checkbox" id="nacin">
    Vlak prolazi kroz kadar
  </label>
</div>

<div class="scene" id="scena">
  <div class="ballast"></div>
  <div class="rails"></div>
  <div class="train" id="vlak">
    <div class="car"><img src="slike nekompresirano/mini igre/elementi/teretni vagon.jfif" alt="teretni vagon" style="opacity:1"></div>
    <div class="car"><img src="slike nekompresirano/mini igre/elementi/teretni vagon.jfif" alt="teretni vagon" style="opacity:1"></div>
    <div class="car"><img src="slike nekompresirano/mini igre/elementi/teretni vagon.jfif" alt="teretni vagon" style="opacity:1"></div>
    <div class="car loco">
      <img class="f1" src="slike nekompresirano/mini igre/elementi/poštanski vlak lokomotiva 1.jfif" alt="lokomotiva faza 1">
      <img class="f2" src="slike nekompresirano/mini igre/elementi/poštanski vlak lokomotiva 2.jfif" alt="lokomotiva faza 2">
      <img class="f3" src="slike nekompresirano/mini igre/elementi/poštanski vlak lokomotiva 3.jfif" alt="lokomotiva faza 3">
    </div>
  </div>
  <div class="greska">Slike se nisu učitale – provjeri je li ovaj HTML u korijenu projekta,<br>uz mapu <code>slike nekompresirano/mini igre/elementi/</code>.</div>
</div>

<p class="hint">
  Pruga je izrezana iz same slike i klizi ulijevo, lokomotiva izmjenjuje tri faze dima,
  a svaki vagon poskakuje u vlastitom ritmu. Slike su nepromijenjene.
</p>

<script>
  const scena  = document.getElementById('scena');
  const vlak   = document.getElementById('vlak');
  const brzina = document.getElementById('brzina');
  const gumb   = document.getElementById('gumbStop');
  const nacin  = document.getElementById('nacin');

  // koliko slikovnih piksela vlak ima u širinu (4 vozila minus preklopi)
  const SIRINA_VLAKA = 4 * 1024 - 3 * 98;

  function osvjezi(){
    const w = scena.clientWidth;

    // skaliranje: na velikom ekranu do 0.34, na malom toliko da vlak stane
    const skala = Math.min(0.34, Math.max(0.09, (w - 24) / SIRINA_VLAKA));
    scena.style.setProperty('--scale', skala);

    const v = Number(brzina.value);            // slikovnih piksela u sekundi
    scena.style.setProperty('--roll', (296 / v) + 's');
    scena.style.setProperty('--chuff',
      Math.min(0.8, Math.max(0.16, 260 / v / 3)) + 's');

    const sirinaVlakaPx = SIRINA_VLAKA * skala;
    scena.style.setProperty('--trainw', sirinaVlakaPx);
    scena.style.setProperty('--scenew', w);
    scena.style.setProperty('--cross', ((w + sirinaVlakaPx) / (v * skala)) + 's');
  }

  brzina.addEventListener('input', osvjezi);
  window.addEventListener('resize', osvjezi);

  gumb.addEventListener('click', () => {
    const stoji = scena.classList.toggle('stop');
    gumb.textContent = stoji ? 'Kreni' : 'Stani';
  });

  nacin.addEventListener('change', () => {
    scena.classList.toggle('prolazak', nacin.checked);
    osvjezi();
  });

  // ako se .jfif ne učita, javi umjesto praznog bijelog okvira
  vlak.querySelectorAll('img').forEach(img => {
    img.addEventListener('error', () => scena.classList.add('greska-vidljiva'));
  });

  osvjezi();
</script>

</body>
</html>
