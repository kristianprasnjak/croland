  function renderAccount() {
    if (!imaRacun()) { renderAccountGost(); return; }
    var u = SESSION.user;
    var st = accStanje();
    var ime = (ACC.javni && ACC.javni.nadimak) || (u.email || '').split('@')[0];
    var pr = ((u.app_metadata && u.app_metadata.providers) || []);
    ACC.kodIzAdrese = null;
    try { ACC.kodIzAdrese = sessionStorage.getItem(ACC_KOD_KLJUC); } catch (e) {}
    var oRacunu = (pr.indexOf('google') !== -1 ? 'Signed in with Google' : 'Signed in with email') +
      (u.created_at ? T_(' · member since %1', new Date(u.created_at).toLocaleDateString(LOKAL_DATUM, { month: 'long', year: 'numeric' })) : '');

    VIEW.innerHTML = '<div class="acc">' +
      '<div class="accZaglavlje"><h1 class="sekcija">Account</h1>' +
        '<button class="accVeza" id="btnOdjava">Log out</button></div>' +
      '<div class="accJa"><div class="accAvatar" id="accAvatar">' + esc((ime || '?').charAt(0).toUpperCase()) + '</div>' +
        '<div class="accJaTxt"><div class="accJaIme"><span id="accJaIme">' + esc(ime) + '</span>' +
          (st === 'free' ? '' : ' <span class="accZnacka accZnPlus">Plus</span>') + '</div>' +
          '<div class="accTiho">' + esc(u.email || '') + ' ' + accInfo(oRacunu) + '</div></div></div>' +
      '<div class="nasP accNasP">Plan</div>' + accPlan() +
      accKodoviOdjeljak(false) +
      accMojiKodovi() +
      accPostavke() +
      accPodaci() +
      '<p class="accDno"><a href="' + pravnaStranica('privacy') + '">Privacy</a><a href="' + pravnaStranica('terms') + '">Terms</a></p>' +
      '</div>';

    accVezi();
    if (ACC.kodIzAdrese) accPokreniKod(ACC.kodIzAdrese);
    if (!ACC.javni) {
      supa.rpc('moj_javni_racun').then(function (res) {
        ACC.javni = (res.data && res.data[0]) || { nadimak: null };
        accOsvjeziIme();
      });
    }
    accCrtajKodove();
    accCrtajDarivatelje();

  function accOsvjeziIme() {
    var n = ACC.javni && ACC.javni.nadimak;

    if (v) { v.textContent = n || 'Not set'; v.className = n ? '' : 'accPrazno'; }
    if (!n) return;
    var e1 = $('accJaIme'); if (e1) e1.textContent = n;
    var e2 = $('accAvatar'); if (e2) e2.textContent = n.charAt(0).toUpperCase();

  // ---- gost: cjenik i upute za prijavu ----
  // Paddle za odobrenje traži da cijene budu vidljive bez prijave, a gost tako vidi što
  // dobiva prije nego napravi račun. Svaka radnja vodi u prozor za prijavu, s povratkom ovamo.
  function accUsporedba() {
    var redovi = [
      ['Lesson 0', true, true],
      ['Level 1 on every track', true, true],
      ['Daily challenges and mini games', true, true],
      ['Level 2 and above', false, true],
      ['AI help on exercises', T_('1/day'), T_('20/day')]
    ];

      '</tbody></table>';

  function renderAccountGost() {
    ACC.kodIzAdrese = null;
    try { ACC.kodIzAdrese = sessionStorage.getItem(ACC_KOD_KLJUC); } catch (e) {}
    var besplatno = accBesplatnoDo();
    VIEW.innerHTML = '<div class="acc">' +
      '<div class="accHero"><h1 class="sekcija">Croland Plus</h1>' +
        '<p class="accUvod">Every level, every track — all of Croatian, unlocked.</p>' +
        (besplatno ? '<p class="accPilula">' + T_('Free for everyone until %1', accDatum(besplatno)) + '</p>' : '') + '</div>' +
      '<div class="accKartica accPlan">' + accPaketi() + '</div>' +
      '<div class="accGostRed">' +
        '<div class="accKartica"><div class="accPodnaslov">Free or Plus</div>' + accUsporedba() + '</div>' +
        '<div class="accKartica accStart"><div class="accPodnaslov">Start free</div>' +
          '<p class="accTiho" style="margin:0 0 1rem">A free account takes a minute and opens Level 1. Upgrade any time.</p>' +
          '<button class="accBtn accSiroki" id="accRegistracija">Create a free account</button>' +
          '<button class="accBtn accBtn2 accSiroki" id="accPrijava">Log in</button>' +

        '</div></div>' +
      '<div class="accKartica">' + accKodTraka(true) + '</div>' +

      '</div>';

    var prijava = function () { prikaziModalPrijava({ view: 'account' }); };
    var unos = $('accKodUnos');
    var kod = function () {
      var k = String(unos.value || '').trim();
      if (k) { try { sessionStorage.setItem(ACC_KOD_KLJUC, k); } catch (e) {} }
      prijava();
    };
    $('accKodGumb').onclick = kod;
    unos.onkeydown = function (e) { if (e.key === 'Enter') kod(); };
    Array.prototype.forEach.call(document.querySelectorAll('.accCijena'), function (b) {
      b.onclick = function () { ACC.paket = b.getAttribute('data-paket'); accOsvjeziPakete(); };
    });
    $('accKupiPaket').onclick = prijava;
    accVeziCustom();
    $('accKupiKodove').onclick = prijava;
    $('accRegistracija').onclick = prijava;
    $('accPrijava').onclick = function () {
      prijava();
      var p = $('prPrebaci'); if (p) p.click();   // prozor se otvara na "Create", ovdje treba "Log in"
    };
    $('accL0').onclick = function () { idi('unit', L0_TIP, L0_RAZINA); };
  }

  function accVezi() {
    $('btnOdjava').onclick = function () { odjava(function () { ACC.javni = null; ACC.kodovi = null; ACC.darivatelji = null; renderMain(); }); };
    var unos = $('accKodUnos');
    $('accKodGumb').onclick = function () { accPokreniKod(unos.value); };
    unos.onkeydown = function (e) { if (e.key === 'Enter') accPokreniKod(unos.value); };

    Array.prototype.forEach.call(document.querySelectorAll('.accCijena'), function (b) {
      b.onclick = function () { ACC.paket = b.getAttribute('data-paket'); accOsvjeziPakete(); };
    });
    var kp = $('accKupiPaket');
    if (kp) kp.onclick = function () { accKupi({ tip: 'paket', paket: ACC.paket }); };
    accVeziCustom();

    var pp = $('accPromjena'); if (pp) pp.onclick = accPromjenaPaketa;
    var po = $('accPortal'); if (po) po.onclick = function () {
      var b = this; b.disabled = true;
      accPozoviRacun({ radnja: 'portal' }).then(function (j) {
        b.disabled = false;
        if (j.url) window.open(j.url, '_blank', 'noopener');
        else accPoruka('Not available', 'Subscription management isn\'t available right now. Please try again later.');
      });
    };
    var na = $('accNastavi'); if (na) na.onclick = function () {
      var b = this; b.disabled = true;
      accPozoviRacun({ radnja: 'nastavi' }).then(function (j) {
        if (!j.ok) { b.disabled = false; accPoruka('Not available', 'Please try again later.'); return; }
        ucitajEntitlement(renderAccount);
      });
    };

    $('accIme').onclick = accPromjenaImena;
    $('accEmail').onclick = accPromjenaEmaila;
    $('accLozinka').onclick = function () { accNovaLozinka(false); };
    $('accSvuda').onclick = function () {
      var b = this; b.disabled = true;
      supa.auth.signOut({ scope: 'global' }).then(function () {
        odjava(function () { ACC.javni = null; ACC.kodovi = null; renderMain(); });
      });
    };
    $('accIzvoz').onclick = accIzvoz;
    $('accBrisi').onclick = accBrisanje;
  }
  function accPromjenaImena() {
    var m = accModal('<h2>Display name</h2><p class="otkljPod">Shown to friends and to whoever gave you a code. Never your email.</p>' +
      '<div class="poljeP"><label for="accNovoIme">Name</label><input id="accNovoIme" maxlength="40" value="' +
        esc((ACC.javni && ACC.javni.nadimak) || '') + '"></div>' +
      '<p class="greskaP" id="accImePoruka"></p>' +
      '<div class="accGumbi"><button class="accBtn accBtn2" data-zatvori>Cancel</button><button class="accBtn" id="accImeDa">Save</button></div>');
    setTimeout(function () { var f = $('accNovoIme'); if (f) { f.focus(); f.select(); } }, 60);
    $('accImeDa').onclick = function () {
      var ime = $('accNovoIme').value.trim().slice(0, 40);
      this.disabled = true;
      supa.from('javni_bodovi').update({ nadimak: ime || null, updated_at: new Date().toISOString() })
        .eq('user_id', SESSION.user.id).then(function (res) {
          if (res.error) { $('accImePoruka').textContent = 'Could not save — try again.'; $('accImeDa').disabled = false; return; }
          ACC.javni = ACC.javni || {}; ACC.javni.nadimak = ime || null;
          if (typeof DRUSTVO !== 'undefined' && DRUSTVO.ja) DRUSTVO.ja.nadimak = ime || null;
          m.zatvori(); accOsvjeziIme();
        });
    };
  }

  function accOsvjeziPakete() {
    Array.prototype.forEach.call(document.querySelectorAll('.accCijena'), function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-paket') === ACC.paket));
    });
    var kp = $('accKupiPaket'); if (kp) kp.textContent = ACC_NASTAVI[ACC.paket];
  }
  function accVeziCustom() {
    var n = $('accN'); if (!n) return;
    var c = accCijene();
    var osvjezi = function () {
      Array.prototype.forEach.call(document.querySelectorAll('.accVrsta'), function (b) {
        b.setAttribute('aria-pressed', String(b.getAttribute('data-vrsta') === ACC.vrsta));
      });
      var r = accCijenaKodova(ACC.vrsta, ACC.n);
      var z = document.querySelector('.accZbroj');
      if (z) {
        z.querySelector('.accUkupno').textContent = accNovac(r.ukupno);
        $('accZbrojOpis').innerHTML = ACC.n + ' × ' + accNovac(r.poKodu) +
          (r.popust > 0 ? ' · <span class="accPopust">−' + r.popust + '%</span>' : '');
      }
      $('accKupiKodove').textContent = ACC.n === 1 ? T_('Buy %1 code', ACC.n) : T_('Buy %1 codes', ACC.n);
    };
    Array.prototype.forEach.call(document.querySelectorAll('.accVrsta'), function (b) {
      b.onclick = function () { ACC.vrsta = b.getAttribute('data-vrsta'); osvjezi(); };
    });
    n.oninput = function () {
      var v = Math.round(Number(n.value));
      if (!(v >= 1)) return;
      ACC.n = Math.min(c.max, v);
      $('accNR').value = Math.round(Math.log(ACC.n) / Math.log(c.max) * 1000);
      osvjezi();
    };
    n.onblur = function () { n.value = ACC.n; };
    $('accNR').oninput = function () {
      ACC.n = Math.max(1, Math.round(Math.exp(this.value / 1000 * Math.log(c.max))));
      n.value = ACC.n; osvjezi();
    };
    $('accKupiKodove').onclick = function () { accKupi({ tip: 'kodovi', vrsta: ACC.vrsta, kolicina: ACC.n }); };
  }

  function accPromjenaPaketa() {
    var p = accPretplata(); if (!p) return;
    var trenutni = p.paket;
    var izbor = trenutni === 'godina' ? 'mjesec' : 'godina';
    var c = accCijene();
    var crtaj = function () {
      return '<h2>Change plan</h2><p class="otkljPod">' +
        T_('You\'re on <b>%1</b>, paid until <b>%2</b>. The new plan starts then — you keep everything you\'ve paid for.',
          ACC_IME[p.placeni_paket || trenutni], accDatum(p.vrijedi_do)) + '</p>' +
        '<div class="accCijene" style="margin-top:1rem">' + ['tjedan', 'mjesec', 'godina'].map(function (k) {
          return '<button type="button" class="accCijena" data-pk="' + k + '" aria-pressed="' + (izbor === k) + '"' +
            (k === trenutni ? ' disabled style="opacity:.5;cursor:default"' : '') + '><span class="accCNaz">' + ACC_IME[k] + '</span>' +
            '<span class="accCPod">' + (k === trenutni ? T_('current plan') : T_(ACC_CIJENA_PO[k], accNovac(c[k]))) + '</span></button>';
        }).join('') + '</div>' +
        '<div class="accGumbi"><button class="gumb gumbSivi" data-zatvori>Cancel</button>' +
        '<button class="gumb" id="accPromjenaDa">' + T_('Switch to %1 on %2', ACC_IME[izbor], accDatum(p.vrijedi_do)) + '</button></div>';
    };
    var m = accModal(crtaj());
    var vezi = function () {
      Array.prototype.forEach.call(m.el.querySelectorAll('[data-pk]'), function (b) {
        b.onclick = function () { izbor = b.getAttribute('data-pk'); m.el.innerHTML = crtaj(); veziSve(); };
      });
      $('accPromjenaDa').onclick = function () {
        var b = this; b.disabled = true; b.textContent = 'Working…';
        accPozoviRacun({ radnja: 'promijeni_paket', paket: izbor }).then(function (j) {
          m.zatvori();
          if (!j.ok) { accPoruka('Not available', 'Your plan couldn\'t be changed right now. Please try again later.'); return; }
          ucitajEntitlement(renderAccount);
        });
      };
    };

  // ================= INIT =================
  // Visina zaglavlja ide u CSS kao --visinaZaglavlja. Mini-igra se racuna od
  // nje (100dvh minus zaglavlje), a zaglavlje mijenja visinu s uredajem i s
  // odabranom velicinom sucelja — pa se premjeri i pri svakoj promjeni.
  function mjeriZaglavlje() {
    var h = document.querySelector('header');
    if (!h) return;
    document.documentElement.style.setProperty('--visinaZaglavlja',
      Math.round(h.getBoundingClientRect().height) + 'px');
  }
  window.addEventListener('resize', mjeriZaglavlje);

  // Zaglavlje se stisne cim se krene dolje i ostane stisnuto dok se ne vratimo
  // na vrh. Prag za stiskanje (40) je namjerno visi od praga za vracanje (8):
  // stiskanje skrati stranicu, pa bi jedan prag kod dna mogao poceti treperiti
  // — stisne, stranica se skrati, pomak padne ispod praga, otpusti, i opet.
  var zaglMalo = false;
  function zaglavljeNaPomak() {
    var y = window.pageYOffset || document.documentElement.scrollTop || 0;
    var malo = zaglMalo ? y > 8 : y > 40;
    if (malo === zaglMalo) return;
    zaglMalo = malo;
    document.body.classList.toggle('zaglavljeMalo', malo);
    // Odmah za ono što ne čeka, pa još jednom kad stisak (0.18s) stane — inače
    // --visinaZaglavlja ostane na staroj visini i ispod zaglavlja zjapi procjep.
    mjeriZaglavlje();
    setTimeout(mjeriZaglavlje, 220);
    // niz u zaglavlju prati njegov stisak (padding ima prijelaz od .18s)
    if (ikMobAktivan && ikMjesto === 'gore') setTimeout(rasporediIkoneMob, 200);
    // Gornji papirici pocinju ispod zaglavlja, pa se s njim i pomaknu.
    preslozCedulje();
  }
  window.addEventListener('scroll', zaglavljeNaPomak, { passive: true });

  // Rjecnik: alatna traka se zbije cim popis krene pod zaglavlje (.dictOkvir.zbijen).
  // Prag za zbijanje (72) je visi od praga za otpustanje (24) iz istog razloga kao
  // gore: zbijanje skrati stranicu, pa bi jedan prag kod dna mogao treperiti.
  var dictZbijen = false;
  // FLIP: element koji je promijenio roditelja CSS ne zna animirati, pa se
  // zapamti gdje je bio, pusti ga na novo mjesto, i odande ga vratimo natrag u
  // staru poziciju pa otpustimo — oko vidi klizanje, a raspored je vec konacan.
  function dictPreseli(elovi, radnja) {
    var tiho = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    // Prethodno klizanje se prekida prije mjerenja: mjeri se stvarno mjesto
    // elementa, ne ono na koje ga je nategnula animacija koja jos traje.
    elovi.forEach(function (e) {
      if (e.getAnimations) e.getAnimations().forEach(function (a) { a.cancel(); });
    });
    var prije = (tiho || !elovi[0].animate) ? null : elovi.map(function (e) {
      return e.getBoundingClientRect();
    });
    radnja();
    if (!prije) return;
    elovi.forEach(function (e, i) {
      var a = prije[i], b = e.getBoundingClientRect();
      // Ako je jedna od mjera nula (element je bio skriven), nema se sto skalirati
      var sx = (a.width > 1 && b.width > 1) ? a.width / b.width : 1;
      var dx = a.left - b.left, dy = a.top - b.top;
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1 && Math.abs(sx - 1) < 0.02) return;
      e.animate([
        { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + sx + ',1)', opacity: 0.85 },
        { transform: 'none', opacity: 1 }
      ], { duration: 340, easing: 'cubic-bezier(.32,.72,0,1)' });
    });
  }
  // Koliko ekrana odozgo pokriva ono sto je zalijepljeno: zaglavlje (na mobitelu
  // ga nema — ondje otputuje gore) plus zbijena alatna traka. Po toj mjeri se
  // ravna i abecedna traka i skok na slovo, da kartica ne zavrsi ispod sita.
  function dictLjepilo() {
    var okvir = $('dictOkvir'), alat = $('dictAlat');
    if (!okvir) return;
    var h = document.querySelector('header');
    var zagl = (h && getComputedStyle(h).position === 'sticky') ? h.getBoundingClientRect().height : 0;
    okvir.style.setProperty('--dictVrh', Math.round(zagl) + 'px');
    var pokrov = zagl;
    if (dictZbijen && alat && !alat.hidden) {
      pokrov = Math.max(pokrov, alat.getBoundingClientRect().bottom);
    }
    // Mobitel: mala traka stoji uvijek na istom mjestu, pa je i pokrov stalan
    // (ne raste s njezinom neprozirnošću — abecedna traka inače bi skakala).
    var mob = $('dictMob');
    if (dictJeMob() && mob && !mob.hidden) pokrov = Math.max(pokrov, zagl + mob.offsetHeight);
    okvir.style.setProperty('--dictLjepilo', Math.round(pokrov) + 'px');
  }
  // Fiksna traka ne zna sirinu stupca iz kojeg je izasla — mjeri se s mjesta
  // koje je za njom ostalo (.dictAlatMj). Isto vrijedi kad se prozor promijeni.
  function dictStupac() {
    var okvir = $('dictOkvir'); if (!okvir || !dictZbijen) return;
    var mj = okvir.querySelector('.dictAlatMj'); if (!mj) return;
    var r = mj.getBoundingClientRect();
    okvir.style.setProperty('--dictAlatL', Math.round(r.left) + 'px');
    okvir.style.setProperty('--dictAlatW', Math.round(r.width) + 'px');
  }
  function dictJeMob() {
    return !!(window.matchMedia && window.matchMedia('(max-width: 639.98px)').matches);
  }
  // Mobitel: neprozirnost male trake ide za pomakom. 0 dok prva riječ ne prođe
  // vrh ekrana, 1 kad ga prođe treća — između raste ravnomjerno. Isti račun
  // vrijedi i prema gore, pa se traka ugasi prije nego se prva riječ vrati.
  function dictMobFade() {
    var okvir = $('dictOkvir'), mob = $('dictMob');
    if (!okvir || !mob) return;
    var p = 0;
    if (dictJeMob() && !mob.hidden) {
      var k = $('popisRijeci').querySelectorAll('.rijecKart');
      if (k.length) {
        var vrh = parseFloat(getComputedStyle(okvir).getPropertyValue('--dictVrh')) || 0;
        var b1 = k[0].getBoundingClientRect().bottom;
        var b3 = k[Math.min(2, k.length - 1)].getBoundingClientRect().bottom;
        p = (vrh - b1) / Math.max(1, b3 - b1);
      }
      // Dok se u maloj traci tipka, ona ne smije izblijedjeti ispod prsta
      // (kraći popis zna sam vratiti stranicu na vrh).
      if (document.activeElement === $('traziM')) p = 1;
    }
    p = Math.max(0, Math.min(1, p));
    mob.style.opacity = String(p);
    mob.style.visibility = p > 0 ? 'visible' : 'hidden';
    mob.style.pointerEvents = p > 0.5 ? 'auto' : 'none';
    mob.style.transform = p < 1 ? 'translateY(' + (-(1 - p) * 6).toFixed(2) + 'px)' : '';
    if (p > 0) {
      var mj = okvir.querySelector('.dictAlatMj');
      if (mj) {
        var r = mj.getBoundingClientRect();
        if (r.width) { mob.style.left = Math.round(r.left) + 'px'; mob.style.width = Math.round(r.width) + 'px'; }
      }
    }
  }
  function dictNaPomak() {
    var okvir = $('dictOkvir'), alat = $('dictAlat'), seg = $('dictOpsegP');
    if (!okvir || !alat || !seg) { dictZbijen = false; return; }
    dictMobFade();
    var mj = okvir.querySelector('.dictAlatMj'), zag = okvir.querySelector('.dictZag');
    var y = window.pageYOffset || document.documentElement.scrollTop || 0;
    // Na mobitelu se puna traka ne zbija — ondje dolazi zasebna mala traka.
    var zbij = (alat.hidden || dictJeMob()) ? false : (dictZbijen ? y > 24 : y > 72);
    if (zbij === dictZbijen) return;
    dictZbijen = zbij;
    if (zbij) {
      // sve se mjeri dok je traka jos puna i u toku: poslije je uza i fiksna
      var r = alat.getBoundingClientRect();
      var traka = alat.querySelector('.rjecnikTraka');
      if (traka) {
        okvir.style.setProperty('--dictTraz',
          Math.round(traka.getBoundingClientRect().width * 0.9) + 'px');
      }
      okvir.style.setProperty('--dictZagVis', Math.round(zag.getBoundingClientRect().height) + 'px');
      okvir.style.setProperty('--dictAlatL', Math.round(r.left) + 'px');
      okvir.style.setProperty('--dictAlatW', Math.round(r.width) + 'px');
      // Mjesto ostaje visoko koliko je traka bila, PLUS njezina donja margina
      // (fiksna traka je vise nema) — tok tako ostaje isti do piksela i popis
      // ne poskoci ni kad se traka zbije ni kad se otpusti.
      mj.style.height = Math.round(r.height +
        (parseFloat(getComputedStyle(alat).marginBottom) || 0)) + 'px';
    }
    // U traci ostaju tri stvari: trazilica, smjer i opseg. Opseg silazi iz
    // naslova, test se sklanja (v. .zbijen .testG) — nije sito nego posljedica.
    dictPreseli([seg], function () {
      if (zbij) alat.appendChild(seg); else zag.appendChild(seg);
      okvir.classList.toggle('zbijen', zbij);
      if (!zbij) mj.style.height = '';
      // Klizac se crta po izmjerenim gumbima, a oni su se upravo preselili i
      // promijenili slova; racuna se odmah da FLIP uhvati konacnu sliku.
      segmentKlizac(seg);
    });
    dictLjepilo();
    // jos jednom kad prijelazi stanu — tada su i gumbi i traka u konacnoj visini
    setTimeout(function () { segmentKlizac(seg); dictLjepilo(); }, 400);
  }
  window.addEventListener('scroll', dictNaPomak, { passive: true });
  window.addEventListener('resize', function () { dictNaPomak(); dictStupac(); dictLjepilo(); dictMobFade(); });

  VIEW = $('view');
  postaviTemu(temaSad());  // nasumicna pocetna tema; boja se prije hidratacije — bez bljeska
  postaviFont(fontSad());
  mjeriZaglavlje();

  // -- lebdeći rječnik: otvaranje, pretraga, opseg, veličina, povlačenje gore-dolje --
  (function () {
    var l = $('lebdi'); if (!l) return;
    var vuce = false, vukao = false, pocetak = 0, pocetniTop = 0;
    l.onclick = function () { if (!vukao && !ikVukao) otvoriRj(); };
    $('rjZatvori').onclick = zatvoriRj;
    $('zastorRj').onclick = function () { zatvoriRj(); zatvoriIgru(); zatvoriInfo(); };
    $('rjTrazi').oninput = crtajPopisRj;
    $('rjZvj').onclick = function () { rjFav = !rjFav; crtajPopisRj(); $('rjPopis').scrollTop = 0; };
    vezeKlikPopisa($('rjPopis'));
    $('rjManji').onclick = function () { rjRucno = true; rjVelicina = Math.max(32, rjVelicina - 8); postaviVelicinuIkone(); };
    $('rjVeci').onclick = function () { rjRucno = true; rjVelicina = Math.min(96, rjVelicina + 8); postaviVelicinuIkone(); };
    Array.prototype.forEach.call($('rjPrekidac').children, function (c) {
      c.onclick = function () {
        rjOpseg = c.getAttribute('data-opseg');
        Array.prototype.forEach.call($('rjPrekidac').children, function (x) {
          x.classList.toggle('aktivan', x === c);
        });
        crtajPopisRj();
      };
    });
    l.addEventListener('pointerdown', function (e) {
      if (ikMobitel()) return;                     // mobitel: ikHvataj() nosi cijeli niz
      vuce = true; vukao = false;
      pocetak = e.clientY; pocetniTop = l.getBoundingClientRect().top;
      try { l.setPointerCapture(e.pointerId); } catch (err) {}
    });
    l.addEventListener('pointermove', function (e) {
      if (!vuce) return;
      var d = e.clientY - pocetak;
      if (Math.abs(d) > 4) { vukao = true; rjRucno = true; }
      // donja granica ostavlja mjesta i za ikonu igrice koja visi ispod
      rjTop = Math.min(Math.max(pocetniTop + d, 70), najnizeIkone(rjVelicina));
      l.style.top = rjTop + 'px';
      postaviIkonuIgre();
    });
    l.addEventListener('pointerup', function () {
      vuce = false; setTimeout(function () { vukao = false; }, 60);
    });
    // Zatvaranje povlacenjem. Panel na mobitelu nije bocni nego donji list
    // (vidi TRI UREDAJA u CSS-u), pa geste moraju biti dvije:
    //   udesno   — bocni panel (tablet, racunalo, mobitel u pejzazu)
    //   prema dolje po naslovu — donji list; samo po naslovu, jer bi
    //              povlacenje po popisu bilo skrolanje, ne zatvaranje
    var sx = null, sy = null, izGlave = false;
    $('panelRj').addEventListener('touchstart', function (e) {
      sx = e.touches[0].clientX; sy = e.touches[0].clientY;
      izGlave = !!(e.target && e.target.closest && e.target.closest('.glavaRj'));
    });
    $('panelRj').addEventListener('touchend', function (e) {
      if (sx != null) {
        var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
        if (dx > 70 && Math.abs(dx) > Math.abs(dy)) zatvoriRj();
        else if (izGlave && dy > 60 && Math.abs(dy) > Math.abs(dx)) zatvoriRj();
      }
      sx = null; sy = null; izGlave = false;
    });
    postaviVelicinuIkone();
  })();

  // -- lebdeća mini-igrica: otvaranje, smjer, način, preskakanje, reset --
  (function () {
    var g = $('lebdiIgra'); if (!g) return;
    g.onclick = function () { if (!ikVukao) otvoriIgru(); };
    $('igZatvori').onclick = zatvoriIgru;
    $('igPreskoci').onclick = function () { crtajIgru(); };
    $('igReset').onclick = function () {
      igTocno = 0; igNetocno = 0; igRed = []; igZadnji = null;
      osvjeziBrojac(); crtajIgru();
    };
    function vezi(id, atribut, postavi) {
      var kut = $(id);
      Array.prototype.forEach.call(kut.children, function (c) {
        c.onclick = function () {
          postavi(c.getAttribute(atribut));
          Array.prototype.forEach.call(kut.children, function (x) {
            x.classList.toggle('aktivan', x === c);
          });
          crtajIgru(true);
        };
      });
    }
    vezi('igSmjer', 'data-smjer', function (v) { igSmjer = v; });
    vezi('igNacin', 'data-nacin', function (v) { igNacin = v; });
    // swipe udesno zatvara panel
    var sx = null;
    $('panelIgra').addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; });
    $('panelIgra').addEventListener('touchend', function (e) {
      if (sx != null && e.changedTouches[0].clientX - sx > 70) zatvoriIgru();
      sx = null;
    });
  })();

  // -- lebdeći info: otvaranje i zatvaranje --
  (function () {
    var b = $('lebdiInfo'); if (!b) return;
    b.onclick = function () { if (!ikVukao) otvoriInfo(); };
    $('infoZatvori').onclick = zatvoriInfo;
    var sx = null;
    $('panelInfo').addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; });
    $('panelInfo').addEventListener('touchend', function (e) {
      if (sx != null && e.changedTouches[0].clientX - sx > 70) zatvoriInfo();
      sx = null;
    });
  })();
  // -- cedulje: ikona, odabir mjesta, pisanje, papir, brisanje --
  (function () {
    var b = $('lebdiCed'), sloj = $('ceduljeSloj');
    if (!b || !sloj) return;
    b.onclick = function () { if (CED_POSTAVLJA) prekiniPostavljanje(); else pocniPostavljanje(); };
    // Jedan slusac za cijeli sloj: papirici se precrtavaju, pa im pojedinacni
    // slusaci ne bi prezivjeli ni jedno brisanje.
    sloj.addEventListener('click', function (e) {
      var c = e.target.closest ? e.target : null;
      var prazno = c && c.closest('.cedPrazno');
      if (prazno) { stvoriCedulju(prazno.getAttribute('data-slot')); return; }
      var papir = c && c.closest('.cedAlat button[data-papir]');
      if (papir) { promijeniPapir(papir.getAttribute('data-slot'), papir.getAttribute('data-papir')); return; }
      var brisi = c && c.closest('.cedBrisi');
      if (brisi) { pitajBrisanje(brisi.getAttribute('data-slot')); return; }
      // Klik u prazninu tijekom odabira znaci "ni na jedno od cetiri".
      if (CED_POSTAVLJA && (e.target === sloj || e.target.classList.contains('cedMjesto'))) prekiniPostavljanje();
    });
    sloj.addEventListener('input', function (e) {
      if (!e.target.classList || !e.target.classList.contains('cedText')) return;
      upisiCedulju(e.target.getAttribute('data-slot'), e.target.value);
    });
    // Escape je izlaz iz odabira; iz samog papirica vodi natrag u vjezbu.
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      if (CED_POSTAVLJA) { prekiniPostavljanje(); return; }
      if (e.target && e.target.classList && e.target.classList.contains('cedText')) e.target.blur();
    });
    // Sirina praznine visi o sirini prozora, a visina papirica o visini ekrana.
    window.addEventListener('resize', function () { preslozCedulje(); postaviIkonuCedulja(); });
  })();

  // Kratka dijagnostika za konzolu: kaže je li učitan ovaj index.html i ovaj data.js.
  // Upiši u konzolu: zastoNemaInfo()
  window.zastoNemaInfo = function () {
    var b = document.getElementById('lebdiInfo');
    return {
      verzijaStranice: 'info-v1',
      ikonaPostojiUHTMLu: !!b,
      ikonaVidljiva: b ? b.classList.contains('vidi') : false,
      trenutnaVjezba: igra ? (igra.cjelina + ' — str. ' + igra.stranica) : 'nisi unutar vježbe',
      ovaVjezbaImaInfo: !!infoTekstIgre(),
      vjezbiSInfoUData: (window.PODACI && window.PODACI.igre)
        ? window.PODACI.igre.filter(function (x) { return x.meta && x.meta.info; }).length : 0
    };
  };
  console.log('CROLAND info-v1 — upiši zastoNemaInfo() za provjeru');

  // Session check + first hydration + first render all happen inside initAuth()'s
  // onAuthStateChange handler (poslijeAuthPromjene) — see the AUTH section above.
  initAuth();
})();
</script>
