  /* ==========================================================================
     TRI UREĐAJA — mobitel, tablet, računalo
     ==========================================================================
     Do sada je app imao jedan dizajn koji se rastezao: korijen je rastao
     linearno s vw, a jedini stvarni prelom bio je na 640px. Posljedica je bila
     da tablet dobiva stisnuto računalo — istu ljestvicu naslova, isti raspored
     stupaca, istu navigaciju s punim natpisima koja mu se lomi u dva reda.

     Ovdje su tri odvojena dizajna. Razlikuju se u tri stvari, ne samo u širini:

       1. RAZMACI    koliko zraka ide oko sadržaja. Prst treba zrak oko mete
                     jer je tup i zaklanja ono što pogađa; miš ne treba ništa
                     od toga. Zato je RAČUNALO NAJGUŠĆE od sva tri, ne
                     najprozračnije: pogled s pola metra obuhvaća cijeli ekran
                     odjednom, pa više sadržaja po ekranu štedi pomicanje.
                     Širina stupca teksta ostaje uska — zbog duljine retka,
                     ne zbog zraka. Redoslijed po količini zraka oko elementa:
                     mobitel > tablet > računalo.

       2. OMJERI     odnos naslova prema tijelu teksta. Na ekranu od 360px
                     naslov od 2.1x tijela pojede redak; na monitoru se pri
                     1.6x hijerarhija gubi. Zato svaki uređaj ima svoju
                     ljestvicu --t-*: omjer naslov/tijelo je 1.36 na mobitelu,
                     1.58 na tabletu, 1.78 na računalu.

       3. ODNOSI     što stoji uz što. Mobitel je jedan stupac; tablet dijeli
                     na dva i drži navigaciju u jednom retku skraćenih natpisa;
                     računalo ide na tri-četiri stupca i pune natpise.

     Pragovi (.98 da se ne preklope na frakcijskoj širini prozora):

       mobitel   <=  639.98px
       tablet    >=  640px  i  <= 1023.98px
       računalo  >= 1024px            (+ širi raspored od 1440px)

     Širina sama ne razlikuje tablet u pejzažu (1024px) od monitora, pa dvije
     dopune love ono što širina ne vidi:
       (pointer: coarse) — velik ekran kojim se upravlja prstom
       (hover: none)     — uređaj bez miša: lebdenje nije afordancija
     -------------------------------------------------------------------------- */

  /* ---------------- MOBITEL: jedan stupac, palac, zbijeno ---------------- */
  @media (max-width: 639.98px) {
    :root {
      /* Bez rasta po širini. 360px i 430px su isti uređaj u istoj ruci —
         nema razloga da tekst među njima naraste. 17px, ne 16: mobitel se
         drzi blize od monitora, ali se i cita u pokretu i pri losijem svjetlu,
         pa zadano tijelo teksta mora biti citljivo bez zumiranja. 18.2px. */
      --baza: 1.135rem;

      /* Zbijena ljestvica: sitno ne smije pasti ispod ~12px, krupno ne smije
         pojesti redak. Naslov je 1.36x tijela. */
      --t-2xs: 0.72rem;  --t-xs: 0.80rem;  --t-s: 0.87rem;  --t-m: 0.94rem;
      --t-l:   1rem;     --t-xl: 1.09rem;  --t-2xl: 1.20rem;
      --t-3xl: 1.36rem;  --t-4xl: 1.70rem; --t-5xl: 2.30rem;

      /* Velik radijus na maloj kartici izgleda napuhano. */
      --rad-l: 0.75rem;  --rad-xl: 0.875rem;
    }

    #view { max-width: 100%; padding: 1rem 0.875rem 4rem; }

    /* Na 320px zaglavlje nema sirine za pregovore: ondje se brojac krati u tri
       tocke umjesto da gura tipke velicine van ekrana. */
    .desnoZ { gap: 0.375rem; min-width: 0; }
    header .valute { min-width: 0; overflow: hidden; text-overflow: ellipsis; }

    /* Ploča vježbe ide gotovo do ruba: na 360px svaki milimetar bočnog
       razmaka oduzima se od riječi koje se čitaju. */
    #ploca { max-width: 100%; padding: 1rem 0.875rem; border-radius: var(--rad-m); }
    /* kartice za okretanje: dvije u retku, tijesno — palac lista okomito */
    .mrezaVok { gap: 0.625rem; }
    #ploca.siroka { max-width: 100%; }

    .miniMreza { grid-template-columns: repeat(2, 1fr); gap: 0.625rem; margin-top: 1rem; }
    /* Sazeto: samo slika, naslov i podnaslov. Dodir prosiruje karticu na
       cijeli redak i tek tada pokazuje opis. Bodovi se ovdje ne prikazuju. */
    .miniPod, .miniSaz, .miniKart .podnozje, .extraKart .podnozje { display: none; }
    .miniKart .opis, .extraKart .opis, .miniKart .broj { display: none; }
    .miniKart { padding: 0.5rem 0.625rem; gap: 0.125rem; }
    .miniKart .sl { margin: -0.5rem -0.625rem 0.375rem; }
    .miniKart .ime { font-size: var(--t-m); line-height: 1.25; }
    .miniKart .stil { font-size: var(--t-2xs); }
    /* Otvorena kartica zauzme redak i pokaže isti sastav kao prozor na računalu
       (PROZOR IGRE); igra se pokreće samo gumbom, ne drugim dodirom. */
    .miniKart.otvoren, .extraKart.otvoren {
      grid-column: 1 / -1; padding: 0.875rem; gap: 0; cursor: default; transform: none;
      border-color: var(--plava); box-shadow: 0 8px 24px rgba(154,91,82,.14);
    }
    .miniKart.otvoren > :not(.igProsireno), .extraKart.otvoren > :not(.igProsireno) { display: none; }
    .otvoren > .igProsireno { display: block; animation: igRasti .32s cubic-bezier(.22,1,.36,1); }
    .igProsireno .igNaziv .ime { font-size: var(--t-xl); }
    .igProsireno .igNapredak .br { font-size: var(--t-xs); }
    .igProsireno .igTrak { width: 0.625rem; }
    .igProsireno .igOpis { font-size: var(--t-s); }
    /* Jedan stupac znaci da je svaka kartica siroka kao ekran: slika bi u 3:2
       pojela pola zaslona po igri, pa je ovdje plica i dijeli redak s nicim
       drugim. Extras ostaje slozen okomito — palac lista, ne gleda ustranu. */
    .miniNas { font-size: var(--t-xl); margin: 1.5rem 0 0.25rem; }
    .extraKart .tekst { padding: 0.875rem 0.875rem 0.75rem; }

    /* Zaglavlje stranice na mobitelu nije ljepljivo, pa se redak s vrstama
       (Lesson, Vocabulary, Grammar, Practice, Test) lijepi za sam vrh ekrana i
       ostaje vidljiv i kad se mreza vodi prema dolje. */
    .progGlava, .progKut { position: sticky; top: 0; z-index: 3; padding-top: 0.375rem; }
    .progKut { left: 0; z-index: 4; }
    .pocetna { gap: 0.875rem; }
    .postavkeDva, .velicinaMreza, .opcijeMreza { grid-template-columns: 1fr; }

    /* Bočni panel na 360px ostavlja beskoristan prorez od 40px i traži da se
       prst vrati na vrh ekrana. Na mobitelu je to donji list: puna širina,
       otvara se prema gore, zatvara povlačenjem naslova prema dolje. */
    #panelRj, #panelIgra, #panelInfo {
      top: auto; left: 0; right: 0; bottom: 0;
      width: 100%; max-width: 100%; height: 88dvh; max-height: 88dvh;
      transform: translateY(103%);
      border-left: 0; border-top: 1px solid var(--rub);
      border-radius: var(--rad-xl) var(--rad-xl) 0 0;
      box-shadow: 0 -8px 30px rgba(0,0,0,.22);
    }
    #panelRj.otvoren, #panelIgra.otvoren, #panelInfo.otvoren { transform: translateY(0); }
    /* hvatiste: pokazuje da se list povlaci, i daje prstu metu iznad naslova */
    #panelRj .glavaRj, #panelIgra .glavaRj, #panelInfo .glavaRj {
      position: relative; padding-top: 1.25rem;
    }
    #panelRj .glavaRj::before, #panelIgra .glavaRj::before, #panelInfo .glavaRj::before {
      content: ""; position: absolute; left: 50%; top: 0.5rem; width: 2.25rem; height: 4px;
      margin-left: -1.125rem; border-radius: 2px; background: var(--rub);
    }

    /* Odjeljci objasnjenja: glava je meta za palac, pa mora biti visoka barem
       44px, a naslov se smije prelomiti u dva retka umjesto da se skrati. */
    .odlSekGlava { padding: 0.9375rem 0.875rem; min-height: max(2.75rem, 44px); gap: 0.5rem; }
    .odlSekGlava .kvaka { width: 1.75rem; height: 1.75rem; }
    .odlSekTijelo { padding: 0 0.875rem 0.9375rem; }
    .odlSek { margin-bottom: 0.875rem; }
    /* Zvucnik je na mobitelu meta za prst, a ne sitna ikona uz tekst. */
    .zvucnik { font-size: 1em; opacity: .6; padding: 0.25rem; margin-left: 0.25rem; }
    .slusajSavjet { padding: 0.75rem 0.875rem; }
    /* Polje u recenici mora ostati dovoljno visoko da ga tipkovnica pogodi. */
    .praznina { padding: 0.1875rem 0.5rem; }
  }

  /* ---------------- TABLET: dva stupca, ruka drži, srednje ---------------- */
  @media (min-width: 640px) and (max-width: 1023.98px) {
    /* tablet: puna imena vrsta u zaglavlju, broj razine lijevo — ćelija bez
       imena, gušća od računala */
    table.mreza { border-spacing: 0.5rem 0.4375rem; }
    table.mreza th.razF { width: 1.75rem; }
    td.faza { padding: 0.75rem 0.5rem; }
    td.faza .imeF { display: none; }
    td.faza .tr { margin: 0.125rem 0.125rem; }
    .lukOkvir { width: 2.25rem; height: 2.25rem; margin: 0 auto; }
    :root {
      /* Raste unutar svog raspona: 17px na 640px, 17.5px na 1024px — tocno
         ondje gdje racunalo preuzima, pa se pri razvlacenju prozora tekst
         ne trzne. */
      --baza: clamp(1.0625rem, 0.98rem + 0.2vw, 1.09375rem);

      /* Srednja ljestvica — naslov je 1.58x tijela. */
      --t-2xs: 0.69rem;  --t-xs: 0.78rem;  --t-s: 0.85rem;  --t-m: 0.92rem;
      --t-l:   1rem;     --t-xl: 1.14rem;  --t-2xl: 1.32rem;
      --t-3xl: 1.58rem;  --t-4xl: 2.00rem; --t-5xl: 2.80rem;
    }

    /* Najmanje zraka od sva tri: tablet se drži bliže od monitora, a ima
       više mjesta od mobitela — sadržaj smije biti gušći. */
    #view { max-width: 52rem; padding: 1.5rem 1.75rem 3rem; }
    #ploca { max-width: 34rem; padding: 1.5rem; }
    /* kartice za okretanje: tri u retku, gušće nego na računalu */
    .mrezaVok { grid-template-columns: repeat(3, 1fr); gap: 0.75rem; }
    #ploca.siroka { max-width: 44rem; }

    /* Zaglavlje: tablet ima mjesta za pravu navigaciju, ali ne za pune
       natpise — "Daily challenge" i "User account" lome red u dva. Zato
       kratki natpisi (data-kratko) i jedan redak koji se po potrebi pomiče
       vodoravno, umjesto da zaglavlje naraste u dva reda. */
    header { padding: 0.625rem 1rem; gap: 0.75rem; flex-wrap: nowrap; }
    header nav {
      flex: 1 1 auto; min-width: 0; flex-wrap: nowrap;
      overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none;
      gap: 0.125rem;
    }
    header nav::-webkit-scrollbar { display: none; }
    header nav a {
      flex: none; white-space: nowrap; font-size: 0;
      padding: 0.5rem 0.5rem; min-height: max(2.75rem, 44px);
      display: inline-flex; align-items: center;
    }
    header nav a::after { content: attr(data-kratko); font-size: var(--t-s); }
    header .valute { flex: none; padding: 0.375rem 0.625rem; }

    .miniMreza { grid-template-columns: repeat(2, 1fr); gap: 0.875rem; }
    /* Redak je dovoljno dug da Extras stane u dva polja: slika lijevo, tekst
       desno. Time i dalje zauzima vise mjesta od bilo koje dvije mini kartice
       zajedno, ali ne trosi cijelu visinu ekrana prije nego se dode do igara. */
    .extraKart .tekst {
      display: grid; grid-template-columns: 1fr 1.3fr; column-gap: 1.5rem; row-gap: 0.25rem;
      padding: 1rem 1.25rem 0.875rem;
    }
    .extraKart .ime { font-size: var(--t-2xl); grid-column: 1; }
    .extraKart .stil { grid-column: 1; }
    .extraKart .opis { grid-column: 2; grid-row: 1 / 3; margin: 0; }
    .extraKart .podnozje { grid-column: 1 / -1; }
    .mrezaSpoj { grid-template-columns: repeat(4, 1fr); gap: 0.625rem; }
    .postavkeDva { grid-template-columns: 1fr 1fr; }
    .velicinaMreza { grid-template-columns: repeat(3, 1fr); }

    .pocetna { gap: 1rem; }

    /* Odjeljci objasnjenja: ruka drzi uredaj, kvaka se pogada palcem, ali
       redak je dvostruko duzi nego na mobitelu — glava smije biti niza. */
    .odlSekGlava { padding: 0.8125rem 1rem; gap: 0.75rem; }
    .odlSekGlava .kvaka { width: 1.625rem; height: 1.625rem; }
    .odlSekTijelo { padding: 0 1rem 0.8125rem; }
    .odlSek { margin-bottom: 0.6875rem; }
    .slusajSavjet { padding: 0.625rem 1rem; }
  }

  /* ---------------- RAČUNALO: usko, gusto, miš ---------------- */
  /* Više prostora nije poziv da se sadržaj raspe po njemu. Miš pogađa
     točno, hover najavljuje prije klika, a cijeli ekran se vidi bez okretanja
     glave — pa su ovdje razmaci NAJMANJI od sva tri uređaja, a stupac
     sadržaja ostaje na širini na kojoj se redak još čita. Ono što raste s
     monitorom je prazna margina sa strane, ne kartice u sredini. */
  @media (min-width: 1024px) {
    :root {
      /* 16.3px na 1024px, 17.1px na 2560px. Blag nagib: sirina prozora nije
         razlog da tekst raste — ekran od 27" ne gleda se s vece udaljenosti
         nego onaj od 15", samo ima vise mjesta sa strane.
         Na granicama prema tabletu (17–17.5px) ostaje stepenica od oko 7%.
         Namjerno: ondje se ionako mijenja cijeli raspored — stupci, navigacija
         i razmaci — pa se promjena velicine teksta ne primijeti kao skok. */
      --baza: clamp(1.017rem, 0.977rem + 0.063vw, 1.07rem);

      /* Najsira ljestvica od tri — naslov je 1.68x tijela. Raspon je veci nego
         na tabletu jer se hijerarhija gleda izdaleka, ali naslov i dalje ostaje
         u sluzbi teksta ispod sebe. */
      --t-2xs: 0.66rem;  --t-xs: 0.75rem;  --t-s: 0.83rem;  --t-m: 0.91rem;
      --t-l:   1rem;     --t-xl: 1.14rem;  --t-2xl: 1.34rem;
      --t-3xl: 1.68rem;  --t-4xl: 2.15rem; --t-5xl: 2.95rem;
    }

    #view { max-width: 54rem; padding: 1.5rem 1.25rem 3.5rem; }
    #ploca { max-width: 36rem; padding: 1.125rem 1.375rem; }
    /* kartice za okretanje: četiri u retku na široj ploči, s više zraka */
    #ploca:has(.mrezaVok) { max-width: 46rem; }
    .mrezaVok { grid-template-columns: repeat(4, 1fr); gap: 1.125rem; }
    #ploca.siroka { max-width: 44rem; }

    header { padding: 0.625rem 1.25rem; gap: 1rem; }
    header nav { gap: 0.25rem; }

    .miniMreza { grid-template-columns: repeat(3, 1fr); gap: 0.875rem; }
    /* Naslovnica dijeli stupac sa svim ostalim stranicama — vlastita, uza
       sirina znacila je da sadrzaj skoci udesno cim se dode s Lessons ili Mini
       games. Da sirina ne ostane prazna, brza vjezba ide u dva stupca. */
    .pocetna { gap: 1.125rem; }
    .brza { grid-template-columns: repeat(2, 1fr); }

    /* Kartice su mjerene za prst. Na monitoru ih se pogadja misem, pa unutarnji
       razmak moze biti manji — isti sadrzaj, manje praznog okvira oko njega. */
    .miniKart { padding: 0.75rem 0.875rem 0.625rem; }
    /* Uzi razmak kartice povlaci i rub slike — inace bi thumbnail ostao
       uvucen s jedne strane, a nalijegao na rub s druge. */
    .miniKart .sl { margin: -0.75rem -0.875rem 0.4375rem; }
    /* Slika se gleda izdaleka i misem se ne lista: uza je nego na tabletu, a
       tekst uz nju dobiva cijeli redak do kraja stupca. */
    .extraKart .tekst {
      display: grid; grid-template-columns: 1fr 1.6fr; column-gap: 2rem; row-gap: 0.1875rem;
      padding: 0.875rem 1.25rem 0.75rem;
    }
    .extraKart .ime { font-size: var(--t-2xl); grid-column: 1; }
    .extraKart .stil { grid-column: 1; }
    .extraKart .opis { grid-column: 2; grid-row: 1 / 3; margin: 0; align-self: center; }
    .extraKart .podnozje { grid-column: 1 / -1; }
    .miniNas { margin: 1.5rem 0 0.1875rem; }
    .velikaPlocica { padding: 1.75rem 1.25rem; }
    .temaK { padding: 0.75rem 1rem; }
    .fontK { padding: 0.5rem 0.75rem; }
    .velicinaK { padding: 0.625rem 0.5rem; }
    /* Options popunjava isti stupac kao svaka druga stranica — naslov i kartice
       pocinju na istom mjestu kao na Lessons ili Mini games, pa se pri promjeni
       stranice nista ne pomakne. Unutar svoje polovice kartice idu u dva stupca
       da ne budu siroke i prazne. */
    .postavkeDva { max-width: none; gap: 1.25rem; }
    .velicinaBlok, .pregledP { max-width: none; margin-top: 1.375rem; }
    .stupacP { grid-template-columns: repeat(2, 1fr); }
    .progPloca { padding: 0.875rem 1rem; }
    .progValK { padding: 0.75rem 0.875rem; }
    .sazetak, .testUvod { padding: 1.125rem 1.25rem; max-width: 34rem; }
    .prijavaKart { padding: 1.25rem 1.25rem 1rem; }

    /* Dictionary: okvir je širok koliko traži najdulji redak, ne koliko nudi
       stupac — na punom stupcu kratka riječ i prijevod stajali su predaleko.
       36rem je najmanje na čemu alatna traka (cijeli natpis tražilice, smjer,
       test) stane u jedan redak; šire od toga okvir ide samo zbog retka koji
       inače ne bi stao, najviše do stupca. Okvir i Word test stoje na sredini
       stupca, ne uz njegov lijevi rub — izričito traženo, iako im naslov zato
       ne počinje ondje gdje na ostalim stranicama. Zaglavlje, traka, detalji
       kartice i prazno stanje ne šire okvir (contain: inline-size) — inače bi
       ga razvukla otvorena tablica oblika ili dugi odlomak.
       --dictZadrzi v. zadrziSirinu(). */
    .dictOkvir {
      width: max-content; max-width: 100%; margin-inline: auto;
      min-width: min(100%, max(36rem, var(--dictZadrzi, 0px)));
    }
    .dictOkvir .dictZag, .dictOkvir .dictAlat, .dictOkvir .rijecDetalj { contain: inline-size; }
    /* prazno stanje puni okvir — kartica od 32.5rem stajala bi lijevo od sredine */
    .dictOkvir .dictPrazno { max-width: none; contain: inline-size; }
    .wtOkvir { margin-inline: auto; }
    .dictOkvir .rijecRed .enR { margin-left: auto; text-align: right; }
    /* Prijevod sam stoji desno, a lekcija iz koje je riječ dodana ide u
       otvorene detalje — i na stranici i u lebdećem rječniku. */
    .rijecRed .izvorR { display: none; }
    .detRed.izvorDet { display: flex; }
    .rijecKart.samoIzvor .rijecRed { cursor: pointer; }
    .rijecKart.samoIzvor:hover { border-color: var(--plava); }
    .rijecKart.samoIzvor .strelicaDet { display: inline-block; }
    .rijecKart.samoIzvor.otvoren .rijecDetalj { display: block; }

    /* Odjeljci objasnjenja: mis pogada tocno, hover vec najavljuje da je glava
       tipka, pa joj ne treba visina za palac. Najgusce od sva tri — cijela
       stranica objasnjenja tako stane na ekran bez pomicanja. */
    .odlSek { margin-bottom: 0.5rem; }
    .odlSekGlava { padding: 0.625rem 0.875rem; gap: 0.625rem; }
    .odlSekGlava .kvaka { width: 1.375rem; height: 1.375rem; font-size: var(--t-xs); }
    .odlSekTijelo { padding: 0 0.875rem 0.75rem; }
    .slusajSavjet { padding: 0.5rem 0.875rem; margin-bottom: 0.75rem; }
    .odlBrojac { margin-top: 0.875rem; }

    /* Lesson 0: sest crteza stane u jedan red umjesto u dva.
       Sest stupaca u kartici od 36rem daje crtez od 70px — jedan red, ali
       necitljiv. Zato vjezbe koje se sire u redak dobivaju vlastitu, siru
       karticu; ostale ostaju uske jer je ondje mjerilo duljina retka teksta,
       a ne broj stupaca. */
    #ploca:has(.mrezaSpoj), #ploca:has(.zidL0) { max-width: 50rem; }
    .mrezaSpoj { grid-template-columns: repeat(6, 1fr); gap: 0.5rem; }
    .poljeSpoj { padding: 0.3125rem; }
    .cipSpoj { padding: 0.5rem 0.9375rem; }
    .cipovi { gap: 0.5rem; margin-top: 1rem; }

    /* Elementi zadane velicine koji ne vise o ljestvici pisma — na monitoru
       su bili predimenzionirani jer su bili mjereni na mobitelu. */
    .prsten { width: 9.5rem; height: 9.5rem; }
    .bljesak { min-height: 7.25rem; gap: 0.75rem; }
    .bljesak img { width: 6.25rem; height: 6.25rem; }
    .metaL0 img { width: 5.5rem; height: 5.5rem; }
    .slikaIgra { max-height: 8rem; }
    .slikaDet { max-width: 9rem; max-height: 9rem; }
    .mjesto { width: 5.5rem; height: 2.75rem; }
    #nebo { height: 17rem; }
  }

  /* ---------------- sto sirina ne vidi ---------------- */

  /* Velik ekran kojim se upravlja prstom (tablet u pejzazu, dodirni monitor):
     po sirini je racunalo, po ergonomiji nije. Mete se vracaju na 44px. */
  @media (min-width: 1024px) and (pointer: coarse) {
    header nav a { min-height: max(2.75rem, 44px); display: inline-flex; align-items: center; }
    .brzaK, .malaP, .miniKart, .temaK, .fontK, .velicinaK { min-height: max(2.75rem, 44px); }
    #panelRj, #panelIgra, #panelInfo { width: 26rem; }
  }

  /* Bez misa nema lebdenja: podizanje kartice pod prstom je pomak koji se
     dogodi tek nakon dodira, dakle sum, a ne najava. */
  @media (hover: none) {
    .velikaPlocica:hover, .miniKart:hover, .extraKart:hover, .temaK:hover, .fontK:hover, .velicinaK:hover,
    .plocicaNula:hover, .cipSpoj:hover, .poljeSpoj:hover, .plocica:hover,
    .progCelija:hover, .tipkaNast:hover, .malaP:hover, .kartaVok:hover {
      transform: none; box-shadow: none;
    }
    .velikaPlocica:hover { box-shadow: 0 2px 8px rgba(0,0,0,.05); }
  }

  /* Mobitel u pejzazu: sirina je tabletska, visina nije. Sve sto jede visinu
     se skuplja, a donji list se vraca u bocni panel — 88dvh od 400px ekrana
     nije list nego cijeli ekran. */
  @media (orientation: landscape) and (max-height: 30rem) {
    header { position: relative; padding: 0.375rem 0.875rem; }
    #view { padding: 0.75rem 1.25rem 2rem; }
    #ploca { padding: 0.875rem 1rem; }
    .pitanjeText { margin-bottom: 0.625rem; }
    #panelRj, #panelIgra, #panelInfo {
      top: 0; left: auto; right: 0; bottom: 0;
      width: 22rem; max-width: 80vw; height: auto; max-height: none;
      transform: translateX(105%);
      border-left: 1px solid var(--rub); border-top: 0;
      border-radius: var(--rad-xl) 0 0 var(--rad-xl);
      box-shadow: -8px 0 30px rgba(0,0,0,.22);
    }
    #panelRj.otvoren, #panelIgra.otvoren, #panelInfo.otvoren { transform: translateX(0); }
    #panelRj .glavaRj, #panelIgra .glavaRj, #panelInfo .glavaRj { padding-top: 0.875rem; }
    #panelRj .glavaRj::before, #panelIgra .glavaRj::before, #panelInfo .glavaRj::before { content: none; }
  }
  /* ================= PREGLED CJELINE =================
     Klik na cjelinu prvo otvara kratak pregled (tekstovi u pregledi.js).
     Gore traka u boji vrste s naslovom, ispod dvije kartice (Overview / Cheat sheet)
     koje se listaju prstom ili dodirom na karticu, a Start je uvijek na dnu.
     Na mobitelu je to donji list, na većem ekranu prozor na sredini. Obje stranice
     leže u istoj traci, pa je prozor visok koliko viša i ne skače pri listanju. */
  #pregledSloj {
    position: fixed; inset: 0; z-index: 900; background: rgba(25,23,19,.45);
    display: flex; align-items: center; justify-content: center; padding: 1rem;
    animation: pregledSjena .18s ease;
  }
  @keyframes pregledSjena { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pregledGore { from { transform: translateY(100%); } to { transform: none; } }
  .pregled {
    --boja: var(--plava);
    --tint: var(--tiho);
    --tint: color-mix(in srgb, var(--boja) 11%, var(--card));
    --tintJaki: color-mix(in srgb, var(--boja) 22%, var(--card));
    background: var(--card); border-radius: var(--rad-xl); width: 100%; max-width: 27.5rem;
    max-height: 88vh; display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 24px 64px rgba(0,0,0,.28); animation: popIn .25s ease;
  }
  .pregledVrh { background: var(--tint); padding: 1rem 1.25rem 1rem; position: relative; }
  .pregledRed1 { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
  .pregledVrsta {
    display: inline-flex; align-items: center; gap: 0.375rem;
    font-size: var(--t-xs); font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--boja);
  }
  .pregledVrsta i { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--boja); }
  .pregledX {
    border: 0; background: var(--card); color: var(--muted); width: 2rem; height: 2rem; border-radius: 50%;
    font-size: 1.25rem; line-height: 1; cursor: pointer; font-family: inherit; flex: none;
    display: flex; align-items: center; justify-content: center;
  }
  .pregledX:hover { color: var(--ink); }
  .pregledVrh h2 { font-size: var(--t-2xl); line-height: 1.2; margin: 0.375rem 0 0.5rem; }
  .pregledCipovi { display: flex; flex-wrap: wrap; gap: 0.375rem; }
  .pregledCip {
    display: inline-flex; align-items: center; gap: 0.3125rem; background: var(--card);
    border-radius: 999px; padding: 0.1875rem 0.625rem; font-size: var(--t-xs); color: var(--muted); font-weight: 600;
  }
  .pregledCip .ikn { width: 0.9em; height: 0.9em; }
  .pregledCip.gotov { color: var(--zelena); }
  .pregledKartice { display: flex; gap: 0.25rem; margin: 0.875rem 1.25rem 0; padding: 0.1875rem; background: var(--tiho); border-radius: 999px; }
  .pregledKartice button {
    flex: 1; border: 0; background: none; border-radius: 999px; padding: 0.4375rem 0.5rem; cursor: pointer;
    font-family: inherit; font-size: var(--t-s); font-weight: 600; color: var(--muted);
    transition: background .2s, color .2s;
  }
  .pregledKartice button.na { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .pregledOkvir { overflow: hidden; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .pregledTrak { flex: 1 1 auto; min-height: 0; display: flex; align-items: stretch; transition: transform .3s cubic-bezier(.22,1,.36,1); touch-action: pan-y; }
  .pregledStr { flex: 0 0 100%; min-width: 0; padding: 0.875rem 1.25rem 0.25rem; overflow-y: auto; }
  .pregledPod { color: var(--muted); font-size: var(--t-m); margin: 0 0 0.75rem; }
  .pregledPr {
    border-left: 3px solid var(--boja); background: var(--tint); border-radius: 0 var(--rad-s) var(--rad-s) 0;
    padding: 0.5rem 0.75rem; margin: 0 0 0.5rem;
  }
  .pregledPr b { display: block; font-weight: 700; font-size: var(--t-l); line-height: 1.35; }
  .pregledPr span { display: block; color: var(--muted); font-size: var(--t-s); line-height: 1.35; }
  .pregledParovi { margin: 0 0 0.75rem; }
  .pregledPar {
    display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 0.75rem; row-gap: 0;
    padding: 0.4375rem 0; border-bottom: 1px solid var(--tiho);
  }
  .pregledPar:last-child { border-bottom: 0; }
  .pregledPar b { font-weight: 700; flex: 0 1 auto; min-width: 45%; }
  .pregledPar span { color: var(--muted); font-size: var(--t-s); flex: 1 1 auto; }
  .pregledMreza {
    border-collapse: separate; border-spacing: 0; width: 100%; table-layout: fixed;
    margin: 0 0 0.75rem; border-radius: var(--rad-m); overflow: hidden; background: var(--tiho);
  }
  .pregledMreza td { text-align: center; padding: 0.4375rem 0.25rem; font-weight: 700; font-size: var(--t-m); }
  .pregledMreza tr + tr td { border-top: 1px solid var(--card); }
  .pregledMreza tr.gl td { background: var(--tint); color: var(--boja); font-weight: 600; font-size: var(--t-s); }
  .pregledRijeci { display: flex; flex-wrap: wrap; gap: 0.375rem; margin: 0 0 0.75rem; }
  .pregledRijec {
    display: inline-flex; align-items: baseline; gap: 0.3125rem; border: 1px solid var(--rub);
    border-radius: 999px; padding: 0.25rem 0.6875rem; font-size: var(--t-s); background: var(--card);
  }
  .pregledRijec b { font-weight: 700; }
  .pregledRijec span { color: var(--muted); }
  .pregledNoga { padding: 0.5rem 1.25rem 1.25rem; }
  .pregled button.gumb.pregledStart {
    margin-top: 0; background: var(--boja); display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    min-height: 3rem; border-radius: var(--rad-l); font-size: var(--t-l);
  }
  .pregledStart svg { width: 0.85em; height: 0.85em; fill: currentColor; }
  @media (max-width: 639.98px) {
    #pregledSloj { align-items: flex-end; padding: 0; }
    .pregled {
      max-width: none; border-radius: 1.375rem 1.375rem 0 0; max-height: 92dvh;
      animation: pregledGore .3s cubic-bezier(.22,1,.36,1);
    }
    .pregledVrh { padding-top: 1.25rem; }
    .pregledVrh::before {
      content: ""; position: absolute; left: 50%; top: 0.4375rem; width: 2.25rem; height: 4px;
      margin-left: -1.125rem; border-radius: 2px; background: var(--tintJaki);
    }
    .pregledNoga { padding-bottom: calc(0.875rem + env(safe-area-inset-bottom, 0px)); }
    /* osnovni font na mobitelu je velik, pa je list gušći nego prozor na računalu */
    .pregledVrh { padding: 1.125rem 1rem 0.75rem; }
    .pregledVrh h2 { font-size: var(--t-xl); }
    .pregledX { width: 1.75rem; height: 1.75rem; font-size: 1.1rem; }
    .pregledKartice { margin: 0.625rem 1rem 0; }
    .pregledKartice button { padding: 0.3125rem 0.5rem; font-size: var(--t-xs); }
    .pregledStr { padding: 0.625rem 1rem 0.125rem; }
    .pregledPr { padding: 0.375rem 0.625rem; margin-bottom: 0.375rem; }
    .pregledPr b { font-size: var(--t-m); }
    .pregledPar { padding: 0.3125rem 0; font-size: var(--t-m); }
    .pregledMreza td { padding: 0.3125rem 0.25rem; font-size: var(--t-s); }
    .pregledRijec { padding: 0.1875rem 0.5625rem; font-size: var(--t-xs); }
    .pregledNoga { padding-left: 1rem; padding-right: 1rem; padding-top: 0.375rem; }
    .pregled button.gumb.pregledStart { min-height: 2.75rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    #pregledSloj, .pregled { animation: none; }
    .pregledTrak, .jedinice { transition: none; scroll-behavior: auto; }
  }

  /* ---- Lessons na mobitelu: jedna kartica po razini, listaju se vodoravno ----
     Gore traka s brojevima razina (skok na razinu), ispod kartice: naslov razine i
     pet redaka (Lesson … Test) s trakom napretka. Sljedeća kartica viri s desna. */
  .razineTraka {
    display: flex; gap: 0.375rem; overflow-x: auto; scrollbar-width: none;
    margin: 0 -1rem 0.75rem; padding: 0.125rem 1rem; scroll-padding: 0 1rem;
  }
  .razineTraka::-webkit-scrollbar { display: none; }
  .razineTraka button {
    flex: none; min-width: 2.25rem; height: 2.25rem; border-radius: 999px; border: 1px solid var(--rub);
    background: var(--card); color: var(--muted); font-family: var(--naslov); font-weight: 700;
    font-size: var(--t-s); cursor: pointer; padding: 0 0.5rem;
  }
  .razineTraka button.gotova { color: var(--zelena); border-color: var(--zelena); }
  .razineTraka button.zakljucana { background: var(--tiho); border-style: dashed; }
  .razineTraka button.na { background: var(--ink); color: var(--card); border-color: var(--ink); }
  .jedinice {

<body>
<div id="ucitavanje" role="status" aria-live="polite" aria-busy="true">
  <div class="ucitSadrzaj">
    <div class="ucitLogo" aria-hidden="true">C</div>
    <div class="ucitTraka" aria-hidden="true"><span></span></div>
    <span class="ucitSkriveno">Loading Croland…</span>
  </div>
  <div class="ucitPoruka">This is taking longer than usual.<br><button type="button" onclick="location.reload()">Reload</button></div>
</div>
<script>
  // Ekran za učitavanje. Mora stajati prije velikih skripti: one blokiraju crtanje.
  // Tema se postavlja odmah, iz zadnje viđene (postaviTemu je sprema), da boja ne
  // skoči kad stigne progres. faza(p) pomiče traku, gotovo() je gasi.
  (function () {
    var TEME = ['zagreb', 'jadran', 'maslina', 'tinta', 'sljiva'];
    try {
      var t = localStorage.getItem('croland.tema');
      if (TEME.indexOf(t) === -1) t = (JSON.parse(localStorage.getItem('croland-pocetni-izgled') || 'null') || {}).tema;
      if (TEME.indexOf(t) !== -1) document.body.setAttribute('data-tema', t);
    } catch (e) {}
    var el = document.getElementById('ucitavanje');
    var traka = el.querySelector('.ucitTraka span');
    var zavrseno = false, sat = null;
    function zapni(ms) {
      clearTimeout(sat);
      sat = setTimeout(function () { if (!zavrseno) el.classList.add('zapelo'); }, ms);
    }
    zapni(12000);
    // Greška prije prvog pogleda obično znači da ga neće ni biti — ne čeka se punih 12 s.
    window.addEventListener('error', function () { if (!zavrseno) zapni(4000); });
    window.CROLAND_UCITAVANJE = {

  function sljedeciCilj(tipZelja) {

    function ciljTipa(tip) {
      for (var r = 2; r <= MAX_RAZINA; r++) {
        if (igreCjeline(tip, r).length === 0) continue;
        if (otkljucano(tip, r)) continue;
        var val = VALUTA_TIPA[tip], p = prag(tip, r), ima = v[val], manjka = p - ima;
        if (manjka > 0) return { tip: tip, razina: r, val: val, prag: p, ima: ima, manjka: manjka };
        return null; // samo prva zaključana po tipu

  // ================= AI POMOĆ U LEBDEĆEM INFU (27.09.2026.) =================

  function aiUcitaj(k) {

  function otvoriInfo() {

  // ikona infa visi ispod ikone igrice i prati cijeli niz pri povlačenju

  // ================= LEBDECE IKONE NA MOBITELU: NOSENJE I TRI SIDRISTA =================
  // Na mobitelu se niz (rjecnik → igrica → info) nosi kao cjelina: uhvati se za
  // bilo koju od tri ikone i pusti bilo gdje. Pusten niz sjeda na najblize sidriste:
  //   desno  — okomiti stupac uz desni rub, na bilo kojoj visini (zadano: pri dnu)
  //   lijevo — isto, uz lijevi rub
  //   gore   — vodoravni red u zaglavlju, izmedu ☰ i brojaca bodova; znatno manji
  // Gore niz nije fixed nego absolute: zaglavlje na mobitelu nije ljepljivo, pa red
  // odlazi zajedno s njim, umjesto da bez podloge lebdi preko sadrzaja.
  // Mjesto se pamti u ovom pregledniku — dokle palac seze stvar je uredaja, ne racuna.
  var IK_IDS = ['lebdi', 'lebdiIgra', 'lebdiInfo'];
  var IK_KLJUC = 'croland-ikone';
  var ikMjesto = 'desno', ikY = null, ikVukao = false, ikMobAktivan = false, ikNosi = null,
      ikZadnjiBroj = 0, ikMeteEl = null, ikStranica = 0;
  try {
    var ikSp = JSON.parse(localStorage.getItem(IK_KLJUC) || 'null');
    if (ikSp && /^(desno|lijevo|gore)$/.test(ikSp.m)) {
      ikMjesto = ikSp.m; ikY = typeof ikSp.y === 'number' ? ikSp.y : null;
    }
  } catch (e) {}
  function spremiMjestoIkona() {
    try { localStorage.setItem(IK_KLJUC, JSON.stringify({ m: ikMjesto, y: ikY })); } catch (e) {}
  }
  function ikMobitel() { return window.innerWidth < 640; }
  function ikSirina() { return document.documentElement.clientWidth || window.innerWidth; }
  function ikVidljive() {
    return IK_IDS.map($).filter(function (e) { return e && e.classList.contains('vidi'); });
  }
  // Mjere niza za sidriste. Bocno je velika ikona rjVelicina (57 = 5% manje od
  // nekadasnjih 60), male 0.86 od nje. Gore mora stati u visinu ☰ (2rem), pa je
  // velika ~0.6 bocne, a razmaci su upola manji.
  function ikMjere(mj) {
    if (mj === 'gore') {
      var v = Math.min(34, Math.round(rjVelicina * 0.6));
      return { vel: v, mali: Math.round(v * 0.88), razmak: 6, red: true };
    }
    return { vel: rjVelicina, mali: Math.round(rjVelicina * 0.86), razmak: 10, red: false };
  }
  function ikDuljina(m, n) { return m.vel + (n - 1) * (m.mali + m.razmak); }
  // Polozaj svake ikone kad gornji lijevi kut niza stoji na (x, y).
  function ikRaspored(m, n, x, y) {
    var out = [], pomak = 0;
    for (var i = 0; i < n; i++) {
      var s = i === 0 ? m.vel : m.mali, bocno = (m.vel - s) / 2;
      out.push(m.red ? { x: x + pomak, y: y + bocno, s: s } : { x: x + bocno, y: y + pomak, s: s });
      pomak += s + m.razmak;

  }
  // Gornji lijevi kut niza na sidristu, u koordinatama prozora.
  function ikSidro(mj, n, yZelja) {
    var m = ikMjere(mj);
    if (mj === 'gore') {
      var r = $('ikoneGnijezdo').getBoundingClientRect();
      // sredina, ne lijevi rub: gnijezdo se siri iz sredine dok niz ulazi u njega
      return { x: r.left + r.width / 2 - ikDuljina(m, n) / 2, y: r.top + (r.height - m.vel) / 2 };
    }
    var najnize = Math.max(70, window.innerHeight - ikDuljina(m, n) - rezervaIspodIkona());
    var y = yZelja == null ? najnize : Math.min(Math.max(yZelja, 70), najnize);
    return { x: mj === 'lijevo' ? 18 : ikSirina() - 18 - m.vel, y: y };
  }
  function ikTiho(els, fn) {
    els.forEach(function (e) { e.classList.add('ikTiho'); });
    fn();
    void document.body.offsetWidth;
    els.forEach(function (e) { e.classList.remove('ikTiho'); });
  }
  // fixed ↔ absolute bez skoka: ista tocka na ekranu, samo drugi koordinatni sustav
  function ikPrebaci(els, gore) {
    var treba = els.filter(function (e) { return e.style.position !== (gore ? 'absolute' : 'fixed'); });
    if (!treba.length) return;
    var dy = window.pageYOffset || 0;
    ikTiho(treba, function () {
      treba.forEach(function (e) {
        var r = e.getBoundingClientRect();
        e.style.position = gore ? 'absolute' : 'fixed';
        e.style.right = 'auto';
        e.style.left = r.left + 'px';
        e.style.top = (r.top + (gore ? dy : 0)) + 'px';

    });
  }
  function ikPostavi(els, mj, x, y, gore) {
    var poz = ikRaspored(ikMjere(mj), els.length, x, y), dy = gore ? (window.pageYOffset || 0) : 0;
    els.forEach(function (e, i) {
      var p = poz[i];
      e.style.position = gore ? 'absolute' : 'fixed';
      e.style.right = 'auto';
      e.style.left = Math.round(p.x) + 'px';
      e.style.top = Math.round(p.y + dy) + 'px';
      e.style.width = p.s + 'px'; e.style.height = p.s + 'px';

  function rasporediIkoneMob() {

    ikZadnjiBroj = els.length;

  function ocistiIkoneMob() {
    if (!ikMobAktivan) return;

    document.body.classList.remove('ikMob', 'ikoneGore', 'ikoneNosi');

  // ---- mete: gdje niz moze sjesti ----
  function ikGoreDostupno() {
    var g = $('ikoneGnijezdo');
    return !!g && g.getBoundingClientRect().bottom > 0;
  }
  function ikMete(blizu, gy, n) {
    if (!ikMeteEl) {
      ikMeteEl = ['gore', 'lijevo', 'desno'].map(function (mj) {
        var d = document.createElement('div');
        d.className = 'ikMeta'; d.setAttribute('data-m', mj); d.setAttribute('aria-hidden', 'true');
        document.body.appendChild(d);
        return d;
      });
    }
    ikMeteEl.forEach(function (d) {
      var mj = d.getAttribute('data-m');
      if (blizu == null || (mj === 'gore' && !ikGoreDostupno())) { d.classList.remove('moze', 'blizu'); return; }
      var m = ikMjere(mj), duz = ikDuljina(m, n), s = ikSidro(mj, n, gy), pad = mj === 'gore' ? 3 : 5;
      var w = (m.red ? duz : m.vel) + 2 * pad, h = (m.red ? m.vel : duz) + 2 * pad;
      d.style.left = (s.x - pad) + 'px'; d.style.top = (s.y - pad) + 'px';
      d.style.width = w + 'px'; d.style.height = h + 'px';
      d.style.borderRadius = (Math.min(w, h) / 2) + 'px';

      d.classList.toggle('blizu', mj === blizu);

  }
  // Gore sjeda samo dok je prst iznad donjeg ruba zaglavlja; inace strana na kojoj je prst.
  function ikCiljZa(px, py) {
    if (ikGoreDostupno()) {
      var h = document.querySelector('header').getBoundingClientRect();
      if (py < h.bottom + 6) return 'gore';
    }
    return px < ikSirina() / 2 ? 'lijevo' : 'desno';
  }

  // ---- nosenje ----
  function ikHvataj(e) {
    if (!ikMobitel() || (e.button != null && e.button > 0)) return;
    var els = ikVidljive(), el = e.currentTarget, k = els.indexOf(el);
    if (k < 0) return;
    var r = el.getBoundingClientRect();
    ikNosi = { els: els, k: k, el: el, id: e.pointerId, sx: e.clientX, sy: e.clientY,
      fx: (e.clientX - r.left) / r.width, fy: (e.clientY - r.top) / r.height,
      pomaknut: false, mj: ikMjesto, y: null };

      ikPrebaci(n.els, false);

      document.body.classList.add('ikoneNosi');
      sakrijSavjetRj();
    }
    var mj = ikCiljZa(e.clientX, e.clientY), m = ikMjere(mj);

    var x = e.clientX - n.fx * p.s - p.x, y = e.clientY - n.fy * p.s - p.y;

  }
  function ikPusti(e) {
    var n = ikNosi; if (!n || e.pointerId !== n.id) return;
    ikNosi = null;
    if (!n.pomaknut) return;
    n.el.classList.remove('ikHvat');
    document.body.classList.remove('ikoneNosi');
    ikMete(null);
    ikMjesto = n.mj;
    if (n.mj !== 'gore' && n.y != null) ikY = n.y;
    rjRucno = true;
    spremiMjestoIkona();
    rasporediIkoneMob();
    // gnijezdo se jos siri kad niz tek ulazi gore — dotjeraj kad se smiri
    if (ikMjesto === 'gore') setTimeout(rasporediIkoneMob, 320);
    setTimeout(function () { ikVukao = false; }, 60);
    // tko je jednom sam pomaknuo niz, ne treba mu oblacic koji kaze da se moze
    var v = savjetiViđeni();
    if (!v.pomakIkona) { v.pomakIkona = 1; spremiProgress(); }
  }
  IK_IDS.forEach(function (id) {
    var e = $(id); if (!e) return;
    e.addEventListener('pointerdown', ikHvataj);
    e.addEventListener('pointermove', ikVuci);
    e.addEventListener('pointerup', ikPusti);
    e.addEventListener('pointercancel', ikPusti);
  });
  window.addEventListener('resize', function () {
    if (ikMobitel()) rasporediIkoneMob();
    else if (ikMobAktivan) postaviVelicinuIkone();
  });

  // ---- oblacic: niz se moze pomicati ----
  // Jednom u zivotu polaznika, na mobitelu, na cetvrtoj stranici vjezbe izvan
  // lekcije 0 (ondje vec postoji svoj savjet o povlacenju). Ako je u tom trenutku
  // na ekranu drugi oblacic ili otvoren panel, pokusa se na sljedecoj stranici.
  var SAVJET_POMAK = 'These icons are not stuck here. <strong>Drag any of them</strong> — ' +
    'to the left edge, the right edge, or up into the top bar.';
  function ponudiSavjetPomaka() {
    if (!ikMobitel() || (PROGRESS.savjeti && PROGRESS.savjeti.pomakIkona)) return;
    if (++ikStranica < 4) return;
    setTimeout(function () {
      if (gotovo || !ikMobitel() || ikNosi || !ikVidljive().length) return;
      var s = $('savjetRj');
      if (s && s.classList.contains('vidi')) return;
      if ($('panelRj').classList.contains('otvoren') || $('panelIgra').classList.contains('otvoren') ||
          $('panelInfo').classList.contains('otvoren')) return;
      jednomPokazi('pomakIkona', 'lebdi', SAVJET_POMAK, { trajanje: 9000 });
    }, 4200);
  }

  // ---- povremeno isticanje lebdećih ikona ----
  // Pri otvaranju svake nove stranice Lesson 0 sve tri ikone kratko pulsiraju, s malim
  // razmakom u vremenu, pa efekt putuje niz stupac kao val. Kljuc pamti zadnju stranicu
  // da se puls ne ponovi kad se ista vjezba prerenderira (npr. "Play again").
  var paziZadnja = null;
  function istakniLebdece(kljuc) {
    if (kljuc && kljuc === paziZadnja) return;
    paziZadnja = kljuc || null;
    ['lebdi', 'lebdiIgra', 'lebdiInfo'].forEach(function (id, i) {
      setTimeout(function () {
        var e = $(id);
        if (!e || !e.classList.contains('vidi')) return;
        if (document.body.classList.contains('izbornikOtvoren')) return;
        // ako je polaznik već otvorio neki panel, ne odvlači mu pažnju natrag na ikone
        if ($('panelRj').classList.contains('otvoren') ||
            $('panelIgra').classList.contains('otvoren') ||
            $('panelInfo').classList.contains('otvoren')) return;
        e.classList.remove('pazi');
        void e.offsetWidth;                       // restart animacije
        e.classList.add('pazi');
        setTimeout(function () { e.classList.remove('pazi'); }, 2400);
      }, 700 + i * 180);
    });
  }

  // ================= CEDULJICE (sticky notes) =================
  // Na racunalu stupac sadrzaja stoji u sredini, a s obje strane ostaje prazna
  // ploha. U njoj su cetiri mjesta za papiric: lijevo gore, lijevo dolje,
  // desno gore, desno dolje.
  //
  // Cetiri pravila drze cijelu mehaniku:
  //   1. Cedulja pripada MJESTU na SCENI. Scena je jedna lekcija (cjelina) ili
  //      jedna mini-igra; mjesto je jedno od cetiri. Izvan svoje scene je nema,
  //      a vracanjem na nju se vraca tocno ondje gdje je bila.
  //   2. Zivi u PROGRESS.postavke, dakle istim putem kao tema i pismo: server
  //      je izvor istine. Ostaje zauvijek — dok je se ne obrise.
  //   3. Prekidac u Options SAMO pokazuje i skriva. Gasenje ne brise nista;
  //      ponovno ukljucivanje vraca sve papirice ondje gdje su bili.
  //   4. Mjere racuna JS, ne CSS: sirina praznine ovisi o stupcu sadrzaja, o
  //      ekranu i o stupcu lebdecih ikona koji tu istu desnu prazninu dijeli s
  //      papiricima. Kad za papiric nema mjesta, njega ni ikone za dodavanje
  //      nema — umjesto stisnutog papirica koji se ne da citati.
  var CED_MJESTA = [
    { id: 'lg', strana: 'l', red: 'g' },
    { id: 'ld', strana: 'l', red: 'd' },
    { id: 'dg', strana: 'd', red: 'g' },
    { id: 'dd', strana: 'd', red: 'd' }
  ];
  var CED_PAPIRI = [
    { id: 'linije',     ime: 'Lined',   ik: 'linije',     naslov: T_('Lined paper') },
    { id: 'kvadratici', ime: 'Squared', ik: 'kvadratici', naslov: T_('Squared paper') },
    { id: 'prazno',     ime: 'Plain',   ik: 'prazno',     naslov: T_('Plain paper') }
  ];
  var CED_NAJVISE_ZNAKOVA = 2000;
  var CED_KLJUC = null;        // scena na kojoj smo, ili null ako papirici ovdje ne zive
  var CED_POSTAVLJA = false;   // traje li odabir mjesta
  var CED_PISMO = false;       // je li rukopisno pismo skinuto
  var CED_ZADNJE_MJERE = '';   // potpis zadnje geometrije, da se CSS ne prepisuje bez potrebe

  function ceduljeUkljucene() {
    return !!(PROGRESS.postavke && PROGRESS.postavke.cedulje);
  }
  function prebaciCedulje() {
    if (!PROGRESS.postavke) PROGRESS.postavke = {};
    PROGRESS.postavke.cedulje = ceduljeUkljucene() ? 0 : 1;
    spremiProgress();
    crtajCedulje();
    renderOptions();
  }
  window.prebaciCedulje = prebaciCedulje;

  // Rukopis se skida tek kad prvi papiric zatreba — tko prekidac nikad ne
  // upali, ne placa nista. Caveat: rukom pisano, malo brze, a jos citljivo,
  // i ima hrvatska slova (latin-ext).
  function ucitajRukopis() {
    if (CED_PISMO) return;
    CED_PISMO = true;
    var l = document.createElement('link');
    l.rel = 'stylesheet';
    l.href = 'https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&display=swap';
    document.head.appendChild(l);
  }

  // ---- spremiste ----
  // PROGRESS.postavke.ceduljice = { '<scena>': { '<mjesto>': {t, p, d} } }
  //   t = tekst, p = vrsta papira, d = kad je nastala
  function ceduljeSve() {
    if (!PROGRESS.postavke) PROGRESS.postavke = {};
    var c = PROGRESS.postavke.ceduljice;
    if (!c || typeof c !== 'object') { c = {}; PROGRESS.postavke.ceduljice = c; }
    return c;
  }
  // Ziva referenca kad scena ima papirice, prazan predmet kad ih nema — pisanje
  // po njemu onda nema kome nauditi.
  function ceduljeOve() {
    if (!CED_KLJUC) return {};
    var s = ceduljeSve()[CED_KLJUC];
    return (s && typeof s === 'object') ? s : {};
  }
  function papirCedulje(c) {
    for (var i = 0; i < CED_PAPIRI.length; i++) if (CED_PAPIRI[i].id === (c && c.p)) return c.p;
    return 'linije';
  }
  function slobodnihMjesta() {
    var moje = ceduljeOve(), n = 0;
    CED_MJESTA.forEach(function (m) { if (!moje[m.id]) n++; });
    return n;
  }
  function brojCedulja() {
    var sve = (PROGRESS.postavke && PROGRESS.postavke.ceduljice) || {}, n = 0;
    for (var scena in sve) {
      if (!sve.hasOwnProperty(scena) || !sve[scena] || typeof sve[scena] !== 'object') continue;
      for (var m in sve[scena]) if (sve[scena].hasOwnProperty(m)) n++;
    }
    return n;
  }

  // ---- geometrija ----
  function remPx() {
    return parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
  }
  // Sto u desnoj praznini zauzima stupac lebdecih ikona. Racuna se po najsirem
  // clanu niza (rjecnik), jer se stupac smije prevelicati — papiric mu nikad ne
  // smije doci pod ikonu.
  function sirinaStupcaIkona() {
    return 18 + rjVelicina;
  }
  // Traka abecede (Lesson 0) je fiksna pri dnu i visa je od donjih papirica —
  // isto pravilo kao za stupac ikona: mjeri se, ne pogada.
  function rezervaIspodCedulja() {
    var t = $('trakaAbc');
    if (t && t.classList.contains('vidi')) {
      var h = t.getBoundingClientRect().height;
      if (h > 0) return Math.round(h);
    }
    return 0;
  }
  // Jedino mjesto koje odlucuje IMA LI mjesta i KOLIKO ga je. Vraca true kad
  // papirici stanu; tada je na <body> klasa imaCedulje i CSS varijable su svjeze.
  function preslozCedulje() {
    var tijelo = document.body, sloj = $('ceduljeSloj');
    if (!sloj || !VIEW || !CED_KLJUC || !ceduljeUkljucene() ||
        window.innerWidth < 1024) {
      if (tijelo.classList.contains('imaCedulje')) { tijelo.classList.remove('imaCedulje'); CED_ZADNJE_MJERE = ''; }
      return false;
    }
    // Razmak do stupca sadrzaja NE prati pismo. Stupac je u rem, ekran nije —
    // svaki korak veceg sucelja siri stupac i uzima praznini s obje strane. Kad
    // bi i razmak rastao s njim, veci tekst bi papirice gusio dvaput.
    var rem = remPx(), jaz = Math.max(10, Math.min(16, Math.round(0.7 * rem)));
    var v = VIEW.getBoundingClientRect();
    // Ne innerWidth i ne clientWidth: oba broje i trak koji <html> drzi za klizac
    // (scrollbar-gutter: stable), a fiksni polozaj ga ne vidi. Sloj je fiksan kao i
    // papirici, pa je njegov okvir jedina mjera u kojoj oni doista stoje.
    var okvirSloja = sloj.getBoundingClientRect();
    var sirEkran = okvirSloja.width;
    var visEkran = okvirSloja.height;
    // Prvo visina, jer o njoj visi i sirina: nagnut papir strsi iz svog okvira.
    var glava = document.querySelector('header');
    var gore = (glava ? Math.round(glava.getBoundingClientRect().height) : Math.round(3.5 * rem)) + jaz;
    var dolje = jaz + rezervaIspodCedulja();
    var red = Math.max(12, Math.round(1.7 * rem));
    var okvir = Math.round(2 * rem) + 2;                 // papir oko teksta: razmaci, rub, alatka
    var pretinac = Math.floor((visEkran - gore - dolje - jaz) / 2);
    // Visina je cijeli broj redaka, inace crtovlje na dnu prepolovi zadnju crtu.
    var redaka = Math.min(7, Math.floor((pretinac - okvir) / red));
    // Svaki papir stoji pod malim kutom (do 0.8 stupnja), pa mu uglovi vire iz
    // okvira za otprilike pola visine puta sinus kuta. Bez tog dodatka bi gornji
    // desni papir uglom dodirnuo ikonu rjecnika.
    var strsi = Math.ceil((redaka * red + okvir) * 0.008);
    // Papiric stoji uz sam stupac sadrzaja i siri se prema rubu ekrana. Sirina
    // je ista na obje strane (papirici su par, ne dva razna) pa je mjera uza od dvije.
    var sir = Math.floor(Math.min(13 * rem,
      v.left - 2 * jaz - strsi,
      sirEkran - v.right - jaz - sirinaStupcaIkona() - strsi));
    // Uzi od 8rem ili nizi od tri retka nije papiric nego trak na kojem se svaka
    // druga rijec prelama. Tada je posteno reci da mjesta nema. Tko ga na uzem
    // ekranu ipak zeli, ima Interface size: manje sucelje = siri stupac praznine.
    if (sir < Math.round(8 * rem) || redaka < 3) {
      if (tijelo.classList.contains('imaCedulje')) { tijelo.classList.remove('imaCedulje'); CED_ZADNJE_MJERE = ''; }
      return false;
    }
    var potpis = [sir, Math.round(v.left), Math.round(v.right), gore, dolje, red, redaka].join('|');
    tijelo.classList.add('imaCedulje');
    if (potpis === CED_ZADNJE_MJERE) return true;
    CED_ZADNJE_MJERE = potpis;
    var st = document.documentElement.style;
    st.setProperty('--cedSir', sir + 'px');
    st.setProperty('--cedL', Math.round(v.left - jaz - sir) + 'px');
    st.setProperty('--cedD', Math.round(v.right + jaz) + 'px');
    st.setProperty('--cedG', gore + 'px');
    st.setProperty('--cedDo', dolje + 'px');
    st.setProperty('--cedRed', red + 'px');
    st.setProperty('--cedVis', (redaka * red) + 'px');
    return true;
  }

  // ---- ikona ----
  // Cetvrta u nizu lebdecih ikona kad je niz tu, na celu kad je sama (mini-igra
  // nema rjecnik) — nikad ne visi u zraku ispod praznine gdje su niz cinile.
  // Stanje "ima li mjesta" cita s <body>, ne mjeri ga sama: ovu funkciju zove i
  // povlacenje stupca ikona, dakle i po 60 puta u sekundi, a povlacenje geometriju
  // papirica ne mijenja. Mjeri preslozCedulje(), i to samo kad se nesto stvarno pomakne.
  function postaviIkonuCedulja() {
    var b = $('lebdiCed'); if (!b) return;
    var moze = document.body.classList.contains('imaCedulje');
    b.classList.toggle('vidi', moze);
    if (!moze) { if (CED_POSTAVLJA) prekiniPostavljanje(); return; }
    var v = Math.round(rjVelicina * 0.86);
    var uNizu = !!($('lebdi') && $('lebdi').classList.contains('vidi'));
    b.style.width = v + 'px'; b.style.height = v + 'px';
    b.style.fontSize = (v * 0.46) + 'px';
    b.style.top = (uNizu ? rjTop + rjVelicina + 10 + v + 10 + v + 10 : rjTop) + 'px';
    b.style.right = (18 + (rjVelicina - v) / 2) + 'px';
    b.title = slobodnihMjesta() ? 'Add a sticky note' : 'All four note spots are taken';
  }

  // ---- crtanje ----
  // Puno precrtavanje sloja. Tipkanje ga NE zove (izgubio bi se pokazivac u
  // tekstu) — ono mijenja samo zapis; promjena papira mijenja samo atribut.
  function crtajCedulje() {
    var sloj = $('ceduljeSloj'); if (!sloj) return;
    if (!CED_KLJUC || !ceduljeUkljucene()) {
      prekiniPostavljanje();
      sloj.innerHTML = '';
      preslozCedulje();
      postaviIkonuCedulja();
      return;
    }
    var moje = ceduljeOve(), imaKoja = false, html = '';
    CED_MJESTA.forEach(function (m) {
      var c = moje[m.id];
      html += '<div class="cedMjesto" data-slot="' + m.id + '" data-strana="' + m.strana +
        '" data-red="' + m.red + '">';
      if (c) {
        imaKoja = true;
        var papir = papirCedulje(c);
        html += '<div class="cedulja" data-papir="' + papir + '">' +
          '<textarea class="cedText" data-slot="' + m.id + '" spellcheck="false" ' +
            'maxlength="' + CED_NAJVISE_ZNAKOVA + '" aria-label="Sticky note" ' +
            'placeholder="Write here…">' + esc(c.t || '') + '</textarea>' +
          '<div class="cedAlat">' +
          CED_PAPIRI.map(function (p) {
            return '<button type="button" data-papir="' + p.id + '" data-slot="' + m.id +
              '" aria-pressed="' + (papir === p.id ? 'true' : 'false') +
              '" title="' + p.naslov + '">' + IK(p.ik) + '</button>';
          }).join('') +
          '<button type="button" class="cedBrisi" data-slot="' + m.id +
            '" title="Delete this note">✕</button>' +
          '</div></div>';
      } else {
        html += '<button type="button" class="cedPrazno" data-slot="' + m.id +
          '"><span class="plusC">+</span><span>sticky note here</span></button>';
      }
      html += '</div>';
    });
    sloj.innerHTML = html;
    if (imaKoja) ucitajRukopis();
    preslozCedulje();
    postaviIkonuCedulja();
  }

  // Scena se postavlja iz renderUnit i renderMiniIgra, a brise u idi() prije
  // svakog drugog prikaza. Ista scena se ne precrtava: prelistavanje vjezbi
  // unutar iste cjeline ostavlja papirice tocno kakvi su bili.
  function postaviScenuCedulja(kljuc) {
    kljuc = kljuc || null;
    if (kljuc === CED_KLJUC) { preslozCedulje(); postaviIkonuCedulja(); return; }
    CED_KLJUC = kljuc;
    prekiniPostavljanje();
    crtajCedulje();
  }

  // ---- odabir mjesta ----
  function pocniPostavljanje() {
    if (!preslozCedulje()) return;
    if (!slobodnihMjesta()) { tresiCedulje(); return; }
    CED_POSTAVLJA = true;
    document.body.classList.add('ceduljePostavljanje');
    var b = $('lebdiCed'); if (b) b.classList.add('postavlja');
  }
  function prekiniPostavljanje() {
    if (!CED_POSTAVLJA) return;
    CED_POSTAVLJA = false;
    document.body.classList.remove('ceduljePostavljanje');
    var b = $('lebdiCed'); if (b) b.classList.remove('postavlja');
  }
  function tresiCedulje() {
    Array.prototype.forEach.call(document.querySelectorAll('#ceduljeSloj .cedMjesto'), function (m) {
      if (!m.querySelector('.cedulja')) return;
      m.classList.remove('puna');
      void m.offsetWidth;                       // restart animacije
      m.classList.add('puna');
      setTimeout(function () { m.classList.remove('puna'); }, 400);
    });
  }

  // ---- zivot jednog papirica ----
  function stvoriCedulju(slot) {
    if (!CED_KLJUC || !slot) return;
    var sve = ceduljeSve();
    if (!sve[CED_KLJUC] || typeof sve[CED_KLJUC] !== 'object') sve[CED_KLJUC] = {};
    if (sve[CED_KLJUC][slot]) return;
    sve[CED_KLJUC][slot] = { t: '', p: 'linije', d: Date.now() };
    spremiProgress(true);
    prekiniPostavljanje();
    ucitajRukopis();
    crtajCedulje();
    // Papir je stvoren da se na njega pise — pokazivac ide odmah u njega.
    var t = document.querySelector('#ceduljeSloj .cedMjesto[data-slot="' + slot + '"] .cedText');
    if (t) t.focus();
  }
  // Tipkanje ide u zapis, a spremiProgress() bez "odmah" sabija upise u jednu
  // sekundu — dakle jedan zapis na server po recenici, ne po slovu.
  function upisiCedulju(slot, tekst) {
    var moje = ceduljeOve();
    if (!moje[slot]) return;
    moje[slot].t = String(tekst == null ? '' : tekst).slice(0, CED_NAJVISE_ZNAKOVA);
    spremiProgress();
  }
  // Papir se mijenja atributom, bez precrtavanja: tekst u tijeku ne smije
  // izgubiti pokazivac zato sto je nekome zatrebalo crtovlje.
  function promijeniPapir(slot, papir) {
    var moje = ceduljeOve();
    if (!moje[slot]) return;
    var poznat = false;
    for (var i = 0; i < CED_PAPIRI.length; i++) if (CED_PAPIRI[i].id === papir) poznat = true;
    if (!poznat) return;
    moje[slot].p = papir;
    spremiProgress();
    var m = document.querySelector('#ceduljeSloj .cedMjesto[data-slot="' + slot + '"]');
    if (!m) return;
    var c = m.querySelector('.cedulja');
    if (c) c.setAttribute('data-papir', papir);
    Array.prototype.forEach.call(m.querySelectorAll('.cedAlat button[data-papir]'), function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-papir') === papir ? 'true' : 'false');
    });
  }
  function pitajBrisanje(slot) {
    var moje = ceduljeOve();
    if (!moje[slot]) return;
    // Prazan papir nema sto izgubiti — odlazi bez pitanja.
    if (!String(moje[slot].t || '').trim()) { brisiCedulju(slot); return; }
    potvrdi('Delete this note?', 'What is written on it is gone for good. ' +
      'The other notes stay where they are.', function () { brisiCedulju(slot); });
  }
  function brisiCedulju(slot) {
    var sve = ceduljeSve(), scena = sve[CED_KLJUC];
    if (!scena || !scena[slot]) return;
    delete scena[slot];
    // Scena bez ijednog papirica ne ostaje kao prazan zapis u postavkama.
    var prazna = true;
    for (var k in scena) if (scena.hasOwnProperty(k)) prazna = false;
    if (prazna) delete sve[CED_KLJUC];
    spremiProgress(true);
    crtajCedulje();
  }

  // ---- mehanika 1: spajanje (crtež ↔ riječ) ----
  function takeSpajanje() {
    var stavke = igra.stavke.slice(0, 12);
    var rijeseno = 0, promasaj = 0;
    setStat('Matched: 0/' + stavke.length, '');
    predaja = function () {
      return { s: 'Matched: ' + rijeseno + '/' + stavke.length, pct: rijeseno / stavke.length };
    };
    var s = $('sadrzaj'); s.innerHTML = '';
    var mreza = document.createElement('div'); mreza.className = 'mrezaSpoj'; s.appendChild(mreza);
    var traka = document.createElement('div'); traka.className = 'cipovi'; s.appendChild(traka);

    var polja = {}, cipovi = {}, odabranaSlika = null, odabraniCip = null;

    promijesaj(stavke).forEach(function (st) {
      var p = document.createElement('div'); p.className = 'poljeSpoj';
      var im = elSlikaIgre(st[0], 'slikaIgra');
      if (im) { im.style.cssText = 'width:100%;aspect-ratio:1;object-fit:contain;display:block;pointer-events:none;'; p.appendChild(im); }

      var n = document.createElement('div'); n.className = 'natpis'; p.appendChild(n);
      p.onclick = function () { kliknuoSliku(st, p); };

    promijesaj(stavke).forEach(function (st) {
      var c = document.createElement('div'); c.className = 'cipSpoj'; c.textContent = st[0];
      c.onclick = function () { kliknuoCip(st, c); };

    function ocisti() {
      if (odabranaSlika) polja[odabranaSlika[0]].classList.remove('odabran');
      if (odabraniCip) cipovi[odabraniCip[0]].classList.remove('odabran');

    function pokusaj(slika, rijec) {

  // ---- mehanika 2: baloni ----
  function takeBaloni() {
    var fond = igra.stavke;
    var red = uzorak(fond, Math.min(6, fond.length)), i = 0, ziv = true, baloni = [];
    setStat('Popped: 0/' + red.length, '');

    var nebo = document.createElement('div'); nebo.id = 'nebo'; s.appendChild(nebo);

    function novaMeta() {
      if (i >= red.length) { setStat('Popped: ' + i + '/' + red.length, ''); ziv = false; kraj('Popped all ' + red.length, 1); return; }
      meta.innerHTML = '';
      var im = elSlikaIgre(red[i][0], 'slikaIgra');
      if (im) { im.style.cssText = 'width:118px;height:118px;object-fit:contain;'; meta.appendChild(im); }
      else meta.textContent = red[i][1] || '';
      setStat('Popped: ' + i + '/' + red.length, '');
    }
    function pusti(st) {
      var b = document.createElement('div'); b.className = 'balon'; b.textContent = st[0];
      b.style.left = (6 + Math.random() * 62) + '%';
      b.style.top = '105%';
      b.onclick = function () {
        if (gotovo || !ziv || b.classList.contains('pukao')) return;
        if (st[0] === red[i][0]) {
          b.classList.add('pukao');

          i++; novaMeta();
        } else {
          zabiljeziGresku();

          b.classList.add('tresi');
          setTimeout(function () { b.classList.remove('tresi'); }, 340);
        }
      };
      nebo.appendChild(b);
      baloni.push({ el: b, y: 105, v: 0.11 + Math.random() * 0.07, st: st });
    }
    var zadnji = 0;
    function petlja(ts) {
      if (!document.body.contains(nebo)) return;
      for (var k = baloni.length - 1; k >= 0; k--) {
        baloni[k].y -= baloni[k].v;
        baloni[k].el.style.top = baloni[k].y + '%';
        if (baloni[k].y < -18) { baloni[k].el.remove(); baloni.splice(k, 1); }
      }
      if (ziv && !gotovo && ts - zadnji > 900) {
        zadnji = ts;
        var imaTocan = false;
        baloni.forEach(function (o) { if (o.st[0] === red[i][0] && o.y > 5) imaTocan = true; });
        pusti(imaTocan ? fond[Math.floor(Math.random() * fond.length)] : red[i]);

    }

  // ---- mehanika 3: slova (anagram s digrafima) ----
  function takeSlova() {
    var zadaci = igra.stavke.slice();
    var n = 0, tocnih = 0;
    setStat('Words: 0/' + zadaci.length, '');
    predaja = function () { return { s: 'Words: ' + tocnih + '/' + zadaci.length, pct: tocnih / zadaci.length }; };

    function krug() {
      if (n >= zadaci.length) { kraj('Built ' + tocnih + '/' + zadaci.length, tocnih / zadaci.length); return; }
      var rijec = zadaci[n][0];
      var dijelovi = grafemi(rijec);
      // mamci: rastavljeni digrafi iz same riječi (npr. nj -> n, j)
      var mamci = [];
      dijelovi.forEach(function (d) {
        if (DIGRAFI.indexOf(d) >= 0) { mamci.push(d.charAt(0)); mamci.push(d.charAt(1)); }

      else meta.textContent = zadaci[n][1] || '';

      var slag = document.createElement('div'); slag.className = 'slagaliste'; s.appendChild(slag);
      var plocice = document.createElement('div'); plocice.className = 'plocice'; s.appendChild(plocice);

      var mjesta = [], uneseno = [];
      dijelovi.forEach(function () {
        var m = document.createElement('div'); m.className = 'slagPrazno'; slag.appendChild(m); mjesta.push(m);
      });
      promijesaj(dijelovi.concat(mamci)).forEach(function (d) {
        var p = document.createElement('div'); p.className = 'plocica'; p.textContent = d;
        p.onclick = function () {

      }
      function provjeri() {
        var slozeno = uneseno.map(function (x) { return x.d; }).join('');
        if (slozeno === String(rijec).toLowerCase()) {
          mjesta.forEach(function (m) { m.style.borderBottomColor = 'var(--zelena)'; });
          sviraj(rijec); otkljucajSlovo(rijec);

        } else {

  // ---- mehanika 4: pamti pa piši ----
  function takePamti() {
    var krugova = Math.min(3, Math.floor(igra.stavke.length / 3)) || 1;
    var n = 0, tocnih = 0, ukupno = krugova * 3;
    setStat('Correct: 0/' + ukupno, '');
    predaja = function () { return { s: 'Correct: ' + tocnih + '/' + ukupno, pct: tocnih / ukupno }; };

    // Koliko se gleda i koliko traje nestanak. Prije je bilo 2.6 s i rez —
    // slike su nestajale bez najave, pa se dobar dio tog vremena gledalo u
    // prazno mjesto na kojem su maloprije bile. Sada: sat koji se vidi, pet
    // sekundi gledanja i nestanak koji i sam traje, da ga oko stigne ispratiti.
    var POGLED = 5000, NESTANAK = 900;

    function krug() {
      if (n >= krugova) { kraj('Correct: ' + tocnih + '/' + ukupno, tocnih / ukupno); return; }
      var trojka = uzorak(igra.stavke, 3);
      var s = $('sadrzaj'); s.innerHTML = '';
      var naslov = document.createElement('div');
      naslov.style.cssText = 'text-align:center;font-weight:600;margin-bottom:10px';
      naslov.textContent = 'Remember these three — round ' + (n + 1) + ' of ' + krugova;
      s.appendChild(naslov);

      var odbr = document.createElement('div'); odbr.className = 'odbrojavanje';
      var pijesak = document.createElement('span'); pijesak.className = 'pijesak';
      var rijec = document.createElement('span');
      odbr.appendChild(pijesak); odbr.appendChild(rijec); s.appendChild(odbr);
      var trak = document.createElement('div'); trak.className = 'odbrojavanjeTrak';
      var trakPun = document.createElement('div'); trak.appendChild(trakPun); s.appendChild(trak);

      var b = document.createElement('div'); b.className = 'bljesak'; s.appendChild(b);
      trojka.forEach(function (st) {
        var d = document.createElement('div'); d.className = 'stavkaB';
        var im = elSlikaIgre(st[0], 'slikaIgra');
        if (im) { im.style.cssText = 'width:126px;height:126px;object-fit:contain;'; d.appendChild(im); }
        // rijec stoji i kad slike ima: pamti se rijec, slika je samo kuka za nju
        var r = document.createElement('div'); r.className = 'rijecB'; r.textContent = st[0];
        d.appendChild(r);
        b.appendChild(d);
      });

      var pocetak = Date.now();
      function tik() {
        if (gotovo || !document.body.contains(s)) { if (timer) { clearInterval(timer); timer = null; } return; }
        var proteklo = Date.now() - pocetak;
        var ostalo = Math.max(0, POGLED - proteklo);
        var sek = Math.ceil(ostalo / 1000);
        pijesak.textContent = sek > 0 ? String(sek) : '—';
        rijec.textContent = sek > 1 ? 'they disappear in' : sek === 1 ? 'disappearing…' : 'gone — now rebuild the order';
        odbr.classList.toggle('zadnje', sek <= 2 && sek > 0);
        trakPun.style.width = Math.round(ostalo / POGLED * 100) + '%';
        // nestanak krece prije isteka, da se stigne odviti dok sat jos tece
        if (ostalo <= NESTANAK) b.classList.add('nestaje');
        if (ostalo <= 0) { clearInterval(timer); timer = null; }
      }
      tik();
      timer = setInterval(tik, 100);
      setTimeout(function () {
        if (timer) { clearInterval(timer); timer = null; }
        if (gotovo || !document.body.contains(s)) return;
        pitaj(trojka);
      }, POGLED + 350);
    }
    function pitaj(trojka) {
      var s = $('sadrzaj'); s.innerHTML = '';
      var naslov = document.createElement('div');
      naslov.style.cssText = 'text-align:center;font-weight:600;margin-bottom:10px';
      naslov.textContent = 'Which three, in that order?';
      s.appendChild(naslov);
      var red = document.createElement('div'); red.className = 'redoslijed'; s.appendChild(red);
      var mjesta = [];
      for (var i = 0; i < 3; i++) {
        var m = document.createElement('div'); m.className = 'mjesto'; red.appendChild(m); mjesta.push(m);
      }
      var ostatak = igra.stavke.filter(function (st) {
        for (var j = 0; j < trojka.length; j++) if (trojka[j][0] === st[0]) return false;
        return true;
      });
      var ponuda = promijesaj(trojka.concat(uzorak(ostatak, 6)));
      var uneseno = [];
      var traka = document.createElement('div'); traka.className = 'cipovi'; s.appendChild(traka);
      ponuda.forEach(function (st) {
        var c = document.createElement('div'); c.className = 'cipSpoj'; c.textContent = st[0];
        c.onclick = function () {
          if (gotovo || uneseno.length >= 3 || c.classList.contains('potroseno')) return;
          uneseno.push(st); c.classList.add('potroseno');
          mjesta[uneseno.length - 1].textContent = st[0];
          mjesta[uneseno.length - 1].classList.add('pun');
          if (uneseno.length === 3) provjeri();
        };
        traka.appendChild(c);
      });
      function provjeri() {
        var promasio = false;
        uneseno.forEach(function (st, i) {
          var ok = st[0] === trojka[i][0];
          mjesta[i].classList.add(ok ? 'tocno' : 'krivo');
          if (ok) { tocnih++; sviraj(st[0]); otkljucajSlovo(st[0]); }
          else promasio = true;
        });
        if (promasio) zabiljeziGresku();
        setStat('Correct: ' + tocnih + '/' + ukupno, '');
        setTimeout(function () { if (!gotovo) { n++; krug(); } }, 1400);
      }
    }
    krug();
  }

  var VELICINE = [

  // Literata ima veću x-visinu od ostalih pisama pa se na istoj nominalnoj

    v.title = 'Interface size: ' + VELICINE[i].ime + (v.disabled ? '' : ' → ' + VELICINE[i + 1].ime);

  function renderOptions() {

    html += '<div class="postavkeDva" style="margin-top:16px">';

  // ================= VIEWOVI =================
  // posljednja navigacija — omogućuje ponovni idi() čim SESSION_SPREMNA postane true
  var ZADNJI_VIEW = null;
  function renderUcitavanje() {
    VIEW.innerHTML = '<div style="padding:40px;text-align:center;color:var(--muted)">Checking your session…</div>';
  }
  function idi(view, arg1, arg2, arg3) {
    ZADNJI_VIEW = { view: view, arg1: arg1, arg2: arg2, arg3: arg3 };
    if (PREGLED) zatvoriPregled();
    if (IGRA_PROZOR) zatvoriIgraProzor(true);
    oznaciNav(view);
    zatvoriIzbornik();
    var jeNulaCilj = (view === 'unit' && arg1 === L0_TIP && arg2 === L0_RAZINA);
    // Lesson 0 je otvorena svima. Svaka druga cjelina i svaka mini-igra traže pristup:
    // barem račun (razina 1, daily/weekly, mini-igre), a razina 2+ traži pretplatu.
    if (view === 'unit' && !jeNulaCilj) {
      var pristup = imaPristup(arg1, arg2);
      if (pristup === 'ucitavanje') { renderUcitavanje(); return; }
      if (pristup === 'needsAccount') { prikaziModalPrijava({ view: view, arg1: arg1, arg2: arg2, arg3: arg3 }); return; }
      if (pristup === 'needsSubscription') { prikaziModalPretplata(); return; }
    } else if (view === 'miniIgra' || view === 'weekly' || view === 'dailySlika') {
      var pristupM = imaPristup('MiniGame', 0);
      if (pristupM === 'ucitavanje') { renderUcitavanje(); return; }
      if (pristupM === 'needsAccount') { prikaziModalPrijava({ view: view, arg1: arg1, arg2: arg2, arg3: arg3 }); return; }
    } else if (view === 'progress') {
      // Progress trazi racun, ali NIKAD pretplatu: i onaj tko placa drugima, i onaj
      // tko je odigrao jednu vjezbu, vide sve sto o sebi imaju.
      if (!SESSION_SPREMNA) { renderUcitavanje(); return; }
      if (!imaRacun()) { prikaziModalPrijava({ view: view }); return; }
    } else if (view === 'account') {
      // Gost vidi cjenik i upute za prijavu; sve radnje (kupnja, kod) traže prijavu.
      if (!SESSION_SPREMNA) { renderUcitavanje(); return; }
    }
    if (timer) { clearInterval(timer); timer = null; }
    // svaki odlazak drugamo gasi test u tijeku — sat ne smije trčati u pozadini
    testPrekini();
    if (view !== 'miniIgra') miniSatStop();
    window.scrollTo(0, 0);
    sakrijSavjetRj();
    // Papirici pripadaju jednoj lekciji ili jednoj mini-igri. renderUnit i
    // renderMiniIgra ih vracaju na scenu; svaka druga stranica ostaje bez njih.
    postaviScenuCedulja(null);

    // traka abecede i lebdeći rječnik žive samo unutar vježbi
    if (view !== 'unit') { trakaVidljiva(false); rjecnikVidljiv(false); slikeVjezbe = false; }
    if (view === 'main') renderMain();
    else if (view === 'lessons') renderLessons();
    else if (view === 'dictionary') renderDictionary();
    else if (view === 'dictTest') renderDictTest();
    else if (view === 'mini') renderMini(arg1);
    else if (view === 'miniIgra') renderMiniIgra(arg1);
    else if (view === 'daily') renderDaily();
    else if (view === 'weekly') renderWeekly(arg1);
    else if (view === 'dailySlika') renderDailySlika(arg1);
    else if (view === 'account') renderAccount();
    else if (view === 'progress') renderProgress();
    else if (view === 'options') renderOptions();
    else if (view === 'unit') renderUnit(arg1, arg2, arg3 || 0);
    osvjeziHeader();
  }
  window.idi = idi;

  // ================= NASLOVNICA =================
  // Dva spila gore (nastavi / kreni novo), tihe police ispod. Svaki tekst ovisi o
  // stanju: prazan spil se ne crta, tocke i strelice se ne crtaju za jedan slajd,
  // Lesson 0 nestaje kad su sva slova skupljena.

  function kljucCjeline(tip, razina) {
    var igre = igreCjeline(tip, razina);
    return (igre[0] && igre[0].cjelina) || (tip + ' ' + razina);
  }
  function zapisCjeline(tip, razina) {
    var igre = igreCjeline(tip, razina);
    var maks = 0, osv = 0;
    igre.forEach(function (g) { maks += g.bodovi; osv += najbolji(g); });
    var pok = (PROGRESS.pokrenute || {})[(igre[0] && igre[0].cjelina) || (tip + ' ' + razina)] || 0;
    return {
      tip: tip, razina: razina, broj: igre.length, maks: maks, osv: osv,
      naslov: (igre[0] && igre[0].cjelinaNaslov) || (tip + ' ' + razina),
      pct: maks ? Math.round(osv / maks * 100) : 0,
      otklj: otkljucano(tip, razina),
      pokrenuta: (typeof pok === 'number' ? pok : 1)
    };
  }
  // Ista putanja kojom ide i mreza u Lessons: razina po razina, unutar nje po tipovima.
  function prolazCjelina(uzmi, granica) {
    var out = [];
    for (var r = 1; r <= MAX_RAZINA; r++) {
      for (var i = 0; i < TIPOVI.length; i++) {
        if (igreCjeline(TIPOVI[i], r).length === 0) continue;
        var z = zapisCjeline(TIPOVI[i], r);
        if (z.maks <= 0 || !uzmi(z)) continue;
        out.push(z);
        if (granica && out.length >= granica) return out;
      }
    }
    return out;
  }
  function jeZapoceta(z) { return z.otklj && z.osv > 0 && z.osv < z.maks; }
  function jeNetaknuta(z) { return z.otklj && z.osv === 0; }
  // "Posljednja zapoceta" ide po vremenu upisa, ne po mjestu u mrezi.
  function zapocete(n) {
    var sve = prolazCjelina(jeZapoceta, 0);
    sve.sort(function (a, b) { return b.pokrenuta - a.pokrenuta; });
    return sve.slice(0, n || 3);
  }
  function netaknute(n) { return prolazCjelina(jeNetaknuta, n || 3); }
  function prvaZakljucana() { return prolazCjelina(function (z) { return !z.otklj; }, 1)[0] || null; }
  function imaNapretka() { return prolazCjelina(function (z) { return z.osv > 0; }, 1).length > 0; }

  // koliko jos treba do otkljucavanja te cjeline, izrazeno u njezinoj valuti
  function manjkaZa(z) {
    var val = VALUTA_TIPA[z.tip];
    if (!val) return null;
    var p = prag(z.tip, z.razina), ima = valute()[val] || 0;
    return { val: val, prag: p, ima: ima, treba: Math.max(0, p - ima),
      pct: p > 0 ? Math.min(100, Math.round(ima / p * 100)) : 100 };
  }

  // najniza zakljucana razina te vrste i koliko jos treba do nje
  function sljedeciPrag(tip) {
    for (var r = 2; r <= 20; r++) {
      if (!maksCjeline(tip, r)) continue;
      if (!otkljucano(tip, r)) {
        var igre = igreCjeline(tip, r);
        return { razina: r, prag: prag(tip, r),
          naslov: (igre[0] && igre[0].cjelinaNaslov) || (tip + ' ' + r) };
      }
    }
    return null;
  }

  // ---- gradivni dijelovi naslovnice ----
  function slajdHtml(z, vrsta) {
    var h = '<div class="slajd" role="button" tabindex="0" data-cilj="unit:' + z.tip + ':' + z.razina + '" ' +
      'title="' + esc(z.naslov + ' — ' + z.tip + ' ' + z.razina) + '">' +
      '<div class="tipS">' + esc(z.tip + ' ' + z.razina) + '</div>' +
      '<div class="imeS">' + esc(z.naslov) + '</div>';
    if (vrsta === 'novo') {
      h += '<div class="metaS">' + z.broj + ' exercise' + (z.broj === 1 ? '' : 's') +
        ' · ' + z.maks + ' points waiting</div>' +
        '<div class="barS"><i data-pct="0"></i></div>' +
        '<div class="podBar"><span>nothing done here yet</span></div>' +
        '<div class="ctaS">Start</div>';
    } else {
      h += '<div class="metaS">' + z.osv + ' of ' + z.maks + ' points earned</div>' +
        '<div class="barS"><i data-pct="' + z.pct + '"></i></div>' +
        '<div class="podBar"><span>done so far</span><b>' + z.pct + '%</b></div>' +
        '<div class="ctaS">Continue</div>';
    }
    return h + '</div>';

  // Kad nema nijedne netaknute otkljucane cjeline, spil "novo" pokazuje prvu koja ceka bodove.

    brze.push(brzaKarticaHtml('view:mini:igre', IK('igra'), 'Mini games',

        '</div></div>' +
      '<div class="malaP" role="button" tabindex="0" data-cilj="view:account">' +
        '<div class="imeM">' + (imaRacun() ? 'User account' : 'Sign up & plans') + '</div>' +
