  /* ============ CEDULJICE — papirici u praznini pokraj sadrzaja ============
     Na racunalu stupac sadrzaja stoji u sredini, a s obje strane ostaje prazna
     ploha. Tu stoje cedulje: dva mjesta lijevo (gore, dolje) i dva desno.
     Mobitel i tablet ih ne dobivaju — ondje sadrzaj ide gotovo do ruba, pa
     praznine u koju bi papiric stao nema (vidi TRI UREDAJA na dnu datoteke).

     Mjere NISU ovdje nego u varijablama koje postavlja preslozCedulje():
     sirina praznine ovisi o stupcu sadrzaja, o sirini ekrana i o stupcu
     lebdecih ikona koji tu istu desnu prazninu dijeli s papiricima. CSS zna
     samo koju varijablu gdje upotrijebiti, a ne koliko iznosi.

     Sloj je NIZE od zaglavlja (z-index 9 prema 10): papirici pocinju ispod
     njega, a ako se zaglavlje pri pomicanju stranice stisne i opet naraste,
     ono ostaje gore. Iznad njih su i lebdece ikone (30) i bocni paneli (40). */
  /* Sloj je uvijek tu, i kad je prazan: on JE mjera. Fiksni polozaj se racuna od
     okvira koji je uzi od prozora za sirinu klizaca (scrollbar-gutter: stable na
     <html>), a taj se broj ne da procitati ni iz innerWidth ni iz clientWidth —
     samo iz necega sto je i samo fiksno. Zato preslozCedulje() mjeri ovaj sloj,
     a ne prozor. Skrivaju se mjesta u njemu, ne on. */
  #ceduljeSloj { position: fixed; inset: 0; z-index: 9; pointer-events: none; }
  /* Dok traje odabir mjesta cijeli sloj hvata klikove — tako klik u prazno
     odustaje. Tanka koprena je znak da app ceka odabir, ne ukras. */
  body.ceduljePostavljanje #ceduljeSloj { pointer-events: auto; background: rgba(25,23,19,.045); }

  /* Mjesto je pretinac, cedulja je papir u njemu: pretinac drzi geometriju
     (koja strana, koji red), papir samo ispuni sirinu koju dobije. */
  .cedMjesto { display: none; position: absolute; width: var(--cedSir, 12rem); pointer-events: none; }
  body.imaCedulje .cedMjesto { display: block; }
  .cedMjesto[data-strana="l"] { left: var(--cedL, 1rem); }
  .cedMjesto[data-strana="d"] { left: var(--cedD, 1rem); }
  .cedMjesto[data-red="g"] { top: var(--cedG, 5rem); }
  .cedMjesto[data-red="d"] { bottom: var(--cedDo, 1rem); }
  body.ceduljePostavljanje .cedMjesto { pointer-events: auto; }

  .cedulja {
    position: relative; pointer-events: auto;
    background: var(--cedPapir); border: 1px solid var(--cedRub);
    border-radius: 2px 2px 3px 3px; padding: 0.5rem 0.625rem 1.5rem;
    box-shadow: 0 1px 1px rgba(25,23,19,.10), 0 8px 18px -8px rgba(25,23,19,.35);
  }
  /* Papir nije geometrijski savrsen: svako mjesto ima svoj mali nagib, pa se
     cetiri papirica ne citaju kao cetiri jednaka okvira. */
  .cedMjesto[data-slot="lg"] .cedulja { transform: rotate(-0.7deg); }
  .cedMjesto[data-slot="ld"] .cedulja { transform: rotate(0.55deg); }
  .cedMjesto[data-slot="dg"] .cedulja { transform: rotate(0.8deg); }
  .cedMjesto[data-slot="dd"] .cedulja { transform: rotate(-0.5deg); }
  /* Dok se bira mjesto, ispisani papirici se odmaknu: ponuda su prazna mjesta. */
  body.ceduljePostavljanje .cedulja { opacity: .5; }

  /* Rukopis i crte dijele jednu mjeru — --cedRed je i visina retka i korak
     crtovlja, pa tekst sjedi TOCNO na linijama. Zato je i visina polja cijeli
     broj redaka (preslozCedulje), a ne bilo koliko piksela.
     background-attachment: local je ono zbog cega crte putuju s tekstom kad ga
     bude vise od papira; bez njega bi stajale, a tekst se pomicao preko njih. */
  .cedText {
    display: block; width: 100%; height: var(--cedVis, 11rem);
    border: 0; outline: none; resize: none; overflow-y: auto;
    padding: 0; margin: 0; background-color: transparent;
    background-attachment: local; background-origin: content-box;
    font-family: var(--rukopis); font-size: 1.3rem; line-height: var(--cedRed, 1.7rem);
    color: var(--cedTinta); caret-color: var(--cedTinta);
  }
  .cedText::placeholder { color: var(--cedTinta); opacity: .34; }
  .cedulja[data-papir="linije"] .cedText {
    background-image: repeating-linear-gradient(to bottom,
      transparent 0, transparent calc(var(--cedRed, 1.7rem) - 1px),
      var(--cedCrta) calc(var(--cedRed, 1.7rem) - 1px), var(--cedCrta) var(--cedRed, 1.7rem));
  }
  .cedulja[data-papir="kvadratici"] .cedText {
    background-image:
      repeating-linear-gradient(to bottom,
        transparent 0, transparent calc(var(--cedRed, 1.7rem) - 1px),
        var(--cedCrta) calc(var(--cedRed, 1.7rem) - 1px), var(--cedCrta) var(--cedRed, 1.7rem)),
      repeating-linear-gradient(to right,
        transparent 0, transparent calc(var(--cedRed, 1.7rem) - 1px),
        var(--cedCrta) calc(var(--cedRed, 1.7rem) - 1px), var(--cedCrta) var(--cedRed, 1.7rem));
  }
  .cedulja[data-papir="prazno"] .cedText { background-image: none; }

  /* Alatka je na papiru, ne uz njega: tri vrste papira i brisanje, u podnozju.
     U mirovanju je samo naznaka — dovoljno da se zna da postoji, premalo da
     papir izgleda kao gumbara. */
  .cedAlat {
    position: absolute; left: 0.5rem; right: 0.5rem; bottom: 0.25rem;
    display: flex; align-items: center; gap: 0.125rem;
    opacity: .2; transition: opacity .18s;
  }
  .cedulja:hover .cedAlat, .cedulja:focus-within .cedAlat { opacity: 1; }
  .cedAlat button {
    width: 1.375rem; height: 1.375rem; padding: 0; flex: none;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid transparent; border-radius: var(--rad-xs);
    background: none; color: var(--cedTinta); opacity: .5; cursor: pointer;
    font-family: inherit; font-size: var(--t-s); line-height: 1;
  }
  .cedAlat .ikn { pointer-events: none; }
  .cedAlat button:hover { opacity: 1; border-color: var(--cedRub); background: rgba(255,255,255,.45); }
  .cedAlat button[aria-pressed="true"] { opacity: 1; border-color: var(--cedRub); background: rgba(255,255,255,.7); }
  .cedAlat .cedBrisi { margin-left: auto; }
  .cedAlat .cedBrisi:hover { color: var(--crvena); border-color: currentColor; background: none; }

  /* Prazno mjesto se vidi SAMO dok traje odabir. Izvan njega bi cetiri prazna
     okvira stajala na ekranu bez ikakvog razloga. */
  .cedPrazno {
    display: none; width: 100%; height: calc(var(--cedVis, 11rem) + 2rem);
    flex-direction: column; align-items: center; justify-content: center; gap: 0.25rem;
    border: 2px dashed var(--cedRub); border-radius: 3px; background: var(--cedPapir);
    color: var(--cedTinta); opacity: .5; cursor: pointer; padding: 0.5rem;
    font-family: inherit; font-size: var(--t-s); text-align: center; line-height: 1.3;
  }
  body.ceduljePostavljanje .cedPrazno { display: flex; animation: cedNudi .22s ease-out; }
  .cedPrazno:hover { opacity: 1; border-color: var(--plava); border-style: solid; }
  .cedPrazno .plusC { font-size: var(--t-3xl); line-height: 1; font-weight: 300; }
  @keyframes cedNudi { from { opacity: 0; transform: scale(.94); } to { opacity: .5; transform: none; } }
  /* Sva cetiri mjesta zauzeta: papirici sami kazu da ih je vec cetiri. Trese se
     pretinac, a ne papir — papir nosi svoj nagib i izgubio bi ga. */
  @keyframes cedTres {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); } 75% { transform: translateX(4px); }
  }
  .cedMjesto.puna { animation: cedTres .3s; }
  @media (prefers-reduced-motion: reduce) {
    body.ceduljePostavljanje .cedPrazno, .cedMjesto.puna { animation: none; }
  }

  /* -- cetvrta lebdeca ikona: novi papiric -- */
  /* Ista tipka kao info, isti niz. Mjesto joj racuna postaviIkonuCedulja():
     ispod infa kad je niz tu, na celu kad je sama (mini-igra). */
  #lebdiCed { position: fixed; top: 282px; right: 20px; z-index: 30; width: 3rem; height: 3rem;
    border-radius: 50%; background: var(--card); color: var(--plava); border: 2px solid var(--plava);
    display: none; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: 0 4px 14px rgba(154,91,82,.22); font-size: var(--t-xl); user-select: none;
    touch-action: none; opacity: .92; transition: opacity .3s, width .15s, height .15s, font-size .15s; }
  #lebdiCed.vidi { display: flex; }
  #lebdiCed:hover { opacity: 1; }

  /* -- mobitel: niz lebdecih ikona se nosi i sjeda na jedno od tri sidrista -- */
  /* Klase dodaje rasporediIkoneMob(): .ikMob dok je mobitel, .ikoneGore dok niz
     stoji u zaglavlju, .ikoneNosi dok ga prst nosi. Pratitelji kasne za uhvacenom
     ikonom po nekoliko stotinki, pa se niz vuce kao cjelina, a ne kao blok. */
  body.ikMob #lebdi, body.ikMob #lebdiIgra, body.ikMob #lebdiInfo {
    transition: left .34s cubic-bezier(.22,.9,.3,1), top .34s cubic-bezier(.22,.9,.3,1),
      width .3s ease, height .3s ease, font-size .3s ease, opacity .3s,
      transform .2s ease, box-shadow .2s ease;
  }
  body.ikoneGore #lebdi, body.ikoneGore #lebdiIgra, body.ikoneGore #lebdiInfo {
    opacity: 1; box-shadow: 0 2px 6px rgba(154,91,82,.18);
  }
  body.ikoneNosi #lebdi, body.ikoneNosi #lebdiIgra, body.ikoneNosi #lebdiInfo {
    transition: left .15s ease-out, top .15s ease-out, width .22s ease, height .22s ease,
      font-size .22s ease, transform .2s ease, box-shadow .2s ease;
    transform: scale(1.06); opacity: 1; box-shadow: 0 10px 26px rgba(154,91,82,.34);
  }
  body.ikoneNosi #lebdiInfo { transition-duration: .22s, .22s, .22s, .22s, .22s, .2s, .2s; }
  body.ikoneNosi #lebdi.ikHvat, body.ikoneNosi #lebdiIgra.ikHvat, body.ikoneNosi #lebdiInfo.ikHvat {
    transition: width .22s ease, height .22s ease, font-size .22s ease, transform .2s ease, box-shadow .2s ease;
    cursor: grabbing;
  }
  #lebdi.ikTiho, #lebdiIgra.ikTiho, #lebdiInfo.ikTiho { transition: none !important; }

  /* Mete: obris mjesta na koje niz moze sjesti, s malim ciljem u sredini.
     Vide se samo dok se nosi; najbliza je malo jaca. Namjerno blijede. */
  .ikMeta { position: fixed; z-index: 29; pointer-events: none; opacity: 0;
    border: 1.5px dashed color-mix(in srgb, var(--plava) 55%, transparent);
    background: color-mix(in srgb, var(--plava) 4%, transparent);
    transition: opacity .22s ease, left .15s ease-out, top .15s ease-out, width .22s ease, height .22s ease; }
  .ikMeta::before, .ikMeta::after { content: ''; position: absolute; left: 50%; top: 50%; border-radius: 50%; }
  .ikMeta::before { width: 4px; height: 4px; margin: -2px 0 0 -2px; background: var(--plava); opacity: .55; }
  .ikMeta::after { width: 12px; height: 12px; margin: -6px 0 0 -6px; border: 1.5px solid var(--plava);
    animation: ikMetaVal 2s ease-out infinite; }
  .ikMeta.moze { opacity: .5; }
  .ikMeta.blizu { opacity: 1; border-style: solid; border-color: color-mix(in srgb, var(--plava) 45%, transparent); }
  @keyframes ikMetaVal {
    0%   { transform: scale(.6); opacity: .5; }
    70%  { transform: scale(1.9); opacity: 0; }
    100% { transform: scale(1.9); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    body.ikMob #lebdi, body.ikMob #lebdiIgra, body.ikMob #lebdiInfo,
    body.ikoneNosi #lebdi, body.ikoneNosi #lebdiIgra, body.ikoneNosi #lebdiInfo { transition: opacity .2s; transform: none; }
    .ikMeta::after { animation: none; opacity: .4; }
  }
  #ikoneGnijezdo { display: none; }
  #lebdiCed.postavlja { background: var(--plava); color: #fff; opacity: 1; }

  /* Sirina ekrana je ovdje uvjet, ne ukras: ispod racunala nema praznine.
     JS do istog dolazi mjerenjem — ovo je drugi kljuc iste brave. */
  @media (max-width: 1023.98px) {
    body.imaCedulje .cedMjesto { display: none; }
    #lebdiCed.vidi { display: none; }
  }

  /* -- memorijska kartica (registracija) -- */
  /* ---- prijava / registracija ----
     Jedna kartica, jedan primarni put. Google gore jer je najbrzi, e-mail ispod
     crte kao alternativa, a prebacivanje login/signup je veza, ne treci gumb. */
  .prijavaOkvir { max-width: 24rem; margin: 0 auto; padding: 0.5rem 0 0; }
  .prijavaKart {
    background: var(--card); border: 1px solid var(--rub); border-radius: var(--rad-l);
    padding: 1.5rem 1.5rem 1.25rem;
  }
  .prijavaKart h1 {
    font-family: var(--naslov); font-size: var(--t-2xl); font-weight: 600;
    letter-spacing: -.02em; margin: 0 0 0.375rem;
  }
  .prijavaKart .uvodP { color: var(--muted); font-size: var(--t-m); line-height: 1.55; margin: 0 0 1.25rem; }
  .gumbGoogle {
    display: flex; align-items: center; justify-content: center; gap: 0.625rem; width: 100%;
    padding: 0.7rem 1rem; border-radius: var(--rad-m); border: 1px solid var(--rub);
    background: #fff; color: #1f1f1f; cursor: pointer;
    font-family: inherit; font-size: var(--t-l); font-weight: 600;
    min-height: max(2.75rem, 44px); transition: border-color .15s, box-shadow .15s;
  }
  .gumbGoogle:hover { border-color: #b8b0a4; box-shadow: 0 1px 3px rgba(25,23,19,.12); }
  .gumbGoogle .gZnak { width: 1.15em; height: 1.15em; flex: none; }
  .crtaIli {
    display: flex; align-items: center; gap: 0.75rem; margin: 1.125rem 0;
    color: var(--muted); font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .1em;
  }
  .crtaIli::before, .crtaIli::after { content: ""; flex: 1; height: 1px; background: var(--rub); }
  .poljeP { margin-bottom: 0.75rem; }
  .poljeP label {
    display: block; font-size: var(--t-xs); font-weight: 600; color: var(--muted);
    margin-bottom: 0.3rem; letter-spacing: .02em;
  }
  .poljeP input {
    width: 100%; padding: 0.7rem 0.875rem; border: 1px solid var(--rub); border-radius: var(--rad-m);
    font-family: inherit; font-size: var(--t-l); background: var(--papir); color: var(--ink);
    min-height: max(2.75rem, 44px);
  }
  .poljeP input:focus { outline: none; border-color: var(--plava); box-shadow: 0 0 0 3px rgba(154,91,82,.15); }
  .greskaP { color: var(--crvena); font-size: var(--t-s); line-height: 1.4; min-height: 1.3em; margin: 0 0 0.5rem; }
  .greskaP.dobro { color: var(--zelena); }
  .prijavaKart button.gumb { margin-top: 0; }
  .prebaciP { text-align: center; font-size: var(--t-s); color: var(--muted); margin: 1rem 0 0; }
  .prebaciP button {
    border: 0; background: none; padding: 0; font: inherit; font-weight: 600;
    color: var(--plava); cursor: pointer; text-decoration: underline; text-underline-offset: 2px;
  }
  .dobitiP { list-style: none; padding: 0; margin: 1.25rem 0 0; display: grid; gap: 0.5rem; }
  .dobitiP li {
    display: flex; gap: 0.5rem; align-items: flex-start;
    font-size: var(--t-s); color: var(--muted); line-height: 1.5;
  }
  .dobitiP .ikn { color: var(--zelena); margin-top: 0.15em; }
  /* modal prijave dijeli iste dijelove sa stranicom, samo u uzem okviru */
  .otkljModal.prijavaModal { text-align: left; max-width: 24rem; }
  .otkljModal.prijavaModal h2 { text-align: left; }
  .otkljModal.prijavaModal .otkljPod { text-align: left; margin-bottom: 1.125rem; }
  .otkljModal.prijavaModal .prebaciP { margin-top: 0.75rem; }
  /* odustajanje je izlaz, ne ponuda — ne smije nositi brend-boju */
  .otkljModal.prijavaModal #prOdustani { color: var(--muted); font-weight: 400; }
  .otkljModal.prijavaModal #prOdustani:hover { color: var(--ink); }

  .karticaPolje {
    width: 100%; padding: 0.75rem 0.875rem; border: 1px solid var(--rub); border-radius: var(--rad-m);
    font-size: var(--t-l); font-family: inherit; margin: 0.25rem 0 0.75rem; text-align: center;
  }
  .karticaPolje:focus { outline: none; border-color: var(--plava); }
  .karticaNapomena { color: var(--muted); font-size: var(--t-s); line-height: 1.5; margin-top: 0.625rem; }
  .karticaVeza { color: var(--plava); cursor: pointer; text-decoration: underline; }

  @media (max-width: 639.98px) {
    .zidL0 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    /* Zadana sirina, ali nikad vise od trecine retka — tri slike moraju stati
       jedna uz drugu i na 320px, i kad je sučelje na Large. */
    .bljesak img { width: 6rem; max-width: 30%; height: auto; aspect-ratio: 1; }
    .mjesto { width: 6rem; max-width: 30%; }
    .redoslijed { flex-wrap: wrap; }
  }
  .otkljModal {
    background: var(--card); border-radius: var(--rad-xl); padding: 2rem 1.75rem; max-width: 26.25rem; width: 100%;
    text-align: center; animation: popIn .35s ease; box-shadow: 0 12px 40px rgba(0,0,0,.3);
  }
  .otkljModal .otkljIkona { font-size: var(--t-5xl); margin-bottom: 0.5rem; animation: skokV .8s ease .2s; display: inline-block; }
  .otkljModal h2 { margin-bottom: 0.375rem; }
  .otkljModal .otkljPod { color: var(--muted); font-size: var(--t-m); margin-bottom: 0.875rem; }
  @media (max-width: 639.98px) {
    .naslovnica { grid-template-columns: 1fr; }
    .valutaKartice { grid-template-columns: repeat(2, 1fr); }
    /* Pet stupaca na 360px: zaglavlje s kratkim imenima vrsta lijepi se za vrh,
       broj razine stoji lijevo, pa ćelija nosi samo traku ili kružnicu. */
    table.mreza { border-spacing: 0.25rem 0.375rem; }
    table.mreza th.razF { width: 1.25rem; font-size: var(--t-s); padding-right: 0; }
    table.mreza th.glavaF {
      position: sticky; top: 0; z-index: 2; background: var(--bg);
      font-size: var(--t-2xs); padding: 0.375rem 0 0.25rem;
    }
    table.mreza th.glavaF .dugo { display: none; }
    table.mreza th.glavaF .kratko { display: inline; }
    td.faza { padding: 0.625rem 0.3125rem; min-height: 2.75rem; }
    td.faza .imeF { display: none; }
    td.faza .tr { height: 0.375rem; margin: 0; }
    td.faza .plusF { font-size: var(--t-2xs); margin-top: 0.25rem; }
    .lukOkvir { width: 1.75rem; height: 1.75rem; margin: 0 auto; }
    .lukBrava { font-size: var(--t-2xs); }
    .prsten { width: 9.375rem; height: 9.375rem; }
    .prsten .pct { font-size: var(--t-4xl); }
    .sazRed { font-size: var(--t-s); }
  }
  @media (prefers-reduced-motion: reduce) {
    td.faza .tr i, .vtr i, .sazRed .sbar i, .prsten .luk, .lukZ .puni { transition: none; }
    .sazUlaz { animation: none; }
  }

  /* ================= MINI IGRE ================= */
  .miniMreza { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.875rem; margin-top: 1.25rem; }
  .miniKart {
    background: var(--card); border: 1px solid var(--rub); border-radius: var(--rad-l);
    padding: 1rem 1rem 0.875rem; cursor: pointer; position: relative; display: flex;
    flex-direction: column; gap: 0.25rem; transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  .miniKart:hover { transform: translateY(-2px); border-color: var(--plava); box-shadow: 0 6px 18px rgba(154,91,82,.10); }
  .miniKart.gotovo { border-color: var(--zelena); background: #f4f9f5; }
  /* Thumbnail je sada lice kartice: puna sirina, fiksni omjer 3:2 kakav su
     slike i narisane, pa se mreza ne mrda dok se slike ucitavaju. Broj igre
     stoji na slici, ne iznad teksta. */
  .miniKart .sl {
    position: relative; display: block; margin: -1rem -1rem 0.5rem; aspect-ratio: 2528 / 1696;
    border-radius: var(--rad-l) var(--rad-l) 0 0; overflow: hidden; background: var(--rub);
  }
  .miniKart .sl img { width: 100%; height: 100%; object-fit: contain; display: block; }
  /* Zamjena za igru koja jos nema sliku: iste mjere, isti omjer, ali vidljivo
     nacrtana — trake i ime, da se ne cita kao slika koja se nije ucitala. */
  .emoSl {
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    padding: 0 0.75rem; text-align: center;
    background: repeating-linear-gradient(135deg, var(--card) 0 10px, var(--bg) 10px 20px);
  }
  .emoSl > span {
    font-family: var(--naslov); letter-spacing: -.01em; font-size: var(--t-xl);
    color: var(--muted); line-height: 1.2;
  }
  .miniKart .broj {
    position: absolute; right: 0.5rem; top: 0.5rem; font-size: var(--t-xs); font-weight: 700;
    color: #fff; background: rgba(0,0,0,.45); border-radius: var(--rad-s);
    padding: 0.125rem 0.375rem; letter-spacing: .5px;
  }

  /* ---- Extras ---- */
  /* Jedna igra, pa nema mreze da je stisne: kartica ide cijelom sirinom stupca,
     a slika je 2:1 i zauzima vise mjesta nego bilo koji thumbnail ispod. */
  .miniNas {
    font-family: var(--naslov); font-size: var(--t-2xl); letter-spacing: -.01em;
    margin: 1.75rem 0 0.25rem;
  }
  .miniPod { color: var(--muted); font-size: var(--t-s); line-height: 1.5; margin: 0 0 0.75rem; }
  .extraMreza { display: block; }
  .extraKart {
    background: var(--card); border: 1px solid var(--rub); border-radius: var(--rad-l);
    overflow: hidden; cursor: pointer; display: flex; flex-direction: column;
    transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  .extraKart:hover { transform: translateY(-2px); border-color: var(--plava); box-shadow: 0 6px 18px rgba(154,91,82,.10); }
  .extraKart.uskoro { cursor: default; }
  .extraKart.uskoro:hover { transform: none; border-color: var(--rub); box-shadow: none; }
  /* Slika ide cijelom sirinom kartice u svom omjeru (2912x1440) — nista se ne reze. */
  .extraKart .sl { display: block; aspect-ratio: 2912 / 1440; background: var(--rub); }
  .extraKart .sl img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .extraKart .tekst { display: flex; flex-direction: column; gap: 0.25rem; padding: 1rem 1rem 0.875rem; }
  .extraKart .ime { font-family: var(--naslov); letter-spacing: -.01em; font-weight: 600; font-size: var(--t-xl); }
  .extraKart .stil { font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .6px; color: var(--plava); font-weight: 700; }
  .extraKart .opis { font-size: var(--t-s); color: var(--muted); line-height: 1.5; margin: 0.375rem 0 0.125rem; }
  .extraKart .podnozje {
    font-size: var(--t-xs); color: var(--muted); border-top: 1px dashed var(--rub);
    padding-top: 0.5rem; margin-top: 0.375rem; display: flex; justify-content: space-between; gap: 0.5rem;
  }
  .extraKart .podnozje .st { font-weight: 700; color: var(--plava); text-transform: uppercase; letter-spacing: .5px; }
  .miniKart .ime { font-weight: 600; font-size: var(--t-l); }
  .miniKart .stil { font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .6px; color: var(--plava); font-weight: 700; }
  .miniKart .opis { font-size: var(--t-s); color: var(--muted); line-height: 1.45; flex: 1; margin: 0.375rem 0 0.125rem; }
  .miniKart .podnozje {
    font-size: var(--t-xs); color: var(--muted); border-top: 1px dashed var(--rub);
    padding-top: 0.5rem; margin-top: 0.25rem; display: flex; justify-content: space-between; gap: 0.5rem;
  }
  .miniKart .podnozje .st { font-weight: 700; color: var(--zelena); }
  .miniSaz {
    display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; margin-top: 0.75rem;
    padding: 0.75rem 1rem; background: var(--card); border: 1px solid var(--rub); border-radius: var(--rad-m);
    font-size: var(--t-s); color: var(--muted);
  }
  .miniSaz strong { color: var(--ink); }
  .miniDno { margin-top: 2rem; }
  .miniNas:first-child { margin-top: 0; }

  /* ================= PROZOR IGRE =================
     Klik na igru otvara sastav po skici: velika profilna slika, uz nju okomita
     traka napretka, screenshot preko donjeg desnog kuta slike, naziv ispod.
     Na računalu i tabletu to je prozor srednje veličine koji izraste iz kartice,
     na mobitelu ista kompozicija unutar proširene kartice u mreži.
     Kutija ima stalan omjer, pa se sve mjeri u postocima njezine širine:
       profil   84 % širine, 800:537  → visina 0,564 W
       shot     46 % širine, 800:500  → 0,2875 W, gornji rub na 0,40 W
       traka    stupac desno od profila, od vrha do malo iznad screenshota
       naziv    ispod profila lijevo; -9,4 % = od dna profila do dna kutije
     Extras nema bodova ni screenshota — samo slika, naziv, opis i gumb. */
  .igSastav { position: relative; width: 100%; aspect-ratio: 1 / 0.6875; }
  .igProfil {
    position: absolute; left: 0; top: 0; width: 84%; aspect-ratio: 800 / 537;
    border-radius: var(--rad-l); overflow: hidden; background: var(--rub); box-shadow: 0 0 0 1px var(--rub);
  }
  .igProfil img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .igShot {
    position: absolute; right: 0; top: 58.2%; width: 46%; aspect-ratio: 800 / 500;
    border-radius: var(--rad-m); overflow: hidden; background: var(--rub); border: 3px solid var(--card);
    box-shadow: 0 10px 28px rgba(25,23,19,.28), 0 0 0 1px var(--rub);
  }
  .igShot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .igNapredak {
    position: absolute; left: 86.5%; right: 0; top: 0; height: 53%;
    display: flex; flex-direction: column; align-items: center; gap: 0.375rem;
  }
  .igTrak {
    flex: 1 1 auto; width: 0.75rem; border-radius: 999px; background: var(--tiho);
    box-shadow: inset 0 0 0 1px var(--rub); position: relative; overflow: hidden;
  }
  .igTrak i {
    position: absolute; left: 0; right: 0; bottom: 0; border-radius: 999px; background: var(--plava);
    height: var(--p, 0%); transition: height .7s cubic-bezier(.22,1,.36,1) .15s;
  }
  .igNapredak.puno .igTrak i { background: var(--zelena); }
  .igNapredak .br { font-weight: 700; font-size: var(--t-s); line-height: 1; font-variant-numeric: tabular-nums; }
  .igNapredak .od { font-size: var(--t-2xs); color: var(--muted); line-height: 1; margin-top: -0.125rem; }
  .igNapredak.puno .br { color: var(--zelena); }
  .igNaziv { width: 52%; margin-top: -9.4%; position: relative; }
  .igNaziv .ime { display: block; font-family: var(--naslov); font-weight: 700; font-size: var(--t-2xl); line-height: 1.15; letter-spacing: -.01em; }
  .igNaziv .stil { display: block; margin-top: 0.25rem; font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .6px; color: var(--plava); font-weight: 700; }
  /* bez screenshota naziv smije cijelom širinom */
  .igSastav.bezShota + .igNaziv { width: auto; }
  .igSastav.extra { aspect-ratio: auto; }
  .igSastav.extra .igProfil { position: relative; width: 100%; aspect-ratio: 2912 / 1440; }
  .igSastav.extra .igProfil img { object-fit: contain; }
  .igSastav.extra + .igNaziv { width: auto; margin-top: 0.875rem; }
  .igOpis { color: var(--muted); font-size: var(--t-m); line-height: 1.55; margin: 0.875rem 0 0; }
  .igMeta {
    display: flex; justify-content: space-between; gap: 0.5rem; margin-top: 0.75rem; padding-top: 0.625rem;
    border-top: 1px dashed var(--rub); font-size: var(--t-xs); color: var(--muted);
  }
  .igMeta .st { font-weight: 700; color: var(--zelena); }
  button.igPlay {
    margin-top: 1rem; width: 100%; min-height: 3rem; border: 0; border-radius: var(--rad-l);
    background: var(--zelena); color: #fff; font: inherit; font-weight: 600; font-size: var(--t-l);
    display: flex; align-items: center; justify-content: center; gap: 0.5rem; cursor: pointer;
  }
  button.igPlay:hover { filter: brightness(1.08); }
  button.igPlay:disabled { background: var(--muted); cursor: default; filter: none; }
  .igPlay svg { width: 0.85em; height: 0.85em; fill: currentColor; }

  #igraSloj {
    position: fixed; inset: 0; z-index: 900; background: rgba(25,23,19,.45);
    display: flex; align-items: center; justify-content: center; padding: 1.5rem;
  }
  .igraProzor {
    background: var(--card); border-radius: var(--rad-xl); width: 100%; max-width: 36rem;
    max-height: calc(100dvh - 3rem); overflow-y: auto; box-shadow: 0 24px 64px rgba(0,0,0,.28); transform-origin: 0 0;
  }
  .igraProzor .igGlava { display: flex; align-items: center; justify-content: space-between; padding: 0.875rem 1.25rem 0.625rem; }
  .igraProzor .igVrsta { font-size: var(--t-xs); font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--plava); }
  .igraProzor .igX {
    width: 2rem; height: 2rem; border: 0; background: none; cursor: pointer; color: var(--muted);
    font-size: 1.6rem; line-height: 1; border-radius: var(--rad-s); font-family: inherit;
  }
  .igraProzor .igX:hover { color: var(--ink); background: var(--tiho); }
  .igraProzor .igX:focus:not(:focus-visible) { outline: none; }
  .igraProzor .igTijelo { padding: 0 1.25rem 1.25rem; }

  /* proširena kartica (samo mobitel; drugdje se .igProsireno ne stvara) */
  .igProsireno { display: none; }
  .igZatvori {
    position: absolute; left: 1.25rem; top: 1.25rem; z-index: 2; width: 2rem; height: 2rem; border: 0;
    border-radius: 50%; background: rgba(255,253,250,.92); color: var(--ink); font-size: 1.3rem; line-height: 1;
    box-shadow: 0 1px 4px rgba(0,0,0,.18); cursor: pointer; font-family: inherit;
  }
  @keyframes igRasti { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .igTrak i { transition: none; } }
  #miniIgreNas { scroll-margin-top: calc(var(--visinaZaglavlja, 64px) + 16px); }
  /* Okvir nema svoju visinu — uzima je od igre (miniUskladiVisinu). Naslov i
     podaci idu odmah u nastavku, s razmakom koliko treba da se ne slijepe. */
  .miniOkvir { margin-top: 0; }
  .miniOkvir .alat { display: flex; align-items: center; gap: 0.625rem;
    flex-wrap: wrap; margin: 0.75rem 0 0; }
  .miniOkvir .alat .nas { font-weight: 600; font-size: var(--t-l); }
  .miniOkvir .alat .pod { font-size: var(--t-s); color: var(--muted); margin-right: auto; }
  button.gumbSitni {
    padding: 0.5rem 0.875rem; border: 1px solid var(--rub); border-radius: var(--rad-s); background: var(--card);
    color: var(--ink); font-size: var(--t-s); font-family: inherit; cursor: pointer;
  }
  button.gumbSitni:hover { border-color: var(--plava); color: var(--plava); }
  /* Igra nije zaseban prozorcic: bez ruba, bez zaobljenja i bez vlastitog klizaca.
     Visinu joj u pikselima postavlja JS, tocno koliko je visok dokument unutra —
     zato ovdje nema ni height ni min-height koji bi to pregazio. Klizac je jedan:
     onaj glavne stranice. */
  .miniOkvir iframe {
    width: 100%; border: 0; background: var(--card); display: block;
  }
  /* Igra pocinje odmah ispod zaglavlja; dolje ostaje uobicajeni odmak stranice. */
  #view:has(.miniOkvir) { padding-top: 0; }

  /* ---- POLOŽENE IGRE (zaslon: 'polozeno': Grad, Poštanski vlak i Obrana baze) ----
     Ne prate visinu dokumenta: scena je visoka koliko ekran ispod zaglavlja.
     Na mobitelu u stranici stoji poster s ▶, a igra se igra preko cijelog
     ekrana. Android ulazi u pravi cijeli zaslon i zaključa položeni smjer;
     iPhone to ne dopušta, pa se pozornica okrene za 90° i mobitel se nakrene.
     Okreće se okvir, ne igra — igra vidi položeni prozor, a dodiri stižu
     preračunati. Veličinu i rotaciju pozornice postavlja miniOkreni(). */
  .miniScena {
    position: relative; width: 100%; overflow: hidden; background: #2B2118;
    height: calc(100dvh - var(--visinaZaglavlja, 4rem) - 3.75rem); min-height: 20rem;
  }
  .miniScena.miniMob {
    height: auto; min-height: 0; aspect-ratio: 16 / 10;
    max-height: calc(100dvh - var(--visinaZaglavlja, 4rem) - 3.75rem);
  }
  .miniPozornica { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 0 0; }
  .miniOkvir .miniPozornica iframe { width: 100%; height: 100%; }
  .miniCijeliTipka {
    position: absolute; right: 0; top: 50%; transform: translateY(-50%); z-index: 2;
    width: max(2.75rem, 44px); height: max(3.5rem, 56px); padding: 0;
    border: 0; border-radius: var(--rad-s) 0 0 var(--rad-s);
    background: rgba(43, 33, 24, .72); color: #fff; font-size: 1.375rem; line-height: 1;
    font-family: inherit; cursor: pointer;
  }
  .miniCijeliTipka:hover { background: rgba(43, 33, 24, .9); }
  .miniPoster { display: none; }
  .miniScena.miniMob .miniPoster {
    display: flex; position: absolute; inset: 0; z-index: 3; padding: 0; border: 0; cursor: pointer;
    flex-direction: column; align-items: center; justify-content: center; gap: 0.625rem;
    background: #2B2118; color: #fff; font-family: inherit;
  }
  .miniPoster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .55; }
  .miniPoster .igraj {
    position: relative; width: 4.5rem; height: 4.5rem; border-radius: 50%;
    background: var(--zut, #F4B942); color: #2B2118; font-size: 1.75rem;
    display: flex; align-items: center; justify-content: center; padding-left: 0.25rem;
    box-shadow: 0 4px 0 rgba(0,0,0,.35);
  }
  .miniPoster .tekst { position: relative; font-weight: 600; font-size: var(--t-s);
    text-shadow: 0 1px 3px rgba(0,0,0,.7); }
  /* preko cijelog ekrana */
  .miniScena.cijeli {
    position: fixed; inset: 0; z-index: 1000; width: auto; height: auto;
    min-height: 0; max-height: none; aspect-ratio: auto;
  }
  .miniScena.cijeli .miniPoster { display: none; }
  html.miniCijeliOtv, html.miniCijeliOtv body { overflow: hidden; }
  /* stupci mreze i visina iframea zive u bloku po uređaju, na dnu datoteke */

  /* ============ IZNIMKE OD SKALIRANJA ======================================
     Sve ostalo slijedi korijen. Ovo su stvari koje ne smiju.

     1. DODIRNE METE. Prst ne raste s rezolucijom ekrana. Zato max(rem, px):
        meta raste kad korisnik poveća sučelje, ali nikad ne pada ispod 44px
        koliko traže WCAG 2.5.5 i Appleove smjernice. Rubovi i sjene su
        namjerno ostavljeni u px iz istog razloga — hairline mora ostati
        hairline i na najvećem zumu.

     2. MINI-IGRE U IFRAMEU imaju vlastiti <html>; ovaj korijen ih ne dotiče.
        Njihove veličine se rješavaju u njihovim datotekama.

     3. SLIKE. Sve su sad u rem, pa prate sučelje. Najveća fizička veličina
        koju slika dosegne = prikazana veličina x 1.2 (gornja granica zuma)
        x 1.15 (najveća --skala) x 2 (retina). Za izvoz:
           .bljesak img   7.875rem (126px)  ->  izvoz ~350px
           .metaL0 img    7.375rem (118px)  ->  izvoz ~330px
           #popSlovo img  6rem      (96px)  ->  izvoz ~270px
           .slikaDet     11.875rem (190px)  ->  izvoz ~525px
        Ispod tih vrijednosti slika postaje mutna na retini pri velikom zumu.
     ---------------------------------------------------------------------- */
  .tipkaHr {
    min-width: max(2.75rem, 44px);
    min-height: max(2.75rem, 44px);
  }
  button.gumbSitni, .wtFilterG, .wtBrojevi button, .segment button, .smjerG, .testG {
    min-height: max(2.75rem, 44px);
  }
  .traka .natrag, .testPauza, .igDalje {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: max(2.75rem, 44px);
  }
  #panelRj .prekidac div, #panelIgra .prekidac div {
    display: flex; align-items: center; justify-content: center;
    min-height: max(2.75rem, 44px);
  }

  /* ================= COLOR SCHEMES =================
     Svaka tema mijenja samo tokene; ostatak stilova ostaje isti. */
  body[data-tema="zagreb"] {
    --bg: #f6f3ee; --card: #fffdfa; --ink: #191713; --muted: #8b8377;
    --plava: #b3352f; --zelena: #2f6d4f; --zlatna: #8a6d1f; --plavaVok: #23407a;
    --rub: #e3ddd2; --tiho: #f0ece4; --papir: #faf7f1;
    --cedPapir: #fdf2bf; --cedRub: #eadd9d; --cedCrta: rgba(74,60,20,.20);
  }
  body[data-tema="jadran"] {
    --bg: #eff3f4; --card: #ffffff; --ink: #14212a; --muted: #6d8290;
    --plava: #1f6076; --zelena: #2b7a63; --zlatna: #a9762a; --plavaVok: #2a5d8f;
    --rub: #dbe3e6; --tiho: #e8eef0; --papir: #f4f8f9;
    --cedPapir: #dff1ef; --cedRub: #c4e2de; --cedCrta: rgba(20,58,66,.20);
  }
  body[data-tema="maslina"] {
    --bg: #f4f4ec; --card: #fffef9; --ink: #1e2018; --muted: #7f8272;
    --plava: #55703c; --zelena: #3f6b4a; --zlatna: #8d6b1c; --plavaVok: #3c5b7a;
    --rub: #e0e0d2; --tiho: #ecece0; --papir: #f8f8f0;
    --cedPapir: #f1f0b8; --cedRub: #dedd9e; --cedCrta: rgba(50,56,24,.20);
  }
  body[data-tema="tinta"] {
    --bg: #f4f4f5; --card: #ffffff; --ink: #191a1d; --muted: #74767c;
    --plava: #2b2d33; --zelena: #2f6d4f; --zlatna: #8a6d1f; --plavaVok: #35507d;
    --rub: #e2e2e4; --tiho: #ededef; --papir: #f8f8f9;
    --cedPapir: #f6f2d8; --cedRub: #e6e0bd; --cedCrta: rgba(40,40,44,.22);
  }
  body[data-tema="sljiva"] {
    --bg: #f5f1f4; --card: #fffdfe; --ink: #1e1820; --muted: #837785;
    --plava: #6f3a5c; --zelena: #3f6b52; --zlatna: #8a6a24; --plavaVok: #3f4c86;
    --rub: #e5dde3; --tiho: #eee7ec; --papir: #f9f5f8;
    --cedPapir: #f9e6ee; --cedRub: #edd2dd; --cedCrta: rgba(70,30,55,.20);
  }

  /* ---- Pismo: isti princip kao teme — jedan atribut na <body>. ----
     Napomena: veličina se NE podešava ovdje. Pravilo na <body> ne može
     utjecati na font-size od <html>, pa je korekcija veličine pisma dio
     --skala koju JS piše na documentElement (vidi KOREKCIJA_PISMA). */
  :root, body[data-font="sistem"] {
    --tekst: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --naslov: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-visina: 1.6;
  }
  body[data-font="inter"]    { --tekst: "Inter", system-ui, sans-serif;                 --naslov: "Inter", system-ui, sans-serif; }
  body[data-font="grotesk"]  { --tekst: "Space Grotesk", system-ui, sans-serif;         --naslov: "Space Grotesk", system-ui, sans-serif; }
  body[data-font="atkinson"] { --tekst: "Atkinson Hyperlegible", system-ui, sans-serif; --naslov: "Atkinson Hyperlegible", system-ui, sans-serif; }
  body[data-font="lexend"]   { --tekst: "Lexend", system-ui, sans-serif;                --naslov: "Lexend", system-ui, sans-serif; --font-visina: 1.65; }
  body[data-font="literata"] { --tekst: "Literata", Georgia, serif;                     --naslov: "Literata", Georgia, serif; }

  /* ---- stranica Options: teme lijevo, pisma desno, stupci jednake visine ---- */
  .postavkeDva { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; max-width: 45rem; }
  .postavkeDva > div { display: flex; flex-direction: column; min-width: 0; }
  .nasP {
    font-family: var(--naslov); font-size: var(--t-xs); font-weight: 700; letter-spacing: .09em;
    text-transform: uppercase; color: var(--muted); margin: 0 0 0.625rem 0.125rem;
  }
  .stupacP { flex: 1; display: grid; gap: 0.625rem; grid-auto-rows: 1fr; }
  .fontK {
    background: var(--card); border: 1px solid var(--rub); border-radius: var(--rad-l);
    padding: 0.75rem 0.875rem; cursor: pointer; text-align: center; position: relative;
    display: flex; align-items: center; justify-content: center;
    transition: border-color .15s, transform .12s;
  }
  .fontK:hover { border-color: var(--plava); transform: translateY(-2px); }
  .fontK.aktivna { border-color: var(--plava); box-shadow: inset 0 0 0 1px var(--plava); }
  .fontK .imeF { font-size: var(--t-l); font-weight: 600; line-height: 1.25; letter-spacing: -.01em; }
  .fontK .kvaka { position: absolute; top: 7px; right: 9px; color: var(--plava); font-size: var(--t-xs); font-weight: 700; }
  @media (max-width: 639.98px) { .postavkeDva { grid-template-columns: 1fr; gap: 1.5rem; } }
  /* ---- Options: veličina sučelja ---- */
  .velicinaBlok { max-width: 45rem; margin-top: 1.75rem; }
  .velicinaMreza { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.625rem; }
  .velicinaK {
    background: var(--card); border: 1px solid var(--rub); border-radius: var(--rad-l);
    padding: 0.875rem 0.75rem; cursor: pointer; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 0.125rem;
    min-height: max(2.75rem, 44px);
    transition: border-color .15s, transform .12s;
  }
  .velicinaK:hover { border-color: var(--plava); transform: translateY(-2px); }
  .velicinaK.aktivna { border-color: var(--plava); box-shadow: inset 0 0 0 1px var(--plava); }
  .velicinaK .uzorakV { font-family: var(--naslov); font-weight: 700; line-height: 1.1; color: var(--plava); }
  .velicinaK .imeV { font-size: var(--t-m); font-weight: 600; }
  .velicinaK .opisV { font-size: var(--t-xs); color: var(--muted); line-height: 1.35; }
  @media (max-width: 639.98px) { .velicinaMreza { grid-template-columns: 1fr; } }

  /* ---- prekidac u Options ----
     Jedan redak: objasnjenje lijevo, stanje nosi klizac desno. Stanje zivi u
     aria-checked, pa je isti atribut i pristupacnost i stilski uvjet — nema
     druge klase koja bi se mogla razici s njim. */
  .sklopkaRed {
    display: flex; align-items: center; gap: 1rem; width: 100%; text-align: left;
    background: var(--card); border: 1px solid var(--rub); border-radius: var(--rad-l);
    padding: 0.875rem 1rem; cursor: pointer; font-family: inherit; color: inherit;
    min-height: max(2.75rem, 44px); transition: border-color .15s;
  }
  .sklopkaRed:hover { border-color: var(--plava); }
  .sklopkaRed:focus-visible { outline: 2px solid var(--plava); outline-offset: 2px; }
  .sklopkaTekst { flex: 1; min-width: 0; }
  .sklopkaRed .imeSk { display: block; font-size: var(--t-l); font-weight: 600; line-height: 1.3; }
  .sklopkaRed .opisSk { display: block; font-size: var(--t-s); color: var(--muted); line-height: 1.45; margin-top: 0.25rem; }
  .sklopka {
    position: relative; flex: none; width: 2.75rem; height: 1.5rem; border-radius: 999px;
    background: var(--rub); transition: background .2s;
  }
  .sklopka::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: calc(1.5rem - 6px); height: calc(1.5rem - 6px); border-radius: 50%;
    background: var(--card); box-shadow: 0 1px 3px rgba(25,23,19,.25);
    transition: transform .2s cubic-bezier(.32,.72,0,1);
  }
  .sklopkaRed[aria-checked="true"] .sklopka { background: var(--plava); }
  .sklopkaRed[aria-checked="true"] .sklopka::after { transform: translateX(1.25rem); }
  @media (prefers-reduced-motion: reduce) { .sklopka, .sklopka::after { transition: none; } }
  @media (prefers-reduced-motion: reduce) { header { transition: none; } }

  .pregledP { max-width: 45rem; margin-top: 1.75rem; }
  .pregledP .ploca {
    background: var(--card); border: 1px solid var(--rub); border-radius: var(--rad-l);
    padding: 1.25rem; box-shadow: 0 1px 2px rgba(25,23,19,.05);
  }
  .pregledP .opcija.tocno { border-color: var(--zelena); background: #eaf3ec; color: var(--zelena); }

  /* ---- stranica Options ---- */
  .opcijeMreza { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; max-width: 40rem; }
  .temaK {
    background: var(--card); border: 1px solid var(--rub); border-radius: var(--rad-l);
    padding: 1rem 1.25rem; cursor: pointer; transition: border-color .15s, transform .12s;
  }
  .temaK:hover { border-color: var(--plava); transform: translateY(-2px); }
  .temaK.aktivna { border-color: var(--plava); box-shadow: inset 0 0 0 1px var(--plava); }
  .temaK .imeT { font-family: var(--naslov); font-weight: 600; font-size: var(--t-l); display: flex;
    align-items: center; justify-content: space-between; gap: 0.5rem; }
  .temaK .imeT .kvaka { color: var(--plava); font-size: var(--t-s); font-weight: 700; }
  .temaK .podT { font-size: var(--t-s); color: var(--muted); margin-top: 0.375rem; line-height: 1.45; }
  .temaK .uzorak { display: flex; gap: 0.375rem; margin-top: 0.75rem; }
  .temaK .uzorak span { flex: 1; height: 1.75rem; border-radius: var(--rad-s); border: 1px solid rgba(0,0,0,.06); }
  @media (max-width: 639.98px) { .opcijeMreza { grid-template-columns: 1fr; } }

  /* ---- naslovnica: dva spila gore, sve ostalo tiho ispod ---- */
  .pocetna { display: grid; grid-template-columns: 1fr; gap: 1.25rem; align-items: start; margin-top: 0.25rem; }
  .lijevo { display: grid; gap: 0.875rem; min-width: 0; container: glavni / inline-size; }

  /* --- spilovi: nastavi / kreni novo --- */
  .spilovi { display: grid; grid-template-columns: 1fr 1fr; gap: 0.625rem; }
  .spilovi.jedan { grid-template-columns: 1fr; }
  .spil {
    background: var(--card); border: 1px solid var(--rub); border-radius: var(--rad-l);
    padding: 0.75rem 0.75rem 0.625rem; min-width: 0; display: flex; flex-direction: column;
    container: spil / inline-size;
  }
  .spil .zag { display: flex; align-items: flex-start; gap: 0.375rem; min-height: 2.2rem; margin-bottom: 0.375rem; }
  .spil .oznakaS {
    font-size: var(--t-2xs); font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted); line-height: 1.3; min-width: 0;
  }
  .spil .strelice { margin-left: auto; display: none; gap: 0.25rem; flex: none; padding-top: 0.05rem; }
  .strelice button {
    width: 1.4rem; height: 1.4rem; padding: 0; line-height: 1; font-size: var(--t-s);
    border: 1px solid var(--rub); background: var(--card); color: var(--muted);
    border-radius: var(--rad-s); cursor: pointer;
  }
  .strelice button:hover:not(:disabled) { border-color: var(--plava); color: var(--plava); }
  .strelice button:disabled { opacity: .3; cursor: default; }
  /* Vodoravni potez prstom vodi klizacSpila() — jedna kartica po potezu, sporije
     od nativnog zamaha — pa pregledniku ostaje samo okomito pomicanje (stranica
     i dalje skrola preko spila) i zumiranje prstima. pinch-zoom je u zasebnoj
     deklaraciji jer preglednik koji ga ne zna odbaci cijelu vrijednost. Snap
     ostaje za kotačić, touchpad i promjenu širine, a scroll-snap-stop ni njima
     ne da preskočiti karticu. */
  .spilTraka {
    display: flex; flex-wrap: nowrap; gap: 0.625rem; overflow-x: auto;
    scroll-snap-type: x mandatory; scrollbar-width: none; -ms-overflow-style: none;
    overscroll-behavior-x: contain;
    touch-action: pan-y; touch-action: pan-y pinch-zoom;
  }
  .spilTraka::-webkit-scrollbar { display: none; }
  /* Puna sirina, ne 90%: nakon prevlacenja se vidi tocno jedna kartica.
     Virak sljedece kartice je uobicajena najava da ima jos, ali ovdje je
     citljivost jedne kartice vaznija od te najave — strelice u zaglavlju
     spila i tako govore da ih ima vise. */
  .slajd {
    flex: 0 0 100%; scroll-snap-align: start; scroll-snap-stop: always; min-width: 0; cursor: pointer;
    display: flex; flex-direction: column; border-radius: var(--rad-s);
  }
  .slajd:focus-visible { outline: 2px solid var(--plava); outline-offset: 3px; }
  .slajd .tipS {
    font-size: var(--t-2xs); font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; color: var(--plava);
  }
  .slajd .imeS {
    font-family: var(--naslov); font-weight: 600; font-size: var(--t-l); line-height: 1.25;
    margin: 0.125rem 0 0.25rem; display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden; min-height: 2.5em;
  }
  .slajd .metaS {
    font-size: var(--t-2xs); color: var(--muted); line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; min-height: 2.8em;
  }
  .slajd .barS {
    height: 0.4375rem; border-radius: var(--rad-xs); background: var(--tiho);
    overflow: hidden; margin: 0.5rem 0 0.25rem;
  }
  .slajd .barS i {
    display: block; height: 100%; width: 0; border-radius: var(--rad-xs);
    background: var(--plava); transition: width .7s cubic-bezier(.22,1,.36,1);
  }
  .slajd .podBar { display: flex; justify-content: space-between; gap: 0.5rem; font-size: var(--t-2xs); color: var(--muted); }
  .slajd .podBar b { font-family: var(--naslov); font-weight: 600; color: var(--ink); }
  .slajd .ctaS {
    display: none; margin-top: 0.625rem; padding: 0.45rem 0.9rem; border-radius: var(--rad-s);
    background: var(--plava); color: #fff; font-weight: 600; font-size: var(--t-s); text-align: center;
  }
  .spil.novo .slajd .tipS { color: var(--zelena); }
  .spil.novo .slajd .barS i { background: var(--zelena); }
  .spil.novo .ctaS { background: var(--zelena); }
  .spil.zakljucan .slajd .tipS { color: var(--zlatna); }
  .spil.zakljucan .slajd .barS i { background: var(--zlatna); }
  .spil.zakljucan .ctaS { background: none; color: var(--zlatna); border: 1px solid var(--zlatna); }
  .tockice { display: flex; gap: 0.25rem; justify-content: center; margin-top: 0.5rem; }
  .tockice span { width: 5px; height: 5px; border-radius: 50%; background: var(--rub); transition: background .2s, width .2s; }
  .tockice span.on { background: var(--plava); width: 12px; border-radius: 3px; }
  .spil.novo .tockice span.on { background: var(--zelena); }

  /* --- brza vjezba: rjecnik, daily, mini --- */
  .zaglavljeP {
    font-size: var(--t-2xs); font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; color: var(--muted); margin: 0.25rem 0 -0.375rem;
  }
  .brza { display: grid; grid-template-columns: 1fr; gap: 0.5rem; }
  .brzaK {
    background: var(--card); border: 1px solid var(--rub); border-radius: var(--rad-m);
    padding: 0.625rem 0.75rem; cursor: pointer; display: flex; align-items: center;
    gap: 0.625rem; min-width: 0; transition: border-color .15s;
  }
  .brzaK:hover { border-color: var(--plava); }
  .brzaK:focus-visible { outline: 2px solid var(--plava); outline-offset: 2px; }
  .brzaK .emoB { font-size: var(--t-xl); flex: none; line-height: 1; color: var(--muted); }
  .brzaK:hover .emoB, .brzaK.istaknuta .emoB { color: var(--plava); }
  .brzaK .tekstB { min-width: 0; display: block; }
  .brzaK .imeB { display: block; font-family: var(--naslov); font-weight: 600; font-size: var(--t-m); line-height: 1.25; }
  .brzaK .podB { display: block; font-size: var(--t-2xs); color: var(--muted); line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brzaK .strB { margin-left: auto; color: var(--muted); flex: none; }
  .brzaK.istaknuta { border-color: var(--plava); }

  .pocetna .redNula { justify-content: stretch; margin: 0; }
  .pocetna .plocicaNula { flex: 1; text-align: left; padding: 0.75rem 0.875rem; border-radius: var(--rad-m); }
  .pocetna .plocicaNula .imeF { font-size: var(--t-m); }
  .pocetna .plocicaNula .bod { font-size: var(--t-2xs); margin-top: 0.25rem; }

  .maleP { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem; }
  .malaP {
    background: var(--card); border: 1px solid var(--rub); border-radius: var(--rad-m);
    padding: 0.625rem 0.75rem; cursor: pointer; transition: border-color .15s;
  }
  .malaP:hover { border-color: var(--plava); }
  .malaP:focus-visible { outline: 2px solid var(--plava); outline-offset: 2px; }
  .malaP .imeM { font-family: var(--naslov); font-weight: 600; font-size: var(--t-m); }
  .malaP .podM { font-size: var(--t-2xs); color: var(--muted); margin-top: 0.2rem; line-height: 1.4; }

  /* spil ima mjesta za strelice i gumb tek kad sam nije uzak */
  @container spil (min-width: 210px) {
    .spil { padding: 1rem 1rem 0.875rem; }
    .spil .strelice { display: flex; }
    .slajd .imeS { font-size: var(--t-xl); min-height: 2.4em; }
    .slajd .metaS { min-height: 0; }
    .slajd .ctaS { display: block; }
  }

    .slajd .imeS { font-size: var(--t-2xl); }

  @container glavni (min-width: 420px) {
    .spilovi { gap: 0.875rem; }
  }

  /* ---- zaglavlje: mirnije, s razmakom koji drži liniju ---- */
  header { padding: 0.875rem 1.5rem; gap: 1.5rem; }
  header nav a { font-size: var(--t-m); transition: background .15s, color .15s; }
  /* Cim se krene dolje zaglavlje se stisne i tako ostane dok se ne vratimo na
     vrh — sadrzaj dobije natrag pola centimetra, a izbornik ostaje na dohvatu.
     Stisce se samo razmak i logo; slova izbornika ostaju iste velicine, jer
     meta koja se smanjuje pod prstom je meta koja se promasi. */
  header { transition: padding .18s ease; }
  body.zaglavljeMalo header { padding-top: 0.375rem; padding-bottom: 0.375rem; }
  #view { padding: 1.75rem 1.25rem 4rem; }

  /* ---- mobitel: izbornik se sklapa iza ikonice (☰ → C kad je otvoren), pogled ostaje slobodan ---- */
  @media (max-width: 639.98px) {
    header { padding: 0.625rem 0.875rem; gap: 0.625rem; position: relative; }
    /* Nav je ovdje fixed, pa srednji stupac sluzi samo gnijezdu lebdecih ikona.
       Dok je gnijezdo prazno (sirina 0) raspored je isti kao prije: logo lijevo,
       brojac i velicina desno. Kad niz sjedne gore, gnijezdo se rasiri, a brojac
       se po potrebi skrati u tri tocke. */
    header { grid-template-columns: auto 1fr minmax(0, max-content); }
    #ikoneGnijezdo { display: block; grid-column: 2; grid-row: 1; justify-self: center; align-self: center;
      width: 0; height: 2rem; pointer-events: none; transition: width .28s cubic-bezier(.22,.9,.3,1); }
    body.ikoneGore #ikoneGnijezdo, body.ikoneNosi #ikoneGnijezdo { width: var(--ikRed, 6.5rem); }
    /* Mobitel krece od manjeg zaglavlja, pa i stisak mora biti manji — inace
       se logo i brojac pocnu sudarati. Dok je izbornik otvoren ne stiscemo
       nista: nav je fixed na 54px od vrha i racuna na punu visinu trake. */
    body.zaglavljeMalo header { padding-top: 0.3125rem; padding-bottom: 0.3125rem; }
    body.izbornikOtvoren.zaglavljeMalo header { padding-top: 0.625rem; padding-bottom: 0.625rem; }
    header .logo { width: 2rem; height: 2rem; font-size: 0; position: relative; }
    header .logo::before { content: "\2630"; font-size: var(--t-xl); }
    body.izbornikOtvoren header .logo {
      background: var(--plava);
    }
    body.izbornikOtvoren header .logo::before {
      content: "C"; font-size: var(--t-m); font-family: var(--naslov); font-weight: 700;
    }
    header .valute { font-size: var(--t-xs); padding: 0.375rem 0.625rem; }
    #view { padding: 1rem 0.875rem 1.5rem; }

    header nav {
      display: none; position: fixed; left: 0; right: 0; top: 54px; z-index: 20;
      flex-direction: column; gap: 0.125rem; flex-wrap: nowrap;
      background: var(--card); border-bottom: 1px solid var(--rub);
      padding: 8px 10px calc(10px + env(safe-area-inset-bottom, 0px));
      box-shadow: 0 10px 24px rgba(25,23,19,.16);
      max-height: calc(100dvh - 3.5rem); overflow-y: auto;
    }
    /* header je sticky (z-index:10) pa stvara vlastiti sloj — bez ovoga
       #izbornikPozadina (z-index:19) legne preko otvorenog izbornika i guta klikove */
    body.izbornikOtvoren header { z-index: 21; }
    body.izbornikOtvoren header nav { display: flex; }
    header nav a {
      flex: none; min-width: 0; min-height: 0; border-radius: var(--rad-m);
      display: block; text-align: left;
      font-size: var(--t-l); padding: 0.875rem 0.875rem;
    }
    header nav a::after { content: none; }
    header nav a.navPocetna { display: block; }
    header nav a.aktivna { color: var(--ink); background: var(--tiho); font-weight: 700;
      box-shadow: inset 3px 0 0 var(--plava); }
    /* lebdeće ikonice (rječnik/igra/info) ne smiju plutati preko otvorenog izbornika */
    body.izbornikOtvoren #lebdi, body.izbornikOtvoren #lebdiIgra, body.izbornikOtvoren #lebdiInfo { display: none !important; }
  }

  /* ================= PROGRESS ================= */
  .progTabovi { display: flex; gap: 0.25rem; background: var(--tiho); padding: 0.25rem;
    border-radius: var(--rad-m); margin-bottom: 1.5rem; width: fit-content; max-width: 100%; flex-wrap: wrap; }
  .progTabovi button { border: 0; background: transparent; font-family: var(--naslov); font-weight: 600;
    font-size: var(--t-m); color: var(--muted); padding: 0.5rem 1rem; border-radius: var(--rad-s); cursor: pointer; }
  .progTabovi button.aktivan { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(25,23,19,.08); }
  .progTabovi button .br { font-size: var(--t-xs); font-weight: 500; opacity: .7; }

  .progNas { font-family: var(--naslov); font-size: var(--t-xl); font-weight: 600;
    margin: 2rem 0 0.25rem; letter-spacing: -0.01em; }
  .progOpis { color: var(--muted); font-size: var(--t-s); margin: 0 0 0.875rem; max-width: 46rem; }
  .progPloca { background: var(--card); border: 1px solid var(--rub); border-radius: var(--rad-l);
    padding: 1rem 1.125rem; }

  .progValute { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.75rem; margin-bottom: 0.75rem; }
  .progValK { background: var(--card); border: 1px solid var(--rub); border-radius: var(--rad-l);
    padding: 0.875rem 1rem; position: relative; overflow: hidden; }
  .progValK::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--boja); }
  .progValK .imeV { font-size: var(--t-xs); color: var(--muted); text-transform: uppercase;
    letter-spacing: .06em; font-weight: 600; }
  .progValK .broj { font-family: var(--naslov); font-size: var(--t-4xl); font-weight: 700;
    color: var(--boja); line-height: 1.05; margin: 0.125rem 0 0.375rem; }
  .progStaza { height: 5px; background: var(--tiho); border-radius: var(--rad-xs); overflow: hidden; }
  .progStaza i { display: block; height: 100%; width: 0; background: var(--boja);

  .progValK .doKud { font-size: var(--t-xs); color: var(--muted); margin-top: 0.375rem; }
  .progValK .doKud b { color: var(--ink); font-weight: 700; }
  .progValK.pun .doKud { color: var(--zelena); }
  /* Cijeli tečaj (27.09.2026.): namjerno tiho, ispod mreže, ne na vrhu — početniku bi
     "0,3 %" na vrhu stranice bilo obeshrabrujuće. Neutralna boja, tanka traka, sitan tekst. */
  .progCijeli { margin: 1.5rem 0 0; max-width: 30rem; color: var(--muted); font-size: var(--t-s); }
  .progCijeli .red { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.375rem; }
  .progCijeli .red span { color: var(--ink); font-weight: 600; }
  .progCijeli .red b { color: var(--plava); font-weight: 700; font-size: var(--t-l); font-variant-numeric: tabular-nums; }
  .progCijeli .progStaza { height: 7px; box-shadow: inset 0 0 0 1px var(--rub); }
  .progCijeli .progStaza i { background: var(--plava); min-width: 4px; }
  .progCijeli .pod { margin-top: 0.375rem; font-size: var(--t-xs); font-variant-numeric: tabular-nums; }

  .progStat { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.75rem; }
  .progStatK { background: var(--papir); border: 1px solid var(--rub); border-radius: var(--rad-m);
    padding: 0.625rem 0.75rem; }
  .progStatK .b { font-family: var(--naslov); font-size: var(--t-2xl); font-weight: 700; line-height: 1.1; }
  .progStatK .b small { font-size: var(--t-m); color: var(--muted); font-weight: 500; }
  .progStatK .l { font-size: var(--t-xs); color: var(--muted); }

  /* Mreza se vodi vodoravno, pa oba zaglavlja moraju ostati na ekranu — inace
     se pri pomicanju ne zna ni koja je razina ni koji stupac. Stupac s brojevima
     razina lijepi se ulijevo, redak s vrstama prema vrhu.
     overflow-y: clip drzi okvir izvan okomitog skrolanja (obicni overflow-x:auto
     bi racunao overflow-y:auto i napravio okvir vlastitim skrol-spremnikom, pa bi
     se redak lijepio za njega umjesto za ekran). */
  .progMrezaOkvir { overflow-x: auto; overflow-y: clip; padding-bottom: 0.25rem; }
  .progGlava, .progRazina, .progKut { background: var(--bg); }
  .progRazina, .progKut { position: sticky; left: 0; z-index: 2; }
  .progKut { z-index: 4; }
  .progMreza { display: grid; grid-template-columns: 2.5rem repeat(5, minmax(5.5rem, 1fr));
    gap: 0.3125rem; min-width: 34rem; }
  .progGlava { font-size: var(--t-xs); font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); padding: 0 0 0.25rem 0.125rem; }
  .progRazina { display: flex; align-items: center; justify-content: flex-end; padding-right: 0.375rem;
    font-size: var(--t-xs); color: var(--muted); font-variant-numeric: tabular-nums; }
  .progCelija { position: relative; border: 1px solid var(--rub); border-radius: var(--rad-m);
    background: var(--card); padding: 0.3125rem 0.4375rem 0.375rem; cursor: pointer; text-align: left;
    font: inherit; color: inherit; min-height: 2.5rem; display: flex; flex-direction: column;
    justify-content: space-between; transition: transform .12s, box-shadow .12s, border-color .12s; }
  .progCelija:hover { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(25,23,19,.09); border-color: var(--boja); }
  .progCelija .pct { font-family: var(--naslov); font-size: var(--t-s); font-weight: 700;
    font-variant-numeric: tabular-nums; }
  .progCelija .odn { font-size: var(--t-2xs); color: var(--muted); font-variant-numeric: tabular-nums; }
  .progCelija .progStaza { height: 3px; margin-top: 0.25rem; }
  .progCelija.nula .pct { color: var(--muted); font-weight: 600; }
  .progCelija.puna { background: color-mix(in srgb, var(--boja) 9%, var(--card));
    border-color: color-mix(in srgb, var(--boja) 35%, var(--rub)); }
  .progCelija.puna .pct { color: var(--boja); }
  .progCelija.puna .kvaka { position: absolute; top: 0.3125rem; right: 0.4375rem; color: var(--boja);
    font-size: var(--t-s); line-height: 1; }
