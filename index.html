<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Croland · info-v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============ SUSTAV VELIČINA ============================================
     Cijelo sučelje visi o jednom broju: font-size na <html>. Svaka veličina
     niže je u rem, pa se sve — tekst, razmaci, kartice, slike, tipke —
     skalira zajedno kad se korijen pomakne.

       --skala   množitelj koji postavlja korisnik (Options → Interface size)
                 i korekcija pisma; JS ga piše na documentElement.
       clamp()   fluidni dio: 16px do ~1200px širine, pa glatko do 19.2px
                 na 2560px. Baza je u rem (ne px!) da preglednikov zoom i
                 korisnikova zadana veličina fonta i dalje rade.
     ---------------------------------------------------------------------- */
  html {
    font-size: calc(var(--skala, 1) * clamp(1rem, 0.825rem + 0.235vw, 1.2rem));
  }

  :root {
    /* tipografija — 10 razina umjesto 37 nasumičnih vrijednosti */
    --t-2xs: 0.66rem;   /* brojke u stisnutoj mreži lekcija na mobitelu */
    --t-xs:  0.75rem;   /* oznake, kvake, sitni metapodaci */
    --t-s:   0.82rem;   /* pomoćni tekst, podnaslovi kartica */
    --t-m:   0.9rem;    /* sekundarno tijelo, navigacija, tablice */
    --t-l:   1rem;      /* tijelo teksta, gumbi, polja za unos */
    --t-xl:  1.15rem;   /* naslovi kartica, pitanja */
    --t-2xl: 1.35rem;   /* naslovi na mobitelu */
    --t-3xl: 1.6rem;    /* naslovi ekrana, velike riječi */
    --t-4xl: 2.1rem;    /* veliki brojevi (prsten, valute, streak) */
    --t-5xl: 3rem;      /* proslavne ikone */

    /* radijusi — 5 razina umjesto 15 */
    --rad-xs:  0.1875rem;  /* trakice napretka */
    --rad-s:   0.5rem;     /* gumbi, tipke, sitne značke */
    --rad-m:   0.625rem;   /* kartice u popisu, polja */
    --rad-l:   0.875rem;   /* ploče, veće kartice */
    --rad-xl:  1.125rem;   /* modali, bočni paneli */

    --bg: #f6f3ee; --card: #fffdfa; --ink: #191713; --muted: #8b8377;
    --plava: #9a5b52; --zelena: #2f6d4f; --crvena: #c2413c; --rub: #e3ddd2;
    --zlatna: #8a6d1f;
    --plavaVok: #23407a; --tinta: #1d1b17; --tiho: #f0ece4; --papir: #faf7f1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--tekst); font-size: var(--t-l); line-height: var(--font-visina);
    background: var(--bg); color: var(--ink); min-height: 100dvh;
  }

  header {
    background: var(--card); border-bottom: 1px solid var(--rub);
    padding: 0.75rem 1.25rem; display: flex; align-items: center; gap: 1rem;
    position: sticky; top: 0; z-index: 10;
  }
  header .logo {
    width: 1.75rem; height: 1.75rem; flex: none; border-radius: var(--rad-s);
    background: var(--plava); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--naslov); font-weight: 700; font-size: var(--t-m); line-height: 1;
    transition: filter .15s;
  }
  header .logo:hover { filter: brightness(1.08); }
  header nav { display: flex; gap: 0.25rem; flex-wrap: wrap; }
  header nav a {
    padding: 0.375rem 0.75rem; border-radius: var(--rad-s); color: var(--muted);
    text-decoration: none; font-size: var(--t-m); cursor: pointer;
  }
  header nav a:hover { background: var(--tiho); color: var(--ink); }
  header nav a.aktivna { background: var(--tiho); color: var(--ink); font-weight: 600; }
  header .valute { margin-left: auto; font-size: var(--t-s); color: var(--muted); white-space: nowrap;
    font-family: var(--naslov); font-weight: 600; padding: 0.375rem 0.75rem; border-radius: var(--rad-m); background: var(--tiho); }

  /* -- pozadina iza sklopivog izbornika (mobitel) -- */
  #izbornikPozadina { position: fixed; inset: 0; background: rgba(29,27,23,.28); z-index: 19; display: none; }
  #izbornikPozadina.vidi { display: block; }

  #view { max-width: 56.25rem; margin: 0 auto; padding: 1.5rem 1rem 4rem; }

  .naslovnica { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-top: 1.5rem; }
  .velikaPlocica {
    background: var(--card); border: 1px solid var(--rub); border-radius: var(--rad-l);
    padding: 2.5rem 1.5rem; text-align: center; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,.05); transition: transform .12s, border-color .15s;
  }
  .velikaPlocica:hover { transform: translateY(-2px); border-color: var(--plava); box-shadow: 0 6px 18px rgba(25,23,19,.07); }
  .velikaPlocica .ikona { font-size: var(--t-4xl); margin-bottom: 0.625rem; }
  .velikaPlocica .ime { font-weight: 600; font-size: var(--t-xl); }
  .velikaPlocica .pod { font-size: var(--t-s); color: var(--muted); margin-top: 0.375rem; }

  /* table-layout: fixed drži svih pet stupaca jednako širokima i, važnije,
     ne dopušta tablici da naraste preko #view — bez toga se mreža lekcija
     na uskom ekranu prelijeva i stranica se vodoravno pomiče. */
  table.mreza { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 0.375rem; }
  td.faza {
    background: var(--card); border: 1px solid var(--rub); border-radius: var(--rad-m);
    padding: 0.625rem 0.5rem; text-align: center; cursor: pointer; font-size: var(--t-s);
    transition: border-color .15s; min-width: 6.25rem;
  }
  td.faza:hover { border-color: var(--plava); }
  td.faza .imeF { font-weight: 600; font-size: var(--t-s); }
  td.faza .bod { color: var(--muted); font-size: var(--t-xs); margin-top: 0.25rem; }
  td.faza .bod strong { color: var(--zelena); }
  td.faza.zakljucano { opacity: .55; cursor: not-allowed; background: #f4f0e9; }
  td.faza.zakljucano:hover { border-color: var(--rub); }
  td.faza.pretplata { opacity: .7; background: #f4f0e9; border-color: var(--zlatna); }
  td.faza.prazno { opacity: .4; cursor: default; font-style: italic; }
  td.faza.gotovo { border-color: var(--zelena); }

  /* traka umjesto "12/40" — omjer se vidi bez računanja */
  td.faza .tr {
    height: 0.375rem; border-radius: var(--rad-xs); background: var(--rub);
    overflow: hidden; margin: 0.5rem 0.125rem 0.375rem;
  }
  td.faza .tr i {
    display: block; height: 100%; width: 0; border-radius: var(--rad-xs);
    background: var(--plava); transition: width .7s cubic-bezier(.22,1,.36,1);
  }
  td.faza.gotovo .tr i { background: var(--zelena); }
  td.faza.zakljucano .tr i { background: var(--zlatna); }
  td.faza .bodM { font-size: var(--t-xs); color: var(--muted); line-height: 1.35; }
  td.faza .bodM strong { color: var(--ink); }
  td.faza .ostalo { font-size: var(--t-xs); color: var(--zlatna); line-height: 1.35; }
  td.faza.gotovo .ostalo { color: var(--zelena); }

  /* daleka budućnost je zamagljena — hover je vraća u fokus */
  tr.dalek1 td.faza { opacity: .62; filter: blur(.4px); }
  tr.dalek2 td.faza { opacity: .42; filter: blur(1px); }
  tr.dalek3 td.faza { opacity: .26; filter: blur(1.8px); }
  tr.dalek1 td.faza, tr.dalek2 td.faza, tr.dalek3 td.faza { transition: opacity .2s, filter .2s; }
  tr.dalek1:hover td.faza, tr.dalek2:hover td.faza, tr.dalek3:hover td.faza { opacity: 1; filter: none; }
  .viseRazina {
    display: block; width: 100%; margin: 0.625rem 0 0; padding: 0.625rem 0.875rem;
    border: 1px dashed var(--rub); border-radius: var(--rad-m); background: var(--card);
    color: var(--muted); font-size: var(--t-s); cursor: pointer;
  }
  .viseRazina:hover { border-color: var(--plava); color: var(--plava); }

  /* Lesson 0 — uvodna cjelina: uvijek otključana, vizualno odvojena od mreže */
  .redNula { display: flex; justify-content: flex-end; margin-bottom: 0.75rem; }
  .plocicaNula {
    background: var(--card);
    border: 1px solid var(--rub); border-radius: var(--rad-m);
    padding: 0.625rem 1rem; cursor: pointer; text-align: right;
    transition: border-color .15s, transform .12s;
  }
  .plocicaNula:hover { border-color: var(--plava); transform: translateY(-1px); }
  .plocicaNula .imeF { font-weight: 700; font-size: var(--t-m); color: var(--ink); font-family: var(--naslov); }
  .plocicaNula .bod { font-size: var(--t-xs); color: var(--muted); margin-top: 0.125rem; }
  .plocicaNula.gotovo { background: #eaf3ec; border-color: var(--zelena); }
  .plocicaNula.gotovo .imeF { color: var(--zelena); }
  .plocicaNula.gotovo .bod { color: var(--muted); }

  .traka { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.875rem; flex-wrap: wrap; }
  .traka .natrag {
    padding: 0.375rem 0.875rem; border: 1px solid var(--rub); border-radius: var(--rad-s);
    background: var(--card); cursor: pointer; font-size: var(--t-s);
  }
  .traka h2 { font-size: var(--t-l); }
  .progresBar { flex: 1; min-width: 7.5rem; height: 0.5rem; background: var(--rub); border-radius: var(--rad-xs); overflow: hidden; }
  .progresBar div { height: 100%; background: var(--plava); border-radius: var(--rad-xs); transition: width .3s; }

  .vjezbeNav { display: flex; flex-wrap: wrap; gap: 0.375rem; margin-bottom: 1rem; }
  .vnav {
    display: inline-flex; flex-direction: column; align-items: stretch; gap: 0.25rem;
    padding: 0.375rem 0.625rem 0.375rem; border: 1px solid var(--rub); border-radius: var(--rad-s);
    background: var(--card); cursor: pointer; font-size: var(--t-s); color: var(--muted);
    min-width: 2.5rem; text-align: center; transition: border-color .15s, background .15s;
  }
  .vnav:hover { border-color: var(--plava); }
  .vnav.aktivna { border-color: var(--plava); background: #f4ebe9; color: var(--ink); font-weight: 600; }
  .vnav.zavrsena { border-color: var(--zelena); color: var(--zelena); }
  .vnav.zavrsena.aktivna { background: #eaf3ec; }
  .vnav.djelom { border-color: var(--zlatna); color: var(--zlatna); }
  /* trakica bodova ispod broja stranice */
  .vtr { display: block; height: 0.25rem; border-radius: var(--rad-xs); background: var(--rub); overflow: hidden; }
  .vtr i {
    display: block; height: 100%; width: 0; border-radius: var(--rad-xs);
    background: var(--zlatna); transition: width .6s cubic-bezier(.22,1,.36,1);
  }
  .vnav.zavrsena .vtr i { background: var(--zelena); }
  .vnav.vfin { border-style: dashed; }
  .vnav.vfin.aktivna { border-style: solid; }

  #ploca {
    background: var(--card); border: 1px solid var(--rub); border-radius: var(--rad-l);
    padding: 1.25rem; box-shadow: 0 2px 8px rgba(0,0,0,.06); max-width: 37.5rem; margin: 0 auto;
  }
  #opisIgre { color: var(--muted); margin: 0 auto 0.625rem; font-size: var(--t-m); max-width: 37.5rem; text-align: center; }
  #statusTraka { display: flex; justify-content: space-between; margin-bottom: 0.875rem; font-size: var(--t-m); color: var(--muted); }

  .stupci { display: flex; gap: 0.875rem; }
  .stupac { flex: 1; display: flex; flex-direction: column; gap: 0.625rem; }
  .stupac h2 { font-size: var(--t-s); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); text-align: center; }

  .rijec, .opcija, .plocica, .poolRijec {
    padding: 0.75rem 0.625rem; border: 2px solid var(--rub); border-radius: var(--rad-m);
    background: #fffdfa; font-size: var(--t-l); cursor: pointer; text-align: center;
    transition: background .15s, border-color .15s; user-select: none;
  }
  .rijec:hover, .opcija:hover, .plocica:hover, .poolRijec:hover { border-color: var(--plava); }
  .odabrano { border-color: var(--plava) !important; background: #f4ebe9 !important; }
  .tocno { border-color: var(--zelena) !important; background: #eaf3ec !important; color: var(--zelena); cursor: default; }
  .krivo { border-color: var(--crvena) !important; background: #fbeceb !important; animation: tres .3s; }
  @keyframes tres { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

  .pitanjeText { font-size: var(--t-xl); text-align: center; margin-bottom: 1rem; line-height: 1.5; }
  .opcije { display: flex; flex-direction: column; gap: 0.625rem; }
  .pricaBox {
    background: #faf7f1; border: 1px solid var(--rub); border-radius: var(--rad-m);
    padding: 0.75rem 0.875rem; margin-bottom: 0.875rem; font-size: var(--t-l); line-height: 1.6; font-style: italic;
  }
  .mrezaMem { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
  .kartaMem {
    aspect-ratio: 3/2; display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 2px solid var(--rub); border-radius: var(--rad-m); background: var(--plava);
    color: #fff; font-size: var(--t-s); cursor: pointer; user-select: none;
    text-align: center; padding: 0.25rem; overflow: hidden;
  }
  .kartaMem.otvoreno { background: #fffdfa; color: var(--ink); border-color: var(--plava); }
  .kartaMem.rijeseno { background: #eaf3ec; color: var(--zelena); border-color: var(--zelena); cursor: default; }

  .plocice { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; }
  .plocica, .poolRijec { flex: 0 0 auto; }
  #odgovorRed {
    min-height: 3.5rem; display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center;
    border: 2px dashed var(--rub); border-radius: var(--rad-m); padding: 0.5rem; margin-bottom: 0.875rem;
  }
  .stupciSort { display: flex; gap: 0.625rem; margin-bottom: 0.875rem; }
  .stupacBox { flex: 1; border: 2px solid var(--rub); border-radius: var(--rad-m); padding: 0.5rem; min-height: 6.25rem; cursor: pointer; }
  .stupacBox:hover { border-color: var(--plava); }
  .stupacBox h3 { font-size: var(--t-s); text-align: center; color: var(--muted); margin-bottom: 0.5rem; }
  .stupacBox .smjesteno { font-size: var(--t-s); text-align: center; padding: 0.25rem; color: var(--zelena); }
  .pool { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; }

  .upisInput { width: 100%; padding: 0.75rem; font-size: var(--t-l); border: 2px solid var(--rub); border-radius: var(--rad-m); text-align: center; margin-bottom: 0.625rem; }
  .upisInput:focus { outline: none; border-color: var(--plava); }
  /* hrvatska slova kojih nema na engleskoj tipkovnici */
  .tipkeHr { display: flex; flex-wrap: wrap; gap: 0.375rem; justify-content: center; margin-bottom: 0.75rem; }
  .tipkaHr {
    min-width: 2.5rem; padding: 0.5rem 0.625rem; border: 1px solid var(--rub); border-radius: var(--rad-s);
    background: var(--card); font-family: inherit; font-size: var(--t-l); font-weight: 700;
    color: var(--ink); cursor: pointer; transition: border-color .15s, background .15s;
  }
  .tipkaHr:hover { border-color: var(--plava); background: #f7f1ef; }
  .tipkaHr:active { background: #f4ebe9; }
  .otkriveno { text-align: center; color: var(--crvena); font-size: var(--t-m); margin-bottom: 0.5rem; min-height: 1.2em; }

  /* ---- nastavak: tapni završetak pridjeva ---- */
  .engNast { text-align: center; color: var(--muted); font-style: italic; font-size: var(--t-l); margin-bottom: 0.375rem; }
  .recNast {
    text-align: center; font-size: var(--t-3xl); font-weight: 600; line-height: 1.5;
    margin: 0.375rem 0 1.25rem; word-break: break-word;
  }
  .slotNast {
    display: inline-block; min-width: 2rem; border-bottom: 3px solid var(--plava);
    text-align: center; color: var(--plava);
  }
  .slotNast.dobar { color: var(--zelena); border-bottom-color: var(--zelena); }
  .slotNast.los { color: var(--crvena); border-bottom-color: var(--crvena); }
  .tipkeNast { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
  .tipkaNast {
    min-width: 5.5rem; padding: 1rem 1.25rem; border: 2px solid var(--rub); border-radius: var(--rad-l);
    background: var(--card); font-family: inherit; font-size: var(--t-3xl); font-weight: 700;
    color: var(--ink); cursor: pointer; transition: transform .12s, border-color .15s, background .15s;
  }
  .tipkaNast:hover { border-color: var(--plava); transform: translateY(-2px); }
  @media (max-width: 640px) { .recNast { font-size: var(--t-2xl); } .tipkaNast { min-width: 4.5rem; padding: 0.875rem 0.875rem; font-size: var(--t-2xl); } }
  /* ---- objašnjenja (format: tekst) ---- */
  /* Šira ploča i zračniji odlomci: pravilo se čita, ne rješava, pa mu treba prostora. */
  #ploca.siroka { max-width: 48.75rem; }
  #ploca.siroka #sadrzaj { text-align: left; }
  .odlomak { line-height: 1.75; margin-bottom: 1.25rem; font-size: var(--t-l); text-align: left; }
  .odlomak:last-of-type { margin-bottom: 0.5rem; }
  .odlomak em { color: var(--plava); font-style: italic; }
  /* uvodna podebljana najava dobiva vlastiti redak umjesto da se stisne uz tekst */
  .odlomak .vodilja {
    display: block; color: var(--plava); font-size: var(--t-s); font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase; margin-bottom: 0.375rem;
  }
  /* ---- Blobby: njegove rečenice izlaze iz oblačića ---- */
  .blobbyRed { display: flex; align-items: flex-end; gap: 0.75rem; margin: 0.25rem 0 1.5rem; }
  .blobbySlika { width: 5.5rem; height: auto; flex: 0 0 5.5rem; user-select: none; }
  .blobbyOblacic {
    position: relative; flex: 1 1 auto; background: #fff;
    border: 1px solid var(--rub); border-radius: var(--rad-l); padding: 0.875rem 1rem 0.375rem;
    box-shadow: 0 1px 3px rgba(25,23,19,.05);
  }
  /* repić prema Blobbyjevim ustima */
  .blobbyOblacic::before, .blobbyOblacic::after {
    content: ''; position: absolute; bottom: 20px; width: 0; height: 0;
    border-top: 9px solid transparent; border-bottom: 9px solid transparent;
  }
  .blobbyOblacic::before { left: -11px; border-right: 11px solid var(--rub); }
  .blobbyOblacic::after  { left: -10px; border-right: 11px solid #fff; }
  .blobbyOblacic .odlomak { margin-bottom: 0.75rem; }
  .blobbyOblacic .odlomak:last-child { margin-bottom: 0.5rem; }
  @media (max-width: 640px) {
    .blobbySlika { width: 4rem; flex: 0 0 4rem; }
    .blobbyRed { gap: 0.625rem; }
  }
  /* tablica u objašnjenju: "- tab: A | B | C" u md-u */
  .tabObjasnjenje {
    width: 100%; border-collapse: collapse; margin: 0.25rem 0 1.5rem; font-size: var(--t-l);
    background: #faf7f1; border: 1px solid var(--rub); border-radius: var(--rad-m); overflow: hidden;
  }
  .tabObjasnjenje th, .tabObjasnjenje td { padding: 0.625rem 0.875rem; text-align: left; border-bottom: 1px solid var(--rub); }
  .tabObjasnjenje thead th {
    background: #f0ece4; color: var(--plava); font-size: var(--t-xs);
    text-transform: uppercase; letter-spacing: .05em;
  }
  .tabObjasnjenje tbody tr:last-child th, .tabObjasnjenje tbody tr:last-child td { border-bottom: none; }
  .tabObjasnjenje td em, .tabObjasnjenje th em { color: var(--plava); font-style: italic; }
  .tabObjasnjenje tbody th { font-weight: 600; white-space: nowrap; color: var(--muted); }
  @media (max-width: 640px) { .tabObjasnjenje { font-size: var(--t-s); } .tabObjasnjenje th, .tabObjasnjenje td { padding: 0.5rem 0.5rem; } }
  .prijevodGumb {
    display: inline-block; margin-left: 0.5rem; padding: 0 0.375rem; font-size: var(--t-xs); font-weight: 700;
    color: var(--muted); border: 1px solid var(--rub); border-radius: var(--rad-s); cursor: pointer;
    user-select: none; vertical-align: middle; line-height: 1.5;
  }
  .prijevodGumb:hover { border-color: var(--plava); color: var(--plava); }
  .zvucnik {
    font-size: .85em; opacity: .45; cursor: pointer; margin-left: 0.375rem;
    user-select: none; vertical-align: middle; display: inline-block;
    transition: opacity .15s, transform .15s;
  }
  .zvucnik:hover { opacity: 1; transform: scale(1.15); }
  .prijevodGumb.aktivan { background: var(--plava); border-color: var(--plava); color: #fff; }
  .prijevodTekst { display: block; color: var(--muted); font-style: italic; font-size: var(--t-m); }
  .prijevodZadatak { text-align: center; color: var(--muted); font-style: italic; margin-bottom: 0.75rem; }
  .mrezaVok { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.625rem; margin-bottom: 0.375rem; }
  .kartaVok { border: 2px solid var(--rub); border-radius: var(--rad-m); padding: 0.75rem; cursor: pointer; background: #fffdfa; text-align: center; }
  .kartaVok:hover { border-color: var(--plava); }
  .kartaVok .hr { font-size: var(--t-l); font-weight: 600; }
  .kartaVok .en { font-size: var(--t-s); color: var(--muted); margin-top: 0.25rem; visibility: hidden; }
  .kartaVok.otkriven .en { visibility: visible; }
  /* riječ koju polaznik već ima u rječniku (npr. iz Lesson 0) */
  .kartaVok.imaVec { border-color: var(--zelena); background: #f4f9f5; }
  .kartaVok .vecZnas { font-size: var(--t-xs); font-weight: 700; color: var(--zelena); margin-top: 0.375rem; letter-spacing: .02em; }
  .chat { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 0.875rem; }
  .msg { max-width: 85%; padding: 0.625rem 0.875rem; border-radius: var(--rad-l); font-size: var(--t-l); line-height: 1.45; }
  .msgNpc { background: #f0ece4; align-self: flex-start; border-bottom-left-radius: var(--rad-xs); }
  .msgTi { background: #f4ebe9; align-self: flex-end; border-bottom-right-radius: var(--rad-xs); }
  .slikaIgra { display: block; max-width: 100%; max-height: 10rem; margin: 0 auto 0.625rem; border-radius: var(--rad-m); object-fit: contain; }
  .slikaMala { display: block; max-width: 100%; max-height: 4rem; margin: 0 auto 0.375rem; border-radius: var(--rad-s); object-fit: contain; }
  .slikaMem { display: block; max-width: 90%; max-height: 2.5rem; margin: 0 auto 0.125rem; border-radius: var(--rad-xs); object-fit: contain; }
  .rijecMem { font-size: var(--t-s); font-weight: 600; line-height: 1.15; word-break: break-word; }
  .rijecMem.samo { font-size: var(--t-l); }
  .kartaMem.samoSlika { padding: 0.25rem; }
  .kartaMem.samoSlika .slikaMem { max-width: 100%; max-height: 100%; margin: 0; }

  #rezultat { display: none; text-align: center; padding: 0.75rem 0 0; }
  #rezultat .veliki { font-size: var(--t-xl); font-weight: 600; color: var(--zelena); margin-bottom: 0.375rem; }
  button.gumb {
    margin-top: 0.875rem; width: 100%; padding: 0.75rem; border: none; border-radius: var(--rad-m);
    background: var(--plava); color: #fff; font-size: var(--t-l); cursor: pointer;
  }
  button.gumb { font-family: inherit; font-weight: 600; }
  button.gumb:hover { filter: brightness(1.08); }
  button.gumbSivi { background: #6f675c; }

  .sazetak { background: var(--card); border: 1px solid var(--rub); border-radius: var(--rad-l); padding: 1.5rem; max-width: 37.5rem; margin: 0 auto; }
  .sazetak h2 { margin-bottom: 0.375rem; }
  .sazetak .velikiBroj { font-size: var(--t-4xl); font-weight: 700; color: var(--plava); margin: 0.625rem 0; }
  .sazetak ul { list-style: none; margin: 0.875rem 0; }
  .sazetak li { display: flex; justify-content: space-between; padding: 0.375rem 0; border-bottom: 1px dashed var(--rub); font-size: var(--t-m); }

  /* ---- završna stranica lekcije: prsten, stupci, preostalo ---- */
  .sazUlaz { animation: sazUlazAnim .45s cubic-bezier(.22,1,.36,1) both; }
  @keyframes sazUlazAnim { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .prsten { position: relative; width: 11.875rem; height: 11.875rem; margin: 0.375rem auto 0.25rem; }
  .prsten svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .prsten .pozadina { fill: none; stroke: var(--rub); stroke-width: 14; }
  .prsten .luk {
    fill: none; stroke: var(--plava); stroke-width: 14; stroke-linecap: round;
    transition: stroke-dashoffset 1.2s cubic-bezier(.22,1,.36,1), stroke .4s;
  }
  .prsten.zlato .luk { stroke: var(--zlatna); }
  .prsten.zeleno .luk { stroke: var(--zelena); }
  .prsten .sredina {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 0.125rem;
  }
  .prsten .pct { font-size: var(--t-4xl); font-weight: 700; line-height: 1; color: var(--plava); }
  .prsten.zlato .pct { color: var(--zlatna); }
  .prsten.zeleno .pct { color: var(--zelena); }
  .prsten .bodovi { font-size: var(--t-s); color: var(--muted); }

  .sazBarovi { list-style: none; margin: 1.25rem 0 0.375rem; }
  .sazRed {
    display: grid; grid-template-columns: 1fr auto; gap: 0.125rem 0.625rem;
    align-items: center; padding: 0.5rem 0; border-bottom: 1px dashed var(--rub); font-size: var(--t-m);
  }
  .sazRed .ime { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sazRed .pts { color: var(--muted); font-size: var(--t-s); white-space: nowrap; }
  .sazRed .pts strong { color: var(--ink); }
  .sazRed .sbar { grid-column: 1 / -1; height: 0.375rem; border-radius: var(--rad-xs); background: var(--rub); overflow: hidden; }
  .sazRed .sbar i {
    display: block; height: 100%; width: 0; border-radius: var(--rad-xs);
    background: var(--zlatna); transition: width .7s cubic-bezier(.22,1,.36,1);
  }
  .sazRed.pun .sbar i { background: var(--zelena); }
  .sazRed.nula .sbar i { background: var(--rub); }
  .sazRed.pun .pts strong { color: var(--zelena); }
  .sazRed .ime .oznaka { color: var(--muted); font-size: var(--t-s); margin-left: 0.375rem; }
  .sazRed { cursor: pointer; }
  .sazRed:hover .ime { color: var(--plava); }

  .preostaloBox {
    margin-top: 0.875rem; padding: 0.75rem 0.875rem; border-radius: var(--rad-m);
    background: #fdf6e8; border: 1px solid #e0cf9a; color: #7a5f15; font-size: var(--t-m);
  }
  .preostaloBox.sve { background: #eaf3ec; border-color: #cfe3d6; color: #2f6d4f; }
  .preostaloBox strong { font-weight: 700; }

  /* ---- Test: jedan komad, vlastiti sat, rezultat tek na kraju ---- */
  .testSat {
    font-variant-numeric: tabular-nums; font-weight: 700; font-size: var(--t-l);
    padding: 0.25rem 0.625rem; border-radius: var(--rad-s); background: #f0ece4; color: var(--ink);
    border: 1px solid var(--rub); white-space: nowrap;
  }
  .testSat.pri.kraju, .testSat.zadnjaMinuta { background: #fbeceb; border-color: var(--crvena); color: var(--crvena); }
  .testPauza {
    padding: 0.375rem 0.75rem; border: 1px solid var(--rub); border-radius: var(--rad-s); background: var(--card);
    cursor: pointer; font-size: var(--t-s); color: var(--muted); white-space: nowrap;
  }
  .testPauza:hover { border-color: var(--plava); color: var(--ink); }
  .testZastor {
    position: fixed; inset: 0; z-index: 60; background: rgba(29,27,23,.94);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1rem; color: #fff; text-align: center; padding: 1.5rem;
  }
  .testZastor .naslovP { font-size: var(--t-3xl); font-weight: 700; }
  .testZastor .podP { color: #c8c1b5; max-width: 23.75rem; line-height: 1.5; }
  .testUvod { background: var(--card); border: 1px solid var(--rub); border-radius: var(--rad-l); padding: 1.5rem; max-width: 37.5rem; margin: 0 auto; }
  .testUvod h2 { margin-bottom: 0.625rem; }
  .testUvod ul { list-style: none; margin: 0.875rem 0; }
  .testUvod li { padding: 0.5rem 0; border-bottom: 1px dashed var(--rub); font-size: var(--t-l); display: flex; gap: 0.625rem; align-items: flex-start; }
  .testUvod li:last-child { border-bottom: none; }
  .testUvod li .ik { width: 1.5rem; flex: none; text-align: center; }
  .testUpozorenje { color: var(--muted); font-size: var(--t-s); margin-top: 0.625rem; text-align: center; }

  /* Gramatika iz rjecnik.js — tablica oblika u detaljima riječi */
  .gramRed { display: block; padding: 0.5rem 0 0.125rem; }
  .gramRed .oznaka { display: block; margin-bottom: 0.25rem; }
  .gramPodnaslov { font-size: var(--t-xs); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 0.5rem 0 0.125rem; }
  .gramTab { width: 100%; border-collapse: collapse; font-size: var(--t-s); margin-top: 0.25rem; }
  .gramTab th, .gramTab td { padding: 0.25rem 0.5rem; text-align: left; border-bottom: 1px solid var(--rub); }
  .gramTab th { font-weight: 600; color: var(--plava); white-space: nowrap; }
  .gramTab td { font-variant-numeric: tabular-nums; }
  .gramTab tr:last-child th, .gramTab tr:last-child td { border-bottom: none; }
  .gramOznake { display: flex; flex-wrap: wrap; gap: 0.375rem; margin-bottom: 0.375rem; }
  .gramOznaka { background: var(--plava); color: #fff; border-radius: 999px; padding: 0.125rem 0.625rem; font-size: var(--t-xs); }
  .gramNapomena { font-size: var(--t-s); opacity: .8; margin-top: 0.375rem; font-style: italic; }

  /* Prekidači na stranici Dictionary — smjer i opseg */
  .dictPrekidac { display: flex; gap: 0.375rem; margin-bottom: 0.5rem; max-width: 32.5rem; }
  .dictPrekidac div { flex: 1; text-align: center; padding: 0.5rem 0.375rem; border-radius: var(--rad-s); cursor: pointer;
    border: 1px solid var(--rub); background: var(--card); font-size: var(--t-s); user-select: none; }
  .dictPrekidac div:hover { border-color: var(--plava); }
  .dictPrekidac div.aktivan { background: var(--plava); color: #fff; border-color: var(--plava); }
  .dictBrojac { color: var(--muted); font-size: var(--t-s); margin: 0 0 0.625rem; }

  /* Dictionary → Word test (nebodovana vježba upisa) */
  .wtPokreni { display: block; width: 100%; max-width: 32.5rem; margin: 0 0 0.875rem; padding: 0.75rem 0.875rem;
    border-radius: var(--rad-m); border: 1px solid var(--plava); background: var(--plava); color: #fff;
    font-family: inherit; font-size: var(--t-m); font-weight: 600; cursor: pointer; }
  .wtPokreni:hover { filter: brightness(1.08); }
  .wtOkvir { max-width: 32.5rem; }
  .wtTraka { display: flex; justify-content: space-between; align-items: center; gap: 0.625rem; margin-bottom: 0.625rem; }
  .wtSmjer { display: flex; gap: 0.375rem; }
  .wtSmjer button, .wtFilterG { padding: 0.5rem 0.75rem; border-radius: var(--rad-s); border: 1px solid var(--rub);
    background: var(--card); cursor: pointer; font-family: inherit; font-size: var(--t-m); color: var(--ink); }
  .wtSmjer button:hover, .wtFilterG:hover { border-color: var(--plava); }
  .wtSmjer button.aktivan { background: var(--plava); color: #fff; border-color: var(--plava); }
  .wtFilterG.otvoren { background: var(--plava); color: #fff; border-color: var(--plava); }
  .wtFilterPanel { border: 1px solid var(--rub); background: var(--card); border-radius: var(--rad-m);
    padding: 0.75rem; margin-bottom: 0.75rem; }
  .wtFilterPanel .dictPrekidac { margin-bottom: 0.25rem; max-width: none; }
  .wtNapomena { color: var(--muted); font-size: var(--t-s); margin: 0.5rem 0 0; }
  .wtBrojevi { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.375rem; margin-top: 0.5rem; }
  .wtBrojevi button { padding: 0.5rem 0; border-radius: var(--rad-s); border: 1px solid var(--rub); background: var(--bg);
    cursor: pointer; font-family: inherit; font-size: var(--t-s); color: var(--ink); }
  .wtBrojevi button:hover { border-color: var(--plava); }
  .wtBrojevi button.aktivan { background: var(--plava); color: #fff; border-color: var(--plava); }
  .wtStat { color: var(--muted); font-size: var(--t-s); margin: 0 0 0.875rem; }
  .wtOznaka { text-align: center; color: var(--muted); font-size: var(--t-xs);
    text-transform: uppercase; letter-spacing: .05em; }
  .wtRijec { font-size: var(--t-3xl); font-weight: 700; text-align: center; margin: 0.5rem 0 1.25rem; line-height: 1.3; }
  .wtRez { text-align: center; font-size: var(--t-m); min-height: 2.6em; margin: 0.5rem 0; line-height: 1.5; }
  .wtRez .ok { color: var(--zelena); font-weight: 700; }
  .wtRez .ne { color: var(--crvena); font-weight: 700; }
  .wtRez .isp { font-weight: 700; }
  .wtRez .jos { display: block; color: var(--muted); font-size: var(--t-s); margin-top: 0.25rem; }
  .wtIzlaz { background: var(--card) !important; color: var(--muted) !important;
    border: 1px solid var(--rub) !important; }

  .rjecnikTraka { display: flex; gap: 0.625rem; margin-bottom: 1rem; }
  .rjecnikTraka input { flex: 1; padding: 0.625rem 0.875rem; border: 1px solid var(--rub); border-radius: var(--rad-m); font-size: var(--t-l); }
  .rijecKart { background: var(--card); border: 1px solid var(--rub); border-radius: var(--rad-m); margin-bottom: 0.375rem; }
  .rijecKart.imaDet .rijecRed { cursor: pointer; }
  .rijecKart.imaDet:hover { border-color: var(--plava); }
  .rijecRed { padding: 0.625rem 1rem; display: flex; justify-content: space-between; gap: 0.625rem; font-size: var(--t-l); flex-wrap: wrap; align-items: center; }
  .rijecRed .hrR { font-weight: 600; }
  .rijecRed .enR { color: var(--muted); }
  .rijecRed .izvorR { color: var(--muted); font-size: var(--t-xs); }
  .strelicaDet { color: var(--muted); font-size: var(--t-xs); margin-left: 0.375rem; display: inline-block; transition: transform .15s; }
  .rijecKart.otvoren .strelicaDet { transform: rotate(180deg); }
  .rijecDetalj { display: none; padding: 0.125rem 1rem 0.75rem; border-top: 1px dashed var(--rub); margin-top: -0.125rem; font-size: var(--t-m); }
  .rijecKart.otvoren .rijecDetalj { display: block; }
  .detRed { display: flex; gap: 0.625rem; padding: 0.375rem 0; flex-wrap: wrap; }
  .detRed .oznaka { color: var(--muted); font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .04em; min-width: 6rem; padding-top: 0.125rem; }
  .izgovorR { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; color: var(--plava); }
  /* rod/broj = metapodatak, ne dio natuknice */
  .rodR {
    display: inline-block; margin-left: 0.375rem; padding: 0.125rem 0.375rem; border-radius: var(--rad-s);
    background: var(--bg); border: 1px solid var(--rub);
    color: var(--muted); font-size: var(--t-xs); font-weight: 600; font-style: italic; vertical-align: middle;
  }
  /* slika se vidi tek kad se kartica otvori — u popisu bi bila presitna */
  .slikaDet { max-width: 11.875rem; max-height: 11.875rem; width: auto; height: auto;
    object-fit: contain; border-radius: var(--rad-m); background: var(--bg); border: 1px solid var(--rub); padding: 0.25rem; }
  .rjPrazno { padding: 1.25rem 0.375rem; color: var(--muted); font-size: var(--t-m); text-align: center; }

  .dcRed { background: var(--card); border: 1px solid var(--rub); border-radius: var(--rad-m); padding: 0.875rem 1.25rem; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .dcRed:hover { border-color: var(--plava); }
  .dcRed .pct { color: var(--zelena); font-weight: 600; }
  .dcDatum { color: var(--muted); font-size: var(--t-s); margin: 0 0 0.375rem 0.125rem; letter-spacing: .02em; }
  .dcNapomena { color: var(--muted); font-size: var(--t-s); margin: 0.5rem 0 0 0.125rem; }
  .streakK { display: flex; align-items: center; gap: 1rem; background: var(--card); border: 1px solid var(--rub); border-radius: var(--rad-m); padding: 0.875rem 1.25rem; margin-bottom: 1.25rem; }
  .streakBroj { font-size: var(--t-4xl); font-weight: 700; white-space: nowrap; }
  .streakOpis { font-size: var(--t-s); color: var(--muted); line-height: 1.45; }
  .streakOpis strong { color: var(--ink); font-size: var(--t-l); }

  .dropzona {
    border: 2px dashed var(--rub); border-radius: var(--rad-l); padding: 2rem; text-align: center;
    color: var(--muted); margin: 0.875rem 0; transition: border-color .15s, background .15s;
  }
  .dropzona.aktivno { border-color: var(--plava); background: #f7f1ef; }
  .valutaKartice { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.625rem; margin: 1rem 0; }
  .valutaK { background: var(--card); border: 1px solid var(--rub); border-radius: var(--rad-m); padding: 1rem; text-align: center; }
  .valutaK .broj { font-size: var(--t-3xl); font-weight: 700; color: var(--plava); font-family: var(--naslov); }
  .valutaK:nth-child(2) .broj { color: var(--plavaVok); }
  .valutaK:nth-child(3) .broj { color: var(--zelena); }
  .valutaK:nth-child(4) .broj { color: var(--zlatna); }
  .valutaK .imeV { font-size: var(--t-s); color: var(--muted); }
  .zakljBanner { text-align: center; color: var(--muted); padding: 2.5rem 0; }
  h1.sekcija { font-size: var(--t-3xl); margin-bottom: 1rem; font-family: var(--naslov);
    font-weight: 600; letter-spacing: -.025em; }
  .traka h2, .sazetak h2, .testUvod h2, .otkljModal h2,
  .miniKart .ime, .velikaPlocica .ime { font-family: var(--naslov); letter-spacing: -.01em; }
  .prsten .pct, .valutaK .broj, .streakBroj, .sazetak .velikiBroj,
  .testSat, .miniKart .broj { font-family: var(--naslov); }

  /* --- nagrade i otključavanja --- */
  @keyframes popIn { 0% { transform: scale(.75); opacity: 0; } 70% { transform: scale(1.05); } 100% { transform: scale(1); opacity: 1; } }
  #rezultat.pokazi { animation: popIn .4s ease; }
  @keyframes skokV { 0% { transform: scale(1); } 40% { transform: scale(1.25); color: var(--zelena); } 100% { transform: scale(1); } }
  header .valute.skok { animation: skokV .6s ease; }
  .ciljBox {
    margin: 0.75rem auto 0; max-width: 21.25rem; font-size: var(--t-s); color: var(--muted);
    background: #faf7f1; border: 1px solid var(--rub); border-radius: var(--rad-m); padding: 0.625rem 0.875rem;
  }
  .ciljBox strong { color: var(--plava); }
  .stanjeLekcije {
    margin-top: 0.875rem; padding: 0.625rem 0.875rem; border-radius: var(--rad-m);
    background: #faf7f1; border: 1px solid var(--rub); font-size: var(--t-m); text-align: left;
  }
  .stanjeLekcije strong { color: var(--zelena); font-size: var(--t-l); }
  .stanjeLekcije .opusti { display: block; margin-top: 0.375rem; color: var(--muted); font-size: var(--t-s); }
  .ciljBar { height: 0.5rem; background: var(--rub); border-radius: var(--rad-xs); overflow: hidden; margin-top: 0.5rem; }
  .ciljBar div { height: 100%; background: linear-gradient(90deg, var(--plava), var(--zelena)); border-radius: var(--rad-xs); transition: width .6s ease; }
  #otkljOverlay, #potvrdaOverlay, #karticaOverlay, #otvorenoOverlay {
    position: fixed; inset: 0; background: rgba(29,27,23,.5); z-index: 100;
    display: flex; align-items: center; justify-content: center; padding: 1rem;
  }
  #kontrole { display: flex; gap: 0.625rem; justify-content: center; margin-top: 1.25rem; }
  #kontrole .gumb { font-size: .85em; padding: 0.5rem 0.875rem; margin: 0; }

  /* ============ LESSON 0 — mehanike, traka abecede, lebdeći rječnik ============ */

  /* -- spajanje -- */
  .mrezaSpoj { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; }
  .poljeSpoj {
    background: var(--card); border: 2px solid var(--rub); border-radius: var(--rad-l);
    padding: 0.5rem; text-align: center; cursor: pointer; transition: border-color .15s, transform .12s;
  }
  .poljeSpoj img { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; pointer-events: none; }
  .poljeSpoj.odabran { border-color: var(--plava); transform: translateY(-2px); }
  .poljeSpoj.rijesen { border-color: var(--zelena); }
  .poljeSpoj .natpis { font-weight: 700; font-size: var(--t-l); color: var(--zelena); margin-top: 0.125rem; min-height: 1.25em; }
  .cipovi { display: flex; flex-wrap: wrap; gap: 0.625rem; justify-content: center; margin-top: 1.25rem; }
  .cipSpoj {
    background: var(--card); border: 2px solid var(--rub); border-radius: 999px;
    padding: 0.625rem 1.25rem; font-size: var(--t-l); font-weight: 600; cursor: pointer;
    transition: border-color .15s, transform .12s, opacity .2s;
  }
  .cipSpoj.odabran { border-color: var(--plava); transform: translateY(-2px); }
  .cipSpoj.potroseno { opacity: 0; pointer-events: none; }
  .tresi { animation: tresiL0 .32s; }
  @keyframes tresiL0 { 0%,100% { transform: translateX(0);} 25% { transform: translateX(-6px);} 75% { transform: translateX(6px);} }

  /* -- baloni -- */
  #nebo { position: relative; height: 20rem; background: linear-gradient(#f4f0e9, #fffdfa);
    border: 1px solid var(--rub); border-radius: var(--rad-l); overflow: hidden; }
  .balon { position: absolute; padding: 0.625rem 1rem; border-radius: 999px; background: var(--card);
    border: 2px solid var(--plava); font-weight: 600; font-size: var(--t-l); cursor: pointer;

  .metaL0 img { width: 7.375rem; height: 7.375rem; object-fit: contain; }

  /* -- skupljena abeceda na sažetku lekcije 0 -- */
  .abcProslava { display: flex; flex-wrap: wrap; gap: 0.25rem; justify-content: center; margin: 1rem 0 0.625rem; }
  .slovoProslava { min-width: 1.5rem; height: 1.75rem; padding: 0 0.25rem; border-radius: var(--rad-s);
    display: flex; align-items: center; justify-content: center; font-size: var(--t-s); font-weight: 700;

  /* -- slova (anagram s digrafima) -- */

  /* ime mora ostati specifično: "prazno" je zauzeto za td.faza.prazno u mreži Lessons */
  .slagPrazno { width: 3rem; height: 3.5rem; border-bottom: 3px solid var(--rub); display: flex;
    align-items: center; justify-content: center; font-size: var(--t-3xl); font-weight: 700; text-transform: uppercase; }
  .slagPrazno.pun { border-bottom-color: var(--plava); }
  .plocice { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; }
  .plocica { min-width: 3rem; height: 3.5rem; padding: 0 0.625rem; border-radius: var(--rad-m); background: var(--card);
    border: 2px solid var(--rub); font-size: var(--t-2xl); font-weight: 700; cursor: pointer;

  /* -- pamti pa piši -- */
  .bljesak { display: flex; gap: 0.875rem; justify-content: center; min-height: 9.125rem; align-items: center; }
  .bljesak img { width: 7.875rem; height: 7.875rem; object-fit: contain; }
  .redoslijed { display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 0.875rem; min-height: 3rem; }
  .mjesto { width: 6.75rem; height: 3rem; border: 2px dashed var(--rub); border-radius: var(--rad-m);
    display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: var(--t-m); }
  .mjesto.pun { border-style: solid; border-color: var(--plava); }
  .mjesto.tocno { border-color: var(--zelena); background: #eaf3ec; }

  /* -- zid -- */
  .zidL0 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.5rem; }
  .cigla { background: var(--card); border: 1px solid var(--rub); border-radius: var(--rad-m); padding: 0.375rem;

  /* -- traka abecede -- */
  body.imaTraku { padding-bottom: 5.5rem; }
  #trakaAbc { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--card);
    border-top: 1px solid var(--rub); padding: 0.5rem 0.625rem; display: none; flex-wrap: wrap; gap: 0.25rem;
    justify-content: center; align-content: center; min-height: 4.5rem; box-shadow: 0 -2px 10px rgba(0,0,0,.05); }
  #trakaAbc.vidi { display: flex; }
  #trakaAbc .slovoA { min-width: 1.5rem; height: 1.75rem; padding: 0 0.25rem; border-radius: var(--rad-s);
    display: flex; align-items: center; justify-content: center; font-size: var(--t-s); font-weight: 700;
    background: #eee8de; color: #b3ab9f; transition: background .2s, color .2s; user-select: none; }
  #trakaAbc .slovoA.zivo { background: #fdf6e8; color: var(--zlatna);

  #trakaAbc .slovoA.tekPalo { animation: popA .45s; }
  @keyframes popA { 0% { transform: scale(1);} 40% { transform: scale(1.45);} 100% { transform: scale(1);} }
  #popSlovo { position: fixed; bottom: 90px; z-index: 25; left: 50%; transform: translateX(-50%); background: var(--card);
    border: 1px solid var(--rub); border-radius: var(--rad-l); padding: 0.625rem; box-shadow: 0 6px 20px rgba(0,0,0,.14);
    z-index: 16; text-align: center; display: none; }

  #popSlovo .r { font-weight: 700; margin-top: 0.125rem; }
  #popSlovo .e { font-size: var(--t-s); color: var(--muted); }

  /* -- povremeno isticanje lebdećih ikona (Lesson 0) -- */
  /* Mekani puls + halo prsten: dovoljno da ga periferni vid uhvati, premalo da smeta.
     Klasu .pazi dodaje istakniLebdece() pri otvaranju svake nove stranice Lesson 0.
     box-shadow je zadan samo u središnjem kadru, pa svaka ikona kreće i završava
     na svojoj vlastitoj sjeni. */
  @keyframes lebdiPuls {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.13); box-shadow: 0 8px 24px rgba(154,91,82,.42); }
    70%  { transform: scale(.99); }
    100% { transform: scale(1); }
  }
  @keyframes lebdiHalo {
    from { transform: scale(1);   opacity: .45; }
    to   { transform: scale(2.1); opacity: 0; }
  }
  #lebdi.pazi, #lebdiIgra.pazi, #lebdiInfo.pazi {
    opacity: 1;
    animation: lebdiPuls 1.1s cubic-bezier(.34,1.35,.64,1) 2;
  }
  #lebdi.pazi::after, #lebdiIgra.pazi::after, #lebdiInfo.pazi::after {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    border: 2px solid var(--plava); pointer-events: none;
    animation: lebdiHalo 1.1s ease-out 2;
  }
  @media (prefers-reduced-motion: reduce) {
    #lebdi.pazi, #lebdiIgra.pazi, #lebdiInfo.pazi {
      animation: none; box-shadow: 0 0 0 3px rgba(154,91,82,.30);
    }
    #lebdi.pazi::after, #lebdiIgra.pazi::after, #lebdiInfo.pazi::after { animation: none; }
  }

  /* -- lebdeći rječnik -- */

  .igraTijelo { flex: 1; overflow-y: auto; padding: 1.25rem 1rem 0.625rem; display: flex; flex-direction: column; }

  #panelIgra .tipkeHr { margin: 0.625rem 0 0; }

  /* -- tihi oblačić koji podsjeća da rječnik postoji -- */
  #savjetRj {
    position: fixed; z-index: 31; max-width: 14.75rem; background: var(--card);

  @media (max-width: 640px) {
    .naslovnica { grid-template-columns: 1fr; }
    .valutaKartice { grid-template-columns: repeat(2, 1fr); }
    /* Pet stupaca ne stane u 360px a da imena ostanu čitljiva ("Vocabulary"
       bi se lomilo nasred riječi). Zato mreža dobiva vlastiti vodoravni
       pomak umjesto da pomiče cijelu stranicu — negativna margina je jednaka
       bočnom razmaku #view-a, pa se grid proteže od ruba do ruba i time se
       vidi da se može povući. */

  /* ================= MINI IGRE ================= */
  .miniMreza { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.875rem; margin-top: 1.25rem; }
  .miniKart {
    background: var(--card); border: 1px solid var(--rub); border-radius: var(--rad-l);
    padding: 1rem 1rem 0.875rem; cursor: pointer; position: relative; display: flex;
    flex-direction: column; gap: 0.25rem; transition: transform .15s, border-color .15s, box-shadow .15s;
  }

  .miniKart .podnozje {
    font-size: var(--t-xs); color: var(--muted); border-top: 1px dashed var(--rub);

    display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; margin-top: 0.75rem;
    padding: 0.75rem 1rem; background: var(--card); border: 1px solid var(--rub); border-radius: var(--rad-m);
    font-size: var(--t-s); color: var(--muted);
  }
  .miniSaz strong { color: var(--ink); }

  button.gumbSitni {
    padding: 0.5rem 0.875rem; border: 1px solid var(--rub); border-radius: var(--rad-s); background: var(--card);

  }

    width: 100%; height: calc(100dvh - 11.875rem); min-height: 28.75rem;

  }

  @media (max-width: 720px) { .miniOkvir iframe { height: calc(100dvh - 7.5rem); } }
  @media (max-width: 640px) {
    .miniMreza { grid-template-columns: 1fr; }
  }

  /* ============ IZNIMKE OD SKALIRANJA ======================================
     Sve ostalo slijedi korijen. Ovo su stvari koje ne smiju.

     1. DODIRNE METE. Prst ne raste s rezolucijom ekrana. Zato max(rem, px):
        meta raste kad korisnik poveća sučelje, ali nikad ne pada ispod 44px
        koliko traže WCAG 2.5.5 i Appleove smjernice. Rubovi i sjene su
        namjerno ostavljeni u px iz istog razloga — hairline mora ostati
        hairline i na najvećem zumu.

     2. MINI-IGRE U IFRAMEU imaju vlastiti <html>; ovaj korijen ih ne dotiče.
        Njihove veličine se rješavaju u njihovim datotekama.

     3. SLIKE. Sve su sad u rem, pa prate sučelje. Najveća fizička veličina
        koju slika dosegne = prikazana veličina x 1.2 (gornja granica zuma)
        x 1.15 (najveća --skala) x 2 (retina). Za izvoz:
           .bljesak img   7.875rem (126px)  ->  izvoz ~350px
           .metaL0 img    7.375rem (118px)  ->  izvoz ~330px
           #popSlovo img  6rem      (96px)  ->  izvoz ~270px
           .slikaDet     11.875rem (190px)  ->  izvoz ~525px
        Ispod tih vrijednosti slika postaje mutna na retini pri velikom zumu.
     ---------------------------------------------------------------------- */
  .tipkaHr {
    min-width: max(2.75rem, 44px);
    min-height: max(2.75rem, 44px);
  }
  button.gumbSitni, .wtSmjer button, .wtFilterG, .wtBrojevi button {
    min-height: max(2.75rem, 44px);
  }
  .traka .natrag, .testPauza, .igDalje {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: max(2.75rem, 44px);
  }
  .dictPrekidac div, #panelRj .prekidac div, #panelIgra .prekidac div {
    display: flex; align-items: center; justify-content: center;
    min-height: max(2.75rem, 44px);
  }

  body[data-tema="sljiva"] {
    --bg: #f5f1f4; --card: #fffdfe; --ink: #1e1820; --muted: #837785;

  /* ---- Pismo: isti princip kao teme — jedan atribut na <body>. ----
     Napomena: veličina se NE podešava ovdje. Pravilo na <body> ne može
     utjecati na font-size od <html>, pa je korekcija veličine pisma dio
     --skala koju JS piše na documentElement (vidi KOREKCIJA_PISMA). */
  :root, body[data-font="sistem"] {
    --tekst: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --naslov: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  }

  body[data-font="grotesk"]  { --tekst: "Space Grotesk", system-ui, sans-serif;         --naslov: "Space Grotesk", system-ui, sans-serif; }
  body[data-font="atkinson"] { --tekst: "Atkinson Hyperlegible", system-ui, sans-serif; --naslov: "Atkinson Hyperlegible", system-ui, sans-serif; }
  body[data-font="lexend"]   { --tekst: "Lexend", system-ui, sans-serif;                --naslov: "Lexend", system-ui, sans-serif; --font-visina: 1.65; }
  body[data-font="literata"] { --tekst: "Literata", Georgia, serif;                     --naslov: "Literata", Georgia, serif; }

  /* ---- stranica Options: teme lijevo, pisma desno, stupci jednake visine ---- */
  .postavkeDva { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; max-width: 45rem; }
  .postavkeDva > div { display: flex; flex-direction: column; min-width: 0; }
  .nasP {
    font-family: var(--naslov); font-size: var(--t-xs); font-weight: 700; letter-spacing: .09em;
    text-transform: uppercase; color: var(--muted); margin: 0 0 0.625rem 0.125rem;
  }
  .stupacP { flex: 1; display: grid; gap: 0.625rem; grid-auto-rows: 1fr; }
  .fontK {
    background: var(--card); border: 1px solid var(--rub); border-radius: var(--rad-l);
    padding: 0.75rem 0.875rem; cursor: pointer; text-align: center; position: relative;

</style>

  // ---- daily challenge: jedan po danu ----

  var DAILY_POCETAK = new Date(2026, 7, 7);   // mjesec je 0-baziran: 7 = kolovoz
  function danasDatum() {
    var d = new Date();
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());

  // broj punih dana od starta; računa se preko UTC-a da ljetno/zimsko vrijeme ne pomakne dan
  function dailyIndeksDana(datum) {
    var d = datum || danasDatum();
    var a = Date.UTC(d.getFullYear(), d.getMonth(), d.getDate());
    var s = Date.UTC(DAILY_POCETAK.getFullYear(), DAILY_POCETAK.getMonth(), DAILY_POCETAK.getDate());
    return Math.round((a - s) / 86400000);
  }
  // razina (broj cjeline) današnjeg challengea, ili null ako ga za danas nema

    var b = dailyBrojevi();

  // ================= PROGRESS =================
  // Server (Supabase `progress` table) is the sole source of truth. The only client-side
  // persistence is a narrow, deliberate exception: anonymous Lesson-0 state (no account exists
  // yet to save it against) is held in one sessionStorage key just long enough to survive a
  // page reload or the Google OAuth redirect, then flushed into the new account and deleted.
  function PROGRESS_PRAZAN() {
    return { vjezbe: {}, pokrenute: {}, vidjeno: {}, rjecnik: {}, slova: {}, abecedaSlavljena: 0,

  var PROGRESS = PROGRESS_PRAZAN();

  function redakOdPROGRESS() {
    return {
      vjezbe: PROGRESS.vjezbe || {}, pokrenute: PROGRESS.pokrenute || {},
      vidjeno: PROGRESS.vidjeno || {}, rjecnik: PROGRESS.rjecnik || {},
      slova: PROGRESS.slova || {}, abeceda_slavljena: !!PROGRESS.abecedaSlavljena,
      savjeti: PROGRESS.savjeti || {}, streak: PROGRESS.streak || { niz: 0, zadnji: '', bodovi: 0 },
      ime: PROGRESS.ime || '', mini_igre: PROGRESS.mini_igre || {}, postavke: PROGRESS.postavke || {},
      updated_at: new Date().toISOString()

  }
  function PROGRESS_odRetka(row) {
    return {
      vjezbe: row.vjezbe || {}, pokrenute: row.pokrenute || {}, vidjeno: row.vidjeno || {},
      rjecnik: row.rjecnik || {}, slova: row.slova || {}, abecedaSlavljena: row.abeceda_slavljena ? 1 : 0,
      savjeti: row.savjeti || {}, streak: (row.streak && typeof row.streak === 'object')

      ime: row.ime || '', mini_igre: row.mini_igre || {}, postavke: row.postavke || {}
    };
  }
  // Pre-account Lesson-0 progress carried across the signup/login moment — merged in, never
  // read again afterward, never a fallback source of truth once an account exists.
  function spojiPredracunskoStanje() {
    var sirovo = null;
    try { sirovo = sessionStorage.getItem(L0_PRIJENOS_KLJUC); sessionStorage.removeItem(L0_PRIJENOS_KLJUC); }
    catch (e) {}
    if (!sirovo) return;
    var pred;
    try { pred = JSON.parse(sirovo); } catch (e) { return; }
    if (!pred || typeof pred !== 'object') return;
    ['vjezbe', 'pokrenute', 'vidjeno', 'rjecnik', 'slova', 'savjeti'].forEach(function (polje) {
      if (!pred[polje]) return;
      PROGRESS[polje] = PROGRESS[polje] || {};
      for (var k in pred[polje]) PROGRESS[polje][k] = pred[polje][k];
    });
    if (pred.abecedaSlavljena) PROGRESS.abecedaSlavljena = pred.abecedaSlavljena;
    spremiProgress(true);
  }
  // Seed mini-game localStorage from the server BEFORE any mini-game iframe is created,

  function posijiMiniIgre() {

    Object.keys(m).forEach(function (id) {
      try { localStorage.setItem('croland-mini-' + id, JSON.stringify(m[id])); } catch (e) {}
    });
  }
  function ucitajEntitlement(cb) {
    if (!imaRacun()) { ENTITLEMENT = null; if (cb) cb(); return; }
    supa.from('profiles').select('*').eq('id', SESSION.user.id).maybeSingle().then(function (res) {

  // Globalna pravila pristupa. Namjerno se čita i bez prijave, jer o njima ovisi što piše

  // pravilo (samo pretplatnici) — ispad baze ne smije nikome pokloniti sadržaj.
  function ucitajPostavke(cb) {
    if (!supa) { if (cb) cb(); return; }
    supa.from('postavke').select('kljuc, vrijednost').then(function (res) {
      var nove = {};
      (res.data || []).forEach(function (r) { nove[r.kljuc] = r.vrijednost; });
      POSTAVKE = nove;
      if (cb) cb();
    });
  }
  // ---- zaštićeni sadržaj ----
  // Vježbe od razine 2 naviše ne postoje u javnom data.js — ondje su samo kosturi (naslov,
  // broj bodova) da se zaključane razine mogu prikazati. Pravi sadržaj leži u privatnom
  // Supabase bucketu i dohvaća se ovdje, jednom po učitavanju stranice, i to samo za onoga
  // tko na njega ima pravo. Provjeru prava radi server (Edge Function `sadrzaj`), ne ovaj kod.
  var PLUS_STANJE = 'ne';   // 'ne' | 'ucitava' | 'da' | 'greska'
  var PLUS_CEKAJU = [];     // pozivi koji čekaju da isto dohvaćanje završi

  function spojiPlusSadrzaj(podaci) {
    if (!podaci) return;
    var poKljucu = {};
    IGRE.forEach(function (g) {
      poKljucu[(g.cjelina || '') + '|' + g.stranica + '|' + g.naslov] = g;
    });
    (podaci.igre || []).forEach(function (sirovo) {
      var puna = normalizirajIgru(sirovo);
      var k = (puna.cjelina || '') + '|' + puna.stranica + '|' + puna.naslov;
      var kostur = poKljucu[k];
      if (kostur) {
        // Kostur se puni na mjestu, da sve već postojeće reference na njega ostanu ispravne.
        kostur.stavke = puna.stavke;
        kostur.meta = puna.meta;
        kostur.zakljucano = false;
      } else {
        IGRE.push(puna);   // vježba koje u javnom dijelu nema — ne bi se smjelo dogoditi
      }
    });
    // Zvukovi plaćenih rečenica: njihovi ključevi su same rečenice, pa u javnom dijelu ne
    // smiju stajati. Stižu zajedno sa sadržajem.
    var z = podaci.zvukovi || {};
    Object.keys(z).forEach(function (k) { ZVUK[k] = z[k]; });
  }

  function ucitajPlusSadrzaj(cb) {
    cb = cb || function () {};
    if (PLUS_STANJE === 'da' || PLUS_STANJE === 'greska') { cb(PLUS_STANJE === 'da'); return; }
    if (!imaRacun() || !imaPretplatu()) { cb(false); return; }
    PLUS_CEKAJU.push(cb);
    if (PLUS_STANJE === 'ucitava') return;
    PLUS_STANJE = 'ucitava';

    var gotovo = function (uspjeh) {
      PLUS_STANJE = uspjeh ? 'da' : 'greska';
      var red = PLUS_CEKAJU; PLUS_CEKAJU = [];
      red.forEach(function (f) { f(uspjeh); });
    };

    fetch(FUNKCIJE_URL + '/sadrzaj?f=data-plus.json', {
      headers: zaglavljaFunkcije()
    }).then(function (r) {
      if (!r.ok) throw new Error('sadrzaj ' + r.status);
      return r.json();
    }).then(function (d) {
      if (!d || !d.url) throw new Error('nema url');
      return fetch(d.url);
    }).then(function (r) {
      if (!r.ok) throw new Error('preuzimanje ' + r.status);
      return r.json();
    }).then(function (podaci) {
      spojiPlusSadrzaj(podaci);
      gotovo(true);
    }).catch(function (e) {
      console.error('Zasticeni sadrzaj nije ucitan:', e);
      gotovo(false);

      var hr = razlomiHr(st.hr || w.hr)[0];
      var en = razlomiEn(st.en || w.en)[0];
      if (!hr || !en) return;
      vidjeno[k] = 1;
      out.push({ hr: hr, en: en });
    });
    return out;
  }
  // vreća se puni iznova kad se isprazni — nasumično, ali bez ponavljanja unutar kruga
  function igSljedeca(sve) {
    if (!igRed.length) {
      igRed = promijesaj(sve.slice());
      if (igRed.length > 1 && igZadnji && igRed[igRed.length - 1].hr === igZadnji) {
        igRed.unshift(igRed.pop());
      }
    }
    return igRed.pop() || null;
  }
  function osvjeziBrojac() {
    var t = $('igBrTocno'), n = $('igBrNetocno'), p = $('igPostotak');
    if (!t) return;
    t.textContent = igTocno; n.textContent = igNetocno;
    var uk = igTocno + igNetocno;
    p.textContent = uk ? Math.round(igTocno / uk * 100) + '%' : '';
  }
  // "to read" ≈ "read", "a dog" ≈ "dog"; alternative se dijele zarezom ili kosom crtom
  function igNormOdg(s) {
    return norm(s).replace(/[.!?,]+$/, '').replace(/^(to|a|an|the)\s+/, '').trim();
  }
  function igAlternative(odg) {
    return String(odg).split(/\s*[,/]\s*/).map(igNormOdg).filter(Boolean);
  }
  function igTocanUpis(unos, odg) {
    var u = igNormOdg(unos);
    return !!u && igAlternative(odg).indexOf(u) !== -1;
  }
  // zadrzi = prekidač smjera/načina samo prerisuje isto pitanje, ne troši novu riječ
  function crtajIgru(zadrzi) {
    var t = $('igTijelo'); if (!t) return;
    t.innerHTML = '';
    var sve = igraRijeci();
    if (!sve.length) {
      igTren = null;
      t.innerHTML = '<div class="rjPrazno">No words yet.<br><br>' +
        'Words from this lesson appear here as soon as you add them to your dictionary ' +
        'with <strong>“+ Add to dictionary”</strong>. 📖</div>';
      return;
    }
    var r = (zadrzi === true && igTren && !igTren.gotovo) ? igTren.r : igSljedeca(sve);
    if (!r) return;
    igZadnji = r.hr;
    var smjer = igSmjer === 'mix' ? (Math.random() < 0.5 ? 'hr-en' : 'en-hr') : igSmjer;
    igTren = {
      r: r, smjer: smjer,
      pit: smjer === 'hr-en' ? r.hr : r.en,
      odg: smjer === 'hr-en' ? r.en : r.hr,
      gotovo: false
    };

    var nat = document.createElement('div');
    nat.className = 'igSmjerNat';
    nat.textContent = smjer === 'hr-en' ? 'Croatian → English' : 'English → Croatian';
    t.appendChild(nat);

    var pit = document.createElement('div');
    pit.className = 'igPitanje';
    pit.appendChild(document.createTextNode(igTren.pit));
    if (smjer === 'hr-en') { var zv = zvucnik(r.hr); if (zv) pit.appendChild(zv); }
    t.appendChild(pit);

    if (igNacin === 'izbor') crtajIzbor(t, sve);
    else crtajUpis(t);
  }
  function crtajIzbor(t, sve) {
    var ponude = [igTren.odg];
    var pool = promijesaj(sve.filter(function (x) { return x.hr !== igTren.r.hr; }));
    for (var i = 0; i < pool.length && ponude.length < 4; i++) {
      var kand = igTren.smjer === 'hr-en' ? pool[i].en : pool[i].hr;
      var dvojnik = ponude.some(function (p) { return igNormOdg(p) === igNormOdg(kand); });
      if (!dvojnik) ponude.push(kand);
    }
    var kut = document.createElement('div'); kut.className = 'igOpcije';
    promijesaj(ponude).forEach(function (o) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'igOpcija'; b.textContent = o;
      b.onclick = function () {
        if (igTren.gotovo) return;
        var dobro = igNormOdg(o) === igNormOdg(igTren.odg);
        Array.prototype.forEach.call(kut.children, function (x) {
          x.disabled = true;
          if (igNormOdg(x.textContent) === igNormOdg(igTren.odg)) x.classList.add('tocno');
        });
        if (!dobro) b.classList.add('krivo');
        zavrsiPokusaj(t, dobro);
      };
      kut.appendChild(b);
    });
    t.appendChild(kut);
  }
  function crtajUpis(t) {
    var red = document.createElement('div'); red.className = 'igUpisRed';
    var inp = document.createElement('input');
    inp.type = 'text'; inp.autocomplete = 'off'; inp.spellcheck = false;
    inp.placeholder = igTren.smjer === 'hr-en' ? 'in English…' : 'na hrvatskom…';
    var btn = document.createElement('button');
    btn.type = 'button'; btn.textContent = 'Check';
    red.appendChild(inp); red.appendChild(btn); t.appendChild(red);
    // hrvatska slova trebaju samo kad se odgovara na hrvatskom
    if (igTren.smjer === 'en-hr') t.appendChild(tipkeSlova(inp));

    function provjeri() {
      if (igTren.gotovo) return;
      if (!inp.value.trim()) { inp.focus(); return; }
      var dobro = igTocanUpis(inp.value, igTren.odg);
      inp.disabled = true; btn.disabled = true;
      inp.style.borderColor = dobro ? 'var(--zelena)' : 'var(--crvena)';
      zavrsiPokusaj(t, dobro);
    }
    btn.onclick = provjeri;
    inp.onkeydown = function (e) { if (e.key === 'Enter') provjeri(); };
    setTimeout(function () { try { inp.focus(); } catch (e) {} }, 60);
  }
  function zavrsiPokusaj(t, dobro) {
    igTren.gotovo = true;
    if (dobro) igTocno++; else igNetocno++;
    osvjeziBrojac();

    var o = document.createElement('div');
    o.className = 'igOdgovor ' + (dobro ? 'dobro' : 'lose');
    if (dobro) o.textContent = 'Correct ✓';
    else o.innerHTML = 'Correct answer: <span class="tocanOdg">' + esc(igTren.odg) + '</span>';
    // hrvatska strana uvijek dobije zvučnik, pa se riječ može i čuti
    var hrRijec = igTren.r.hr;
    if (igTren.smjer === 'en-hr' && imaZvuk(hrRijec)) {
      var zv = zvucnik(hrRijec); if (zv) { o.appendChild(document.createTextNode(' ')); o.appendChild(zv); }
    }
    t.appendChild(o);

    var d = document.createElement('button');
    d.type = 'button'; d.className = 'igDalje'; d.textContent = 'Next word →';
    d.onclick = function () { crtajIgru(); };
    t.appendChild(d);
    setTimeout(function () { try { d.focus(); } catch (e) {} }, 40);
  }
  function otvoriIgru() {
    sakrijSavjetRj();
    zatvoriRj();
    igRed = [];
    $('panelIgra').classList.add('otvoren');
    $('zastorRj').classList.add('vidi');
    osvjeziBrojac();
    crtajIgru();
  }
  function zatvoriIgru() {
    var p = $('panelIgra'); if (!p) return;
    p.classList.remove('otvoren');
    if (!$('panelRj').classList.contains('otvoren')) $('zastorRj').classList.remove('vidi');
  }
  function igraVidljiva(da) {
    var g = $('lebdiIgra'); if (!g) return;
    if (da) { g.classList.add('vidi'); postaviIkonuIgre(); }
    else { g.classList.remove('vidi'); zatvoriIgru(); }
  }

  // ================= LEBDEĆI INFO: PRAVILO UZ OVU VJEŽBU =================
  // Tekst dolazi iz meta.info svake vježbe (polje "info:" u igre/*.md). Ikona se
  // pojavljuje samo kad ta vježba ima info — i nikad u testu, jednako kao rječnik.
  function infoTekstIgre() {
    return (igra && igra.meta && igra.meta.info) ? String(igra.meta.info).trim() : '';
  }
  function popuniInfo() {
    var t = $('infoTijelo'); if (!t) return;
    var tekst = infoTekstIgre();
    var gdje = igra ? ((igra.cjelina || '') + (igra.stranica ? ' · page ' + igra.stranica : '')) : '';
    t.innerHTML =
      '<div class="infoNaslov">' + mdInline(igra && igra.naslov ? igra.naslov : '') + '</div>' +
      '<div class="infoGdje">' + gdje + '</div>' +
      '<div class="infoTekst">' + (tekst ? mdInline(tekst) :
        'This exercise has no note yet. If you expected one here, the app is running on an older ' +
        '<em>data.js</em> — regenerate it and reload the page.') + '</div>' +
      ((igra && igra.meta && igra.meta.opis)
        ? '<div class="infoOpis">' + mdInline(igra.meta.opis) + '</div>' : '');
  }
  function otvoriInfo() {
    popuniInfo();
    $('panelInfo').classList.add('otvoren');
    $('zastorRj').classList.add('vidi');
  }
  function zatvoriInfo() {
    var p = $('panelInfo'); if (!p) return;
    p.classList.remove('otvoren');
    if (!$('panelRj').classList.contains('otvoren') && !$('panelIgra').classList.contains('otvoren')) {
      $('zastorRj').classList.remove('vidi');
    }
  }
  function infoVidljiv(da) {
    var b = $('lebdiInfo'); if (!b) return;
    // Ikona stoji kroz cijelu vježbu, i kad ta stranica nema svoju bilješku — tako se
    // ne pojavljuje i nestaje između stranica, a i sama kaže kad bilješke nema.
    if (da) {
      b.classList.add('vidi'); postaviIkonuInfo();
      // pri prelasku na sljedeću vježbu s otvorenim panelom sadržaj se mora osvježiti
      if ($('panelInfo').classList.contains('otvoren')) popuniInfo();
    } else {
      b.classList.remove('vidi'); zatvoriInfo();
    }
  }
  // ikona infa visi ispod ikone igrice i prati cijeli niz pri povlačenju
  function postaviIkonuInfo() {
    var b = $('lebdiInfo'); if (!b) return;
    var v = Math.round(rjVelicina * 0.86);
    b.style.width = v + 'px'; b.style.height = v + 'px';
    b.style.fontSize = (v * 0.46) + 'px';
    b.style.top = (rjTop + rjVelicina + 10 + v + 10) + 'px';
    b.style.right = (18 + (rjVelicina - v) / 2) + 'px';
  }

  // ---- povremeno isticanje lebdećih ikona ----
  // Pri otvaranju svake nove stranice Lesson 0 sve tri ikone kratko pulsiraju, s malim
  // razmakom u vremenu, pa efekt putuje niz stupac kao val. Kljuc pamti zadnju stranicu
  // da se puls ne ponovi kad se ista vjezba prerenderira (npr. "Play again").
  var paziZadnja = null;
  function istakniLebdece(kljuc) {
    if (kljuc && kljuc === paziZadnja) return;
    paziZadnja = kljuc || null;
    ['lebdi', 'lebdiIgra', 'lebdiInfo'].forEach(function (id, i) {
      setTimeout(function () {
        var e = $(id);
        if (!e || !e.classList.contains('vidi')) return;
        if (document.body.classList.contains('izbornikOtvoren')) return;
        // ako je polaznik već otvorio neki panel, ne odvlači mu pažnju natrag na ikone
        if ($('panelRj').classList.contains('otvoren') ||
            $('panelIgra').classList.contains('otvoren') ||
            $('panelInfo').classList.contains('otvoren')) return;
        e.classList.remove('pazi');
        void e.offsetWidth;                       // restart animacije
        e.classList.add('pazi');
        setTimeout(function () { e.classList.remove('pazi'); }, 2400);
      }, 700 + i * 180);
    });
  }

  // ---- mehanika 1: spajanje (crtež ↔ riječ) ----
  function takeSpajanje() {
    var stavke = igra.stavke.slice(0, 12);
    var rijeseno = 0, promasaj = 0;
    setStat('Matched: 0/' + stavke.length, '');
    predaja = function () {
      return { s: 'Matched: ' + rijeseno + '/' + stavke.length, pct: rijeseno / stavke.length };
    };
    var s = $('sadrzaj'); s.innerHTML = '';
    var mreza = document.createElement('div'); mreza.className = 'mrezaSpoj'; s.appendChild(mreza);
    var traka = document.createElement('div'); traka.className = 'cipovi'; s.appendChild(traka);

    var polja = {}, cipovi = {}, odabranaSlika = null, odabraniCip = null;

    promijesaj(stavke).forEach(function (st) {
      var p = document.createElement('div'); p.className = 'poljeSpoj';
      var im = elSlikaIgre(st[0], 'slikaIgra');
      if (im) { im.style.cssText = 'width:100%;aspect-ratio:1;object-fit:contain;display:block;pointer-events:none;'; p.appendChild(im); }
      else { var pr = document.createElement('div'); pr.style.cssText = 'padding:22px 4px;font-size:var(--t-s);color:var(--muted)'; pr.textContent = st[1] || ''; p.appendChild(pr); }
      var n = document.createElement('div'); n.className = 'natpis'; p.appendChild(n);
      p.onclick = function () { kliknuoSliku(st, p); };
      polja[st[0]] = p; mreza.appendChild(p);
    });
    promijesaj(stavke).forEach(function (st) {
      var c = document.createElement('div'); c.className = 'cipSpoj'; c.textContent = st[0];
      c.onclick = function () { kliknuoCip(st, c); };
      cipovi[st[0]] = c; traka.appendChild(c);
    });

    function ocisti() {
      if (odabranaSlika) polja[odabranaSlika[0]].classList.remove('odabran');
      if (odabraniCip) cipovi[odabraniCip[0]].classList.remove('odabran');
      odabranaSlika = null; odabraniCip = null;
    }
    function kliknuoSliku(st, p) {
      if (gotovo || p.classList.contains('rijesen')) return;
      if (odabraniCip) { pokusaj(st, odabraniCip); return; }
      ocisti(); odabranaSlika = st; p.classList.add('odabran');
    }
    function kliknuoCip(st, c) {
      if (gotovo || c.classList.contains('potroseno')) return;
      if (odabranaSlika) { pokusaj(odabranaSlika, st); return; }
      ocisti(); odabraniCip = st; c.classList.add('odabran');
    }
    function pokusaj(slika, rijec) {
      var p = polja[slika[0]], c = cipovi[rijec[0]];
      if (slika[0] === rijec[0]) {
        ocisti();
        p.classList.add('rijesen');
        var n = p.querySelector('.natpis'); n.textContent = slika[0];
        var zv = zvucnik(slika[0]); if (zv) n.appendChild(zv);
        c.classList.add('potroseno');
        sviraj(slika[0]); otkljucajSlovo(slika[0]);
        rijeseno++;
        setStat('Matched: ' + rijeseno + '/' + stavke.length, statD(promasaj ? 'Misses: ' + promasaj : ''));
        if (rijeseno === stavke.length) kraj('Matched all ' + stavke.length, 1);
      } else {
        promasaj++; zabiljeziGresku();
        p.classList.add('tresi', 'krivo'); c.classList.add('tresi', 'krivo');
        setTimeout(function () { p.classList.remove('tresi', 'krivo'); c.classList.remove('tresi', 'krivo'); }, 340);
        ocisti();
        setStat('Matched: ' + rijeseno + '/' + stavke.length, statD('Misses: ' + promasaj));
      }
    }
  }

  // ---- mehanika 2: baloni ----
  function takeBaloni() {
    var fond = igra.stavke;
    var red = uzorak(fond, Math.min(6, fond.length)), i = 0, ziv = true, baloni = [];
    setStat('Popped: 0/' + red.length, '');
    predaja = function () { return { s: 'Popped: ' + i + '/' + red.length, pct: i / red.length }; };
    var s = $('sadrzaj'); s.innerHTML = '';
    var meta = document.createElement('div'); meta.className = 'metaL0'; s.appendChild(meta);
    var nebo = document.createElement('div'); nebo.id = 'nebo'; s.appendChild(nebo);

    function novaMeta() {
      if (i >= red.length) { ziv = false; kraj('Popped all ' + red.length, 1); return; }
      meta.innerHTML = '';
      var im = elSlikaIgre(red[i][0], 'slikaIgra');
      if (im) { im.style.cssText = 'width:118px;height:118px;object-fit:contain;'; meta.appendChild(im); }
      else meta.textContent = red[i][1] || '';
      setStat('Popped: ' + i + '/' + red.length, '');
    }
    function pusti(st) {
      var b = document.createElement('div'); b.className = 'balon'; b.textContent = st[0];
      b.style.left = (6 + Math.random() * 62) + '%';
      b.style.top = '105%';
      b.onclick = function () {
        if (gotovo || !ziv || b.classList.contains('pukao')) return;
        if (st[0] === red[i][0]) {
          b.classList.add('pukao');
          sviraj(st[0]); otkljucajSlovo(st[0]);
          i++; novaMeta();
        } else {
          zabiljeziGresku();
          b.style.borderColor = 'var(--rub)';
          b.classList.add('tresi');
          setTimeout(function () { b.classList.remove('tresi'); }, 340);
        }
      };
      nebo.appendChild(b);
      baloni.push({ el: b, y: 105, v: 0.11 + Math.random() * 0.07, st: st });
    }
    var zadnji = 0;
    function petlja(ts) {
      if (!document.body.contains(nebo)) return;
      for (var k = baloni.length - 1; k >= 0; k--) {
        baloni[k].y -= baloni[k].v;
        baloni[k].el.style.top = baloni[k].y + '%';
        if (baloni[k].y < -18) { baloni[k].el.remove(); baloni.splice(k, 1); }
      }
      if (ziv && !gotovo && ts - zadnji > 900) {
        zadnji = ts;
        var imaTocan = false;
        baloni.forEach(function (o) { if (o.st[0] === red[i][0] && o.y > 5) imaTocan = true; });
        pusti(imaTocan ? fond[Math.floor(Math.random() * fond.length)] : red[i]);
      }
      requestAnimationFrame(petlja);
    }
    novaMeta();
    requestAnimationFrame(petlja);
  }

  // ---- mehanika 3: slova (anagram s digrafima) ----
  function takeSlova() {
    var zadaci = igra.stavke.slice();
    var n = 0, tocnih = 0;
    setStat('Words: 0/' + zadaci.length, '');
    predaja = function () { return { s: 'Words: ' + tocnih + '/' + zadaci.length, pct: tocnih / zadaci.length }; };

    function krug() {
      if (n >= zadaci.length) { kraj('Built ' + tocnih + '/' + zadaci.length, tocnih / zadaci.length); return; }
      var rijec = zadaci[n][0];
      var dijelovi = grafemi(rijec);
      // mamci: rastavljeni digrafi iz same riječi (npr. nj -> n, j)
      var mamci = [];
      dijelovi.forEach(function (d) {
        if (DIGRAFI.indexOf(d) >= 0) { mamci.push(d.charAt(0)); mamci.push(d.charAt(1)); }
      });
      var s = $('sadrzaj'); s.innerHTML = '';
      var meta = document.createElement('div'); meta.className = 'metaL0';
      var im = elSlikaIgre(rijec, 'slikaIgra');
      if (im) { im.style.cssText = 'width:118px;height:118px;object-fit:contain;'; meta.appendChild(im); }
      else meta.textContent = zadaci[n][1] || '';
      s.appendChild(meta);

      var slag = document.createElement('div'); slag.className = 'slagaliste'; s.appendChild(slag);
      var plocice = document.createElement('div'); plocice.className = 'plocice'; s.appendChild(plocice);

      var mjesta = [], uneseno = [];
      dijelovi.forEach(function () {
        var m = document.createElement('div'); m.className = 'slagPrazno'; slag.appendChild(m); mjesta.push(m);
      });
      promijesaj(dijelovi.concat(mamci)).forEach(function (d) {
        var p = document.createElement('div'); p.className = 'plocica'; p.textContent = d;
        p.onclick = function () {
          if (gotovo || uneseno.length >= dijelovi.length || p.classList.contains('potroseno')) return;
          uneseno.push({ d: d, p: p }); p.classList.add('potroseno'); osvjezi();
          if (uneseno.length === dijelovi.length) provjeri();
        };
        plocice.appendChild(p);
      });
      function osvjezi() {
        mjesta.forEach(function (m, i) {
          m.textContent = uneseno[i] ? uneseno[i].d : '';
          m.classList.toggle('pun', !!uneseno[i]);
        });
      }
      function vrati() {
        var z = uneseno.pop(); if (z) z.p.classList.remove('potroseno'); osvjezi();
      }
      function provjeri() {
        var slozeno = uneseno.map(function (x) { return x.d; }).join('');
        if (slozeno === String(rijec).toLowerCase()) {
          mjesta.forEach(function (m) { m.style.borderBottomColor = 'var(--zelena)'; });
          sviraj(rijec); otkljucajSlovo(rijec);
          tocnih++; setStat('Words: ' + tocnih + '/' + zadaci.length, '');
          setTimeout(function () { if (!gotovo) { n++; krug(); } }, 900);
        } else {
          zabiljeziGresku();
          slag.classList.add('tresi');
          setTimeout(function () {
            slag.classList.remove('tresi');
            while (uneseno.length) vrati();
          }, 400);
        }
      }
      var b = document.createElement('button'); b.className = 'gumb gumbSivi';
      b.textContent = '⌫ Undo'; b.style.margin = '14px auto 0';
      b.onclick = vrati;
      s.appendChild(b);
    }
    krug();
  }

  // ---- mehanika 4: pamti pa piši ----
  function takePamti() {
    var krugova = Math.min(3, Math.floor(igra.stavke.length / 3)) || 1;
    var n = 0, tocnih = 0, ukupno = krugova * 3;
    setStat('Correct: 0/' + ukupno, '');
    predaja = function () { return { s: 'Correct: ' + tocnih + '/' + ukupno, pct: tocnih / ukupno }; };

    function krug() {
      if (n >= krugova) { kraj('Correct: ' + tocnih + '/' + ukupno, tocnih / ukupno); return; }
      var trojka = uzorak(igra.stavke, 3);
      var s = $('sadrzaj'); s.innerHTML = '';
      var naslov = document.createElement('div');
      naslov.style.cssText = 'text-align:center;font-weight:600;margin-bottom:10px';
      naslov.textContent = 'Remember these three — round ' + (n + 1) + ' of ' + krugova;
      s.appendChild(naslov);
      var b = document.createElement('div'); b.className = 'bljesak'; s.appendChild(b);
      trojka.forEach(function (st) {
        var im = elSlikaIgre(st[0], 'slikaIgra');
        if (im) { im.style.cssText = 'width:126px;height:126px;object-fit:contain;'; b.appendChild(im); }
        else { var d = document.createElement('div'); d.textContent = st[0]; b.appendChild(d); }
      });
      setTimeout(function () {
        if (gotovo || !document.body.contains(s)) return;
        pitaj(trojka);
      }, 2600);
    }
    function pitaj(trojka) {
      var s = $('sadrzaj'); s.innerHTML = '';

      naslov.textContent = 'Which three, in that order?';
      s.appendChild(naslov);
      var red = document.createElement('div'); red.className = 'redoslijed'; s.appendChild(red);
      var mjesta = [];
      for (var i = 0; i < 3; i++) {
        var m = document.createElement('div'); m.className = 'mjesto'; red.appendChild(m); mjesta.push(m);
      }
      var ostatak = igra.stavke.filter(function (st) {
        for (var j = 0; j < trojka.length; j++) if (trojka[j][0] === st[0]) return false;
        return true;
      });
      var ponuda = promijesaj(trojka.concat(uzorak(ostatak, 6)));
      var uneseno = [];
      var traka = document.createElement('div'); traka.className = 'cipovi'; s.appendChild(traka);

        setStat('Correct: ' + tocnih + '/' + ukupno, '');
        setTimeout(function () { if (!gotovo) { n++; krug(); } }, 1400);
      }

  function sljedecaCjelina() {
    for (var r = 1; r <= 20; r++) {
      for (var i = 0; i < TIPOVI.length; i++) {
        var tip = TIPOVI[i];
        if (!otkljucano(tip, r)) continue;
        var maks = maksCjeline(tip, r);

        if (osvojenoCjeline(tip, r) < maks) {
          var igre = igreCjeline(tip, r);
          return { tip: tip, razina: r, maks: maks, osv: osvojenoCjeline(tip, r),
            naslov: (igre[0] && igre[0].cjelinaNaslov) || (tip + ' ' + r), broj: igre.length };
        }
      }
    }
    return null;
  }

          naslov: (igre[0] && igre[0].cjelinaNaslov) || (tip + ' ' + r) };
      }
    }
    return null;
  }

        '<span class="ime">' + esc(g.ime) + '</span>' +

        '<span class="opis">' + esc(g.opis) + '</span>' +
        '<span class="podnozje"><span>' + g.maks + ' pts ×4</span>' +
        '<span class="st">' + esc(stanje) + '</span></span>' +
        '</div>';
    });
    html += '</div>' +
      '<p style="color:var(--muted);font-size:var(--t-s);line-height:1.6;margin-top:16px">' +
      'Each game is a standalone prototype with its own built-in vocabulary of 246 words. ' +
      'Progress is saved separately per game, and points count towards unlocking lessons.</p>';
