  // ---- naslovnica: klizanje, tipkovnica, klik koji ne okida na povlacenje ----
  function otvoriCilj(c) {
    if (!c) return;
    var d = c.split(':');
    if (d[0] === 'unit') idi('unit', d[1], parseInt(d[2], 10));
    else idi(d[1], d[2]);
  }
  function trenutniSlajd(traka) {
    if (!traka.children.length) return 0;
    var baza = traka.children[0].offsetLeft, naj = 0, razlika = Infinity;
    for (var i = 0; i < traka.children.length; i++) {
      var d = Math.abs((traka.children[i].offsetLeft - baza) - traka.scrollLeft);
      if (d < razlika) { razlika = d; naj = i; }
    }
    return naj;
  }
  // Klizanje spila vodi skripta, a ne preglednik. Nativni zamah uz mandatory
  // snap leti dokle ga zamah odnese — jednim potezom s prve kartice na treću —
  // i to brzinom koju bira preglednik; CSS mu brzinu ne može zadati. Ovdje
  // jedan potez prstom (ili klik na strelicu) pomakne spil najviše za jednu
  // karticu, a klizanje do nje traje KLIZ_MS — nakon povlačenja razmjerno
  // kraće, jer je dio puta već prijeđen.
  var KLIZ_MS = 650;
  function klizacSpila(traka) {
    var d = traka.children, klizi = 0, cilj = 0, potez = null;
    function poz(i) { return d[Math.max(0, Math.min(d.length - 1, i))].offsetLeft - d[0].offsetLeft; }
    function korak() { return d.length > 1 ? poz(1) : traka.clientWidth; }
    function naSlajd(i) {
      cancelAnimationFrame(klizi);
      cilj = Math.max(0, Math.min(d.length - 1, i));
      var od = traka.scrollLeft, put = poz(cilj) - od, t0 = performance.now();
      var ms = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 :
        Math.max(300, KLIZ_MS * Math.min(1, Math.abs(put) / korak()));
      // snap bi svaki kadar vratio na najbližu karticu, pa miruje dok spil klizi
      traka.style.scrollSnapType = 'none';
      (function kadar(sad) {
        var t = ms ? Math.max(0, Math.min(1, (sad - t0) / ms)) : 1;
        traka.scrollLeft = od + put * (1 - Math.pow(1 - t, 3));   // krene brzo, stane polako
        if (t < 1) klizi = requestAnimationFrame(kadar);
        else { klizi = 0; traka.style.scrollSnapType = ''; }
      })(t0);
    }
    // dok spil klizi, "trenutna" je kartica prema kojoj ide — dva brza poteza su dvije kartice
    function trenutni() { return klizi ? cilj : trenutniSlajd(traka); }

    // Kartica ide za prstom (najviše do susjedne), a pri otpuštanju spil dovrši
    // put do susjedne ako je potez bio dovoljno dug ili brz — inače se vrati.
    // Miš ne vuče, njemu su strelice. Okomiti potez ostaje pregledniku
    // (touch-action: pan-y), pa stranica i dalje skrola preko spila.
    traka.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' || (potez && potez.vodi)) return;
      potez = { id: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, t: e.timeStamp, v: 0, vodi: false };
    });
    traka.addEventListener('pointermove', function (e) {
      if (!potez || e.pointerId !== potez.id) return;
      var dx = e.clientX - potez.x0;
      if (!potez.vodi) {
        // isti prag kao "vuce" u vezisNaslovnicu(), pa povučena kartica ne okine klik
        if (Math.abs(dx) <= 10 || Math.abs(dx) < Math.abs(e.clientY - potez.y0)) return;
        potez.i = trenutni();
        cancelAnimationFrame(klizi); klizi = 0;
        potez.od = traka.scrollLeft + dx;
        potez.vodi = true;
        traka.style.scrollSnapType = 'none';
      }
      var dt = e.timeStamp - potez.t;
      if (dt > 0) potez.v = 0.7 * (e.clientX - potez.x) / dt + 0.3 * potez.v;
      potez.x = e.clientX; potez.t = e.timeStamp;
      traka.scrollLeft = Math.max(poz(potez.i - 1), Math.min(poz(potez.i + 1), potez.od - dx));
    });
    function pusti(e) {
      if (!potez || e.pointerId !== potez.id) return;
      var p = potez; potez = null;
      if (!p.vodi) return;
      var dx = p.x - p.x0, strana = dx < 0 ? 1 : -1;
      // brzina u smjeru poteza, px/ms; prst koji je zastao prije otpuštanja nema zamaha
      var zamah = e.timeStamp - p.t > 100 ? 0 : -p.v * strana;
      var dalje = (Math.abs(dx) >= 16 && zamah >= 0.3) ||
        (Math.abs(dx) >= Math.max(24, korak() * 0.15) && zamah > -0.3);
      naSlajd(p.i + (dalje ? strana : 0));
    }
    traka.addEventListener('pointerup', pusti);
    traka.addEventListener('pointercancel', pusti);

    return { pomakni: function (smjer) { naSlajd(trenutni() + smjer); } };
  }
  function vezisNaslovnicu() {
    var pocetna = VIEW.querySelector ? VIEW.querySelector('.pocetna') : null;
    if (!pocetna) return;

    // trake krenu s nule pa naraste u sljedecem kadru — bez toga nema prijelaza
    var trake = pocetna.querySelectorAll('[data-pct]');
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        [].forEach.call(trake, function (el) { el.style.width = (el.getAttribute('data-pct') || 0) + '%'; });
      });
    });

    // Povlacenje ne smije zavrsiti kao klik: pamti se pocetna tocka pritiska.
    var x0 = 0, y0 = 0, vuce = false, dolje = false;
    pocetna.addEventListener('pointerdown', function (e) { x0 = e.clientX; y0 = e.clientY; vuce = false; dolje = true; }, true);
    pocetna.addEventListener('pointermove', function (e) {
      if (!dolje) return;
      if (Math.abs(e.clientX - x0) > 10 || Math.abs(e.clientY - y0) > 10) vuce = true;
    }, true);
    pocetna.addEventListener('pointerup', function () { dolje = false; }, true);
    pocetna.addEventListener('pointercancel', function () { dolje = false; vuce = false; }, true);

    pocetna.addEventListener('click', function (e) {
      var t = e.target;
      if (t.closest && t.closest('.strelice')) return;
      var el = t.closest ? t.closest('[data-cilj]') : null;
      if (!el) return;
      if (vuce) { vuce = false; return; }
      otvoriCilj(el.getAttribute('data-cilj'));
    });

    pocetna.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      var t = e.target;
      if (!t.getAttribute) return;
      if (t.hasAttribute('data-cilj')) { e.preventDefault(); otvoriCilj(t.getAttribute('data-cilj')); }
    });

    [].forEach.call(pocetna.querySelectorAll('.spil'), function (sp) {
      var traka = sp.querySelector('.spilTraka');
      var tockice = sp.querySelectorAll('.tockice span');
      var strelice = sp.querySelectorAll('.strelice button');
      // točke i strelice postoje samo kad spil ima više od jedne kartice — inače nema kamo kliziti
      if (!traka || !tockice.length) return;
      var klizac = klizacSpila(traka);
      [].forEach.call(strelice, function (b) {
        b.addEventListener('click', function (ev) {
          ev.stopPropagation();
          klizac.pomakni(parseInt(b.getAttribute('data-smjer'), 10));
        });
      });
      var osvjezi = function () {
        var i = trenutniSlajd(traka);
        for (var j = 0; j < tockice.length; j++) tockice[j].className = (j === i ? 'on' : '');
        if (strelice.length === 2) {
          strelice[0].disabled = (i <= 0);
          strelice[1].disabled = (i >= traka.children.length - 1);
        }
      };
      traka.addEventListener('scroll', osvjezi);
      osvjezi();
    });
  }

  // ---- Games & Extras: popis ----
  // Dva odjeljka, ne jedan: Extras je kratak i sirok (jedna igra, velika slika),
  // Mini igre su mreza thumbnailova ispod njega. Redoslijed je namjeran —
  // Extras se vidi bez listanja, mini igre se listaju.
  function miniKartaHtml(g) {
    var st = miniStanje(g.id);
    var pun = (st.naplaceno || 0) >= g.maks;
    var stanje = miniOpisStanja(g);
    return '<div class="miniKart' + (pun ? ' gotovo' : '') + '" onclick="miniDodir(this,\'' + g.id + '\')" ' +
      'title="' + esc(g.ime) + ' — up to ' + g.maks + ' points in each currency">' +
      '<span class="sl">' + miniSlikaHtml(g) + '<span class="broj">' + g.br + '</span></span>' +
      '<span class="ime">' + esc(g.ime) + '</span>' +
      '<span class="stil">' + esc(g.stil) + '</span>' +
      '<span class="opis">' + esc(g.opis) + '</span>' +
      '<span class="podnozje"><span>' + g.maks + ' pts ×4</span>' +
      '<span class="st">' + esc(stanje) + '</span></span>' +
      '</div>';
  }
  // Slika ako je ima, inace emoji na istom mjestu i u istom omjeru — kartica
  // ne smije promijeniti visinu samo zato sto igra jos nema thumbnail.
  function miniSlikaHtml(g) {
    // Emoji ovdje ne moze zamijeniti sliku: veliki znakovi poput motorway ili
    // shield u pola fontova padnu na crno-bijeli obris koji izgleda kao
    // slomljena slika. Zato je zamjena nacrtana — trake i ime igre.
    if (!g.slika) return '<span class="emoSl"><span>' + esc(g.ime) + '</span></span>';
    return '<img src="' + MINI_SLIKE + g.slika + '" alt="" loading="lazy" decoding="async">';
  }

  // Klik na igru: na računalu i tabletu prozor srednje veličine izraste iz
  // kartice, na mobitelu se kartica proširi u mreži. Oboje pokazuju isti sastav
  // (slika, okomita traka napretka, screenshot, opis) i igru pokreće samo gumb.
  // Bez računa nema ni prozora ni proširenja — idi() otvara prijavu kao i prije.
  var IGRA_PLAY_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>';
  var IGRA_PROZOR = null;   // { sloj, prozor, izvor } dok je prozor otvoren

  function igraSastavHtml(g) {
    var naziv = '<div class="igNaziv"><span class="ime">' + esc(g.ime) + '</span><span class="stil">' + esc(g.stil) + '</span></div>';
    var profil = '<div class="igProfil">' + miniSlikaHtml(g) + '</div>';
    if (!g.maks) return '<div class="igSastav extra">' + profil + '</div>' + naziv;
    var n = miniIsplata(g), puno = n >= g.maks;
    var p = Math.round(n / g.maks * 100);
    // Screenshot ako ga nema: maknemo ga i naziv dobije cijelu širinu.
    var shot = g.slika ? '<div class="igShot"><img src="' + MINI_SLIKE + 'shot/' + g.slika + '" alt="" ' +
      'onerror="var s=this.parentNode,k=s.parentNode;s.remove();k.classList.add(\'bezShota\')"></div>' : '';
    return '<div class="igSastav' + (shot ? '' : ' bezShota') + '">' + profil +
        '<div class="igNapredak' + (puno ? ' puno' : '') + '" title="' + n + ' / ' + g.maks + '">' +
          '<span class="igTrak"><i data-p="' + p + '%"></i></span>' +
          '<span class="br">' + (puno ? '✓' : n) + '</span>' +
          (puno ? '' : '<span class="od">/' + g.maks + '</span>') +
        '</div>' + shot +
      '</div>' + naziv;
  }
  function igraTijeloHtml(g) {
    var uskoro = !g.dat;
    var meta = g.maks
      ? '<span>' + g.maks + ' pts ×4</span><span class="st">' + esc(miniOpisStanja(g)) + '</span>'
      : '<span>no points — your own text</span><span></span>';
    return '<p class="igOpis">' + esc(g.opis) + '</p><div class="igMeta">' + meta + '</div>' +
      '<button class="igPlay"' + (uskoro ? ' disabled' : '') + ' onclick="event.stopPropagation();miniIgraj(\'' + g.id + '\')">' +
      (uskoro ? 'coming soon' : IGRA_PLAY_SVG + esc('Play')) + '</button>';
  }
  // trake krenu s nule i narastu u sljedećem kadru
  function igraNapuni(korijen) {
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      var tr = korijen.querySelectorAll('.igTrak i');
      for (var i = 0; i < tr.length; i++) tr[i].style.setProperty('--p', tr[i].getAttribute('data-p'));
    }); });
  }

  function miniDodir(el, id, uskoro) {
    if (el.classList.contains('otvoren')) return;      // unutra rade samo gumbi
    if (imaPristup('MiniGame', 0) !== 'ok') { if (!uskoro) idi('miniIgra', id); return; }
    var g = miniPoId(id) || extraPoId(id);
    if (!g) return;
    if (window.matchMedia('(max-width: 639.98px)').matches) miniProsiri(el, g);
    else otvoriIgraProzor(g, el);
  }
  window.miniDodir = miniDodir;

  function miniProsiri(el, g) {
    var sve = VIEW.querySelectorAll('.miniKart.otvoren, .extraKart.otvoren');
    for (var i = 0; i < sve.length; i++) miniSkupi(sve[i]);
    // Prosirena kartica uzima svoj redak, a susjed iz tog retka ide ispod nje —
    // i kad je bila lijeva i kad je bila desna. Desnu se zato redom stavlja
    // ispred lijeve; ostale kartice zadrzavaju svoj poredak.
    if (el.classList.contains('miniKart')) {
      var kart = el.parentNode.querySelectorAll('.miniKart');
      for (var j = 0; j < kart.length; j++) {
        kart[j].style.order = 2 * j;
        if (kart[j] === el && j % 2 === 1) kart[j].style.order = 2 * j - 3;
      }
    }
    var p = document.createElement('div');
    p.className = 'igProsireno';
    p.innerHTML = '<button class="igZatvori" aria-label="Close" onclick="event.stopPropagation();miniSkupi(this.closest(\'.otvoren\'))">×</button>' +
      igraSastavHtml(g) + igraTijeloHtml(g);
    el.appendChild(p);
    el.classList.add('otvoren');
    igraNapuni(p);
    setTimeout(function () { if (el.isConnected) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }, 60);
  }
  function miniSkupi(el) {
    if (!el) return;
    el.classList.remove('otvoren');
    var p = el.querySelector('.igProsireno'); if (p) p.remove();
  }
  window.miniSkupi = miniSkupi;

  function otvoriIgraProzor(g, kartica) {
    zatvoriIgraProzor(true);
    var sloj = document.createElement('div');
    sloj.id = 'igraSloj';
    sloj.innerHTML =
      '<div class="igraProzor" role="dialog" aria-modal="true" aria-label="' + esc(g.ime) + '">' +
        '<div class="igGlava"><span class="igVrsta">' + (g.maks ? esc('Mini game') + ' ' + esc(g.br || '') : 'Extras') + '</span>' +
        '<button class="igX" aria-label="Close">×</button></div>' +
        '<div class="igTijelo">' + igraSastavHtml(g) + igraTijeloHtml(g) + '</div>' +
      '</div>';
    document.body.appendChild(sloj);
    var prozor = sloj.querySelector('.igraProzor');

        ? 'the whole alphabet is yours · replay any time'
        : (imaSlova ? imaSlova + ' of 30 letters unlocked' : 'free intro, no account, about 5 minutes')) +
      '</div></div></div>';
  }

  // Prva razina u kojoj nešto još nije otključano. Iza nje se prikazuju samo tri
  // retka — dvadeset redaka zaključanih ćelija ne čita se kao napredak.
  function prvaZakljucanaRazina() {
    for (var r = 1; r <= MAX_RAZINA; r++) {
      for (var t = 0; t < TIPOVI.length; t++) {
        if (igreCjeline(TIPOVI[t], r).length > 0 && !otkljucano(TIPOVI[t], r)) return r;
      }
    }
    return MAX_RAZINA;
  }


  // Prva razina čija Lesson još nije 100% — mreža se pri otvaranju pomakne tako
  // da je njezin stupac prvi slijeva.
  function prvaNedovrsenaLekcija() {
    var zadnja = 1;
    for (var r = 1; r <= MAX_RAZINA; r++) {
      if (igreCjeline('Lesson', r).length === 0) continue;
      zadnja = r;
      var maks = maksCjeline('Lesson', r);
      if (!otkljucano('Lesson', r) || maks <= 0 || osvojenoCjeline('Lesson', r) < maks) return r;
    }
    return zadnja;
  }

  // kratka imena vrsta za zaglavlje mreže na mobitelu (pet stupaca na 360px)
  var KRATKO_TIPA = { Lesson: 'Lesson', Vocabulary: 'Vocab', Grammar: 'Gram', Practice: 'Pract', Test: 'Test' };

  function renderLessons() {
    var vv = valute();
    // Lesson 0 stoji iznad mreže dok nije prijeđena; kad su sva slova skupljena,
    // seli se ispod popisa svih lekcija.
    var nulaIspod = zavrsenaL0();
    // Retci su razine, stupci vrste — napredak ide odozgo prema dolje. Vidi se samo
    // otključano i, u svakom stupcu, jedna sljedeća zaključana cjelina s kružnicom
    // koja se puni do otključavanja. Brojki bodova nema: omjer nosi traka.
    var sljedecaZ = {}, zadnjiRedak = 1;
    TIPOVI.forEach(function (tip) {
      for (var r = 1; r <= MAX_RAZINA; r++) {
        if (igreCjeline(tip, r).length === 0) continue;
        if (!otkljucano(tip, r)) { sljedecaZ[tip] = r; zadnjiRedak = Math.max(zadnjiRedak, r); break; }
        zadnjiRedak = Math.max(zadnjiRedak, r);
      }
    });
    if (lessonsMobitel()) { renderLessonsVodoravno(vv, sljedecaZ, zadnjiRedak, nulaIspod); return; }
    var html = '<h1 class="sekcija">Lessons</h1>' + (nulaIspod ? '' : plocicaNulaHtml()) +
      '<div class="mrezaOkvir"><table class="mreza"><thead><tr><th class="razF"></th>';
    TIPOVI.forEach(function (tip) {
      html += '<th class="glavaF" style="color:' + BOJA_TIPA[tip] + '">' +
        '<span class="dugo">' + tip + '</span><span class="kratko">' + KRATKO_TIPA[tip] + '</span></th>';
    });
    html += '</tr></thead><tbody>';
    var trake = [];   // trake se pune tek nakon umetanja u DOM, da se animiraju
    for (var r = 1; r <= zadnjiRedak; r++) {
      html += '<tr data-r="' + r + '"><th class="razF">' + r + '</th>';
      for (var t = 0; t < TIPOVI.length; t++) {
        var tip = TIPOVI[t];
        var igre = igreCjeline(tip, r);
        var otklj = igre.length > 0 && otkljucano(tip, r);
        if (!otklj && sljedecaZ[tip] !== r) {
          html += '<td class="faza skriven"></td>';
          continue;
        }
        var id = 'trF' + r + '_' + t;
        if (!otklj) {
          // sljedeća zaključana: kružnica od vrha u smjeru kazaljke na satu
          var val = VALUTA_TIPA[tip], pct;
          if (val) {
            var p = prag(tip, r);
            pct = p > 0 ? Math.min(1, vv[val] / p) : 0;
          } else {
            // Test: otključava se kad su otključane sve četiri faze razine
            var n = 0;
            TIPOVI.slice(0, 4).forEach(function (t2) { if (otkljucano(t2, r)) n++; });
            pct = n / 4;
          }
          trake.push({ id: id, pct: pct, luk: true });
          html += '<td class="faza zakljucano" title="' + esc(tip + ' ' + r + ' — locked') + '">' +
            '<div class="imeF">' + tip + ' ' + r + '</div>' +
            '<div class="lukOkvir"><svg class="lukZ" viewBox="0 0 36 36" aria-hidden="true">' +
              '<circle class="podloga" cx="18" cy="18" r="15" pathLength="100"/>' +
              '<circle class="puni" id="' + id + '" cx="18" cy="18" r="15" pathLength="100"/></svg>' +
              '<span class="lukBrava">' + IK('brava') + '</span></div></td>';
          continue;
        }
        var maks = maksCjeline(tip, r), osv = osvojenoCjeline(tip, r);
        var pun = (maks > 0 && osv >= maks);
        // point-unlocked but behind the subscription wall — distinct label, still clickable
        // (the click hits the idi() gate, which explains why and offers to subscribe)
        var trebaPretplatu = r >= 2 && imaPristup(tip, r) === 'needsSubscription';
        var klase = 'faza' + (pun ? ' gotovo' : '') + (trebaPretplatu ? ' pretplata' : '');
        trake.push({ id: id, pct: maks > 0 ? Math.min(1, osv / maks) : 0 });
        html += '<td class="' + klase + '" title="' + esc(tip + ' ' + r +
            (trebaPretplatu ? ' — needs Croland Plus' : (pun ? ' — complete' : ''))) + '" ' +
          'onclick="pregledCjeline(\'' + tip + '\',' + r + ')">' +
          '<div class="imeF">' + tip + ' ' + r + (pun ? ' ✓' : '') + '</div>' +
          '<div class="tr"><i id="' + id + '"></i></div>' +
          (trebaPretplatu ? '<div class="plusF">' + IK('brava', 'uz') + 'Plus</div>' : '') +
          '</td>';
      }
      html += '</tr>';
    }
    html += '</tbody></table></div>';
    if (nulaIspod) html += plocicaNulaHtml();
    VIEW.innerHTML = html;
    pomakniNaLekciju(prvaNedovrsenaLekcija());
    animirajTrake(trake);
  }

  // ---- Lessons na mobitelu: jedna kartica po razini ----
  // Ista pravila kao mreža na većem ekranu (što je otključano, sljedeća zaključana,
  // pretplata), ali razina je kartica s pet redaka, a kartice se listaju vodoravno.
  var MQ_LESSONS = window.matchMedia ? window.matchMedia('(max-width: 639.98px)') : null;
  function lessonsMobitel() { return !!(MQ_LESSONS && MQ_LESSONS.matches); }
  if (MQ_LESSONS) {
    var naPromjenuLessons = function () {
      if (ZADNJI_VIEW && ZADNJI_VIEW.view === 'lessons' && VIEW && VIEW.querySelector('.mreza, .jedinice')) renderLessons();
    };
    if (MQ_LESSONS.addEventListener) MQ_LESSONS.addEventListener('change', naPromjenuLessons);
    else if (MQ_LESSONS.addListener) MQ_LESSONS.addListener(naPromjenuLessons);
  }
  var IME_TIPA_DUGO = { Lesson: 'Lesson', Vocabulary: 'Vocabulary', Grammar: 'Grammar', Practice: 'Practice', Test: 'Test' };
  var ZNAK_TIPA = { Lesson: 'L', Vocabulary: 'V', Grammar: 'G', Practice: 'P', Test: 'T' };

  function naslovRazine(r) {
    var g = igreCjeline('Lesson', r)[0];
    var n = g && g.cjelinaNaslov ? String(g.cjelinaNaslov) : '';
    if (n) return n.split(':')[0].trim();
    var P = window.PREGLEDI && window.PREGLEDI['Lesson ' + r];
    return P ? P.h : ('Level ' + r);
  }

  function redLessons(tip, r, vv, sljedecaZ, trake) {
    var igre = igreCjeline(tip, r);
    var otklj = igre.length > 0 && otkljucano(tip, r);
    var P = window.PREGLEDI && window.PREGLEDI[tip + ' ' + r];
    var pod = P ? P.h : '';
    var id = 'trM' + r + '_' + TIPOVI.indexOf(tip);
    var boja = 'style="--boja:' + BOJA_TIPA[tip] + '"';
    if (!otklj) {
      var pct = 0, vidljivPostotak = (sljedecaZ[tip] === r);
      if (vidljivPostotak) {
        var val = VALUTA_TIPA[tip];
        if (val) { var p = prag(tip, r); pct = p > 0 ? Math.min(1, vv[val] / p) : 0; }
        else { var n = 0; TIPOVI.slice(0, 4).forEach(function (t2) { if (otkljucano(t2, r)) n++; }); pct = n / 4; }
        trake.push({ id: id, pct: pct });
      }
      return '<div class="fazaRed zakljucano" ' + boja + ' title="' + esc(tip + ' ' + r + ' — locked') + '">' +
        '<span class="fazaZnak">' + IK('brava') + '</span>' +
        '<span class="fazaTekst"><span class="fazaIme">' + IME_TIPA_DUGO[tip] + '</span>' +
          (vidljivPostotak ? '<span class="fazaTr"><i id="' + id + '"></i></span>' : '<span class="fazaPod">Locked</span>') +
        '</span>' +
        '<span class="fazaDesno">' + (vidljivPostotak ? Math.round(pct * 100) + '%' : '') + '</span></div>';
    }
    var maks = maksCjeline(tip, r), osv = osvojenoCjeline(tip, r);
    var pun = (maks > 0 && osv >= maks);
    var trebaPretplatu = r >= 2 && imaPristup(tip, r) === 'needsSubscription';
    var udio = maks > 0 ? Math.min(1, osv / maks) : 0;
    trake.push({ id: id, pct: udio });
    var desno = pun ? IK('kvaka') : (trebaPretplatu ? 'Plus' : (udio > 0 ? Math.round(udio * 100) + '%' : ''));
    return '<button class="fazaRed' + (pun ? ' gotovo' : '') + (trebaPretplatu ? ' pretplata' : '') + '" ' + boja +
        ' onclick="pregledCjeline(\'' + tip + '\',' + r + ')">' +
      '<span class="fazaZnak">' + (pun ? IK('kvaka') : ZNAK_TIPA[tip]) + '</span>' +
      '<span class="fazaTekst"><span class="fazaIme">' + IME_TIPA_DUGO[tip] + '</span>' +
        (pod ? '<span class="fazaPod">' + esc(pod) + '</span>' : '') +
        '<span class="fazaTr"><i id="' + id + '"></i></span></span>' +
      '<span class="fazaDesno">' + desno + '</span></button>';
  }

  function renderLessonsVodoravno(vv, sljedecaZ, zadnjiRedak, nulaIspod) {
    var sad = prvaNedovrsenaLekcija();
    if (sad > zadnjiRedak) sad = zadnjiRedak;
    var trake = [];
    var gumbi = '', kartice = '';
    for (var r = 1; r <= zadnjiRedak; r++) {
      var uk = 0, osv = 0, ijedna = false;
      TIPOVI.forEach(function (tip) {
        if (igreCjeline(tip, r).length && otkljucano(tip, r)) { ijedna = true; uk += maksCjeline(tip, r); osv += osvojenoCjeline(tip, r); }
      });
      var gotova = uk > 0 && osv >= uk;
      gumbi += '<button data-r="' + r + '" class="' + (gotova ? 'gotova' : '') + (ijedna ? '' : ' zakljucana') + '"' +
        ' aria-label="Level ' + r + '">' + (gotova ? '✓' : r) + '</button>';
      var redovi = '';
      TIPOVI.forEach(function (tip) {
        if (igreCjeline(tip, r).length === 0 && !(window.PREGLEDI && window.PREGLEDI[tip + ' ' + r])) return;
        redovi += redLessons(tip, r, vv, sljedecaZ, trake);
      });
      kartice += '<section class="jedinicaKart" data-r="' + r + '">' +
        '<div class="jedinicaGlava"><div class="jedinicaBroj">Level ' + r + '</div>' +
        '<div class="jedinicaNaslov">' + esc(naslovRazine(r)) + '</div>' +
        (ijedna ? '<div class="jedinicaPostotak"><i style="width:' + (uk > 0 ? Math.round(osv / uk * 100) : 0) + '%"></i></div>' : '') +
        '</div>' + redovi + '</section>';
    }
    VIEW.innerHTML = '<h1 class="sekcija">Lessons</h1>' + (nulaIspod ? '' : plocicaNulaHtml()) +
      '<div class="razineTraka">' + gumbi + '</div>' +
      '<div class="jedinice">' + kartice + '</div>' +
      (nulaIspod ? plocicaNulaHtml() : '');
    var traka = VIEW.querySelector('.razineTraka'), niz = VIEW.querySelector('.jedinice');
    var rub = parseFloat(getComputedStyle(niz).paddingLeft) || 16;
    function oznaci(r) {
      traka.querySelectorAll('button').forEach(function (b) { b.classList.toggle('na', +b.getAttribute('data-r') === r); });
      var b = traka.querySelector('button[data-r="' + r + '"]');
      if (b) {
        var l = b.offsetLeft - traka.offsetLeft, d = l + b.offsetWidth;
        if (l < traka.scrollLeft + 16 || d > traka.scrollLeft + traka.clientWidth - 16)
          traka.scrollLeft = l - traka.clientWidth / 2 + b.offsetWidth / 2;
      }
    }
    function idiNa(r, glatko) {
      var k = niz.querySelector('.jedinicaKart[data-r="' + r + '"]');
      if (!k) return;
      var prije = niz.style.scrollBehavior;
      if (!glatko) niz.style.scrollBehavior = 'auto';
      niz.scrollLeft = k.offsetLeft - niz.offsetLeft - rub;
      if (!glatko) niz.style.scrollBehavior = prije;
      oznaci(r);
    }
    traka.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (b) idiNa(+b.getAttribute('data-r'), true);
    });
    var cekaj = null;
    niz.addEventListener('scroll', function () {
      if (cekaj) cancelAnimationFrame(cekaj);
      cekaj = requestAnimationFrame(function () {
        var kart = niz.querySelectorAll('.jedinicaKart'), naj = 1, min = 1e9;
        kart.forEach(function (k) {
          var d = Math.abs(k.offsetLeft - niz.offsetLeft - rub - niz.scrollLeft);
          if (d < min) { min = d; naj = +k.getAttribute('data-r'); }
        });
        oznaci(naj);
      });
    });
    idiNa(sad, false);
    animirajTrake(trake);
  }

  // ================= PREGLED CJELINE =================
  // Prozor prije ulaska u cjelinu: Overview kaže o čemu je riječ, Cheat sheet drži
  // ono što je korisno imati pri ruci. Tekstovi su u pregledi.js; cjelina bez
  // teksta ide ravno unutra, kao i prije.
  var PREGLED = null;
  function pregledCjeline(tip, r) {
    var P = window.PREGLEDI && window.PREGLEDI[tip + ' ' + r];
    if (!P) { idi('unit', tip, r); return; }
    zatvoriPregled();
    var igre = igreCjeline(tip, r);
    var cipovi = [];
    if (igre.length) {
      cipovi.push(IK('popis') + igre.length + (tip === 'Test' ? ' parts' : ' steps'));
      if (tip === 'Test') {
        cipovi.push(IK('zastava') + testPrag(igre) + '% to pass');
        cipovi.push(IK('sat') + Math.round(testTrajanje(igre) / 60) + ' min');
      }
      var maks = maksCjeline(tip, r), osv = osvojenoCjeline(tip, r);
      if (maks > 0 && osv >= maks) cipovi.push('<span class="gotov">' + IK('kvaka') + 'Complete</span>');
      else if (osv > 0 && maks > 0) cipovi.push(Math.round(osv / maks * 100) + '% done');
    }
    var cipHtml = cipovi.map(function (c) {
      var gotov = c.indexOf('class="gotov"') >= 0;
      return '<span class="pregledCip' + (gotov ? ' gotov' : '') + '">' + c.replace(/<span class="gotov">|<\/span>$/g, '') + '</span>';
    }).join('');
    function par(x) { return '<div class="pregledPr"><b>' + esc(x[0]) + '</b><span>' + esc(x[1]) + '</span></div>'; }
    var s1 = (P.s ? '<p class="pregledPod">' + esc(P.s) + '</p>' : '') + (P.ex || []).map(par).join('');
    // susjedni popisi riječi slažu se u jedan, da se čipovi gušće slože
    var blokovi = [];
    (P.p2 || []).forEach(function (b) {
      var z = blokovi[blokovi.length - 1];
      if (b.w && z && z.w) z.w = z.w.concat(b.w); else blokovi.push(b.w ? { w: b.w.slice() } : b);
    });
    var s2 = blokovi.map(function (b) {
      if (b.t) return '<div class="pregledParovi">' + b.t.map(function (x) {
        return '<div class="pregledPar"><b>' + esc(x[0]) + '</b><span>' + esc(x[1]) + '</span></div>';
      }).join('') + '</div>';
      if (b.g) {
        var gl = b.gh || [0];
        return '<table class="pregledMreza">' + b.g.map(function (red, i) {
          return '<tr' + (gl.indexOf(i) >= 0 ? ' class="gl"' : '') + '>' +
            red.map(function (c) { return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>';
        }).join('') + '</table>';
      }
      if (b.w) return '<div class="pregledRijeci">' + b.w.map(function (x) {
        return '<span class="pregledRijec"><b>' + esc(x[0]) + '</b><span>' + esc(x[1]) + '</span></span>';
      }).join('') + '</div>';
      return '';
    }).join('');
    var sloj = document.createElement('div');
    sloj.id = 'pregledSloj';
    sloj.innerHTML =
      '<div class="pregled" role="dialog" aria-modal="true" aria-label="' + esc(tip + ' ' + r) + '" style="--boja:' + BOJA_TIPA[tip] + '">' +
        '<div class="pregledVrh">' +
          '<div class="pregledRed1"><span class="pregledVrsta"><i></i>' + esc(tip + ' ' + r) + '</span>' +
          '<button class="pregledX" aria-label="Close">×</button></div>' +
          '<h2>' + esc(P.h) + '</h2>' +
          (cipHtml ? '<div class="pregledCipovi">' + cipHtml + '</div>' : '') +
        '</div>' +
        '<div class="pregledKartice" role="tablist">' +
          '<button class="na" data-s="0" role="tab">Overview</button>' +
          '<button data-s="1" role="tab">Cheat sheet</button></div>' +
        '<div class="pregledOkvir"><div class="pregledTrak">' +
          '<div class="pregledStr">' + s1 + '</div><div class="pregledStr">' + s2 + '</div>' +
        '</div></div>' +
        '<div class="pregledNoga">' +
          '<button class="gumb pregledStart"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>Start</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(sloj);
    PREGLED = { tip: tip, r: r, str: 0, sloj: sloj };
    var trak = sloj.querySelector('.pregledTrak');
    pregledNaStranicu(0);
    sloj.addEventListener('click', function (e) {
      if (e.target === sloj || e.target.closest('.pregledX')) { zatvoriPregled(); return; }
      var b = e.target.closest('.pregledKartice button');
      if (b) { pregledNaStranicu(+b.getAttribute('data-s')); return; }
      if (e.target.closest('.pregledStart')) {
        var cilj = PREGLED; zatvoriPregled(); idi('unit', cilj.tip, cilj.r);
      }
    });
    // povlačenje prstom (ili mišem) lijevo-desno lista stranice
    var x0 = null, y0 = 0;
    trak.addEventListener('pointerdown', function (e) { x0 = e.clientX; y0 = e.clientY; });
    trak.addEventListener('pointerup', function (e) {
      if (x0 === null) return;
      var dx = e.clientX - x0, dy = e.clientY - y0; x0 = null;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) pregledNaStranicu(PREGLED.str + (dx < 0 ? 1 : -1));
    });
    trak.addEventListener('pointercancel', function () { x0 = null; });
  }
  function pregledNaStranicu(n) {
    if (!PREGLED) return;
    n = Math.max(0, Math.min(1, n));
    PREGLED.str = n;
    var sl = PREGLED.sloj;
    sl.querySelector('.pregledTrak').style.transform = 'translateX(' + (-100 * n) + '%)';
    sl.querySelectorAll('.pregledKartice button').forEach(function (b, i) {
      b.classList.toggle('na', i === n); b.setAttribute('aria-selected', i === n ? 'true' : 'false');
    });
  }
  function zatvoriPregled() {
    var z = $('pregledSloj'); if (z) z.remove();
    PREGLED = null;
  }
  document.addEventListener('keydown', function (e) {
    if (!PREGLED) return;
    if (e.key === 'Escape') { zatvoriPregled(); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { pregledNaStranicu(1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { pregledNaStranicu(0); e.preventDefault(); }
    else if (e.key === 'Enter' && !(e.target && e.target.closest && e.target.closest('.pregledKartice, .pregledX'))) {
      var cilj = PREGLED; zatvoriPregled(); idi('unit', cilj.tip, cilj.r); e.preventDefault();
    }
  });
  window.pregledCjeline = pregledCjeline;

  // redak prve nedovršene lekcije dovodi u pogled samo ako je ispod ruba ekrana
  function pomakniNaLekciju(r) {
    var redak = VIEW.querySelector('.mreza tr[data-r="' + r + '"]');
    if (!redak) return;
    var b = redak.getBoundingClientRect();
    if (b.bottom > window.innerHeight) redak.scrollIntoView({ block: 'center' });
  }

  // trake krenu s nule i naraste u sljedećem kadru — bez toga nema prijelaza;
  // kružnice (luk) se pune istim tokom, preko stroke-dashoffset
  function animirajTrake(popis) {
    if (!popis || !popis.length) return;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        popis.forEach(function (x) {
          var el = document.getElementById(x.id);
          if (!el) return;
          if (x.luk) el.style.strokeDashoffset = String(100 - Math.round(x.pct * 100));
          else el.style.width = Math.round(x.pct * 100) + '%';
        });
      });
    });
  }

  // ---- navigacija između vježbi unutar cjeline ----
  function navigacijaVjezbi(tip, razina, indeks, igre) {
    if (igre.length <= 1) return '';
    var html = '<div class="vjezbeNav">';
    var trake = [];
    igre.forEach(function (g, i) {
      var osv = najbolji(g);
      var zavr = g.bodovi > 0 && osv >= g.bodovi;
      var djelom = osv > 0 && !zavr;
      var klase = 'vnav' + (i === indeks ? ' aktivna' : '') + (zavr ? ' zavrsena' : (djelom ? ' djelom' : ''));
      var naslov = (g.stranica ? g.stranica + '. ' : '') + (g.naslov || ('Exercise ' + (i + 1))) +
        ' — ' + osv + '/' + g.bodovi + ' pts';
      var id = 'vt' + razina + '_' + i;
      trake.push({ id: id, pct: g.bodovi > 0 ? Math.min(1, osv / g.bodovi) : 0 });
      html += '<button class="' + klase + '" title="' + naslov.replace(/"/g, '&quot;') + '" ' +
        'onclick="idi(\'unit\',\'' + tip + '\',' + razina + ',' + i + ')">' +
        '<span>' + (i + 1) + (zavr ? ' ✓' : '') + '</span>' +
        '<span class="vtr"><i id="' + id + '"></i></span>' +
        '</button>';
    });
    // završna stranica je dio lekcije, ne nešto iza nje — stoji u istoj traci
    var uk = maksCjeline(tip, razina), sad = osvojenoCjeline(tip, razina);
    var sviPuni = (uk > 0 && sad >= uk);
    var idF = 'vt' + razina + '_fin';
    trake.push({ id: idF, pct: uk > 0 ? Math.min(1, sad / uk) : 0 });
    html += '<button class="vnav vfin' + (indeks >= igre.length ? ' aktivna' : '') +
      (sviPuni ? ' zavrsena' : '') + '" title="Lesson summary — ' + sad + '/' + uk + ' pts" ' +
      'onclick="idi(\'unit\',\'' + tip + '\',' + razina + ',' + igre.length + ')">' +
      '<span>' + IK('zastava') + '</span><span class="vtr"><i id="' + idF + '"></i></span></button>';
    html += '</div>';
    navTrakeCekaju = trake;
    return html;
  }
  var navTrakeCekaju = null;

  // ================= TEST =================
  // Test nije cjelina s vježbama koje se biraju — to je jedno sjedenje.
  // Sve vježbe idu jedna za drugom, bez rezultata između, s jednim satom za
  // cijeli test i bez rječnika: riječ koja je potrebna piše u samom zadatku.
  // Pauza zaustavlja sat; napuštanje testa poništava pokušaj.

  function testTrajanje(igre) {
    for (var i = 0; i < igre.length; i++) {
      var t = parseInt(igre[i].meta && igre[i].meta.trajanje, 10);
      if (t > 0) return t;
    }
    return 1200;   // 20 minuta
  }
  function testPrag(igre) {
    for (var i = 0; i < igre.length; i++) {
      var p = parseInt(igre[i].meta && igre[i].meta.prag, 10);
      if (p > 0) return p;
    }
    return 70;
  }
  function mmss(s) {
    s = Math.max(0, s | 0);
    var m = Math.floor(s / 60), r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }
  // gasi sat i zastor; zove se pri svakoj navigaciji izvan testa
  function testPrekini() {
    if (TEST && TEST.tajmer) { clearInterval(TEST.tajmer); TEST.tajmer = null; }
    var z = $('testZastor'); if (z) z.remove();
    TEST = null;
  }

  // ---- 1. uvodni zaslon: pravila prije nego sat krene ----
  function renderTestUvod(razina) {
    var igre = igreCjeline('Test', razina);
    if (!igre.length) { renderLessons(); return; }
    testPrekini();
    trakaVidljiva(false); rjecnikVidljiv(false); slikeVjezbe = false;
    var sek = testTrajanje(igre), maks = 0;
    igre.forEach(function (g) { maks += g.bodovi; });
    var prije = osvojenoCjeline('Test', razina);
    var naslovC = 'Test ' + razina + (igre[0].cjelinaNaslov ? ' — ' + igre[0].cjelinaNaslov : '');
    VIEW.innerHTML =
      '<div class="traka">' +
      '<button class="natrag" onclick="idi(\'lessons\')">‹ Back</button>' +
      '<h2>' + naslovC + '</h2>' +
      '</div>' +
      '<div class="testUvod">' +
      '<h2>Before you start</h2>' +
      '<ul>' +
      '<li><span class="ik">' + IK('popis') + '</span><span><strong>' + igre.length + ' exercises</strong>, ' + maks + ' points — everything from level ' + razina + '.</span></li>' +
      '<li><span class="ik">' + IK('sat') + '</span><span><strong>' + Math.round(sek / 60) + ' minutes</strong> for the whole test. The clock runs across all exercises.</span></li>' +
      '<li><span class="ik">' + IK('strelica') + '</span><span>One sitting: exercises follow one another and you cannot go back.</span></li>' +
      '<li><span class="ik">' + IK('zastava') + '</span><span>No scores in between — your result appears only at the end.</span></li>' +
      '<li><span class="ik">' + IK('pauza') + '</span><span>Pause whenever you like. The clock stops with you.</span></li>' +
      '<li><span class="ik">' + IK('knjiga') + '</span><span>No dictionary. Where a word is needed, the English is written into the question.</span></li>' +
      '</ul>' +
      (prije > 0 ? '<div class="testUpozorenje">Your best so far: <strong>' + prije + '</strong>/' + maks + ' points. Only a better result replaces it.</div>' : '') +
      '<button class="gumb" id="btnTestStart">Start the test →</button>' +
      '<div class="testUpozorenje">Leaving before the end means this attempt does not count.</div>' +
      '</div>';
    $('btnTestStart').onclick = function () { testPokreni(razina); };
  }

  // ---- 2. pokretanje ----
  function testPokreni(razina) {
    var igre = igreCjeline('Test', razina);
    if (!igre.length) { renderLessons(); return; }
    oznaciPokrenuto(igre[0].cjelina);
    TEST = {
      razina: razina, igre: igre, i: 0, rez: [],
      preostalo: testTrajanje(igre), prag: testPrag(igre),
      tajmer: null, pauza: false, aktivan: true
    };
    testVjezba();
    testSatPokreni();
  }

  // ---- 3. jedna vježba unutar testa ----
  function testVjezba() {
    if (!uTestu()) return;
    var T = TEST;
    if (T.i >= T.igre.length) { testZavrsi('done'); return; }
    igra = T.igre[T.i];
    slikeVjezbe = false;            // slika bi u testu bila natuknica
    gotovo = false; start = Date.now(); gresakaUVjezbi = 0;
    if (timer) { clearInterval(timer); timer = null; }
    window.scrollTo(0, 0);
    trakaVidljiva(false); rjecnikVidljiv(false);
    VIEW.innerHTML =
      '<div class="traka">' +
      '<button class="natrag" id="btnTestIzlaz">‹ Quit</button>' +
      '<h2>Test ' + T.razina + '</h2>' +
      '<div class="progresBar"><div style="width:' + Math.round(T.i / T.igre.length * 100) + '%"></div></div>' +
      '<span style="font-size:var(--t-s);color:var(--muted)">' + (T.i + 1) + '/' + T.igre.length + '</span>' +
      '<span class="testSat" id="testSat">' + mmss(T.preostalo) + '</span>' +
      '<button class="testPauza" id="btnTestPauza">' + IK('pauza', 'uz') + 'Pause</button>' +
      '</div>' +
      '<div id="opisIgre"></div>' +
      '<div id="ploca">' +
      '<div id="statusTraka"><span id="statL"></span><span id="statR"></span></div>' +
      '<div id="sadrzaj"></div>' +
      '<div id="rezultat"><div class="veliki" id="rezNaslov"></div><div id="rezDetalji"></div>' +
      '<button class="gumb" id="btnDalje" style="display:none"></button>' +
      '<button class="gumb gumbSivi" id="btnPonovno" style="display:none"></button></div>' +
      '<div id="kontrole">' +
      '<button class="gumb gumbSivi" id="btnPredaj">' + IK('preskoci', 'uz') + 'Skip this exercise</button>' +
      '</div></div>';
    $('opisIgre').innerHTML = (igra.naslov ? esc(igra.naslov) + (igra.meta && igra.meta.opis ? ' — ' : '') : '') +
      ((igra.meta && igra.meta.opis) ? mdInline(igra.meta.opis) : '');
    $('btnTestIzlaz').onclick = function () {
      potvrdi('Quit the test?',
        'The test is graded in one sitting. If you leave now, this attempt does not count and nothing is recorded.',
        function () { testPrekini(); idi('lessons'); });
    };
    $('btnTestPauza').onclick = testPauziraj;
    $('btnPredaj').onclick = function () {
      if (gotovo) return;
      potvrdi('Skip this exercise?',
        'It is scored with whatever you have answered so far, and the test moves on. You cannot come back to it.',
        function () {
          if (gotovo || !uTestu()) return;
          var p = predaja ? predaja() : { s: 'skipped', pct: 0 };
          kraj(p.s, p.pct);
        });
    };
    onZavrsi = function () {};
    predaja = null;
    var pokreni = FORMATI[igra.format];
    if (pokreni) pokreni();
    else { $('sadrzaj').textContent = 'Unknown format: ' + igra.format; testKrajVjezbe('unknown format', 0); }
  }

  // ---- 4. sat cijelog testa ----
  function testSatPokreni() {
    if (!uTestu()) return;
    if (TEST.tajmer) { clearInterval(TEST.tajmer); TEST.tajmer = null; }
    testSatOsvjezi();
    TEST.tajmer = setInterval(function () {
      if (!uTestu()) return;
      if (TEST.pauza) return;
      TEST.preostalo--;
      testSatOsvjezi();
      if (TEST.preostalo <= 0) testZavrsi('time');
    }, 1000);
  }
  function testSatOsvjezi() {
    var el = $('testSat'); if (!el || !TEST) return;
    var ikSat = TEST.pauza ? 'pauza' : 'sat';
    if (el.getAttribute('data-ik') !== ikSat) {
      el.setAttribute('data-ik', ikSat);
      el.innerHTML = IK(ikSat, 'uz') + '<span></span>';
    }
    el.lastChild.textContent = mmss(TEST.preostalo);
    el.classList.toggle('zadnjaMinuta', TEST.preostalo <= 60);
  }

  // ---- 5. pauza ----
  function testPauziraj() {
    if (!uTestu() || TEST.pauza) return;
    TEST.pauza = true;
    testSatOsvjezi();
    var z = document.createElement('div');
    z.className = 'testZastor'; z.id = 'testZastor';
    z.innerHTML =
      '<div class="naslovP">' + IK('pauza', 'uz') + 'Paused</div>' +
      '<div class="podP">The clock is stopped. <strong>' + mmss(TEST.preostalo) + '</strong> left when you come back.</div>' +
      '<button class="gumb" id="btnTestNastavi">▶ Resume</button>';
    document.body.appendChild(z);
    $('btnTestNastavi').onclick = testNastavi;
  }
  function testNastavi() {
    var z = $('testZastor'); if (z) z.remove();
    if (!TEST) return;
    TEST.pauza = false;
    testSatOsvjezi();
  }

  // ---- 6. kraj jedne vježbe: rezultat se sprema, ne pokazuje ----
  function testKrajVjezbe(sazetak, pct) {
    gotovo = true;
    if (timer) { clearInterval(timer); timer = null; }
    var T = TEST; if (!T) return;
    pct = Math.max(0, Math.min(1, pct || 0));
    T.rez.push({ igra: igra, sazetak: sazetak, pct: pct, osvojeno: Math.round(igra.bodovi * pct) });
    T.i++;
    var kk = $('kontrole'); if (kk) kk.style.display = 'none';
    var rez = $('rezultat');
    if (rez) {
      var zadnja = (T.i >= T.igre.length);
      $('rezNaslov').textContent = zadnja ? 'Finishing…' : 'Next exercise →';
      $('rezDetalji').textContent = zadnja
        ? 'Adding up your result.'
        : 'Exercise ' + (T.i + 1) + ' of ' + T.igre.length + ' · your score comes at the end';
      rez.style.display = 'block';
      rez.classList.remove('pokazi'); void rez.offsetWidth; rez.classList.add('pokazi');
    }
    setTimeout(function () {
      if (!uTestu()) return;
      if (TEST.i >= TEST.igre.length) testZavrsi('done'); else testVjezba();
    }, 900);
  }

  // ---- 7. kraj testa ----
  function testZavrsi(razlog) {
    if (!TEST) return;
    var T = TEST;
    if (T.tajmer) { clearInterval(T.tajmer); T.tajmer = null; }
    if (timer) { clearInterval(timer); timer = null; }
    var z = $('testZastor'); if (z) z.remove();
    T.pauza = false;
    // vrijeme je isteklo usred vježbe — plati ono što je stvarno riješeno
    if (razlog === 'time' && !gotovo && igra && T.rez.length < T.igre.length) {
      gotovo = true;
      var p = predaja ? predaja() : { s: 'ran out of time', pct: 0 };
      var pc = Math.max(0, Math.min(1, p.pct || 0));
      T.rez.push({ igra: igra, sazetak: p.s, pct: pc, osvojeno: Math.round(igra.bodovi * pc) });
    }
    T.aktivan = false;
    // vježbe do kojih se nije stiglo vrijede nula
    while (T.rez.length < T.igre.length) {
      var g = T.igre[T.rez.length];
      T.rez.push({ igra: g, sazetak: 'not reached', pct: 0, osvojeno: 0 });
    }
    T.rez.forEach(function (r) { zabiljezi(r.igra, r.osvojeno); });
    osvjeziHeader();
    renderTestRezultat(razlog);
  }

  function renderTestRezultat(razlog) {
    var T = TEST; if (!T) { renderLessons(); return; }
    trakaVidljiva(false); rjecnikVidljiv(false);
    var maks = 0, osv = 0, redci = '';
    T.rez.forEach(function (r) {
      maks += r.igra.bodovi; osv += r.osvojeno;

        Math.round(r.pct * 100) + '% · <strong>' + r.osvojeno + '</strong>/' + r.igra.bodovi + '</span></li>';
    });
    var pct = maks > 0 ? Math.round(osv / maks * 100) : 0;
    var prosao = pct >= T.prag;
    var razina = T.razina;
    VIEW.innerHTML =
      '<div class="sazetak">' +
      '<h2>' + (prosao ? 'Test ' + razina + ' passed! 🎉' : 'Test ' + razina + ' — not yet 💪') + '</h2>' +
      '<div style="color:var(--muted)">' +
        (razlog === 'time' ? 'Time ran out — everything you answered still counts.'
                           : 'Whole test, one sitting. Here is how it went.') + '</div>' +
      '<div class="velikiBroj">' + pct + '%</div>' +
      '<div style="color:var(--muted)">' + osv + ' / ' + maks + ' points · pass mark ' + T.prag + '%</div>' +
      '<ul>' + redci + '</ul>' +
      '<div style="color:var(--muted);font-size:var(--t-s)">Only your best test result is kept — retake it any time.</div>' +
      '<button class="gumb" id="btnTestOpet">↻ Take the test again</button>' +
      '<button class="gumb gumbSivi" onclick="idi(\'lessons\')">← Back to lessons</button>' +
      '</div>';
    $('btnTestOpet').onclick = function () { renderTestUvod(razina); };
    if (pct >= 100) konfeti(80); else if (prosao) konfeti(30);
    var nova = noveOtkljucane();
    if (nova.length) setTimeout(function () { prikaziOtkljucanje(nova, { tip: 'Test', razina: razina }); }, 700);
    TEST = null;
  }

  // ---- player cjeline ----
  function renderUnit(tip, razina, indeks) {
    // Defense-in-depth: "Next"/"Play again"/"Try again" call renderUnit() directly, bypassing
    // the idi() gate, so the same check has to live here too.
    if (imaPristup(tip, razina) !== 'ok') { renderLessons(); return; }
    // Test ima vlastiti tijek: uvod s pravilima, pa sve vježbe u komadu.
    if (tip === 'Test') { renderTestUvod(razina); return; }
    // Daily challenge: dostupan je isključivo današnji — ostali su zaključani.
    if (tip === 'Daily challenge' && razina !== dailyDanasnji()) { renderDaily(); return; }
    var igre = igreCjeline(tip, razina);
    if (igre.length === 0) { renderLessons(); return; }
    // Cjelina je otključana, ali njezin sadržaj još nije stigao iz zaštićenog dijela —
    // dohvati ga pa se vrati ovamo. Bez ovoga bi se otvorila prazna vježba.
    if (igre.some(function (g) { return g.zakljucano; })) {
      // Sadržaj je već dohvaćen, a kosturi su i dalje prazni: ključevi
      // (cjelina|stranica|naslov) iz data-plus.json ne odgovaraju objavljenom data.js,
      // tj. data-plus.json u bucketu je stariji od builda. Bez ovog izlaza renderUnit je
      // pozivao sam sebe bez kraja (ucitajPlusSadrzaj kod PLUS_STANJE==='da' odmah vraća
      // uspjeh), pa je cjelina zauvijek stajala na "Loading this unit…" i rušila se s
      // "Maximum call stack size exceeded". Jedna nepoklopljena vježba ubija cijelu cjelinu.
      if (PLUS_STANJE === 'da') {
        var bezSadrzaja = igre.filter(function (g) { return g.zakljucano; })
          .map(function (g) { return (g.cjelina || '') + '|' + g.stranica + '|' + g.naslov; });
        console.error('Vjezbe bez para u data-plus.json (' + bezSadrzaja.length + '/' +
          igre.length + '): ', bezSadrzaja);
        VIEW.innerHTML = '<div class="zakljBanner">This unit is temporarily unavailable — ' +
          'its content is out of date on the server. Please try again later.</div>';
        return;
      }
      VIEW.innerHTML = '<div class="zakljBanner">Loading this unit…</div>';
      ucitajPlusSadrzaj(function (uspjeh) {
        if (uspjeh) renderUnit(tip, razina, indeks);
        else VIEW.innerHTML = '<div class="zakljBanner">This unit could not be loaded. ' +
          'Check your connection and try again.</div>';
      });
      return;
    }
    oznaciPokrenuto(igre[0].cjelina);
    // Scena papirica je CJELINA, ne pojedina vjezba: biljeska napisana na drugoj
    // stranici stoji i na petoj, i na zavrsnom pregledu iste cjeline.
    postaviScenuCedulja('u|' + tip + '|' + razina);
    if (indeks >= igre.length) { renderSummary(tip, razina); return; }
    igra = igre[indeks];
    slikeVjezbe = vjezbaImaSveSlike(igra);
    gotovo = false; start = Date.now();
    // svaka vježba kreće s čistim brojačem grešaka i bez naslijeđenog oblačića
    gresakaUVjezbi = 0; sakrijSavjetRj();
    var naslovC = (tip === 'Daily challenge' ? 'Daily challenge' : tip + ' ' + razina) +
      (igre[0].cjelinaNaslov ? ' — ' + igre[0].cjelinaNaslov : '');
    // iz Lesson 0 se izlazi na naslovnicu — i pri prvom ulasku
    var jeNula = (tip === L0_TIP && razina === L0_RAZINA);
    var natragView = jeNula ? 'main' : ((VALUTA_TIPA[tip] || tip === 'Test') ? 'lessons' : 'daily');
    // Lesson 0: traka abecede JE traka napretka — bez postotka i brojača stranica
    trakaVidljiva(jeNula);
    rjecnikVidljiv(true, tip, razina);
    // Val preko lebdecih ikona (rjecnik -> igrica -> info) pri otvaranju stranice.
    // U lekciji 0 na svakoj, jer je ona uputa za koristenje aplikacije; drugdje
    // samo ondje gdje je rjecnik stvarno pri ruci (v. podsjetnikRjecnika).
    if (jeNula || podsjetnikRjecnika(igra.format, indeks)) istakniLebdece(tip + '|' + razina + '|' + indeks);
    if (!jeNula) ponudiSavjetPomaka();
    VIEW.innerHTML =
      '<div class="traka">' +
      '<button class="natrag" onclick="idi(\'' + natragView + '\')">' + (jeNula ? '‹ Explore the app' : '‹ Back') + '</button>' +
      '<h2>' + (jeNula ? 'Lesson 0' + (igre[0].cjelinaNaslov ? ' — ' + igre[0].cjelinaNaslov : '') : naslovC) + '</h2>' +
      (jeNula ? '' :
        '<div class="progresBar"><div style="width:' + Math.round(indeks / igre.length * 100) + '%"></div></div>' +
        '<span style="font-size:var(--t-s);color:var(--muted)">' + (indeks + 1) + '/' + igre.length + '</span>') +
      '</div>' +
      navigacijaVjezbi(tip, razina, indeks, igre) +
      '<div id="opisIgre"></div>' +
      '<div id="ploca">' +
      '<div id="statusTraka"><span id="statL"></span><span id="statR"></span></div>' +
      '<div id="sadrzaj"></div>' +
      '<div id="rezultat"><div class="veliki" id="rezNaslov">Great job! 🎉</div><div id="rezDetalji"></div>' +
      '<button class="gumb" id="btnDalje">Next →</button>' +
      '<button class="gumb gumbSivi" id="btnPonovno">↻ Play again</button></div>' +
      '<div id="kontrole">' +
      '<button class="gumb gumbSivi" id="btnPredaj">' + (jeNula ? 'Skip →' : IK('zastava', 'uz') + 'Finish now') + '</button>' +
      '<button class="gumb gumbSivi" id="btnOpet">↻ Try again</button></div>' +
      '</div>';
    animirajTrake(navTrakeCekaju); navTrakeCekaju = null;
    $('opisIgre').innerHTML = (igra.naslov ? esc(igra.naslov) + (igra.meta && igra.meta.opis ? ' — ' : '') : '') +
      ((igra.meta && igra.meta.opis) ? mdInline(igra.meta.opis) : '');
    $('btnDalje').onclick = function () { renderUnit(tip, razina, indeks + 1); osvjeziHeader(); };
    $('btnPonovno').onclick = function () { renderUnit(tip, razina, indeks); };
    $('btnPredaj').onclick = function () {
      if (gotovo) return;
      // u lekciji 0 se ništa ne mora dovršiti — preskakanje je bez pitanja i bez kazne
      if (jeNula) { renderUnit(tip, razina, indeks + 1); osvjeziHeader(); return; }
      potvrdi('Finish now?', 'The exercise ends and you take the points earned so far.', function () {
        if (gotovo) return;
        var p = predaja ? predaja() : { s: 'submitted early', pct: 0 };
        kraj(p.s, p.pct);
      });
    };
    $('btnOpet').onclick = function () {
      if (gotovo) return;
      potvrdi('Try again?', 'Current progress in this exercise will be lost.', function () {
        if (timer) { clearInterval(timer); timer = null; }
        renderUnit(tip, razina, indeks);
      });
    };
    onZavrsi = function () {};
    predaja = null;
    // Svaka vjezba krece s netaknutim zvucnicima: poziv na slusanje se nudi
    // jednom po stranici, i samo dok ga polaznik sam nije pretekao.
    zvDirnut = false;
    var pokreni = FORMATI[igra.format];
    if (pokreni) pokreni();
    else { $('sadrzaj').textContent = 'Unknown format: ' + igra.format; $('rezultat').style.display = 'block'; }
    // Jedno mjesto za sve formate: ako na stranici ima ijedan zvucnik, prvi
    // kratko zatitra. Mehanike koje same crtaju sadrzaj kasnije (npr. odgoden
    // prvi zadatak) samo dobiju poziv koji nista ne nade — bez stete.
    pozoviNaSlusanje(1500);
    // tihi podsjetnik na rječnik u 2., 5. i 8. vježbi lekcije 0
    if (jeNula && SAVJETI_L0[indeks]) {

    // ...a u svakoj drugoj lekciji na stranicama gdje rjecnik stvarno pomaze
    // (v. komentar uz podsjetnikRjecnika)
    if (!jeNula) {

      if (pods) setTimeout(function () { if (!gotovo) pokaziSavjetRj(pods); }, 2400);
    }
    // prvi bodovani prizor u životu polaznika: objasni gdje bodovi stoje i da se ne broje kazne
    if (!jeNula) {

        if (gotovo) return;
        if (igra.format === 'brzina') jednomPokazi('sat', 'hudBodovi', SAVJET_SAT);
        else jednomPokazi('bodovi', 'valuteHeader', SAVJET_BODOVI, { gore: true });

  }

  function renderSummary(tip, razina) {

      // jedina proslava u cijeloj lekciji — tek ovdje, na kraju

    // ---- završna stranica lekcije ----

    VIEW.innerHTML =

      'stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + C.toFixed(1) + '"></circle>' +
      '</svg>' +
      '<div class="sredina"><div class="pct" id="prstenPct">0%</div>' +

      '</div>' +

      kutija +
      btnNext +

      (natragView === 'daily' ? 'Daily challenge' : 'Lessons') + '</button></div>';

    animirajTrake(navTrakeCekaju); navTrakeCekaju = null;

    // prsten se puni, brojka se broji — animacija kreće tek nakon prvog kadra
    setTimeout(function () {
      var luk = document.getElementById('prstenLuk');
      if (luk) luk.setAttribute('stroke-dashoffset', (C * (1 - pct / 100)).toFixed(1));
      brojiDo('prstenPct', 0, pct, 1200, '%');
      brojiDo('prstenBod', 0, osv, 1200, '');
    }, 120);
    trake.forEach(function (x) {
      setTimeout(function () {
        var el = document.getElementById(x.id);
        if (el) el.style.width = Math.round(x.pct * 100) + '%';
      }, x.kasni);
    });
    if (sve) setTimeout(function () { konfeti(120); }, 700);
  }

  // brojka koja naraste do cilja — isti tempo kao prsten, da se čita kao jedna stvar
  function brojiDo(id, od, doK, ms, sufiks) {
    var el = document.getElementById(id);
    if (!el) return;
    var t0 = null;
    function kadar(t) {
      if (t0 === null) t0 = t;
      var k = Math.min(1, (t - t0) / ms);
      var e = 1 - Math.pow(1 - k, 3);            // ease-out, isti osjećaj kao traka
      el.textContent = Math.round(od + (doK - od) * e) + sufiks;
      if (k < 1) requestAnimationFrame(kadar);
    }
    requestAnimationFrame(kadar);
  }

  // ---- Dictionary ----
  // Natuknica se prikazuje u OSNOVNOM obliku; ostali oblici i izgovor se otkrivaju klikom.
  // Ikona iz spritea. Boju i velicinu uzima iz teksta u kojem stoji.
  function IK(ime, dodatno) {
    return '<svg class="ikn' + (dodatno ? ' ' + dodatno : '') + '" aria-hidden="true">' +
      '<use href="#ik-' + ime + '"></use></svg>';
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  // "čitati → čitam, čitaš, čita" -> ["čitati", ["čitam","čitaš","čita"]]
  // "crven / crvena / crveno"     -> ["crven",  ["crvena","crveno"]]
  function razlomiHr(hr) {
    // "/" uvijek razdvaja alternative; "," razdvaja samo iza strelice ili u nizu jednorječnih oblika
    function poKosoj(x) {
      return String(x).split(/\s*\/\s*/).map(function (y) { return y.trim(); }).filter(Boolean);
    }
    function poZarezu(x) {
      return String(x).split(/\s*,\s*/).map(function (y) { return y.trim(); }).filter(Boolean);
    }
    var dijelovi = String(hr || '').trim().split(/\s*(?:→|->|=>)\s*/);
    var glava = poKosoj(dijelovi[0]);
    var t = glava[0] || '';
    var ostatak = glava.slice(1);
    dijelovi.slice(1).forEach(function (d) {
      poZarezu(d).forEach(function (x) { poKosoj(x).forEach(function (y) { ostatak.push(y); }); });
    });
    // niz oblika bez strelice: "nemam, nemaš, nema, ..." -> "nemam" + ostali
    if (dijelovi.length === 1 && t.indexOf(',') !== -1) {
      var c = poZarezu(t);
      if (c.length > 1 && c.every(function (x) { return x.indexOf(' ') === -1; })) {
        t = c[0]; ostatak = c.slice(1).concat(ostatak);
      }
    }
    return [t, ostatak];
  }
  // "to read · CHEE-tah-tee" -> ["to read", "CHEE-tah-tee"]
  function razlomiEn(en) {
    var d = String(en || '').split(/\s*·\s*/).map(function (x) { return x.trim(); }).filter(Boolean);
    return [d[0] || '', d.slice(1).join(' · ')];
  }
  // ================= JEZGRA RJEČNIKA =================
  // Jedan izvor natuknica i JEDAN renderer — koriste ih i stranica Dictionary
  // i lebdeći rječnik, pa je prikaz nužno identičan.

  // Formati koji stvarno nose par "hrvatska riječ | engleski prijevod".
  // Sve ostalo (izbor, upis, provjera, brzina, parovi, slaganje, dijalog, tekst,
  // razvrstavanje, poredak) su zadaci: st[0] je pitanje, popuna praznine ili
  // čak naziv podformata — takve stavke NISU rječničke natuknice.
  var FORMATI_RIJECI = {
    kartice: 1, memorija: 1, spajanje: 1, pamti: 1, zid: 1, baloni: 1, slova: 1, vlak: 1
  };
  function jeRjecnickaStavka(hr, en) {
    if (!hr || !en) return false;
    var s = String(hr).trim();
    if (s.indexOf('___') !== -1 || s.indexOf('…') !== -1) return false;
    if (/^(izbor|upis|slaganje|poredak|razvrstavanje)$/i.test(s)) return false;
    return jeNatuknica(s);
  }
  // Sve natuknice jedne cjeline (lekcije) — bez obzira je li ih korisnik dodao.
  // Natuknice jedne vjezbe. natukniceCjeline gradi se iz ovoga da filtar
  // (koji je format rjecnicki, koja je stavka natuknica) postoji na jednom mjestu.
  function natukniceIgre(g, vidjeno) {
    var red = [];
    if (!g || !FORMATI_RIJECI[g.format]) return red;
    vidjeno = vidjeno || {};
    g.stavke.forEach(function (st) {
      var hr = String(st[0] || '').trim(), en = String(st[1] || '').trim();
      if (!jeRjecnickaStavka(hr, en)) return;
      natuknice(hr, en).forEach(function (p) {
        var k = kljucRijeci(p.hr);
        if (!k || vidjeno[k]) return;
        vidjeno[k] = 1;
        red.push({ hr: p.hr, en: p.en, rod: p.rod || '', broj: p.broj || '', izvor: g.cjelina || '' });
      });
    });
    return red;
  }
  // ---- prijevod spremljene riječi na jeziku sučelja ----
  // Zapis u PROGRESS.rjecnik pamti prijevod iz trenutka spremanja. Korisnik koji promijeni
  // jezik mora svoje riječi vidjeti na novom jeziku, pa se prijevod pri prikazu uzima iz
  // podataka ove stranice (kartice cjelina, pa rječnik lema), a spremljeni samo kad ga ondje nema.
  // Zapis spremljen na ovom jeziku (jez === JEZIK_APP) prikazuje se točno kako je spremljen.
  var _lokalniPrijevodi = null;
  function lokalniPrijevodi() {
    if (_lokalniPrijevodi) return _lokalniPrijevodi;
    var m = {}, vidjeno = {};
    IGRE.forEach(function (g) {
      natukniceIgre(g, vidjeno).forEach(function (r) {
        var k = kljucRijeci(r.hr);
        if (k && r.en && !m[k]) m[k] = { en: r.en, izvor: r.izvor };
      });
    });
    var prij = (window.RJECNIK && window.RJECNIK.prijevodi) || {};
    Object.keys(prij).forEach(function (lema) {
      var k = kljucRijeci(lema);
      if (k && !m[k] && prij[lema] && prij[lema].length) m[k] = { en: prij[lema].join(', '), izvor: '' };
    });
    return (_lokalniPrijevodi = m);
  }
  function prijevodZapisa(st) {
    if (!st) return '';
    if (st.jez === JEZIK_APP) return st.en || '';
    var l = lokalniPrijevodi()[kljucRijeci(st.hr)];
    if (!l) return st.en || '';
    var en = l.en;
    // izgovor ostaje samo u cjelinama u kojima je namjerno zadržan (kao u dodajURjecnik)
    if (!IZGOVOR_CJELINE[st.izvor || l.izvor] && en.indexOf(' · ') !== -1) en = en.split(' · ')[0].trim();
    return en;
  }
  function natukniceCjeline(tip, razina) {
    var vidjeno = {}, red = [];
    igreCjeline(tip, razina).forEach(function (g) {
      red = red.concat(natukniceIgre(g, vidjeno));
    });
    return poredajNatuknice(red);
  }

  // ---- SVE riječi koje se pojave u cjelini ----
  // Kartice pokrivaju samo ono što je cjelina namjerno "učila". U gramatici i vježbanju
  // nema kartica pa je popis bio prazan, a baš ondje riječi nemaju prijevod uz sebe.
  // Zato ovdje prolazimo kroz SVE zadatke i svaku hrvatsku riječ svodimo na lemu
  // preko morfološkog indeksa iz rjecnik.js — i nove i one odavno viđene.
  var _rijeciCjeline = {};
  // engleske rečenice ne smiju upasti: polje se prihvaća samo ako se većina
  // njegovih riječi prepozna kao hrvatski oblik
  function hrvatskoPolje(txt) {
    var rijeci = String(txt).split(/[\s—–…]+/).map(ocistiRijec).filter(function (r) { return r.length > 1; });
    if (!rijeci.length) return null;
    var pogodaka = 0;
    rijeci.forEach(function (r) { if (OBLICI[r]) pogodaka++; });
    return (pogodaka / rijeci.length >= 0.6) ? rijeci : null;
  }
  // hrvatski primjeri unutar engleske proze uvijek su u *kurzivu* ili **podebljani**
  function istaknutiDijelovi(txt) {
    var out = [], re = /\*{1,2}([^*]+)\*{1,2}/g, m;
    while ((m = re.exec(String(txt)))) out.push(m[1]);
    return out;
  }
  function rijeciCjeline(tip, razina) {
    var kk = tip + '|' + razina;
    if (_rijeciCjeline[kk]) return _rijeciCjeline[kk];
    var vidjeno = {}, red = [];
    function uzmi(rijeci) {
      rijeci.forEach(function (r) {
        (OBLICI[r] || []).forEach(function (lema) {
          if (vidjeno[lema]) return;
          vidjeno[lema] = 1;
          var z = LEME[lema] || {};
          var prij = (window.RJECNIK && window.RJECNIK.prijevodi) || {};
          red.push({ hr: lema, en: (prij[lema] || []).join(', '), rod: '', broj: '', izvor: '' });
        });
      });
    }
    igreCjeline(tip, razina).forEach(function (g) {
      g.stavke.forEach(function (st) {
        st.forEach(function (polje) {
          var t = String(polje || '');
          if (!t) return;
          if (/^en:\s*/i.test(t)) return;                 // to je zadani prijevod, ne hrvatski
          istaknutiDijelovi(t).forEach(function (d) {
            var r = hrvatskoPolje(d); if (r) uzmi(r);
          });
          var cijelo = hrvatskoPolje(t.replace(/\*/g, ''));
          if (cijelo) uzmi(cijelo);
        });
      });
    });
    // kurirane natuknice cjeline imaju bolji prijevod od generičkog — one imaju prednost
    var kurirane = natukniceCjeline(tip, razina), imaKuriranu = {};
    kurirane.forEach(function (r) { imaKuriranu[kljucRijeci(r.hr)] = 1; });
    var spoj = kurirane.concat(red.filter(function (r) { return !imaKuriranu[kljucRijeci(r.hr)]; }));
    _rijeciCjeline[kk] = poredajNatuknice(spoj);
    return _rijeciCjeline[kk];
  }
  // Sve natuknice koje je korisnik dodao u svoj rječnik.
  function rjecnikRijeci() {
    var r = PROGRESS.rjecnik || {}, lista = [], vidjeno = {};
    Object.keys(r).forEach(function (k) {
      var st = r[k];
      if (!st || !st.hr || !jeNatuknica(st.hr)) return;
      natuknice(st.hr, prijevodZapisa(st)).forEach(function (p) {
        var kp = kljucRijeci(p.hr);
        if (!kp || vidjeno[kp]) return;
        vidjeno[kp] = 1;
        lista.push({
          hr: p.hr, en: p.en, izvor: st.izvor || '',
          rod: st.rod || p.rod || '', broj: st.broj || p.broj || ''
        });
      });
    });
    return poredajNatuknice(lista);
  }
  function poredajNatuknice(lista) {
    return lista.sort(function (a, b) {
      return razlomiHr(a.hr)[0].localeCompare(razlomiHr(b.hr)[0], 'hr');
    });
  }
  function brojRijeci() { return rjecnikRijeci().length; }

  function zvHtml(txt) {
    return imaZvuk(txt) ? '<span class="zvucnik" data-rijec="' + esc(txt) + '">' + IK('zvuk') + '</span>' : '';
  }
  function odgovaraFilteru(r, f) {
    if (!f) return true;
    if (norm(r.hr).indexOf(f) !== -1 || norm(r.en).indexOf(f) !== -1) return true;
    // Traženje po sklonjenom obliku: "cijelu" pronalazi natuknicu "cijeli".
    var leme = zapisiZaOblik(f).map(function (z) { return z.lema; });
    if (!leme.length) return false;
    var osnovni = norm(razlomiHr(r.hr)[0]);
    return leme.some(function (l) { return norm(l) === osnovni; });
  }
  // Jedna kartica riječi — identičan HTML u oba prikaza.
  // U popisu NIKAD nema slike (bila bi presitna); slika živi u otvorenim detaljima,
  // i to samo na stranici Dictionary (opcije.slikaUDetalju).
  // ---- Gramatika iz rjecnik.js ----
  // LEME: lema -> zapis.  OBLICI: bilo koji oblik (mala slova) -> [lema].
  // Indeks se gradi jednom pri pokretanju; ~14 650 oblika, nekoliko ms.
  var LEME = {}, OBLICI = {};
  (function gradiIndeks() {
    var baza = (window.RJECNIK && window.RJECNIK.leme) || [];
    function dodaj(oblik, lema) {
      if (!oblik) return;
      var k = String(oblik).toLowerCase();
      if (!OBLICI[k]) OBLICI[k] = [];
