        '<button type="button" class="smjerG" id="dictSmjerGM">' +
          '<span id="dictSmjerTM"></span><span class="zam">⇄</span></button>' +
        '<button type="button" class="zvjFilterG" id="dictZvjGM" title="Show favourites only" aria-pressed="false">' +
          IK('zvijezda') + '</button>' +
        segmentHtml('dictOpsegM', 'data-opseg', [
          { v: 'moje', t: 'My words', k: 'Mine' },
          { v: 'sve', t: 'Full dictionary', k: 'All' }
        ], dictOpseg) +
      '</div>' +
      '<div class="dictTijelo">' +
        '<div id="popisRijeci"></div>' +
        '<div class="abcTraka" id="abcTraka" tabindex="0" role="navigation" ' +
          'aria-label="Jump to a letter" hidden></div>' +
      '</div>' +
      '<div class="abcBalon" id="abcBalon" aria-live="polite"></div>' +
      '</div>';

    function lista() {
      if (dictFav) {
        if (dictSmjer === 'en-hr') return mojeNatukniceEn().filter(function (r) {
          return (r.hr || []).some(function (h) { return jeFavorit(h); });
        });
        return rjecnikRijeci().filter(function (r) { return jeFavorit(r.hr); });
      }
      if (dictSmjer === 'en-hr') return dictOpseg === 'sve' ? sveNatukniceEn() : mojeNatukniceEn();
      return dictOpseg === 'sve' ? sveNatukniceHr() : rjecnikRijeci();
    }
    // Prazan popis ne treba ni trazilicu ni smjer ni test — treba put do prvih rijeci.
    function praznoHtml() {
      if (dictOpseg === 'sve') {
        return '<div class="dictPrazno"><h2>The dictionary file is missing</h2>' +
          '<p>rjecnik.js was not generated — run osvježi.bat and reload the page.</p></div>';
      }
      var imaSve = sveNatukniceHr().length > 0;
      return '<div class="dictPrazno"><h2>No words saved yet</h2>' +
        '<p>Every word you meet in a lesson can be kept here — tap ' +
        '<b>+ Add to dictionary</b> underneath it. This list is what the word test drills.</p>' +
        '<div class="radnje">' +
        '<button type="button" class="gumb" style="max-width:14rem" data-dcilj="lessons">Open a lesson</button>' +
        (imaSve ? '<button type="button" class="smjerG" data-dcilj="sve">Browse the full dictionary</button>' : '') +
        '</div></div>';
    }
    // Na računalu okvir raste s najduljim retkom (TRI UREĐAJA). Dok u tražilici
    // ima teksta, ne smije se suziti: tražilica i tipke skakale bi sa svakim
    // slovom. Prazna tražilica vraća širinu popisu.
    function zadrziSirinu(filter) {
      var okvir = $('dictOkvir');
      if (!filter) { okvir.style.removeProperty('--dictZadrzi'); return; }
      okvir.style.setProperty('--dictZadrzi', okvir.getBoundingClientRect().width + 'px');
    }
    function crtaj(filter) {
      zadrziSirinu(filter);
      var l = lista();
      var praznoStanje = (l.length === 0 && !filter && !dictFav);
      var zg = $('dictZvjG');
      zg.classList.toggle('da', dictFav); zg.setAttribute('aria-pressed', String(dictFav));
      zg.title = dictFav ? 'Show all words' : 'Show favourites only';
      zg.setAttribute('aria-label', zg.title);
      var zm = $('dictZvjGM');
      if (zm) {
        zm.classList.toggle('da', dictFav); zm.setAttribute('aria-pressed', String(dictFav));
        zm.title = zg.title; zm.setAttribute('aria-label', zg.title);
      }
      $('dictBrojac').textContent = dictFav
        ? (l.length ? l.length + (l.length === 1 ? ' favourite' : ' favourites') : 'no favourites yet')
        : dictOpseg === 'sve'
        ? (l.length ? l.length + ' entries in the full dictionary' : 'dictionary not loaded')
        : (l.length ? l.length + (l.length === 1 ? ' word added' : ' words added') : 'nothing saved yet');
      $('dictAlat').hidden = praznoStanje;
      if ($('dictMob')) $('dictMob').hidden = praznoStanje;
      // Opseg u zbijenom stanju živi u alatu; ako alat nestane, mora natrag u
      // naslov — inače bi s njim nestao i jedini put do punog rječnika.
      if (praznoStanje && dictZbijen) dictNaPomak();
      if (praznoStanje) { $('popisRijeci').innerHTML = praznoHtml(); abcOsvjezi(); return; }
      $('popisRijeci').innerHTML = htmlPopisRijeci(l, filter, {
        smjer: dictSmjer,
        // slika postoji samo za riječi koje je korisnik dodao; izvor lekcije se u rječniku ne prikazuje
        slikaUDetalju: dictSmjer === 'hr-en' && dictOpseg === 'moje',
        izvor: false,
        prazno: (dictFav && !filter)
          ? 'No favourites yet. Tap ' + IK('zvijezda') + ' next to any word to keep it here.'
          : 'Nothing matches that search.'
      });
      abcOsvjezi();
      // Novi popis je druge duljine: mozda smo odjednom na vrhu, mozda duboko
      // u njemu — stanje trake se preispituje odmah, ne tek na prvi pomak.
      dictNaPomak();
      // Opseg je pritom mozda promijenio i mjesto i velicinu; klizac se mjeri
      // iz DOM-a pa se mora preračunati kad se sve slegne.
      segmentiPostavi($('dictOkvir'));
    }

    // ---- abecedna traka ----
    // Traka se gradi iz onoga što je na ekranu, ne iz abecede: filtar i smjer
    // mijenjaju popis, a slova koja popis nema ostaju blijeda i vode na
    // najbliže koje ima. Prvu karticu svakog slova pamtimo pri gradnji — kod
    // 2000 natuknica traženje po DOM-u na svaki pomak prsta ne bi stiglo.
    var abcMapa = {}, abcRed = [], abcVuce = false, abcSad = '';
    function abcOsvjezi() {
      var traka = $('abcTraka'); if (!traka) return;
      var kartice = $('popisRijeci').querySelectorAll('.rijecKart[data-s]');
      abcMapa = {};
      for (var i = 0; i < kartice.length; i++) {
        var s = kartice[i].getAttribute('data-s');
        if (!abcMapa[s]) abcMapa[s] = kartice[i];
      }
      // Ispod dvadesetak kartica popis stane na dva ekrana — traka bi bila ukras.
      if (kartice.length < 24) { traka.hidden = true; traka.innerHTML = ''; abcRed = []; return; }
      var jezik = (dictSmjer === 'en-hr') ? 'en' : 'hr';
      abcRed = (dictSmjer === 'en-hr' ? ABC_EN : ABC_HR).slice();
      Object.keys(abcMapa).forEach(function (s) { if (abcRed.indexOf(s) < 0) abcRed.push(s); });
      abcRed.sort(function (a, b) {
        if (a === '#') return 1;
        if (b === '#') return -1;
        return a.localeCompare(b, jezik);
      });
      traka.hidden = false;
      traka.innerHTML = abcRed.map(function (s) {
        return '<span class="abcS' + (abcMapa[s] ? '' : ' nema') + '" data-s="' + esc(s) + '">' +
          esc(s) + '</span>';
      }).join('');
      abcSad = '';
    }
    // Slovo kojega nema vodi na prethodno koje ima (kao u imeniku): prst je
    // dotle već prešao taj dio popisa, pa skok unatrag ne izgleda kao promašaj.
    function abcCilj(s) {
      if (abcMapa[s]) return abcMapa[s];
      var i = abcRed.indexOf(s);
      for (var k = 1; k < abcRed.length; k++) {
        if (i - k >= 0 && abcMapa[abcRed[i - k]]) return abcMapa[abcRed[i - k]];
        if (i + k < abcRed.length && abcMapa[abcRed[i + k]]) return abcMapa[abcRed[i + k]];
      }
      return null;
    }
    function abcOznaci(s) {
      var traka = $('abcTraka'), balon = $('abcBalon');
      [].forEach.call(traka.querySelectorAll('.abcS'), function (e) {
        e.classList.toggle('tren', e.getAttribute('data-s') === s);
      });
      balon.textContent = s;
    }
    function abcSkoci(s, glatko) {
      var cilj = abcCilj(s);
      if (!cilj) return;
      cilj.scrollIntoView({ block: 'start', behavior: glatko ? 'smooth' : 'auto' });
      // Drugi skok samo ako je prvi usput zbio ili otpustio traku: tada se
      // promijenila mjera pod kojom kartica staje. Inace se ne dira — svaki
      // suvisan skok je trzaj.
      var prije = dictZbijen;
      dictNaPomak();
      if (dictZbijen !== prije) {
        dictLjepilo();
        cilj.scrollIntoView({ block: 'start', behavior: 'auto' });
      }
    }
    // Slovo kartice koja je prva ispod zalijepljenog alata. Kartice stoje jedna
    // ispod druge, pa se prva vidljiva nalazi raspolavljanjem — kod 2000 njih
    // redom bi to bilo 2000 mjerenja, ovako ih je jedanaest.
    function abcSlovoNaVrhu() {
      var djeca = $('popisRijeci').children;
      if (!djeca.length) return '';
      var cilj = (parseFloat(getComputedStyle($('dictOkvir')).getPropertyValue('--dictLjepilo')) || 0) + 4;
      var lo = 0, hi = djeca.length - 1, nasao = null;
      while (lo <= hi) {
        var sr = (lo + hi) >> 1;
        if (djeca[sr].getBoundingClientRect().bottom <= cilj) lo = sr + 1;
        else { nasao = djeca[sr]; hi = sr - 1; }
      }
      return (nasao && nasao.getAttribute('data-s')) || '';
    }
    function abcSlovoNaY(y) {
      var djeca = $('abcTraka').children;
      if (!djeca.length) return '';
      for (var i = 0; i < djeca.length; i++) {
        var r = djeca[i].getBoundingClientRect();
        if (y <= r.bottom) return djeca[i].getAttribute('data-s');
      }
      return djeca[djeca.length - 1].getAttribute('data-s');
    }
    function abcNaY(y) {
      var s = abcSlovoNaY(y);
      if (!s || s === abcSad) return;
      abcSad = s;
      abcOznaci(s);
      var balon = $('abcBalon');
      balon.style.top = Math.round(y) + 'px';
      // kratak titraj samo ondje gdje ga ima smisla tražiti (prst, ne miš)
      if (navigator.vibrate && matchMedia('(pointer: coarse)').matches) navigator.vibrate(4);
      abcSkoci(s, false);
    }
    function abcVezi() {
      var traka = $('abcTraka'), balon = $('abcBalon');
      traka.addEventListener('pointerdown', function (e) {
        abcVuce = true; abcSad = '';
        try { traka.setPointerCapture(e.pointerId); } catch (err) {}
        traka.classList.add('vuce');
        // balon staje lijevo od trake, taman da ga prst ne pokrije
        balon.style.right = Math.round(innerWidth - traka.getBoundingClientRect().left + 10) + 'px';
        balon.classList.add('vidi');
        abcNaY(e.clientY);
        e.preventDefault();
      });
      traka.addEventListener('pointermove', function (e) {
        if (abcVuce) { abcNaY(e.clientY); e.preventDefault(); }
      });
      function kraj() {
        if (!abcVuce) return;
        abcVuce = false;
        traka.classList.remove('vuce');
        balon.classList.remove('vidi');
        [].forEach.call(traka.querySelectorAll('.abcS.tren'), function (e) { e.classList.remove('tren'); });
      }
      traka.addEventListener('pointerup', kraj);
      traka.addEventListener('pointercancel', kraj);
      // Tipkovnica: traka je jedna meta, pa strelice hodaju po slovima koja postoje.
      traka.addEventListener('keydown', function (e) {
        var ima = abcRed.filter(function (s) { return abcMapa[s]; });
        if (!ima.length) return;
        var i = ima.indexOf(abcSad), n = ima.length;
        if (e.key === 'ArrowDown' || e.key === 'ArrowRight') i = Math.min(n - 1, i + 1);
        else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') i = i <= 0 ? 0 : i - 1;
        else if (e.key === 'Home') i = 0;
        else if (e.key === 'End') i = n - 1;
        else return;
        e.preventDefault();
        abcSad = ima[i];
        abcOznaci(abcSad);
        abcSkoci(abcSad, true);
      });
      traka.addEventListener('blur', function () {
        [].forEach.call(traka.querySelectorAll('.abcS.tren'), function (e) { e.classList.remove('tren'); });
      });
    }
    function oznaciSmjer() {
      var hrPrvi = (dictSmjer === 'hr-en');
      $('dictSmjerT').textContent = hrPrvi ? 'HR → EN' : 'EN → HR';
      $('dictSmjerG').title = hrPrvi
        ? 'Croatian first — switch to English first'
        : 'English first — switch to Croatian first';
      $('dictSmjerG').classList.toggle('okrenut', !hrPrvi);
      if ($('dictSmjerTM')) {
        $('dictSmjerTM').textContent = $('dictSmjerT').textContent;
        $('dictSmjerGM').title = $('dictSmjerG').title;
        $('dictSmjerGM').classList.toggle('okrenut', !hrPrvi);
      }
    }
    function dictPopisKrenuo() {
      var prva = $('popisRijeci').querySelector('.rijecKart');
      if (!prva) return false;
      var crta = parseFloat(getComputedStyle($('dictOkvir')).getPropertyValue('--dictLjepilo')) || 0;
      return prva.getBoundingClientRect().top < crta;
    }
    function postaviOpseg(novi) {
      if (novi === dictOpseg) return;
      // Popis se mijenja pod nogama, ali mjesto u abecedi ostaje: zapamti se
      // slovo koje je bilo na vrhu i drugi popis se otvori na njemu (ako toga
      // slova ondje nema, abcCilj vodi na najbliže koje ima).
      // Samo ako je popis već krenuo ispod trake: dok je prva riječ još
      // ispod nje (stranica na vrhu), ništa se ne pamti i stranica ostaje gdje je.
      var slovo = dictPopisKrenuo() ? abcSlovoNaVrhu() : '';
      dictOpseg = novi;
      segmentOznaci($('dictOpsegP'), 'data-opseg', dictOpseg);
      segmentOznaci($('dictOpsegM'), 'data-opseg', dictOpseg);
      crtaj($('trazi').value);
      if (slovo) abcSkoci(slovo, false);
    }

    $('dictOpsegP').onclick = function (e) {
      var c = e.target.closest ? e.target.closest('button[data-opseg]') : null;
      if (c) postaviOpseg(c.getAttribute('data-opseg'));
    };
    $('dictSmjerG').onclick = function () {
      dictSmjer = (dictSmjer === 'hr-en') ? 'en-hr' : 'hr-en';
      oznaciSmjer(); crtaj($('trazi').value);
    };
    $('dictTestG').onclick = wtPokreni;
    // Mala traka na mobitelu samo prosljeđuje velikoj — stanje je jedno.
    $('dictOpsegM').onclick = $('dictOpsegP').onclick;
    $('dictSmjerGM').onclick = function () { $('dictSmjerG').click(); };
    $('dictZvjGM').onclick = function () { $('dictZvjG').click(); };
    $('traziM').oninput = function () { $('trazi').value = this.value; crtaj(this.value); };
    $('traziM').onfocus = $('traziM').onblur = function () { dictMobFade(); };
    $('dictZvjG').onclick = function () { dictFav = !dictFav; crtaj($('trazi').value); };
    // Zvjezdica odznačena u popisu favorita mora iz njega nestati odmah.
    dictOsvjeziFav = function () {
      if (!$('dictOkvir')) { dictOsvjeziFav = null; return; }
      if (dictFav) crtaj($('trazi').value);
    };
    // Radnje iz praznog stanja žive u istom spremniku kao i popis riječi, pa idu
    // prije njegova vlastitog rukovatelja klikom.
    $('popisRijeci').addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('[data-dcilj]') : null;
      if (!b) return;
      e.stopPropagation();
      var c = b.getAttribute('data-dcilj');
      if (c === 'sve') postaviOpseg('sve'); else idi(c);
    });
    vezeKlikPopisa($('popisRijeci'));
    $('trazi').oninput = function () {
      if ($('traziM')) $('traziM').value = this.value;
      crtaj(this.value);
    };
    abcVezi();
    oznaciSmjer(); crtaj('');
    segmentiPostavi(VIEW);
    // Stranica je nacrtana iznova, pa i zbijena traka kreće od nule; ako se u
    // rječnik ušlo s već pomaknute stranice, prvi pomak inače ne bi ništa okinuo.
    dictZbijen = false; dictNaPomak(); dictLjepilo();
  }

  // ================= TEST RIJEČI (Dictionary → Word test) =================
  // Nebodovana vježba: jedna riječ po ekranu, upisuje se prijevod, odmah slijedi
  // točno/netočno i ispravan odgovor. Vrti se u krug dok korisnik ne izađe.
  // Filter: My Dictionary, Full dictionary ili odabir lekcija 0–20, više njih naraz.
  // Početni opseg preuzima se iz Dictionaryja: tko je ondje bio na Full dictionary,
  // tome i test počinje na cijelom rječniku.
  var wtSmjer = 'mix';        // 'en-hr' | 'mix' | 'hr-en'
  var wtOpseg = 'moje';       // 'moje' | 'sve' | 'lekcije'
  var wtLekcije = [];         // odabrani brojevi lekcija
  var wtFilterOtvoren = false;
  var wtNiz = [], wtPoz = 0, wtVidjeno = 0, wtTocno = 0;

  // Riječi jedne lekcije = kurirane natuknice svih faza te razine.
  // Lekcija 0 je samostalna cjelina i ima samo fazu Lesson.
  function wtRijeciLekcije(n) {
    var red = [];
    TIPOVI.forEach(function (tip) {
      if (n === L0_RAZINA && tip !== L0_TIP) return;
      red = red.concat(natukniceCjeline(tip, n));
    });
    return red;
  }
  // Skup za testiranje: parovi s upotrebljivim prijevodom u oba smjera, bez duplikata.
  function wtSkup() {
    var izvor = [];
    if (wtOpseg === 'lekcije') {
      wtLekcije.forEach(function (n) { izvor = izvor.concat(wtRijeciLekcije(n)); });
    } else if (wtOpseg === 'sve') {
      izvor = sveNatukniceHr();
    } else if (wtOpseg === 'fav') {
      izvor = rjecnikRijeci().filter(function (r) { return jeFavorit(r.hr); });
    } else {
      izvor = rjecnikRijeci();
    }
    var vidjeno = {}, out = [];
    izvor.forEach(function (r) {
      if (!razlomiHr(r.hr)[0] || !razlomiEn(r.en)[0]) return;
      var k = kljucRijeci(r.hr);
      if (!k || vidjeno[k]) return;
      vidjeno[k] = 1;
      out.push({ hr: r.hr, en: r.en });
    });
    return out;
  }
  function wtMijesaj() { wtNiz = promijesaj(wtSkup()); wtPoz = 0; }

  function wtNorm(s) {
    return String(s == null ? '' : s).toLowerCase()
      .replace(/[.!?,;:"“”„()]/g, '').replace(/\s+/g, ' ').trim();
  }
  function wtBezKvacica(s) {
    return wtNorm(s).replace(/[čć]/g, 'c').replace(/š/g, 's').replace(/ž/g, 'z').replace(/đ/g, 'd');
  }
  // Prihvatljivi hrvatski odgovori: osnovni oblik i alternative iza "/" (crven / crvena / crveno).
  // Sklonjeni oblici iza "→" nisu odgovor na pitanje o riječi, pa se ne prihvaćaju.
  function wtOdgovoriHr(hr) {
    return String(hr || '').split(/\s*(?:→|->|=>)\s*/)[0]
      .split(/\s*\/\s*/).map(function (x) { return x.trim(); }).filter(Boolean);
  }
  // Prihvatljivi engleski odgovori: sve varijante ("car, automobile"),
  // svaka i bez uvodnog člana — "read" prolazi za "to read".
  function wtOdgovoriEn(en) {
    var out = [];
    razlomiEn(en)[0].split(/\s*[,\/]\s*/).forEach(function (x) {
      var v = x.trim();
      if (!v) return;
      out.push(v);
      var kraci = v.replace(/^(to|a|an|the)\s+/i, '');
      if (kraci && kraci !== v) out.push(kraci);
    });
    return out;
  }
  // 0 = netočno, 1 = točno, 2 = točno ali bez kvačica
  function wtOcjena(upis, tocni) {
    var u = wtNorm(upis);
    if (!u) return 0;
    var i;
    for (i = 0; i < tocni.length; i++) if (wtNorm(tocni[i]) === u) return 1;
    for (i = 0; i < tocni.length; i++) if (wtBezKvacica(tocni[i]) === wtBezKvacica(u)) return 2;
    return 0;
  }

  function wtPokreni() {
    // svaki ulazak počinje čisto: miješani smjer, nula brojača, bez odabranih lekcija.
    // Opseg se nasljeđuje od Dictionaryja — Full dictionary ostaje Full dictionary.
    wtSmjer = 'mix'; wtOpseg = dictFav ? 'fav' : (dictOpseg === 'sve' ? 'sve' : 'moje'); wtLekcije = [];
    wtFilterOtvoren = false; wtVidjeno = 0; wtTocno = 0;
    idi('dictTest');
  }
  window.wtPokreni = wtPokreni;

  function renderDictTest() {
    wtMijesaj();
    // naslov je unutar okvira: na računalu se okvir centrira i naslov ide s njim
    VIEW.innerHTML =
      '<div class="wtOkvir">' +
      '<h1 class="sekcija">Word test</h1>' +
      '<div class="wtTraka">' +
      segmentHtml('wtSmjerP', 'data-s', [
        { v: 'en-hr', t: 'EN → HR' }, { v: 'mix', t: 'Mixed' }, { v: 'hr-en', t: 'HR → EN' }
      ], wtSmjer) +
      '<button class="wtFilterG" id="wtFilterG">' + IK('postavke', 'uz') + 'Filter</button>' +
      '</div>' +
      '<div id="wtFilterMj"></div>' +
      '<p class="wtStat" id="wtStat"></p>' +
      '<div id="wtZad"></div>' +
      '<button class="gumb wtIzlaz" onclick="idi(\'dictionary\')">Exit test</button>' +
      '</div>';

    $('wtSmjerP').onclick = function (e) {
      var b = e.target.closest ? e.target.closest('button[data-s]') : null;
      if (!b || b.getAttribute('data-s') === wtSmjer) return;
      wtSmjer = b.getAttribute('data-s');
      wtOznaciSmjer(); wtCrtajZad();
    };
    $('wtFilterG').onclick = function () {
      wtFilterOtvoren = !wtFilterOtvoren;
      wtCrtajFilter();
    };
    wtOznaciSmjer(); wtCrtajFilter(); wtCrtajZad();
    segmentiPostavi(VIEW);
  }
  function wtOznaciSmjer() {
    segmentOznaci($('wtSmjerP'), 'data-s', wtSmjer);
    $('wtFilterG').classList.toggle('otvoren', wtFilterOtvoren);
  }
  function wtCrtajFilter() {
    var mj = $('wtFilterMj');
    if (!wtFilterOtvoren) { mj.innerHTML = ''; wtOznaciSmjer(); return; }
    var h = '<div class="wtFilterPanel">' +
      segmentHtml('wtOpsegP', 'data-o', [
        { v: 'moje', t: 'My words' }, { v: 'fav', t: 'Favourites' },
        { v: 'sve', t: 'Full dictionary' }, { v: 'lekcije', t: 'By lesson' }
      ], wtOpseg);
    // Brojevi lekcija se prikazuju samo uz "By lesson".
    if (wtOpseg === 'lekcije') {
      h += '<p class="wtNapomena">Tap one or more lesson numbers — 0 to ' + MAX_RAZINA + '.</p>' +
        '<div class="wtBrojevi" id="wtBrojeviP">';
      for (var n = 0; n <= MAX_RAZINA; n++) {
        h += '<button data-n="' + n + '"' +
          (wtLekcije.indexOf(n) !== -1 ? ' class="aktivan"' : '') + '>' + n + '</button>';
      }
      h += '</div>';
    } else if (wtOpseg === 'sve') {
      h += '<p class="wtNapomena">Every entry in the dictionary, not just your own words.</p>';
    } else if (wtOpseg === 'fav') {
      h += '<p class="wtNapomena">Only the words you starred ' + IK('zvijezda') + '.</p>';
    } else {
      h += '<p class="wtNapomena">Every word you have added, all lessons together.</p>';
    }
    mj.innerHTML = h + '</div>';

    segmentOznaci($('wtOpsegP'), 'data-o', wtOpseg);
    segmentiPostavi(mj);
    $('wtOpsegP').onclick = function (e) {
      var c = e.target.closest ? e.target.closest('button[data-o]') : null;
      if (!c || c.getAttribute('data-o') === wtOpseg) return;
      wtOpseg = c.getAttribute('data-o');
      if (wtOpseg !== 'lekcije') wtLekcije = [];
      wtCrtajFilter(); wtMijesaj(); wtCrtajZad();
    };
    if ($('wtBrojeviP')) {
      $('wtBrojeviP').onclick = function (e) {
        var b = e.target.closest ? e.target.closest('[data-n]') : null;
        if (!b) return;
        var br = parseInt(b.getAttribute('data-n'), 10), i = wtLekcije.indexOf(br);
        if (i === -1) wtLekcije.push(br); else wtLekcije.splice(i, 1);
        wtCrtajFilter(); wtMijesaj(); wtCrtajZad();
      };
    }
    wtOznaciSmjer();
  }
  function wtCrtajStat() {
    var el = $('wtStat');
    if (!el) return;
    var opis = wtOpseg === 'moje' ? 'My Dictionary'
      : wtOpseg === 'sve' ? 'Full dictionary'
      : wtOpseg === 'fav' ? 'Favourites'
      : (wtLekcije.length === 0 ? 'No lesson selected'
        : 'Lesson' + (wtLekcije.length > 1 ? 's' : '') + ' ' +
          wtLekcije.slice().sort(function (a, b) { return a - b; }).join(', '));
    el.textContent = opis + ' · ' + wtNiz.length + (wtNiz.length === 1 ? ' word' : ' words') +
      (wtVidjeno ? ' · ' + wtTocno + '/' + wtVidjeno + ' right so far' : '');
  }
  function wtCrtajZad() {
    var box = $('wtZad');
    if (!box) return;
    wtCrtajStat();
    if (!wtNiz.length) {
      box.innerHTML = '<div class="rjPrazno">' + (wtOpseg === 'lekcije'
        ? (wtLekcije.length === 0
          ? 'Pick at least one lesson in the Filter.'
          : 'No word pairs in the selected lessons yet.')
        : wtOpseg === 'fav'
          ? 'No favourites yet — tap ' + IK('zvijezda') + ' next to a word in the dictionary or on a card.'
        : wtOpseg === 'sve'
          ? 'The dictionary file is missing — run osvježi.bat to generate rjecnik.js.'
          : 'Your dictionary is empty — open a lesson and add words first.') + '</div>';
      return;
    }
    if (wtPoz >= wtNiz.length) wtMijesaj();     // krug je pun — novi prolaz, novi raspored
    var r = wtNiz[wtPoz];
    var smjer = wtSmjer === 'mix' ? (Math.random() < 0.5 ? 'en-hr' : 'hr-en') : wtSmjer;
    var uHr = (smjer === 'en-hr');              // odgovor se piše na hrvatskom
    var pitanje = uHr ? razlomiEn(r.en)[0] : razlomiHr(r.hr)[0];
    var ispravno = uHr ? razlomiHr(r.hr)[0] : razlomiEn(r.en)[0];
    var tocni = uHr ? wtOdgovoriHr(r.hr) : wtOdgovoriEn(r.en);

    box.innerHTML =
      '<div class="wtOznaka">' + (uHr ? 'English → Croatian' : 'Croatian → English') + '</div>' +
      '<div class="wtRijec">' + esc(pitanje) + (uHr ? '' : zvHtml(pitanje)) + '</div>' +
      '<input class="upisInput" id="wtUpis" type="text" autocomplete="off" autocapitalize="off" ' +
      'spellcheck="false" placeholder="' + (uHr ? 'Write it in Croatian…' : 'Write it in English…') + '">' +
      '<div id="wtTipke"></div>' +
      '<div class="wtRez" id="wtRez"></div>' +
      '<button class="gumb" id="wtDalje" style="margin-top:0">Check</button>';

    var input = $('wtUpis'), btn = $('wtDalje'), rez = $('wtRez');
    // hrvatski znakovi stoje ispod polja u svakom smjeru i ne skaču između riječi
    $('wtTipke').appendChild(tipkeSlova(input));
    box.onclick = function (e) {
      var t = e.target;
      var zv = t.closest ? t.closest('.zvucnik') : null;
      if (zv) sviraj(zv.getAttribute('data-rijec'));
    };

    var rijeseno = false;
    function provjeri() {
      if (rijeseno) { wtPoz++; wtCrtajZad(); return; }
      var o = wtOcjena(input.value, tocni);
      rijeseno = true;
      wtVidjeno++;
      if (o) wtTocno++;
      input.classList.add(o ? 'tocno' : 'krivo');
      input.readOnly = true;
      var zv = uHr ? zvHtml(ispravno) : '';
      var jos = tocni.filter(function (x) { return wtNorm(x) !== wtNorm(ispravno); });
      // Odgovor je poslan — točan oblik se pokazuje uvijek, i kad je upisano dobro.
      rez.innerHTML =
        (o === 1 ? '<span class="ok">✓ Correct</span> — '
          : o === 2 ? '<span class="ok">✓ Correct</span> — mind the accents: '
          : '<span class="ne">✗ Wrong</span> — the answer is: ') +
        '<span class="isp">' + esc(ispravno) + '</span>' + zv +
        (jos.length ? '<span class="jos">also accepted: ' + esc(jos.join(', ')) + '</span>' : '');
      btn.textContent = 'Next word →';
      wtCrtajStat();
      // fokus OSTAJE na polju: da je prebačen na gumb, isti pritisak Entera
      // aktivirao bi i gumb i riječ bi preskočila prije čitanja odgovora
      input.focus();
    }
    btn.onclick = provjeri;
    input.onkeydown = function (e) {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      provjeri();
    };
    input.focus();
  }

  // ---- Daily ----
  function renderDaily() {
    var html = '<h1 class="sekcija">Daily challenge</h1>';
    var n = dailyDanasnji();
    var igre = n === null ? [] : igreCjeline('Daily challenge', n);
    var niz = streakNiz(), danasOdradjen = (streakRazmak() === 0);
    html += '<div class="streakK">' +
      '<div class="streakBroj">' + IK('plamen', 'uz') + niz + '</div>' +
      '<div class="streakOpis"><strong>Day streak</strong>' +
      '<div>' + streakBodovi() + ' streak points earned · counts toward LP, VP, GP and PP</div>' +
      '<div>' + (danasOdradjen
        ? 'Done for today — come back tomorrow to make it ' + (niz + 1) + '.'
        : 'Play today\'s challenge for +' + streakSljedeciBodovi() + ' points' +
          (niz > 0 ? ' and keep the streak alive.' : ' and start a streak.')) +
      '</div></div></div>';
    // Slikovni daily ima prednost: ako za danas postoji slika, stari format se ni ne gleda.
    var dsl = dailySlikaDanas();
    if (dsl) {
      var dnadjeno = dailySlikaNadjeno(dsl);
      html += '<div class="dcDatum">' + dailyDatumTekst() + '</div>' +
        '<div class="dcRed" onclick="idi(\'dailySlika\',\'' + dsl.id + '\')">' +
        '<span>' + IK('plamen', 'uz') + '<strong>Today</strong> — ' + esc(dsl.ime) + ' · ' + esc(dsl.stil) + '</span>' +
        '<span class="pct">' + dnadjeno + ' / ' + dsl.pojmova + '</span></div>' +
        '<div class="dcNapomena">One picture a day. Tap an object, type the Croatian word — no list, no answers given away.</div>';
    } else if (dailySlikaEra()) {
      html += '<div class="zakljBanner">Today\'s challenge is not ready yet. Check back soon.</div>';
    } else if (igre.length === 0) {
      html += dailyIndeksDana() >= dailyBrojevi().length
        ? '<div class="zakljBanner">You have reached the end of the daily challenges. 🎉 New ones are on the way.</div>'
        : '<div class="zakljBanner">Today\'s challenge is not ready yet. Check back soon.</div>';
    } else {
      var maks = 0, osv = 0;
      igre.forEach(function (g) { maks += g.bodovi; osv += najbolji(g); });
      var pct = maks > 0 ? Math.round(osv / maks * 100) : 0;
      var naslov = igre[0].cjelinaNaslov || ('Daily challenge ' + n);
      html += '<div class="dcDatum">' + dailyDatumTekst() + '</div>' +
        '<div class="dcRed" onclick="idi(\'unit\',\'Daily challenge\',' + n + ')">' +
        '<span>' + IK('plamen', 'uz') + '<strong>Today</strong> — ' + naslov + '</span>' +
        '<span class="pct">' + (osv > 0 ? pct + '%' : '') + '</span></div>' +
        '<div class="dcNapomena">One challenge per day. A new one unlocks tomorrow.</div>';
    }
    var wk = weeklyBrojevi();
    html += '<h1 class="sekcija" style="margin-top:24px">Weekly challenge</h1>';
    if (wk.length === 0 && WEEKLY_SLIKE.length === 0)
      html += '<div class="zakljBanner">Weekly challenges are coming soon.</div>';
    WEEKLY_SLIKE.forEach(function (w) {
      var nadjeno = weeklySlikaNadjeno(w);
      html += '<div class="dcRed" onclick="idi(\'weekly\',\'' + w.id + '\')">' +
        '<span>' + IK('iskra', 'uz') + '<strong>' + esc(w.ime) + '</strong> — ' + esc(w.stil) + '</span>' +
        '<span class="pct">' + nadjeno + ' / ' + w.pojmova + '</span></div>';
    });
    wk.forEach(function (n) {
      html += '<div class="dcRed" onclick="idi(\'unit\',\'Weekly challenge\',' + n + ')"><span>' + IK('kalendar', 'uz') + '<strong>Week ' + n + '</strong></span></div>';
    });
    if (WEEKLY_SLIKE.length)
      html += '<div class="dcNapomena">One picture a week. Tap an object, type the Croatian word — no list, no answers given away.</div>';
    VIEW.innerHTML = html;
  }

  // ---- Weekly challenge (slikovni) ----
  // Igra je samostalna datoteka u okviru visine ekrana, kao polozene mini-igre,
  // samo bez bodova i bez okretanja: slika je uspravna i radi u portretu.
  // Daily i weekly dijele motor, pa dijele i okvir: jedina razlika je iz koje mape
  // dolazi datoteka i sto pise u podnaslovu.
  function renderIzazovSlika(mapa, w) {
    if (!w) { renderDaily(); return; }
    mjeriZaglavlje();
    window.scrollTo(0, 0);
    VIEW.innerHTML =
      '<div class="miniOkvir">' +
      '<div class="miniScena"><div class="miniPozornica">' +
      '<iframe id="weeklyOkno" src="' + mapa + w.dat + '" title="' + esc(w.ime) + '" allow="fullscreen" allowfullscreen></iframe>' +
      '</div></div>' +
      '<div class="alat">' +
      '<span class="nas">' + w.emo + ' ' + esc(w.ime) + '</span>' +
      '<span class="pod">' + esc(w.stil) + ' · ' + esc(w.datum) + ' · ' + w.pojmova + ' words</span>' +
      '<button class="gumbSitni" onclick="idi(\'daily\')">← Daily challenge</button>' +
      '</div>' +
      '</div>';
  }
  function renderWeekly(id) { renderIzazovSlika(WEEKLY_MAPA, weeklySlikaPoId(id)); }
  function renderDailySlika(id) { renderIzazovSlika(DAILY_MAPA, dailySlikaPoId(id)); }

  // ================= PROGRESS =================
  // Jedna stranica na kojoj stoji sve što je netko zaradio i najkraći put do idućeg.
  // Namjerno ne računa ništa svoje: bodovi, pragovi i otključavanja dolaze iz istih
  // funkcija kojima se služe naslovnica i Lessons, pa se promjena pravila nikad ne
  // mora pisati dvaput. Otvorena je svakome tko ima račun — i onome bez pretplate,
  // i onome tko je odigrao jednu jedinu vježbu.
  var PROG_TAB = 'ja';
  var PROG_LADICA = null;        // "Vocabulary 7" dok je otvorena
  var PROG_TUDJI = null;         // uuid osobe čiji je progres razmotan
  var BOJA_TIPA = { Lesson: 'var(--plava)', Vocabulary: 'var(--plavaVok)',
    Grammar: 'var(--zlatna)', Practice: 'var(--zelena)', Test: 'var(--crvena)' };
  var IME_VALUTE = { LP: 'Lesson points', VP: 'Vocabulary points',
    GP: 'Grammar points', PP: 'Practice points' };

  function progOsv(tip, razina) {
    var s = 0;
    igreCjeline(tip, razina).forEach(function (g) { s += najbolji(g); });
    return s;
  }
  function progNaslovCjeline(tip, razina) {
    var igre = igreCjeline(tip, razina);
    return (igre[0] && igre[0].cjelinaNaslov) || '';
  }

  function renderProgress() {
    KES_VAL = valute();
    try { renderProgressUnutra(); } finally { KES_VAL = null; }
  }
  function renderProgressUnutra() {
    var brojLjudi = DRUSTVO.ljudi.filter(function (p) { return p.smjer === 'veza'; }).length;
    var cekaju = DRUSTVO.ljudi.filter(function (p) { return p.smjer === 'primljen'; }).length;
    VIEW.innerHTML =
      '<h1 class="sekcija">Progress ' + IK('meta') + '</h1>' +
      '<p class="progOpis" style="font-size:var(--t-m);margin-bottom:1.25rem">' +
        'Everything you have earned, and the shortest way to more of it. ' +
        'Click any unit to see it exercise by exercise.</p>' +
      '<div class="progTabovi" id="progTabovi">' +
        '<button data-ptab="ja"' + (PROG_TAB === 'ja' ? ' class="aktivan"' : '') + '>You</button>' +
        '<button data-ptab="ljudi"' + (PROG_TAB === 'ljudi' ? ' class="aktivan"' : '') + '>' +
          'Friends &amp; groups <span class="br">· ' + brojLjudi +
          (cekaju ? ' · ' + cekaju + ' waiting' : '') + '</span></button>' +
      '</div>' +
      '<div id="progTijelo"></div>';
    Array.prototype.forEach.call($('progTabovi').children, function (b) {
      b.onclick = function () {
        PROG_TAB = b.getAttribute('data-ptab');
        PROG_LADICA = null; PROG_TUDJI = null;
        renderProgress();
        window.scrollTo(0, 0);
      };
    });
    if (PROG_TAB === 'ja') progCrtajJa(); else progCrtajLjude();
  }

  // Mreza "Where you stand" slijedi isto pravilo kao Lessons: dvadeset redaka
  // zakljucanih celija nije napredak nego zid. Vidi se do tri retka iza prve
  // nedostupne razine, ostalo stoji iza gumba.
  var progSveRazine = false;
  function prekloputiProgRazine() { progSveRazine = !progSveRazine; progCrtajJa(); }
  window.prekloputiProgRazine = prekloputiProgRazine;

  // ---- tab You ----
  function progCrtajJa() {
    var v = valute(), h = '', trake = [];

    h += '<div class="progValute">';
    TIPOVI.slice(0, 4).forEach(function (tip) {
      var val = VALUTA_TIPA[tip], sp = sljedeciPrag(tip), ima = v[val];
      var pct = sp ? (sp.prag > 0 ? Math.min(1, ima / sp.prag) : 1) : 1;
      var doKud = sp
        ? '<b>' + Math.max(0, sp.prag - ima) + '</b> more → ' + tip + ' ' + sp.razina
        : 'every level open';
      var id = 'pv_' + tip;
      trake.push({ id: id, pct: pct });
      h += '<div class="progValK' + (sp ? '' : ' pun') + '" style="--boja:' + BOJA_TIPA[tip] + '">' +
        '<div class="imeV">' + IME_VALUTE[val] + '</div>' +
        '<div class="broj" id="pb_' + tip + '">0</div>' +
        '<div class="progStaza"><i id="' + id + '"></i></div>' +
        '<div class="doKud">' + doKud + '</div></div>';
    });
    h += '</div>';

    var odigrano = 0, ukupnoVj = 0;
    IGRE.forEach(function (g) { if ((g.bodovi || 0) > 0) { ukupnoVj++; if (najbolji(g) > 0) odigrano++; } });
    var st = streakStanje();
    h += '<div class="progStat">' +
      '<div class="progStatK"><div class="b">' + (st.niz || 0) + ' <small>' + T_('days') + '</small></div>' +
        '<div class="l">Daily streak · ' + (st.bodovi || 0) + ' streak points</div></div>' +
      '<div class="progStatK"><div class="b">' + brojRijeci() + '</div>' +
        '<div class="l">Words in your dictionary</div></div>' +
      '<div class="progStatK"><div class="b">' + odigrano + ' <small>/ ' + ukupnoVj + '</small></div>' +
        '<div class="l">Exercises played</div></div>' +
      '<div class="progStatK"><div class="b">' + miniBodovi() + ' <small>/ ' + miniMaks() + '</small></div>' +
        '<div class="l">Mini game points</div></div>' +
      '</div>';

    // ---- mreža cjelina ----
    h += '<h2 class="progNas">Where you stand</h2>' +
      '<p class="progOpis">One square per unit. Click one to open it exercise by exercise — that is where ' +
        'you see which single exercise is still holding points, and jump straight back into it.</p>' +
      '<div class="progMrezaOkvir"><div class="progMreza"><div class="progKut"></div>';
    TIPOVI.forEach(function (t) {
      h += '<div class="progGlava" style="color:' + BOJA_TIPA[t] + '">' + t + '</div>';
    });
    var progPrvaZ = prvaZakljucanaRazina();
    var progGranica = progSveRazine ? MAX_RAZINA : Math.min(MAX_RAZINA, progPrvaZ + 3);
    for (var r = 1; r <= progGranica; r++) {
      var imaIsta = false;
      for (var j = 0; j < TIPOVI.length; j++) if (maksCjeline(TIPOVI[j], r) > 0) imaIsta = true;
      if (!imaIsta) continue;
      h += '<div class="progRazina">' + r + '</div>';
      for (var i = 0; i < TIPOVI.length; i++) {
        var tip = TIPOVI[i], maks = maksCjeline(tip, r);
        if (!maks) { h += '<div class="progCelija prazno"></div>'; continue; }
        var osv = progOsv(tip, r), pct = Math.round(osv / maks * 100);
        var boja = BOJA_TIPA[tip];
        if (!otkljucano(tip, r)) {
          var val2 = VALUTA_TIPA[tip], p = prag(tip, r);
          var opis = val2 ? (v[val2] + ' / ' + p + ' ' + val2) : 'needs all four types at level ' + r;
          h += '<div class="progCelija zakljucana" style="--boja:' + boja + '" ' +
            'title="' + T_('Locked — %1', esc(opis)) + '">' +
            '<div class="pct">' + T_('locked') + '</div><div class="odn">' + esc(opis) + '</div></div>';
        } else {
          var id2 = 'pc_' + tip + '_' + r;
          trake.push({ id: id2, pct: maks > 0 ? Math.min(1, osv / maks) : 0 });
          var kl = 'progCelija' + (pct >= 100 ? ' puna' : (osv === 0 ? ' nula' : '')) +
            (PROG_LADICA === tip + ' ' + r ? ' odabrana' : '');
          var nas = progNaslovCjeline(tip, r);
          h += '<div class="' + kl + '" style="--boja:' + boja + '" data-pcjelina="' + esc(tip + '|' + r) + '" ' +
            'title="' + esc(tip + ' ' + r + (nas ? ' — ' + nas : '')) + '">' +
            (pct >= 100 ? '<span class="kvaka">' + IK('kvaka') + '</span>' : '') +
            '<div><div class="pct">' + pct + '%</div>' +
            '<div class="odn">' + osv + ' / ' + maks + '</div></div>' +
            '<div class="progStaza"><i id="' + id2 + '"></i></div></div>';
        }
      }
    }
    h += '</div></div>';
    if (progGranica < MAX_RAZINA) {
      h += '<button class="viseRazina" onclick="prekloputiProgRazine()">Show all ' + MAX_RAZINA +
        ' levels ▾ <span style="opacity:.7">(' + (MAX_RAZINA - progGranica) +
        ' more, still locked)</span></button>';
    } else if (progSveRazine && MAX_RAZINA > progPrvaZ + 3) {
      h += '<button class="viseRazina" onclick="prekloputiProgRazine()">Show less ▴</button>';
    }
    h += '<div class="progLegenda">' +
        '<span><i></i> not started</span>' +
        '<span><i class="pola"></i> in progress</span>' +
        '<span><i class="pun"></i> everything earned</span>' +
        '<span><i class="zak"></i> locked — hover to see what it needs</span>' +
      '</div><div id="progLadica"></div>';

    // ---- cijeli tečaj: bodovi svih cjelina L1–L20 (Lesson, Vocabulary, Grammar, Practice, Test).
    //      Bez mini igara, dailyja, weeklyja i streaka (traženo 27.09.2026.). Do 10 % s jednom decimalom.
    var cijeliOsv = 0, cijeliMaks = 0;
    TIPOVI.forEach(function (t) {
      for (var rz = 1; rz <= MAX_RAZINA; rz++) { cijeliMaks += maksCjeline(t, rz); cijeliOsv += progOsv(t, rz); }
    });
    if (cijeliMaks > 0) {
      var cijeliP = cijeliOsv / cijeliMaks * 100;
      var cijeliTxt = cijeliP >= 10 ? Math.floor(cijeliP) + '%' : (Math.floor(cijeliP * 10) / 10).toFixed(1) + '%';
      var broj = function (x) { return Number(x).toLocaleString(LOKAL_BROJ); };
      trake.push({ id: 'pv_cijeli', pct: Math.min(1, cijeliOsv / cijeliMaks) });
      h += '<div class="progCijeli"><div class="red"><span>The whole course</span><b>' + cijeliTxt + '</b></div>' +
        '<div class="progStaza"><i id="pv_cijeli"></i></div>' +
        '<div class="pod">' + broj(cijeliOsv) + ' of ' + broj(cijeliMaks) + ' points from all units of the ' +
          MAX_RAZINA + ' levels (mini games and challenges not included)</div>' +
        // Svi bodovi zajedno = zbroj četiri valute, isto kao "ukupno" u tabu Friends & groups.
        '<div class="pod">All your points together: <b style="color:var(--ink)">' +
          broj(v.LP + v.VP + v.GP + v.PP) + '</b> — units, games, challenges and streak</div></div>';
    }

    // ---- vrijedi se vratiti ----
    var popravi = progPopravi(6);
    if (popravi.length) {
      h += '<h2 class="progNas">Worth going back to</h2>' +
        '<p class="progOpis">The unlocked exercises holding the most points. Only your best attempt ever ' +
          'counts, so replaying one can add points but never take them away.</p>' +
        '<ul class="progPopravi">' + popravi.map(function (x) {
          return '<li style="--boja:' + BOJA_TIPA[x.tip] + '" data-pvjezba="' + esc(x.k) + '">' +
            '<span class="gdje">' + esc(x.cjelina) + '</span>' +
            '<span class="sto">' + esc(x.ime) +
              '<small>' + (x.o === 0 ? 'never played' : 'best so far ' + x.o + ' of ' + x.m) + '</small></span>' +
            '<span class="koliko">+' + x.ost + '<small>points waiting</small></span></li>';
        }).join('') + '</ul>';
    }

    // ---- daily ----
    var dani = dailyBrojevi();
    if (dani.length) {
      var dOdr = 0, dDio = 0, tock = '';
      dani.forEach(function (n) {
        var m = maksCjeline('Daily challenge', n), o = progOsv('Daily challenge', n);
        var kls = o <= 0 ? '' : (m > 0 && o >= m ? 'd' : 'p');
        if (m > 0 && o >= m) dOdr++; else if (o > 0) dDio++;
        tock += '<i class="' + kls + '" data-pdaily="' + n + '" title="Day ' + n + ' — ' + o + '/' + m + '"></i>';
      });
      h += '<h2 class="progNas">Daily challenges</h2>' +
        '<p class="progOpis">' + dOdr + ' finished, ' + dDio + ' partly done, ' +
          (dani.length - dOdr - dDio) + ' untouched. Current streak ' + (st.niz || 0) + ' days — ' +
          'day ' + ((st.niz || 0) + 1) + ' will be worth ' + ((st.niz || 0) + 1) +
          ' points in every currency.</p>' +
        '<div class="progPloca"><div class="progTockice">' + tock + '</div></div>';
    }

    // ---- mini igre ----
    var mh = '';
    sveIgre().forEach(function (g) {
      var o = Math.min(miniStanje(g.id).naplaceno || 0, g.maks), pun = o >= g.maks;
      mh += '<div class="progMiniR' + (o ? (pun ? ' pun' : '') : ' nula') + '" data-pmini="' + g.id + '" ' +
        'title="Open ' + esc(g.ime) + '"><div class="e">' + g.emo + '</div>' +
        '<div class="n">' + esc(g.ime) + '<small>' + esc(g.stil) + '</small></div>' +
        '<div class="p">' + o + '<small>/' + g.maks + '</small></div></div>';
    });
    h += '<h2 class="progNas">Games &amp; Extras</h2>' +
      '<p class="progOpis">Each one pays out once, the same amount into all four currencies. ' +
        'Click one to open it.</p>' +
      '<div class="progMini">' + mh + '</div>';

    $('progTijelo').innerHTML = h;

    TIPOVI.slice(0, 4).forEach(function (tip) {
      brojiDo('pb_' + tip, 0, v[VALUTA_TIPA[tip]], 900, '');
    });
    animirajTrake(trake);
    progVezi();
  }

  // Vježbe koje drže najviše bodova, ali samo u cjelinama u kojima je polaznik
  // stvarno bio — inače popis vuče u lekcije do kojih još nije došao. Napola
  // odigrana vježba je bliži plijen od netaknute, pa nosi težinu.
  function progPopravi(n) {
    var kand = [];
    for (var r = 1; r <= MAX_RAZINA; r++) {
      for (var i = 0; i < TIPOVI.length; i++) {
        var tip = TIPOVI[i];
        if (!maksCjeline(tip, r) || !otkljucano(tip, r) || progOsv(tip, r) <= 0) continue;
        igreCjeline(tip, r).forEach(function (g) {
          var o = najbolji(g), m = g.bodovi || 0;
          if (m <= 0 || o >= m) return;
          kand.push({ tip: tip, razina: r, cjelina: tip + ' ' + r, ime: g.naslov || 'Exercise',
            o: o, m: m, ost: m - o, tez: (m - o) * (o > 0 ? 1.45 : 1), k: kljucIgre(g) });
        });
      }
    }
    kand.sort(function (a, b) { return b.tez - a.tez || b.ost - a.ost; });
    return kand.slice(0, n);
  }

  function progVezi() {
    var korijen = $('progTijelo'); if (!korijen) return;
    Array.prototype.forEach.call(korijen.querySelectorAll('[data-pcjelina]'), function (b) {
      b.onclick = function () {
        var d = b.getAttribute('data-pcjelina').split('|');
        progOtvoriLadicu(d[0], +d[1]);
      };
    });
    Array.prototype.forEach.call(korijen.querySelectorAll('[data-pvjezba]'), function (b) {
      b.onclick = function () { progPitajVjezbu(b.getAttribute('data-pvjezba')); };
    });
    Array.prototype.forEach.call(korijen.querySelectorAll('[data-pmini]'), function (b) {
      b.onclick = function () { progPitajMini(b.getAttribute('data-pmini')); };
    });
    Array.prototype.forEach.call(korijen.querySelectorAll('[data-pdaily]'), function (b) {
      b.onclick = function () { idi('unit', 'Daily challenge', +b.getAttribute('data-pdaily')); };
    });
  }

  // ---- ladica: jedna cjelina, vježba po vježba ----
  function progOtvoriLadicu(tip, razina) {
    var kljuc = tip + ' ' + razina;
    var cilj = $('progLadica'); if (!cilj) return;
    if (PROG_LADICA === kljuc) { PROG_LADICA = null; cilj.innerHTML = ''; progOznaciCelije(); return; }
    PROG_LADICA = kljuc;
    progOznaciCelije();

    var igre = igreCjeline(tip, razina), boja = BOJA_TIPA[tip];
    var maks = maksCjeline(tip, razina), osv = progOsv(tip, razina);
    var redci = '', preostalo = 0, trake = [];
    igre.forEach(function (g, i) {
      var o = najbolji(g), m = g.bodovi || 0;
      var id = 'pl_' + i;
      trake.push({ id: id, pct: m > 0 ? Math.min(1, o / m) : 0 });
      if (o < m) preostalo += m - o;
      redci += '<li class="' + (m > 0 && o >= m ? 'pun' : (o === 0 ? 'nula' : '')) + '" ' +
        'data-pvjezba="' + esc(kljucIgre(g)) + '" title="Open this exercise">' +
        '<span class="br">' + (g.stranica || (i + 1)) + '.</span>' +
        '<span class="ime">' + esc(g.naslov || ('Exercise ' + (i + 1))) +
          (o === 0 ? '<span class="progOznaka">not played</span>' : '') + '</span>' +
        '<span class="pts"><b>' + o + '</b><small>/' + m + '</small></span>' +
        '<span class="progStaza sbar"><i id="' + id + '"></i></span></li>';
    });
    var pct = maks ? Math.round(osv / maks * 100) : 0;
    var nas = progNaslovCjeline(tip, razina);
    cilj.innerHTML =
      '<div class="progLadica" style="--boja:' + boja + '">' +
        '<div class="progLadicaGlava">' +
          '<span class="znak">' + esc(tip) + ' ' + razina + '</span>' +
          '<h3>' + esc(nas || (tip + ' ' + razina)) + '</h3>' +
          '<span class="rez">' + osv + ' <small>/ ' + maks + ' pts · ' + pct + '%</small></span>' +
          '<button class="x" id="progLadicaX" title="Close">✕</button>' +
        '</div>' +
        '<ul class="progVjezbe">' + redci + '</ul>' +
        '<div class="progLadicaPod">' +
          (preostalo > 0
            ? '<span><b>' + preostalo + ' points</b> are still waiting in this unit.</span>'
            : '<span>Everything here is yours — all <b>' + maks + '</b> points earned.</span>') +
          '<span style="margin-left:auto">Click any exercise to replay it.</span>' +
        '</div>' +
      '</div>';
    animirajTrake(trake);
    $('progLadicaX').onclick = function () {
      PROG_LADICA = null; cilj.innerHTML = ''; progOznaciCelije();
    };
    Array.prototype.forEach.call(cilj.querySelectorAll('[data-pvjezba]'), function (b) {
      b.onclick = function () { progPitajVjezbu(b.getAttribute('data-pvjezba')); };
    });
    cilj.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  function progOznaciCelije() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-pcjelina]'), function (el) {
      var d = el.getAttribute('data-pcjelina').split('|');
      el.classList.toggle('odabrana', PROG_LADICA === d[0] + ' ' + d[1]);
    });
  }

  // ---- potvrde prije odlaska ----
  function progPotvrda(naslov, gdje, tekst, gumb, akcija) {
    var star = $('progOverlay'); if (star) star.remove();
    var ov = document.createElement('div'); ov.id = 'progOverlay';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(29,27,23,.5);z-index:100;' +
      'display:flex;align-items:center;justify-content:center;padding:16px;';
    var m = document.createElement('div'); m.className = 'otkljModal prijavaModal';
    m.innerHTML = '<h2>' + esc(naslov) + '</h2>' +
      '<p class="otkljPod" style="margin-bottom:.5rem">' + gdje + '</p>' +
      '<p class="otkljPod">' + esc(tekst) + '</p>';
    var da = document.createElement('button'); da.className = 'gumb'; da.textContent = gumb;
    da.onclick = function () { ov.remove(); akcija(); };
    var ne = document.createElement('button'); ne.className = 'gumb gumbSivi'; ne.textContent = 'Cancel';
    ne.onclick = function () { ov.remove(); };
    m.appendChild(da); m.appendChild(ne);
    ov.appendChild(m);
    ov.onclick = function (e) { if (e.target === ov) ov.remove(); };
    document.body.appendChild(ov);
    da.focus();
  }
  function progPitajVjezbu(kljuc) {
    var meta = null, indeks = 0;
    IGRE.forEach(function (g) {
      if (kljucIgre(g) !== kljuc) return;
      meta = g;
      indeks = igreCjeline(g.tip, g.razina).indexOf(g);
    });
    if (!meta) return;
    var o = najbolji(meta), m = meta.bodovi || 0;
    progPotvrda('Open this exercise?',
      '<b>' + esc(meta.tip + ' ' + meta.razina) + '</b> · ' + esc((meta.stranica ? meta.stranica + '. ' : '') +
        (meta.naslov || '')),
      o === 0
        ? 'You will leave Progress and go straight into the exercise. You have not played it yet — all ' +
          m + ' points are still there.'
        : 'You will leave Progress and go straight into the exercise. Your best result (' + o + ' of ' + m +
          ') is kept: a weaker run can never cost you points.',
      'Open exercise',
      function () { idi('unit', meta.tip, meta.razina, Math.max(0, indeks)); });
  }
  function progPitajMini(id) {
    var g = null;
    sveIgre().forEach(function (x) { if (x.id === id) g = x; });
    if (!g) return;
    var o = Math.min(miniStanje(g.id).naplaceno || 0, g.maks);
    var tekst = o >= g.maks
      ? 'You have already earned all ' + g.maks + ' points from this one. The payout happens once, so ' +
        'playing it again is purely for the fun of it.'
      : (o > 0
          ? 'You have earned ' + o + ' of ' + g.maks + ' points here. The rest is still waiting, and points ' +
            'already earned cannot be lost.'
          : 'All ' + g.maks + ' points are still there. They go into every currency at once.');
    progPotvrda('Open this game?',
      g.emo + ' <b>' + esc(g.ime) + '</b> · ' + esc(g.stil), tekst,
      'Open ' + g.ime, function () { idi('miniIgra', g.id); });
  }

  // ================= FRIENDS & GROUPS =================
  // Jedan popis. Prijatelj koji je prihvatio zahtjev i čovjek kojemu plaćamo
  // pretplatu stoje jedan pored drugoga, bez razlike — jer je za onoga tko gleda
  // razlika i nevažna. Bodovi se vide uvijek, razrada samo ako je druga strana
  // svoj progres postavila na javno.
  var DRUSTVO = { stanje: 'ne', ja: null, ljudi: [], poruka: '' };

  function ucitajDrustveno(cb) {
    if (!supa || !imaRacun()) { DRUSTVO.stanje = 'greska'; if (cb) cb(); return; }
    DRUSTVO.stanje = 'ucitava';
    supa.rpc('moj_javni_racun').then(function (r1) {
      if (r1.error) throw r1.error;
      DRUSTVO.ja = (r1.data && r1.data[0]) || null;
      return supa.rpc('moji_ljudi');
    }).then(function (r2) {
      if (r2.error) throw r2.error;
      DRUSTVO.ljudi = r2.data || [];
      DRUSTVO.stanje = 'ok';
      if (cb) cb();
    })['catch'](function () {
      DRUSTVO.stanje = 'greska';
      if (cb) cb();
    });
  }

  function progCrtajLjude() {
    var t = $('progTijelo');
    if (DRUSTVO.stanje === 'ne' || DRUSTVO.stanje === 'ucitava') {
      t.innerHTML = '<div class="progPloca progTiho">Loading…</div>';
      if (DRUSTVO.stanje === 'ne') ucitajDrustveno(function () { if (PROG_TAB === 'ljudi') renderProgress(); });
      return;
    }
    if (DRUSTVO.stanje === 'greska' || !DRUSTVO.ja) {
      t.innerHTML = '<div class="progPloca"><p style="margin:0 0 .75rem">This part could not be loaded.</p>' +
        '<button class="gumb gumbSivi progSitni" id="progPonovo">Try again</button></div>';
      $('progPonovo').onclick = function () { DRUSTVO.stanje = 'ne'; renderProgress(); };
      return;
    }

    var v = valute();
    var veze = DRUSTVO.ljudi.filter(function (p) { return p.smjer === 'veza'; });
    var primljeni = DRUSTVO.ljudi.filter(function (p) { return p.smjer === 'primljen'; });
    var poslani = DRUSTVO.ljudi.filter(function (p) { return p.smjer === 'poslan'; });
    var javan = !!DRUSTVO.ja.progres_javan;

    var h =
      '<div class="progPloca" style="margin-bottom:1.25rem">' +
        '<h2 class="progNas" style="margin:0 0 .625rem">Your ID</h2>' +
        '<div class="progRed">' +
          '<span class="progKod">' + esc(DRUSTVO.ja.javni_id || '—') + '</span>' +
          '<button class="gumb gumbSivi progSitni" id="progKopiraj">Copy</button>' +
          '<span class="progTiho" style="flex:1 1 16rem">The only way anyone can find you. Your e-mail is ' +
            'never shown — not to friends, not to whoever pays for your access.</span>' +
        '</div>' +
        '<div class="progRed" style="margin-top:.875rem">' +
          '<input class="progIme" id="progNadimak" maxlength="40" placeholder="the name others see" value="' +
            esc(DRUSTVO.ja.nadimak || '') + '">' +
          '<button class="gumb gumbSivi progSitni" id="progSpremiIme">Save name</button>' +
          '<span class="progTiho" id="progImePoruka">' +
            (DRUSTVO.ja.nadimak ? '' : 'Until you set one, people see only your ID.') + '</span>' +
        '</div>' +
      '</div>' +

      '<h2 class="progNas">Add someone</h2>' +
      '<p class="progOpis">Five characters. No zero and no letter O, so there is nothing to mistype. ' +
        'Sending a request means you will both see each other once they accept.</p>' +
      '<div class="progPloca progRed">' +
        '<input class="progUnos" id="progUnosId" placeholder="A1B2C" maxlength="5">' +
        '<button class="gumb progSitni" id="progPosalji">Send request</button>' +
        '<span class="progTiho" id="progUnosPoruka">' + esc(DRUSTVO.poruka || '') + '</span>' +
      '</div>';

    if (primljeni.length || poslani.length) {
      h += '<h2 class="progNas">Waiting</h2><div class="progPloca" style="display:grid;gap:.625rem">';
      primljeni.forEach(function (p) {
        h += '<div class="progRed">' +
          '<span class="imeC" style="font-weight:600">' + esc(p.nadimak || 'Someone') +
            ' <span class="idC">' + esc(p.javni_id) + '</span></span>' +
          '<span class="progTiho">wants to see your points</span>' +
          '<span style="margin-left:auto;display:flex;gap:.5rem">' +
            '<button class="gumb progSitni" data-pda="' + esc(p.druga_id) + '">Accept</button>' +
            '<button class="gumb gumbSivi progSitni" data-pne="' + esc(p.druga_id) + '">Decline</button>' +
          '</span></div>';
      });
      poslani.forEach(function (p) {
        h += '<div class="progRed progTiho">' +
          '<span class="idC">' + esc(p.javni_id) + '</span>' +
          '<span>your request — not answered yet</span>' +
          '<span style="margin-left:auto"><button class="gumb gumbSivi progSitni" data-potkazi="' +
            esc(p.druga_id) + '">Cancel</button></span></div>';
      });
      h += '</div>';
    }

    h += '<h2 class="progNas">Everyone you added</h2>';
    if (!veze.length) {
      h += '<div class="progPloca progTiho">Nobody yet. Share your ID, or type someone else\'s above.</div>';
    } else {
      h += '<p class="progOpis">Points are always visible. Everything else only if that person set their ' +
        'progress to public — those rows open up when you click them.</p>';
      var redci = veze.map(function (p) {
        return { p: p, uk: (p.lp || 0) + (p.vp || 0) + (p.gp || 0) + (p.pp || 0) };
      });
      redci.push({ ja: true, uk: v.LP + v.VP + v.GP + v.PP,
        p: { nadimak: 'You', javni_id: DRUSTVO.ja.javni_id, lp: v.LP, vp: v.VP, gp: v.GP, pp: v.PP,
             progres_javan: javan, zadnja_aktivnost: new Date().toISOString() } });
      redci.sort(function (a, b) { return b.uk - a.uk; });
      h += '<table class="progLjudi"><thead><tr><th>Who</th>' +
        '<th>LP</th><th>VP</th><th>GP</th><th>PP</th><th>Total</th><th>Shares</th><th>Updated</th>' +
        '</tr></thead><tbody>';
      redci.forEach(function (x) {
        var p = x.p, otvoren = !!p.progres_javan;
        h += '<tr class="' + (x.ja ? 'ja' : '') + (otvoren && !x.ja ? ' klik' : '') + '"' +
          (otvoren && !x.ja ? ' data-ptko="' + esc(p.druga_id) + '"' : '') + '>' +
          '<td><span class="imeC">' + esc(p.nadimak || 'Someone') +
            '<span class="idC">' + esc(p.javni_id || '') + '</span></span></td>' +
          '<td style="color:var(--plava)">' + (p.lp || 0) + '</td>' +
          '<td style="color:var(--plavaVok)">' + (p.vp || 0) + '</td>' +
          '<td style="color:var(--zlatna)">' + (p.gp || 0) + '</td>' +
          '<td style="color:var(--zelena)">' + (p.pp || 0) + '</td>' +
          '<td style="font-family:var(--naslov);font-weight:700">' + x.uk + '</td>' +
          '<td><span class="progZnacka ' + (otvoren ? 'otv' : 'zat') + '">' +
            (otvoren ? 'full progress' : 'points only') + '</span></td>' +
          '<td class="progTiho">' + esc(x.ja ? T_('now') : progKada(p.zadnja_aktivnost)) + '</td></tr>';
      });
      h += '</tbody></table><div id="progTudji"></div>';
    }

    h += '<h2 class="progNas">What others see of you</h2>' +
      '<p class="progOpis">This applies to everyone in the list above, and to nobody else.</p>' +
      '<div class="progRed" style="align-items:stretch">' +
        '<label class="progIzbor' + (javan ? '' : ' aktivan') + '" data-pvid="0">' +
          '<input type="radio" name="pvid"' + (javan ? '' : ' checked') + '>' +
          '<span><span class="t">Points only</span><span class="o">Your four totals and nothing else. ' +
            'This is the default and it never changes on its own.</span></span></label>' +
        '<label class="progIzbor' + (javan ? ' aktivan' : '') + '" data-pvid="1">' +
          '<input type="radio" name="pvid"' + (javan ? ' checked' : '') + '>' +
          '<span><span class="t">Full progress</span><span class="o">Every unit with its points — the same ' +
            'map you see under You.</span></span></label>' +
      '</div>';

    t.innerHTML = h;
    progVeziLjude();
  }

  function progKada(iso) {
    if (!iso) return T_('never');
    var ms = Date.now() - new Date(iso).getTime();
    if (isNaN(ms)) return '';
    var min = Math.floor(ms / 60000);
    if (min < 2) return T_('just now');
    if (min < 60) return T_('%1 min ago', min);
    var h = Math.floor(min / 60);
    if (h < 24) return T_('%1 h ago', h);
    var d = Math.floor(h / 24);
    if (d === 1) return T_('yesterday');
    if (d < 30) return T_('%1 days ago', d);
    return T_('over a month ago');
  }

  function progVeziLjude() {
    var t = $('progTijelo');
    $('progKopiraj').onclick = function () {
      var b = this;
      try { navigator.clipboard.writeText(DRUSTVO.ja.javni_id || ''); } catch (e) {}
      b.textContent = 'Copied'; setTimeout(function () { b.textContent = 'Copy'; }, 1600);
    };
    $('progSpremiIme').onclick = function () {
      var ime = $('progNadimak').value.trim().slice(0, 40);
      $('progImePoruka').textContent = 'Saving…';
      supa.from('javni_bodovi').update({ nadimak: ime || null, updated_at: new Date().toISOString() })
        .eq('user_id', SESSION.user.id).then(function (res) {
          if (res.error) { $('progImePoruka').textContent = 'Could not save — try again.'; return; }
          DRUSTVO.ja.nadimak = ime;
          $('progImePoruka').textContent = ime ? 'Saved.' : 'Cleared — people see only your ID.';
        });
    };
    $('progUnosId').oninput = function () {
      this.value = this.value.toUpperCase().replace(/[^A-NP-Z1-9]/g, '');
    };
    $('progPosalji').onclick = function () {
      var kod = $('progUnosId').value;
      if (kod.length !== 5) { $('progUnosPoruka').textContent = 'An ID is exactly five characters.'; return; }
      $('progUnosPoruka').textContent = 'Sending…';
      supa.rpc('posalji_zahtjev', { kod: kod }).then(function (res) {
        if (res.error) { $('progUnosPoruka').textContent = 'Could not send it — try again later.'; return; }
        if (res.data === 'nema') { $('progUnosPoruka').textContent = 'No one has that ID.'; return; }
        if (res.data === 'to si ti') { $('progUnosPoruka').textContent = 'That is your own ID.'; return; }
        DRUSTVO.poruka = 'Request sent to ' + kod + '. They see only the name you chose.';
        DRUSTVO.stanje = 'ne';
        renderProgress();
      });
    };
    Array.prototype.forEach.call(t.querySelectorAll('[data-pda]'), function (b) {
      b.onclick = function () { progOdgovori(b.getAttribute('data-pda'), true); };
    });
    Array.prototype.forEach.call(t.querySelectorAll('[data-pne]'), function (b) {
      b.onclick = function () { progOdgovori(b.getAttribute('data-pne'), false); };
    });
    Array.prototype.forEach.call(t.querySelectorAll('[data-potkazi]'), function (b) {
      b.onclick = function () {
        supa.rpc('raskini_vezu', { druga: b.getAttribute('data-potkazi') }).then(function () {
          DRUSTVO.stanje = 'ne'; renderProgress();
        });
      };
    });
    Array.prototype.forEach.call(t.querySelectorAll('[data-pvid]'), function (el) {
      el.onclick = function () {
        var javan = el.getAttribute('data-pvid') === '1';

  function progOdgovori(od, prihvati) {

  // Tuđa mreža: isti raspored kao vlastita, ali bez klikanja — samo pogled.
  function progTudjiProgres(id) {
    var cilj = $('progTudji'); if (!cilj) return;
    if (PROG_TUDJI === id) { PROG_TUDJI = null; cilj.innerHTML = ''; return; }
    PROG_TUDJI = id;
    var osoba = null;
    DRUSTVO.ljudi.forEach(function (p) { if (p.druga_id === id) osoba = p; });
    if (!osoba) { cilj.innerHTML = ''; return; }
    var saz = osoba.sazetak || {}, trake = [];
    var h = '<div class="progMrezaOkvir"><div class="progMreza"><div class="progKut"></div>';
    TIPOVI.forEach(function (t) {
      h += '<div class="progGlava" style="color:' + BOJA_TIPA[t] + '">' + t + '</div>';
    });
    for (var r = 1; r <= MAX_RAZINA; r++) {
      var imaIsta = false;
      for (var j = 0; j < TIPOVI.length; j++) if (maksCjeline(TIPOVI[j], r) > 0) imaIsta = true;
      if (!imaIsta) continue;
      h += '<div class="progRazina">' + r + '</div>';
      for (var i = 0; i < TIPOVI.length; i++) {
        var tip = TIPOVI[i], par = saz[tip + ' ' + r];
        if (!maksCjeline(tip, r)) { h += '<div class="progCelija prazno"></div>'; continue; }
        var o = (par && par[0]) || 0, m = (par && par[1]) || maksCjeline(tip, r);
        var pct = m > 0 ? Math.round(o / m * 100) : 0;
        var id2 = 'pt_' + tip + '_' + r;
        trake.push({ id: id2, pct: m > 0 ? Math.min(1, o / m) : 0 });
        h += '<div class="progCelija' + (pct >= 100 ? ' puna' : (o === 0 ? ' nula' : '')) +
          '" style="--boja:' + BOJA_TIPA[tip] + ';cursor:default">' +
          (pct >= 100 ? '<span class="kvaka">' + IK('kvaka') + '</span>' : '') +
          '<div><div class="pct">' + pct + '%</div><div class="odn">' + o + ' / ' + m + '</div></div>' +
          '<div class="progStaza"><i id="' + id2 + '"></i></div></div>';
      }
    }
    h += '</div></div>';
    cilj.innerHTML =
      '<div class="progLadica" style="--boja:var(--plava)">' +
        '<div class="progLadicaGlava">' +
          '<span class="znak">public progress</span>' +
          '<h3>' + esc(osoba.nadimak || 'Someone') + '</h3>' +
          '<span class="rez">' + ((osoba.lp || 0) + (osoba.vp || 0) + (osoba.gp || 0) + (osoba.pp || 0)) +
            ' <small>points in total</small></span>' +
          '<button class="x" id="progTudjiX" title="Close">✕</button>' +
        '</div>' +
        '<div style="padding:1rem 1.125rem">' + h + '</div>' +
        '<div class="progLadicaPod">Read-only, and never their e-mail. ' +
          'Last updated ' + esc(progKada(osoba.zadnja_aktivnost)) + '.</div>' +
      '</div>';
    animirajTrake(trake);
    $('progTudjiX').onclick = function () { PROG_TUDJI = null; cilj.innerHTML = ''; };
    cilj.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // ---- ono malo što o nama vide drugi ----
  // Piše se uz progress, ali samo kad se neki od četiri broja stvarno promijenio,
  // da svaka spremljena vježba ne povuče i drugi upis bez potrebe.
  var ZADNJI_JAVNI = '';
  function progSazetak() {
    var out = {};
    for (var r = 1; r <= MAX_RAZINA; r++) {
      for (var i = 0; i < TIPOVI.length; i++) {
        var tip = TIPOVI[i], m = maksCjeline(tip, r);
        if (m > 0) out[tip + ' ' + r] = [progOsv(tip, r), m];
      }
    }
    return out;
  }
  function posaljiJavneBodove() {
    if (!supa || !imaRacun()) return;
    var vratiKes = (KES_VAL === null);
    if (vratiKes) KES_VAL = valute();
    try {
      var v = KES_VAL;
      var potpis = v.LP + '|' + v.VP + '|' + v.GP + '|' + v.PP;
      if (potpis === ZADNJI_JAVNI) return;
      ZADNJI_JAVNI = potpis;
      var sad = new Date().toISOString();
      supa.from('javni_bodovi').update({
        lp: v.LP, vp: v.VP, gp: v.GP, pp: v.PP,
        sazetak: (DRUSTVO.ja && DRUSTVO.ja.progres_javan) ? progSazetak() : {},
        verzija_sadrzaja: (window.PODACI && PODACI.generirano) || null,
        zadnja_aktivnost: sad, updated_at: sad
      }).eq('user_id', SESSION.user.id).then(function () {}, function () {});
    } finally {
      if (vratiKes) KES_VAL = null;
    }
  }

  // ================= ACCOUNT =================
  // Stranica računa: unos koda, plan, kodovi, postavke, podaci. Plan i pravila su u
  // PLAN-account-i-naplata.md. Tko ima Plus i do kad odlučuje baza (moj_pristup /
  // plus_stanje); ova stranica samo prikazuje i šalje radnje edge funkcijama
  // `paddle-checkout` i `racun`.
  //
  // Stanja plana:  free → paketi + Custom
  //                pretplata → samo njezin plan (bez ponuda), Custom sklopljen
  //                kod → do kad vrijedi, paketi i Custom sklopljeni
  //                komplimentarno → poklonjeni Plus
  // Za vrijeme besplatnog razdoblja (postavke.svima_pristup_do) stranica izgleda kao
  // poslije, a pokušaj kupnje javlja do kad je pristup besplatan.

  var ACC = { paket: 'godina', vrsta: 'mjesec', n: 10, kodovi: null, darivatelji: null, javni: null };
  var ACC_IME = { tjedan: T_('Weekly'), mjesec: T_('Monthly'), godina: T_('Yearly') };
  var ACC_JED = { tjedan: 'week', mjesec: 'month', godina: 'year' };   // samo za CSV (podaci)
  var ACC_JEDAN = { tjedan: T_('1 week'), mjesec: T_('1 month'), godina: T_('1 year') };
  var ACC_PO = { tjedan: T_('per week'), mjesec: T_('per month'), godina: T_('per year') };
  var ACC_CIJENA_PO = { tjedan: T_('%1 / week'), mjesec: T_('%1 / month'), godina: T_('%1 / year') };
  var ACC_NASTAVI = { tjedan: T_('Continue with weekly'), mjesec: T_('Continue with monthly'), godina: T_('Continue with yearly') };
  var ACC_KOD_KLJUC = 'croland.kodZaUnos';

  function accCijene() {
    var c = POSTAVKE.cijene || {};
    return {
      tjedan: Number(c.tjedan) || 5, mjesec: Number(c.mjesec) || 10, godina: Number(c.godina) || 60,
      valuta: c.valuta || 'EUR',
      e: Number(c.popust_eksponent) || Math.log(2) / Math.log(100),
      pod: Number(c.popust_pod) || 1 / 3,
      max: Number(c.max_kodova) || 2000
    };
  }
  // Ista formula kao na serveru (_shared/lib.ts → cijenaKodova) i u cjenik.html.
  function accCijenaKodova(vrsta, n) {
    var c = accCijene();
    var faktor = Math.max(Math.pow(n, -c.e), c.pod);
    var poKodu = Math.round(c[vrsta] * faktor * 100) / 100;
    return { poKodu: poKodu, ukupno: Math.round(poKodu * n * 100) / 100, popust: Math.round((1 - faktor) * 100) };
  }
  function accNovac(x) {
    var c = accCijene();
    var cijeli = Math.abs(x - Math.round(x)) < 0.005;
    try {
      return Number(x).toLocaleString(LOKAL_VALUTA, { style: 'currency', currency: c.valuta,
        minimumFractionDigits: cijeli ? 0 : 2, maximumFractionDigits: 2 });
    } catch (e) { return x + ' ' + c.valuta; }
  }
  function accDatum(d) {
    var t = (d instanceof Date) ? d : new Date(d);
    if (isNaN(t)) return '';
    return t.toLocaleDateString(LOKAL_DATUM, { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function accDodaj(od, vrsta) {
    var d = new Date(od.getTime());
    if (vrsta === 'tjedan') d.setDate(d.getDate() + 7);
    else if (vrsta === 'mjesec') {
      var dan = d.getDate();
      d.setDate(1); d.setMonth(d.getMonth() + 1);
      d.setDate(Math.min(dan, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()));
    }
    else d.setFullYear(d.getFullYear() + 1);
    return d;
  }
  function accBesplatnoDo() {
    return akcijaAktivna() ? new Date(Date.parse(POSTAVKE.svima_pristup_do)) : null;
  }
  function accPretplata() {
    var p = ENTITLEMENT && ENTITLEMENT.pretplata;
    return (p && ['active', 'trialing', 'past_due', 'paused'].indexOf(p.status) !== -1) ? p : null;
  }
  // Koji plan stranica prikazuje. Besplatno razdoblje se namjerno ne računa: stranica
  // tada izgleda kao Free, jer tako će izgledati kad naplata krene.
  function accStanje() {
    if (ENTITLEMENT && ENTITLEMENT.komplimentarno) return 'komplimentarno';
    if (accPretplata()) return 'pretplata';
    if (ENTITLEMENT && ENTITLEMENT.kod_do && Date.parse(ENTITLEMENT.kod_do) > Date.now()) return 'kod';
    return 'free';
  }
  function accPozoviRacun(tijelo) {
    return fetch(FUNKCIJE_URL + '/racun', {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, zaglavljaFunkcije()),
      body: JSON.stringify(tijelo)
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { j._status = r.status; return j; });
    });
  }

  // ---- modal ----
  function accModal(html, naZatvaranje) {
    var star = $('accOverlay'); if (star) star.remove();
    var ov = document.createElement('div'); ov.id = 'accOverlay';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(29,27,23,.5);z-index:100;' +
      'display:flex;align-items:center;justify-content:center;padding:16px;';
    var m = document.createElement('div'); m.className = 'otkljModal accModal';
    m.innerHTML = html;
    ov.appendChild(m);
    var zatvori = function () { ov.remove(); if (naZatvaranje) naZatvaranje(); };
    ov.onclick = function (e) { if (e.target === ov) zatvori(); };
    document.body.appendChild(ov);
    Array.prototype.forEach.call(m.querySelectorAll('[data-zatvori]'), function (b) { b.onclick = zatvori; });
    return { el: m, zatvori: zatvori };
  }
  function accPoruka(naslov, tekst) {
    accModal('<h2>' + naslov + '</h2><p class="otkljPod">' + tekst + '</p>' +
      '<div class="accGumbi"><button class="gumb" data-zatvori>OK</button></div>');
  }

  // ---- kupnja ----
  var PADDLE_UCITAN = null;   // Promise
  function accUcitajPaddle() {
    if (PADDLE_UCITAN) return PADDLE_UCITAN;
    PADDLE_UCITAN = new Promise(function (ok, ne) {
      var s = document.createElement('script');
      s.src = 'https://cdn.paddle.com/paddle/v2/paddle.js';
      s.onload = function () {
        var p = POSTAVKE.paddle || {};
        try {
          if (p.okruzenje !== 'production') window.Paddle.Environment.set('sandbox');
          window.Paddle.Initialize({ token: p.client_token, eventCallback: accPaddleDogadaj });
          ok(window.Paddle);
        } catch (e) { ne(e); }
      };
      s.onerror = function () { PADDLE_UCITAN = null; ne(new Error('paddle.js')); };
      document.head.appendChild(s);
    });
    return PADDLE_UCITAN;
  }
  function accPaddleDogadaj(e) {
    if (!e || e.name !== 'checkout.completed') return;
    try { window.Paddle.Checkout.close(); } catch (x) {}
    accModal('<h2>Thank you!</h2><p class="otkljPod" id="accHvala">Payment received. Updating your account…</p>');
    // Webhook stiže za koju sekundu; pristup i kodovi se dohvaćaju dok ne stignu.
    var pokusaji = 0;
    (function pokusaj() {
      pokusaji++;
      ACC.kodovi = null;
      ucitajEntitlement(function () {
        var gotovo = accStanje() === 'pretplata' || (ENTITLEMENT && ENTITLEMENT.ima_kupnje);
        if (gotovo || pokusaji >= 8) {
          resetirajPlusSadrzaj(); ucitajPlusSadrzaj();
          var o = $('accOverlay'); if (o) o.remove();
          osvjeziHeader();
          if (ZADNJI_VIEW && ZADNJI_VIEW.view === 'account') renderAccount();
          if (!gotovo) accPoruka('Almost there', 'Your payment went through, but your account hasn\'t updated yet. ' +
            'Refresh the page in a minute.');
          return;
        }
        setTimeout(pokusaj, 2000);
      });
    })();
  }
  function accKupi(tijelo) {
    var besplatno = accBesplatnoDo();
    if (besplatno) {
      accPoruka(T_('Access is free until %1', accDatum(besplatno)),
        T_('Everything is unlocked for everyone until then. Plans and codes go on sale on %1.', accDatum(besplatno)));
      return;
    }
    if (!POSTAVKE.paddle || !POSTAVKE.paddle.client_token) {
      accPoruka('Not available yet', 'Purchases open soon. Please check back in a few days.');
      return;
    }
    accModal('<h2>Opening checkout…</h2><p class="otkljPod">Payments are handled securely by Paddle.</p>');
    fetch(FUNKCIJE_URL + '/paddle-checkout', {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, zaglavljaFunkcije()),
      body: JSON.stringify(tijelo)
    }).then(function (r) { return r.json().then(function (j) { j._status = r.status; return j; }); })
      .then(function (j) {
        if (!j.transaction_id) {
          if (j.error === 'vec-pretplacen') accPoruka('You already have a plan', 'Use “Change plan” to switch.');
          else if (j.error === 'besplatno') accPoruka('Access is free right now', T_('Plans go on sale on %1.', accDatum(j.do)));
          else accPoruka('Not available yet', 'Purchases open soon. Please check back in a few days.');
          return;
        }
        return accUcitajPaddle().then(function (P) {
          var o = $('accOverlay'); if (o) o.remove();
          P.Checkout.open({ transactionId: j.transaction_id, customer: { email: j.email }, settings: { locale: JEZIK_APP } });
        });
      })
      .catch(function () { accPoruka('Something went wrong', 'Checkout could not be opened. Please try again.'); });
  }

  // ---- kod ----
  function accPokreniKod(kod) {
    kod = String(kod || '').trim();
    var g = $('accKodGreska');
    var greska = function (t) { if (g) { g.textContent = t; g.hidden = !t; } };
    greska('');
    if (!kod) return;
    var gumb = $('accKodGumb'); if (gumb) gumb.disabled = true;
    supa.rpc('pregled_koda', { p_kod: kod }).then(function (res) {
      if (gumb) gumb.disabled = false;
      if (res.error) { greska('Codes aren\'t available yet. Please try again later.'); return; }
      var r = res.data || {};
      if (r.stanje === 'nema') return greska('We don\'t recognise this code. Codes look like CRO-XXXX-XXXX.');
      if (r.stanje === 'iskoristen') return greska('This code has already been used.');
      if (r.stanje === 'istekao') return greska(T_('This code could only be redeemed until %1.', accDatum(r.unos_do)));
      if (r.stanje === 'ponisten') return greska('This code is no longer valid.');
      if (r.stanje === 'previse') return greska('Too many attempts today. Please try again tomorrow.');
      if (r.stanje !== 'ok') return greska('This code can\'t be used.');
      accDijalogKoda(r);
    });
  }
  function accDijalogKoda(r) {
    var jed = ACC_JEDAN[r.vrsta];
    var p = accPretplata();
    var html;
    var odKoga = r.od_koga
      ? '<p class="accSitno">This code is from <b>' + esc(r.od_koga) + '</b>. They\'ll see your display name and points — ' +
        'you can hide this anytime in Account settings.</p>' +
        '<label class="accKvacica"><input type="checkbox" id="accVise"> Also let ' + esc(r.od_koga) +
        ' see my lessons and activity dates</label>'
      : '';
    if (p && p.auto_obnova && p.status !== 'paused' && p.vrijedi_do) {
      var stara = new Date(p.vrijedi_do), nova = accDodaj(stara, r.vrsta);
      html = '<h2>' + T_('Extend your Plus by %1?', jed) + '</h2>' +

    } else {
      var pocetak = new Date();
      [accBesplatnoDo(), p && p.vrijedi_do ? new Date(p.vrijedi_do) : null,
       ENTITLEMENT && ENTITLEMENT.kod_do ? new Date(ENTITLEMENT.kod_do) : null].forEach(function (d) {
        if (d && d > pocetak) pocetak = d;
      });
      var kraj = accDodaj(pocetak, r.vrsta);
      var kasnije = pocetak > new Date(Date.now() + 60000);
      html = '<h2>' + (kasnije ? T_('Add %1 of Croland Plus?', jed) : T_('Activate %1 of Croland Plus?', jed)) + '</h2>' +
        '<p class="otkljPod">' + (kasnije
          ? T_('It starts on <b>%1</b>, when your current access ends, and runs until <b>%2</b>.', accDatum(pocetak), accDatum(kraj))
          : T_('Everything unlocked until <b>%1</b>.', accDatum(kraj))) +

          resetirajPlusSadrzaj(); ucitajPlusSadrzaj(); osvjeziHeader();
          renderAccount();
          accPoruka('Done!', j.nacin === 'pretplata'
            ? T_('Your next payment is now on %1.', accDatum(j.novi_do))
            : T_('You have Croland Plus until %1.', accDatum(j.novi_do)));
        });
      }).catch(function () { m.zatvori(); accPoruka('Something went wrong', 'The code was not used. Please try again.'); });
    };

  // Link croland…/?redeem=CRO-XXXX-XXXX: kod se pamti kroz prijavu i otvara se Account s njim.

  function accPaketi() {

        'Permanently removes your account and all progress. Codes you bought stay valid.') +
