<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<script>
  // Jezik uputa. Svaki jezik je svoja stranica (index.html, index-de.html, ...) s istim kodom i
  // istim kljucevima napretka. Ovo je JEDINI popis jezika: koriste ga preusmjeravanje ovdje,
  // izbor jezika pri prvom otvaranju (odmah iza <body>) i Options → Language.
  //   izbor = "Choose your language" na tom jeziku (prvi zaslon pokazuje sve odjednom)
  //   pravno = postoje prevedeni terms-XX.html i privacy-XX.html (inace se otvara engleska verzija)
  (function () {
    var JEZIK_STRANICE = 'en', JEZICI = [
      { id: 'en', ime: 'English', stranica: 'index.html', izbor: 'Choose your language',
        opis: 'Explanations, hints and translations in English.' },
      { id: 'de', ime: 'Deutsch', stranica: 'index-de.html', izbor: 'Wähle deine Sprache', pravno: true,
        opis: 'Erklärungen, Hinweise und Übersetzungen auf Deutsch.' }
    ];
    window.CROLAND_JEZICI = JEZICI;
    window.CROLAND_JEZIK_STRANICE = JEZIK_STRANICE;
    var stranica = {};
    JEZICI.forEach(function (x) { stranica[x.id] = x.stranica; });
    var j = null, smije = false;
    try {
      j = localStorage.getItem('croland.jezik');
      localStorage.setItem('croland.proba', '1'); localStorage.removeItem('croland.proba');
      smije = true;
    } catch (e) {}
    if (j && j !== JEZIK_STRANICE && stranica[j]) { location.replace(stranica[j] + location.search + location.hash); return; }
    if (j || !smije) return;
    // Jezik jos nije izabran. Prijavljeni korisnik ga ima u racunu (provjeriJezikRacuna), pa
    // se izbor nudi samo onome tko nema ni izbor ni sesiju — pri prvom otvaranju, dok se ucitava.
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i) || '';
        if (k.indexOf('sb-') === 0 && k.indexOf('-auth-token') !== -1) return;
      }
    } catch (e) { return; }
    // prijedlog: jezik ove stranice ako nije engleska, inace prvi jezik preglednika koji postoji
    var prijedlog = JEZIK_STRANICE;
    if (JEZIK_STRANICE === 'en') {
      var pj = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'en'];
      for (var n = 0; n < pj.length; n++) {
        var kod = String(pj[n] || '').slice(0, 2).toLowerCase();
        if (stranica[kod]) { prijedlog = kod; break; }
      }
    }
    window.CROLAND_BIRAJ_JEZIK = prijedlog;
  })();
</script>

<style>
  /* ============ SUSTAV VELIČINA ============================================
     Cijelo sučelje visi o jednom broju: font-size na <html>. Svaka veličina
     niže je u rem, pa se sve — tekst, razmaci, kartice, slike, tipke —
     skalira zajedno kad se korijen pomakne.

       --baza    korijenska veličina pisma. NE postavlja se ovdje nego u bloku
                 svog uređaja (vidi TRI UREĐAJA na dnu datoteke): mobitel,
                 tablet i računalo imaju svaki svoju bazu i svoj raspon rasta.
                 Vrijednost ovdje je samo zaštita ako nijedan blok ne uhvati.
       --skala   množitelj koji postavlja korisnik (Options → Interface size)
                 i korekcija pisma; JS ga piše na documentElement.

     Baza je u rem (ne px!) da preglednikov zoom i korisnikova zadana veličina
     fonta i dalje rade.
     ---------------------------------------------------------------------- */
  html {
    font-size: calc(var(--skala, 1) * var(--baza, 1rem));
    /* Mjesto za klizac se drzi i kad ga nema. Bez ovoga stranice koje skrolaju
       (Lessons, Mini games, Options) imaju 15px uzu vidljivu sirinu od onih
       koje ne skrolaju, pa sav centrirani sadrzaj poskoci 8px lijevo-desno pri
       svakoj promjeni stranice. */
    scrollbar-gutter: stable;
  }

  :root {
    /* Tipografija — 10 razina umjesto 37 nasumičnih vrijednosti.
       Vrijednosti ispod su POLAZNE; svaki uređaj ih prepisuje svojima
       (TRI UREĐAJA, dno datoteke). Omjer naslova prema tijelu nije isti na
       mobitelu i na monitoru — zato ljestvica nije zajednička. */
    --t-2xs: 0.66rem;   /* brojke u stisnutoj mreži lekcija na mobitelu */
    --t-xs:  0.75rem;   /* oznake, kvake, sitni metapodaci */
    --t-s:   0.82rem;   /* pomoćni tekst, podnaslovi kartica */
    --t-m:   0.9rem;    /* sekundarno tijelo, navigacija, tablice */
    --t-l:   1rem;      /* tijelo teksta, gumbi, polja za unos */
    --t-xl:  1.15rem;   /* naslovi kartica, pitanja */
    --t-2xl: 1.35rem;   /* naslovi na mobitelu */
    --t-3xl: 1.6rem;    /* naslovi ekrana, velike riječi */
    --t-4xl: 2.1rem;    /* veliki brojevi (prsten, valute, streak) */
    --t-5xl: 3rem;      /* proslavne ikone */

    /* radijusi — 5 razina umjesto 15 */
    --rad-xs:  0.1875rem;  /* trakice napretka */
    --rad-s:   0.5rem;     /* gumbi, tipke, sitne značke */
    --rad-m:   0.625rem;   /* kartice u popisu, polja */
    --rad-l:   0.875rem;   /* ploče, veće kartice */
    --rad-xl:  1.125rem;   /* modali, bočni paneli */

    --bg: #f6f3ee; --card: #fffdfa; --ink: #191713; --muted: #8b8377;
    --plava: #9a5b52; --zelena: #2f6d4f; --crvena: #c2413c; --rub: #e3ddd2;
    --zlatna: #8a6d1f;
    --plavaVok: #23407a; --tinta: #1d1b17; --tiho: #f0ece4; --papir: #faf7f1;
    /* ---- cedulje (sticky notes) ----
       Papir, njegov rub i crte su dio teme. Tinta i rukopis nisu: pero je isto
       na svakoj boji papira. */
    --cedPapir: #fdf2bf; --cedRub: #eadd9d; --cedCrta: rgba(74,60,20,.20);
    --cedTinta: #2a3147;
    --rukopis: "Caveat", "Segoe Script", "Bradley Hand", cursive;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--tekst); font-size: var(--t-l); line-height: var(--font-visina);
    background: var(--bg); color: var(--ink); min-height: 100dvh;
  }

  /* Zaglavlje je mreza od tri stupca, ne redak: krajnji stupci su jednaki
     (1fr), pa izbornik u sredini stoji na sredini EKRANA, a ne na sredini
     praznine izmedu loga i brojaca. Sredisnji stupac je minmax(0,auto) da se
     smije stisnuti kad natpisi narastu, umjesto da gura ostalo van. */
  header {
    background: var(--card); border-bottom: 1px solid var(--rub);
    padding: 0.75rem 1.25rem; gap: 1rem;
    /* Srednji stupac je minmax(0, max-content), NE minmax(0, auto): "auto" kao
       gornja granica dopusta stupcu da se rastegne i pojede slobodan prostor,
       pa lijevi stupac padne na sirinu loga i izbornik odleti ulijevo i kad ima
       mjesta. S max-content stupac ostaje tocno sirok koliko izbornik treba, a
       dva 1fr stupca oko njega ostaju jednaka dok oba stanu. */
    display: grid; grid-template-columns: 1fr minmax(0, max-content) 1fr; align-items: center;
    position: sticky; top: 0; z-index: 10;
  }
  /* Stupci su zadani izrijekom, ne redom pojavljivanja: na mobitelu je nav
     position:fixed (sklopivi izbornik) pa ispada iz mreze, a bez ovoga bi
     desna skupina skliznula u srednji stupac umjesto uz desni rub. */
  /* Krajnji stupci su oba 1fr, pa dok i logo i desna skupina stanu u svoju
     polovicu srednji stupac lezi na sredini EKRANA. 1fr je minmax(auto, 1fr):
     cim brojac bodova preraste svoju polovicu, njegov stupac naraste, lijevi se
     smanji, i izbornik se pomakne ulijevo tocno onoliko koliko treba — nadoveze
     se na brojeve umjesto da ostane centriran i bude prekriven. Na sirokom
     ekranu do toga ne dolazi gotovo nikad, pa izbornik ostaje na sredini.
     Zato desna skupina NEMA min-width: 0: s njim bi njezin doprinos sirini bio
     nula, stupac ne bi narastao, a brojac bi legao preko izbornika.
     "safe center" je zadnja zastita — ako ni srednji stupac nije dovoljan,
     izbornik se poravna lijevo umjesto da mu se odreze pocetak. */
  header .logo { grid-column: 1; justify-self: start; }
  header nav { grid-column: 2; justify-content: center; justify-content: safe center; }
  .desnoZ { grid-column: 3; justify-self: end; display: flex; align-items: center; gap: 0.5rem; }
  /* Dok brojac stoji u zaglavlju, on je ujedno i put na Progress — stavka u
     izborniku bila bi drugi gumb za isto, a kraci izbornik znaci i manje guranja. */
  body.imaBrojac header nav a[data-view="progress"] { display: none; }
  header .logo {
    width: 1.75rem; height: 1.75rem; flex: none; border-radius: var(--rad-s);
    background: var(--plava); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--naslov); font-weight: 700; font-size: var(--t-m); line-height: 1;
    transition: filter .15s;
  }
  header .logo:hover { filter: brightness(1.08); }
  /* Jedan red, nikad dva. S flex-wrap:wrap izbornik bi se pri tijesnom zaglavlju
     prelomio u dva retka — zaglavlje naraste, a stavke i dalje nisu na svom
     mjestu. Ovako ostaje red koji se u krajnjem slucaju vodi vodoravno. */
  header nav { display: flex; gap: 0.25rem; flex-wrap: nowrap;
    overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; }
  header nav::-webkit-scrollbar { display: none; }
  header nav a {
    flex: none; white-space: nowrap;
    padding: 0.375rem 0.75rem; border-radius: var(--rad-s); color: var(--muted);
    text-decoration: none; font-size: var(--t-m); cursor: pointer;
  }
  header nav a:hover { background: var(--tiho); color: var(--ink); }
  /* Na sirokom zaslonu logo vodi na naslovnicu, pa je stavka nepotrebna;
     na mobitelu je logo hamburger, pa je Home jedini put natrag. */
  header nav a.navPocetna { display: none; }
  header nav a.aktivna { background: var(--tiho); color: var(--ink); font-weight: 600; }
  /* -- poziv na Daily challenge (v. pozoviNaDaily()) --
     Dok danasnji challenge nije odigran, natpis povremeno dobije .poziva: ploca
     poprimi boju lebdenja (znak da je tipka), a tekst dvaput kratko poskoci.
     Ploca sama stoji — izbornik je vodoravni skrol-spremnik i odrezao bi svaki
     pomak izvan svog retka — pa skace samo tekst unutar nje: <span> na racunalu
     i mobitelu, kratki natpis (::after) na tabletu. Na mobitelu je izbornik
     sklopljen, pa ☰ dobiva puls i halo lebdecih ikona. */
  header nav a > span { display: inline-block; }
  @keyframes pozivPloca {
    20%, 75% { background-color: var(--tiho); color: var(--plava);
      box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--plava) 30%, transparent); }
  }
  @keyframes pozivSkok {
    0%, 14%, 36%, 58%, 100% { transform: translateY(0); animation-timing-function: cubic-bezier(.2,.6,.35,1); }
    25% { transform: translateY(-0.1875rem); animation-timing-function: cubic-bezier(.55,0,.8,.4); }
    47% { transform: translateY(-0.125rem); animation-timing-function: cubic-bezier(.55,0,.8,.4); }
  }
  @keyframes pozivHalo { from { transform: scale(1); opacity: .45; } to { transform: scale(1.7); opacity: 0; } }
  header nav a.poziva { animation: pozivPloca 2.4s ease-in-out; }
  header nav a.poziva > span, header nav a.poziva::after { animation: pozivSkok 2.4s; }
  header .logo.poziva { animation: lebdiPuls 1.1s cubic-bezier(.34,1.35,.64,1) 2; }
  header .logo.poziva::after {
    content: ''; position: absolute; inset: 0; border-radius: inherit;
    border: 2px solid var(--plava); pointer-events: none;
    animation: pozivHalo 1.1s ease-out 2;
  }
  @media (prefers-reduced-motion: reduce) {
    header nav a.poziva > span, header nav a.poziva::after { animation: none; }
    header .logo.poziva { animation: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--plava) 30%, transparent); }
    header .logo.poziva::after { animation: none; opacity: 0; }
  }
  header .valute { font-size: var(--t-s); color: var(--muted); white-space: nowrap;
    font-family: var(--naslov); font-weight: 600; padding: 0.375rem 0.75rem; border-radius: var(--rad-m); background: var(--tiho); }

  /* -- veličina sučelja iz zaglavlja --
     Ista postavka postoji i u Options kao tri kartice, ali ondje se do nje mora
     doci. Ovdje su samo dvije tipke koje pomicu izbor po istoj ljestvici
     (Compact → Default → Large); tipka na kraju ljestvice se gasi, pa se po
     njoj vidi gdje se stoji bez dodatnog natpisa. */
  .velicinaG { display: flex; gap: 0.1875rem; flex: none; }
  .velicinaG button {
    width: max(1.75rem, 28px); height: max(1.75rem, 28px);
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--rub); border-radius: var(--rad-s); background: var(--card);
    color: var(--muted); font-family: var(--naslov); font-size: var(--t-m); font-weight: 700;
    line-height: 1; cursor: pointer; padding: 0;
    transition: border-color .15s, color .15s, background .15s;
  }
  .velicinaG button:hover:not(:disabled) { border-color: var(--plava); color: var(--plava); }
  .velicinaG button:focus-visible { outline: 2px solid var(--plava); outline-offset: 2px; }
  .velicinaG button:disabled { opacity: .35; cursor: default; }

  /* -- pozadina iza sklopivog izbornika (mobitel) -- */
  #izbornikPozadina { position: fixed; inset: 0; background: rgba(29,27,23,.28); z-index: 19; display: none; }
  #izbornikPozadina.vidi { display: block; }

  #view { max-width: 56.25rem; margin: 0 auto; padding: 1.5rem 1rem 4rem; }

  .naslovnica { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-top: 1.5rem; }
  .velikaPlocica {
    background: var(--card); border: 1px solid var(--rub); border-radius: var(--rad-l);
    padding: 2.5rem 1.5rem; text-align: center; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,.05); transition: transform .12s, border-color .15s;
  }
  .velikaPlocica:hover { transform: translateY(-2px); border-color: var(--plava); box-shadow: 0 6px 18px rgba(25,23,19,.07); }
  .velikaPlocica .ikona { font-size: var(--t-4xl); margin-bottom: 0.625rem; }
  .velikaPlocica .ime { font-weight: 600; font-size: var(--t-xl); }
  .velikaPlocica .pod { font-size: var(--t-s); color: var(--muted); margin-top: 0.375rem; }

  /* table-layout: fixed drži svih pet stupaca jednako širokima i, važnije,
     ne dopušta tablici da naraste preko #view — bez toga se mreža lekcija
     na uskom ekranu prelijeva i stranica se vodoravno pomiče. */
  /* Razine idu odozgo prema dolje (retci su razine, stupci vrste). Vidi se samo
     otključano i po jedna sljedeća zaključana u stupcu; ostale ćelije drže mjesto
     (visibility: hidden) da stupci ostanu poravnani. */
  .mrezaOkvir { padding-bottom: 0.25rem; }
  table.mreza { table-layout: fixed; border-collapse: separate; border-spacing: 0.625rem 0.5rem; width: 100%; }
  table.mreza th.razF {
    width: 2rem; text-align: right; padding-right: 0.25rem;
    font-family: var(--naslov); font-weight: 700; font-size: var(--t-l); color: var(--muted);
  }
  table.mreza th.glavaF { font-size: var(--t-s); font-weight: 700; text-align: center; padding-bottom: 0.25rem; }
  table.mreza th.glavaF .kratko { display: none; }
  td.faza {
    background: var(--card); border: 1px solid var(--rub); border-radius: var(--rad-m);
    padding: 0.75rem 0.625rem 0.625rem; text-align: center; cursor: pointer; font-size: var(--t-s);
    transition: border-color .15s; vertical-align: middle;
  }
  td.faza:hover { border-color: var(--plava); }
  td.faza.skriven { visibility: hidden; cursor: default; }
  td.faza .imeF { font-weight: 600; font-size: var(--t-s); }
  td.faza .bod { color: var(--muted); font-size: var(--t-xs); margin-top: 0.25rem; }
  td.faza .bod strong { color: var(--zelena); }
  td.faza.zakljucano { cursor: default; background: var(--tiho); border-style: dashed; }
  td.faza.zakljucano:hover { border-color: var(--rub); }
  td.faza.zakljucano .imeF { color: var(--muted); }
  td.faza.pretplata { opacity: .7; background: #f4f0e9; border-color: var(--zlatna); }
  td.faza.gotovo { border-color: var(--zelena); }
  td.faza .plusF { font-size: var(--t-xs); color: var(--zlatna); }

  /* kružnica sljedeće zaključane: kreće s vrha i puni se u smjeru kazaljke */
  .lukOkvir { position: relative; width: 2.5rem; height: 2.5rem; margin: 0.375rem auto 0; }
  .lukZ { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
  .lukZ circle { fill: none; stroke-width: 3.5; }
  .lukZ .podloga { stroke: var(--rub); }
  .lukZ .puni {
    stroke: var(--zlatna); stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100;
    transition: stroke-dashoffset .9s cubic-bezier(.22,1,.36,1);
  }
  .lukBrava {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--zlatna); font-size: var(--t-xs);
  }

  /* traka umjesto "12/40" — omjer se vidi bez računanja */
  td.faza .tr {
    height: 0.375rem; border-radius: var(--rad-xs); background: var(--rub);
    overflow: hidden; margin: 0.5rem 0.125rem 0.375rem;
  }
  td.faza .tr i {
    display: block; height: 100%; width: 0; border-radius: var(--rad-xs);
    background: var(--plava); transition: width .7s cubic-bezier(.22,1,.36,1);
  }
  td.faza.gotovo .tr i { background: var(--zelena); }
  .viseRazina {
    display: block; width: 100%; margin: 0.625rem 0 0; padding: 0.625rem 0.875rem;
    border: 1px dashed var(--rub); border-radius: var(--rad-m); background: var(--card);
    color: var(--muted); font-size: var(--t-s); cursor: pointer;
  }
  .viseRazina:hover { border-color: var(--plava); color: var(--plava); }

  /* Lesson 0 — uvodna cjelina: uvijek otključana, vizualno odvojena od mreže */
  .redNula { display: flex; justify-content: flex-end; margin-bottom: 0.75rem; }
  /* prijeđena Lesson 0 stoji ispod popisa lekcija (renderLessons), pa razmak ide iznad nje */
  .mrezaOkvir ~ .redNula { margin: 0.75rem 0 0; }
  .plocicaNula {
    background: var(--card);
    border: 1px solid var(--rub); border-radius: var(--rad-m);
    padding: 0.625rem 1rem; cursor: pointer; text-align: right;
    transition: border-color .15s, transform .12s;
  }
  .plocicaNula:hover { border-color: var(--plava); transform: translateY(-1px); }
  .plocicaNula .imeF { font-weight: 700; font-size: var(--t-m); color: var(--ink); font-family: var(--naslov); }
  .plocicaNula .bod { font-size: var(--t-xs); color: var(--muted); margin-top: 0.125rem; }
  .plocicaNula.gotovo { background: #eaf3ec; border-color: var(--zelena); }
  .plocicaNula.gotovo .imeF { color: var(--zelena); }
  .plocicaNula.gotovo .bod { color: var(--muted); }

  /* Kartica vježbe stoji na sredini, pa i dva retka iznad nje moraju — inače
     naslov i brojevi vise lijevo od sadržaja na koji se odnose. */
  .traka { display: flex; align-items: center; justify-content: center; gap: 0.75rem; margin-bottom: 0.875rem; flex-wrap: wrap; }
  .traka .natrag {
    padding: 0.375rem 0.875rem; border: 1px solid var(--rub); border-radius: var(--rad-s);
    background: var(--card); cursor: pointer; font-size: var(--t-s);
  }
  .traka h2 { font-size: var(--t-l); }
  .progresBar { flex: 1; min-width: 7.5rem; height: 0.5rem; background: var(--rub); border-radius: var(--rad-xs); overflow: hidden; }
  .progresBar div { height: 100%; background: var(--plava); border-radius: var(--rad-xs); transition: width .3s; }

  .vjezbeNav { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.375rem; margin-bottom: 1rem; }
  .vnav {
    display: inline-flex; flex-direction: column; align-items: stretch; gap: 0.25rem;
    padding: 0.375rem 0.625rem 0.375rem; border: 1px solid var(--rub); border-radius: var(--rad-s);
    background: var(--card); cursor: pointer; font-size: var(--t-s); color: var(--muted);
    min-width: 2.5rem; text-align: center; transition: border-color .15s, background .15s;
  }
  .vnav:hover { border-color: var(--plava); }
  .vnav.aktivna { border-color: var(--plava); background: #f4ebe9; color: var(--ink); font-weight: 600; }
  .vnav.zavrsena { border-color: var(--zelena); color: var(--zelena); }
  .vnav.zavrsena.aktivna { background: #eaf3ec; }
  .vnav.djelom { border-color: var(--zlatna); color: var(--zlatna); }
  /* trakica bodova ispod broja stranice */
  .vtr { display: block; height: 0.25rem; border-radius: var(--rad-xs); background: var(--rub); overflow: hidden; }
  .vtr i {
    display: block; height: 100%; width: 0; border-radius: var(--rad-xs);
    background: var(--zlatna); transition: width .6s cubic-bezier(.22,1,.36,1);
  }
  .vnav.zavrsena .vtr i { background: var(--zelena); }
  .vnav.vfin { border-style: dashed; }
  .vnav.vfin.aktivna { border-style: solid; }

  #ploca {
    background: var(--card); border: 1px solid var(--rub); border-radius: var(--rad-l);
    padding: 1.25rem; box-shadow: 0 2px 8px rgba(0,0,0,.06); max-width: 37.5rem; margin: 0 auto;
  }
  #opisIgre { color: var(--muted); margin: 0 auto 0.625rem; font-size: var(--t-m); max-width: 37.5rem; text-align: center; }
  #statusTraka { display: flex; justify-content: space-between; margin-bottom: 0.875rem; font-size: var(--t-m); color: var(--muted); }

  .stupci { display: flex; gap: 0.875rem; }
  .stupac { flex: 1; display: flex; flex-direction: column; gap: 0.625rem; }
  .stupac h2 { font-size: var(--t-s); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); text-align: center; }

  .rijec, .opcija, .plocica, .poolRijec {
    padding: 0.75rem 0.625rem; border: 2px solid var(--rub); border-radius: var(--rad-m);
    background: #fffdfa; font-size: var(--t-l); cursor: pointer; text-align: center;
    transition: background .15s, border-color .15s; user-select: none;
  }
  .rijec:hover, .opcija:hover, .plocica:hover, .poolRijec:hover { border-color: var(--plava); }
  .odabrano { border-color: var(--plava) !important; background: #f4ebe9 !important; }
  .tocno { border-color: var(--zelena) !important; background: #eaf3ec !important; color: var(--zelena); cursor: default; }
  .krivo { border-color: var(--crvena) !important; background: #fbeceb !important; animation: tres .3s; }
  @keyframes tres { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

  .pitanjeText { font-size: var(--t-xl); text-align: center; margin-bottom: 1rem; line-height: 1.5; }
  .opcije { display: flex; flex-direction: column; gap: 0.625rem; }
  .pricaBox {
    background: #faf7f1; border: 1px solid var(--rub); border-radius: var(--rad-m);
    padding: 0.75rem 0.875rem; margin-bottom: 0.875rem; font-size: var(--t-l); line-height: 1.6; font-style: italic;
  }
  .mrezaMem { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
  .kartaMem {
    aspect-ratio: 3/2; display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 2px solid var(--rub); border-radius: var(--rad-m); background: var(--plava);
    color: #fff; font-size: var(--t-s); cursor: pointer; user-select: none;
    text-align: center; padding: 0.25rem; overflow: hidden;
  }
  .kartaMem.otvoreno { background: #fffdfa; color: var(--ink); border-color: var(--plava); }
  .kartaMem.rijeseno { background: #eaf3ec; color: var(--zelena); border-color: var(--zelena); cursor: default; }

  .plocice { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; }
  .plocica, .poolRijec { flex: 0 0 auto; }
  #odgovorRed {
    min-height: 3.5rem; display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center;
    border: 2px dashed var(--rub); border-radius: var(--rad-m); padding: 0.5rem; margin-bottom: 0.875rem;
  }
  .stupciSort { display: flex; gap: 0.625rem; margin-bottom: 0.875rem; }
  .stupacBox { flex: 1; border: 2px solid var(--rub); border-radius: var(--rad-m); padding: 0.5rem; min-height: 6.25rem; cursor: pointer; }
  .stupacBox:hover { border-color: var(--plava); }
  .stupacBox h3 { font-size: var(--t-s); text-align: center; color: var(--muted); margin-bottom: 0.5rem; }
  .stupacBox .smjesteno { font-size: var(--t-s); text-align: center; padding: 0.25rem; color: var(--zelena); }
  .pool { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; }

  .upisInput { width: 100%; padding: 0.75rem; font-size: var(--t-l); border: 2px solid var(--rub); border-radius: var(--rad-m); text-align: center; margin-bottom: 0.625rem; }
  .upisInput:focus { outline: none; border-color: var(--plava); }
  /* hrvatska slova kojih nema na engleskoj tipkovnici */
  .tipkeHr { display: flex; flex-wrap: wrap; gap: 0.375rem; justify-content: center; margin-bottom: 0.75rem; }
  .tipkaHr {
    min-width: 2.5rem; padding: 0.5rem 0.625rem; border: 1px solid var(--rub); border-radius: var(--rad-s);
    background: var(--card); font-family: inherit; font-size: var(--t-l); font-weight: 700;
    color: var(--ink); cursor: pointer; transition: border-color .15s, background .15s;
  }
  .tipkaHr:hover { border-color: var(--plava); background: #f7f1ef; }
  .tipkaHr:active { background: #f4ebe9; }
  .otkriveno { text-align: center; color: var(--crvena); font-size: var(--t-m); margin-bottom: 0.5rem; min-height: 1.2em; }

  /* ---- nastavak: tapni završetak pridjeva ---- */
  .engNast { text-align: center; color: var(--muted); font-style: italic; font-size: var(--t-l); margin-bottom: 0.375rem; }
  .recNast {
    text-align: center; font-size: var(--t-3xl); font-weight: 600; line-height: 1.5;
    margin: 0.375rem 0 1.25rem; word-break: break-word;
  }
  .slotNast {
    display: inline-block; min-width: 2rem; border-bottom: 3px solid var(--plava);
    text-align: center; color: var(--plava);
  }
  .slotNast.dobar { color: var(--zelena); border-bottom-color: var(--zelena); }
  .slotNast.los { color: var(--crvena); border-bottom-color: var(--crvena); }
  .tipkeNast { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
  .tipkaNast {
    min-width: 5.5rem; padding: 1rem 1.25rem; border: 2px solid var(--rub); border-radius: var(--rad-l);
    background: var(--card); font-family: inherit; font-size: var(--t-3xl); font-weight: 700;
    color: var(--ink); cursor: pointer; transition: transform .12s, border-color .15s, background .15s;
  }
  .tipkaNast:hover { border-color: var(--plava); transform: translateY(-2px); }
  @media (max-width: 639.98px) { .recNast { font-size: var(--t-2xl); } .tipkaNast { min-width: 4.5rem; padding: 0.875rem 0.875rem; font-size: var(--t-2xl); } }
  /* ---- objašnjenja (format: tekst) ---- */
  /* Šira ploča i zračniji odlomci: pravilo se čita, ne rješava, pa mu treba prostora. */
  #ploca.siroka { max-width: 48.75rem; }
  #ploca.siroka #sadrzaj { text-align: left; }
  .odlomak { line-height: 1.75; margin-bottom: 1.25rem; font-size: var(--t-l); text-align: left; }
  .odlomak:last-of-type { margin-bottom: 0.5rem; }
  .odlomak em { color: var(--plava); font-style: italic; }
  /* uvodna podebljana najava dobiva vlastiti redak umjesto da se stisne uz tekst */
  .odlomak .vodilja {
    display: block; color: var(--plava); font-size: var(--t-s); font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase; margin-bottom: 0.375rem;
  }
  /* ---- Blobby: njegove rečenice izlaze iz oblačića ---- */
  .blobbyRed { display: flex; align-items: flex-end; gap: 0.75rem; margin: 0.25rem 0 1.5rem; }
  .blobbySlika { width: 5.5rem; height: auto; flex: 0 0 5.5rem; user-select: none; }
  .blobbyOblacic {
    position: relative; flex: 1 1 auto; background: #fff;
    border: 1px solid var(--rub); border-radius: var(--rad-l); padding: 0.875rem 1rem 0.375rem;
    box-shadow: 0 1px 3px rgba(25,23,19,.05);
  }
  /* repić prema Blobbyjevim ustima */
  .blobbyOblacic::before, .blobbyOblacic::after {
    content: ''; position: absolute; bottom: 20px; width: 0; height: 0;
    border-top: 9px solid transparent; border-bottom: 9px solid transparent;
  }
  .blobbyOblacic::before { left: -11px; border-right: 11px solid var(--rub); }
  .blobbyOblacic::after  { left: -10px; border-right: 11px solid #fff; }
  .blobbyOblacic .odlomak { margin-bottom: 0.75rem; }
  .blobbyOblacic .odlomak:last-child { margin-bottom: 0.5rem; }
  @media (max-width: 639.98px) {
    .blobbySlika { width: 4rem; flex: 0 0 4rem; }
    .blobbyRed { gap: 0.625rem; }
  }
  /* tablica u objašnjenju: "- tab: A | B | C" u md-u */
  .tabObjasnjenje {
    width: 100%; border-collapse: collapse; margin: 0.25rem 0 1.5rem; font-size: var(--t-l);
    background: #faf7f1; border: 1px solid var(--rub); border-radius: var(--rad-m); overflow: hidden;
  }
  .tabObjasnjenje th, .tabObjasnjenje td { padding: 0.625rem 0.875rem; text-align: left; border-bottom: 1px solid var(--rub); }
  .tabObjasnjenje thead th {
    background: #f0ece4; color: var(--plava); font-size: var(--t-xs);
    text-transform: uppercase; letter-spacing: .05em;
  }
  .tabObjasnjenje tbody tr:last-child th, .tabObjasnjenje tbody tr:last-child td { border-bottom: none; }
  .tabObjasnjenje td em, .tabObjasnjenje th em { color: var(--plava); font-style: italic; }
  .tabObjasnjenje tbody th { font-weight: 600; white-space: nowrap; color: var(--muted); }
  @media (max-width: 639.98px) { .tabObjasnjenje { font-size: var(--t-s); } .tabObjasnjenje th, .tabObjasnjenje td { padding: 0.5rem 0.5rem; } }

  /* ---- stranica objašnjenja u odjeljcima ----
     Blok teksta od osam odlomaka nitko ne čita; isti tekst razlomljen na
     naslovljene odjeljke koji se otvaraju klikom čita se do kraja. Naslov
     odjeljka NIJE nova pisanija — to je podebljana najava kojom odlomak ionako
     počinje (**Nema članova.**), pa se raspored gradi iz teksta kakav već jest.
     Prvi odjeljak stoji otvoren da se stranica ne otvori prazna. */
  .odlSek { border: 1px solid var(--rub); border-radius: var(--rad-m); background: var(--papir); margin-bottom: 0.75rem; overflow: hidden; }
  .odlSekGlava {
    display: flex; align-items: center; gap: 0.625rem; width: 100%; cursor: pointer;
    padding: 0.875rem 1rem; font: inherit; font-weight: 700; color: var(--ink);
    background: none; border: 0; text-align: left; line-height: 1.4;
  }
  .odlSekGlava:hover { background: var(--tiho); }
  .odlSekGlava .kvaka {
    flex: none; width: 1.5rem; height: 1.5rem; border-radius: 50%; display: grid; place-items: center;
    background: var(--tiho); color: var(--plava); font-size: var(--t-s); font-weight: 800;
    transition: transform .2s ease, background .2s;
  }
  .odlSek.otvoren > .odlSekGlava .kvaka { transform: rotate(90deg); background: var(--plava); color: #fff; }
  .odlSekTijelo { display: none; padding: 0 1rem 0.875rem; }
  .odlSek.otvoren > .odlSekTijelo { display: block; animation: odlOtvor .22s ease; }
  @keyframes odlOtvor { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  /* naslov odjeljka već nosi najavu, pa je unutra ne ponavljamo */
  .odlSekTijelo .odlomak .vodilja { display: none; }
  .odlSekTijelo .odlomak:last-of-type { margin-bottom: 0; }
  .odlSekTijelo .tabObjasnjenje:last-child { margin-bottom: 0.25rem; }

  /* ---- praznina u rečenici: "[je]" u md-u ----
     Bodovi na stranici objašnjenja ne smiju se dobiti pukim listanjem. Polje je
     dio rečenice, ne zaseban zadatak: široko točno koliko je riječ duga i bez
     okvira koji bi ga izdvojio iz odlomka. */
  .praznina {
    display: inline-block; font: inherit; font-weight: 700; color: var(--plava);
    text-align: center; padding: 0.0625rem 0.375rem; margin: 0 0.125rem;
    border: 0; border-bottom: 2px dashed var(--plava); background: rgba(154,91,82,.06);
    border-radius: var(--rad-xs); vertical-align: baseline;
  }
  .praznina:focus { outline: none; border-bottom-style: solid; background: rgba(154,91,82,.12); }
  .praznina.tocno { color: var(--zelena); border-bottom-color: var(--zelena); border-bottom-style: solid; background: rgba(47,109,79,.1); }
  .praznina.krivo { color: var(--crvena); border-bottom-color: var(--crvena); background: rgba(194,65,60,.1); animation: trese .3s; }
  .praznina:disabled { cursor: default; }
  .prazninaTrag { color: var(--zelena); font-weight: 700; }
  /* podnožje stranice objašnjenja: koliko je praznina popunjeno */
  .odlBrojac {
    display: flex; align-items: center; gap: 0.5rem; justify-content: center;
    font-size: var(--t-s); color: var(--muted); margin: 1rem 0 0.25rem;
  }
  .odlBrojac strong { color: var(--ink); }

  /* ---- poziv na slušanje ----
     Zvuk je jedini dio tečaja koji polaznik mora sam pokrenuti, pa ga vježba
     mora tražiti naglas, a ne čekati da se sjeti. */
  .slusajSavjet {
    display: flex; align-items: center; gap: 0.625rem; justify-content: center;
    margin-bottom: 0.875rem; padding: 0.625rem 0.875rem; border-radius: var(--rad-m);
    background: rgba(154,91,82,.07); color: var(--plava);
    font-size: var(--t-s); font-weight: 600; line-height: 1.4; text-align: left;
  }
  .slusajSavjet .ikn { flex: none; }
  .prijevodGumb {
    display: inline-block; margin-left: 0.5rem; padding: 0 0.375rem; font-size: var(--t-xs); font-weight: 700;
    color: var(--muted); border: 1px solid var(--rub); border-radius: var(--rad-s); cursor: pointer;
    user-select: none; vertical-align: middle; line-height: 1.5;
  }
  .prijevodGumb:hover { border-color: var(--plava); color: var(--plava); }
  /* ---- ikone sucelja ----
     Velicina je u em-ovima da ikona prati tekst uz koji stoji: isti element radi
     i u recku od 0.75rem i u lebdecoj tipki od 3.5rem, bez posebnih pravila. */
  .ikn {
    width: 1.15em; height: 1.15em; flex: none; display: inline-block;
    vertical-align: -0.2em; fill: none; stroke: currentColor;
    stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round;
  }
  .ikn.uz { margin-right: 0.4em; }
  .ikn.krupna { width: 1em; height: 1em; stroke-width: 1.25; vertical-align: 0; }

  .zvucnik {
    font-size: .85em; opacity: .45; cursor: pointer; margin-left: 0.375rem;
    user-select: none; vertical-align: middle; display: inline-block;
    transition: opacity .15s, transform .15s;
  }
  .zvucnik:hover { opacity: 1; transform: scale(1.15); }
  /* Klik na ikonu mora pogoditi sam .zvucnik, a ne <svg>/<use> u njemu. */
  .zvucnik .ikn, .zvucnik svg, .zvucnik svg * { pointer-events: none; }
  /* ---- zvučnik se mora primijetiti ----
     .svira   — traje koliko i snimka: ikona se puni bojom i pulsira, pa se vidi
                da je klik prošao i da se baš to sada čuje.
     .zovi    — zvučnik koji u ovoj vježbi još nitko nije dotaknuo. Val se vrti
                triput i stane; ikona koja pulsira bez kraja postaje pozadina. */
  .zvucnik.svira { opacity: 1; color: var(--plava); animation: zvKuca .5s ease infinite; }
  @keyframes zvKuca { 0%, 100% { transform: scale(1); } 45% { transform: scale(1.22); } }
  .zvucnik.zovi { opacity: .8; position: relative; }
  .zvucnik.zovi::after {
    content: ''; position: absolute; inset: -0.25em; border-radius: 50%;
    border: 2px solid var(--plava); animation: zvVal 1.5s ease-out 3;
  }
  @keyframes zvVal { 0% { transform: scale(.7); opacity: .75; } 100% { transform: scale(1.75); opacity: 0; } }
  @keyframes trese { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  @media (prefers-reduced-motion: reduce) {
    .zvucnik.svira, .zvucnik.zovi::after, .praznina.krivo { animation: none; }
    .zvucnik.svira { transform: scale(1.15); }
  }
  .prijevodGumb.aktivan { background: var(--plava); border-color: var(--plava); color: #fff; }
  .prijevodTekst { display: block; color: var(--muted); font-style: italic; font-size: var(--t-m); }
  .prijevodZadatak { text-align: center; color: var(--muted); font-style: italic; margin-bottom: 0.75rem; }
  .mrezaVok { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.625rem; margin-bottom: 0.375rem; }
  /* ---- kartice za okretanje (Vocabulary / Lesson "kartice") ----
     Lice: engleski. Nalicje: slika, hrvatska riječ, zvučnik i "+" za rječnik.
     Oba lica stoje u istoj ćeliji grida, pa je kartica visoka koliko viši od njih
     i ništa ne skače pri okretanju. */
  /* Karta je u omjeru prave igraće karte (5:7). Veličine unutra idu u cqi, pa
     slika, riječ i gumbi ostaju u istom omjeru na svakoj širini stupca.
     Pismo je uvijek ono odabrano u Options (--tekst), i na gumbima. */
  .kartaVok { cursor: pointer; perspective: 900px; text-align: center; -webkit-tap-highlight-color: transparent;
    container-type: inline-size; font-family: var(--tekst); }
  .kartaVok .okret { display: grid; transition: transform .5s cubic-bezier(.3,.1,.25,1); transform-style: preserve-3d;
    aspect-ratio: 5 / 7; }
  .kartaVok.okrenuta .okret { transform: rotateY(180deg); }
  .kartaVok .lice { grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 6cqi; overflow: hidden; min-width: 0; min-height: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 3px 10px rgba(0,0,0,.06); transition: box-shadow .15s; }
  .kartaVok:hover .lice, .kartaVok:focus-visible .lice { box-shadow: 0 0 0 2px var(--plava), 0 4px 14px rgba(0,0,0,.1); }
  .kartaVok:focus-visible { outline: none; }

  /* Lice (engleski) = poleđina igraće karte: puna boja teme, tanak unutarnji
     okvir, mreža rombova i u sredini svijetla pločica s riječju. */
  .kartaVok .lice.prednje { background: var(--plava); padding: 5cqi; }
  .kartaVok .okvirKarte {
    position: relative; width: 100%; height: 100%; border-radius: 3.5cqi;
    border: max(1px, 0.8cqi) solid rgba(255,255,255,.55);
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.13) 0 max(1px, .6cqi), transparent 0 11cqi),
      repeating-linear-gradient(-45deg, rgba(255,255,255,.13) 0 max(1px, .6cqi), transparent 0 11cqi);
    display: flex; align-items: center; justify-content: center; padding: 6cqi;
  }
  .kartaVok .kartus {
    background: #fff; border-radius: 3cqi; padding: 7cqi 6cqi; width: 100%;
    box-shadow: 0 0 0 max(1px, .8cqi) var(--plava), 0 0 0 max(2px, 1.6cqi) rgba(255,255,255,.55);
  }
  .kartaVok .en { font-size: clamp(0.8rem, 10cqi, 1.35rem); font-weight: 700; color: var(--ink);
    line-height: 1.2; overflow-wrap: anywhere; }
  .kartaVok .okreniNat { font-size: clamp(0.62rem, 6cqi, 0.75rem); color: var(--muted); margin-top: 3cqi; letter-spacing: .04em; }

  /* Naličje (hrvatski): bijelo, slika zauzima veći dio karte, riječ ispod. */
  .kartaVok .lice.nalicje { transform: rotateY(180deg); position: relative; background: #fff;
    border: 1px solid var(--rub); justify-content: flex-start; padding: 6cqi 6cqi 5cqi; }
  .kartaVok .slikaKarte { flex: 1 1 auto; width: 100%; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .kartaVok .slikaKarte img { width: 100%; height: 100%; object-fit: contain; margin: 0; max-height: none; border-radius: 0; }
  .kartaVok .slikaKarte.bezSlike { background: var(--tiho); border-radius: 4cqi;
    font-size: 34cqi; font-weight: 700; color: var(--rub); }
  .kartaVok .hr { flex: none; width: 100%; padding-top: 4cqi; font-size: clamp(0.95rem, 12cqi, 1.75rem);
    font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; color: var(--ink); }
  .kartaVok .kutGumbi { position: absolute; top: 4cqi; right: 4cqi; display: flex; flex-direction: column; gap: 2.5cqi; z-index: 2; }
  .kartaVok .kutGumb { width: clamp(1.75rem, 17cqi, 2.25rem); height: clamp(1.75rem, 17cqi, 2.25rem); border-radius: 50%;
    border: 1px solid var(--rub); background: rgba(255,255,255,.92); box-shadow: 0 1px 3px rgba(0,0,0,.1);
    color: var(--muted); display: inline-flex; align-items: center; justify-content: center; padding: 0; margin: 0;
    font-family: inherit; font-size: clamp(1rem, 10cqi, 1.2rem); font-weight: 400; line-height: 1; cursor: pointer; opacity: 1;
    transition: border-color .15s, color .15s, transform .15s; }
  .kartaVok .kutGumb:hover { border-color: var(--plava); color: var(--plava); transform: none; }

     sve niže i uže nego inače, u jednom redu. Test riječi se sklanja (nije sito

     Traka se tada vadi iz toka (position: fixed) i na njezino mjesto ostaje

  /* ---- Dictionary na mobitelu: zasebna mala traka ----
     Na uskom ekranu puni alat NE putuje u traku — ostaje u toku i odlazi gore

     opseg) koja se pojavljuje čim prva riječ prođe vrh ekrana i postupno
     dobiva neprozirnost kroz idućih par riječi; na putu gore jednako se gasi
     i nestaje prije nego se prva riječ vrati, pa nas na vrhu dočeka puni alat.
     Neprozirnost računa dictMobFade() izravno iz pomaka — nema CSS prijelaza. */
  .dictMobTraka { display: none; }
  @media (max-width: 639.98px) {
    .dictMobTraka {
      display: flex; position: fixed; top: var(--dictVrh, 0px); left: 1rem; z-index: 6;
      margin: 0; flex-wrap: nowrap; gap: 0.3rem; padding: 0.25rem 0;
      background: var(--bg); box-shadow: 0 1px 0 var(--rub);
      opacity: 0; visibility: hidden; pointer-events: none; transition: none;
    }
    .dictMobTraka[hidden] { display: none; }
    .dictMobTraka .rjecnikTraka { flex: 1 1 4rem; }
    .dictMobTraka .rjecnikTraka input {
      padding: 0.25rem 0.6rem 0.25rem 1.9rem; font-size: var(--t-s); min-height: 2rem;
    }
    .dictMobTraka .rjecnikTraka .ikTrazi { left: 0.6rem; width: 0.9em; height: 0.9em; }
    .dictMobTraka .smjerG {
      flex: 0 0 auto; white-space: nowrap; gap: 0.25rem;
      padding: 0.15rem 0.4rem; font-size: var(--t-xs); min-height: 2rem;
    }
    .dictMobTraka .segment { margin-left: auto; flex: 0 0 auto; width: auto; padding: 0.125rem; }
    .dictMobTraka .segment button {
      flex: none; padding: 0.15rem 0.45rem; font-size: var(--t-xs); min-height: 1.75rem;
    }
    .dictMobTraka .segment .segDugo { display: none; }
    .dictMobTraka .segment .segKratko { display: inline; }
  }

  /* ---- Dictionary: abecedna traka uz desni rub popisa ----
     Jedna kontrola, ne dvadeset i šest njih: prst ili miš klize po traci, a
     popis ide za njima. Dodirna meta je CIJELA traka, slova su u njoj samo
     crtež — 26 zasebnih meta od 44px ne stane ni na jedan zaslon. Zato je
     široka onoliko koliko pokazivač traži: 1.75rem pod mišem, 2.25rem pod
     prstom (TRI UREĐAJA), i nikad ne ide uz rub ekrana nego uz rub popisa —
     rub ekrana je zauzet.
     Slovo koje popis nema ostaje blijedo i vodi na najbliže koje ima, pa prst
     nikad ne padne u prazno. Sve ostalo (balon, sjena, zamućenje) je odziv na
     povlačenje, ne ukras: dok se ne vuče, traka je gotovo nevidljiva. */
  .dictTijelo { display: flex; align-items: flex-start; gap: 0.25rem; }
  .dictTijelo > #popisRijeci { flex: 1 1 auto; min-width: 0; }
  .abcTraka {
    flex: 0 0 auto; position: sticky; align-self: flex-start;
    top: calc(var(--dictLjepilo, 7rem) + 0.5rem);
    height: min(30rem, calc(100dvh - var(--dictLjepilo, 7rem) - 3rem));
    min-width: 1.75rem;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: 0.4rem 0.25rem; border-radius: 999px;
    touch-action: none; -webkit-user-select: none; user-select: none; cursor: grab;
    color: var(--muted); font-size: 0.68rem; font-weight: 600; line-height: 1;
    background: transparent; border: 1px solid transparent;
    transition: background .22s ease, border-color .22s ease, color .22s ease;
  }
  .abcTraka[hidden] { display: none; }
  .abcTraka:hover, .abcTraka:focus-visible, .abcTraka.vuce {
    background: var(--tiho); border-color: var(--rub); color: var(--ink);
  }
  @supports (backdrop-filter: blur(1px)) {
    .abcTraka:hover, .abcTraka:focus-visible, .abcTraka.vuce {
      background: color-mix(in oklab, var(--card) 78%, transparent);
      backdrop-filter: blur(10px) saturate(1.2);
    }
  }
  .abcTraka:focus-visible { outline: 2px solid var(--plava); outline-offset: 2px; }
  .abcTraka.vuce { cursor: grabbing; }
  .abcS {
    display: block; transition: color .15s ease, transform .15s cubic-bezier(.32,.72,0,1);
    transform-origin: right center;
  }
  .abcS.nema { opacity: 0.3; }
  .abcS.tren { color: var(--plava); transform: scale(1.45); }
  /* Balon prati prst, ali ga ne dira: stoji lijevo od trake, na visini dodira. */
  .abcBalon {
    position: fixed; top: 0; right: 3.5rem; z-index: 40; pointer-events: none;
    display: grid; place-items: center; min-width: 3.5rem; min-height: 3.5rem;
    padding: 0 0.5rem; border-radius: 1.25rem;
    font-family: var(--naslov); font-size: var(--t-2xl); font-weight: 600; color: var(--ink);
    background: var(--card); border: 1px solid var(--rub);
    box-shadow: 0 0.75rem 2rem rgba(0, 0, 0, 0.16);
    opacity: 0; transform: translateY(-50%) scale(0.88);
    transition: opacity .18s ease, transform .18s cubic-bezier(.32,.72,0,1);
  }
  @supports (backdrop-filter: blur(1px)) {
    .abcBalon { background: color-mix(in oklab, var(--card) 86%, transparent); backdrop-filter: blur(14px) saturate(1.3); }
  }
  .abcBalon.vidi { opacity: 1; transform: translateY(-50%) scale(1); }
  /* Kartica na koju se skoči ne smije završiti pod zaglavljem ni pod alatom.
     --dictLjepilo je koliko ekrana odozgo pokriva ono što je zalijepljeno
     (zaglavlje + zbijena traka); mjeri ga dictLjepilo(). */
  .dictOkvir .rijecKart { scroll-margin-top: calc(var(--dictLjepilo, 7rem) + 0.5rem); }
  @media (prefers-reduced-motion: reduce) {
    .abcTraka, .abcS, .abcBalon { transition: none; }
  }
  /* Mobitel: traka NE ide uz rub ekrana — ondje već stoje lebdeće ikone. Stoji
     uz rub popisa, unutar stupca, i uzima samo onoliko koliko prst treba da ne
     promaši (2.25rem), a popisu ostaje sve ostalo. Malo je vidljivija nego na
     računalu jer se ondje nema što nadnijeti mišem da se otkrije. */
  @media (max-width: 639.98px) {
    .abcTraka {
      min-width: 2.25rem; font-size: 0.6rem; padding: 0.5rem 0.2rem;
      background: var(--tiho); border-color: transparent;
    }
    .abcBalon { right: 3.5rem; min-width: 3.25rem; min-height: 3.25rem; font-size: var(--t-xl); }
  }
  /* Tablet: prst je isti kao na mobitelu, prostora ima kao na računalu — traka
     je nešto šira i s vidljivim rubom, jer se ni ovdje ne lebdi mišem. */
  @media (min-width: 640px) and (max-width: 1023.98px) {
    .abcTraka {
      min-width: 2rem; font-size: 0.68rem;
      border-color: var(--rub); background: var(--tiho);
    }
  }

  .rjecnikTraka { display: flex; gap: 0.625rem; margin-bottom: 1rem; }
  .rjecnikTraka input { flex: 1; min-width: 0; padding: 0.625rem 0.875rem; border: 1px solid var(--rub); border-radius: var(--rad-m); font-size: var(--t-l); }
  .rijecKart { background: var(--card); border: 1px solid var(--rub); border-radius: var(--rad-m); margin-bottom: 0.375rem; }
  .rijecKart.imaDet .rijecRed { cursor: pointer; }
  .rijecKart.imaDet:hover { border-color: var(--plava); }
  .rijecRed { padding: 0.625rem 1rem; display: flex; justify-content: space-between; gap: 0.625rem; font-size: var(--t-l); flex-wrap: wrap; align-items: center; }
  .rijecRed .hrR { font-weight: 600; }
  .rijecRed .enR { color: var(--muted); }
  .rijecRed .izvorR { color: var(--muted); font-size: var(--t-xs); }
  .strelicaDet { color: var(--muted); font-size: var(--t-xs); margin-left: 0.375rem; display: inline-block; transition: transform .15s; }
  .rijecKart.otvoren .strelicaDet { transform: rotate(180deg); }
  .rijecDetalj { display: none; padding: 0.125rem 1rem 0.75rem; border-top: 1px dashed var(--rub); margin-top: -0.125rem; font-size: var(--t-m); }
  .rijecKart.otvoren .rijecDetalj { display: block; }
  .detRed { display: flex; gap: 0.625rem; padding: 0.375rem 0; flex-wrap: wrap; }
  .detRed .oznaka { color: var(--muted); font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .04em; min-width: 6rem; padding-top: 0.125rem; }
  /* Lekcija iz koje je riječ dodana: na mobitelu i tabletu stoji u retku (.izvorR),
     na računalu tek u otvorenim detaljima (TRI UREĐAJA). Kartica kojoj je izvor
     jedini detalj (.samoIzvor) zato se izvan računala ne otvara. */
  .detRed.izvorDet { display: none; }
  .rijecKart.samoIzvor .strelicaDet, .rijecKart.samoIzvor .rijecDetalj { display: none; }
  .izgovorR { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; color: var(--plava); }
  /* rod/broj = metapodatak, ne dio natuknice */
  .rodR {
    display: inline-block; margin-left: 0.375rem; padding: 0.125rem 0.375rem; border-radius: var(--rad-s);
    background: var(--bg); border: 1px solid var(--rub);
    color: var(--muted); font-size: var(--t-xs); font-weight: 600; font-style: italic; vertical-align: middle;
  }
  /* slika se vidi tek kad se kartica otvori — u popisu bi bila presitna */
  .slikaDet { max-width: 11.875rem; max-height: 11.875rem; width: auto; height: auto;
    object-fit: contain; border-radius: var(--rad-m); background: var(--bg); border: 1px solid var(--rub); padding: 0.25rem; }
  .rjPrazno { padding: 1.25rem 0.375rem; color: var(--muted); font-size: var(--t-m); text-align: center; }

  .dcRed { background: var(--card); border: 1px solid var(--rub); border-radius: var(--rad-m); padding: 0.875rem 1.25rem; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .dcRed:hover { border-color: var(--plava); }

  .dcDatum { color: var(--muted); font-size: var(--t-s); margin: 0 0 0.375rem 0.125rem; letter-spacing: .02em; }
  .dcNapomena { color: var(--muted); font-size: var(--t-s); margin: 0.5rem 0 0 0.125rem; }
  .streakK { display: flex; align-items: center; gap: 1rem; background: var(--card); border: 1px solid var(--rub); border-radius: var(--rad-m); padding: 0.875rem 1.25rem; margin-bottom: 1.25rem; }
  .streakBroj { font-size: var(--t-4xl); font-weight: 700; white-space: nowrap; }
  .streakOpis { font-size: var(--t-s); color: var(--muted); line-height: 1.45; }
  .streakOpis strong { color: var(--ink); font-size: var(--t-l); }

  .dropzona {
    border: 2px dashed var(--rub); border-radius: var(--rad-l); padding: 2rem; text-align: center;
    color: var(--muted); margin: 0.875rem 0; transition: border-color .15s, background .15s;
  }
  .dropzona.aktivno { border-color: var(--plava); background: #f7f1ef; }
  .valutaKartice { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.625rem; margin: 1rem 0; }
  .valutaK { background: var(--card); border: 1px solid var(--rub); border-radius: var(--rad-m); padding: 1rem; text-align: center; }
  .valutaK .broj { font-size: var(--t-3xl); font-weight: 700; color: var(--plava); font-family: var(--naslov); }
  .valutaK:nth-child(2) .broj { color: var(--plavaVok); }

  .valutaK .imeV { font-size: var(--t-s); color: var(--muted); }
  .zakljBanner { text-align: center; color: var(--muted); padding: 2.5rem 0; }
  h1.sekcija { font-size: var(--t-3xl); margin-bottom: 1rem; font-family: var(--naslov);
    font-weight: 600; letter-spacing: -.025em; }
  .traka h2, .sazetak h2, .testUvod h2, .otkljModal h2,
  .miniKart .ime, .velikaPlocica .ime { font-family: var(--naslov); letter-spacing: -.01em; }
  .prsten .pct, .valutaK .broj, .streakBroj, .sazetak .velikiBroj,
  .testSat, .miniKart .broj { font-family: var(--naslov); }

  /* --- nagrade i otključavanja --- */

  /* ============ LESSON 0 — mehanike, traka abecede, lebdeći rječnik ============ */

  /* -- spajanje -- */
  /* minmax(0,1fr), ne 1fr: stupac s duzom rijeci u celiji inace ne moze pasti
     ispod sirine te rijeci i mreza se prelije preko ruba ekrana. */
  .mrezaSpoj { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.75rem; }
  .poljeSpoj {
    background: var(--card); border: 2px solid var(--rub); border-radius: var(--rad-l);

  }
  .poljeSpoj img { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; pointer-events: none; }
  .poljeSpoj.odabran { border-color: var(--plava); transform: translateY(-2px); }
  .poljeSpoj.rijesen { border-color: var(--zelena); }
  .poljeSpoj .natpis { font-weight: 700; font-size: var(--t-l); color: var(--zelena); margin-top: 0.125rem; min-height: 1.25em; }
  .cipovi { display: flex; flex-wrap: wrap; gap: 0.625rem; justify-content: center; margin-top: 1.25rem; }
  .cipSpoj {
    background: var(--card); border: 2px solid var(--rub); border-radius: 999px;

  }

  .tresi { animation: tresiL0 .32s; }

  /* -- baloni -- */

    border: 1px solid var(--rub); border-radius: var(--rad-l); overflow: hidden; }

  /* -- slova (anagram s digrafima) -- */
  .slagaliste { display: flex; gap: 0.375rem; justify-content: center; margin: 0.875rem 0; min-height: 3.5rem; flex-wrap: wrap; }
  /* ime mora ostati specifično: "prazno" je zauzeto za td.faza.prazno u mreži Lessons */

  .plocica { min-width: 3rem; height: 3.5rem; padding: 0 0.625rem; border-radius: var(--rad-m); background: var(--card);
    border: 2px solid var(--rub); font-size: var(--t-2xl); font-weight: 700; cursor: pointer;

  .bljesak img { width: 7.875rem; height: 7.875rem; object-fit: contain; }
  /* ---- najavljeno nestajanje (pamti) ----
     Slike su prije nestajale bez upozorenja, pa se pola vremena gledalo u prazno
     mjesto gdje su bile. Sada se odbrojava naglas, a i sam nestanak traje: oko
