  }

  // ---- mini igre: jedna igra u okviru ----
  var miniOsvjezavanje = null;
  function renderMiniIgra(id) {
    var g = miniPoId(id);
    if (!g) { renderMini(); return; }
    if (imaPristup('MiniGame', 0) !== 'ok') { renderMini(); return; }
    // Must seed from the server BEFORE the iframe is created — otherwise the game reads an
    // empty score and overwrites the real value with zero (progress.mini_igre was already
    // fetched into PROGRESS at login, so this is a synchronous, in-memory seed).
    if (PROGRESS.mini_igre && PROGRESS.mini_igre[g.id]) {
      try { localStorage.setItem('croland-mini-' + g.id, JSON.stringify(PROGRESS.mini_igre[g.id])); } catch (e) {}
    }
    VIEW.innerHTML =
      '<div class="miniOkvir">' +
      '<div class="alat">' +
      '<span class="nas">' + g.emo + ' ' + esc(g.ime) + '</span>' +
      '<button class="gumbSitni" onclick="idi(\'mini\')">← All games</button>' +
      '<button class="gumbSitni" onclick="miniPonovno()">↻ Restart</button>' +
      '<button class="gumbSitni" onclick="miniNoviTab(\'' + g.id + '\')">↗ Open in new tab</button>' +
      '</div>' +
      '<iframe id="miniOkno" src="' + MINI_MAPA + g.dat + '" title="' + esc(g.ime) + '"></iframe>' +
      '</div>';
    // Igra piše bodove u localStorage; zaglavlje se osvježava dok se igra, a promjena se
    // gura na server — samo kad se stvarno promijeni, ne na svaki otkucaj.
    miniSatStop();
    var zadnje = miniBodovi();
    var zadnjeSirovo = null;
    try { zadnjeSirovo = localStorage.getItem('croland-mini-' + g.id) || ''; } catch (e) {}
    miniOsvjezavanje = setInterval(function () {
      if (!$('miniOkno')) { miniSatStop(); return; }
      var sirovo = null;
      try { sirovo = localStorage.getItem('croland-mini-' + g.id) || ''; } catch (e) {}
      if (sirovo !== zadnjeSirovo) {
        zadnjeSirovo = sirovo;
        if (!PROGRESS.mini_igre) PROGRESS.mini_igre = {};
        try { PROGRESS.mini_igre[g.id] = sirovo ? JSON.parse(sirovo) : {}; } catch (e) { PROGRESS.mini_igre[g.id] = {}; }
        spremiProgress();
      }
      var sad = miniBodovi();
      if (sad === zadnje) return;
      zadnje = sad;
      osvjeziHeader();
      var nova = noveOtkljucane();
      if (nova.length) prikaziOtkljucanje(nova);
    }, 2000);
  }
  function miniSatStop() {
    if (miniOsvjezavanje) { clearInterval(miniOsvjezavanje); miniOsvjezavanje = null; }
  }
  function miniPonovno() {
    var f = $('miniOkno');
    if (f) f.src = f.src;
  }
  function miniNoviTab(id) {
    var g = miniPoId(id);
    if (g) window.open(MINI_MAPA + g.dat, '_blank');
  }
  window.miniPonovno = miniPonovno;
  window.miniNoviTab = miniNoviTab;

  function plocicaNulaHtml() {
    if (!postojiL0()) return '';
    var got = zavrsenaL0();
    var o = otkljucanaSlova(), imaSlova = 0;
    ABECEDA.forEach(function (s) { if (o[s]) imaSlova++; });
    var sve = (imaSlova >= ABECEDA.length);
    return '<div class="redNula"><div class="plocicaNula' + (sve || got ? ' gotovo' : '') + '" ' +
      'onclick="idi(\'unit\',\'' + L0_TIP + '\',' + L0_RAZINA + ')">' +
      '<div class="imeF">' + (sve ? '✓' : '✨') + ' Lesson 0 — Welcome to Croatian</div>' +
      '<div class="bod">' + (sve
        ? 'the whole alphabet is yours · replay any time'
        : (imaSlova ? imaSlova + ' of 30 letters unlocked' : 'free intro, no account, about 5 minutes')) +
      '</div></div></div>';
  }

  // Prva razina u kojoj nešto još nije otključano. Iza nje se prikazuju samo tri
  // retka — dvadeset redaka zaključanih ćelija ne čita se kao napredak.
  function prvaZakljucanaRazina() {
    for (var r = 1; r <= MAX_RAZINA; r++) {
      for (var t = 0; t < TIPOVI.length; t++) {
        if (igreCjeline(TIPOVI[t], r).length > 0 && !otkljucano(TIPOVI[t], r)) return r;
      }
    }
    return MAX_RAZINA;
  }

  var sveRazine = false;   // "Show all levels" prekidač, pamti se dok traje sesija
  function prekloputiRazine() { sveRazine = !sveRazine; renderLessons(); }
  window.prekloputiRazine = prekloputiRazine;

  function renderLessons() {
    var vv = valute();
    var prvaZ = prvaZakljucanaRazina();
    var granica = sveRazine ? MAX_RAZINA : Math.min(MAX_RAZINA, prvaZ + 3);
    var html = '<h1 class="sekcija">Lessons</h1>' + plocicaNulaHtml() + '<div class="mrezaOkvir"><table class="mreza"><tbody>';
    var trake = [];   // trake se pune tek nakon umetanja u DOM, da se animiraju
    for (var r = 1; r <= granica; r++) {
      // blaga izmaglica na tri retka iza prve nedostupne razine
      var dalek = (!sveRazine && r > prvaZ) ? ' class="dalek' + (r - prvaZ) + '"' : '';
      html += '<tr' + dalek + '>';
      for (var t = 0; t < TIPOVI.length; t++) {
        var tip = TIPOVI[t];
        var igre = igreCjeline(tip, r);
        if (igre.length === 0) {
          html += '<td class="faza prazno">' + tip + ' ' + r + '<div class="bodM">coming soon</div></td>';
          continue;
        }
        var maks = maksCjeline(tip, r), osv = osvojenoCjeline(tip, r);
        var otklj = otkljucano(tip, r);
        var pun = (maks > 0 && osv >= maks);
        // point-unlocked but behind the subscription wall — distinct label, still clickable
        // (the click hits the idi() gate, which explains why and offers to subscribe)
        var trebaPretplatu = otklj && r >= 2 && imaPristup(tip, r) === 'needsSubscription';
        var klase = 'faza' + (otklj ? '' : ' zakljucano') + (pun ? ' gotovo' : '') + (trebaPretplatu ? ' pretplata' : '');
        var pct, opis, redak, naslovA;
        if (trebaPretplatu) {
          pct = maks > 0 ? Math.min(1, osv / maks) : 0;
          redak = '<div class="bodM">🔒 Croland Plus</div>' +
            '<div class="ostalo">' + osv + '/' + maks + ' pts waiting</div>';
          naslovA = tip + ' ' + r + ' needs an active Croland Plus subscription';
        } else if (otklj) {
          pct = maks > 0 ? Math.min(1, osv / maks) : 0;
          redak = '<div class="bodM"><strong>' + osv + '</strong>/' + maks + ' pts</div>' +
            '<div class="ostalo">' + (pun ? '✓ complete' : '+' + (maks - osv) + ' to win') + '</div>';
          naslovA = tip + ' ' + r + ' — ' + osv + ' of ' + maks + ' points earned' +
            (pun ? '' : ', ' + (maks - osv) + ' still available');
        } else {
          var val = VALUTA_TIPA[tip];
          var p = val ? prag(tip, r) : 0;
          var ima = val ? vv[val] : 0;
          pct = (val && p > 0) ? Math.min(1, ima / p) : 0;
          redak = '<div class="bodM">🔒 ' + (val ? ima + '/' + p + ' ' + val : 'locked') + '</div>' +
            '<div class="ostalo">' + (val ? (Math.max(0, p - ima) + ' ' + val + ' to go') : 'unlock this row') + '</div>';
          naslovA = val
            ? ('Locked — needs ' + p + ' ' + val + ', you have ' + ima + ' (' + maks + ' points waiting inside)')
            : 'Locked';
        }
        var id = 'trF' + r + '_' + t;
        trake.push({ id: id, pct: pct });
        html += '<td class="' + klase + '" title="' + esc(naslovA) + '" ' +
          (otklj ? 'onclick="idi(\'unit\',\'' + tip + '\',' + r + ')"' : '') + '>' +
          '<div class="imeF">' + tip + ' ' + r + '</div>' +
          '<div class="tr"><i id="' + id + '"></i></div>' +
          redak + '</td>';
      }
      html += '</tr>';
    }
    html += '</tbody></table></div>';
    if (granica < MAX_RAZINA) {
      html += '<button class="viseRazina" onclick="prekloputiRazine()">Show all ' + MAX_RAZINA +
        ' levels ▾ <span style="opacity:.7">(' + (MAX_RAZINA - granica) + ' more, still far off)</span></button>';
    } else if (sveRazine && MAX_RAZINA > prvaZ + 3) {
      html += '<button class="viseRazina" onclick="prekloputiRazine()">Show less ▴</button>';
    }
    VIEW.innerHTML = html;
    animirajTrake(trake);
  }

  // trake krenu s nule i naraste u sljedećem kadru — bez toga nema prijelaza
  function animirajTrake(popis) {
    if (!popis || !popis.length) return;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        popis.forEach(function (x) {
          var el = document.getElementById(x.id);
          if (el) el.style.width = Math.round(x.pct * 100) + '%';
        });
      });
    });
  }

  // ---- navigacija između vježbi unutar cjeline ----
  function navigacijaVjezbi(tip, razina, indeks, igre) {
    if (igre.length <= 1) return '';
    var html = '<div class="vjezbeNav">';
    var trake = [];
    igre.forEach(function (g, i) {
      var osv = najbolji(g);
      var zavr = g.bodovi > 0 && osv >= g.bodovi;
      var djelom = osv > 0 && !zavr;
      var klase = 'vnav' + (i === indeks ? ' aktivna' : '') + (zavr ? ' zavrsena' : (djelom ? ' djelom' : ''));
      var naslov = (g.stranica ? g.stranica + '. ' : '') + (g.naslov || ('Exercise ' + (i + 1))) +
        ' — ' + osv + '/' + g.bodovi + ' pts';
      var id = 'vt' + razina + '_' + i;
      trake.push({ id: id, pct: g.bodovi > 0 ? Math.min(1, osv / g.bodovi) : 0 });
      html += '<button class="' + klase + '" title="' + naslov.replace(/"/g, '&quot;') + '" ' +
        'onclick="idi(\'unit\',\'' + tip + '\',' + razina + ',' + i + ')">' +
        '<span>' + (i + 1) + (zavr ? ' ✓' : '') + '</span>' +
        '<span class="vtr"><i id="' + id + '"></i></span>' +
        '</button>';
    });
    // završna stranica je dio lekcije, ne nešto iza nje — stoji u istoj traci
    var uk = maksCjeline(tip, razina), sad = osvojenoCjeline(tip, razina);
    var sviPuni = (uk > 0 && sad >= uk);
    var idF = 'vt' + razina + '_fin';
    trake.push({ id: idF, pct: uk > 0 ? Math.min(1, sad / uk) : 0 });
    html += '<button class="vnav vfin' + (indeks >= igre.length ? ' aktivna' : '') +
      (sviPuni ? ' zavrsena' : '') + '" title="Lesson summary — ' + sad + '/' + uk + ' pts" ' +
      'onclick="idi(\'unit\',\'' + tip + '\',' + razina + ',' + igre.length + ')">' +
      '<span>🏁</span><span class="vtr"><i id="' + idF + '"></i></span></button>';
    html += '</div>';
    navTrakeCekaju = trake;
    return html;
  }
  var navTrakeCekaju = null;

  // ================= TEST =================
  // Test nije cjelina s vježbama koje se biraju — to je jedno sjedenje.
  // Sve vježbe idu jedna za drugom, bez rezultata između, s jednim satom za
  // cijeli test i bez rječnika: riječ koja je potrebna piše u samom zadatku.
  // Pauza zaustavlja sat; napuštanje testa poništava pokušaj.

  function testTrajanje(igre) {
    for (var i = 0; i < igre.length; i++) {
      var t = parseInt(igre[i].meta && igre[i].meta.trajanje, 10);
      if (t > 0) return t;
    }
    return 1200;   // 20 minuta
  }
  function testPrag(igre) {
    for (var i = 0; i < igre.length; i++) {
      var p = parseInt(igre[i].meta && igre[i].meta.prag, 10);
      if (p > 0) return p;
    }
    return 70;
  }
  function mmss(s) {
    s = Math.max(0, s | 0);
    var m = Math.floor(s / 60), r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }
  // gasi sat i zastor; zove se pri svakoj navigaciji izvan testa
  function testPrekini() {
    if (TEST && TEST.tajmer) { clearInterval(TEST.tajmer); TEST.tajmer = null; }
    var z = $('testZastor'); if (z) z.remove();
    TEST = null;
  }

  // ---- 1. uvodni zaslon: pravila prije nego sat krene ----
  function renderTestUvod(razina) {
    var igre = igreCjeline('Test', razina);
    if (!igre.length) { renderLessons(); return; }
    testPrekini();
    trakaVidljiva(false); rjecnikVidljiv(false); slikeVjezbe = false;
    var sek = testTrajanje(igre), maks = 0;
    igre.forEach(function (g) { maks += g.bodovi; });
    var prije = osvojenoCjeline('Test', razina);
    var naslovC = 'Test ' + razina + (igre[0].cjelinaNaslov ? ' — ' + igre[0].cjelinaNaslov : '');
    VIEW.innerHTML =
      '<div class="traka">' +
      '<button class="natrag" onclick="idi(\'lessons\')">‹ Back</button>' +
      '<h2>' + naslovC + '</h2>' +
      '</div>' +
      '<div class="testUvod">' +
      '<h2>Before you start</h2>' +
      '<ul>' +
      '<li><span class="ik">📝</span><span><strong>' + igre.length + ' exercises</strong>, ' + maks + ' points — everything from level ' + razina + '.</span></li>' +
      '<li><span class="ik">⏱</span><span><strong>' + Math.round(sek / 60) + ' minutes</strong> for the whole test. The clock runs across all exercises.</span></li>' +
      '<li><span class="ik">➡️</span><span>One sitting: exercises follow one another and you cannot go back.</span></li>' +
      '<li><span class="ik">🏁</span><span>No scores in between — your result appears only at the end.</span></li>' +
      '<li><span class="ik">⏸</span><span>Pause whenever you like. The clock stops with you.</span></li>' +
      '<li><span class="ik">📖</span><span>No dictionary. Where a word is needed, the English is written into the question.</span></li>' +
      '</ul>' +
      (prije > 0 ? '<div class="testUpozorenje">Your best so far: <strong>' + prije + '</strong>/' + maks + ' points. Only a better result replaces it.</div>' : '') +
      '<button class="gumb" id="btnTestStart">Start the test →</button>' +
      '<div class="testUpozorenje">Leaving before the end means this attempt does not count.</div>' +
      '</div>';
    $('btnTestStart').onclick = function () { testPokreni(razina); };
  }

  // ---- 2. pokretanje ----
  function testPokreni(razina) {
    var igre = igreCjeline('Test', razina);
    if (!igre.length) { renderLessons(); return; }
    oznaciPokrenuto(igre[0].cjelina);
    TEST = {
      razina: razina, igre: igre, i: 0, rez: [],
      preostalo: testTrajanje(igre), prag: testPrag(igre),
      tajmer: null, pauza: false, aktivan: true
    };
    testVjezba();
    testSatPokreni();
  }

  // ---- 3. jedna vježba unutar testa ----
  function testVjezba() {
    if (!uTestu()) return;
    var T = TEST;
    if (T.i >= T.igre.length) { testZavrsi('done'); return; }
    igra = T.igre[T.i];
    slikeVjezbe = false;            // slika bi u testu bila natuknica
    gotovo = false; start = Date.now(); gresakaUVjezbi = 0;
    if (timer) { clearInterval(timer); timer = null; }
    window.scrollTo(0, 0);
    trakaVidljiva(false); rjecnikVidljiv(false);
    VIEW.innerHTML =
      '<div class="traka">' +
      '<button class="natrag" id="btnTestIzlaz">‹ Quit</button>' +
      '<h2>Test ' + T.razina + '</h2>' +
      '<div class="progresBar"><div style="width:' + Math.round(T.i / T.igre.length * 100) + '%"></div></div>' +
      '<span style="font-size:var(--t-s);color:var(--muted)">' + (T.i + 1) + '/' + T.igre.length + '</span>' +
      '<span class="testSat" id="testSat">' + mmss(T.preostalo) + '</span>' +
      '<button class="testPauza" id="btnTestPauza">⏸ Pause</button>' +
      '</div>' +
      '<div id="opisIgre"></div>' +
      '<div id="ploca">' +
      '<div id="statusTraka"><span id="statL"></span><span id="statR"></span></div>' +
      '<div id="sadrzaj"></div>' +
      '<div id="rezultat"><div class="veliki" id="rezNaslov"></div><div id="rezDetalji"></div>' +
      '<button class="gumb" id="btnDalje" style="display:none"></button>' +
      '<button class="gumb gumbSivi" id="btnPonovno" style="display:none"></button></div>' +
      '<div id="kontrole">' +
      '<button class="gumb gumbSivi" id="btnPredaj">⏭ Skip this exercise</button>' +
      '</div></div>';
    $('opisIgre').textContent = (igra.naslov ? igra.naslov + (igra.meta && igra.meta.opis ? ' — ' : '') : '') +
      ((igra.meta && igra.meta.opis) ? igra.meta.opis : '');
    $('btnTestIzlaz').onclick = function () {
      potvrdi('Quit the test?',
        'The test is graded in one sitting. If you leave now, this attempt does not count and nothing is recorded.',
        function () { testPrekini(); idi('lessons'); });
    };
    $('btnTestPauza').onclick = testPauziraj;
    $('btnPredaj').onclick = function () {
      if (gotovo) return;
      potvrdi('Skip this exercise?',
        'It is scored with whatever you have answered so far, and the test moves on. You cannot come back to it.',
        function () {
          if (gotovo || !uTestu()) return;
          var p = predaja ? predaja() : { s: 'skipped', pct: 0 };
          kraj(p.s, p.pct);
        });
    };
    onZavrsi = function () {};
    predaja = null;
    var pokreni = FORMATI[igra.format];
    if (pokreni) pokreni();
    else { $('sadrzaj').textContent = 'Unknown format: ' + igra.format; testKrajVjezbe('unknown format', 0); }
  }

  // ---- 4. sat cijelog testa ----
  function testSatPokreni() {
    if (!uTestu()) return;
    if (TEST.tajmer) { clearInterval(TEST.tajmer); TEST.tajmer = null; }
    testSatOsvjezi();
    TEST.tajmer = setInterval(function () {
      if (!uTestu()) return;
      if (TEST.pauza) return;
      TEST.preostalo--;
      testSatOsvjezi();
      if (TEST.preostalo <= 0) testZavrsi('time');
    }, 1000);
  }
  function testSatOsvjezi() {
    var el = $('testSat'); if (!el || !TEST) return;
    el.textContent = (TEST.pauza ? '⏸ ' : '⏱ ') + mmss(TEST.preostalo);
    el.classList.toggle('zadnjaMinuta', TEST.preostalo <= 60);
  }

  // ---- 5. pauza ----
  function testPauziraj() {
    if (!uTestu() || TEST.pauza) return;
    TEST.pauza = true;
    testSatOsvjezi();
    var z = document.createElement('div');
    z.className = 'testZastor'; z.id = 'testZastor';
    z.innerHTML =
      '<div class="naslovP">⏸ Paused</div>' +
      '<div class="podP">The clock is stopped. <strong>' + mmss(TEST.preostalo) + '</strong> left when you come back.</div>' +
      '<button class="gumb" id="btnTestNastavi">▶ Resume</button>';
    document.body.appendChild(z);
    $('btnTestNastavi').onclick = testNastavi;
  }
  function testNastavi() {
    var z = $('testZastor'); if (z) z.remove();
    if (!TEST) return;
    TEST.pauza = false;
    testSatOsvjezi();
  }

  // ---- 6. kraj jedne vježbe: rezultat se sprema, ne pokazuje ----
  function testKrajVjezbe(sazetak, pct) {
    gotovo = true;
    if (timer) { clearInterval(timer); timer = null; }
    var T = TEST; if (!T) return;
    pct = Math.max(0, Math.min(1, pct || 0));
    T.rez.push({ igra: igra, sazetak: sazetak, pct: pct, osvojeno: Math.round(igra.bodovi * pct) });
    T.i++;
    var kk = $('kontrole'); if (kk) kk.style.display = 'none';
    var rez = $('rezultat');
    if (rez) {
      var zadnja = (T.i >= T.igre.length);
      $('rezNaslov').textContent = zadnja ? 'Finishing…' : 'Next exercise →';
      $('rezDetalji').textContent = zadnja
        ? 'Adding up your result.'
        : 'Exercise ' + (T.i + 1) + ' of ' + T.igre.length + ' · your score comes at the end';
      rez.style.display = 'block';
      rez.classList.remove('pokazi'); void rez.offsetWidth; rez.classList.add('pokazi');
    }
    setTimeout(function () {
      if (!uTestu()) return;
      if (TEST.i >= TEST.igre.length) testZavrsi('done'); else testVjezba();
    }, 900);
  }

  // ---- 7. kraj testa ----
  function testZavrsi(razlog) {
    if (!TEST) return;
    var T = TEST;
    if (T.tajmer) { clearInterval(T.tajmer); T.tajmer = null; }
    if (timer) { clearInterval(timer); timer = null; }
    var z = $('testZastor'); if (z) z.remove();
    T.pauza = false;
    // vrijeme je isteklo usred vježbe — plati ono što je stvarno riješeno
    if (razlog === 'time' && !gotovo && igra && T.rez.length < T.igre.length) {
      gotovo = true;
      var p = predaja ? predaja() : { s: 'ran out of time', pct: 0 };
      var pc = Math.max(0, Math.min(1, p.pct || 0));
      T.rez.push({ igra: igra, sazetak: p.s, pct: pc, osvojeno: Math.round(igra.bodovi * pc) });
    }
    T.aktivan = false;
    // vježbe do kojih se nije stiglo vrijede nula
    while (T.rez.length < T.igre.length) {
      var g = T.igre[T.rez.length];
      T.rez.push({ igra: g, sazetak: 'not reached', pct: 0, osvojeno: 0 });
    }
    T.rez.forEach(function (r) { zabiljezi(r.igra, r.osvojeno); });
    osvjeziHeader();
    renderTestRezultat(razlog);
  }

  function renderTestRezultat(razlog) {
    var T = TEST; if (!T) { renderLessons(); return; }
    trakaVidljiva(false); rjecnikVidljiv(false);
    var maks = 0, osv = 0, redci = '';
    T.rez.forEach(function (r) {
      maks += r.igra.bodovi; osv += r.osvojeno;
      redci += '<li><span>' + (r.igra.naslov || 'Exercise') + '</span><span>' +
        Math.round(r.pct * 100) + '% · <strong>' + r.osvojeno + '</strong>/' + r.igra.bodovi + '</span></li>';
    });
    var pct = maks > 0 ? Math.round(osv / maks * 100) : 0;
    var prosao = pct >= T.prag;
    var razina = T.razina;
    VIEW.innerHTML =
      '<div class="sazetak">' +
      '<h2>' + (prosao ? 'Test ' + razina + ' passed! 🎉' : 'Test ' + razina + ' — not yet 💪') + '</h2>' +
      '<div style="color:var(--muted)">' +
        (razlog === 'time' ? 'Time ran out — everything you answered still counts.'
                           : 'Whole test, one sitting. Here is how it went.') + '</div>' +
      '<div class="velikiBroj">' + pct + '%</div>' +
      '<div style="color:var(--muted)">' + osv + ' / ' + maks + ' points · pass mark ' + T.prag + '%</div>' +
      '<ul>' + redci + '</ul>' +
      '<div style="color:var(--muted);font-size:var(--t-s)">Only your best test result is kept — retake it any time.</div>' +
      '<button class="gumb" id="btnTestOpet">↻ Take the test again</button>' +
      '<button class="gumb gumbSivi" onclick="idi(\'lessons\')">← Back to lessons</button>' +
      '</div>';
    $('btnTestOpet').onclick = function () { renderTestUvod(razina); };
    if (pct >= 100) konfeti(80); else if (prosao) konfeti(30);
    var nova = noveOtkljucane();
    if (nova.length) setTimeout(function () { prikaziOtkljucanje(nova); }, 700);
    TEST = null;
  }

  // ---- player cjeline ----
  function renderUnit(tip, razina, indeks) {
    // Defense-in-depth: "Next"/"Play again"/"Try again" call renderUnit() directly, bypassing
    // the idi() gate, so the same check has to live here too.
    if (imaPristup(tip, razina) !== 'ok') { renderLessons(); return; }
    // Test ima vlastiti tijek: uvod s pravilima, pa sve vježbe u komadu.
    if (tip === 'Test') { renderTestUvod(razina); return; }
    // Daily challenge: dostupan je isključivo današnji — ostali su zaključani.
    if (tip === 'Daily challenge' && razina !== dailyDanasnji()) { renderDaily(); return; }
    var igre = igreCjeline(tip, razina);
    if (igre.length === 0) { renderLessons(); return; }
    // Cjelina je otključana, ali njezin sadržaj još nije stigao iz zaštićenog dijela —
    // dohvati ga pa se vrati ovamo. Bez ovoga bi se otvorila prazna vježba.
    if (igre.some(function (g) { return g.zakljucano; })) {
      VIEW.innerHTML = '<div class="zakljBanner">Loading this unit…</div>';
      ucitajPlusSadrzaj(function (uspjeh) {
        if (uspjeh) renderUnit(tip, razina, indeks);
        else VIEW.innerHTML = '<div class="zakljBanner">This unit could not be loaded. ' +
          'Check your connection and try again.</div>';
      });
      return;
    }
    oznaciPokrenuto(igre[0].cjelina);
    if (indeks >= igre.length) { renderSummary(tip, razina); return; }
    igra = igre[indeks];
    slikeVjezbe = vjezbaImaSveSlike(igra);
    gotovo = false; start = Date.now();
    // svaka vježba kreće s čistim brojačem grešaka i bez naslijeđenog oblačića
    gresakaUVjezbi = 0; sakrijSavjetRj();
    var naslovC = (tip === 'Daily challenge' ? 'Daily challenge' : tip + ' ' + razina) +
      (igre[0].cjelinaNaslov ? ' — ' + igre[0].cjelinaNaslov : '');
    // iz Lesson 0 se izlazi na naslovnicu — i pri prvom ulasku
    var jeNula = (tip === L0_TIP && razina === L0_RAZINA);
    var natragView = jeNula ? 'main' : ((VALUTA_TIPA[tip] || tip === 'Test') ? 'lessons' : 'daily');
    // Lesson 0: traka abecede JE traka napretka — bez postotka i brojača stranica
    trakaVidljiva(jeNula);
    rjecnikVidljiv(true, tip, razina);
    // Lesson 0: svaka nova stranica kratko istakne lebdeće ikone (val: rječnik → igrica → info)
    if (jeNula) istakniLebdece(tip + '|' + razina + '|' + indeks);
    VIEW.innerHTML =

      '<div id="sadrzaj"></div>' +

      '<button class="gumb" id="btnDalje">Next →</button>' +

    $('btnPonovno').onclick = function () { renderUnit(tip, razina, indeks); };

      potvrdi('Finish now?', 'The exercise ends and you take the points earned so far.', function () {

    // tihi podsjetnik na rječnik u 2., 5. i 8. vježbi lekcije 0
    if (jeNula && SAVJETI_L0[indeks]) {
      setTimeout(function () {

    if (!jeNula) {

        if (gotovo) return;
        if (igra.format === 'brzina') jednomPokazi('sat', 'hudBodovi', SAVJET_SAT);
        else jednomPokazi('bodovi', 'valuteHeader', SAVJET_BODOVI, { gore: true });

  function renderSummary(tip, razina) {
    var igre = igreCjeline(tip, razina);
    var maks = 0, osv = 0, redci = '';
    igre.forEach(function (g) {
      maks += g.bodovi; osv += najbolji(g);

    });

    if (tip === L0_TIP && razina === L0_RAZINA) {
      // bez bodova i postotaka — jedina brojka je koliko je slova skupljeno
      var o = otkljucanaSlova(), imaSlova = 0;
      ABECEDA.forEach(function (s) { if (o[s]) imaSlova++; });
      var sve = (imaSlova >= ABECEDA.length);
      trakaVidljiva(false); rjecnikVidljiv(false);
      // Lekcija 0 nema kartice pa nema gumba "+ Add to dictionary" —

      var novihRijeci = dodajCjelinuURjecnik(L0_TIP, L0_RAZINA);
      var ukupnoL0 = natukniceCjeline(L0_TIP, L0_RAZINA).length;
      VIEW.innerHTML =
        '<div class="sazetak"><h2>' + (sve ? 'The whole alphabet is yours. 🎉' : 'Nice work! 🎉') + '</h2>' +
        '<div style="font-size:var(--t-l);margin:10px 0 4px">You can read Croatian.</div>' +
        '<div style="color:var(--muted)">Five minutes ago these were strange letters.</div>' +
        htmlSkupljenihSlova() +
        '<div style="color:var(--zelena);margin-top:12px">📖 ' +
          (novihRijeci > 0
            ? 'All ' + ukupnoL0 + ' words from this lesson are now in your <strong>Dictionary</strong>.'
            : 'Your first ' + ukupnoL0 + ' words are waiting in your <strong>Dictionary</strong>.') +
        '</div>' +
        (sve
          ? '<div style="color:var(--zelena);margin-top:12px">All 30 letters unlocked. <strong>Hvala!</strong></div>'
          : '<div style="color:var(--muted);margin-top:12px">' + (ABECEDA.length - imaSlova) +
            ' letters still dark — replay any exercise to light them up.</div>') +
        (igreCjeline(L0_TIP, 1).length > 0
          ? '<div style="color:var(--muted);margin-top:18px;font-size:var(--t-m)">' +
            'Lesson 1 starts the course itself — 13 exercises, still free.</div>' +
            '<button class="gumb" onclick="idi(\'unit\',\'' + L0_TIP + '\',1)">▶ Start Lesson 1</button>' : '') +
        '<button class="gumb gumbSivi" onclick="idi(\'main\')">‹ Explore the app first</button></div>';
      // jedina proslava u cijeloj lekciji — tek ovdje, na kraju
      if (sve && !PROGRESS.abecedaSlavljena) {
        PROGRESS.abecedaSlavljena = 1; spremiProgress();
      }
      if (sve) konfeti(120);
      return;
    }
    // sljedeća faza po redu tečaja
    var sljedeci = null;
    if (VALUTA_TIPA[tip] || tip === 'Test') {
      var idx = TIPOVI.indexOf(tip);
      for (var j = idx + 1; j < TIPOVI.length && !sljedeci; j++) {
        if (igreCjeline(TIPOVI[j], razina).length > 0) sljedeci = { tip: TIPOVI[j], razina: razina };
      }
      if (!sljedeci && razina < MAX_RAZINA) {
        for (var rr = razina + 1; rr <= MAX_RAZINA && !sljedeci; rr++) {
          for (var jj = 0; jj < TIPOVI.length && !sljedeci; jj++) {
            if (igreCjeline(TIPOVI[jj], rr).length > 0) sljedeci = { tip: TIPOVI[jj], razina: rr };
          }
        }
      }
    }
    var btnNext = '';
    if (sljedeci) {
      if (otkljucano(sljedeci.tip, sljedeci.razina)) {
        btnNext = '<button class="gumb" onclick="idi(\'unit\',\'' + sljedeci.tip + '\',' + sljedeci.razina + ')">Next: ' + sljedeci.tip + ' ' + sljedeci.razina + ' →</button>';
      } else {
        var val = VALUTA_TIPA[sljedeci.tip];
        btnNext = '<div style="color:var(--muted);margin-top:12px">🔒 ' + sljedeci.tip + ' ' + sljedeci.razina +
          (val ? ' — needs ' + prag(sljedeci.tip, sljedeci.razina) + ' ' + val : '') + '. Go back and improve your scores!</div>';
      }
    }
    // ---- završna stranica lekcije ----
    trakaVidljiva(false); rjecnikVidljiv(false);
    var ostalo = Math.max(0, maks - osv);
    var sve = (maks > 0 && ostalo === 0);
    var boja = sve ? ' zeleno' : (pct >= 60 ? '' : ' zlato');
    var naslovC = (tip === 'Daily challenge' ? 'Daily challenge' : tip + ' ' + razina) +
      (igre[0].cjelinaNaslov ? ' — ' + igre[0].cjelinaNaslov : '');
    var natragView = (VALUTA_TIPA[tip] || tip === 'Test') ? 'lessons' : 'daily';
    var R = 76, C = 2 * Math.PI * R;

    // stupci po vježbi — svaki vodi natrag na svoju stranicu
    var barovi = '', trake = [];
    igre.forEach(function (g, i) {
      var o = najbolji(g), m = g.bodovi || 0;
      var p = m > 0 ? Math.min(1, o / m) : 0;
      var id = 'sb' + razina + '_' + i;
      trake.push({ id: id, pct: p, kasni: 320 + i * 90 });
      var kl = 'sazRed' + (m > 0 && o >= m ? ' pun' : (o <= 0 ? ' nula' : ''));
      barovi += '<li class="' + kl + '" onclick="idi(\'unit\',\'' + tip + '\',' + razina + ',' + i + ')" ' +
        'title="Replay this exercise">' +
        '<span class="ime">' + (g.stranica ? g.stranica + '. ' : '') + esc(g.naslov || ('Exercise ' + (i + 1))) +
        (o <= 0 ? '<span class="oznaka">not played</span>' : '') + '</span>' +
        '<span class="pts"><strong>' + o + '</strong>/' + m + '</span>' +
        '<span class="sbar"><i id="' + id + '"></i></span></li>';
    });

    var kutija = sve
      ? '<div class="preostaloBox sve">🏆 Everything in this unit is yours — all <strong>' + maks +
        '</strong> points earned. Nothing left to win here.</div>'
      : '<div class="preostaloBox">💪 <strong>' + ostalo + ' points</strong> are still waiting in ' + tip + ' ' + razina +
        '. Replay any exercise above — only your best attempt counts, so a weaker run can never cost you points.</div>';

    VIEW.innerHTML =
      '<div class="traka">' +
      '<button class="natrag" onclick="idi(\'' + natragView + '\')">‹ Back</button>' +
      '<h2>' + esc(naslovC) + ' — summary</h2>' +
      '<div class="progresBar"><div style="width:100%"></div></div>' +
      '<span style="font-size:var(--t-s);color:var(--muted)">🏁 finish</span>' +
      '</div>' +
      navigacijaVjezbi(tip, razina, igre.length, igre) +
      '<div class="sazetak sazUlaz">' +
      '<h2 style="text-align:center">' + (sve ? 'Unit mastered! 🏆' : 'Unit complete! 🎉') + '</h2>' +
      '<div class="prsten' + boja + '" id="prstenBox">' +
      '<svg viewBox="0 0 180 180">' +
      '<circle class="pozadina" cx="90" cy="90" r="' + R + '"></circle>' +
      '<circle class="luk" id="prstenLuk" cx="90" cy="90" r="' + R + '" ' +
      'stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + C.toFixed(1) + '"></circle>' +
      '</svg>' +
      '<div class="sredina"><div class="pct" id="prstenPct">0%</div>' +
      '<div class="bodovi"><span id="prstenBod">0</span> / ' + maks + ' pts</div></div>' +
      '</div>' +
      '<ul class="sazBarovi">' + barovi + '</ul>' +
      kutija +
      btnNext +
      '<button class="gumb gumbSivi" onclick="idi(\'' + natragView + '\')">‹ Back to ' +
      (natragView === 'daily' ? 'Daily challenge' : 'Lessons') + '</button></div>';

    animirajTrake(navTrakeCekaju); navTrakeCekaju = null;

    // prsten se puni, brojka se broji — animacija kreće tek nakon prvog kadra
    setTimeout(function () {
      var luk = document.getElementById('prstenLuk');
      if (luk) luk.setAttribute('stroke-dashoffset', (C * (1 - pct / 100)).toFixed(1));
      brojiDo('prstenPct', 0, pct, 1200, '%');
      brojiDo('prstenBod', 0, osv, 1200, '');
    }, 120);
    trake.forEach(function (x) {
      setTimeout(function () {
        var el = document.getElementById(x.id);
        if (el) el.style.width = Math.round(x.pct * 100) + '%';
      }, x.kasni);
    });
    if (sve) setTimeout(function () { konfeti(120); }, 700);
  }

  // brojka koja naraste do cilja — isti tempo kao prsten, da se čita kao jedna stvar
  function brojiDo(id, od, doK, ms, sufiks) {
    var el = document.getElementById(id);
    if (!el) return;
    var t0 = null;
    function kadar(t) {
      if (t0 === null) t0 = t;
      var k = Math.min(1, (t - t0) / ms);
      var e = 1 - Math.pow(1 - k, 3);            // ease-out, isti osjećaj kao traka
      el.textContent = Math.round(od + (doK - od) * e) + sufiks;
      if (k < 1) requestAnimationFrame(kadar);
    }
    requestAnimationFrame(kadar);
  }

  // ---- Dictionary ----
  // Natuknica se prikazuje u OSNOVNOM obliku; ostali oblici i izgovor se otkrivaju klikom.
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  // "čitati → čitam, čitaš, čita" -> ["čitati", ["čitam","čitaš","čita"]]
  // "crven / crvena / crveno"     -> ["crven",  ["crvena","crveno"]]
  function razlomiHr(hr) {
    // "/" uvijek razdvaja alternative; "," razdvaja samo iza strelice ili u nizu jednorječnih oblika
    function poKosoj(x) {
      return String(x).split(/\s*\/\s*/).map(function (y) { return y.trim(); }).filter(Boolean);
    }
    function poZarezu(x) {
      return String(x).split(/\s*,\s*/).map(function (y) { return y.trim(); }).filter(Boolean);
    }
    var dijelovi = String(hr || '').trim().split(/\s*(?:→|->|=>)\s*/);
    var glava = poKosoj(dijelovi[0]);
    var t = glava[0] || '';
    var ostatak = glava.slice(1);
    dijelovi.slice(1).forEach(function (d) {
      poZarezu(d).forEach(function (x) { poKosoj(x).forEach(function (y) { ostatak.push(y); }); });
    });
    // niz oblika bez strelice: "nemam, nemaš, nema, ..." -> "nemam" + ostali
    if (dijelovi.length === 1 && t.indexOf(',') !== -1) {
      var c = poZarezu(t);
      if (c.length > 1 && c.every(function (x) { return x.indexOf(' ') === -1; })) {
        t = c[0]; ostatak = c.slice(1).concat(ostatak);
      }
    }
    return [t, ostatak];
  }
  // "to read · CHEE-tah-tee" -> ["to read", "CHEE-tah-tee"]
  function razlomiEn(en) {
    var d = String(en || '').split(/\s*·\s*/).map(function (x) { return x.trim(); }).filter(Boolean);
    return [d[0] || '', d.slice(1).join(' · ')];
  }
  // ================= JEZGRA RJEČNIKA =================
  // Jedan izvor natuknica i JEDAN renderer — koriste ih i stranica Dictionary
  // i lebdeći rječnik, pa je prikaz nužno identičan.

  // Formati koji stvarno nose par "hrvatska riječ | engleski prijevod".
  // Sve ostalo (izbor, upis, provjera, brzina, parovi, slaganje, dijalog, tekst,
  // razvrstavanje, poredak) su zadaci: st[0] je pitanje, popuna praznine ili
  // čak naziv podformata — takve stavke NISU rječničke natuknice.
  var FORMATI_RIJECI = {
    kartice: 1, memorija: 1, spajanje: 1, pamti: 1, zid: 1, baloni: 1, slova: 1, vlak: 1
  };
  function jeRjecnickaStavka(hr, en) {
    if (!hr || !en) return false;
    var s = String(hr).trim();
    if (s.indexOf('___') !== -1 || s.indexOf('…') !== -1) return false;
    if (/^(izbor|upis|slaganje|poredak|razvrstavanje)$/i.test(s)) return false;
    return jeNatuknica(s);
  }
  // Sve natuknice jedne cjeline (lekcije) — bez obzira je li ih korisnik dodao.
  function natukniceCjeline(tip, razina) {
    var vidjeno = {}, red = [];
    igreCjeline(tip, razina).forEach(function (g) {
      if (!FORMATI_RIJECI[g.format]) return;
      g.stavke.forEach(function (st) {
        var hr = String(st[0] || '').trim(), en = String(st[1] || '').trim();
        if (!jeRjecnickaStavka(hr, en)) return;
        natuknice(hr, en).forEach(function (p) {
          var k = kljucRijeci(p.hr);
          if (!k || vidjeno[k]) return;
          vidjeno[k] = 1;
          red.push({ hr: p.hr, en: p.en, rod: p.rod || '', broj: p.broj || '', izvor: g.cjelina || '' });
        });
      });
    });
    return poredajNatuknice(red);
  }

  // ---- SVE riječi koje se pojave u cjelini ----
  // Kartice pokrivaju samo ono što je cjelina namjerno "učila". U gramatici i vježbanju
  // nema kartica pa je popis bio prazan, a baš ondje riječi nemaju prijevod uz sebe.
  // Zato ovdje prolazimo kroz SVE zadatke i svaku hrvatsku riječ svodimo na lemu
  // preko morfološkog indeksa iz rjecnik.js — i nove i one odavno viđene.
  var _rijeciCjeline = {};
  // engleske rečenice ne smiju upasti: polje se prihvaća samo ako se većina
  // njegovih riječi prepozna kao hrvatski oblik
  function hrvatskoPolje(txt) {
    var rijeci = String(txt).split(/[\s—–…]+/).map(ocistiRijec).filter(function (r) { return r.length > 1; });

    var spoj = kurirane.concat(red.filter(function (r) { return !imaKuriranu[kljucRijeci(r.hr)]; }));

  // Sve natuknice koje je korisnik dodao u svoj rječnik.

      if (!st || !st.hr || !jeNatuknica(st.hr)) return;
      natuknice(st.hr, st.en).forEach(function (p) {
        var kp = kljucRijeci(p.hr);

  function tablicaImenice(o) {

      if (!jd && !mn) return;

  // Ključevi po specifikaciji: m/ž/s dijele kose padeže, D=L, u množini D=L=I.
  function tablicaPridjeva(o, zivo) {
    var amJd = zivo ? o.G_ms : o.m_odr;
    var jdRedovi = [
      ['Nom', o.m_odr, o.z_odr, o.s_odr], ['Gen', o.G_ms, o.G_z, o.G_ms],
      ['Dat', o.D_ms, o.D_z, o.D_ms], ['Acc', amJd, o.A_z, o.s_odr],
      ['Voc', o.m_odr, o.z_odr, o.s_odr], ['Loc', o.D_ms, o.D_z, o.D_ms],
      ['Ins', o.I_ms, o.I_z, o.I_ms]

      ['Nom', o.m_odr, o.G_z, o.z_odr], ['Gen', o.G_mn, o.G_mn, o.G_mn],
      ['Dat', o.D_mn, o.D_mn, o.D_mn], ['Acc', o.G_z, o.G_z, o.z_odr],
      ['Voc', o.m_odr, o.G_z, o.z_odr], ['Loc', o.D_mn, o.D_mn, o.D_mn],

    function crtaj(redovi) {
      var h = '';
      redovi.forEach(function (r) {
        if (!r[1] && !r[2] && !r[3]) return;
        h += '<tr><th>' + r[0] + '</th>' + celija(r[1]) + celija(r[2]) + celija(r[3]) + '</tr>';
      });
      return h;

  function tablicaGlagola(o) {

  // ---- Kartica u smjeru EN → HR ----

  function htmlKarticaEn(r, opcije) {

  // ---- Dictionary ----

  var dictSmjer = 'hr-en', dictOpseg = 'moje';
  function renderDictionary() {
    VIEW.innerHTML =
      '<h1 class="sekcija">Dictionary</h1>' +
      '<button class="wtPokreni" onclick="wtPokreni()">📝 Test your words</button>' +
      '<div class="dictPrekidac" id="dictSmjerP">' +
      '<div data-smjer="hr-en">Croatian → English</div>' +

      '</div>' +

        smjer: dictSmjer,

        slikaUDetalju: dictSmjer === 'hr-en' && dictOpseg === 'moje',
        izvor: dictOpseg === 'moje',
        prazno: dictOpseg === 'sve'
          ? 'The dictionary file is missing — run osvježi.bat to generate rjecnik.js.'
          : 'Your dictionary is empty — open a lesson and tap “+ Add to dictionary” on the words you learn. 📚'

    }
    function oznaci() {
      [].forEach.call($('dictSmjerP').children, function (c) {
        c.classList.toggle('aktivan', c.getAttribute('data-smjer') === dictSmjer);
      });

    }

  // ================= TEST RIJEČI (Dictionary → Word test) =================
  // Nebodovana vježba: jedna riječ po ekranu, upisuje se prijevod, odmah slijedi
  // točno/netočno i ispravan odgovor. Vrti se u krug dok korisnik ne izađe.
  // Filter: My Dictionary (uvijek početno) ili odabir lekcija 0–20, više njih naraz.
  var wtSmjer = 'mix';        // 'en-hr' | 'mix' | 'hr-en'
  var wtOpseg = 'moje';       // 'moje' | 'lekcije'
  var wtLekcije = [];         // odabrani brojevi lekcija
  var wtFilterOtvoren = false;
  var wtNiz = [], wtPoz = 0, wtVidjeno = 0, wtTocno = 0;

  // Riječi jedne lekcije = kurirane natuknice svih faza te razine.
  // Lekcija 0 je samostalna cjelina i ima samo fazu Lesson.
  function wtRijeciLekcije(n) {
    var red = [];
    TIPOVI.forEach(function (tip) {
      if (n === L0_RAZINA && tip !== L0_TIP) return;
      red = red.concat(natukniceCjeline(tip, n));
    });
    return red;
  }
  // Skup za testiranje: parovi s upotrebljivim prijevodom u oba smjera, bez duplikata.
  function wtSkup() {
    var izvor = [];
    if (wtOpseg === 'lekcije') {
      wtLekcije.forEach(function (n) { izvor = izvor.concat(wtRijeciLekcije(n)); });
    } else {
      izvor = rjecnikRijeci();
    }
    var vidjeno = {}, out = [];
    izvor.forEach(function (r) {
      if (!razlomiHr(r.hr)[0] || !razlomiEn(r.en)[0]) return;
      var k = kljucRijeci(r.hr);
      if (!k || vidjeno[k]) return;
      vidjeno[k] = 1;
      out.push({ hr: r.hr, en: r.en });
    });
    return out;
  }
  function wtMijesaj() { wtNiz = promijesaj(wtSkup()); wtPoz = 0; }

  function wtNorm(s) {
    return String(s == null ? '' : s).toLowerCase()
      .replace(/[.!?,;:"“”„()]/g, '').replace(/\s+/g, ' ').trim();
  }
  function wtBezKvacica(s) {
    return wtNorm(s).replace(/[čć]/g, 'c').replace(/š/g, 's').replace(/ž/g, 'z').replace(/đ/g, 'd');
  }
  // Prihvatljivi hrvatski odgovori: osnovni oblik i alternative iza "/" (crven / crvena / crveno).
  // Sklonjeni oblici iza "→" nisu odgovor na pitanje o riječi, pa se ne prihvaćaju.
  function wtOdgovoriHr(hr) {
    return String(hr || '').split(/\s*(?:→|->|=>)\s*/)[0]
      .split(/\s*\/\s*/).map(function (x) { return x.trim(); }).filter(Boolean);
  }
  // Prihvatljivi engleski odgovori: sve varijante ("car, automobile"),
  // svaka i bez uvodnog člana — "read" prolazi za "to read".
  function wtOdgovoriEn(en) {
    var out = [];
    razlomiEn(en)[0].split(/\s*[,\/]\s*/).forEach(function (x) {
      var v = x.trim();
      if (!v) return;
      out.push(v);
      var kraci = v.replace(/^(to|a|an|the)\s+/i, '');
      if (kraci && kraci !== v) out.push(kraci);
    });
    return out;
  }
  // 0 = netočno, 1 = točno, 2 = točno ali bez kvačica
  function wtOcjena(upis, tocni) {
    var u = wtNorm(upis);
    if (!u) return 0;
    var i;
    for (i = 0; i < tocni.length; i++) if (wtNorm(tocni[i]) === u) return 1;
    for (i = 0; i < tocni.length; i++) if (wtBezKvacica(tocni[i]) === wtBezKvacica(u)) return 2;
    return 0;
  }

  function wtPokreni() {
    // svaki ulazak počinje čisto: My Dictionary, miješani smjer, nula brojača
    wtSmjer = 'mix'; wtOpseg = 'moje'; wtLekcije = [];
    wtFilterOtvoren = false; wtVidjeno = 0; wtTocno = 0;
    idi('dictTest');
  }
  window.wtPokreni = wtPokreni;

  function renderDictTest() {
    wtMijesaj();
    VIEW.innerHTML =
      '<h1 class="sekcija">Word test</h1>' +
      '<div class="wtOkvir">' +
      '<div class="wtTraka">' +
      '<div class="wtSmjer" id="wtSmjerP">' +
      '<button data-s="en-hr" title="English → Croatian">EN→HR</button>' +
      '<button data-s="mix" title="Mixed — random direction each word">🔀 MIX</button>' +
      '<button data-s="hr-en" title="Croatian → English">HR→EN</button>' +
      '</div>' +
      '<button class="wtFilterG" id="wtFilterG">⚙ Filter</button>' +
      '</div>' +
      '<div id="wtFilterMj"></div>' +
      '<p class="wtStat" id="wtStat"></p>' +
      '<div id="wtZad"></div>' +
      '<button class="gumb wtIzlaz" onclick="idi(\'dictionary\')">Exit test</button>' +
      '</div>';

    $('wtSmjerP').onclick = function (e) {

    };
    $('wtFilterG').onclick = function () {

  }
  function wtOznaciSmjer() {
    [].forEach.call($('wtSmjerP').children, function (b) {
      b.classList.toggle('aktivan', b.getAttribute('data-s') === wtSmjer);
    });
    $('wtFilterG').classList.toggle('otvoren', wtFilterOtvoren);
  }
  function wtCrtajFilter() {
    var mj = $('wtFilterMj');
    if (!wtFilterOtvoren) { mj.innerHTML = ''; wtOznaciSmjer(); return; }
    var h = '<div class="wtFilterPanel">' +
      '<div class="dictPrekidac" id="wtOpsegP">' +
      '<div data-o="moje">My Dictionary</div>' +
      '<div data-o="lekcije">By lesson</div>' +

    if (wtOpseg === 'lekcije') {

        '<div class="wtBrojevi" id="wtBrojeviP">';

        h += '<button data-n="' + n + '"' +
          (wtLekcije.indexOf(n) !== -1 ? ' class="aktivan"' : '') + '>' + n + '</button>';
      }

    [].forEach.call($('wtOpsegP').children, function (c) {
      c.classList.toggle('aktivan', c.getAttribute('data-o') === wtOpseg);
    });
    $('wtOpsegP').onclick = function (e) {
      var c = e.target.closest ? e.target.closest('[data-o]') : null;
      if (!c || c.getAttribute('data-o') === wtOpseg) return;
      wtOpseg = c.getAttribute('data-o');
      if (wtOpseg === 'moje') wtLekcije = [];
      wtCrtajFilter(); wtMijesaj(); wtCrtajZad();
    };
    if ($('wtBrojeviP')) {
      $('wtBrojeviP').onclick = function (e) {
        var b = e.target.closest ? e.target.closest('[data-n]') : null;
        if (!b) return;
        var br = parseInt(b.getAttribute('data-n'), 10), i = wtLekcije.indexOf(br);
        if (i === -1) wtLekcije.push(br); else wtLekcije.splice(i, 1);
        wtCrtajFilter(); wtMijesaj(); wtCrtajZad();
      };
    }
    wtOznaciSmjer();
  }
  function wtCrtajStat() {
    var el = $('wtStat');
    if (!el) return;
    var opis = wtOpseg !== 'lekcije' ? 'My Dictionary'
      : (wtLekcije.length === 0 ? 'No lesson selected'
        : 'Lesson' + (wtLekcije.length > 1 ? 's' : '') + ' ' +
          wtLekcije.slice().sort(function (a, b) { return a - b; }).join(', '));
    el.textContent = opis + ' · ' + wtNiz.length + (wtNiz.length === 1 ? ' word' : ' words') +
      (wtVidjeno ? ' · ' + wtTocno + '/' + wtVidjeno + ' right so far' : '');
  }
  function wtCrtajZad() {
    var box = $('wtZad');
    if (!box) return;
    wtCrtajStat();
    if (!wtNiz.length) {
      box.innerHTML = '<div class="rjPrazno">' + (wtOpseg === 'lekcije'
        ? (wtLekcije.length === 0
          ? 'Pick at least one lesson in the Filter. 🔢'
          : 'No word pairs in the selected lessons yet.')
        : 'Your dictionary is empty — open a lesson and add words first. 📚') + '</div>';
      return;
    }
    if (wtPoz >= wtNiz.length) wtMijesaj();     // krug je pun — novi prolaz, novi raspored
    var r = wtNiz[wtPoz];
    var smjer = wtSmjer === 'mix' ? (Math.random() < 0.5 ? 'en-hr' : 'hr-en') : wtSmjer;
    var uHr = (smjer === 'en-hr');              // odgovor se piše na hrvatskom
    var pitanje = uHr ? razlomiEn(r.en)[0] : razlomiHr(r.hr)[0];
    var ispravno = uHr ? razlomiHr(r.hr)[0] : razlomiEn(r.en)[0];
    var tocni = uHr ? wtOdgovoriHr(r.hr) : wtOdgovoriEn(r.en);

    box.innerHTML =
      '<div class="wtOznaka">' + (uHr ? 'English → Croatian' : 'Croatian → English') + '</div>' +
      '<div class="wtRijec">' + esc(pitanje) + (uHr ? '' : zvHtml(pitanje)) + '</div>' +
      '<input class="upisInput" id="wtUpis" type="text" autocomplete="off" autocapitalize="off" ' +
      'spellcheck="false" placeholder="' + (uHr ? 'Write it in Croatian…' : 'Write it in English…') + '">' +
      '<div id="wtTipke"></div>' +
      '<div class="wtRez" id="wtRez"></div>' +
      '<button class="gumb" id="wtDalje" style="margin-top:0">Check</button>';

    var input = $('wtUpis'), btn = $('wtDalje'), rez = $('wtRez');
    // hrvatski znakovi stoje ispod polja u svakom smjeru i ne skaču između riječi
    $('wtTipke').appendChild(tipkeSlova(input));
    box.onclick = function (e) {
      var t = e.target;
      if (t.classList && t.classList.contains('zvucnik')) sviraj(t.getAttribute('data-rijec'));
    };

    var rijeseno = false;
    function provjeri() {
      if (rijeseno) { wtPoz++; wtCrtajZad(); return; }
      var o = wtOcjena(input.value, tocni);
      rijeseno = true;
      wtVidjeno++;
      if (o) wtTocno++;
      input.classList.add(o ? 'tocno' : 'krivo');
      input.readOnly = true;
      var zv = uHr ? zvHtml(ispravno) : '';
      var jos = tocni.filter(function (x) { return wtNorm(x) !== wtNorm(ispravno); });
      // Odgovor je poslan — točan oblik se pokazuje uvijek, i kad je upisano dobro.
      rez.innerHTML =
        (o === 1 ? '<span class="ok">✓ Correct</span> — '
          : o === 2 ? '<span class="ok">✓ Correct</span> — mind the accents: '
          : '<span class="ne">✗ Wrong</span> — the answer is: ') +
        '<span class="isp">' + esc(ispravno) + '</span>' + zv +
        (jos.length ? '<span class="jos">also accepted: ' + esc(jos.join(', ')) + '</span>' : '');
      btn.textContent = 'Next word →';
      wtCrtajStat();
      // fokus OSTAJE na polju: da je prebačen na gumb, isti pritisak Entera
      // aktivirao bi i gumb i riječ bi preskočila prije čitanja odgovora
      input.focus();
    }
    btn.onclick = provjeri;
    input.onkeydown = function (e) {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      provjeri();
    };
    input.focus();
  }

      '<p style="color:var(--muted);font-size:var(--t-m)">Exercises played: ' + odigrano + ' · Words learned: ' + brojRijeci() + '</p>' +
      '<p style="color:var(--muted);font-size:var(--t-m)">Daily streak: 🔥 <strong>' + streakNiz() + '</strong> ' +
        (streakNiz() === 1 ? 'day' : 'days') + ' · ' + streakBodovi() +
        ' streak points (added to each currency)</p>' +
      statPretplate +
      '<p style="color:var(--muted);font-size:var(--t-s);margin-top:26px">Want a copy of your data, or want it ' +
        'deleted? See our <a href="privacy.html">Privacy Policy</a> for how to request that.</p>';
    $('btnOdjava').onclick = function () { odjava(); };
    var btnP = $('btnPretplati');
    if (btnP) btnP.onclick = pokreniPretplatu;
  }

  // ================= INIT =================
  VIEW = $('view');
  postaviTemu(temaSad());  // default 'zagreb' paint before any hydration — avoids a flash
  postaviFont(fontSad());

  // -- lebdeći rječnik: otvaranje, pretraga, opseg, veličina, povlačenje gore-dolje --
  (function () {
    var l = $('lebdi'); if (!l) return;
    var vuce = false, vukao = false, pocetak = 0, pocetniTop = 0;
    l.onclick = function () { if (!vukao) otvoriRj(); };
    $('rjZatvori').onclick = zatvoriRj;
    $('zastorRj').onclick = function () { zatvoriRj(); zatvoriIgru(); zatvoriInfo(); };
    $('rjTrazi').oninput = crtajPopisRj;
    vezeKlikPopisa($('rjPopis'));
    $('rjManji').onclick = function () { rjVelicina = Math.max(32, rjVelicina - 8); postaviVelicinuIkone(); };
    $('rjVeci').onclick = function () { rjVelicina = Math.min(72, rjVelicina + 8); postaviVelicinuIkone(); };
    Array.prototype.forEach.call($('rjPrekidac').children, function (c) {
      c.onclick = function () {
        rjOpseg = c.getAttribute('data-opseg');
        Array.prototype.forEach.call($('rjPrekidac').children, function (x) {
          x.classList.toggle('aktivan', x === c);
        });
        crtajPopisRj();
      };
    });
    l.addEventListener('pointerdown', function (e) {
      vuce = true; vukao = false;
      pocetak = e.clientY; pocetniTop = l.getBoundingClientRect().top;
      try { l.setPointerCapture(e.pointerId); } catch (err) {}
    });
    l.addEventListener('pointermove', function (e) {
      if (!vuce) return;
      var d = e.clientY - pocetak;
      if (Math.abs(d) > 4) vukao = true;
      // donja granica ostavlja mjesta i za ikonu igrice koja visi ispod
      rjTop = Math.min(Math.max(pocetniTop + d, 70), window.innerHeight - rjVelicina - 210);
      l.style.top = rjTop + 'px';
      postaviIkonuIgre();
    });
    l.addEventListener('pointerup', function () {
      vuce = false; setTimeout(function () { vukao = false; }, 60);
    });
    // swipe udesno zatvara panel
    var sx = null;
    $('panelRj').addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; });
    $('panelRj').addEventListener('touchend', function (e) {
      if (sx != null && e.changedTouches[0].clientX - sx > 70) zatvoriRj();
      sx = null;
    });
    postaviVelicinuIkone();
  })();

  // -- lebdeća mini-igrica: otvaranje, smjer, način, preskakanje, reset --
  (function () {
    var g = $('lebdiIgra'); if (!g) return;
    g.onclick = otvoriIgru;
    $('igZatvori').onclick = zatvoriIgru;
    $('igPreskoci').onclick = function () { crtajIgru(); };
    $('igReset').onclick = function () {
      igTocno = 0; igNetocno = 0; igRed = []; igZadnji = null;
      osvjeziBrojac(); crtajIgru();
    };
    function vezi(id, atribut, postavi) {
      var kut = $(id);
      Array.prototype.forEach.call(kut.children, function (c) {
        c.onclick = function () {
          postavi(c.getAttribute(atribut));
          Array.prototype.forEach.call(kut.children, function (x) {
            x.classList.toggle('aktivan', x === c);
          });
          crtajIgru(true);
        };
      });
    }
    vezi('igSmjer', 'data-smjer', function (v) { igSmjer = v; });
    vezi('igNacin', 'data-nacin', function (v) { igNacin = v; });
    // swipe udesno zatvara panel
    var sx = null;
    $('panelIgra').addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; });
    $('panelIgra').addEventListener('touchend', function (e) {
      if (sx != null && e.changedTouches[0].clientX - sx > 70) zatvoriIgru();
      sx = null;
    });
  })();

  // -- lebdeći info: otvaranje i zatvaranje --
  (function () {
    var b = $('lebdiInfo'); if (!b) return;
    b.onclick = otvoriInfo;
    $('infoZatvori').onclick = zatvoriInfo;
    var sx = null;
    $('panelInfo').addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; });
    $('panelInfo').addEventListener('touchend', function (e) {
      if (sx != null && e.changedTouches[0].clientX - sx > 70) zatvoriInfo();
      sx = null;
    });
  })();
  // Kratka dijagnostika za konzolu: kaže je li učitan ovaj index.html i ovaj data.js.
  // Upiši u konzolu: zastoNemaInfo()
  window.zastoNemaInfo = function () {
    var b = document.getElementById('lebdiInfo');
    return {
      verzijaStranice: 'info-v1',
      ikonaPostojiUHTMLu: !!b,
      ikonaVidljiva: b ? b.classList.contains('vidi') : false,
      trenutnaVjezba: igra ? (igra.cjelina + ' — str. ' + igra.stranica) : 'nisi unutar vježbe',
      ovaVjezbaImaInfo: !!infoTekstIgre(),
      vjezbiSInfoUData: (window.PODACI && window.PODACI.igre)
        ? window.PODACI.igre.filter(function (x) { return x.meta && x.meta.info; }).length : 0
    };
  };
  console.log('CROLAND info-v1 — upiši zastoNemaInfo() za provjeru');

  // Session check + first hydration + first render all happen inside initAuth()'s
  // onAuthStateChange handler (poslijeAuthPromjene) — see the AUTH section above.
  initAuth();
})();
</script>
</body>
</html>
