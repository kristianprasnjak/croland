<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Croland — Weekly Challenge: The Market</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --papir:#FFF8F0; --papir2:#FFEFE0; --tinta:#2B2118; --meko:#8B7B6B;
  --zut:#F4B942; --koralj:#E8623A; --tirkiz:#2FA8A0; --ljub:#7B5EA7;
  --zelena:#7CB342; --plava:#3E7CB1; --crta:3px solid #2B2118;
  --sjena:0 4px 0 #2B2118;
  --visina:100dvh;
}
html,body{height:100%;overflow:hidden}
body{
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  background:var(--papir); color:var(--tinta);
  -webkit-font-smoothing:antialiased; overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
}
.app{height:var(--visina);display:flex;flex-direction:column;overflow:hidden}

/* ---- gornja traka ---- */
.traka{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 10px;
  background:var(--papir);border-bottom:3px solid var(--tinta);z-index:20;position:relative}
.traka .ime{font-weight:800;font-size:15px;line-height:1.15;margin-right:auto;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.traka .ime small{display:block;font-weight:700;font-size:10px;color:var(--meko);
  letter-spacing:.6px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kratko{display:none}
.natrag{text-decoration:none;color:var(--tinta);font-weight:800;font-size:15px;
  border:2px solid var(--tinta);border-radius:999px;width:34px;height:34px;background:#fff;
  display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.znak{display:inline-flex;align-items:center;gap:5px;background:var(--papir2);
  border:2px solid var(--tinta);border-radius:999px;padding:4px 11px;font-weight:800;
  font-size:14px;white-space:nowrap;flex:0 0 auto}
.gi{font:inherit;font-weight:800;font-size:15px;cursor:pointer;border:2px solid var(--tinta);
  border-radius:999px;background:#fff;height:34px;min-width:34px;padding:0 10px;
  display:inline-flex;align-items:center;justify-content:center;gap:5px;flex:0 0 auto;
  color:var(--tinta);box-shadow:0 3px 0 var(--tinta);transition:transform .06s,box-shadow .06s}
.gi:active{transform:translateY(3px);box-shadow:0 0 0 var(--tinta)}
.gi.glavni{background:var(--zut)}
.gi small{font-size:12px;font-weight:800}
@media (max-width:560px){
  .gi small{display:none}
  .traka{gap:6px;padding:7px 8px}
  .gi{padding:0 8px}
  .traka .ime{font-size:14px}
  .dugo{display:none} .kratko{display:inline}
}

/* ---- scena ---- */
.scena{flex:1 1 auto;position:relative;overflow:hidden;touch-action:none;cursor:grab;
  background:var(--papir2);
  background-image:radial-gradient(rgba(43,33,24,.05) 1px,transparent 1px);background-size:22px 22px}
.scena.vuce{cursor:grabbing}
.platno{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform;--inv:1}
.platno.glatko{transition:transform .28s cubic-bezier(.2,.7,.3,1)}
.platno img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none;pointer-events:none}

/* ---- točke (objekti) ---- */
.tocka{position:absolute;pointer-events:none;border-radius:14px;opacity:0;
  transition:opacity .2s,background .2s,box-shadow .2s}
.tocka.aktivan{opacity:1;background:rgba(255,214,120,.26);
  box-shadow:0 0 0 3px var(--zut),0 0 0 6px rgba(244,185,66,.35),0 0 34px 12px rgba(244,185,66,.75);
  animation:disi 1.5s ease-in-out infinite}
@keyframes disi{0%,100%{box-shadow:0 0 0 3px var(--zut),0 0 0 6px rgba(244,185,66,.3),0 0 26px 8px rgba(244,185,66,.6)}
  50%{box-shadow:0 0 0 4px var(--zut),0 0 0 9px rgba(244,185,66,.45),0 0 44px 16px rgba(244,185,66,.9)}}
.tocka.rijesen{opacity:1;background:rgba(124,179,66,.18);box-shadow:0 0 0 3px rgba(124,179,66,.9)}
.tocka.signal{opacity:1;animation:signal .85s ease-out}
@keyframes signal{
  0%{opacity:0;background:rgba(255,214,120,0);box-shadow:0 0 0 0 rgba(244,185,66,0)}
  35%{opacity:1;background:rgba(255,214,120,.42);box-shadow:0 0 0 4px var(--zut),0 0 40px 14px rgba(244,185,66,.9)}
  100%{opacity:0;background:rgba(255,214,120,0);box-shadow:0 0 0 0 rgba(244,185,66,0)}}
.kvaka{position:absolute;right:-9px;top:-9px;width:26px;height:26px;border-radius:999px;
  background:var(--zelena);border:2px solid var(--tinta);color:#fff;font-weight:900;font-size:15px;
  display:none;align-items:center;justify-content:center;transform:scale(var(--inv));
  transform-origin:100% 0;box-shadow:0 2px 0 var(--tinta)}
.tocka.rijesen .kvaka{display:flex;animation:skok .4s}
@keyframes skok{0%,100%{transform:scale(var(--inv))}45%{transform:scale(calc(var(--inv)*1.45))}}
.mimo{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:999px;
  border:3px solid rgba(43,33,24,.5);pointer-events:none;animation:mimo .5s ease-out forwards}
@keyframes mimo{from{transform:scale(.3);opacity:.9}to{transform:scale(1.5);opacity:0}}

/* ---- upis ---- */
.upis{position:absolute;left:0;right:0;top:0;z-index:30;padding:10px;
  background:linear-gradient(180deg,rgba(255,248,240,.98) 72%,rgba(255,248,240,0));
  transform:translateY(-120%);transition:transform .22s cubic-bezier(.2,.8,.3,1);pointer-events:none}
.upis.vidi{transform:none;pointer-events:auto}
.upis .kutija{display:flex;align-items:center;gap:8px;background:#fff;border:var(--crta);
  border-radius:16px;box-shadow:var(--sjena);padding:8px}
.upis.krivo .kutija{animation:tresi .32s;border-color:var(--koralj)}
@keyframes tresi{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.upis input{font:inherit;font-size:19px;font-weight:800;flex:1 1 auto;min-width:0;border:0;
  outline:none;background:transparent;color:var(--tinta);padding:6px 4px}
.upis input::placeholder{color:#C7B8A8;font-weight:700}
.upis .mali{font:inherit;font-weight:900;font-size:17px;cursor:pointer;border:2px solid var(--tinta);
  border-radius:12px;background:#fff;width:40px;height:40px;flex:0 0 auto;color:var(--tinta)}
.upis .mali.ok{background:var(--zut)}
.upis .natuknica{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
  color:var(--meko);padding:0 4px 6px 6px}

/* ---- poruka ---- */
.poruka{position:absolute;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);
  background:var(--tinta);color:#fff;padding:9px 18px;border-radius:999px;font-weight:800;font-size:14px;
  opacity:0;pointer-events:none;transition:.22s;z-index:40;max-width:90%;text-align:center}
.poruka.vidi{opacity:1;transform:translateX(-50%) translateY(0)}
.poruka.dobro{background:var(--zelena)}
.poruka.lose{background:var(--koralj)}

/* ---- zastor ---- */
.zastor{position:fixed;inset:0;background:rgba(43,33,24,.72);display:none;align-items:center;
  justify-content:center;padding:20px;z-index:80}
.zastor.vidi{display:flex}
.zastor .kut{background:var(--papir);border:var(--crta);border-radius:22px;
  box-shadow:0 8px 0 rgba(0,0,0,.35);padding:24px;max-width:440px;width:100%;text-align:center;
  max-height:86vh;overflow:auto}
.zastor h3{font-size:24px;margin-bottom:8px}
.zastor p{color:var(--meko);line-height:1.55;margin-bottom:14px;font-size:15px}
.zastor ul{text-align:left;color:var(--meko);font-size:14px;line-height:1.7;
  margin:0 0 16px 18px}
.g{font:inherit;font-weight:800;font-size:15px;cursor:pointer;border:var(--crta);border-radius:14px;
  background:#fff;padding:11px 18px;box-shadow:0 4px 0 var(--tinta);color:var(--tinta);
  transition:transform .06s,box-shadow .06s;margin:4px}
.g:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tinta)}
.g.glavni{background:var(--zut)}
.konfet{position:fixed;width:10px;height:14px;z-index:90;pointer-events:none;border-radius:2px}
</style>
</head>
<body>

<div class="app" id="app">

  <div class="traka">
    <a class="natrag" href="../index.html" id="gNatrag" title="Back">←</a>
    <div class="ime"><span class="dugo">Weekly Challenge</span><span class="kratko">Tržnica</span><small><span class="dugo">Tržnica · the market</span><span class="kratko">Weekly</span></small></div>
    <span class="znak" id="brojac">0 / 0</span>
    <button class="gi" id="gManje" title="Zoom out" aria-label="Zoom out">−</button>
    <button class="gi" id="gVise" title="Zoom in" aria-label="Zoom in">+</button>
    <button class="gi glavni" id="gPokazi" title="Signal every word still missing">✨<small>Show</small></button>
    <button class="gi" id="gInfo" title="How it works">?</button>
  </div>

  <div class="scena" id="scena">
    <div class="platno" id="platno">
      <img id="slika" src="slike/trznica.webp" alt="Market stall">
    </div>

    <form class="upis" id="upis" autocomplete="off">
      <div class="natuknica" id="natuknica">Type it in Croatian</div>
      <div class="kutija">
        <button type="button" class="mali" id="gZatvori" title="Close">✕</button>
        <input id="polje" type="text" inputmode="text" autocomplete="off" autocorrect="off"
               autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="…">
        <button type="submit" class="mali ok" title="Check">→</button>
      </div>
    </form>

    <div class="poruka" id="poruka"></div>
  </div>
</div>

<div class="zastor" id="zastor"><div class="kut" id="kut"></div></div>

<script>
(function(){
"use strict";

/* ───────────── podaci ───────────── */
var IMG_W = 1024, IMG_H = 572;
var KLJUC = "croland.weekly.trznica.2026-09-14";

/* x,y,w,h u postotcima slike · o = prihvaćeni odgovori (bez kvačica, mala slova) */
var POJMOVI = [
  {id:"sunce",   x:79.5, y:2.5,  w:9.5,  h:19.0, o:["sunce","sunca","suncem"]},
  {id:"vaga",    x:24.5, y:28.5, w:12.0, h:18.0, o:["vaga","vage","vagu","vaga za vaganje","terezija"]},
  {id:"prodav",  x:44.0, y:31.5, w:11.5, h:27.0, o:["prodavacica","prodavacice","prodavacicu","prodavac","prodavaca","prodavaci","trgovkinja","zena","gospoda","teta"]},
  {id:"jabuke",  x:19.0, y:50.0, w:9.0,  h:9.0,  o:["jabuka","jabuke","jabuku","jabuka crvena","crvene jabuke"]},
  {id:"banane",  x:28.0, y:50.0, w:6.5,  h:8.5,  o:["banana","banane","bananu"]},
  {id:"rajcice", x:34.5, y:50.0, w:8.5,  h:9.0,  o:["rajcica","rajcice","rajcicu","paradajz","paradajza","paradajzi","pomidor"]},
  {id:"krumpir", x:24.5, y:58.5, w:7.5,  h:11.0, o:["krumpir","krumpiri","krumpira","kompir","kompiri","krompir"]},
  {id:"luk",     x:32.0, y:58.5, w:8.0,  h:11.5, o:["luk","luka","lukovi","kapula","kapule","crveni luk"]},
  {id:"salata",  x:39.8, y:58.0, w:4.8,  h:11.5, o:["salata","salate","salatu","kupus","kupusa","zelje","glavica salate"]},
  {id:"grozde",  x:44.5, y:59.5, w:5.0,  h:12.5, o:["grozde","grozd","grozda","grozdovi","grozdje"]},
  {id:"kruh",    x:45.5, y:51.5, w:6.8,  h:7.5,  o:["kruh","kruha","kruhovi","hljeb","hljeba","štruca","struca"]},
  {id:"sir",     x:52.3, y:51.5, w:5.5,  h:7.5,  o:["sir","sira","sirevi","kolut sira"]},
  {id:"novac",   x:60.3, y:54.0, w:5.8,  h:5.0,  o:["novac","novca","novci","kovanica","kovanice","novcic","novcici","pare","sitnis","lova"]},
  {id:"vrecica", x:66.8, y:44.0, w:6.4,  h:15.0, o:["vrecica","vrecice","vreca","vrece","kesa","papirnata vrecica","papirnata vreca"]},
  {id:"med",     x:61.8, y:61.8, w:5.8,  h:10.0, o:["med","meda","medu","staklenka meda","teglica meda"]},
  {id:"jaja",    x:67.3, y:64.3, w:7.4,  h:7.7,  o:["jaje","jaja","jajeta","jajima"]},
  {id:"kosara",  x:79.0, y:54.0, w:8.2,  h:13.5, o:["kosara","kosare","kosaru","kosarica","kosarice","korpa","korpu","kos","pletena kosara"]},
  {id:"kupac",   x:75.0, y:33.0, w:8.5,  h:60.0, o:["kupac","kupca","kupci","kupica","kupkinja","musterija","zena","gospoda","kupovina nije"]},
  {id:"macka",   x:61.8, y:77.5, w:6.8,  h:15.0, o:["macka","macke","macku","macak","maca","mace","mica"]},
  {id:"pas",     x:84.0, y:72.5, w:9.5,  h:20.0, o:["pas","psa","psi","pseto","psic","pasa"]},
  {id:"cvijece", x:9.3,  y:67.0, w:9.4,  h:14.0, o:["cvijece","cvijeca","cvijet","cvijeti","cvjetovi","cvece","buket","tulipani","tulipan"]},
  {id:"kanta",   x:10.8, y:80.0, w:6.9,  h:13.0, o:["kanta","kante","kantu","vjedro","vedro","limenka nije","posuda"]}
];
/* sitni čuvar: makni slučajne "nije" natuknice ako ostanu */
POJMOVI.forEach(function(p){ p.o = p.o.filter(function(s){ return s.indexOf(" nije")<0; }); });

/* ───────────── pomoćno ───────────── */
function $(s){ return document.querySelector(s); }
var DIJA = {"č":"c","ć":"c","ž":"z","š":"s","đ":"d","dž":"d"};
function ocisti(s){
  return String(s||"").toLowerCase().trim()
    .replace(/[čćžšđ]/g, function(z){ return DIJA[z]; })
    .replace(/[^a-z0-9šđčćž ]+/g,"")
    .replace(/\s+/g," ").trim();
}
function stisni(a,b,c){ return Math.min(Math.max(a,b),c); }

/* ───────────── stanje ───────────── */
var scena = $("#scena"), platno = $("#platno"), upis = $("#upis"),
    polje = $("#polje"), poruka = $("#poruka"), brojac = $("#brojac"),
    natuknica = $("#natuknica"), zastor = $("#zastor"), kut = $("#kut");

var S = { k:1, tx:0, ty:0, aktivan:null, rijeseni:{}, pocetak:Date.now() };
var kmin = .2, kmax = 6, kpocetni = 1;

try{
  var spremljeno = JSON.parse(localStorage.getItem(KLJUC) || "{}");
  if (spremljeno && spremljeno.rijeseni) S.rijeseni = spremljeno.rijeseni;
}catch(e){}

function spremi(){
  try{
    localStorage.setItem(KLJUC, JSON.stringify({rijeseni:S.rijeseni}));
    var n = Object.keys(S.rijeseni).length;
    localStorage.setItem("croland-mini-trznica", JSON.stringify(
      n >= POJMOVI.length ? {naplaceno:n} : {najbolje:n}
    ));
  }catch(e){}
}

/* ───────────── crtanje točaka ───────────── */
POJMOVI.forEach(function(p){
  var d = document.createElement("div");
  d.className = "tocka";
  d.style.left   = p.x + "%";
  d.style.top    = p.y + "%";
  d.style.width  = p.w + "%";
  d.style.height = p.h + "%";
  d.innerHTML = '<i class="kvaka">✓</i>';
  platno.appendChild(d);
  p.el = d;
  p.povrsina = p.w * p.h;
  p.sredinaX = p.x + p.w/2;
});

function osvjeziStanja(){
  var n = 0;
  POJMOVI.forEach(function(p){
    var r = !!S.rijeseni[p.id];
    if (r) n++;
    p.el.classList.toggle("rijesen", r);
  });
  brojac.textContent = n + " / " + POJMOVI.length;
  return n;
}

/* ───────────── transformacija ───────────── */
function primijeni(glatko){
  platno.classList.toggle("glatko", !!glatko);
  platno.style.width  = IMG_W + "px";
  platno.style.height = IMG_H + "px";
  platno.style.transform = "translate("+S.tx+"px,"+S.ty+"px) scale("+S.k+")";
  platno.style.setProperty("--inv", 1/S.k);
  if (glatko) setTimeout(function(){ platno.classList.remove("glatko"); }, 320);
}

/* Traka za upis pokriva vrh scene dok je otvorena, pa slika tada živi ispod
   nje: kad je niža od preostalog prostora, u njemu se centrira; kad je viša,
   smije se pomicati sve do te granice. Bez toga bi pojam pri vrhu slike ostao
   zauvijek skriven ispod trake — a zumirati ga ne smijemo. */
function gornjiOdmak(){
  return upis.classList.contains("vidi") ? upis.offsetHeight : 0;
}
function granice(){
  var vw = scena.clientWidth, vh = scena.clientHeight, gore = gornjiOdmak();
  var dw = IMG_W*S.k, dh = IMG_H*S.k, vhu = vh - gore;
  S.tx = dw <= vw ? (vw-dw)/2 : stisni(S.tx, vw-dw, 0);
  S.ty = dh <= vhu ? gore + (vhu-dh)/2 : stisni(S.ty, vh-dh, gore);
}

function postavi(){
  var vw = scena.clientWidth, vh = scena.clientHeight;
  if (!vw || !vh) return;
  var uklopi = Math.min(vw/IMG_W, vh/IMG_H);
  var portret = vh > vw*0.95;
  /* na mobitelu je slika po defaultu zumirana i zauzima većinu zaslona */
  kpocetni = portret ? Math.max(uklopi, (vh*0.86)/IMG_H) : uklopi;
  kmin = uklopi * 0.9;
  kmax = Math.max(uklopi*4, kpocetni*2.6);
}

function pocetniPogled(){
  postavi();
  S.k = kpocetni;
  var vw = scena.clientWidth, vh = scena.clientHeight;
  S.tx = (vw - IMG_W*S.k)/2;
  S.ty = (vh - IMG_H*S.k)/2;
  granice(); primijeni(false);
}

/* Zumiranje je u rukama igrača — klik ga nikad ne mijenja. Jedino što klik smije
   je gurnuti pogled toliko da obasjani pojam ne ostane ispod trake za upis ili
   ispod tipkovnice; mjerilo ostaje isto. */
function uvidik(p, glatko){
  if (!p) return;
  var vw = scena.clientWidth, vh = scena.clientHeight;
  var gore = gornjiOdmak() + 10;
  var l = p.x/100*IMG_W*S.k + S.tx,            t = p.y/100*IMG_H*S.k + S.ty;
  var r = (p.x+p.w)/100*IMG_W*S.k + S.tx,      b = (p.y+p.h)/100*IMG_H*S.k + S.ty;
  var dx = 0, dy = 0;
  if (r > vw-10) dx = (vw-10) - r;
  if (l + dx < 10) dx = 10 - l;
  if (b > vh-10) dy = (vh-10) - b;
  if (t + dy < gore) dy = gore - t;
  if (!dx && !dy) return;
  S.tx += dx; S.ty += dy;
  granice(); primijeni(glatko !== false);
}

/* ───────────── zumiranje na zahtjev ───────────── */
function zumiraj(faktor, sx, sy){
  var cilj = stisni(S.k*faktor, kmin, kmax);
  if (cilj === S.k) return;
  if (sx == null){ sx = scena.clientWidth/2; sy = scena.clientHeight/2; }
  S.tx = sx - (sx - S.tx)*(cilj/S.k);
  S.ty = sy - (sy - S.ty)*(cilj/S.k);
  S.k = cilj;
  granice(); primijeni(true);
  if (S.aktivan) setTimeout(function(){ uvidik(S.aktivan); }, 300);
}

/* ───────────── pogađanje ───────────── */
function pogodi(kx, ky){
  var r = scena.getBoundingClientRect();
  var ix = (kx - r.left - S.tx)/S.k / IMG_W * 100;
  var iy = (ky - r.top  - S.ty)/S.k / IMG_H * 100;
  var nadjen = null;
  POJMOVI.forEach(function(p){
    if (S.rijeseni[p.id]) return;
    if (ix >= p.x && ix <= p.x+p.w && iy >= p.y && iy <= p.y+p.h){
      if (!nadjen || p.povrsina < nadjen.povrsina) nadjen = p;
    }
  });
  return nadjen;
}

function mimo(kx, ky){
  var r = scena.getBoundingClientRect();
  var d = document.createElement("div");
  d.className = "mimo";
  d.style.left = (kx-r.left)+"px"; d.style.top = (ky-r.top)+"px";
  scena.appendChild(d);
  setTimeout(function(){ d.remove(); }, 520);
}

function otvori(p){
  if (S.aktivan) S.aktivan.el.classList.remove("aktivan");
  S.aktivan = p;
  p.el.classList.add("aktivan");
  upis.classList.add("vidi");
  upis.classList.remove("krivo");
  natuknica.textContent = "Type it in Croatian";
  polje.value = "";
  polje.focus();
  granice(); primijeni(true);      /* slika sjeda ispod trake */
  uvidik(p);
}

function zatvori(){
  if (S.aktivan) S.aktivan.el.classList.remove("aktivan");
  S.aktivan = null;
  upis.classList.remove("vidi");
  polje.blur();
  granice(); primijeni(true);
}

function javi(t, vrsta){
  poruka.textContent = t;
  poruka.className = "poruka vidi" + (vrsta ? " "+vrsta : "");
  clearTimeout(javi._t);
  javi._t = setTimeout(function(){ poruka.className = "poruka"; }, 1600);
}

upis.addEventListener("submit", function(e){
  e.preventDefault();
  var p = S.aktivan; if (!p) return;
  var u = ocisti(polje.value);
  if (!u) return;
  var dobro = p.o.some(function(o){ return ocisti(o) === u; });
  if (dobro){
    S.rijeseni[p.id] = 1;
    spremi();
    p.el.classList.remove("aktivan");
    var n = osvjeziStanja();
    zatvori();
    javi("Correct!", "dobro");
    if (n === POJMOVI.length) setTimeout(kraj, 700);
  } else {
    upis.classList.remove("krivo");
    void upis.offsetWidth;
    upis.classList.add("krivo");
    natuknica.textContent = "Not that one — try again";
    polje.select();
  }
});

$("#gZatvori").addEventListener("click", zatvori);

/* ───────────── signal: svi neriješeni, s lijeva na desno ───────────── */
var signalRadi = false;

function bljesak(p){
  p.el.classList.remove("signal"); void p.el.offsetWidth;
  p.el.classList.add("signal");
  setTimeout(function(){ p.el.classList.remove("signal"); }, 900);
}

function signal(){
  if (signalRadi) return;
  var ostali = POJMOVI.filter(function(p){ return !S.rijeseni[p.id]; })
                      .sort(function(a,b){ return a.sredinaX - b.sredinaX; });
  if (!ostali.length){ javi("Everything found!", "dobro"); return; }
  zatvori();
  signalRadi = true;

  var vw = scena.clientWidth, vh = scena.clientHeight;
  S.k = Math.min(S.k, kpocetni);                 /* ne prelijeći u punom zumu */
  var dw = IMG_W*S.k;
  granice();

  /* cijela slika stane — samo kaskada s lijeva na desno */
  if (dw <= vw + 2){
    S.tx = (vw-dw)/2; granice(); primijeni(true);
    ostali.forEach(function(p,i){ setTimeout(function(){ bljesak(p); }, 320 + i*120); });
    setTimeout(function(){ signalRadi = false; }, 320 + ostali.length*120 + 900);
    return;
  }

  /* slika je šira od zaslona — jedan prelet s lijeva na desno */
  var poc = 0, kra = vw - dw;                    /* tx ide 0 → negativno */
  S.tx = poc; granice(); primijeni(true);
  var T = stisni((dw/vw)*1400, 2200, 5200);

  /* trenutak bljeska svakog pojma: kad dođe na sredinu zaslona */
  var crta = vw*0.5;
  var raspored = ostali.map(function(p){
    var treba = crta - p.sredinaX/100*IMG_W*S.k;  /* tx pri kojem je na crti */
    var u = stisni(treba/kra, 0, 1);
    return {p:p, t:u*T};
  });
  for (var i=1;i<raspored.length;i++)
    if (raspored[i].t < raspored[i-1].t + 95) raspored[i].t = raspored[i-1].t + 95;

  var t0 = 0, prekid = false, zadnji = raspored[raspored.length-1].t;
  function stani(){ prekid = true; }
  scena.addEventListener("pointerdown", stani, {once:true});

  function korak(sad){
    if (prekid){ signalRadi = false; return; }
    if (!t0) t0 = sad;
    var u = stisni((sad-t0)/T, 0, 1);
    S.tx = poc + (kra-poc)*u;
    granice(); primijeni(false);
    var proteklo = sad - t0;
    for (var j=raspored.length-1;j>=0;j--)
      if (proteklo >= raspored[j].t){ bljesak(raspored[j].p); raspored.splice(j,1); }
    if (u < 1 || raspored.length) requestAnimationFrame(korak);
    else setTimeout(function(){
      signalRadi = false;
      scena.removeEventListener("pointerdown", stani);
    }, 900);
  }
  setTimeout(function(){ requestAnimationFrame(korak); }, 330);
  void zadnji;
}
$("#gPokazi").addEventListener("click", signal);
$("#gManje").addEventListener("click", function(){ zumiraj(1/1.35); });
$("#gVise").addEventListener("click", function(){ zumiraj(1.35); });

/* ───────────── pan / zoom / tap ───────────── */
var prsti = new Map(), pocetnaUdaljenost = 0, pocetnoK = 1, pocetnaSredina = null;
var tapPoc = null, zadnjiTap = 0;

scena.addEventListener("pointerdown", function(e){
  scena.setPointerCapture(e.pointerId);
  prsti.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (prsti.size === 1){
    tapPoc = {x:e.clientX, y:e.clientY, t:Date.now()};
    scena.classList.add("vuce");
  } else if (prsti.size === 2){
    tapPoc = null;
    var t = [...prsti.values()];
    pocetnaUdaljenost = Math.hypot(t[0].x-t[1].x, t[0].y-t[1].y) || 1;
    pocetnoK = S.k;
    pocetnaSredina = {x:(t[0].x+t[1].x)/2, y:(t[0].y+t[1].y)/2};
  }
});

scena.addEventListener("pointermove", function(e){
  if (!prsti.has(e.pointerId)) return;
  var prije = prsti.get(e.pointerId);
  prsti.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (prsti.size === 1){
    var dx = e.clientX - prije.x, dy = e.clientY - prije.y;
    if (tapPoc && Math.hypot(e.clientX-tapPoc.x, e.clientY-tapPoc.y) > 10) tapPoc = null;
    S.tx += dx; S.ty += dy;
    granice(); primijeni(false);
  } else if (prsti.size === 2){
    var t = [...prsti.values()];
    var d = Math.hypot(t[0].x-t[1].x, t[0].y-t[1].y) || 1;
    var novo = stisni(pocetnoK * (d/pocetnaUdaljenost), kmin, kmax);
    var r = scena.getBoundingClientRect();
    var sx = pocetnaSredina.x - r.left, sy = pocetnaSredina.y - r.top;
    S.tx = sx - (sx - S.tx) * (novo/S.k);
    S.ty = sy - (sy - S.ty) * (novo/S.k);
    S.k = novo;
    granice(); primijeni(false);
  }
});

function gotov(e){
  if (!prsti.has(e.pointerId)) return;
  prsti.delete(e.pointerId);
  if (prsti.size === 0){
    scena.classList.remove("vuce");
    if (tapPoc && Date.now()-tapPoc.t < 500){
      var sada = Date.now();
      var tp = tapPoc;                       /* tapPoc se briše odmah ispod */
      if (sada - zadnjiTap < 300){ zadnjiTap = 0; dvoklik(tp.x, tp.y); tapPoc = null; return; }
      zadnjiTap = sada;
      setTimeout(function(){
        if (zadnjiTap !== sada) return;
        var p = pogodi(tp.x, tp.y);
        if (p) otvori(p);
        else { zatvori(); mimo(tp.x, tp.y); }
      }, 200);
    }
    tapPoc = null;
  }
}
scena.addEventListener("pointerup", gotov);
scena.addEventListener("pointercancel", gotov);

function dvoklik(kx, ky){
  var r = scena.getBoundingClientRect();
  var cilj = (S.k > kpocetni*1.4) ? kpocetni : Math.min(kmax, kpocetni*2.2);
  zumiraj(cilj/S.k, kx-r.left, ky-r.top);
}

scena.addEventListener("wheel", function(e){
  e.preventDefault();
  var cilj = stisni(S.k * (e.deltaY < 0 ? 1.12 : 1/1.12), kmin, kmax);
  var r = scena.getBoundingClientRect();
  var sx = e.clientX-r.left, sy = e.clientY-r.top;
  S.tx = sx - (sx - S.tx)*(cilj/S.k);
  S.ty = sy - (sy - S.ty)*(cilj/S.k);
  S.k = cilj;
  granice(); primijeni(false);
}, {passive:false});

document.addEventListener("keydown", function(e){
  if (e.key === "Escape") { zatvori(); zastor.classList.remove("vidi"); }
});

/* ───────────── tipkovnica / visina ───────────── */
function visina(){
  var v = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  document.documentElement.style.setProperty("--visina", v + "px");
  granice(); primijeni(false);
}
if (window.visualViewport){
  window.visualViewport.addEventListener("resize", function(){
    visina();
    if (S.aktivan) setTimeout(function(){ if (S.aktivan) uvidik(S.aktivan); }, 60);
  });
}
window.addEventListener("resize", function(){ visina(); postavi(); granice(); primijeni(false); });
window.addEventListener("orientationchange", function(){ setTimeout(pocetniPogled, 260); });

/* ───────────── zastor ───────────── */
function panel(html){ kut.innerHTML = html; zastor.classList.add("vidi"); }
zastor.addEventListener("click", function(e){ if (e.target === zastor) zastor.classList.remove("vidi"); });

function upute(){
  panel(
    '<h3>Tržnica</h3>'+
    '<p>Twenty-two things are hiding in this picture. Tap one — it lights up — then type its Croatian name.</p>'+
    '<ul>'+
      '<li>Diacritics are optional: <b>cokolada</b> counts as <b>čokolada</b>.</li>'+
      '<li>Singular or plural, both fine. Common synonyms too.</li>'+
      '<li>Get it right and the object is ticked off for good.</li>'+
      '<li>Lost? <b>✨ Show</b> flashes everything still missing, left to right.</li>'+
      '<li>Zoom is yours: pinch, double-tap or the \u2212 / + buttons. Tapping an object never changes it.</li>'+
      '<li>Drag to move around the picture.</li>'+
    '</ul>'+
    '<button class="g glavni" id="_z">Got it</button>'+
    '<button class="g" id="_r">Start over</button>'
  );
  $("#_z").onclick = function(){ zastor.classList.remove("vidi"); };
  $("#_r").onclick = function(){
    if (!confirm("Clear all found words?")) return;
    S.rijeseni = {}; spremi(); osvjeziStanja();
    zastor.classList.remove("vidi"); pocetniPogled();
  };
}
$("#gInfo").addEventListener("click", upute);

function kraj(){
  konfeti();
  panel(
    '<h3>All twenty-two!</h3>'+
    '<p>You named every object on the market stall. That is a whole week of vocabulary in one picture.</p>'+
    '<button class="g glavni" id="_z">Nice</button>'+
    '<button class="g" id="_r">Play again</button>'
  );
  $("#_z").onclick = function(){ zastor.classList.remove("vidi"); };
  $("#_r").onclick = function(){
    S.rijeseni = {}; spremi(); osvjeziStanja();
    zastor.classList.remove("vidi"); pocetniPogled();
  };
}

function konfeti(){
  var boje = ["#F4B942","#E8623A","#2FA8A0","#7B5EA7","#7CB342","#3E7CB1"];
  for (var i=0;i<70;i++){
    (function(i){
      var d = document.createElement("i");
      d.className = "konfet";
      d.style.background = boje[i % boje.length];
      d.style.left = (Math.random()*100) + "vw";
      d.style.top = "-20px";
      d.style.transform = "rotate("+(Math.random()*360)+"deg)";
      document.body.appendChild(d);
      var trajanje = 1600 + Math.random()*1400;
      d.animate(
        [{transform:"translateY(0) rotate(0deg)",opacity:1},
         {transform:"translateY("+(window.innerHeight+60)+"px) rotate("+(560+Math.random()*560)+"deg)",opacity:.9}],
        {duration:trajanje, easing:"cubic-bezier(.3,.7,.6,1)"}
      ).onfinish = function(){ d.remove(); };
    })(i);
  }
}

/* ───────────── start ───────────── */
function start(){
  visina();
  pocetniPogled();
  osvjeziStanja();
  if (!localStorage.getItem(KLJUC+".vidio")){
    try{ localStorage.setItem(KLJUC+".vidio","1"); }catch(e){}
    upute();
  }
}

  platno.style.background = "var(--papir2)";

});
})();
