<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="light">
<title>Croland — The Tavern</title>
<style>

*{box-sizing:border-box;margin:0;padding:0}
:root{
  --papir:#FFF8F0; --papir2:#FFEFE0; --tinta:#2B2118; --meko:#8B7B6B;
  --zut:#F4B942; --koralj:#E8623A; --tirkiz:#2FA8A0; --ljub:#7B5EA7;
  --zelena:#7CB342; --plava:#3E7CB1; --crta:3px solid #2B2118;
  --sjena:0 4px 0 #2B2118;
}
/* Dokument je visok tocno koliko mu treba, ne koliko je visok okvir. Tako
   aplikacija moze okvir izjednaciti sa sadrzajem i klizac ostaje samo jedan —
   onaj glavne stranice. Visina se mijenja kad se promijeni i sam sadrzaj
   (uvod je nizak, igra visa), i to je u redu. */
body{
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  background:var(--papir); color:var(--tinta);
  -webkit-font-smoothing:antialiased; overscroll-behavior:none;
  background-image:radial-gradient(rgba(43,33,24,.045) 1px,transparent 1px);
  background-size:22px 22px;
}
.omot{max-width:1000px;margin:0 auto;padding:14px 14px 40px;display:flex;flex-direction:column}
/* ---- HUD ---- */
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:#fff;border:var(--crta);border-radius:16px;box-shadow:var(--sjena);
  padding:10px 14px;margin-bottom:14px}
.hud .ime{font-weight:800;font-size:18px;letter-spacing:.2px;margin-right:auto}
.hud .ime small{display:block;font-weight:600;font-size:11px;color:var(--meko);letter-spacing:.6px;text-transform:uppercase}
.znak{display:inline-flex;align-items:center;gap:6px;background:var(--papir2);
  border:2px solid var(--tinta);border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.znak.srca{background:#FFE3E3}
/* ---- ploha ---- */
.ploha{background:#fff;border:var(--crta);border-radius:20px;box-shadow:var(--sjena);
  padding:18px;flex:1;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
h2.naslov{font-size:22px;font-weight:800}
p.uputa{font-size:15px;color:var(--meko);line-height:1.5}
.sredina{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;flex:1;text-align:center}
/* ---- gumbi ---- */
.g{font:inherit;font-weight:700;font-size:15px;cursor:pointer;border:var(--crta);
  border-radius:14px;background:#fff;padding:11px 18px;box-shadow:0 4px 0 var(--tinta);
  transition:transform .06s,box-shadow .06s;color:var(--tinta)}
.g:hover{background:var(--papir2)}
.g:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tinta)}
.g.glavni{background:var(--zut)}
.g.veliki{font-size:18px;padding:14px 28px}
.g[disabled]{opacity:.45;cursor:default;transform:none;box-shadow:0 4px 0 var(--tinta)}
.g.tocno{background:var(--zelena);color:#fff}
.g.krivo{background:var(--koralj);color:#fff}
/* ---- kartice / slike ---- */
.slikaOkvir{position:relative;display:inline-flex;align-items:center;justify-content:center;
  background:var(--papir2);border-radius:14px;overflow:hidden}
.slikaOkvir img{width:100%;height:100%;object-fit:contain;display:block}
.slikaOkvir .zamjena{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:60%;line-height:1}
.mrlja-hrana,.mrlja-pice{background:#DCEEFF}
.mrlja-zivotinja,.mrlja-osoba{background:#FFE0C4}
.mrlja-mjesto,.mrlja-predmet,.mrlja-prijevoz,.mrlja-odjeca,.mrlja-priroda{background:#DCEEFF}
.mrlja-vrijeme,.mrlja-skola,.mrlja-sport,.mrlja-tijelo{background:#E9DEF7}
.mrlja-glagol{background:#E2F3CE}
.mrlja-pridjev,.mrlja-boja,.mrlja-broj{background:#FFE0DC}
/* ---- mreža ---- */
.mreza{display:grid;gap:12px}
/* ---- poruke ---- */
.poruka{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:var(--tinta);color:#fff;padding:10px 20px;border-radius:999px;font-weight:700;
  opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
.poruka.vidi{opacity:1;transform:translateX(-50%) translateY(0)}
.poruka.dobro{background:var(--zelena)}
.poruka.lose{background:var(--koralj)}
/* ---- zastor ---- */
.zastor{position:fixed;inset:0;background:rgba(43,33,24,.72);display:flex;align-items:center;
  justify-content:center;padding:20px;z-index:80}
.zastor .kut{background:var(--papir);border:var(--crta);border-radius:22px;box-shadow:0 8px 0 rgba(0,0,0,.35);
  padding:26px;max-width:460px;width:100%;text-align:center;max-height:88vh;overflow:auto}
.zastor h3{font-size:26px;margin-bottom:8px}
.zastor p{color:var(--meko);line-height:1.55;margin-bottom:14px;font-size:15px}
.valute{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.valuta{border:2px solid var(--tinta);border-radius:12px;padding:8px 12px;background:#fff;min-width:66px}
.valuta b{display:block;font-size:20px}
.valuta span{font-size:11px;color:var(--meko);font-weight:700;letter-spacing:.5px}
/* ---- traka napretka ---- */
.napredak{height:12px;background:var(--papir2);border:2px solid var(--tinta);border-radius:999px;overflow:hidden}
.napredak i{display:block;height:100%;background:var(--zut);width:0;transition:width .3s}
/* ---- razno ---- */
.tresi{animation:tresi .3s}
@keyframes tresi{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.skok{animation:skok .35s}
@keyframes skok{0%,100%{transform:scale(1)}45%{transform:scale(1.14)}}
.blijedi{animation:blijedi .3s}
@keyframes blijedi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.konfet{position:fixed;width:10px;height:14px;z-index:90;pointer-events:none;border-radius:2px}
input.upis{font:inherit;font-size:20px;font-weight:700;text-align:center;padding:12px 16px;
  border:var(--crta);border-radius:14px;background:#fff;width:min(380px,90%);color:var(--tinta)}
input.upis:focus{outline:none;background:var(--papir2)}
.tipke{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.dijakritik{font:inherit;font-weight:700;font-size:16px;cursor:pointer;border:2px solid var(--tinta);
  border-radius:10px;background:#fff;width:38px;height:38px}
.dijakritik:hover{background:var(--zut)}
@media (max-width:640px){
  .omot{padding:6px 6px 16px}
  .hud{padding:6px 8px;gap:6px;margin-bottom:8px}
  .hud .ime{font-size:15px}
  .hud .ime small{display:none}
  .znak{padding:3px 9px;font-size:12px}
  .ploha{padding:10px;border-radius:14px;gap:8px}
  h2.naslov{font-size:18px}
}

/*[CL-STIL]*/
/* ==== Zajednički pixel stil (CL-STIL) ====
   Izvor: _sadrzaj/stil.css — u igre ga ubacuje `node _sadrzaj/ugradi.js`.
   Mijenja samo izgled zajedničkih dijelova (HUD, ploha, gumbi, zastor…);
   raspored, veličine polja i ponašanje igre ostaju isti.
   Fontovi i okviri su lokalne datoteke — sve radi bez interneta.
   Pixel font samo za naslove, brojke i kratke oznake; riječi i rečenice
   ostaju u čitljivom fontu (Nunito). */
@font-face{font-family:"Pixelify Sans";src:url("mini games media/font-pixelify-sans.ttf") format("truetype");
  font-weight:400 700;font-display:swap}
@font-face{font-family:"Nunito";src:url("mini games media/font-nunito.ttf") format("truetype");
  font-weight:200 1000;font-display:swap}
:root{
  --pix:"Pixelify Sans","Nunito","Segoe UI",system-ui,sans-serif;
  --tekst:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  --okvir:#6D4B27; --okvir2:#C58747; --krem:#FFF1D2;
  --px:3px;
}
body{font-family:var(--tekst);
  background-color:var(--papir);
  background-image:linear-gradient(rgba(109,75,39,.07) 2px,transparent 2px),
                   linear-gradient(90deg,rgba(109,75,39,.07) 2px,transparent 2px);
  background-size:24px 24px}
img.px,.px img,canvas.px{image-rendering:pixelated}
/* pixel „kutija“: kutovi odsječeni za jedan piksel-korak, bez zaobljenja */
.hud,.ploha,.zastor .kut{border-radius:0;box-shadow:none;border:16px solid transparent;
  border-image:url("mini games media/ui-okvir.png") 8 fill / 16px stretch;
  image-rendering:pixelated;background:transparent}
.hud{padding:2px 6px}
.ploha{padding:6px}
.zastor .kut{padding:12px 14px;background:transparent}
.hud .ime,h2.naslov,.zastor h3{font-family:var(--pix);font-weight:700;letter-spacing:.3px}
.hud .ime small{font-family:var(--tekst)}
.znak,.valuta,.napredak,.poruka,input.upis,.dijakritik,.slikaOkvir{border-radius:0}
.znak{font-family:var(--pix);font-weight:600;background:var(--krem);border:0;
  box-shadow:0 -2px 0 var(--tinta),0 2px 0 var(--tinta),-2px 0 0 var(--tinta),2px 0 0 var(--tinta);margin:2px}
.znak.srca{background:#FFE3E3}
.valuta{border:0;box-shadow:0 -2px 0 var(--tinta),0 2px 0 var(--tinta),-2px 0 0 var(--tinta),2px 0 0 var(--tinta);margin:2px}
.valuta b{font-family:var(--pix)}
/* gumbi: pixel rub (odsječeni kutovi) + tvrda sjena ispod */
.g{border:0;border-radius:0;margin:3px;
  box-shadow:0 calc(-1*var(--px)) 0 var(--tinta),calc(-1*var(--px)) 0 0 var(--tinta),var(--px) 0 0 var(--tinta),
             0 var(--px) 0 var(--tinta),0 calc(2*var(--px)) 0 var(--okvir),inset 0 calc(-1*var(--px)) 0 rgba(0,0,0,.12)}
.g:active{transform:translateY(var(--px));
  box-shadow:0 calc(-1*var(--px)) 0 var(--tinta),calc(-1*var(--px)) 0 0 var(--tinta),var(--px) 0 0 var(--tinta),
             0 var(--px) 0 var(--tinta)}
.g[disabled]{transform:none;
  box-shadow:0 calc(-1*var(--px)) 0 var(--tinta),calc(-1*var(--px)) 0 0 var(--tinta),var(--px) 0 0 var(--tinta),
             0 var(--px) 0 var(--tinta),0 calc(2*var(--px)) 0 var(--okvir)}
.g.glavni,.g.veliki{font-family:var(--pix);font-weight:600;letter-spacing:.3px}
.zastor .g{font-family:var(--pix);font-weight:600}
.poruka{font-family:var(--pix);font-weight:600;
  box-shadow:0 -3px 0 var(--tinta),0 3px 0 var(--tinta),-3px 0 0 var(--tinta),3px 0 0 var(--tinta)}
.napredak{height:14px;border:0;background:var(--krem);margin:3px;
  box-shadow:0 -3px 0 var(--tinta),0 3px 0 var(--tinta),-3px 0 0 var(--tinta),3px 0 0 var(--tinta)}
.napredak i{background:repeating-linear-gradient(90deg,var(--zut) 0 10px,#E0A52F 10px 12px)}
input.upis{border:0;margin:3px;font-family:var(--tekst);
  box-shadow:0 -3px 0 var(--tinta),0 3px 0 var(--tinta),-3px 0 0 var(--tinta),3px 0 0 var(--tinta)}
.dijakritik{font-family:var(--tekst)}
.slikaOkvir{border-radius:4px}
.zastor{background:rgba(43,33,24,.78)}
.konfet{border-radius:0}
@media (max-width:640px){
  .hud,.ploha,.zastor .kut{border-width:12px;border-image-width:12px}
  .hud{padding:0 4px}
  .ploha{padding:2px}
}
/*[/CL-STIL]*/

/* ==== Konoba ====
   Raspored: gore dva stola (uvijek ista visina), dolje pult. Pločice na
   pultu su kvadratne i velike koliko ekran dopušta (računa rasporediPult). */

.konobaOmot{display:flex;flex-direction:column;gap:10px}

/* stolovi */
.gosti{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;margin:-2px;
  background:url("mini games media/konoba-interijer.png") center bottom/cover,
    linear-gradient(#C58747 0 0) bottom/100% 6px no-repeat,
    repeating-linear-gradient(90deg,#8A5A2E 0 46px,#7A4E27 46px 48px);
  image-rendering:pixelated}
.stolMjesto{height:var(--visinaStola,150px);min-width:0;padding:3px}
.prazanStol{height:100%;background:rgba(255,241,210,.18);
  box-shadow:0 -2px 0 rgba(43,33,24,.25),0 2px 0 rgba(43,33,24,.25),-2px 0 0 rgba(43,33,24,.25),2px 0 0 rgba(43,33,24,.25)}
.gost{height:100%;display:flex;flex-direction:column;gap:5px;padding:8px 10px;background:var(--krem);
  box-shadow:0 -3px 0 var(--tinta),0 3px 0 var(--tinta),-3px 0 0 var(--tinta),3px 0 0 var(--tinta),0 7px 0 rgba(43,33,24,.45);
  animation:blijedi .25s}
.gost.gotov{background:#DFF3D2}
.gost.ljut{background:#FBDCD5}
.gostVrh{display:flex;align-items:center;gap:7px;flex:none;min-width:0}
.gost .stol{font-family:var(--pix);font-weight:600;font-size:13px;letter-spacing:.5px;text-transform:uppercase;
  color:var(--koralj);white-space:nowrap}
.tipZnak{margin-left:auto;font-size:16px;line-height:1}
.gostLik{flex:none;width:40px;height:40px;background:url("mini games media/konoba-gosti.png") 0 0/480px 40px no-repeat;
  background-position:calc(var(--gi) * -40px) 0;image-rendering:pixelated}
.gostLik b{font-size:0}
.gostLik.zrcalo{transform:scaleX(-1)}
.gostTekst{flex:1;min-height:0;overflow:hidden;--vel:17px}
.gost .narudzba{font-size:var(--vel);font-weight:700;line-height:1.28}
.gost .prijevodG{font-size:calc(var(--vel) * .8);color:var(--meko);margin-top:4px;line-height:1.3}
.bezPrijevoda{font-size:.92em}
.gostDno{display:flex;align-items:center;gap:6px;flex:none;height:24px}
.gost .strpljenje{flex:1;height:10px;background:var(--papir2);border:2px solid var(--tinta);overflow:hidden}
.gost .strpljenje i{display:block;height:100%;width:100%;transition:width .3s linear}
.doneseno{display:flex;gap:3px;flex:none}
.doneseno .mini{position:relative;display:block;width:24px;height:24px;background:#fff;
  box-shadow:0 0 0 2px var(--tinta)}
.doneseno .mini img{width:100%;height:100%;object-fit:contain;display:block}
.doneseno .mini b{display:none}
.doneseno .mini.bezSlike b{display:flex;position:absolute;inset:0;align-items:center;justify-content:center;font-size:16px;font-weight:400}

/* pult */
.pult{border:12px solid transparent;border-radius:0;padding:6px;
  border-image:url("mini games media/ui-okvir-tamni.png") 8 fill / 12px stretch;image-rendering:pixelated}
.jela{display:grid;grid-auto-flow:column;gap:var(--razmak,8px);justify-content:center;
  grid-template-columns:repeat(4,var(--plocica,72px))}
.jelo{width:var(--plocica,72px);height:var(--plocica,72px);display:block;padding:3px;margin:0;border:0;border-radius:0;
  background:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
  box-shadow:0 -2px 0 var(--tinta),0 2px 0 var(--tinta),-2px 0 0 var(--tinta),2px 0 0 var(--tinta),0 5px 0 rgba(0,0,0,.45)}
.jelo:active{transform:translateY(2px);
  box-shadow:0 -2px 0 var(--tinta),0 2px 0 var(--tinta),-2px 0 0 var(--tinta),2px 0 0 var(--tinta)}
.jelo.dobro{box-shadow:0 0 0 4px var(--zelena),0 5px 0 rgba(0,0,0,.45)}
.slikaJela{position:relative;display:block;width:100%;height:100%;pointer-events:none}
.slikaJela img{width:100%;height:100%;object-fit:contain;display:block;-webkit-user-drag:none;user-select:none}
.slikaJela b{display:none}
.slikaJela.bezSlike b{display:flex;position:absolute;inset:0;align-items:center;justify-content:center;
  font-weight:400;font-size:calc(var(--plocica,72px) * .58);line-height:1}
/* hover samo gdje postoji miš — na mobitelu se boja ne "zalijepi" nakon dodira */
@media (hover:hover){
  .jelo:hover{box-shadow:0 0 0 4px var(--zut),0 5px 0 rgba(0,0,0,.45)}
}

/* mobitel: tanji okviri i manji razmaci, da pultu ostane što više mjesta */
@media (max-width:640px){
  .omot{padding:4px 4px 6px}
  .hud,.ploha{border-width:8px;border-image-width:8px}
  .hud{margin-bottom:4px;padding:0 2px;flex-wrap:nowrap;gap:3px}
  /* HUD u jednom redu, inače bi narastao čim brojke postanu dvoznamenkaste */
  .hud .ime{font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hud .znak{padding:2px 5px;font-size:11.5px;gap:3px;flex:none}
  .ploha{padding:0}
  .ploha{gap:0}
  .konobaOmot{gap:6px}
  .gosti{gap:4px;padding:4px;--visinaStola:150px}
  .stolMjesto{padding:3px}
  .gost{padding:6px 7px;gap:3px}
  .gost .stol{font-size:11px}
  .tipZnak{font-size:14px}
  .gostLik{width:28px;height:28px;background-size:336px 28px;background-position:calc(var(--gi) * -28px) 0}
  .gostDno{height:20px}
  .doneseno .mini{width:18px;height:18px}
  .doneseno .mini.bezSlike b{font-size:12px}
  .pult{border-width:8px;border-image-width:8px;padding:4px}
}

/* poruke idu na vrh (preko HUD-a), da ne prekrivaju pult dok se klika */
.poruka{top:8px;bottom:auto;transform:translateX(-50%) translateY(-12px)}
.poruka.vidi{transform:translateX(-50%) translateY(0)}
@media (max-width:640px){ .poruka{top:2px;font-size:13px;padding:7px 14px} }
</style>
<script>
/* Igra u aplikaciji ide u okvir (iframe). Tada otpada poveznica na popis igara
   — gornji izbornik aplikacije već vodi na isto mjesto. */
</script>
</head>
<body>
<div class="omot" id="omot"></div>
<script>
window.IGRA_ID = "konoba";
/* Bodovi: linearno po ucinjenom, strop 1500. Broji se najbolja partija — slabija
   ne oduzima nista. Beskonacni nacin je uklonjen: tko dosegne strop, krece ispocetka
   ako zeli. window.IGRA_MAKS mora biti jednak `maks` u MINI_IGRE (korijenski index.html). */
window.IGRA_MAKS = 1500;
// 10 bodova po izdanoj narudzbi; 150 narudzbi nosi puni iznos.
function bodoviKonobe(){ return Math.min(window.IGRA_MAKS, (typeof S !== 'undefined' && S && S.bodovi) || 0); }

/* =========================================================================
   Croland mini igre — zajednička jezgra
   Standalone: ne ovisi ni o jednoj datoteci projekta.
   Mediji se traže u mapi "mini games media/"; ako ih nema, igra radi na
   ugrađenim zamjenskim znakovima (emoji), pa je prototip odmah igriv.
   ========================================================================= */
var CL = (function () {
  var MEDIJ = 'mini games media/';

  var DIJALOZI = [{"id":"kafic","mjesto":"Kafić","emo":"☕","razina":2,"redci":[["npc","Dobar dan! Izvolite?","Good afternoon! What would you like?"],["ti","Dobar dan. Jednu veliku kavu, molim.","Good afternoon. One large coffee, please."],["npc","S mlijekom ili bez?","With milk or without?"],["ti","S mlijekom, hvala.","With milk, thank you."],["npc","Odmah stiže. Želite li nešto slatko?","Coming right up. Would you like something sweet?"],["ti","Može jedan kolač.","A pastry would be nice."],["npc","Izvolite. Ugodan dan!","Here you are. Have a nice day!"]]},{"id":"pekara","mjesto":"Pekara","emo":"🥖","razina":2,"redci":[["npc","Dobro jutro! Što će biti?","Good morning! What will it be?"],["ti","Dobro jutro. Trebam kruh i dva peciva.","Good morning. I need bread and two rolls."],["npc","Bijeli ili crni kruh?","White or brown bread?"],["ti","Crni, molim. Je li svjež?","Brown, please. Is it fresh?"],["npc","Jutros pečen. Još nešto?","Baked this morning. Anything else?"],["ti","To je sve. Koliko košta?","That is all. How much is it?"],["npc","Četiri eura, molim.","Four euros, please."]]},{"id":"trznica","mjesto":"Tržnica","emo":"🏪","razina":3,"redci":[["npc","Izvolite, gospodine! Rajčice su danas odlične.","Here you go, sir! The tomatoes are excellent today."],["ti","Koliko košta kilogram?","How much is a kilogram?"],["npc","Dva eura. Domaće su, iz mog vrta.","Two euros. They are home-grown, from my garden."],["ti","Uzet ću kilogram rajčica i pola kile paprika.","I will take a kilo of tomatoes and half a kilo of peppers."],["npc","Odmah. Trebate li još povrća?","Right away. Do you need any more vegetables?"],["ti","Ne, hvala. To je dovoljno za danas.","No, thank you. That is enough for today."],["npc","Hvala vam i doviđenja!","Thank you and goodbye!"]]},{"id":"kolodvor","mjesto":"Kolodvor","emo":"🚉","razina":3,"redci":[["npc","Dobar dan, kamo putujete?","Good afternoon, where are you travelling?"],["ti","U Split. Kada polazi sljedeći vlak?","To Split. When does the next train leave?"],["npc","U petnaest i trideset, s perona četiri.","At half past three, from platform four."],["ti","Koliko traje vožnja?","How long does the ride take?"],["npc","Otprilike šest sati.","About six hours."],["ti","Onda jednu kartu u jednom smjeru, molim.","Then one one-way ticket, please."],["npc","Izvolite kartu. Sretan put!","Here is your ticket. Have a good trip!"]]},{"id":"hotel","mjesto":"Hotel","emo":"🏨","razina":3,"redci":[["npc","Dobra večer, imate li rezervaciju?","Good evening, do you have a reservation?"],["ti","Da, na ime Marić. Soba za dvije noći.","Yes, under the name Marić. A room for two nights."],["npc","Našao sam. Soba dvjesto sedam, na drugom katu.","Found it. Room two hundred and seven, on the second floor."],["ti","Je li doručak uključen u cijenu?","Is breakfast included in the price?"],["npc","Jest, od sedam do deset ujutro.","Yes, from seven to ten in the morning."],["ti","Odlično. Ima li soba pogled na more?","Excellent. Does the room have a sea view?"],["npc","Ima. Evo vašeg ključa, ugodan boravak!","It does. Here is your key, enjoy your stay!"]]},{"id":"restoran","mjesto":"Restoran","emo":"🍽","razina":3,"redci":[["npc","Dobra večer! Stol za koliko osoba?","Good evening! A table for how many?"],["ti","Za dvoje, molim. Pored prozora ako može.","For two, please. By the window if possible."],["npc","Naravno. Evo jelovnika.","Of course. Here is the menu."],["ti","Što preporučujete?","What do you recommend?"],["npc","Svježa riba je danas izvrsna.","The fresh fish is excellent today."],["ti","Uzet ćemo ribu i veliku salatu.","We will take the fish and a big salad."],["npc","Odličan izbor. Za piće?","Excellent choice. And to drink?"],["ti","Jednu bocu vode i čašu bijelog vina.","A bottle of water and a glass of white wine."]]},{"id":"apoteka","mjesto":"Apoteka","emo":"💊","razina":4,"redci":[["npc","Dobar dan, kako vam mogu pomoći?","Good afternoon, how can I help you?"],["ti","Boli me grlo već tri dana.","My throat has hurt for three days."],["npc","Imate li i temperaturu?","Do you also have a fever?"],["ti","Jučer sam imao, danas mi je bolje.","I had one yesterday, today I feel better."],["npc","Onda probajte ove pastile. Tri puta na dan.","Then try these lozenges. Three times a day."],["ti","Trebam li recept?","Do I need a prescription?"],["npc","Ne trebate. Ako se ne popravi, idite liječniku.","You do not. If it does not improve, see a doctor."]]},{"id":"susjed","mjesto":"Kod susjeda","emo":"🏘","razina":4,"redci":[["npc","Bok! Dugo se nismo vidjeli.","Hi! We have not seen each other for a long time."],["ti","Bok! Bio sam mjesec dana u Italiji.","Hi! I was in Italy for a month."],["npc","Sjajno! Kako je bilo?","Great! How was it?"],["ti","Odlično, iako je bilo jako vruće.","Excellent, although it was very hot."],["npc","A hrana? Jesi li jeo dobro?","And the food? Did you eat well?"],["ti","Previše dobro — vratio sam se pet kila teži!","Too well — I came back five kilos heavier!"],["npc","Ha-ha! Onda idemo trčati sutra ujutro.","Ha-ha! Then let us go running tomorrow morning."]]},{"id":"ured","mjesto":"Ured","emo":"🏢","razina":4,"redci":[["npc","Dobro jutro, jeste li dobili moju poruku?","Good morning, did you get my message?"],["ti","Jesam, ali nisam stigao odgovoriti.","I did, but I did not get around to replying."],["npc","Nema problema. Možemo li se naći u dva?","No problem. Can we meet at two?"],["ti","U dva imam drugi sastanak. Može li u tri?","At two I have another meeting. Could we do three?"],["npc","Može. Trebam li nešto pripremiti?","That works. Should I prepare anything?"],["ti","Samo brojke za ovaj mjesec.","Just the figures for this month."],["npc","U redu, vidimo se u tri.","All right, see you at three."]]},{"id":"skola","mjesto":"Škola","emo":"🏫","razina":5,"redci":[["npc","Kako napreduje tvoj hrvatski?","How is your Croatian coming along?"],["ti","Bolje nego što sam očekivao, ali padeži su mi teški.","Better than I expected, but the cases are hard for me."],["npc","Svima su na početku. Čitaš li nešto na hrvatskom?","They are for everyone at the start. Do you read anything in Croatian?"],["ti","Čitam kratke priče i gledam vijesti s titlovima.","I read short stories and watch the news with subtitles."],["npc","To je najbolji način. Što više slušaš, to prije progovoriš.","That is the best way. The more you listen, the sooner you will speak."],["ti","Nadam se da ću do ljeta govoriti bez razmišljanja.","I hope that by summer I will speak without thinking."],["npc","Hoćeš, samo nastavi. Vježba čini majstora.","You will, just keep going. Practice makes perfect."]]},{"id":"plaza","mjesto":"Plaža","emo":"🏖","razina":5,"redci":[["npc","Je li ovo mjesto slobodno?","Is this spot free?"],["ti","Jest, slobodno sjednite.","It is, please sit down."],["npc","Hvala. Prekrasan dan, zar ne?","Thank you. A beautiful day, is it not?"],["ti","Predivan. More je toplije nego prošli tjedan.","Wonderful. The sea is warmer than last week."],["npc","Dolazite li često ovamo?","Do you come here often?"],["ti","Kad god imam slobodan dan. Ovdje se najbolje odmorim.","Whenever I have a day off. This is where I rest best."],["npc","Razumijem vas. Nakon mora čovjek je novi.","I understand. After the sea one feels like a new person."]]},{"id":"tvrdjava","mjesto":"Tvrđava","emo":"🏰","razina":5,"redci":[["npc","Dobro došao, putniče. Tražiš li nešto?","Welcome, traveller. Are you looking for something?"],["ti","Tražim ključ koji otvara istočna vrata.","I am looking for the key that opens the eastern gate."],["npc","Taj ključ čuva onaj tko zna tri riječi.","That key is kept by the one who knows three words."],["ti","Reci mi koje su, pa ću ih naučiti.","Tell me which ones and I will learn them."],["npc","Strpljenje, hrabrost i znanje. Sve ostalo dolazi samo.","Patience, courage and knowledge. Everything else comes on its own."],["ti","Onda mi treba još malo vremena.","Then I need a little more time."],["npc","Vrijeme imaš. Vrata te čekaju.","You have time. The gate is waiting for you."]]}];
  var SAVJETI = [["Croatian has no articles — „kuća\" means both „a house\" and „the house\".","Hrvatski nema članova — „kuća\" znači i „a house\" i „the house\"."],["An adjective agrees with its noun: velik grad, velika kuća, veliko more.","Pridjev se slaže s imenicom: velik grad, velika kuća, veliko more."],["Masculine nouns usually end in a consonant, feminine in -a, neuter in -o or -e.","Muški rod najčešće završava na suglasnik, ženski na -a, srednji na -o ili -e."],["In the accusative, feminine -a becomes -u: salata → salatu.","U akuzativu ženski rod mijenja -a u -u: salata → salatu."],["Inanimate masculine nouns do not change in the accusative: vidim stol.","Neživo u muškom rodu ostaje isto u akuzativu: vidim stol."],["Animate masculine nouns take -a in the accusative: vidim psa, vidim brata.","Živo u muškom rodu dobiva -a: vidim psa, vidim brata."],["„U\" and „na\" take the locative when nothing moves: u kući, na stolu.","Nakon „u\" i „na\" s mirovanjem ide lokativ: u kući, na stolu."],["With motion, „u\" and „na\" take the accusative: idem u školu, idem na more.","S kretanjem „u\" i „na\" traže akuzativ: idem u školu, idem na more."],["„Bez\", „iz\", „od\" and „do\" always take the genitive.","„Bez\", „iz\", „od\", „do\" uvijek traže genitiv."],["Negation is ne + verb, but „nemam\" and „neću\" are written as one word.","Negacija: ne + glagol, ali „nemam\" i „neću\" pišu se spojeno."],["Yes/no questions are often formed with „li\": Imaš li vremena?","Pitanje se često tvori s „li\": Imaš li vremena?"],["Past tense = auxiliary verb + participle: bio sam, kupila je.","Prošlo vrijeme: pomoćni glagol + glagolski pridjev (bio sam, kupila je)."],["The past participle agrees in gender: on je bio, ona je bila, oni su bili.","Glagolski pridjev se slaže s rodom: on je bio, ona je bila, oni su bili."],["Future = infinitive + ću/ćeš/će: kupit ću, doći ćemo.","Futur: infinitiv + ću/ćeš/će (kupit ću, doći ćemo)."],["The dative answers „to whom\": dajem knjigu bratu.","Dativ odgovara na pitanje „kome\": dajem knjigu bratu."],["„Sviđa mi se\" literally means „it is pleasing to me\" — liking uses the dative.","„Sviđa mi se\" doslovno znači „it is pleasing to me\"."],["Comparatives: velik → veći, dobar → bolji, hladan → hladniji.","Komparativ: velik → veći, dobar → bolji, hladan → hladniji."],["Superlatives add naj-: najveći, najbolji, najhladniji.","Superlativ se tvori s naj-: najveći, najbolji, najhladniji."],["The instrumental expresses means: putujem vlakom, pišem olovkom.","Instrumental za sredstvo: putujem vlakom, pišem olovkom."],["After 2, 3 and 4 the noun takes the genitive singular: dva stola.","Uz brojeve 2, 3 i 4 imenica ide u genitiv jednine: dva stola."],["From five on, the noun takes the genitive plural: pet stolova.","Od pet nadalje ide genitiv množine: pet stolova."],["Double negation is standard: nitko ništa ne zna.","Dvostruka negacija je normalna: nitko ništa ne zna."],["Word order is free, but clitics (je, sam, se) go in second position.","Red riječi je slobodan, ali enklitike (je, sam, se) idu na drugo mjesto."],["„Se\" is written separately and moves around: odmori se, ja se odmaram.","„Se\" se piše odvojeno i mijenja mjesto: odmori se, ja se odmaram."],["Dž, lj and nj are single letters, not two.","Slova dž, lj i nj su jedno slovo, ne dva."],["Č is harder, ć is softer — čokolada, ćevapi.","Č je tvrđe, ć je mekše — čokolada, ćevapi."],["Every letter is always read the same way — Croatian spelling is phonetic.","Svako slovo se uvijek čita isto — hrvatski je fonetski jezik."],["Stress is usually on the first syllable and never on the last.","Naglasak je najčešće na prvom slogu, nikad na zadnjem."],["The vocative is used to address someone: Marko → Marko!, Ana → Ana!","Vokativ se koristi za dozivanje: Marko → Marko!, Ana → Ana!"],["Formal „Vi\" is capitalised in letters as a mark of respect.","„Vi\" iz poštovanja piše se velikim slovom u pismima."]];

    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function uzmi(a, n) { return mix(a).slice(0, n); }
  function rand(a) { return a[Math.floor(Math.random() * a.length)]; }
  function cijeli(n) { return Math.floor(Math.random() * n); }
  function norm(s) { return String(s == null ? '' : s).trim().toLowerCase().replace(/\s+/g, ' '); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }
  function el(id) { return document.getElementById(id); }
  function slug(s) {
    return String(s).toLowerCase()
      .replace(/č|ć/g, 'c').replace(/đ/g, 'd').replace(/š/g, 's').replace(/ž/g, 'z')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  }

  /* ---------- mediji (uvijek s ugrađenom zamjenom) ---------- */
  /*[CL-SLIKA]*/
  function slika(datoteka, zamjena, velicina, klasa) {
    var v = velicina || 96;
    var put = FOTO[datoteka];
    return '<span class="slikaOkvir ' + (klasa || '') + (put ? ' imaSliku' : '') + '" style="width:' + v + 'px;height:' + v + 'px;font-size:' + Math.round(v * 0.55) + 'px">' +
      (put ? '<img src="' + put + '" alt="" loading="lazy" onerror="this.remove()">' : '') +
      '<span class="zamjena" style="font-size:' + Math.round(v * 0.5) + 'px">' + zamjena + '</span>' +
      '</span>';
  }
  /*[/CL-SLIKA]*/
  function slikaRijeci(r, velicina) {
    return slika('rijec-' + r.id + '.png', r.emo, velicina, 'mrlja-' + r.kat);
  }
  var ZVUK_OK = true;
  function zvuk(datoteka) {
    if (!ZVUK_OK) return;

      var a = new Audio(MEDIJ + datoteka);
      a.volume = 0.85;
      var p = a.play();
      if (p && p.catch) p.catch(function () { });
    } catch (e) { }
  }
  function zvukRijeci(r) { zvuk('rijec-' + r.id + '.mp3'); }
  /* mali sintetički tonovi — rade i bez ijedne datoteke */
  var AC = null;
  function ton(f, t, tip) {
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = tip || 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, AC.currentTime);
      g.gain.exponentialRampToValueAtTime(0.14, AC.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + (t || 0.15));
      o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + (t || 0.15) + 0.02);
    } catch (e) { }
  }
  function pip(dobro) {
    if (dobro) { ton(660, .09); setTimeout(function () { ton(880, .13); }, 80); }
    else { ton(200, .2, 'square'); }
  }

  /* ---------- poruke ---------- */
  var _p = null, _pt = null;
  function poruka(tekst, vrsta) {
    if (!_p) { _p = document.createElement('div'); _p.className = 'poruka'; document.body.appendChild(_p); }
    _p.textContent = tekst;
    _p.className = 'poruka vidi ' + (vrsta || '');
    clearTimeout(_pt);
    _pt = setTimeout(function () { _p.className = 'poruka ' + (vrsta || ''); }, 1600);
  }

  /* ---------- konfeti ---------- */
  function konfeti(n) {
    var boje = ['#F4B942', '#E8623A', '#2FA8A0', '#7B5EA7', '#7CB342', '#3E7CB1'];
    for (var i = 0; i < (n || 40); i++) (function (i) {
      var d = document.createElement('div');
      d.className = 'konfet';
      d.style.background = boje[i % boje.length];
      d.style.left = (10 + Math.random() * 80) + 'vw';
      d.style.top = '-20px';
      document.body.appendChild(d);
      var pad = 900 + Math.random() * 900, poc = performance.now(), zaokret = Math.random() * 720, x = (Math.random() - .5) * 220;
      requestAnimationFrame(function korak(t) {
        var k = (t - poc) / pad;
        if (k >= 1) { d.remove(); return; }
        d.style.transform = 'translate(' + (x * k) + 'px,' + (k * (window.innerHeight + 60)) + 'px) rotate(' + (zaokret * k) + 'deg)';
        d.style.opacity = String(1 - k * k);
        requestAnimationFrame(korak);
      });
    })(i);
  }

  /* ---------- spremanje ---------- */
  function kljuc() { return 'croland-mini-' + (window.IGRA_ID || 'x'); }
  function stanje() {
    try { return JSON.parse(localStorage.getItem(kljuc()) || '{}'); } catch (e) { return {}; }
  }
  function spremi(o) {
    try { localStorage.setItem(kljuc(), JSON.stringify(o)); } catch (e) { }
  }
  function najbolje() { return stanje().najbolje || 0; }
  function zapisiRezultat(bodovi) {
    var s = stanje();
    if (bodovi > (s.najbolje || 0)) { s.najbolje = bodovi; s.kada = new Date().toISOString(); spremi(s); return true; }
    return false;
  }

  /* ---------- zastor / kraj igre ---------- */
  function zastor(html) {
    var z = document.createElement('div');
    z.className = 'zastor';
    z.innerHTML = '<div class="kut">' + html + '</div>';
    document.body.appendChild(z);
    return z;
  }
  function zatvoriZastore() {
    Array.prototype.forEach.call(document.querySelectorAll('.zastor'), function (z) { z.remove(); });
  }
  /**
   * Završni ekran. Skriveni max: igraču se maksimum otkriva tek kad ga dosegne.
   * @param opts {naslov, tekst, bodovi, maks, ponovno(fn)}
   */
  function kraj(opts) {
    var b = Math.max(0, Math.round(opts.bodovi || 0));
    var maks = opts.maks || window.IGRA_MAKS || 100;
    var presao = b >= maks;
    var rekord = zapisiRezultat(b);
    var prijeNaplaceno = stanje().naplaceno || 0;
    var isplata = Math.max(0, b - prijeNaplaceno);
    if (isplata > 0) { var s = stanje(); s.naplaceno = b; spremi(s); }
    if (presao) konfeti(90);
    var html =
      '<h3>' + esc(opts.naslov || (presao ? 'You beat the game!' : 'Game over')) + '</h3>' +
      '<p>' + (opts.tekst || '') + '</p>' +
      '<div class="valute">' +
      ['LP', 'VP', 'GP', 'PP'].map(function (v) {
        return '<div class="valuta"><b>+' + isplata + '</b><span>' + v + '</span></div>';
      }).join('') +
      '</div>' +
      '<p style="font-size:13px">' +
      (isplata > 0 ? 'Credited ' + isplata + ' in each currency. ' : 'No new payout this time — you have already collected ' + prijeNaplaceno + '. ') +
      (presao
        ? '<b>You have taken the full ' + maks + ' from this game.</b>'
        : 'Total so far: <b>' + Math.max(b, prijeNaplaceno) + '</b>' + (rekord ? ' — new record!' : '')) +
      '</p>' +
      '<div class="tipke" style="margin-top:16px">' +
      '<button class="g glavni" id="_opet">Play again</button>' +
      (opts.beskonacno ? '<button class="g" id="_bez">Endless ▶</button>' : '') +
      '</div>';
    var z = zastor(html);
    z.querySelector('#_opet').onclick = function () { z.remove(); if (opts.ponovno) opts.ponovno(); else location.reload(); };
    if (opts.beskonacno) z.querySelector('#_bez').onclick = function () { z.remove(); opts.beskonacno(); };
    return z;
  }

  /* ---------- HUD ---------- */
  function hud(o) {
    var d = document.createElement('header');
    d.className = 'hud';
    d.innerHTML =
      '<div class="ime">' + esc(o.ime) + '<small>' + esc(o.podnaslov || '') + '</small></div>' +
      (o.znakovi || []).map(function (z) {
        return '<span class="znak ' + (z.klasa || '') + '" id="' + z.id + '">' + z.html + '</span>';
      }).join('');
    return d;
  }
  function srca(n, od) {
    var s = '';
    for (var i = 0; i < (od || 3); i++) s += (i < n ? '❤️' : '🤍');
    return s;
  }

  /* ---------- strogi upis (s dijakriticima) ---------- */
  function tipkeDijakritika(input) {
    var znakovi = ['č', 'ć', 'đ', 'š', 'ž'];
    var d = document.createElement('div');
    d.className = 'tipke';
    d.innerHTML = znakovi.map(function (z) {
      return '<button type="button" class="dijakritik" data-z="' + z + '">' + z + '</button>';
    }).join('');
    d.addEventListener('click', function (e) {
      var b = e.target.closest('.dijakritik'); if (!b) return;
      var poc = input.selectionStart == null ? input.value.length : input.selectionStart;
      var kraj_ = input.selectionEnd == null ? poc : input.selectionEnd;
      input.value = input.value.slice(0, poc) + b.dataset.z + input.value.slice(kraj_);
      input.focus();
      input.setSelectionRange(poc + 1, poc + 1);
    });
    return d;
  }


  /* ---------- skriveni prijevod (otkriva se klikom) ----------
     Prijevod koji bi inače riješio zadatak umjesto igrača stoji skriven;
     klik na oznaku otkriva engleski tekst. */
  var _enVezan = false;
  function vezanjeEN() {
    if (_enVezan || typeof document === 'undefined') return;
    _enVezan = true;
    document.addEventListener('click', function (e) {
      var b = e.target && e.target.closest ? e.target.closest('.otkrijEN') : null;

      e.preventDefault(); e.stopPropagation();
      b.textContent = b.getAttribute('data-en');
      b.removeAttribute('data-en');
      b.className = 'otkrijEN otkriven';
    }, true);
  }
  function skritEN(tekst, natpis, kaoSpan) {
    if (tekst == null || tekst === '') return '';
    vezanjeEN();
    var oznaka = esc(natpis || '\ud83d\udc41 translation');
    /* unutar <button> ne smije stajati drugi <button> — tada ide span */
    if (kaoSpan) return '<span role="button" tabindex="0" class="otkrijEN" data-en="' + esc(tekst) + '">' + oznaka + '</span>';
    return '<button type="button" class="otkrijEN" data-en="' + esc(tekst) + '">' + oznaka + '</button>';
  }

  /*[CL-DODATAK]*/
  /* ---------- rečenice, praznine, dijalozi, savjeti ---------- */
  function recenice(raz, doRazine) {
    if (!raz) return RECENICE.slice();
    return RECENICE.filter(function (r) { return doRazine ? r[2] <= raz : r[2] === raz; });
  }
  function recenica(raz, doRazine) { return rand(recenice(raz, doRazine)); }
  function praznine(raz, doRazine) {
    if (!raz) return PRAZNINE.slice();
    return PRAZNINE.filter(function (p) { return doRazine ? p[5] <= raz : p[5] === raz; });
  }
  function praznina(raz, doRazine) { return rand(praznine(raz, doRazine)); }
  function dijalozi(raz) {
    if (!raz) return DIJALOZI.slice();
    return DIJALOZI.filter(function (d) { return d.razina <= raz; });
  }
  function savjet() { return rand(SAVJETI); }
  function suprotnica() { return rand(SUPROTNICE); }
  function suprotnice() { return SUPROTNICE.slice(); }

  /* razina prema napretku: 1-5 iz rednog broja koraka i ukupne dužine */
  function razinaZa(i, ukupno) {
    var r = Math.floor((i / Math.max(1, ukupno)) * 5) + 1;
    return Math.max(1, Math.min(5, r));
  }

  /* ---------- praćenje svladanih riječi (dijeli se među igrama) ---------- */
  function ucenje(id, dobro) {
    try {
      var k = "croland-mini-ucenje";
      var m = JSON.parse(localStorage.getItem(k) || "{}");
      var z = m[id] || { t: 0, k: 0 };
      if (dobro) z.t++; else z.k++;
      m[id] = z;
      localStorage.setItem(k, JSON.stringify(m));
    } catch (e) { }
  }
  function ucenjeSve() {
    try { return JSON.parse(localStorage.getItem("croland-mini-ucenje") || "{}"); }
    catch (e) { return {}; }
  }
  function zaPonoviti(n) {
    var m = ucenjeSve(), popis = [];
    Object.keys(m).forEach(function (id) {
      var z = m[id];
      if (z.k > 0 && z.k >= z.t && POID[id]) popis.push({ r: POID[id], k: z.k, t: z.t });
    });
    popis.sort(function (a, b) { return (b.k - b.t) - (a.k - a.t); });
    return popis.slice(0, n || 12);
  }
  /* riječi koje igrač još nije vidio — daje prednost novom sadržaju */
  function svjezeRijeci(n, filtar) {
    var m = ucenjeSve();
    var izvor = filtar ? BANKA.filter(filtar) : BANKA;
    var nove = izvor.filter(function (r) { return !m[r.id]; });
    var ostalo = izvor.filter(function (r) { return m[r.id]; });
    return mix(nove).concat(mix(ostalo)).slice(0, n);
  }

  /* ---------- savjet između razina ---------- */
  function savjetZastor(nastavi) {
    var s = savjet();
    var z = zastor(
      '<h3>💡 Tip</h3><p style="text-align:left">' + esc(s[0]) + '</p>' +
      '<p style="font-size:13px;color:#8B7B6B;text-align:left">' + esc(s[1]) + '</p>' +
      '<div class="tipke" style="margin-top:14px"><button class="g glavni" id="_dalje">Next</button></div>');
    z.querySelector('#_dalje').onclick = function () { z.remove(); if (nastavi) nastavi(); };
    return z;
  }
  /* ---------- pixel sprajtovi za canvas igre ----------
     list(ime) učita PNG iz mini games media/ jednom; sprite() crta jednu
     pločicu (stupac, red) oštro, bez zaglađivanja. Dok list nije učitan,
     sprite() vraća false i igra crta svoju staru zamjenu. naSprite(fn)
     pozove fn kad se neki list učita, da se scena ponovno nacrta. */
  var _listovi = {}, _naSprite = [];
  function list(ime) {
    var i = _listovi[ime];
    if (!i) {
      i = _listovi[ime] = new Image();
      i.onload = function () { i._ok = true; _naSprite.forEach(function (f) { try { f(ime); } catch (e) {} }); };
      i.src = MEDIJ + ime;
    }
    return i;
  }
  function sprite(G, ime, c, r, x, y, w, h, vel) {
    var i = list(ime); vel = vel || 16;
    if (!i._ok) return false;
    G.imageSmoothingEnabled = false;
    G.drawImage(i, c * vel, r * vel, vel, vel, Math.round(x), Math.round(y), Math.round(w), Math.round(h === undefined ? w : h));
    return true;
  }
  function naSprite(fn) { _naSprite.push(fn); }
  /*[/CL-DODATAK]*/

  return {
    MEDIJ: MEDIJ, BANKA: BANKA, KAT: KAT, kat: kat, po: po,
    /*[CL-IZVOZ]*/
    RECENICE: RECENICE, PRAZNINE: PRAZNINE, DIJALOZI: DIJALOZI, SAVJETI: SAVJETI,
    SUPROTNICE: SUPROTNICE, suprotnica: suprotnica, suprotnice: suprotnice,
    recenice: recenice, recenica: recenica, praznine: praznine, praznina: praznina,
    dijalozi: dijalozi, savjet: savjet, savjetZastor: savjetZastor, razinaZa: razinaZa,
    ucenje: ucenje, ucenjeSve: ucenjeSve, zaPonoviti: zaPonoviti, svjezeRijeci: svjezeRijeci,
    FOTO: FOTO, list: list, sprite: sprite, naSprite: naSprite,
    /*[/CL-IZVOZ]*/
    mix: mix, uzmi: uzmi, rand: rand, cijeli: cijeli, norm: norm, esc: esc, el: el, slug: slug,
    slika: slika, slikaRijeci: slikaRijeci, zvuk: zvuk, zvukRijeci: zvukRijeci, ton: ton, pip: pip,
    poruka: poruka, konfeti: konfeti,
    stanje: stanje, spremi: spremi, najbolje: najbolje,
    zastor: zastor, zatvoriZastore: zatvoriZastore, kraj: kraj,
    hud: hud, srca: srca, tipkeDijakritika: tipkeDijakritika,
    skritEN: skritEN

})();

/* ---------- mjere ekrana ----------
   U aplikaciji je igra u okviru koji je visok točno koliko i sadržaj, pa
   prava visina ekrana dolazi od roditelja: prozor minus zaglavlje. */
function visinaEkrana(){
  try {
    if (window.frameElement && window.parent && window.parent !== window){
      var p = window.parent, zag = p.document.querySelector('header');
      var dno = zag ? Math.max(0, zag.getBoundingClientRect().bottom) : 0;
      return p.innerHeight - dno;
    }
  } catch (e) {}
  return window.innerHeight;
}
function mjeriPult(){
  var el = CL.el('jela');
  var u = usko(), razmak = u ? 5 : 8;
  var W = el.clientWidth || 300;
  var stupaca = u ? 4 : Math.max(4, Math.min(8, Math.floor((W + razmak) / (104 + razmak))));
  var ostalo = document.body.getBoundingClientRect().height - el.getBoundingClientRect().height;
  var prostor = visinaEkrana() - ostalo - 6;
  var MIN = u ? 56 : 72;
  var kapRedova = Math.max(2, Math.floor((prostor + razmak) / (MIN + razmak)));
  return {usko:u, razmak:razmak, W:W, stupaca:stupaca, prostor:prostor, kapRedova:kapRedova};
}

/* Pult: jela teku po stupcima (prvi stupac odozgo dolje, pa drugi…), od pića
   preko biljaka do životinja. Pločice su kvadratne i velike koliko ekran
   dopušta, tako da cijela igra stane bez pomicanja stranice. */
function rasporediPult(){
  var el = CL.el('jela'), n = S.pult.length;
  if (!el || !n) return;
  var m = mjeriPult();
  var redova = Math.ceil(n / m.stupaca);
  var stupaca = Math.ceil(n / redova);
  var sir = Math.floor((m.W - m.razmak * (stupaca - 1)) / stupaca);
  var vis = Math.floor((m.prostor - m.razmak * (redova - 1)) / redova);
  var p = Math.max(44, Math.min(sir, vis, m.usko ? 112 : 120));
  el.style.setProperty('--plocica', p + 'px');
  el.style.setProperty('--razmak', m.razmak + 'px');
  el.style.gridTemplateRows = 'repeat(' + redova + ',var(--plocica))';
  el.style.gridTemplateColumns = 'repeat(' + stupaca + ',var(--plocica))';
}
window.addEventListener('resize', function(){ rasporediPult(); S.stolovi.forEach(function(g, i){ if (g) prilagodiTekst(i); }); });
try { if (window.frameElement) window.parent.addEventListener('resize', function(){ try { rasporediPult(); } catch (e) {} }); } catch (e) {}

/* ---------- plan smjene ----------
   Na početku smjene unaprijed se odrede svi gosti i njihove narudžbe (i ono
   što će neodlučni dodati). Pult = sva jela iz tih narudžbi + nekoliko
   nasumičnih, nikad dva slična jela zajedno. */
function skupinaSlobodna(id, skup){
  var sk = PO_ID[id].sk;
  if (!sk) return true;
  for (var x in skup) if (x !== id && PO_ID[x].sk === sk) return false;
  return true;
}
function stane(ids, skup){
  for (var i = 0; i < ids.length; i++) if (!skup[ids[i]] && !skupinaSlobodna(ids[i], skup)) return false;
  return true;
}
function novih(ids, skup){ var n = 0; ids.forEach(function(x){ if (!skup[x]) n++; }); return n; }
function velicina(skup){ return Object.keys(skup).length; }
function dobaPase(doba, cfgDoba){
  for (var i = 0; i < doba.length; i++) if (cfgDoba.indexOf(doba[i]) >= 0) return true;
  return false;
}

function pokusajPlana(cfg, granica, strogo){
  var skup = {}, uSmjeni = {}, red = [];
  for (var i = 0; i < cfg.gostiju; i++){
    var tip = CL.rand(cfg.tipovi);
    var mjesta = granica - velicina(skup);
    var ostaje = cfg.gostiju - i;
    var izbor = null;
    for (var n = cfg.stavki; n >= 1 && !izbor; n--){
      var lista = RECENICE_K.filter(function(r){
        return r.j.length === n && r.t <= cfg.tezina && dobaPase(r.doba, cfg.doba) &&
          !uSmjeni[r.hr] && (!strogo || !S.vidjeno[r.hr]) &&
          stane(r.j, skup) && novih(r.j, skup) <= mjesta - (tip === 'neodlucan' ? 1 : 0);
      });
      if (!lista.length) continue;
      /* kad je mjesta malo, prednost imaju narudžbe s jelima koja su već na pultu */
      var udio = Math.max(1, Math.floor(mjesta / ostaje) + 1);
      var stedljive = lista.filter(function(r){ return novih(r.j, skup) <= udio; });
      izbor = CL.rand(stedljive.length ? stedljive : lista);
    }
    if (!izbor) return null;
    uSmjeni[izbor.hr] = true;
    izbor.j.forEach(function(x){ skup[x] = true; });
    var dodatak = null;
    if (tip === 'neodlucan'){
      var dl = DODACI_K.filter(function(d){
        return dobaPase(d.doba, cfg.doba) && izbor.j.indexOf(d.id) < 0 &&
          stane([d.id], skup) && novih([d.id], skup) <= granica - velicina(skup);
      });
      if (dl.length){ dodatak = CL.rand(dl); skup[dodatak.id] = true; }
      else tip = 'obican';
    }
    red.push({r:izbor, tip:tip, dodatak:dodatak});
  }
  return {red:red, skup:skup};
}

function planirajSmjenu(cfg){
  var m = mjeriPult();
  var kapacitet = m.kapRedova * m.stupaca;
  var granica = Math.min(cfg.redovi * 4, kapacitet) - 2;
  var plan = null;
  for (var k = 0; k < 160 && !plan; k++){
    var g = granica + (k >= 80 ? Math.floor((k - 80) / 20) + 1 : 0);
    plan = pokusajPlana(cfg, g, k < 40);
  }
  if (!plan) plan = pokusajPlana(cfg, 99, false);

  /* nasumični dodaci na pultu: dopuni do punog reda, barem 2, ako ima mjesta */
  var n0 = velicina(plan.skup);
  var dodatno = Math.ceil((n0 + 2) / m.stupaca) * m.stupaca - n0;
  if (dodatno > 5) dodatno = 2;
  dodatno = Math.max(0, Math.min(dodatno, kapacitet - n0));
  var ostala = CL.mix(JELOVNIK.filter(function(j){ return !plan.skup[j.id]; }));
  for (var i = 0; i < ostala.length && dodatno > 0; i++){
    if (skupinaSlobodna(ostala[i].id, plan.skup)){ plan.skup[ostala[i].id] = true; dodatno--; }
  }
  plan.red.forEach(function(x){ S.vidjeno[x.r.hr] = true; });
  S.red = plan.red;
  S.pult = JELOVNIK.filter(function(j){ return plan.skup[j.id]; })
    .sort(function(a, b){ return a.v - b.v; });
  crtajPult();
}

/* Kartica je uvijek iste visine. Ako je narudžba duga, slova se malo smanje
   — kartica nikad ne raste i ništa ispod nje ne poskakuje. */
function prilagodiTekst(i){
  var t = CL.el('stol' + i).querySelector('.gostTekst');
  if (!t) return;
  var vel = usko() ? 14.5 : 17;
  t.style.setProperty('--vel', vel + 'px');
  while (t.scrollHeight > t.clientHeight + 1 && vel > 10){
    vel -= 0.5;
    t.style.setProperty('--vel', vel + 'px');
  }
}
function osvjeziStrpljenje(i){
  var g = S.stolovi[i]; if (!g) return;
  var el = CL.el('stol' + i);
  var bar = el.querySelector('.strpljenje i'), k = el.querySelector('.gost');
  if (bar){ bar.style.width = Math.max(0, g.strpljenje / g.maks * 100) + '%'; bar.style.background = bojaStrpljenja(g); }
  if (k) k.classList.toggle('ljut', !g.gotov && g.strpljenje < g.maks * 0.3);
}
CL.el('gosti').addEventListener('click', function(e){
  var b = e.target.closest('[data-prijevod]'); if (!b) return;
  var m = e.target.closest('.stolMjesto'); if (!m) return;

function dopuni(i){
  var g = S.stolovi[i];
  g.dopunio = true;
  if (!g.dodatak) return;
  g.trazi.push(g.dodatak.id);
  g.hr += ' ' + g.dodatak.hr;
  g.en += ' ' + g.dodatak.en;
  g.strpljenje = Math.min(g.maks, g.strpljenje + 6);
  CL.poruka('Table ' + g.stol + ' changed their mind!', 'lose');
  crtajStol(i);
}

function posluzi(id, gumb){
  for (var i = 0; i < S.stolovi.length; i++){
    var g = S.stolovi[i];
    if (!g || g.gotov) continue;
    var trebaJos = g.trazi.filter(function(t){ return g.doneseno.indexOf(t) < 0; });
    if (trebaJos.indexOf(id) >= 0){
      g.doneseno.push(id);
      CL.pip(true); CL.zvuk('rijec-' + id + '.mp3');
      if (gumb){ gumb.classList.add('dobro'); setTimeout(function(){ gumb.classList.remove('dobro'); }, 260); }
      if (g.trazi.every(function(t){ return g.doneseno.indexOf(t) >= 0; })){
        g.gotov = true; S.posluzeno++;
        S.bodovi = Math.min(window.IGRA_MAKS, S.bodovi + 10);   // 10 po izdanoj narudzbi
        var bonus = TIPOVI[g.tip].bonus;
        CL.poruka('Table ' + g.stol + ' is happy!' + (bonus ? ' A tough guest — nice work!' : ''), 'dobro');
        (function(i, g){ setTimeout(function(){ makniGosta(i, g); }, 700); })(i, g);
      }
      crtajStol(i); osvjezi();
      return;
    }
  }
  CL.pip(false);
  if (gumb){ gumb.classList.add('tresi'); setTimeout(function(){ gumb.classList.remove('tresi'); }, 350); }
  S.stolovi.forEach(function(g, i){ if (g && !g.gotov){ g.strpljenje -= 3; osvjeziStrpljenje(i); } });
  CL.poruka('Nobody ordered that.', 'lose');
}

function makniGosta(i, g){
  if (S.stolovi[i] !== g) return;
  S.stolovi[i] = null;
  crtajStol(i);
  setTimeout(napuni, 450);
}

function napuni(){
  if (S.izmedju) return;
  var cfg = cfgSmjene();
  var zauzeto = S.stolovi.filter(Boolean).length;
  var najvise = Math.min(BROJ_STOLOVA, cfg.odjednom);
  for (var i = 0; i < S.stolovi.length && zauzeto < najvise && S.red.length; i++){
    if (S.stolovi[i]) continue;
    S.stolovi[i] = novaNarudzba(S.red.shift(), cfg);
    zauzeto++;
    CL.zvuk('gost-dolazi.mp3');
    crtajStol(i);
  }
  if (!zauzeto && !S.red.length) krajSmjene();
}

function krajSmjene(){
  S.izmedju = true;
  S.smjena++;
  if (S.smjena >= SMJENE.length) return kraj();
  var cfg = SMJENE[S.smjena];
  planirajSmjenu(cfg); osvjezi();
  var novi = (cfg.tipovi || []).filter(function(t){ return t !== 'obican'; })
    .map(function(t){ return '<b>' + TIPOVI[t].oznaka + '</b> — ' + TIPOVI[t].opis; });
  var z = CL.zastor('<h3>Shift ' + (S.smjena + 1) + '/' + SMJENE.length + ': ' + CL.esc(cfg.ime) + '</h3>' +
    '<p>' + cfg.gostiju + ' guests · up to ' + Math.min(BROJ_STOLOVA, cfg.odjednom) + ' at a time · ' +
    'up to ' + cfg.stavki + ' item' + (cfg.stavki === 1 ? '' : 's') + ' per order<br>' +
    'On the counter: <b>' + S.pult.length + '</b> items</p>' +
    (novi.length ? '<p style="font-size:13px;text-align:left">' + novi.join('<br>') + '</p>' : '') +
    '<div class="tipke"><button class="g glavni" id="_d">Open the doors</button></div>');
  z.querySelector('#_d').onclick = function(){
    z.remove();
    S.izmedju = false;
    if (S.smjena % 5 === 0) CL.savjetZastor(napuni);
    else napuni();
  };
}

function osvjezi(){
  CL.el('zSmjena').innerHTML = '🕑 <b>' + Math.min(S.smjena + 1, SMJENE.length) + '</b>/' + SMJENE.length;
  CL.el('zGosti').innerHTML = '🧑 <b>' + S.posluzeno + '</b>/' + UKUPNO_GOSTIJU;
  CL.el('zBod').innerHTML = '⭐ <b>' + S.bodovi + '</b>';
}

/* ---- sat strpljenja ---- */
S.sat = setInterval(function(){
  if (document.querySelector('.zastor')) return;
  S.stolovi.forEach(function(g, i){
    if (!g || g.gotov) return;
    g.strpljenje -= 0.35;
    if (!g.dopunio && g.strpljenje < g.maks * 0.6) dopuni(i);
    if (g.strpljenje <= 0){
      g.strpljenje = 0;
      S.izgubljeno++;
      CL.pip(false);
      CL.poruka('Table ' + g.stol + ' left without their food.', 'lose');
      S.stolovi[i] = null;
      crtajStol(i);
      setTimeout(napuni, 450);
      return;
    }
    osvjeziStrpljenje(i);
  });
}, 300);

function kraj(){
  clearInterval(S.sat);
  CL.kraj({
    naslov: S.posluzeno >= UKUPNO_GOSTIJU ? 'A perfect day!' : 'The tavern is closing',
    tekst: 'Served: <b>' + S.posluzeno + '</b> of ' + UKUPNO_GOSTIJU + ' guests across twenty shifts. ' +
      'Left without their food: ' + S.izgubljeno + '.',
    bodovi: bodoviKonobe(), maks: window.IGRA_MAKS,
    ponovno: function(){ location.reload(); }
  });
}

(function(){
  for (var i = 0; i < BROJ_STOLOVA; i++) crtajStol(i);
  osvjezi();
  /* plan prve smjene tek kad se raspored slegne, da mjere ekrana budu točne */
  requestAnimationFrame(function(){ planirajSmjenu(SMJENE[0]); });
  var z = CL.zastor(
    '<h3>The Tavern (Konoba)</h3>' +
    '<p>Twenty shifts from breakfast to the last round. Read each order in Croatian, tap the right dishes on the counter ' +
    'and serve the guest before their patience runs out.</p>' +
    '<p style="font-size:13px">One tap per dish — even when a guest asks for two coffees.</p>' +
    '<div class="tipke" style="margin-top:14px"><button class="g glavni" id="_k">Open the doors</button></div>');
  z.querySelector('#_k').onclick = function(){ z.remove(); napuni(); };
})();

</script>
</body>
</html>
