<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<title>Croland — The Fortress</title>
<style>

*{box-sizing:border-box;margin:0;padding:0}
:root{
  --papir:#FFF8F0; --papir2:#FFEFE0; --tinta:#2B2118; --meko:#8B7B6B;
  --zut:#F4B942; --koralj:#E8623A; --tirkiz:#2FA8A0; --ljub:#7B5EA7;
  --zelena:#7CB342; --plava:#3E7CB1; --crta:3px solid #2B2118;
  --sjena:0 4px 0 #2B2118;
}
/* Dokument je visok tocno koliko mu treba, ne koliko je visok okvir. Tako
   aplikacija moze okvir izjednaciti sa sadrzajem i klizac ostaje samo jedan —
   onaj glavne stranice. Visina se mijenja kad se promijeni i sam sadrzaj
   (uvod je nizak, igra visa), i to je u redu. */
body{
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  background:var(--papir); color:var(--tinta);
  -webkit-font-smoothing:antialiased; overscroll-behavior:none;
  background-image:radial-gradient(rgba(43,33,24,.045) 1px,transparent 1px);
  background-size:22px 22px;
}
.omot{max-width:1000px;margin:0 auto;padding:14px 14px 40px;display:flex;flex-direction:column}
/* ---- HUD ---- */
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:#fff;border:var(--crta);border-radius:16px;box-shadow:var(--sjena);
  padding:10px 14px;margin-bottom:14px}
.hud .ime{font-weight:800;font-size:18px;letter-spacing:.2px;margin-right:auto}
.hud .ime small{display:block;font-weight:600;font-size:11px;color:var(--meko);letter-spacing:.6px;text-transform:uppercase}
.znak{display:inline-flex;align-items:center;gap:6px;background:var(--papir2);
  border:2px solid var(--tinta);border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.znak.srca{background:#FFE3E3}
/* ---- ploha ---- */
.ploha{background:#fff;border:var(--crta);border-radius:20px;box-shadow:var(--sjena);
  padding:18px;flex:1;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
h2.naslov{font-size:22px;font-weight:800}
p.uputa{font-size:15px;color:var(--meko);line-height:1.5}
.sredina{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;flex:1;text-align:center}
/* ---- gumbi ---- */
.g{font:inherit;font-weight:700;font-size:15px;cursor:pointer;border:var(--crta);
  border-radius:14px;background:#fff;padding:11px 18px;box-shadow:0 4px 0 var(--tinta);
  transition:transform .06s,box-shadow .06s;color:var(--tinta)}
.g:hover{background:var(--papir2)}
.g:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tinta)}
.g.glavni{background:var(--zut)}
.g.veliki{font-size:18px;padding:14px 28px}
.g[disabled]{opacity:.45;cursor:default;transform:none;box-shadow:0 4px 0 var(--tinta)}
.g.tocno{background:var(--zelena);color:#fff}
.g.krivo{background:var(--koralj);color:#fff}
/* ---- kartice / slike ---- */
.slikaOkvir{position:relative;display:inline-flex;align-items:center;justify-content:center;
  background:var(--papir2);border-radius:14px;overflow:hidden}
.slikaOkvir img{width:100%;height:100%;object-fit:contain;display:block}
.slikaOkvir .zamjena{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:60%;line-height:1}
.mrlja-hrana,.mrlja-pice{background:#DCEEFF}
.mrlja-zivotinja,.mrlja-osoba{background:#FFE0C4}
.mrlja-mjesto,.mrlja-predmet,.mrlja-prijevoz,.mrlja-odjeca,.mrlja-priroda{background:#DCEEFF}
.mrlja-vrijeme,.mrlja-skola,.mrlja-sport,.mrlja-tijelo{background:#E9DEF7}
.mrlja-glagol{background:#E2F3CE}
.mrlja-pridjev,.mrlja-boja,.mrlja-broj{background:#FFE0DC}
/* ---- mreža ---- */
.mreza{display:grid;gap:12px}
/* ---- poruke ---- */
.poruka{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:var(--tinta);color:#fff;padding:10px 20px;border-radius:999px;font-weight:700;
  opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
.poruka.vidi{opacity:1;transform:translateX(-50%) translateY(0)}
.poruka.dobro{background:var(--zelena)}
.poruka.lose{background:var(--koralj)}
/* ---- zastor ---- */
.zastor{position:fixed;inset:0;background:rgba(43,33,24,.72);display:flex;align-items:center;
  justify-content:center;padding:20px;z-index:80}
.zastor .kut{background:var(--papir);border:var(--crta);border-radius:22px;box-shadow:0 8px 0 rgba(0,0,0,.35);
  padding:26px;max-width:460px;width:100%;text-align:center;max-height:88vh;overflow:auto}
.zastor h3{font-size:26px;margin-bottom:8px}
.zastor p{color:var(--meko);line-height:1.55;margin-bottom:14px;font-size:15px}
.valute{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.valuta{border:2px solid var(--tinta);border-radius:12px;padding:8px 12px;background:#fff;min-width:66px}
.valuta b{display:block;font-size:20px}
.valuta span{font-size:11px;color:var(--meko);font-weight:700;letter-spacing:.5px}
/* ---- traka napretka ---- */
.napredak{height:12px;background:var(--papir2);border:2px solid var(--tinta);border-radius:999px;overflow:hidden}
.napredak i{display:block;height:100%;background:var(--zut);width:0;transition:width .3s}
/* ---- razno ---- */
.tresi{animation:tresi .3s}
@keyframes tresi{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.skok{animation:skok .35s}
@keyframes skok{0%,100%{transform:scale(1)}45%{transform:scale(1.14)}}
.blijedi{animation:blijedi .3s}
@keyframes blijedi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.konfet{position:fixed;width:10px;height:14px;z-index:90;pointer-events:none;border-radius:2px}
input.upis{font:inherit;font-size:20px;font-weight:700;text-align:center;padding:12px 16px;
  border:var(--crta);border-radius:14px;background:#fff;width:min(380px,90%);color:var(--tinta)}
input.upis:focus{outline:none;background:var(--papir2)}
.tipke{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.dijakritik{font:inherit;font-weight:700;font-size:16px;cursor:pointer;border:2px solid var(--tinta);
  border-radius:10px;background:#fff;width:38px;height:38px}
.dijakritik:hover{background:var(--zut)}
@media (max-width:640px){
  .omot{padding:6px 6px 16px}
  .hud{padding:6px 8px;gap:6px;margin-bottom:8px}
  .hud .ime{font-size:15px}
  .hud .ime small{display:none}
  .znak{padding:3px 9px;font-size:12px}
  .ploha{padding:10px;border-radius:14px;gap:8px}
  h2.naslov{font-size:18px}
}

/* ==== Tvrđava — pixel izgled ==== */

:root{
  --pix:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  --pix2:"Press Start 2P",monospace;
  --kamen:#3A332C; --kamen2:#26211C; --noc:#1B1712; --svijeca:#F4B942;
  --pergament:#F3E6C8; --pergament2:#E6D3A8;
}
body{font-family:var(--pix);background-color:#EDE3D0;
  background-image:linear-gradient(rgba(36,28,21,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(36,28,21,.05) 1px,transparent 1px);
  background-size:8px 8px}
img{image-rendering:pixelated;image-rendering:crisp-edges}
.omot{max-width:960px;gap:12px}
.hud,.ploha,.g,.znak,.zastor .kut,.valuta,input.upis,.dijakritik{border-radius:0}
.hud{border-width:4px;box-shadow:0 5px 0 var(--tinta);margin-bottom:0}
.hud .ime{font-family:var(--pix2);font-size:12px;line-height:1.7}
.hud .ime small{font-family:var(--pix);font-size:11px}
.znak{font-family:var(--pix2);font-size:10px;padding:6px 9px}
.g{font-family:var(--pix);font-weight:800;border-width:3px;box-shadow:0 4px 0 var(--tinta)}
.g.glavni{background:var(--svijeca)}
.zastor .kut{border-width:4px;background:var(--pergament)}
.zastor h3{font-family:var(--pix2);font-size:15px;line-height:1.6}
.ploha{border:0;box-shadow:none;background:transparent;padding:0;gap:12px;overflow:visible}

/* ---- karta tvrđave ---- */
.karta{background:var(--kamen2);border:4px solid var(--tinta);box-shadow:0 5px 0 var(--tinta);padding:8px;
  display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(44px,auto);gap:6px}
.soba{position:relative;border:3px solid #000;background:#5B5046;color:#F3E6C8;cursor:pointer;
  font-weight:800;font-size:12px;padding:5px 6px 5px 30px;display:flex;align-items:center;line-height:1.15;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.soba i{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-style:normal;font-size:17px}
.soba small{display:block;font-weight:600;font-size:10px;opacity:.7}
.soba.zatvorena{background:#2E2823;color:#7D7163;cursor:default}
.soba.rijesena{background:#4E6B3A}
.soba.tu{background:var(--svijeca);color:var(--tinta);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.soba:not(.zatvorena):hover{filter:brightness(1.12)}

/* ---- scena ---- */
.pozornica{position:relative;border:4px solid var(--tinta);box-shadow:0 5px 0 var(--tinta);background:var(--noc)}
.scena{position:relative;width:100%;max-width:calc(50vh * 16 / 9);margin:0 auto;aspect-ratio:16/9;overflow:hidden;background:var(--kamen)}
.scena > img.poz{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scena .zamjena{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:min(22vw,150px);opacity:.28;filter:grayscale(.3)}
.scena.imaSliku .zamjena,.scena.imaSliku .dekor{display:none}
.plocica{position:absolute;left:10px;top:10px;background:var(--pergament);border:3px solid var(--tinta);
  font-family:var(--pix2);font-size:10px;line-height:1.6;padding:4px 8px;z-index:3}
.plocica small{font-family:var(--pix);font-size:12px;font-weight:700;color:var(--meko);margin-left:6px}
.razinaZ{position:absolute;right:10px;top:10px;background:var(--tinta);color:var(--svijeca);
  font-family:var(--pix2);font-size:9px;padding:6px 8px;z-index:3}
.dekor,.tocka{position:absolute;display:flex;align-items:center;justify-content:center}
.dekor{border:2px dashed rgba(243,230,200,.25);color:rgba(243,230,200,.55);font-size:clamp(14px,3vw,28px);pointer-events:none}
.tocka{cursor:pointer;z-index:2;font-size:clamp(12px,2.4vw,22px);border:3px solid transparent}
.scena:not(.imaSliku) .tocka{border:3px solid rgba(0,0,0,.6);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.tocka:hover{border-color:var(--svijeca)!important;background:rgba(244,185,66,.18)}
.tocka.prazna{opacity:.35;pointer-events:none}

/* ---- govor (RPG okvir) ---- */
.govor{display:flex;gap:12px;align-items:flex-start;background:var(--noc);color:#F3E6C8;
  border-top:4px solid var(--tinta);padding:12px 14px;min-height:92px}
.portret{flex:none;width:72px;height:72px;border:3px solid #F3E6C8;background:#3A332C;position:relative;overflow:hidden}
.portret img{position:absolute;inset:0;width:100%;height:100%}
.portret span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px}
.govor .tko{font-family:var(--pix2);font-size:9px;color:var(--svijeca);letter-spacing:.5px;margin-bottom:6px;line-height:1.5}
.govor .rec{font-size:18px;font-weight:700;line-height:1.4}
.govor .pr{font-size:13px;margin-top:4px}
.govor .otkrijEN{color:#B9A98E}
.govor .otkrijEN.otkriven{color:#B9A98E;font-style:italic}

/* ---- ploča zadatka ---- */
.zad{background:var(--pergament);border:4px solid var(--tinta);box-shadow:0 5px 0 var(--tinta);padding:14px;
  display:flex;flex-direction:column;gap:10px}
.zad h3{font-family:var(--pix2);font-size:11px;line-height:1.7}
.zad .mala{font-size:14px;color:var(--meko)}
.red{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.red.lijevo{justify-content:flex-start}
.opcije{display:flex;flex-direction:column;gap:8px}
.opcije .g{text-align:left}

/* dokument: poruka, dnevnik, pismo, statut */
.dok{background:#FFF9EA;border:3px solid var(--tinta);padding:14px 16px;font-size:17px;line-height:1.6;
  box-shadow:6px 6px 0 rgba(36,28,21,.18);font-family:"Segoe Print","Bradley Hand","Comic Sans MS",var(--pix)}
.dok.tiskano{font-family:Georgia,"Times New Roman",serif}
.dok.statut{background:#EAD9AE;font-family:Georgia,serif}
.dok .naslovDok{font-family:var(--pix2);font-size:9px;color:var(--meko);margin-bottom:8px;line-height:1.6}
.dok p{margin:0 0 6px}
.rjecnik{font-size:13px;color:var(--meko)}
.rjecnik b{color:var(--tinta)}

/* ključevi (Vrata, Radionica) */
.kljucevi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kljucevi.tri{grid-template-columns:repeat(3,1fr)}
.kljucK{border:3px solid var(--tinta);background:#fff;cursor:pointer;padding:8px 4px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;min-height:96px;font:inherit;font-weight:700;font-size:13px}
.kljucK:hover{background:#FFF2CC}
.kljucK svg{display:block}
.kljucK.krivo{background:#F6C9BD}

/* smočnica */
.smocnica{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;background:#8A6A48;border:3px solid var(--tinta);padding:8px}
.namirnica{border:3px solid var(--tinta);background:#F3E6C8;cursor:pointer;aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  font-size:28px;position:relative;padding:0}
.namirnica img{width:70%;height:70%}
.namirnica:hover{background:#fff}
.kosara{display:flex;gap:6px;flex-wrap:wrap;min-height:56px;align-items:center;background:#fff;border:3px dashed var(--meko);padding:6px}
.uKosari{display:flex;align-items:center;gap:4px;border:2px solid var(--tinta);background:var(--pergament);padding:2px 4px 2px 6px;font-size:22px}
.uKosari b{font-family:var(--pix2);font-size:10px}
.uKosari button{font:inherit;font-size:13px;font-weight:800;border:2px solid var(--tinta);background:#fff;width:24px;height:24px;cursor:pointer}

/* knjižnica */
.knjige{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.knjiga{border:3px solid var(--tinta);cursor:pointer;padding:8px 10px;font:inherit;font-weight:800;font-size:14px;color:#fff;
  text-shadow:1px 1px 0 rgba(0,0,0,.5);max-width:210px;text-align:left;line-height:1.25}
.knjiga.oznacena{outline:4px solid var(--svijeca);outline-offset:1px}
.police{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.polica{border:3px solid var(--tinta);background:#6B4E33;color:#F3E6C8;padding:6px;cursor:pointer;min-height:92px;font-size:12px}
.polica b{display:block;font-family:var(--pix2);font-size:9px;line-height:1.6;color:var(--svijeca);margin-bottom:4px}
.polica div{border-top:2px solid #3E2C1C;padding-top:3px;margin-top:3px;line-height:1.25}
.polica:hover{filter:brightness(1.15)}

/* sat */
.satOkvir{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}
.satOkvir svg{width:180px;height:180px;background:#F3E6C8;border:4px solid var(--tinta);shape-rendering:crispEdges}
.kontrole{display:grid;grid-template-columns:auto auto auto;gap:6px;align-items:center;font-weight:800}
.kontrole .g{padding:6px 12px}

/* zidine */
.zidine{display:grid;gap:3px;background:#2F6F9E;border:3px solid var(--tinta);padding:6px;max-width:460px;margin:0 auto;width:100%}
.more{grid-column:1/-1;text-align:center;font-family:var(--pix2);font-size:9px;color:#DCEEFF;padding:4px}
.polje{aspect-ratio:1;background:#7CA05A;position:relative;display:flex;align-items:center;justify-content:center}
.polje.zid{background:#B9AC98;box-shadow:inset 0 -3px 0 #8C7F6C}
.polje.bio{background:#D8CBB4}
.polje.start::after{content:"🔭";position:absolute;font-size:12px;left:1px;top:0;opacity:.8}
.igracZ{font-size:clamp(14px,4vw,26px);line-height:1;color:var(--tinta);font-weight:900;transition:transform .15s}
.plan{counter-reset:k}
.plan li{margin-left:22px;font-size:16px;line-height:1.5}

/* lokot */
.lokot{display:flex;gap:8px;justify-content:center}
.kotac{display:flex;flex-direction:column;align-items:center;gap:4px}
.kotac b{font-family:var(--pix2);font-size:26px;background:var(--tinta);color:var(--svijeca);width:54px;height:60px;display:flex;align-items:center;justify-content:center;border:3px solid #000}
.kotac button{font:inherit;font-weight:900;border:3px solid var(--tinta);background:#fff;width:54px;height:30px;cursor:pointer}

/* zagonetke */
.brave{display:flex;gap:10px;justify-content:center;font-size:26px}
.brave span{border:3px solid var(--tinta);background:#fff;width:46px;height:46px;display:flex;align-items:center;justify-content:center}
.brave span.otvorena{background:#CFE8B8}

/* ključ dobiven */
.nagrada{display:flex;gap:14px;align-items:center;background:#fff;border:3px solid var(--tinta);padding:12px}
.nagrada .privjesak{font-family:var(--pix2);font-size:9px;background:var(--pergament2);border:2px solid var(--tinta);padding:5px 7px;display:inline-block;margin-top:4px;line-height:1.5}
.privjesci{display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:12px;font-weight:700;color:var(--meko)}
.privjesci span{font-family:var(--pix2);font-size:8px;background:var(--pergament);color:var(--tinta);border:2px solid var(--tinta);padding:4px 5px;line-height:1.4}

/* uvod */
.uvod{display:flex;flex-direction:column;gap:14px}
.uvod .naslovna{position:relative;aspect-ratio:16/9;background:linear-gradient(#2B3A55,#6A5A7A 55%,#C98C5A 56%,#3A332C 57%);
  border:4px solid var(--tinta);box-shadow:0 5px 0 var(--tinta);overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.uvod .naslovna img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.uvod .naslovna h1{position:relative;font-family:var(--pix2);font-size:clamp(16px,4vw,34px);color:var(--svijeca);
  text-shadow:4px 4px 0 var(--tinta);margin-bottom:6%;text-align:center;line-height:1.5}
.uvod .naslovna h1 small{display:block;font-size:.4em;color:#F3E6C8}

@media (max-width:640px){
  .karta{grid-auto-rows:minmax(34px,auto);gap:4px;padding:5px}
  .soba{font-size:10px;padding:3px 3px 3px 20px}
  .soba i{font-size:12px;left:3px}
  .soba small{display:none}
  .govor{padding:8px;gap:8px;min-height:0}
  .portret{width:48px;height:48px}
  .portret span{font-size:26px}
  .govor .rec{font-size:15px}
  .zad{padding:10px}
  .dok{font-size:15px;padding:10px}
  .kljucevi{grid-template-columns:repeat(2,1fr)}
  .smocnica{grid-template-columns:repeat(4,1fr)}
  .police{grid-template-columns:repeat(2,1fr)}
  .plocica{font-size:8px;left:6px;top:6px}
  .plocica small{display:none}
  .razinaZ{font-size:7px;right:6px;top:6px}
  .satOkvir svg{width:140px;height:140px}
}

/* ---- skriveni prijevod: otkriva se klikom ---- */
.otkrijEN{font:inherit;font-size:.94em;font-weight:600;line-height:inherit;color:var(--meko);
  background:transparent;border:0;border-bottom:2px dotted currentColor;border-radius:0;
  padding:0 2px;margin:0;cursor:pointer;opacity:.8;letter-spacing:.2px;text-align:left}
.otkrijEN:hover{opacity:1;border-bottom-color:var(--zut)}
.otkrijEN.otkriven{border-bottom:0;cursor:default;opacity:1;padding:0}
</style>

  var DIJALOZI = [{"id":"kafic","mjesto":"Kafić","emo":"☕","razina":2,"redci":[["npc","Dobar dan! Izvolite?","Good afternoon! What would you like?"],["ti","Dobar dan. Jednu veliku kavu, molim.","Good afternoon. One large coffee, please."],["npc","S mlijekom ili bez?","With milk or without?"],["ti","S mlijekom, hvala.","With milk, thank you."],["npc","Odmah stiže. Želite li nešto slatko?","Coming right up. Would you like something sweet?"],["ti","Može jedan kolač.","A pastry would be nice."],["npc","Izvolite. Ugodan dan!","Here you are. Have a nice day!"]]},{"id":"pekara","mjesto":"Pekara","emo":"🥖","razina":2,"redci":[["npc","Dobro jutro! Što će biti?","Good morning! What will it be?"],["ti","Dobro jutro. Trebam kruh i dva peciva.","Good morning. I need bread and two rolls."],["npc","Bijeli ili crni kruh?","White or brown bread?"],["ti","Crni, molim. Je li svjež?","Brown, please. Is it fresh?"],["npc","Jutros pečen. Još nešto?","Baked this morning. Anything else?"],["ti","To je sve. Koliko košta?","That is all. How much is it?"],["npc","Četiri eura, molim.","Four euros, please."]]},{"id":"trznica","mjesto":"Tržnica","emo":"🏪","razina":3,"redci":[["npc","Izvolite, gospodine! Rajčice su danas odlične.","Here you go, sir! The tomatoes are excellent today."],["ti","Koliko košta kilogram?","How much is a kilogram?"],["npc","Dva eura. Domaće su, iz mog vrta.","Two euros. They are home-grown, from my garden."],["ti","Uzet ću kilogram rajčica i pola kile paprika.","I will take a kilo of tomatoes and half a kilo of peppers."],["npc","Odmah. Trebate li još povrća?","Right away. Do you need any more vegetables?"],["ti","Ne, hvala. To je dovoljno za danas.","No, thank you. That is enough for today."],["npc","Hvala vam i doviđenja!","Thank you and goodbye!"]]},{"id":"kolodvor","mjesto":"Kolodvor","emo":"🚉","razina":3,"redci":[["npc","Dobar dan, kamo putujete?","Good afternoon, where are you travelling?"],["ti","U Split. Kada polazi sljedeći vlak?","To Split. When does the next train leave?"],["npc","U petnaest i trideset, s perona četiri.","At half past three, from platform four."],["ti","Koliko traje vožnja?","How long does the ride take?"],["npc","Otprilike šest sati.","About six hours."],["ti","Onda jednu kartu u jednom smjeru, molim.","Then one one-way ticket, please."],["npc","Izvolite kartu. Sretan put!","Here is your ticket. Have a good trip!"]]},{"id":"hotel","mjesto":"Hotel","emo":"🏨","razina":3,"redci":[["npc","Dobra večer, imate li rezervaciju?","Good evening, do you have a reservation?"],["ti","Da, na ime Marić. Soba za dvije noći.","Yes, under the name Marić. A room for two nights."],["npc","Našao sam. Soba dvjesto sedam, na drugom katu.","Found it. Room two hundred and seven, on the second floor."],["ti","Je li doručak uključen u cijenu?","Is breakfast included in the price?"],["npc","Jest, od sedam do deset ujutro.","Yes, from seven to ten in the morning."],["ti","Odlično. Ima li soba pogled na more?","Excellent. Does the room have a sea view?"],["npc","Ima. Evo vašeg ključa, ugodan boravak!","It does. Here is your key, enjoy your stay!"]]},{"id":"restoran","mjesto":"Restoran","emo":"🍽","razina":3,"redci":[["npc","Dobra večer! Stol za koliko osoba?","Good evening! A table for how many?"],["ti","Za dvoje, molim. Pored prozora ako može.","For two, please. By the window if possible."],["npc","Naravno. Evo jelovnika.","Of course. Here is the menu."],["ti","Što preporučujete?","What do you recommend?"],["npc","Svježa riba je danas izvrsna.","The fresh fish is excellent today."],["ti","Uzet ćemo ribu i veliku salatu.","We will take the fish and a big salad."],["npc","Odličan izbor. Za piće?","Excellent choice. And to drink?"],["ti","Jednu bocu vode i čašu bijelog vina.","A bottle of water and a glass of white wine."]]},{"id":"apoteka","mjesto":"Apoteka","emo":"💊","razina":4,"redci":[["npc","Dobar dan, kako vam mogu pomoći?","Good afternoon, how can I help you?"],["ti","Boli me grlo već tri dana.","My throat has hurt for three days."],["npc","Imate li i temperaturu?","Do you also have a fever?"],["ti","Jučer sam imao, danas mi je bolje.","I had one yesterday, today I feel better."],["npc","Onda probajte ove pastile. Tri puta na dan.","Then try these lozenges. Three times a day."],["ti","Trebam li recept?","Do I need a prescription?"],["npc","Ne trebate. Ako se ne popravi, idite liječniku.","You do not. If it does not improve, see a doctor."]]},{"id":"susjed","mjesto":"Kod susjeda","emo":"🏘","razina":4,"redci":[["npc","Bok! Dugo se nismo vidjeli.","Hi! We have not seen each other for a long time."],["ti","Bok! Bio sam mjesec dana u Italiji.","Hi! I was in Italy for a month."],["npc","Sjajno! Kako je bilo?","Great! How was it?"],["ti","Odlično, iako je bilo jako vruće.","Excellent, although it was very hot."],["npc","A hrana? Jesi li jeo dobro?","And the food? Did you eat well?"],["ti","Previše dobro — vratio sam se pet kila teži!","Too well — I came back five kilos heavier!"],["npc","Ha-ha! Onda idemo trčati sutra ujutro.","Ha-ha! Then let us go running tomorrow morning."]]},{"id":"ured","mjesto":"Ured","emo":"🏢","razina":4,"redci":[["npc","Dobro jutro, jeste li dobili moju poruku?","Good morning, did you get my message?"],["ti","Jesam, ali nisam stigao odgovoriti.","I did, but I did not get around to replying."],["npc","Nema problema. Možemo li se naći u dva?","No problem. Can we meet at two?"],["ti","U dva imam drugi sastanak. Može li u tri?","At two I have another meeting. Could we do three?"],["npc","Može. Trebam li nešto pripremiti?","That works. Should I prepare anything?"],["ti","Samo brojke za ovaj mjesec.","Just the figures for this month."],["npc","U redu, vidimo se u tri.","All right, see you at three."]]},{"id":"skola","mjesto":"Škola","emo":"🏫","razina":5,"redci":[["npc","Kako napreduje tvoj hrvatski?","How is your Croatian coming along?"],["ti","Bolje nego što sam očekivao, ali padeži su mi teški.","Better than I expected, but the cases are hard for me."],["npc","Svima su na početku. Čitaš li nešto na hrvatskom?","They are for everyone at the start. Do you read anything in Croatian?"],["ti","Čitam kratke priče i gledam vijesti s titlovima.","I read short stories and watch the news with subtitles."],["npc","To je najbolji način. Što više slušaš, to prije progovoriš.","That is the best way. The more you listen, the sooner you will speak."],["ti","Nadam se da ću do ljeta govoriti bez razmišljanja.","I hope that by summer I will speak without thinking."],["npc","Hoćeš, samo nastavi. Vježba čini majstora.","You will, just keep going. Practice makes perfect."]]},{"id":"plaza","mjesto":"Plaža","emo":"🏖","razina":5,"redci":[["npc","Je li ovo mjesto slobodno?","Is this spot free?"],["ti","Jest, slobodno sjednite.","It is, please sit down."],["npc","Hvala. Prekrasan dan, zar ne?","Thank you. A beautiful day, is it not?"],["ti","Predivan. More je toplije nego prošli tjedan.","Wonderful. The sea is warmer than last week."],["npc","Dolazite li često ovamo?","Do you come here often?"],["ti","Kad god imam slobodan dan. Ovdje se najbolje odmorim.","Whenever I have a day off. This is where I rest best."],["npc","Razumijem vas. Nakon mora čovjek je novi.","I understand. After the sea one feels like a new person."]]},{"id":"tvrdjava","mjesto":"Tvrđava","emo":"🏰","razina":5,"redci":[["npc","Dobro došao, putniče. Tražiš li nešto?","Welcome, traveller. Are you looking for something?"],["ti","Tražim ključ koji otvara istočna vrata.","I am looking for the key that opens the eastern gate."],["npc","Taj ključ čuva onaj tko zna tri riječi.","That key is kept by the one who knows three words."],["ti","Reci mi koje su, pa ću ih naučiti.","Tell me which ones and I will learn them."],["npc","Strpljenje, hrabrost i znanje. Sve ostalo dolazi samo.","Patience, courage and knowledge. Everything else comes on its own."],["ti","Onda mi treba još malo vremena.","Then I need a little more time."],["npc","Vrijeme imaš. Vrata te čekaju.","You have time. The gate is waiting for you."]]}];
  var SAVJETI = [["Croatian has no articles — „kuća\" means both „a house\" and „the house\".","Hrvatski nema članova — „kuća\" znači i „a house\" i „the house\"."],["An adjective agrees with its noun: velik grad, velika kuća, veliko more.","Pridjev se slaže s imenicom: velik grad, velika kuća, veliko more."],["Masculine nouns usually end in a consonant, feminine in -a, neuter in -o or -e.","Muški rod najčešće završava na suglasnik, ženski na -a, srednji na -o ili -e."],["In the accusative, feminine -a becomes -u: salata → salatu.","U akuzativu ženski rod mijenja -a u -u: salata → salatu."],["Inanimate masculine nouns do not change in the accusative: vidim stol.","Neživo u muškom rodu ostaje isto u akuzativu: vidim stol."],["Animate masculine nouns take -a in the accusative: vidim psa, vidim brata.","Živo u muškom rodu dobiva -a: vidim psa, vidim brata."],["„U\" and „na\" take the locative when nothing moves: u kući, na stolu.","Nakon „u\" i „na\" s mirovanjem ide lokativ: u kući, na stolu."],["With motion, „u\" and „na\" take the accusative: idem u školu, idem na more.","S kretanjem „u\" i „na\" traže akuzativ: idem u školu, idem na more."],["„Bez\", „iz\", „od\" and „do\" always take the genitive.","„Bez\", „iz\", „od\", „do\" uvijek traže genitiv."],["Negation is ne + verb, but „nemam\" and „neću\" are written as one word.","Negacija: ne + glagol, ali „nemam\" i „neću\" pišu se spojeno."],["Yes/no questions are often formed with „li\": Imaš li vremena?","Pitanje se često tvori s „li\": Imaš li vremena?"],["Past tense = auxiliary verb + participle: bio sam, kupila je.","Prošlo vrijeme: pomoćni glagol + glagolski pridjev (bio sam, kupila je)."],["The past participle agrees in gender: on je bio, ona je bila, oni su bili.","Glagolski pridjev se slaže s rodom: on je bio, ona je bila, oni su bili."],["Future = infinitive + ću/ćeš/će: kupit ću, doći ćemo.","Futur: infinitiv + ću/ćeš/će (kupit ću, doći ćemo)."],["The dative answers „to whom\": dajem knjigu bratu.","Dativ odgovara na pitanje „kome\": dajem knjigu bratu."],["„Sviđa mi se\" literally means „it is pleasing to me\" — liking uses the dative.","„Sviđa mi se\" doslovno znači „it is pleasing to me\"."],["Comparatives: velik → veći, dobar → bolji, hladan → hladniji.","Komparativ: velik → veći, dobar → bolji, hladan → hladniji."],["Superlatives add naj-: najveći, najbolji, najhladniji.","Superlativ se tvori s naj-: najveći, najbolji, najhladniji."],["The instrumental expresses means: putujem vlakom, pišem olovkom.","Instrumental za sredstvo: putujem vlakom, pišem olovkom."],["After 2, 3 and 4 the noun takes the genitive singular: dva stola.","Uz brojeve 2, 3 i 4 imenica ide u genitiv jednine: dva stola."],["From five on, the noun takes the genitive plural: pet stolova.","Od pet nadalje ide genitiv množine: pet stolova."],["Double negation is standard: nitko ništa ne zna.","Dvostruka negacija je normalna: nitko ništa ne zna."],["Word order is free, but clitics (je, sam, se) go in second position.","Red riječi je slobodan, ali enklitike (je, sam, se) idu na drugo mjesto."],["„Se\" is written separately and moves around: odmori se, ja se odmaram.","„Se\" se piše odvojeno i mijenja mjesto: odmori se, ja se odmaram."],["Dž, lj and nj are single letters, not two.","Slova dž, lj i nj su jedno slovo, ne dva."],["Č is harder, ć is softer — čokolada, ćevapi.","Č je tvrđe, ć je mekše — čokolada, ćevapi."],["Every letter is always read the same way — Croatian spelling is phonetic.","Svako slovo se uvijek čita isto — hrvatski je fonetski jezik."],["Stress is usually on the first syllable and never on the last.","Naglasak je najčešće na prvom slogu, nikad na zadnjem."],["The vocative is used to address someone: Marko → Marko!, Ana → Ana!","Vokativ se koristi za dozivanje: Marko → Marko!, Ana → Ana!"],["Formal „Vi\" is capitalised in letters as a mark of respect.","„Vi\" iz poštovanja piše se velikim slovom u pismima."]];
  var SUPROTNICE = [["velik","mali","big / small"],["nov","star","new / old"],["dobar","loš","good / bad"],["lijep","ružan","beautiful / ugly"],["topao","hladan","warm / cold"],["brz","spor","fast / slow"],["skup","jeftin","expensive / cheap"],["visok","nizak","tall / short"],["dug","kratak","long / short"],["težak","lagan","heavy / light"],["pun","prazan","full / empty"],["čist","prljav","clean / dirty"],["mokar","suh","wet / dry"],["glasan","tih","loud / quiet"],["svijetao","taman","bright / dark"],["mek","tvrd","soft / hard"],["bogat","siromašan","rich / poor"],["sretan","tužan","happy / sad"],["miran","ljut","calm / angry"],["zauzet","slobodan","busy / free"],["širok","uzak","wide / narrow"],["debeo","tanak","thick / thin"],["sladak","gorak","sweet / bitter"],["zdrav","bolestan","healthy / ill"],["siguran","opasan","safe / dangerous"],["zanimljiv","dosadan","interesting / boring"],["rano","kasno","early / late"],["brzo","polako","quickly / slowly"],["ovdje","tamo","here / there"],["gore","dolje","up / down"],["lijevo","desno","left / right"],["blizu","daleko","near / far"],["uvijek","nikad","always / never"],["puno","malo","a lot / a little"],["danas","sutra","today / tomorrow"],["otvoriti","zatvoriti","to open / to close"],["doći","otići","to come / to leave"],["početi","završiti","to start / to finish"],["kupiti","prodati","to buy / to sell"],["uzeti","dati","to take / to give"],["naći","izgubiti","to find / to lose"],["smijati se","plakati","to laugh / to cry"],["govoriti","šutjeti","to speak / to be silent"],["zapamtiti","zaboraviti","to memorise / to forget"],["ustati","leći","to get up / to lie down"],["pitati","odgovoriti","to ask / to answer"],["jutro","večer","morning / evening"],["dan","noć","day / night"],["ljeto","zima","summer / winter"],["pobjeda","poraz","victory / defeat"],["sreća","tuga","happiness / sadness"],["ljubav","mržnja","love / hate"],["pitanje","odgovor","question / answer"],["polazak","dolazak","departure / arrival"],["crn","bijel","black / white"]];
  /*[/SADRZAJ]*/
  var POID = {};
  BANKA.forEach(function (r) { POID[r.id] = r; });

  function kat(k) { return BANKA.filter(function (r) { return r.kat === k; }); }
  function po(id) { return POID[id]; }

  /* ---------- pomoćne ---------- */
  function mix(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function uzmi(a, n) { return mix(a).slice(0, n); }
  function rand(a) { return a[Math.floor(Math.random() * a.length)]; }
  function cijeli(n) { return Math.floor(Math.random() * n); }
  function norm(s) { return String(s == null ? '' : s).trim().toLowerCase().replace(/\s+/g, ' '); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }
  function el(id) { return document.getElementById(id); }
  function slug(s) {
    return String(s).toLowerCase()
      .replace(/č|ć/g, 'c').replace(/đ/g, 'd').replace(/š/g, 's').replace(/ž/g, 'z')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  }

  /* ---------- mediji (uvijek s ugrađenom zamjenom) ---------- */
  function slika(datoteka, zamjena, velicina, klasa) {
    var v = velicina || 96;
    return '<span class="slikaOkvir ' + (klasa || '') + '" style="width:' + v + 'px;height:' + v + 'px;font-size:' + Math.round(v * 0.55) + 'px">' +
      '<img src="' + MEDIJ + datoteka + '" alt="" loading="lazy" ' +
      'onerror="this.remove()">' +
      '<span class="zamjena" style="font-size:' + Math.round(v * 0.5) + 'px">' + zamjena + '</span>' +
      '</span>';
  }
  function slikaRijeci(r, velicina) {
    return slika('rijec-' + r.id + '.png', r.emo, velicina, 'mrlja-' + r.kat);
  }
  var ZVUK_OK = true;
  function zvuk(datoteka) {
    if (!ZVUK_OK) return;
    try {
      var a = new Audio(MEDIJ + datoteka);
      a.volume = 0.85;
      var p = a.play();
      if (p && p.catch) p.catch(function () { });
    } catch (e) { }
  }
  function zvukRijeci(r) { zvuk('rijec-' + r.id + '.mp3'); }
  /* mali sintetički tonovi — rade i bez ijedne datoteke */
  var AC = null;
  function ton(f, t, tip) {
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = tip || 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, AC.currentTime);
      g.gain.exponentialRampToValueAtTime(0.14, AC.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + (t || 0.15));
      o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + (t || 0.15) + 0.02);
    } catch (e) { }
  }
  function pip(dobro) {
    if (dobro) { ton(660, .09); setTimeout(function () { ton(880, .13); }, 80); }
    else { ton(200, .2, 'square'); }
  }

  /* ---------- poruke ---------- */
  var _p = null, _pt = null;
  function poruka(tekst, vrsta) {
    if (!_p) { _p = document.createElement('div'); _p.className = 'poruka'; document.body.appendChild(_p); }
    _p.textContent = tekst;
    _p.className = 'poruka vidi ' + (vrsta || '');
    clearTimeout(_pt);
    _pt = setTimeout(function () { _p.className = 'poruka ' + (vrsta || ''); }, 1600);
  }

  /* ---------- konfeti ---------- */
  function konfeti(n) {
    var boje = ['#F4B942', '#E8623A', '#2FA8A0', '#7B5EA7', '#7CB342', '#3E7CB1'];
    for (var i = 0; i < (n || 40); i++) (function (i) {
      var d = document.createElement('div');
      d.className = 'konfet';
      d.style.background = boje[i % boje.length];
      d.style.left = (10 + Math.random() * 80) + 'vw';
      d.style.top = '-20px';
      document.body.appendChild(d);
      var pad = 900 + Math.random() * 900, poc = performance.now(), zaokret = Math.random() * 720, x = (Math.random() - .5) * 220;
      requestAnimationFrame(function korak(t) {
        var k = (t - poc) / pad;
        if (k >= 1) { d.remove(); return; }
        d.style.transform = 'translate(' + (x * k) + 'px,' + (k * (window.innerHeight + 60)) + 'px) rotate(' + (zaokret * k) + 'deg)';
        d.style.opacity = String(1 - k * k);
        requestAnimationFrame(korak);
      });
    })(i);
  }

  /* ---------- spremanje ---------- */
  function kljuc() { return 'croland-mini-' + (window.IGRA_ID || 'x'); }
  function stanje() {
    try { return JSON.parse(localStorage.getItem(kljuc()) || '{}'); } catch (e) { return {}; }
  }
  function spremi(o) {
    try { localStorage.setItem(kljuc(), JSON.stringify(o)); } catch (e) { }
  }
  function najbolje() { return stanje().najbolje || 0; }
  function zapisiRezultat(bodovi) {
    var s = stanje();
    if (bodovi > (s.najbolje || 0)) { s.najbolje = bodovi; s.kada = new Date().toISOString(); spremi(s); return true; }
    return false;
  }

  /* ---------- zastor / kraj igre ---------- */
  function zastor(html) {
    var z = document.createElement('div');
    z.className = 'zastor';
    z.innerHTML = '<div class="kut">' + html + '</div>';
    document.body.appendChild(z);
    return z;
  }
  function zatvoriZastore() {
    Array.prototype.forEach.call(document.querySelectorAll('.zastor'), function (z) { z.remove(); });
  }
  /**
   * Završni ekran. Skriveni max: igraču se maksimum otkriva tek kad ga dosegne.
   * @param opts {naslov, tekst, bodovi, maks, ponovno(fn)}
   */
  function kraj(opts) {
    var b = Math.max(0, Math.round(opts.bodovi || 0));
    var maks = opts.maks || window.IGRA_MAKS || 100;
    var presao = b >= maks;
    var rekord = zapisiRezultat(b);
    var prijeNaplaceno = stanje().naplaceno || 0;
    var isplata = Math.max(0, b - prijeNaplaceno);
    if (isplata > 0) { var s = stanje(); s.naplaceno = b; spremi(s); }
    if (presao) konfeti(90);
    var html =
      '<h3>' + esc(opts.naslov || (presao ? 'You beat the game!' : 'Game over')) + '</h3>' +
      '<p>' + (opts.tekst || '') + '</p>' +
      '<div class="valute">' +
      ['LP', 'VP', 'GP', 'PP'].map(function (v) {
        return '<div class="valuta"><b>+' + isplata + '</b><span>' + v + '</span></div>';
      }).join('') +
      '</div>' +
      '<p style="font-size:13px">' +
      (isplata > 0 ? 'Credited ' + isplata + ' in each currency. ' : 'No new payout this time — you have already collected ' + prijeNaplaceno + '. ') +
      (presao
        ? '<b>You have taken the full ' + maks + ' from this game.</b>'
        : 'Total so far: <b>' + Math.max(b, prijeNaplaceno) + '</b>' + (rekord ? ' — new record!' : '')) +
      '</p>' +
      '<div class="tipke" style="margin-top:16px">' +
      '<button class="g glavni" id="_opet">Play again</button>' +
      (opts.beskonacno ? '<button class="g" id="_bez">Endless ▶</button>' : '') +
      '</div>';
    var z = zastor(html);
    z.querySelector('#_opet').onclick = function () { z.remove(); if (opts.ponovno) opts.ponovno(); else location.reload(); };
    if (opts.beskonacno) z.querySelector('#_bez').onclick = function () { z.remove(); opts.beskonacno(); };
    return z;
  }

  /* ---------- HUD ---------- */
  function hud(o) {
    var d = document.createElement('header');
    d.className = 'hud';
    d.innerHTML =
      '<div class="ime">' + esc(o.ime) + '<small>' + esc(o.podnaslov || '') + '</small></div>' +
      (o.znakovi || []).map(function (z) {
        return '<span class="znak ' + (z.klasa || '') + '" id="' + z.id + '">' + z.html + '</span>';
      }).join('');
    return d;
  }
  function srca(n, od) {
    var s = '';
    for (var i = 0; i < (od || 3); i++) s += (i < n ? '❤️' : '🤍');
    return s;
  }

  /* ---------- strogi upis (s dijakriticima) ---------- */
  function tipkeDijakritika(input) {
    var znakovi = ['č', 'ć', 'đ', 'š', 'ž'];
    var d = document.createElement('div');
    d.className = 'tipke';
    d.innerHTML = znakovi.map(function (z) {
      return '<button type="button" class="dijakritik" data-z="' + z + '">' + z + '</button>';
    }).join('');
    d.addEventListener('click', function (e) {
      var b = e.target.closest('.dijakritik'); if (!b) return;
      var poc = input.selectionStart == null ? input.value.length : input.selectionStart;
      var kraj_ = input.selectionEnd == null ? poc : input.selectionEnd;
      input.value = input.value.slice(0, poc) + b.dataset.z + input.value.slice(kraj_);
      input.focus();
      input.setSelectionRange(poc + 1, poc + 1);
    });
    return d;
  }


  /* ---------- skriveni prijevod (otkriva se klikom) ----------
     Prijevod koji bi inače riješio zadatak umjesto igrača stoji skriven;
     klik na oznaku otkriva engleski tekst. */
  var _enVezan = false;
  function vezanjeEN() {
    if (_enVezan || typeof document === 'undefined') return;
    _enVezan = true;
    document.addEventListener('click', function (e) {
      var b = e.target && e.target.closest ? e.target.closest('.otkrijEN') : null;
      if (!b || !b.getAttribute('data-en')) return;
      e.preventDefault(); e.stopPropagation();
      b.textContent = b.getAttribute('data-en');
      b.removeAttribute('data-en');
      b.className = 'otkrijEN otkriven';
    }, true);
  }
  function skritEN(tekst, natpis, kaoSpan) {
    if (tekst == null || tekst === '') return '';
    vezanjeEN();
    var oznaka = esc(natpis || '\ud83d\udc41 translation');
    /* unutar <button> ne smije stajati drugi <button> — tada ide span */
    if (kaoSpan) return '<span role="button" tabindex="0" class="otkrijEN" data-en="' + esc(tekst) + '">' + oznaka + '</span>';
    return '<button type="button" class="otkrijEN" data-en="' + esc(tekst) + '">' + oznaka + '</button>';
  }

  /*[CL-DODATAK]*/
  /* ---------- rečenice, praznine, dijalozi, savjeti ---------- */
  function recenice(raz, doRazine) {
    if (!raz) return RECENICE.slice();
    return RECENICE.filter(function (r) { return doRazine ? r[2] <= raz : r[2] === raz; });
  }
  function recenica(raz, doRazine) { return rand(recenice(raz, doRazine)); }
  function praznine(raz, doRazine) {
    if (!raz) return PRAZNINE.slice();
    return PRAZNINE.filter(function (p) { return doRazine ? p[5] <= raz : p[5] === raz; });
  }
  function praznina(raz, doRazine) { return rand(praznine(raz, doRazine)); }
  function dijalozi(raz) {
    if (!raz) return DIJALOZI.slice();
    return DIJALOZI.filter(function (d) { return d.razina <= raz; });
  }
  function savjet() { return rand(SAVJETI); }
  function suprotnica() { return rand(SUPROTNICE); }
  function suprotnice() { return SUPROTNICE.slice(); }

  /* razina prema napretku: 1-5 iz rednog broja koraka i ukupne dužine */
  function razinaZa(i, ukupno) {
    var r = Math.floor((i / Math.max(1, ukupno)) * 5) + 1;
    return Math.max(1, Math.min(5, r));
  }

  /* ---------- praćenje svladanih riječi (dijeli se među igrama) ---------- */
  function ucenje(id, dobro) {
    try {
      var k = "croland-mini-ucenje";
      var m = JSON.parse(localStorage.getItem(k) || "{}");
      var z = m[id] || { t: 0, k: 0 };
      if (dobro) z.t++; else z.k++;
      m[id] = z;
      localStorage.setItem(k, JSON.stringify(m));
    } catch (e) { }
  }
  function ucenjeSve() {
    try { return JSON.parse(localStorage.getItem("croland-mini-ucenje") || "{}"); }
    catch (e) { return {}; }
  }
  function zaPonoviti(n) {
    var m = ucenjeSve(), popis = [];
    Object.keys(m).forEach(function (id) {
      var z = m[id];
      if (z.k > 0 && z.k >= z.t && POID[id]) popis.push({ r: POID[id], k: z.k, t: z.t });
    });
    popis.sort(function (a, b) { return (b.k - b.t) - (a.k - a.t); });
    return popis.slice(0, n || 12);
  }
  /* riječi koje igrač još nije vidio — daje prednost novom sadržaju */
  function svjezeRijeci(n, filtar) {
    var m = ucenjeSve();
    var izvor = filtar ? BANKA.filter(filtar) : BANKA;
    var nove = izvor.filter(function (r) { return !m[r.id]; });
    var ostalo = izvor.filter(function (r) { return m[r.id]; });
    return mix(nove).concat(mix(ostalo)).slice(0, n);
  }

  /* ---------- savjet između razina ---------- */
  function savjetZastor(nastavi) {
    var s = savjet();
    var z = zastor(
      '<h3>💡 Tip</h3><p style="text-align:left">' + esc(s[0]) + '</p>' +
      '<p style="font-size:13px;color:#8B7B6B;text-align:left">' + esc(s[1]) + '</p>' +
      '<div class="tipke" style="margin-top:14px"><button class="g glavni" id="_dalje">Next</button></div>');
    z.querySelector('#_dalje').onclick = function () { z.remove(); if (nastavi) nastavi(); };
    return z;
  }
  /*[/CL-DODATAK]*/

  return {
    MEDIJ: MEDIJ, BANKA: BANKA, KAT: KAT, kat: kat, po: po,
    /*[CL-IZVOZ]*/
    RECENICE: RECENICE, PRAZNINE: PRAZNINE, DIJALOZI: DIJALOZI, SAVJETI: SAVJETI,
    SUPROTNICE: SUPROTNICE, suprotnica: suprotnica, suprotnice: suprotnice,
    recenice: recenice, recenica: recenica, praznine: praznine, praznina: praznina,
    dijalozi: dijalozi, savjet: savjet, savjetZastor: savjetZastor, razinaZa: razinaZa,
    ucenje: ucenje, ucenjeSve: ucenjeSve, zaPonoviti: zaPonoviti, svjezeRijeci: svjezeRijeci,
    /*[/CL-IZVOZ]*/
    mix: mix, uzmi: uzmi, rand: rand, cijeli: cijeli, norm: norm, esc: esc, el: el, slug: slug,
    slika: slika, slikaRijeci: slikaRijeci, zvuk: zvuk, zvukRijeci: zvukRijeci, ton: ton, pip: pip,
    poruka: poruka, konfeti: konfeti,
    stanje: stanje, spremi: spremi, najbolje: najbolje,
    zastor: zastor, zatvoriZastore: zatvoriZastore, kraj: kraj,
    hud: hud, srca: srca, tipkeDijakritika: tipkeDijakritika,
    skritEN: skritEN
  };
})();

<script>
/* =====================================================================
   Tvrđava Galebnjak — pustolovina u dvanaest soba
   ---------------------------------------------------------------------
   Priča: kaštelan Ivo je u bolnici, a ključevi tvrđave su skriveni jedan
   za drugim. Svaka soba daje ključ sljedeće. U petak gradsko vijeće glasa
   o prodaji tvrđave hotelu; spašava je samo stari statut.

   Težina raste sa sobama (razina 1 → 5). Svaki zadatak ima razlog u priči.
   Detaljan opis i popis slika: TVRDJAVA-DIZAJN.md
   Maksimum (skriveno od igrača): 100 bodova × 4 valute
   ===================================================================== */

var MED = CL.MEDIJ + 'tvr-';

var LIKOVI = {
  lucija:{ime:'Lucija · Ivo’s granddaughter', emo:'👩'},
  ivo:   {ime:'Ivo · a note',                 emo:'📝'},
  ivoZiv:{ime:'Ivo · back from hospital, on crutches', emo:'👴'},

})();

function crtajScenu(s, tocke, dekor){

/* koordinate su u pikselima slike 320×180 */
function okvir(b){
  return 'left:' + (b[0]/3.2) + '%;top:' + (b[1]/1.8) + '%;width:' + ((b[2]-b[0])/3.2) + '%;height:' + ((b[3]-b[1])/1.8) + '%';
}

function govori(lik, hr, en){

/* ---------- slijed koraka ---------- */
function niz(koraci, gotovo){
  var i = 0;
  (function dalje(){
    if (i >= koraci.length) return gotovo && gotovo();
    koraci[i++](dalje);
  })();
}
/* replika s gumbom „Next" */
function R(lik, hr, en){
  return function(dalje){
    govori(lik, hr, en);
    zad('<div class="red"><button class="g glavni" id="dalje">Next ▶</button></div>');
    CL.el('dalje').onclick = dalje;
  };
}
/* pitanje s ponuđenim odgovorima; opcije: [[tekst, točno?], ...] */
function P(lik, hr, en, opcije, iznad, krivo){
  return function(dalje){
    govori(lik, hr, en);
    var z = zad((iznad || '') + '<div class="mala">Choose the answer:</div><div class="opcije" id="op"></div>');
    CL.mix(opcije).forEach(function(o){

        else { CL.pip(false); b.classList.add('krivo'); b.disabled = true;
          CL.poruka(krivo || 'That is not what it says.', 'lose'); }
      };
      CL.el('op').appendChild(b);
    });
  };
}
function dokument(vrsta, naslov, redci, rjecnik){
  return '<div class="dok ' + (vrsta || '') + '"><div class="naslovDok">' + CL.esc(naslov) + '</div>' +
    redci.map(function(r){ return '<p>' + CL.esc(r) + '</p>'; }).join('') + '</div>' +
    (rjecnik ? '<div class="rjecnik">Words: ' + rjecnik.map(function(w){
      return '<b>' + CL.esc(w[0]) + '</b> – ' + CL.esc(w[1]); }).join(' · ') + '</div>' : '');
}
function D(lik, hr, en, vrsta, naslov, redci, rjecnik){
  return function(dalje){
    govori(lik, hr, en);
    zad(dokument(vrsta, naslov, redci, rjecnik) + '<div class="red"><button class="g glavni" id="dalje">Next ▶</button></div>');

function krivoTrese(el){ el.classList.add('tresi'); setTimeout(function(){ el.classList.remove('tresi'); }, 350); }

/* ---------- ulazak u sobu i kraj sobe ---------- */
function udi(s){
  S.soba = s.id; spremiPricu();
  osvjeziHud(); crtajKartu();
  crtajScenu(s);
  if (S.rijesene[s.id]){
    var n = sljedeca(s);
    govori('lucija', 'Ovdje smo već sve napravili.', 'We have already done everything here.');
    zad('<h3>Room done ✔</h3><div class="mala">' + (n ? 'Your next key opens: ' + n.hr + ' (' + n.ime + ').' : 'The story is over.') + '</div>' +
      (n ? '<div class="red"><button class="g glavni" id="dalje">Go to ' + CL.esc(n.hr) + ' ▶</button></div>' : ''));
    if (n) CL.el('dalje').onclick = function(){ udi(n); };
    return;
  }
  SOBA[s.id](s);
  window.scrollTo({top:0, behavior:'smooth'});
}

function sobaGotova(s, poruka){
  var n = sljedeca(s);
  if (!S.rijesene[s.id]){ S.rijesene[s.id] = true; S.bodovi += s.bodovi; }
  if (n && S.kljucevi.indexOf(n.id) < 0) S.kljucevi.push(n.id);
  spremiPricu(); osvjeziHud(); crtajKartu();
  CL.pip(true); CL.konfeti(24);
  if (!n) return kraj();
  zad('<div class="nagrada"><div style="font-size:44px">🗝</div><div><h3>' + CL.esc(poruka || 'You found a key!') + '</h3>' +
    '<div class="mala">The tag on it says:</div><span class="privjesak">' + CL.esc(n.hr.toUpperCase()) + '</span></div></div>' +
    '<div class="privjesci">Key ring: ' + S.kljucevi.map(function(k){ return '<span>' + CL.esc(sobaPo(k).hr.toUpperCase()) + '</span>'; }).join('') + '</div>' +
    '<div class="red"><button class="g glavni veliki" id="dalje">Go to ' + CL.esc(n.hr) + ' ▶</button></div>');
  CL.el('dalje').onclick = function(){ udi(n); };
}

var SOBA = {};

/* ---------- 1. VRATA · razina 1 · pridjevi uz „ključ" ---------- */
var K_VELICINA = [['velik','big'],['malen','small']];
var K_BOJA = [['žut','#D9A520'],['siv','#9AA3AB'],['crn','#2B2B2B']];
var K_STANJE = [['star','old'],['nov','new']];

function svgKljuc(v, boja, star){
  /* pikselni ključ na mreži 20×9; velik ključ je dvostruko veći */
  var px = v === 0 ? 5 : 3, c = K_BOJA[boja][1], r = [];
  function p(x, y, col){ r.push('<rect x="' + x*px + '" y="' + y*px + '" width="' + px + '" height="' + px + '" fill="' + (col || c) + '"/>'); }
  [[1,2],[2,1],[3,1],[4,1],[5,2],[1,3],[5,3],[1,4],[5,4],[1,5],[5,5],[1,6],[5,6],[2,7],[3,7],[4,7]].forEach(function(t){ p(t[0], t[1]); });
  for (var x = 6; x < 19; x++) p(x, 4);
  [[16,5],[16,6],[18,5],[18,6],[18,7],[13,5]].forEach(function(t){ p(t[0], t[1]); });
  if (star) [[3,1,'#8B4A22'],[9,4,'#8B4A22'],[12,4,'#A0582A'],[5,5,'#8B4A22'],[18,6,'#A0582A']].forEach(function(t){ p(t[0], t[1], t[2]); });
  else [[2,2,'#fff'],[8,4,'#fff'],[9,4,'#fff']].forEach(function(t){ p(t[0], t[1], t[2]); });
  return '<svg width="' + 20*px + '" height="' + 9*px + '" viewBox="0 0 ' + 20*px + ' ' + 9*px + '">' + r.join('') + '</svg>';
}

function zadKljuc(lik, uvod, uvodEn, sto, stoEn){
  return function(dalje){
    var cilj = [CL.cijeli(2), CL.cijeli(3), CL.cijeli(2)];
    /* tri lažna ključa: svaki se od pravoga razlikuje u točno jednom svojstvu */
    var ponuda = [cilj.slice(),
      [1-cilj[0], cilj[1], cilj[2]],
      [cilj[0], (cilj[1] + 1 + CL.cijeli(2)) % 3, cilj[2]],
      [cilj[0], cilj[1], 1-cilj[2]]];
    var opis = sto + ' je ' + K_VELICINA[cilj[0]][0] + ', ' + K_BOJA[cilj[1]][0] + ' i ' + K_STANJE[cilj[2]][0] + '.';
    govori(lik, uvod + ' ' + opis, uvodEn + ' ' + stoEn + ' is ' + K_VELICINA[cilj[0]][1] + ', ' +
      ['yellow','grey','black'][cilj[1]] + ' and ' + K_STANJE[cilj[2]][1] + '.');
    zad('<h3>Which key?</h3><div class="mala">Listen to Lucija and pick the one key that matches every word.</div><div class="kljucevi" id="kk"></div>');
    CL.mix(ponuda).forEach(function(k){
      var b = document.createElement('button'); b.className = 'kljucK';
      b.innerHTML = svgKljuc(k[0], k[1], k[2] === 0);
      b.onclick = function(){
        if (k.join() === cilj.join()){ CL.pip(true); b.style.background = '#CFE8B8'; setTimeout(dalje, 500); }
        else { CL.pip(false); b.classList.add('krivo'); krivoTrese(b); CL.poruka('It does not fit the lock.', 'lose'); }
      };
      CL.el('kk').appendChild(b);
    });
  };
}

var BROJ = ['nula','jedan','dva','tri','četiri','pet','šest','sedam','osam','devet','deset','jedanaest','dvanaest'];
var BROJ_EN = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve'];
function sati(h){ return h === 1 ? 'sat' : (h <= 4 ? 'sata' : 'sati'); }
function svgSat(h, m){
  var kut = function(st){ return (st - 90) * Math.PI / 180; };
  var km = kut(m * 6), kh = kut((h % 12) * 30 + m / 2);
  var t = '';
  for (var i = 0; i < 12; i++){ var a = kut(i * 30);
    t += '<rect x="' + (48 + Math.cos(a)*38 - 2) + '" y="' + (48 + Math.sin(a)*38 - 2) + '" width="4" height="4" fill="#241C15"/>'; }
  return '<svg viewBox="0 0 96 96">' + t +
    '<line x1="48" y1="48" x2="' + (48 + Math.cos(kh)*22) + '" y2="' + (48 + Math.sin(kh)*22) + '" stroke="#241C15" stroke-width="6"/>' +
    '<line x1="48" y1="48" x2="' + (48 + Math.cos(km)*34) + '" y2="' + (48 + Math.sin(km)*34) + '" stroke="#C8412F" stroke-width="3"/>' +
    '<rect x="44" y="44" width="8" height="8" fill="#241C15"/></svg>';
}
function zadSat(vrsta, uvod, uvodEn){
  return function(dalje){
    var h = 1 + CL.cijeli(11), n = h % 12 + 1, cilj, hr, en;
    if (vrsta === 0){ cilj = [h, 0]; hr = BROJ[h] + ' ' + sati(h); en = BROJ_EN[h] + ' o’clock'; }
    else if (vrsta === 1){ cilj = [h, 30]; hr = 'pola ' + BROJ[n]; en = 'half past ' + BROJ_EN[h]; }
    else if (CL.cijeli(2)){ cilj = [h, 45]; hr = 'četvrt do ' + BROJ[n]; en = 'quarter to ' + BROJ_EN[n]; }
    else { cilj = [h, 15]; hr = BROJ[h] + ' i petnaest'; en = 'quarter past ' + BROJ_EN[h]; }
    var st = [12, 0];
    govori('rok', uvod.replace('#', hr), uvodEn.replace('#', en));
    function crtaj(){
      zad('<h3>Set the tower clock</h3><div class="satOkvir">' + svgSat(st[0], st[1]) +
        '<div class="kontrole"><button class="g" data-k="h-">◀</button><span>hour hand</span><button class="g" data-k="h+">▶</button>' +
        '<button class="g" data-k="m-">◀</button><span>minute hand</span><button class="g" data-k="m+">▶</button></div></div>' +
        '<div class="red"><button class="g glavni" id="gotovo">Done ▶</button></div>');
      Array.prototype.forEach.call(document.querySelectorAll('[data-k]'), function(b){
        b.onclick = function(){
          var k = b.dataset.k;
          if (k === 'h+') st[0] = st[0] % 12 + 1;
          if (k === 'h-') st[0] = (st[0] + 10) % 12 + 1;
          if (k === 'm+'){ st[1] += 15; if (st[1] === 60){ st[1] = 0; st[0] = st[0] % 12 + 1; } }
          if (k === 'm-'){ st[1] -= 15; if (st[1] < 0){ st[1] = 45; st[0] = (st[0] + 10) % 12 + 1; } }
          crtaj();
        };
      });
      CL.el('gotovo').onclick = function(){
        if (st[0] === cilj[0] && st[1] === cilj[1]){ CL.pip(true); dalje(); }
        else { CL.pip(false); CL.poruka('Rok squints: “Ne, to nije ' + hr + '.”', 'lose'); }
      };
    }
    crtaj();
  };
}

    R('marin','Eto. Sada znate zašto Horvat traži statut. Dok postoji, tvrđava nije na prodaju.','There. Now you know why Horvat wants the charter. As long as it exists, the fortress is not for sale.'),
    P('marin','Recite mi, kome pripada tvrđava prema natpisu?','Tell me, who does the fortress belong to according to the inscription?', [
      ['Svim ljudima ovoga grada.', true], ['Knezu i njegovoj obitelji.', false], ['Ribarima iz drugog grada.', false]],
      '', 'Read the slab again.'),
    R('marin','Ivo mi je ostavio ključ od pisarnice. Lovro, gradski arhivist, radi ondje.','Ivo left me the key to the archive office. Lovro, the town archivist, works there.')
  ], function(){ sobaGotova(s, 'Don Marin gives you a key'); });
};

/* ---------- 9. PISARNICA · razina 4 · razumijevanje službenog pisma ---------- */
var PISMO = [
  'Poštovana gospođo gradonačelnice,',
  'tvrtka Adria Resort želi kupiti tvrđavu Galebnjak. Nudimo dva milijuna eura. U tvrđavi ćemo otvoriti hotel s bazenom i restoranom.',
  'Znamo da neki građani žele muzej. Ali muzej gradu ne donosi novac, a hotel će dati posao za pedeset ljudi.',
  'Molimo gradsko vijeće da o prodaji glasa ovaj petak. Ako grad do tada ne pokaže dokument koji zabranjuje prodaju, prodaja je zakonita.',
  'S poštovanjem, Davor Horvat, odvjetnik'
];
SOBA.pisarnica = function(s){
  var gore = dokument('tiskano', 'LETTER TO THE MAYOR', PISMO, [['glasati','to vote'],['zabranjivati','to forbid'],['zakonit','legal'],['posao','job']]);
  niz([
    R('lovro','Lucija, dobro da si došla. Vijeće u petak glasa o tvrđavi.','Lucija, good that you came. On Friday the council votes on the fortress.'),
    D('lovro','Ovo pismo je jutros stiglo gradonačelnici. Pročitajte ga.','This letter reached the mayor this morning. Read it.', 'tiskano', 'LETTER TO THE MAYOR', PISMO,
      [['glasati','to vote'],['zabranjivati','to forbid'],['zakonit','legal'],['posao','job']]),
    P('lovro','Što Adria Resort želi napraviti u tvrđavi?','What does Adria Resort want to do in the fortress?', [
      ['Hotel s bazenom i restoranom.', true], ['Muzej starog oružja.', false], ['Školu za mlade mornare.', false]], gore),
    P('lovro','Koliko ljudi bi radilo u hotelu?','How many people would work in the hotel?', [
      ['Pedeset.', true], ['Petnaest.', false], ['Dvjesto.', false]], gore),
    P('lovro','Kada vijeće glasa?','When does the council vote?', [
      ['Ovaj petak.', true], ['Sljedeće godine.', false], ['Prošli ponedjeljak.', false]], gore),
    P('lovro','I najvažnije: što može zaustaviti prodaju?','And most important: what can stop the sale?', [
      ['Dokument koji zabranjuje prodaju.', true], ['Novac od ulaznica za muzej.', false], ['Drugo pismo gospodina Horvata.', false]], gore),
    R('lovro','Točno. Trebamo statut, i to do petka. Svi stari dokumenti su dolje, u tamnici. Evo ključa.','Exactly. We need the charter, and by Friday. All the old documents are downstairs, in the dungeon. Here is the key.')
  ], function(){ sobaGotova(s, 'Lovro gives you a key'); });
};

/* ---------- 10. TAMNICA · razina 4 · zagonetke, strogi upis ---------- */
var ZAGONETKE = [
  ['Imam lice, a nemam oči. Imam kazaljke, a nemam ruke. Što sam?', ['sat','ura'], 'I have a face but no eyes. I have hands but no arms. What am I?', ['sat','kist','prozor']],
  ['Puna sam rupa, a ipak držim vodu. Što sam?', ['spužva'], 'I am full of holes, yet I hold water. What am I?', ['spužva','kanta','mreža']],
  ['Imam zube, a ne jedem. Ne govorim, a otvaram vrata. Što sam?', ['ključ'], 'I have teeth but don’t eat. I don’t speak, yet I open doors. What am I?', ['ključ','češalj','pila']]
];
SOBA.tamnica = function(s){
  niz([
    R('lucija','Ovdje je nekad bila tamnica. Danas je skladište. Hladno je.','This used to be the dungeon. Today it is a storeroom. It’s cold.'),
    R('lucija','Gledaj — djedova kutija. Tri brave, i uz svaku zagonetka. Djed obožava zagonetke.','Look — grandpa’s box. Three locks, and a riddle by each one. Grandpa loves riddles.'),
    function(dalje){
      var k = 0, promasaji = 0;
      function krug(){
        if (k >= ZAGONETKE.length) return dalje();
        var z = ZAGONETKE[k];
        govori('ivo', z[0], z[2]);
        var brave = '<div class="brave">' + ZAGONETKE.map(function(_, i){ return '<span class="' + (i < k ? 'otvorena' : '') + '">' + (i < k ? '🔓' : '🔒') + '</span>'; }).join('') + '</div>';
        if (promasaji >= 2){
          zad(brave + '<h3>Riddle ' + (k+1) + '/3</h3><div class="mala">Lucija has an idea: it is one of these.</div><div class="red" id="op"></div>');
          CL.mix(z[3]).forEach(function(o){
            var b = document.createElement('button'); b.className = 'g'; b.textContent = o;
            b.onclick = function(){ if (o === z[3][0]){ CL.pip(true); k++; promasaji = 0; krug(); } else { CL.pip(false); b.classList.add('krivo'); b.disabled = true; } };
            CL.el('op').appendChild(b);
          });
          return;
        }
        zad(brave + '<h3>Riddle ' + (k+1) + '/3</h3><div class="mala">Write the answer in Croatian' +
          (promasaji ? ' — it starts with <b>' + z[1][0][0].toUpperCase() + '</b>' : '') + '.</div>' +
          '<div class="red"><input class="upis" id="upis" autocomplete="off" spellcheck="false"></div><div id="dij"></div>' +
          '<div class="red"><button class="g glavni" id="ok">Try the lock</button></div>');
        var inp = CL.el('upis'); CL.el('dij').appendChild(CL.tipkeDijakritika(inp)); inp.focus();
        function provjeri(){
          if (z[1].indexOf(CL.norm(inp.value)) >= 0){ CL.pip(true); k++; promasaji = 0; krug(); }
          else { CL.pip(false); promasaji++; CL.poruka('The lock doesn’t move.', 'lose'); krug(); }
        }
        CL.el('ok').onclick = provjeri;
        inp.onkeydown = function(e){ if (e.key === 'Enter') provjeri(); };
      }
      krug();
    },
    D('lucija','Otvorila se! Unutra je ključ i pismo.','It opened! Inside there’s a key and a letter.', '', 'IVO’S LETTER', [
      'Lucija, ako ovo čitaš, prešla si pola puta.',
      'Statut nije u ovoj kutiji. Ovdje je ključ od podruma.',
      'U podrumu je škrinja s lokotom. Šifru nisam nikamo zapisao — zapisao sam samo zagonetku. Nalazi se na dnu ovog pisma.',
      'Budi pažljiva. Ne vjeruj ljubaznim ljudima u lijepim odijelima.'],
      [['šifra','code'],['lokot','padlock'],['vjerovati','to trust'],['odijelo','suit']]),
    P('lucija','Na koga djed misli, što ti se čini?','Who do you think grandpa means?', [
      ['Na gospodina Horvata.', true], ['Na don Marina.', false], ['Na kuharicu Jelu.', false]], '', 'Think of the diary and the letter to the mayor.')
  ], function(){ sobaGotova(s, 'The box opens'); });
};

/* ---------- 11. PODRUM · razina 4 · brojevi i logika ---------- */
var SIFRE = [
  ['4602', ['Šifra ima četiri različite znamenke.','Treća znamenka je nula.','Prva je dva puta veća od zadnje.','Druga je zbroj prve i zadnje.','Druga je manja od osam.','Nijedna znamenka nije jedan.']],
  ['8420', ['Šifra ima četiri različite znamenke.','Sve su znamenke parne.','Zadnja je nula, a prva je najveća.','Druga je pola prve.','Treća je za dva manja od druge.']]
];
SOBA.podrum = function(s){
  var sf = CL.rand(SIFRE);
  niz([
    R('lucija','Podrum. Miriše na staro vino i vlagu.','The cellar. It smells of old wine and damp.'),
    function(dalje){
      govori('lucija','Evo škrinje. Lokot ima četiri kotačića s brojevima.','Here’s the chest. The padlock has four number wheels.');
      var z = [0,0,0,0];
      function crtaj(){
        zad('<h3>The padlock</h3>' + dokument('', 'THE BOTTOM OF IVO’S LETTER', sf[1],
          [['znamenka','digit'],['zbroj','sum'],['dva puta veća','twice as big'],['za dva manja','two less'],['parna','even']]) +
          '<div class="lokot">' + z.map(function(v, i){
            return '<div class="kotac"><button data-i="' + i + '" data-s="1">▲</button><b>' + v + '</b><button data-i="' + i + '" data-s="-1">▼</button></div>';
          }).join('') + '</div><div class="red"><button class="g glavni" id="otvori">Open the padlock</button></div>');
        Array.prototype.forEach.call(document.querySelectorAll('.kotac button'), function(b){
          b.onclick = function(){ var i = +b.dataset.i; z[i] = (z[i] + 10 + (+b.dataset.s)) % 10; crtaj(); };
        });
        CL.el('otvori').onclick = function(){
          if (z.join('') === sf[0]){ CL.pip(true); dalje(); }
          else { CL.pip(false); krivoTrese(document.querySelector('.lokot')); CL.poruka('Click. Nothing happens.', 'lose'); }
        };
      }
      crtaj();
    },
    D('lucija','Otvoreno… Ali statuta nema! Samo ključ i još jedna poruka.','Open… But there’s no charter! Just a key and one more note.', '', 'IVO’S LAST NOTE', [
      'Statut nije ovdje. Podrum bi svatko pretražio.',
      'Statut je ondje gdje je knez nekad sudio ljudima.',
      'Ispod kamena na kojem je uklesan galeb.'],
      [['suditi','to judge'],['uklesan','carved'],['galeb','seagull']]),
    R('horvat','Dobar dan, gospođice Lucija. I vi ste u podrumu? Tražite nešto zanimljivo?','Good afternoon, Miss Lucija. You’re in the cellar too? Looking for something interesting?'),
    R('lucija','Samo staro vino, gospodine Horvat. Za otvorenje muzeja.','Just old wine, Mr Horvat. For the museum opening.'),
    R('horvat','Muzej… Naravno. Vidimo se u petak.','The museum… Of course. See you on Friday.'),
    P('lucija','Gdje je knez nekad sudio ljudima? Kamo idemo?','Where did the prince once judge people? Where are we going?', [
      ['U veliku dvoranu.', true], ['U vinski podrum.', false], ['U kuhinju kod Jele.', false]], '', 'Think about the room a prince would sit in.')
  ], function(){ sobaGotova(s, 'The chest held the last key'); });
};

/* ---------- 12. DVORANA · razina 5 · statut i vijeće ---------- */
var STATUT = [
  'Članak 12.',
  'Tvrđava Galebnjak i zemlja oko nje pripadaju svim stanovnicima Male Luke.',
  'Nitko je ne smije prodati ni pokloniti: ni knez, ni gradsko vijeće, ni stranac.',
  'Stanovnici grada čuvaju i popravljaju tvrđavu, a vijeće o tome brine svake godine.'
];
var KAMENI = [
  {b:[36,140,80,170], emo:'🐟'}, {b:[104,140,148,170], emo:'🕊'},
  {b:[172,140,216,170], emo:'⚓'}, {b:[240,140,284,170], emo:'🗝'}
];
SOBA.dvorana = function(s){
  var gore = dokument('statut', 'CHARTER OF MALA LUKA, 1618', STATUT,
    [['pripadati','to belong'],['stanovnik','inhabitant'],['pokloniti','to give away'],['čuvati','to look after']]);
  niz([
    R('lucija','Velika dvorana. Ovdje je knez sudio ljudima. U petak ovdje zasjeda vijeće.','The great hall. The prince judged people here. On Friday the council sits here.'),
    function(dalje){
      govori('lucija','Na podu su četiri kamena s uklesanim znakovima. Koji je pravi?','There are four stones on the floor with carved signs. Which is the right one?');
      zad(dokument('', 'IVO’S LAST NOTE', ['Ispod kamena na kojem je uklesan galeb.']) + '<div class="mala">Click the stone in the hall above.</div>');
      crtajScenu(s, KAMENI.map(function(k, i){
        return {b:k.b, emo:k.emo, boja:'#8C8273', klik:function(el){
          if (i === 1){ CL.pip(true); dalje(); } else { CL.pip(false); el.classList.add('prazna'); CL.poruka('Solid stone. Nothing underneath.', 'lose'); }
        }};
      }), [{b:[136,36,184,120], emo:'🪑'}]);
    },
    D('lucija','Kamen se miče… Kutija od olova. Unutra je — statut!','The stone moves… A lead box. Inside is — the charter!', 'statut', 'CHARTER OF MALA LUKA, 1618', STATUT,
      [['pripadati','to belong'],['stanovnik','inhabitant'],['pokloniti','to give away'],['čuvati','to look after']]),
    R('mira','Petak je. Otvaram sjednicu gradskog vijeća. Lucija, rekli ste da imate dokument.','It is Friday. I open the session of the town council. Lucija, you said you had a document.'),
    P('mira','Vi ste ga pronašli. Recite vijeću: kome pripada tvrđava?','You found it. Tell the council: who does the fortress belong to?', [
      ['Pripada svim stanovnicima grada.', true], ['Pripada knezu i njegovim nasljednicima.', false], ['Pripada onome tko je kupi.', false]], gore),
    P('horvat','Dobro, ali vijeće ima pravo odlučiti drukčije. Vijeće smije prodati tvrđavu.','Fine, but the council has the right to decide otherwise. The council may sell the fortress.', [
      ['Statut kaže da je ni vijeće ne smije prodati.', true], ['Statut kaže da je vijeće smije prodati strancu.', false],
      ['Statut kaže da se o prodaji glasa svake godine.', false]], gore, 'The charter doesn’t say that.'),
    R('horvat','To je samo stari papir. Tko zna je li uopće pravi?','That’s just an old piece of paper. Who knows if it is even genuine?'),
    R('lovro','Pečat je pravi. U gradskom arhivu imamo isti pečat na drugim dokumentima iz 1618.','The seal is genuine. In the town archive we have the same seal on other documents from 1618.'),
    P('mira','Hvala, Lovro. Još jedno pitanje: tko se prema statutu brine o tvrđavi?','Thank you, Lovro. One more question: who, according to the charter, looks after the fortress?', [
      ['Stanovnici grada, a vijeće o tome brine.', true], ['Tvrtka koja kupi tvrđavu, a ne grad.', false], ['Knez i njegovi vojnici, bez vijeća.', false]], gore),
    R('mira','Vijeće je glasalo. Tvrđava Galebnjak se ne prodaje. Muzej se otvara u subotu.','The council has voted. Galebnjak fortress is not for sale. The museum opens on Saturday.'),
    R('ivoZiv','Znao sam da će netko strpljiv stići do kraja. Hvala ti.','I knew someone patient would reach the end. Thank you.')
  ], function(){ sobaGotova(s); });
};

/* ---------- kraj i uvod ---------- */
function kraj(){
  CL.kraj({
    naslov:'Galebnjak is saved',
    tekst:'Twelve rooms, twelve keys: from a ring of unlabelled keys to a town council vote. ' +
      'The charter stays with the town, and the museum opens on Saturday.',
    bodovi:S.bodovi, maks:100,
    ponovno:function(){ S = novoStanje(); spremiPricu(); postaviIgru(); udi(SOBE[0]); }
  });
}

function uvod(){
  var nastavak = Object.keys(S.rijesene).length > 0;
  ploha.innerHTML =
    '<div class="uvod"><div class="naslovna"><img alt="" src="' + MED + 'naslovna.png" onerror="this.remove()">' +
    '<h1>THE FORTRESS<small>Tvrđava Galebnjak</small></h1></div>' +
    '<div class="zad"><h3>The story</h3>' +
    '<p>High above the little town of <b>Mala Luka</b> stands Galebnjak fortress. For forty years its castellan, old <b>Ivo</b>, ' +
    'kept every key on one ring. Yesterday he fell off a ladder and went to hospital — and the keys are hidden, one after another.</p>' +
    '<p>On Friday the town council votes on selling the fortress to a hotel company. Find the keys, room by room, with Ivo’s granddaughter ' +
    '<b>Lucija</b>. Everyone in the fortress speaks Croatian, and it gets harder the deeper you go.</p>' +
    '<div class="red">' + (nastavak
      ? '<button class="g glavni veliki" id="nastavi">Continue ▶</button><button class="g" id="ispocetka">New story</button>'
      : '<button class="g glavni veliki" id="nastavi">Enter the fortress ▶</button>') + '</div></div></div>';
  CL.el('nastavi').onclick = function(){ postaviIgru(); udi(sobaPo(S.soba) || SOBE[0]); };
  if (nastavak) CL.el('ispocetka').onclick = function(){
    if (!confirm('Start the story from the beginning? Your keys will be lost.')) return;
    S = novoStanje(); spremiPricu(); postaviIgru(); udi(SOBE[0]);
  };
  osvjeziHud();
}

uvod();
</script>
