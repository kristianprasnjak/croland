<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="light">
<title>Croland — Portal</title>
<style>

*{box-sizing:border-box;margin:0;padding:0}
:root{
  --papir:#FFF8F0; --papir2:#FFEFE0; --tinta:#2B2118; --meko:#8B7B6B;
  --zut:#F4B942; --koralj:#E8623A; --tirkiz:#2FA8A0; --ljub:#7B5EA7;
  --zelena:#7CB342; --plava:#3E7CB1; --crta:3px solid #2B2118;
  --sjena:0 4px 0 #2B2118;
}
/* Dokument je visok tocno koliko mu treba, ne koliko je visok okvir. Tako
   aplikacija moze okvir izjednaciti sa sadrzajem i klizac ostaje samo jedan —
   onaj glavne stranice. Visina se mijenja kad se promijeni i sam sadrzaj
   (uvod je nizak, igra visa), i to je u redu. */
body{
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  background:var(--papir); color:var(--tinta);
  -webkit-font-smoothing:antialiased; overscroll-behavior:none;
  background-image:radial-gradient(rgba(43,33,24,.045) 1px,transparent 1px);
  background-size:22px 22px;
}
.omot{max-width:1000px;margin:0 auto;padding:14px 14px 40px;display:flex;flex-direction:column}
/* ---- HUD ---- */
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:#fff;border:var(--crta);border-radius:16px;box-shadow:var(--sjena);
  padding:10px 14px;margin-bottom:14px}
.hud .ime{font-weight:800;font-size:18px;letter-spacing:.2px;margin-right:auto}
.hud .ime small{display:block;font-weight:600;font-size:11px;color:var(--meko);letter-spacing:.6px;text-transform:uppercase}
.znak{display:inline-flex;align-items:center;gap:6px;background:var(--papir2);
  border:2px solid var(--tinta);border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.znak.srca{background:#FFE3E3}
.natrag{text-decoration:none;color:var(--tinta);font-weight:700;font-size:14px;
  border:2px solid var(--tinta);border-radius:999px;padding:4px 12px;background:#fff}
.natrag:hover{background:var(--zut)}
/* U aplikaciji se natrag ide gornjim izbornikom („Mini games“), pa je poveznica
   na popis igara suvišna. Ostaje samo kad je igra otvorena sama za sebe. */
html.uApp .natrag{display:none}
/* ---- ploha ---- */
.ploha{background:#fff;border:var(--crta);border-radius:20px;box-shadow:var(--sjena);
  padding:18px;flex:1;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
h2.naslov{font-size:22px;font-weight:800}
p.uputa{font-size:15px;color:var(--meko);line-height:1.5}
.sredina{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;flex:1;text-align:center}
/* ---- gumbi ---- */
.g{font:inherit;font-weight:700;font-size:15px;cursor:pointer;border:var(--crta);
  border-radius:14px;background:#fff;padding:11px 18px;box-shadow:0 4px 0 var(--tinta);
  transition:transform .06s,box-shadow .06s;color:var(--tinta)}
.g:hover{background:var(--papir2)}
.g:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tinta)}
.g.glavni{background:var(--zut)}
.g.veliki{font-size:18px;padding:14px 28px}
.g[disabled]{opacity:.45;cursor:default;transform:none;box-shadow:0 4px 0 var(--tinta)}
.g.tocno{background:var(--zelena);color:#fff}
.g.krivo{background:var(--koralj);color:#fff}
/* ---- kartice / slike ---- */
.slikaOkvir{position:relative;display:inline-flex;align-items:center;justify-content:center;
  background:var(--papir2);border-radius:14px;overflow:hidden}
.slikaOkvir img{width:100%;height:100%;object-fit:contain;display:block}
.slikaOkvir .zamjena{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:60%;line-height:1}
.mrlja-hrana,.mrlja-pice{background:#DCEEFF}
.mrlja-zivotinja,.mrlja-osoba{background:#FFE0C4}
.mrlja-mjesto,.mrlja-predmet,.mrlja-prijevoz,.mrlja-odjeca,.mrlja-priroda{background:#DCEEFF}
.mrlja-vrijeme,.mrlja-skola,.mrlja-sport,.mrlja-tijelo{background:#E9DEF7}
.mrlja-glagol{background:#E2F3CE}
.mrlja-pridjev,.mrlja-boja,.mrlja-broj{background:#FFE0DC}
/* ---- mreža ---- */
.mreza{display:grid;gap:12px}
/* ---- poruke ---- */
.poruka{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:var(--tinta);color:#fff;padding:10px 20px;border-radius:999px;font-weight:700;
  opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
.poruka.vidi{opacity:1;transform:translateX(-50%) translateY(0)}
.poruka.dobro{background:var(--zelena)}
.poruka.lose{background:var(--koralj)}
/* ---- zastor ---- */
.zastor{position:fixed;inset:0;background:rgba(43,33,24,.72);display:flex;align-items:center;
  justify-content:center;padding:20px;z-index:80}
.zastor .kut{background:var(--papir);border:var(--crta);border-radius:22px;box-shadow:0 8px 0 rgba(0,0,0,.35);
  padding:26px;max-width:460px;width:100%;text-align:center;max-height:88vh;overflow:auto}
.zastor h3{font-size:26px;margin-bottom:8px}
.zastor p{color:var(--meko);line-height:1.55;margin-bottom:14px;font-size:15px}
.valute{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.valuta{border:2px solid var(--tinta);border-radius:12px;padding:8px 12px;background:#fff;min-width:66px}
.valuta b{display:block;font-size:20px}
.valuta span{font-size:11px;color:var(--meko);font-weight:700;letter-spacing:.5px}
/* ---- traka napretka ---- */
.napredak{height:12px;background:var(--papir2);border:2px solid var(--tinta);border-radius:999px;overflow:hidden}
.napredak i{display:block;height:100%;background:var(--zut);width:0;transition:width .3s}
/* ---- razno ---- */
.tresi{animation:tresi .3s}
@keyframes tresi{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.skok{animation:skok .35s}
@keyframes skok{0%,100%{transform:scale(1)}45%{transform:scale(1.14)}}
.blijedi{animation:blijedi .3s}
@keyframes blijedi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.konfet{position:fixed;width:10px;height:14px;z-index:90;pointer-events:none;border-radius:2px}
input.upis{font:inherit;font-size:20px;font-weight:700;text-align:center;padding:12px 16px;
  border:var(--crta);border-radius:14px;background:#fff;width:min(380px,90%);color:var(--tinta)}
input.upis:focus{outline:none;background:var(--papir2)}
.tipke{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.dijakritik{font:inherit;font-weight:700;font-size:16px;cursor:pointer;border:2px solid var(--tinta);
  border-radius:10px;background:#fff;width:38px;height:38px}
.dijakritik:hover{background:var(--zut)}
@media (max-width:640px){
  .omot{padding:8px 8px 30px}
  .hud{padding:8px 10px;gap:6px}
  .hud .ime{font-size:15px;width:100%}
  .ploha{padding:12px;border-radius:16px}
  h2.naslov{font-size:18px}
}

/* ==== Portal ==== */

.portalOmot{display:flex;flex-direction:column;gap:10px}
/* tema: što se traži na strani na kojoj je igrač */
.temaP{display:flex;align-items:center;gap:12px;background:var(--zut);border:var(--crta);
  border-radius:14px;padding:8px 14px;min-height:64px}
.temaP .stranaP{flex:none;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
  background:#fff;border:2px solid var(--tinta);border-radius:999px;padding:3px 10px;white-space:nowrap}
.temaP .stranaP.desno{order:3;margin-left:auto}
.temaP .tekstP{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.temaP .tekstP b{display:block;font-size:19px;font-weight:800;line-height:1.25}
.temaP .tekstP small{display:block;font-size:12.5px;font-weight:600;color:#6B5A3E;margin-top:2px}
.temaP .slikaOkvir{flex:none;border:2px solid var(--tinta)}
.temaP.nova{animation:blijedi .35s}
#svijet{width:100%;display:block;border:var(--crta);border-radius:16px;background:#8FD3F4;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.uputaP{font-size:13px;color:var(--meko);text-align:center}
.uputaP kbd{font:inherit;font-weight:700;color:var(--tinta);background:var(--papir2);
  border:2px solid var(--tinta);border-radius:6px;padding:0 6px}
html.dodir .uputaP{display:none}
@media (max-width:640px){
  .ploha{padding:8px;gap:8px}
  .temaP{padding:6px 10px;gap:8px;min-height:54px;border-radius:12px}
  .temaP .stranaP{font-size:10px;padding:2px 7px}
  .temaP .tekstP{gap:8px}
  .temaP .tekstP b{font-size:17px}
  .temaP .tekstP small{font-size:12px}
  #svijet{border-radius:12px}
}


/* ---- skriveni prijevod: otkriva se klikom ---- */
.otkrijEN{font:inherit;font-size:.94em;font-weight:600;line-height:inherit;color:var(--meko);
  background:transparent;border:0;border-bottom:2px dotted currentColor;border-radius:0;
  padding:0 2px;margin:0;cursor:pointer;opacity:.7;letter-spacing:.2px;text-align:left}
.otkrijEN:hover{opacity:1;color:var(--tinta);border-bottom-color:var(--zut)}
.otkrijEN.otkriven{border-bottom:0;cursor:default;opacity:1;color:inherit;padding:0}
</style>

/* Igra u aplikaciji ide u okvir (iframe). Tada otpada poveznica na popis igara

if (window.self !== window.top) document.documentElement.className += ' uApp';
</script>
</head>

  var DIJALOZI = [{"id":"kafic","mjesto":"Kafić","emo":"☕","razina":2,"redci":[["npc","Dobar dan! Izvolite?","Good afternoon! What would you like?"],["ti","Dobar dan. Jednu veliku kavu, molim.","Good afternoon. One large coffee, please."],["npc","S mlijekom ili bez?","With milk or without?"],["ti","S mlijekom, hvala.","With milk, thank you."],["npc","Odmah stiže. Želite li nešto slatko?","Coming right up. Would you like something sweet?"],["ti","Može jedan kolač.","A pastry would be nice."],["npc","Izvolite. Ugodan dan!","Here you are. Have a nice day!"]]},{"id":"pekara","mjesto":"Pekara","emo":"🥖","razina":2,"redci":[["npc","Dobro jutro! Što će biti?","Good morning! What will it be?"],["ti","Dobro jutro. Trebam kruh i dva peciva.","Good morning. I need bread and two rolls."],["npc","Bijeli ili crni kruh?","White or brown bread?"],["ti","Crni, molim. Je li svjež?","Brown, please. Is it fresh?"],["npc","Jutros pečen. Još nešto?","Baked this morning. Anything else?"],["ti","To je sve. Koliko košta?","That is all. How much is it?"],["npc","Četiri eura, molim.","Four euros, please."]]},{"id":"trznica","mjesto":"Tržnica","emo":"🏪","razina":3,"redci":[["npc","Izvolite, gospodine! Rajčice su danas odlične.","Here you go, sir! The tomatoes are excellent today."],["ti","Koliko košta kilogram?","How much is a kilogram?"],["npc","Dva eura. Domaće su, iz mog vrta.","Two euros. They are home-grown, from my garden."],["ti","Uzet ću kilogram rajčica i pola kile paprika.","I will take a kilo of tomatoes and half a kilo of peppers."],["npc","Odmah. Trebate li još povrća?","Right away. Do you need any more vegetables?"],["ti","Ne, hvala. To je dovoljno za danas.","No, thank you. That is enough for today."],["npc","Hvala vam i doviđenja!","Thank you and goodbye!"]]},{"id":"kolodvor","mjesto":"Kolodvor","emo":"🚉","razina":3,"redci":[["npc","Dobar dan, kamo putujete?","Good afternoon, where are you travelling?"],["ti","U Split. Kada polazi sljedeći vlak?","To Split. When does the next t tku. Čitaš li nešto na hrvatskom?","They are for everyone at the start. Do you read anything in Croatian?"],["ti","Čitam kratke priče i gledam vijesti s titlovima.","I read short stories and watch the news with subtitles."],["npc","To je najbolji način. Što više slušaš, to prije progovoriš.","That is the best way. The more you listen, the sooner you will speak."],["ti","Nadam se da ću do ljeta govoriti bez razmišljanja.","I hope that by summer I will speak without thinking."],["npc","Hoćeš, samo nastavi. Vježba čini majstora.","You will, just keep going. Practice makes perfect."]]},{"id":"plaza","mjesto":"Plaža","emo":"🏖","razina":5,"redci":[["npc","Je li ovo mjesto slobodno?","Is this spot free?"],["ti","Jest, slobodno sjednite.","It is, please sit down."],["npc","Hvala. Prekrasan dan, zar ne?","Thank you. A beautiful day, is it not?"],["ti","Predivan. More je toplije nego prošli tjedan.","Wonderful. The sea is warmer than last week."],["npc","Dolazite li često ovamo?","Do you come here often?"],["ti","Kad god imam slobodan dan. Ovdje se najbolje odmorim.","Whenever I have a day off. This is where I rest best."],["npc","Razumijem vas. Nakon mora čovjek je novi.","I understand. After the sea one feels like a new person."]]},{"id":"tvrdjava","mjesto":"Tvrđava","emo":"🏰","razina":5,"redci":[["npc","Dobro došao, putniče. Tražiš li nešto?","Welcome, traveller. Are you looking for something?"],["ti","Tražim ključ koji otvara istočna vrata.","I am looking for the key that opens the eastern gate."],["npc","Taj ključ čuva onaj tko zna tri riječi.","That key is kept by the one who knows three words."],["ti","Reci mi koje su, pa ću ih naučiti.","Tell me which ones and I will learn them."],["npc","Strpljenje, hrabrost i znanje. Sve ostalo dolazi samo.","Patience, courage and knowledge. Everything else comes on its own."],["ti","Onda mi treba još malo vremena.","Then I need a little more time."],["npc","Vrijeme imaš. Vrata te čekaju.","You have time. The gate is waiting for you."]]}];
  var SAVJETI = [["Croatian has no articles — „kuća\" means both „a house\" and „the house\".","Hrvatski nema članova — „kuća\" znači i „a house\" i „the house\"."],["An adjective agrees with its noun: velik grad, velika kuća, veliko more.","Pridjev se slaže s imenicom: velik grad, velika kuća, veliko more."],["Masculine nouns usually end in a consonant, feminine in -a, neuter in -o or -e.","Muški rod najčešće završava na suglasnik, ženski na -a, srednji na -o ili -e."],["In the accusative, feminine -a becomes -u: salata → salatu.","U akuzativu ženski rod mijenja -a u -u: salata → salatu."],["Inanimate masculine nouns do not change in the accusative: vidim stol.","Neživo u muškom rodu ostaje isto u akuzativu: vidim stol."],["Animate masculine nouns take -a in the accusative: vidim psa, vidim brata.","Živo u muškom rodu dobiva -a: vidim psa, vidim brata."],["„U\" and „na\" take the locative when nothing moves: u kući, na stolu.","Nakon „u\" i „na\" s mirovanjem ide lokativ: u kući, na stolu."],["With motion, „u\" and „na\" take the accusative: idem u školu, idem na more.","S kretanjem „u\" i „na\" traže akuzativ: idem u školu, idem na more."],["„Bez\", „iz\", „od\" and „do\" always take the genitive.","„Bez\", „iz\", „od\", „do\" uvijek traže genitiv."],["Negation is ne + verb, but „nemam\" and „neću\" are written as one word.","Negacija: ne + glagol, ali „nemam\" i „neću\" pišu se spojeno."],["Yes/no questions are often formed with „li\": Imaš li vremena?","Pitanje se često tvori s „li\": Imaš li vremena?"],["Past tense = auxiliary verb + participle: bio sam, kupila je.","Prošlo vrijeme: pomoćni glagol + glagolski pridjev (bio sam, kupila je)."],["The past participle agrees in gender: on je bio, ona je bila, oni su bili.","Glagolski pridjev se slaže s rodom: on je bio, ona je bila, oni su bili."],["Future = infinitive + ću/ćeš/će: kupit ću, doći ćemo.","Futur: infinitiv + ću/ćeš/će (kupit ću, doći ćemo)."],["The dative answers „to whom\": dajem knjigu bratu.","Dativ odgovara na pitanje „kome\": dajem knjigu bratu."],["„Sviđa mi se\" literally means „it is pleasing to me\" — liking uses the dative.","„Sviđa mi se\" doslovno znači „it is pleasing to me\"."],["Comparatives: velik → veći, dobar → bolji, hladan → hladniji.","Komparativ: velik → veći, dobar → bolji, hladan → hladniji."],["Superlatives add naj-: najveći, najbolji, najhladniji.","Superlativ se tvori s naj-: najveći, najbolji, najhladniji."],["The instrumental expresses means: putujem vlakom, pišem olovkom.","Instrumental za sredstvo: putujem vlakom, pišem olovkom."],["After 2, 3 and 4 the noun takes the genitive singular: dva stola.","Uz brojeve 2, 3 i 4 imenica ide u genitiv jednine: dva stola."],["From five on, the noun takes the genitive plural: pet stolova.","Od pet nadalje ide genitiv množine: pet stolova."],["Double negation is standard: nitko ništa ne zna.","Dvostruka negacija je normalna: nitko ništa ne zna."],["Word order is free, but clitics (je, sam, se) go in second position.","Red riječi je slobodan, ali enklitike (je, sam, se) idu na drugo mjesto."],["„Se\" is written separately and moves around: odmori se, ja se odmaram.","„Se\" se piše odvojeno i mijenja mjesto: odmori se, ja se odmaram."],["Dž, lj and nj are single letters, not two.","Slova dž, lj i nj su jedno slovo, ne dva."],["Č is harder, ć is softer — čokolada, ćevapi.","Č je tvrđe, ć je mekše — čokolada, ćevapi."],["Every letter is always read the same way — Croatian spelling is phonetic.","Svako slovo se uvijek čita isto — hrvatski je fonetski jezik."],["Stress is usually on the first syllable and never on the last.","Naglasak je najčešće na prvom slogu, nikad na zadnjem."],["The vocative is used to address someone: Marko → Marko!, Ana → Ana!","Vokativ se koristi za dozivanje: Marko → Marko!, Ana → Ana!"],["Formal „Vi\" is capitalised in letters as a mark of respect.","„Vi\" iz poštovanja piše se velikim slovom u pismima."]];

  var POID = {};
  BANKA.forEach(function (r) { POID[r.id] = r; });

  /* ---------- pomoćne ---------- */
  function mix(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function uzmi(a, n) { return mix(a).slice(0, n); }
  function rand(a) { return a[Math.floor(Math.random() * a.length)]; }
  function cijeli(n) { return Math.floor(Math.random() * n); }
  function norm(s) { return String(s == null ? '' : s).trim().toLowerCase().replace(/\s+/g, ' '); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }
  function el(id) { return document.getElementById(id); }
  function slug(s) {
    return String(s).toLowerCase()
      .replace(/č|ć/g, 'c').replace(/đ/g, 'd').replace(/š/g, 's').replace(/ž/g, 'z')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  }

  /* ---------- mediji (uvijek s ugrađenom zamjenom) ---------- */
  function slika(datoteka, zamjena, velicina, klasa) {
    var v = velicina || 96;
    return '<span class="slikaOkvir ' + (klasa || '') + '" style="width:' + v + 'px;height:' + v + 'px;font-size:' + Math.round(v * 0.55) + 'px">' +
      '<img src="' + MEDIJ + datoteka + '" alt="" loading="lazy" ' +
      'onerror="this.remove()">' +

      '</span>';
  }
  function slikaRijeci(r, velicina) {

  var ZVUK_OK = true;

  /* mali sintetički tonovi — rade i bez ijedne datoteke */
  var AC = null;
  function ton(f, t, tip) {
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = tip || 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, AC.currentTime);
      g.gain.exponentialRampToValueAtTime(0.14, AC.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + (t || 0.15));
      o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + (t || 0.15) + 0.02);
    } catch (e) { }
  }
  function pip(dobro) {
    if (dobro) { ton(660, .09); setTimeout(function () { ton(880, .13); }, 80); }
    else { ton(200, .2, 'square'); }

  /* ---------- poruke ---------- */
  var _p = null, _pt = null;
  function poruka(tekst, vrsta) {
    if (!_p) { _p = document.createElement('div'); _p.className = 'poruka'; document.body.appendChild(_p); }
    _p.textContent = tekst;
    _p.className = 'poruka vidi ' + (vrsta || '');
    clearTimeout(_pt);

  }

  /* ---------- konfeti ---------- */
  function konfeti(n) {
    var boje = ['#F4B942', '#E8623A', '#2FA8A0', '#7B5EA7', '#7CB342', '#3E7CB1'];
    for (var i = 0; i < (n || 40); i++) (function (i) {
      var d = document.createElement('div');
      d.className = 'konfet';
      d.style.background = boje[i % boje.length];
      d.style.left = (10 + Math.random() * 80) + 'vw';
      d.style.top = '-20px';
      document.body.appendChild(d);
      var pad = 900 + Math.random() * 900, poc = performance.now(), zaokret = Math.random() * 720, x = (Math.random() - .5) * 220;
      requestAnimationFrame(function korak(t) {
        var k = (t - poc) / pad;
        if (k >= 1) { d.remove(); return; }
        d.style.transform = 'translate(' + (x * k) + 'px,' + (k * (window.innerHeight + 60)) + 'px) rotate(' + (zaokret * k) + 'deg)';
        d.style.opacity = String(1 - k * k);
        requestAnimationFrame(korak);
      });
    })(i);
  }

  /* ---------- spremanje ---------- */
  function kljuc() { return 'croland-mini-' + (window.IGRA_ID || 'x'); }
  function stanje() {
    try { return JSON.parse(localStorage.getItem(kljuc()) || '{}'); } catch (e) { return {}; }
  }
  function spremi(o) {
    try { localStorage.setItem(kljuc(), JSON.stringify(o)); } catch (e) { }
  }
  function najbolje() { return stanje().najbolje || 0; }
  function zapisiRezultat(bodovi) {
    var s = stanje();
    if (bodovi > (s.najbolje || 0)) { s.najbolje = bodovi; s.kada = new Date().toISOString(); spremi(s); return true; }
    return false;
  }

  function zastor(html) {

  function zatvoriZastore() {

  /**

   */
  function kraj(opts) {
    var b = Math.max(0, Math.round(opts.bodovi || 0));
    var maks = opts.maks || window.IGRA_MAKS || 100;
    var presao = b >= maks;
    var rekord = zapisiRezultat(b);
    var prijeNaplaceno = stanje().naplaceno || 0;
    var isplata = Math.max(0, b - prijeNaplaceno);
    if (isplata > 0) { var s = stanje(); s.naplaceno = b; spremi(s); }
    if (presao) konfeti(90);
    var html =
      '<h3>' + esc(opts.naslov || (presao ? 'You beat the game!' : 'Game over')) + '</h3>' +

    if (opts.beskonacno) z.querySelector('#_bez').onclick = function () { z.remove(); opts.beskonacno(); };

  /* ---------- HUD ---------- */

  /* ---------- strogi upis (s dijakriticima) ---------- */
  function tipkeDijakritika(input) {

    }).join('');
    d.addEventListener('click', function (e) {
      var b = e.target.closest('.dijakritik'); if (!b) return;
      var poc = input.selectionStart == null ? input.value.length : input.selectionStart;
      var kraj_ = input.selectionEnd == null ? poc : input.selectionEnd;
      input.value = input.value.slice(0, poc) + b.dataset.z + input.value.slice(kraj_);
      input.focus();
      input.setSelectionRange(poc + 1, poc + 1);
    });
    return d;
  }


  /* ---------- skriveni prijevod (otkriva se klikom) ----------
     Prijevod koji bi inače riješio zadatak umjesto igrača stoji skriven;
     klik na oznaku otkriva engleski tekst. */
  var _enVezan = false;
  function vezanjeEN() {
    if (_enVezan || typeof document === 'undefined') return;
    _enVezan = true;
    document.addEventListener('click', function (e) {
      var b = e.target && e.target.closest ? e.target.closest('.otkrijEN') : null;
      if (!b || !b.getAttribute('data-en')) return;
      e.preventDefault(); e.stopPropagation();
      b.textContent = b.getAttribute('data-en');
      b.removeAttribute('data-en');
      b.className = 'otkrijEN otkriven';
    }, true);
  }
  function skritEN(tekst, natpis, kaoSpan) {
    if (tekst == null || tekst === '') return '';
    vezanjeEN();
    var oznaka = esc(natpis || '\ud83d\udc41 translation');
    /* unutar <button> ne smije stajati drugi <button> — tada ide span */
    if (kaoSpan) return '<span role="button" tabindex="0" class="otkrijEN" data-en="' + esc(tekst) + '">' + oznaka + '</span>';
    return '<button type="button" class="otkrijEN" data-en="' + esc(tekst) + '">' + oznaka + '</button>';
  }

  /*[CL-DODATAK]*/
  /* ---------- rečenice, praznine, dijalozi, savjeti ---------- */
  function recenice(raz, doRazine) {
    if (!raz) return RECENICE.slice();
    return RECENICE.filter(function (r) { return doRazine ? r[2] <= raz : r[2] === raz; });
  }
  function recenica(raz, doRazine) { return rand(recenice(raz, doRazine)); }
  function praznine(raz, doRazine) {
    if (!raz) return PRAZNINE.slice();
    return PRAZNINE.filter(function (p) { return doRazine ? p[5] <= raz : p[5] === raz; });
  }
  function praznina(raz, doRazine) { return rand(praznine(raz, doRazine)); }
  function dijalozi(raz) {
    if (!raz) return DIJALOZI.slice();
    return DIJALOZI.filter(function (d) { return d.razina <= raz; });
  }
  function savjet() { return rand(SAVJETI); }
  function suprotnica() { return rand(SUPROTNICE); }
  function suprotnice() { return SUPROTNICE.slice(); }

  /* razina prema napretku: 1-5 iz rednog broja koraka i ukupne dužine */
  function razinaZa(i, ukupno) {
    var r = Math.floor((i / Math.max(1, ukupno)) * 5) + 1;
    return Math.max(1, Math.min(5, r));
  }

  /* ---------- praćenje svladanih riječi (dijeli se među igrama) ---------- */
  function ucenje(id, dobro) {
    try {
      var k = "croland-mini-ucenje";
      var m = JSON.parse(localStorage.getItem(k) || "{}");
      var z = m[id] || { t: 0, k: 0 };
      if (dobro) z.t++; else z.k++;
      m[id] = z;
      localStorage.setItem(k, JSON.stringify(m));
    } catch (e) { }
  }
  function ucenjeSve() {
    try { return JSON.parse(localStorage.getItem("croland-mini-ucenje") || "{}"); }
    catch (e) { return {}; }
  }
  function zaPonoviti(n) {
    var m = ucenjeSve(), popis = [];
    Object.keys(m).forEach(function (id) {
      var z = m[id];
      if (z.k > 0 && z.k >= z.t && POID[id]) popis.push({ r: POID[id], k: z.k, t: z.t });
    });
    popis.sort(function (a, b) { return (b.k - b.t) - (a.k - a.t); });
    return popis.slice(0, n || 12);
  }
  /* riječi koje igrač još nije vidio — daje prednost novom sadržaju */
  function svjezeRijeci(n, filtar) {
    var m = ucenjeSve();
    var izvor = filtar ? BANKA.filter(filtar) : BANKA;
    var nove = izvor.filter(function (r) { return !m[r.id]; });
    var ostalo = izvor.filter(function (r) { return m[r.id]; });
    return mix(nove).concat(mix(ostalo)).slice(0, n);
  }

  /* ---------- savjet između razina ---------- */
  function savjetZastor(nastavi) {
    var s = savjet();
    var z = zastor(
      '<h3>💡 Tip</h3><p style="text-align:left">' + esc(s[0]) + '</p>' +

    z.querySelector('#_dalje').onclick = function () { z.remove(); if (nastavi) nastavi(); };
    return z;
  }
  /*[/CL-DODATAK]*/

  return {
    MEDIJ: MEDIJ, BANKA: BANKA, KAT: KAT, kat: kat, po: po,
    /*[CL-IZVOZ]*/
    RECENICE: RECENICE, PRAZNINE: PRAZNINE, DIJALOZI: DIJALOZI, SAVJETI: SAVJETI,
    SUPROTNICE: SUPROTNICE, suprotnica: suprotnica, suprotnice: suprotnice,
    recenice: recenice, recenica: recenica, praznine: praznine, praznina: praznina,
    dijalozi: dijalozi, savjet: savjet, savjetZastor: savjetZastor, razinaZa: razinaZa,
    ucenje: ucenje, ucenjeSve: ucenjeSve, zaPonoviti: zaPonoviti, svjezeRijeci: svjezeRijeci,
    /*[/CL-IZVOZ]*/
    mix: mix, uzmi: uzmi, rand: rand, cijeli: cijeli, norm: norm, esc: esc, el: el, slug: slug,
    slika: slika, slikaRijeci: slikaRijeci, zvuk: zvuk, zvukRijeci: zvukRijeci, ton: ton, pip: pip,
    poruka: poruka, konfeti: konfeti,
    stanje: stanje, spremi: spremi, najbolje: najbolje,
    zastor: zastor, zatvoriZastore: zatvoriZastore, kraj: kraj,
    hud: hud, srca: srca, tipkeDijakritika: tipkeDijakritika,
    skritEN: skritEN
  };
})();

<script>

   ===================================================================== */

var WW = 1740, TLO = 400, GRAV = 0.62, SKOK = -13.2, SKOK2 = -12, BRZINA = 4.4;

/* ---------- ulaz: tipkovnica ---------- */
var tipke = {l:false, r:false}, skokBuf = 0;

document.addEventListener('keydown', function(e){

/* ---------- ulaz: dodir ----------
   Tipke su nacrtane u pijesku, ali ne treba ih pogoditi: cijela lijeva

var prsti = {};
function tipkeRaspored(){
  var vrh = TLO - VIEW.y0 + 18, pojas = VIEW.h - vrh;
  var R = Math.max(22, Math.min(50, pojas / 2 - 8));
  var sy = vrh + pojas / 2;
  var lx = 20 + R, rx = lx + 2 * R + 18;
  return {R:R, y:sy, lx:lx, rx:rx, jx:VIEW.w - 24 - R * 1.35, sredina:(lx + rx) / 2};

function tockaUScenu(e){
  var b = PL.getBoundingClientRect();
  return {x:(e.clientX - b.left) / b.width * VIEW.w, y:(e.clientY - b.top) / b.height * VIEW.h};
}

PL.addEventListener('pointerdown', function(e){

PL.addEventListener('pointermove', function(e){

});

var SRODNE = [

];

/* suprotnice: krivi odgovori iste vrste riječi i izvan istog značenjskog polja */
var PRILOZI_S = ['rano','kasno','brzo','polako','ovdje','tamo','gore','dolje','lijevo','desno','blizu','daleko','uvijek','nikad','puno','malo','danas','sutra'];
var IMENICE_S = ['jutro','večer','dan','noć','ljeto','zima','pobjeda','poraz','sreća','tuga','ljubav','mržnja','pitanje','odgovor','polazak','dolazak'];

  ['rano','danas','jutro','dan'], ['skup','bogat']];

    var rod = CL.rand(['m','ž','s']);
    var imenice = CL.BANKA.filter(function(r){ return ['m','ž','s'].indexOf(r.rod) >= 0 && r.hr.indexOf(' ') < 0; });
    var fond = imenice.filter(function(r){ return r.rod === rod && neVidjeno(r); });
    q.tocna = CL.rand(fond.length ? fond : imenice.filter(function(r){ return r.rod === rod; }));
    q.opcije = [q.tocna].concat(['m','ž','s'].filter(function(x){ return x !== rod; }).map(function(x){
      return CL.rand(imenice.filter(function(r){ return r.rod === x; }));
    }));
    q.pitanje = 'Which word is ' + ({m:'masculine','ž':'feminine',s:'neuter'})[rod] + '?';
    q.pod = ({m:'muški rod','ž':'ženski rod',s:'srednji rod'})[rod];

  } else if (vrsta === 'kategorija'){
    var kat = CL.rand(Object.keys(CL.KAT).filter(function(k){ return CL.kat(k).length >= 6; }));
    var fk = CL.kat(kat).filter(neVidjeno);
    q.tocna = CL.rand(fk.length ? fk : CL.kat(kat));
    q.opcije = [q.tocna].concat(CL.uzmi(izvanSrodnih(kat), 2));
    q.pitanje = 'Which word belongs to: ' + CL.KAT[kat].en + '?';
    q.pod = CL.KAT[kat].hr;

  } else if (vrsta === 'neuklapa'){
    var k2 = CL.rand(Object.keys(CL.KAT).filter(function(k){ return CL.kat(k).length >= 8; }));
    q.tocna = CL.rand(izvanSrodnih(k2));
    q.opcije = [q.tocna].concat(CL.uzmi(CL.kat(k2), 2));
    q.pitanje = 'Which word does NOT belong with the other two?';
    q.pod = 'two of the clouds share a topic';

  } else if (vrsta === 'suprotno'){
    var svi = CL.suprotnice();
    var par = CL.rand(svi);
    var obrni = Math.random() < 0.5;
    var zadana = obrni ? par[1] : par[0], trazena = obrni ? par[0] : par[1];
    var vr = vrstaPara(par), polje = poljePara(par);
    var krivi = CL.uzmi(svi.filter(function(p){
      return p[0] !== par[0] && vrstaPara(p) === vr && poljePara(p) !== polje;
    }), 2);
    q.tocna = {id:'sup-' + trazena, hr:trazena};
    q.opcije = [q.tocna].concat(krivi.map(function(p){
      var w = Math.random() < 0.5 ? p[0] : p[1]; return {id:'sup-' + w, hr:w};
    }));
    q.pitanje = 'The opposite of: ' + zadana;
    q.pod = par[2]; q.podSkriven = true;

  } else if (vrsta === 'praznina'){
    var si = svijetIdx();
    var raz = si < 2 ? 2 : Math.min(5, 3 + Math.floor((S.bez ? S.bezRazina : lokalnaRazina()) / 4));
    var fp = CL.praznine(raz, true).filter(function(p){ return p[5] >= raz - 1 && !S.vidjeno['pr:' + p[0]]; });
    if (!fp.length) fp = CL.praznine(raz, true);
    var p = CL.rand(fp);
    q.tocna = {id:'pr:' + p[0], hr:p[2]};
    q.opcije = [q.tocna, {id:'pr-1', hr:p[3]}, {id:'pr-2', hr:p[4]}];
    q.pitanje = p[0].replace('___', '_____');
    q.pod = p[1]; q.podSkriven = true;

  } else {
    var filtar = vrsta === 'slika2hr'
      ? function(x){ return ['glagol','pridjev','prilog','broj','osjecaj','vrijeme','boja'].indexOf(x.kat) < 0 && EMO_BROJ[x.emo] === 1; }
      : function(){ return true; };
    var fond2 = CL.svjezeRijeci(80, function(x){ return filtar(x) && neVidjeno(x); });
    q.tocna = CL.rand(fond2.length ? fond2 : CL.BANKA.filter(filtar));
    var t = q.tocna;
    var slicni = function(r){ return r.id !== t.id && r.en !== t.en && r.hr !== t.hr && r.emo !== t.emo; };
    var kr = CL.uzmi(CL.BANKA.filter(function(r){ return r.kat === t.kat && slicni(r); }), 2);
    if (kr.length < 2) kr = CL.uzmi(CL.BANKA.filter(slicni), 2);
    q.opcije = [t].concat(kr);
    if (vrsta === 'en2hr'){ q.pitanje = t.en; q.pod = 'Jump into the cloud with the Croatian word.'; }
    else if (vrsta === 'hr2en'){ q.pitanje = t.hr; q.pod = 'Jump into the cloud with the English translation.'; q.natpis = function(r){ return r.en; }; }
    else { q.pitanje = 'What is this?'; q.pod = 'Jump into the cloud with the Croatian word.'; q.slika = t; }
  }
  return q;
}

function novoPitanje(){
  var sv = SVJETOVI[svijetIdx()];
  var izbor = sv.vrste.filter(function(v){ return v !== S.zadnjaVrsta; });
  var vrsta = CL.rand(izbor);
  var q = pitanjeZa(vrsta);
  /* tri oblaka moraju nositi tri različita natpisa */
  var natpisi = q.opcije.map(q.natpis);
  if (natpisi.length < 3 || natpisi[0] === natpisi[1] || natpisi[0] === natpisi[2] || natpisi[1] === natpisi[2]){
    q = pitanjeZa('en2hr'); vrsta = 'en2hr';
  }
  S.zadnjaVrsta = vrsta;
  S.vidjeno[q.tocna.id] = true;
  S.q = q; S.rijeseno = false; S.prvaGreska = false;
  var opc = CL.mix(q.opcije);
  S.oblaci = opc.map(function(r, i){
    var x = S.strana === 0 ? OBLAK_X[i] : WW - OBLAK_X[2 - i];
    return {r:r, tekst:q.natpis(r), tocan:r.id === q.tocna.id, x:x, faza:Math.random() * 6,
            stanje:'ziv', t:0, pojava:0, linije:null};
  });
  var lijevo = S.strana === 0;
  var el = CL.el('temaP');
  el.className = 'temaP';
  void el.offsetWidth;
  el.className = 'temaP nova';
  el.innerHTML =
    '<span class="stranaP' + (lijevo ? '' : ' desno') + '">' + (lijevo ? '◀ west shore' : 'east shore ▶') + '</span>' +
    '<div class="tekstP">' + (q.slika ? CL.slikaRijeci(q.slika, 48) : '') +
    '<span><b>' + CL.esc(q.pitanje) + '</b>' +
    '<small>' + (q.podSkriven ? CL.skritEN(q.pod) : CL.esc(q.pod)) + '</small></span></div>';
}

function osvjezi(){
  var sv = SVJETOVI[svijetIdx()];
  CL.el('zSvijet').innerHTML = S.bez ? '♾ <b>endless</b>' : sv.emo + ' <b>' + sv.ime + '</b>';
  CL.el('zRaz').innerHTML = S.bez ? '🌀 <b>' + S.bezRazina + '</b>' : '🌀 <b>' + S.razina + '</b>/' + UKUPNO;
  CL.el('zSrca').innerHTML = CL.srca(S.srca);
  CL.el('zBod').innerHTML = '⭐ <b>' + S.bodovi + '</b>';
}

/* ---------- rakovi ---------- */
function brojRakova(){
  return S.bez ? Math.min(4, 2 + Math.floor(S.bezRazina / 4)) : SVJETOVI[svijetIdx()].rakovi;
}
function noviRak(strana, x){
  var sp = S.bez ? 1.7 : [1.0, 1.3, 1.6][svijetIdx()];
  return {s:strana, x:x, y:TLO - 26, w:40, h:26, vx:(Math.random() < .5 ? -1 : 1) * sp, sp:sp, vy:0,
          ziv:true, mrtav:0, odluka:60 + Math.random() * 120, penje:false};
}
function postaviRakove(){
  S.rakovi = [];
  var n = brojRakova();
  for (var s = 0; s < 2; s++) for (var i = 0; i < n; i++){
    var x = 260 + i * 130 + Math.random() * 40;
    S.rakovi.push(noviRak(s, s === 0 ? x : WW - x - 40));
  }
}

/* ---------- teren ---------- */
function visinaNa(x0, x1){
  var h = 0;
  TVRDO.forEach(function(b){ if (x0 < b.x + b.w && x1 > b.x && b.h > h) h = b.h; });
  return h;
}
function pomakniX(o, dx){
  o.x += dx;
  if (o.x < 0) o.x = 0;
  if (o.x + o.w > WW) o.x = WW - o.w;
  TVRDO.forEach(function(b){
    var vrh = TLO - b.h;
    if (o.x < b.x + b.w && o.x + o.w > b.x && o.y + o.h > vrh + 0.5){
      if (dx > 0) o.x = b.x - o.w; else if (dx < 0) o.x = b.x + b.w;
    }
  });
}
function pomakniY(o, dy){
  var dnoPrije = o.y + o.h;
  o.y += dy; o.natlu = false;
  if (o.y + o.h >= TLO){ o.y = TLO - o.h; o.vy = 0; o.natlu = true; }
  TVRDO.forEach(function(b){
    var vrh = TLO - b.h;
    if (o.x < b.x + b.w && o.x + o.w > b.x && dy >= 0 && dnoPrije <= vrh + 0.5 && o.y + o.h >= vrh){
      o.y = vrh - o.h; o.vy = 0; o.natlu = true;
    }
  });
}
function preklop(a, b){ return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function portalPravokutnik(s){
  var P = PORTALI[s];
  return {x:P.x + 10, y:TLO - LEDGE - P.h + 20, w:P.w - 20, h:P.h - 20};
}
function oblakPozicija(o){
  return {x:o.x + Math.sin(T * 0.013 + o.faza) * 10, y:OBLAK_Y + Math.sin(T * 0.03 + o.faza) * 5};
}

/* ---------- čestice ---------- */
function prasak(x, y, boja, n, jacina){
  for (var i = 0; i < n; i++){
    var a = Math.random() * Math.PI * 2, v = (0.6 + Math.random()) * (jacina || 3);
    S.cestice.push({x:x, y:y, vx:Math.cos(a) * v, vy:Math.sin(a) * v - 1, t:0,
                    max:30 + Math.random() * 25, boja:boja, vel:3 + Math.random() * 4});
  }
}

/* ---------- glavna petlja ---------- */
function azuriraj(k){
  var i = S.igrac;
  if (S.nepov > 0) S.nepov -= k;

  if (S.faza){
    S.faza.t += k;
    if (S.faza.tip === 'ulaz' && S.faza.t >= 26) prijelaz();
    else if (S.faza.tip === 'izlaz' && S.faza.t >= 22){
      S.faza = null;
      if (S.cekaSvijet){ S.cekaSvijet = false; najaviSvijet(); }
    }
    return;
  }

  var c = smjer();
  if (c) i.smjer = c;
  i.vx = c * BRZINA + i.kx;
  i.kx *= Math.pow(0.86, k); if (Math.abs(i.kx) < 0.1) i.kx = 0;
  pomakniX(i, i.vx * k);
  if (skokBuf > 0){
    skokBuf -= k;
    if (i.natlu || i.koyot > 0){ i.vy = SKOK; i.natlu = false; i.koyot = 0; skokBuf = 0; i.dupli = true; CL.ton(520, .07); }
    else if (i.dupli){ i.vy = SKOK2; i.dupli = false; i.salto = 1; skokBuf = 0; CL.ton(700, .08); }
  }
  i.vy = Math.min(15, i.vy + GRAV * k);
  pomakniY(i, i.vy * k);
  if (i.natlu){ i.koyot = 6; i.dupli = false; i.salto = 0; } else i.koyot -= k;
  if (i.salto > 0) i.salto = Math.max(0, i.salto - k / 30);
  if (c && i.natlu) i.hod += k * 0.28; else if (i.natlu) i.hod = 0;

  /* oblaci */
  S.oblaci.forEach(function(o){
    if (o.pojava < 1) o.pojava = Math.min(1, o.pojava + 0.05 * k);
    if (o.stanje === 'krivo'){ o.t -= k; if (o.t <= 0) o.stanje = 'ziv'; }
    else if (o.stanje === 'tocno' || o.stanje === 'odlazi') o.t += k;
  });
  if (!S.rijeseno){
    for (var n = 0; n < S.oblaci.length; n++){
      var o = S.oblaci[n];
      if (o.stanje !== 'ziv') continue;
      var p = oblakPozicija(o);
      if (preklop(i, {x:p.x - 70, y:p.y - 18, w:140, h:40})){ pogodakOblaka(o, p); break; }
    }
  }

  /* rakovi */
  S.rakovi.forEach(function(r){ korakRaka(r, k, i); });

  /* portal */
  if (S.rijeseno && preklop(i, portalPravokutnik(S.strana)) && S.srca > 0){
    S.faza = {tip:'ulaz', t:0};
    CL.ton(440, .1); setTimeout(function(){ CL.ton(660, .12); }, 90); setTimeout(function(){ CL.ton(990, .16); }, 180);
    var P = PORTALI[S.strana];
    prasak(P.x + P.w / 2, TLO - LEDGE - P.h / 2, BOJA_PORTALA[S.strana], 26, 4);
  }

  S.cestice = S.cestice.filter(function(q){
    q.t += k; q.x += q.vx * k; q.y += q.vy * k; q.vy += 0.12 * k;
    return q.t < q.max;
  });
}

function korakRaka(r, k, i){
  if (!r.ziv){
    r.mrtav += k;
    if (r.mrtav > 300){
      var rubX = r.s === 0 ? 20 : WW - 60;
      if (S.strana !== r.s || Math.abs(i.x - rubX) > 180){
        var nov = noviRak(r.s, rubX); for (var key in nov) r[key] = nov[key];
        r.vx = r.s === 0 ? r.sp : -r.sp;
      }
    }
    return;
  }
  r.odluka -= k;
  if (r.odluka <= 0){
    r.odluka = 90 + Math.random() * 150;
    if (S.strana === r.s && Math.random() < 0.6) r.vx = (i.x > r.x ? 1 : -1) * r.sp;
    else if (Math.random() < 0.4) r.vx = -r.vx;
  }
  var granica = r.s === 0 ? [0, 840] : [900, WW];
  var nx = r.x + r.vx * k;
  if (nx < granica[0] || nx + r.w > granica[1]){ r.vx = -r.vx; r.penje = false; }
  else {
    var hN = visinaNa(nx, nx + r.w), povrsN = TLO - hN, dno = r.y + r.h;
    if (povrsN < dno - 1){
      if (hN >= 300){ r.vx = -r.vx; r.penje = false; }
      else {
        r.penje = true; r.y -= 2.2 * k;
        if (r.y + r.h <= povrsN){ r.y = povrsN - r.h; r.x = nx; r.penje = false; }
      }
    } else { r.x = nx; r.penje = false; }
  }
  if (!r.penje){
    var povrs = TLO - visinaNa(r.x, r.x + r.w);
    if (r.y + r.h < povrs - 0.5){ r.vy += GRAV * k; r.y += r.vy * k; if (r.y + r.h >= povrs){ r.y = povrs - r.h; r.vy = 0; } }
    else { r.y = povrs - r.h; r.vy = 0; }
  }

  if (S.srca <= 0) return;
  var tijelo = {x:r.x + 4, y:r.y + 4, w:r.w - 8, h:r.h - 4};
  if (!preklop(i, tijelo)) return;
  if (i.vy > 0 && i.y + i.h - i.vy * k <= r.y + 10){
    r.ziv = false; r.mrtav = 0; i.vy = -9; S.gaziranih++;
    CL.ton(880, .08); setTimeout(function(){ CL.ton(1175, .1); }, 70);
    prasak(r.x + r.w / 2, r.y + 8, '#E8623A', 12, 3);
    CL.poruka('Crab flipped! 🦀', 'dobro');
  } else if (S.nepov <= 0){
    S.nepov = 80; S.srca--; CL.pip(false); osvjezi();
    i.kx = (i.x + i.w / 2 < r.x + r.w / 2 ? -1 : 1) * 9; i.vy = -6;
    CL.poruka('Pinched by a crab!', 'lose');
    tresiScenu();
    if (S.srca <= 0){ S.radi = false; setTimeout(poraz, 600); }
  }
}

function pogodakOblaka(o, p){
  var i = S.igrac;
  if (o.tocan){
    S.rijeseno = true; o.stanje = 'tocno'; o.t = 0;
    S.oblaci.forEach(function(x){ if (x !== o){ x.stanje = 'odlazi'; x.t = 0; } });
    CL.pip(true);
    if (S.q.tocna.emo){ CL.zvukRijeci(S.q.tocna); CL.ucenje(S.q.tocna.id, true); }
    S.bodovi = Math.min(50, S.bodovi + 2);
    osvjezi();
    prasak(p.x, p.y, '#FFFFFF', 22, 4); prasak(p.x, p.y, '#F4B942', 14, 3);
    if (i.vy < 0) i.vy = 1;
    CL.poruka('Correct! The portal is open — climb the steps ' + (S.strana === 0 ? '➡' : '⬅'), 'dobro');
  } else {
    o.stanje = 'krivo'; o.t = 70;
    S.srca--; CL.pip(false); osvjezi();
    if (S.q.tocna.emo && !S.prvaGreska) CL.ucenje(S.q.tocna.id, false);
    S.prvaGreska = true;
    if (i.vy < 0) i.vy = 2;
    prasak(p.x, p.y + 20, '#9AA8B8', 10, 2);
    CL.poruka('“' + o.tekst + '” is not it.', 'lose');
    tresiScenu();
    if (S.srca <= 0){ S.radi = false; setTimeout(poraz, 600); }
  }
}

var trese = 0;
function tresiScenu(){ trese = 12; }

function prijelaz(){
  var i = S.igrac, prije = svijetIdx();
  if (S.bez) S.bezRazina++;
  else {
    S.razina++;
    if (S.razina >= UKUPNO){ S.faza = null; osvjezi(); return pobjeda(); }
  }
  S.strana = 1 - S.strana;
  var P = PORTALI[S.strana];
  i.x = P.x + P.w / 2 - i.w / 2; i.y = TLO - LEDGE - i.h;
  i.vx = i.vy = i.kx = 0; i.smjer = S.strana === 0 ? -1 : 1;
  S.nepov = 50;
  S.faza = {tip:'izlaz', t:0};
  var novi = svijetIdx();
  if (!S.bez && novi !== prije){
    if (S.srca < 3) S.srca++;
    postaviRakove();
    S.cekaSvijet = true;
  } else if (S.bez){
    var n = brojRakova(), ovdje = S.rakovi.filter(function(r){ return r.s === S.strana; }).length;
    if (ovdje < n) S.rakovi.push(noviRak(S.strana, S.strana === 0 ? 20 : WW - 60));
  }
  novoPitanje();
  prasak(P.x + P.w / 2, TLO - LEDGE - P.h / 2, BOJA_PORTALA[S.strana], 22, 4);
  osvjezi();
}

function najaviSvijet(){
  S.pauza = true; tipke.l = tipke.r = false; prsti = {};
  var sv = SVJETOVI[svijetIdx()];
  var z = CL.zastor('<h3>' + sv.emo + ' ' + CL.esc(sv.ime) + '</h3>' +
    '<p>A new world, new kinds of tasks and <b>' + sv.rakovi + '</b> crabs on each shore.' +
    '<br><b style="color:#7CB342">A heart comes back ❤️</b></p>' +
    '<div class="tipke" style="margin-top:14px"><button class="g glavni" id="_d">Next</button></div>');
  z.querySelector('#_d').onclick = function(){
    z.remove();
    CL.savjetZastor(function(){ S.pauza = false; });
  };
}

var zadnje = 0;
function petlja(t){
  var k = zadnje ? Math.min(2.5, (t - zadnje) / 16.667) : 1;
  zadnje = t;
  T += k;
  if (S && S.radi && !S.pauza) azuriraj(k);
  if (S){ kamera(k); crtaj(); }
  requestAnimationFrame(petlja);
}

function kamera(k){
  var i = S.igrac, cilj;
  if (NACIN === 'rac' || NACIN === 'tab'){
    cilj = S.strana === 0 ? 0 : WW - VIEW.w;
  } else {
    var pod = S.strana === 0 ? [0, 960] : [WW - 960, WW];
    cilj = i.x + i.w / 2 - VIEW.w / 2 + i.smjer * 40;
    cilj = Math.max(pod[0], Math.min(pod[1] - VIEW.w, cilj));
  }
  cilj = Math.max(0, Math.min(WW - VIEW.w, cilj));
  var brzina = S.faza && S.faza.tip === 'izlaz' ? 0.2 : 0.1;
  KAM += (cilj - KAM) * Math.min(1, brzina * k);
  if (Math.abs(cilj - KAM) < 0.3) KAM = cilj;
}

/* ---------- crtanje ---------- */
var INK = '#2B2118';

function crtaj(){
  var sv = SVJETOVI[svijetIdx()];
  var W = VIEW.w, H = VIEW.h, y0 = VIEW.y0;
  G.setTransform(SKALA, 0, 0, SKALA, 0, 0);
  if (trese > 0){ G.translate((Math.random() - .5) * trese, (Math.random() - .5) * trese * .5); trese = Math.max(0, trese - 1); }

  /* nebo */
  var gr = G.createLinearGradient(0, 0, 0, TLO - y0);
  gr.addColorStop(0, sv.nebo[0]); gr.addColorStop(1, sv.nebo[1]);
  G.fillStyle = gr; G.fillRect(-20, -20, W + 40, H + 40);

  if (sv.noc){
    G.fillStyle = 'rgba(255,255,255,.8)';
    for (var z = 0; z < 40; z++){
      var zx = ((z * 137.5) % (W + 200)) - (KAM * 0.05) % 50, zy = (z * 53) % (TLO - y0 - 160);
      var tr = 0.5 + 0.5 * Math.sin(T * 0.05 + z);
      G.globalAlpha = 0.3 + tr * 0.6; G.fillRect(zx, zy, 2, 2);
    }
    G.globalAlpha = 1;
  }
  /* sunce ili mjesec */
  var sx = W * 0.78 - KAM * 0.04, sy = 70 - y0 * 0.5 + (sv.noc ? 10 : 0);
  G.fillStyle = sv.sunce; G.globalAlpha = .25;
  G.beginPath(); G.arc(sx, sy, 58, 0, Math.PI * 2); G.fill();
  G.globalAlpha = 1;
  G.beginPath(); G.arc(sx, sy, 36, 0, Math.PI * 2); G.fill();
  G.strokeStyle = INK; G.lineWidth = 3; G.stroke();

  /* ukrasni oblačići u daljini */
  G.fillStyle = 'rgba(255,255,255,' + (sv.noc ? .25 : .7) + ')';
  [[80, 60, 1], [460, 110, .8], [820, 40, 1.1], [1200, 90, .9]].forEach(function(c){
    var cx = ((c[0] - KAM * 0.1 + T * 0.08) % (W + 300) + W + 300) % (W + 300) - 150, cy = c[1] - y0 * 0.5;
    G.beginPath();
    G.arc(cx, cy, 18 * c[2], 0, 7); G.arc(cx + 22 * c[2], cy - 8 * c[2], 22 * c[2], 0, 7); G.arc(cx + 46 * c[2], cy, 16 * c[2], 0, 7);
    G.fill();
  });

  /* otoci i more (paralaksa) */
  var mY = TLO - y0 - 120;
  G.fillStyle = sv.otok;
  [[200, 90, 30], [640, 140, 44], [1100, 110, 34], [1500, 80, 26]].forEach(function(o){
    var ox = o[0] - KAM * 0.25;
    G.beginPath(); G.ellipse(ox, mY + 2, o[1], o[2], 0, Math.PI, 0); G.fill();
  });
  G.fillStyle = sv.more; G.fillRect(-20, mY, W + 40, 130);
  G.strokeStyle = sv.more2; G.lineWidth = 3;
  for (var red = 0; red < 3; red++){
    var vy = mY + 22 + red * 32, pom = (T * (0.4 + red * 0.2) + KAM * 0.5 * (red + 1) / 3) % 60;
    G.beginPath();
    for (var wx = -60 - pom; wx < W + 60; wx += 60){
      G.moveTo(wx + 10, vy); G.quadraticCurveTo(wx + 25, vy - 6, wx + 40, vy);
    }
    G.stroke();
  }
  G.strokeStyle = INK; G.lineWidth = 3;
  G.beginPath(); G.moveTo(-20, mY); G.lineTo(W + 20, mY); G.stroke();

  /* ---- svijet ---- */
  G.save();
  G.translate(-KAM, -y0);

  palma(40, sv); palma(WW - 40, sv); palma(560, sv, .75); palma(WW - 560, sv, .75);

  /* pijesak */
  G.fillStyle = sv.pijesak; G.fillRect(KAM - 20, TLO, W + 40, H + 40);
  G.fillStyle = sv.pijesak2;
  for (var px = Math.floor((KAM - 20) / 38) * 38; px < KAM + W + 40; px += 38){
    var h1 = (px * 7919) % 97;
    G.fillRect(px + h1 % 30, TLO + 22 + h1 % 40, 4, 3);
    G.fillRect(px + (h1 * 3) % 34, TLO + 60 + (h1 * 5) % 90, 3, 3);
  }
  G.fillStyle = 'rgba(255,255,255,.45)'; G.fillRect(KAM - 20, TLO + 3, W + 40, 4);
  G.strokeStyle = INK; G.lineWidth = 3;
  G.beginPath(); G.moveTo(KAM - 20, TLO + 1.5); G.lineTo(KAM + W + 20, TLO + 1.5); G.stroke();
  zvjezdaca(300, TLO + 40); skoljka(1420, TLO + 34); zvjezdaca(1640, TLO + 70); skoljka(120, TLO + 80);

  svjetionik(sv);
  TVRDO.forEach(function(b){ if (b.h < 300) stepenica(b); });
  portal(0); portal(1);

  S.oblaci.forEach(crtajOblak);
  S.rakovi.forEach(crtajRaka);
  crtajLika();

  S.cestice.forEach(function(q){
    G.globalAlpha = Math.max(0, 1 - q.t / q.max);
    G.fillStyle = q.boja;
    G.beginPath(); G.arc(q.x, q.y, q.vel * (1 - q.t / q.max * .5), 0, 7); G.fill();
  });
  G.globalAlpha = 1;
  G.restore();

  /* strelica prema portalu kad je izvan kadra (mobitel) */
  if (S.rijeseno && !S.faza){
    var P = PORTALI[S.strana], pxs = P.x + P.w / 2 - KAM;
    if (pxs > W - 10 || pxs < 10){
      var desno = pxs > W, ax = desno ? W - 30 : 30, ay = TLO - LEDGE - 50 - y0 + Math.sin(T * .15) * 4;
      G.fillStyle = BOJA_PORTALA[S.strana]; G.strokeStyle = INK; G.lineWidth = 3;
      G.beginPath();
      if (desno){ G.moveTo(ax + 16, ay); G.lineTo(ax - 10, ay - 16); G.lineTo(ax - 10, ay + 16); }
      else { G.moveTo(ax - 16, ay); G.lineTo(ax + 10, ay - 16); G.lineTo(ax + 10, ay + 16); }
      G.closePath(); G.fill(); G.stroke();
    }
  }

  if (DODIR) crtajTipke();
}

function palma(x, sv, s){
  s = s || 1;
  var dno = TLO, vis = 150 * s;
  G.save();
  G.strokeStyle = INK; G.lineWidth = 3;
  G.fillStyle = sv.noc ? '#6B5236' : '#9C6B3E';
  G.beginPath();
  G.moveTo(x - 7 * s, dno); G.quadraticCurveTo(x - 4 * s, dno - vis * .6, x + 10 * s, dno - vis);
  G.lineTo(x + 18 * s, dno - vis + 4); G.quadraticCurveTo(x + 6 * s, dno - vis * .6, x + 7 * s, dno);
  G.closePath(); G.fill(); G.stroke();
  var kx = x + 14 * s, ky = dno - vis;
  G.fillStyle = sv.noc ? '#3E6B4E' : '#5BAA5A';
  var kut = Math.sin(T * 0.03 + x) * 0.06;
  [-2.6, -2.0, -1.2, -0.5, 0.2].forEach(function(a){
    a += kut;
    G.beginPath(); G.moveTo(kx, ky);
    G.quadraticCurveTo(kx + Math.cos(a - .3) * 50 * s, ky + Math.sin(a - .3) * 50 * s - 10 * s,
                       kx + Math.cos(a) * 70 * s, ky + Math.sin(a) * 70 * s + 22 * s);
    G.quadraticCurveTo(kx + Math.cos(a + .3) * 40 * s, ky + Math.sin(a + .3) * 40 * s,
                       kx, ky);
    G.fill(); G.stroke();
  });
  G.restore();
}
function zvjezdaca(x, y){
  G.save(); G.translate(x, y); G.rotate(.3);
  G.fillStyle = '#F29E7A'; G.strokeStyle = INK; G.lineWidth = 2;
  G.beginPath();
  for (var j = 0; j < 10; j++){
    var r = j % 2 ? 5 : 12, a = j * Math.PI / 5 - Math.PI / 2;
    G.lineTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  G.closePath(); G.fill(); G.stroke(); G.restore();
}
function skoljka(x, y){
  G.save(); G.translate(x, y);
  G.fillStyle = '#FFF1DE'; G.strokeStyle = INK; G.lineWidth = 2;
  G.beginPath(); G.arc(0, 0, 11, Math.PI, 0); G.lineTo(3, 6); G.lineTo(-3, 6); G.closePath(); G.fill(); G.stroke();
  G.beginPath(); G.moveTo(0, 5); G.lineTo(0, -10); G.moveTo(0, 5); G.lineTo(-7, -7); G.moveTo(0, 5); G.lineTo(7, -7); G.stroke();
  G.restore();
}

function stepenica(b){
  var vrh = TLO - b.h;
  G.fillStyle = '#CDB48A'; G.fillRect(b.x, vrh, b.w, b.h);
  G.strokeStyle = 'rgba(43,33,24,.28)'; G.lineWidth = 2;
  for (var ry = vrh + 24, n = 0; ry < TLO; ry += 24, n++){
    G.beginPath(); G.moveTo(b.x, ry); G.lineTo(b.x + b.w, ry); G.stroke();
    for (var rx = b.x + (n % 2 ? 22 : 44); rx < b.x + b.w; rx += 44){
      G.beginPath(); G.moveTo(rx, ry - 24); G.lineTo(rx, ry); G.stroke();
    }
  }
  G.fillStyle = '#7CB342'; G.fillRect(b.x - 3, vrh - 4, b.w + 6, 10);
  G.strokeStyle = INK; G.lineWidth = 3;
  G.strokeRect(b.x + 1.5, vrh + 1.5, b.w - 3, b.h);
  G.strokeRect(b.x - 3, vrh - 4, b.w + 6, 10);
}

function svjetionik(sv){
  var b = TVRDO[2], vrh = TLO - b.h;
  for (var j = 0; j * 40 < b.h; j++){
    G.fillStyle = j % 2 ? '#E8623A' : '#FFF8F0';
    G.fillRect(b.x, vrh + j * 40, b.w, 40);
  }
  G.strokeStyle = INK; G.lineWidth = 3; G.strokeRect(b.x + 1.5, vrh + 1.5, b.w - 3, b.h);
  /* galerija, svjetiljka, krov */
  G.fillStyle = '#5A4A38'; G.fillRect(b.x - 10, vrh - 8, b.w + 20, 10); G.strokeRect(b.x - 10, vrh - 8, b.w + 20, 10);
  var sja = sv.noc ? 1 : 0.55 + Math.sin(T * 0.05) * 0.2;
  G.fillStyle = 'rgba(255,225,120,' + sja + ')'; G.fillRect(b.x + 8, vrh - 44, b.w - 16, 36);
  G.strokeRect(b.x + 8, vrh - 44, b.w - 16, 36);
  G.fillStyle = '#E8623A';
  G.beginPath(); G.moveTo(b.x - 2, vrh - 44); G.lineTo(b.x + b.w / 2, vrh - 78); G.lineTo(b.x + b.w + 2, vrh - 44); G.closePath();
  G.fill(); G.stroke();
  if (sv.noc){
    var a = T * 0.02, cx = b.x + b.w / 2, cy = vrh - 26;
    G.fillStyle = 'rgba(255,235,150,.18)';
    [a, a + Math.PI].forEach(function(u){
      G.beginPath(); G.moveTo(cx, cy);
      G.lineTo(cx + Math.cos(u - .12) * 700, cy + Math.sin(u - .12) * 120);
      G.lineTo(cx + Math.cos(u + .12) * 700, cy + Math.sin(u + .12) * 120);
      G.closePath(); G.fill();
    });
  }
}

function portal(s){
  var P = PORTALI[s], cx = P.x + P.w / 2, cy = TLO - LEDGE - P.h / 2;
  var otvoren = S.rijeseno && S.strana === s;
  var boja = BOJA_PORTALA[s];
  G.save();
  /* kameni okvir */
  G.fillStyle = '#8B7B6B'; G.strokeStyle = INK; G.lineWidth = 3;
  G.beginPath(); G.ellipse(cx, cy + 2, 34, 52, 0, 0, Math.PI * 2); G.fill(); G.stroke();
  /* unutrašnjost */
  G.beginPath(); G.ellipse(cx, cy + 4, 25, 43, 0, 0, Math.PI * 2);
  if (otvoren){
    var rg = G.createRadialGradient(cx, cy, 2, cx, cy, 44);
    rg.addColorStop(0, '#FFFFFF'); rg.addColorStop(.35, boja); rg.addColorStop(1, '#1E1830');
    G.fillStyle = rg;
  } else G.fillStyle = '#3A3346';
  G.fill(); G.stroke();
  G.save(); G.clip();
  G.lineWidth = 2.5;
  for (var j = 0; j < 5; j++){
    var r = (j + 1) / 5, smj = j % 2 ? 1 : -1, poc = T * (otvoren ? 0.12 : 0.02) * smj + j * 1.3;
    G.strokeStyle = otvoren ? 'rgba(255,255,255,.75)' : 'rgba(160,150,180,.35)';
    G.beginPath(); G.ellipse(cx, cy + 4, 25 * r, 43 * r, 0, poc, poc + Math.PI * 1.1); G.stroke();
  }
  G.restore();
  if (otvoren){
    if (Math.random() < 0.3) S.cestice.push({x:cx + (Math.random() - .5) * 40, y:cy + 40, vx:(Math.random() - .5) * .6,
      vy:-1.5 - Math.random(), t:0, max:40, boja:boja, vel:2.5});
    var ay = cy - 76 + Math.sin(T * 0.15) * 5;
    G.fillStyle = '#F4B942'; G.lineWidth = 3;
    G.beginPath(); G.moveTo(cx - 12, ay - 10); G.lineTo(cx + 12, ay - 10); G.lineTo(cx, ay + 6); G.closePath();
    G.fill(); G.stroke();
  }
  G.restore();
}

function linijeOblaka(o){
  if (o.linije) return o.linije;
  var maxW = 146;
  for (var v = 24; v >= 15; v--){
    G.font = '800 ' + v + 'px "Segoe UI",system-ui,sans-serif';
    if (G.measureText(o.tekst).width <= maxW) return (o.linije = {v:v, l:[o.tekst]});
  }
  var rijeci = o.tekst.split(' ');
  if (rijeci.length > 1){
    for (var v2 = 19; v2 >= 12; v2--){
      G.font = '800 ' + v2 + 'px "Segoe UI",system-ui,sans-serif';
      var naj = null;
      for (var j = 1; j < rijeci.length; j++){
        var a = rijeci.slice(0, j).join(' '), b = rijeci.slice(j).join(' ');
        var sir = Math.max(G.measureText(a).width, G.measureText(b).width);
        if (!naj || sir < naj.s) naj = {s:sir, l:[a, b]};
      }
      if (naj.s <= maxW) return (o.linije = {v:v2, l:naj.l});
    }
  }
  return (o.linije = {v:12, l:[o.tekst]});
}

function crtajOblak(o){
  var p = oblakPozicija(o), alfa = o.pojava, skala = 0.6 + 0.4 * o.pojava;
  if (o.stanje === 'odlazi'){ alfa = Math.max(0, 1 - o.t / 30); p.y -= o.t * 1.2; }
  if (o.stanje === 'tocno'){ alfa = Math.max(0, 1 - Math.max(0, o.t - 30) / 20); skala = 1 + Math.min(o.t, 12) * 0.02; }
  if (alfa <= 0) return;
  G.save();
  G.globalAlpha = alfa;
  G.translate(p.x + (o.stanje === 'krivo' ? Math.sin(o.t * 1.3) * 4 : 0), p.y);
  G.scale(skala, skala);
  var bijela = o.stanje === 'krivo' ? '#AEB6C2' : (o.stanje === 'tocno' ? '#D9F2C0' : '#FFFFFF');
  var krugovi = [[-58, 8, 26], [-30, -10, 30], [8, -16, 34], [44, -6, 30], [66, 10, 22], [0, 12, 30], [-40, 16, 22], [36, 16, 24]];
  G.fillStyle = INK;
  krugovi.forEach(function(c){ G.beginPath(); G.arc(c[0], c[1], c[2] + 3, 0, 7); G.fill(); });
  G.fillStyle = bijela;
  krugovi.forEach(function(c){ G.beginPath(); G.arc(c[0], c[1], c[2], 0, 7); G.fill(); });
  G.fillStyle = 'rgba(43,33,24,.07)';
  G.beginPath(); G.ellipse(0, 26, 62, 8, 0, 0, 7); G.fill();
  var li = linijeOblaka(o);
  G.font = '800 ' + li.v + 'px "Segoe UI",system-ui,sans-serif';
  G.textAlign = 'center'; G.textBaseline = 'middle';
  G.fillStyle = INK;
  var vis = li.v * 1.1;
  li.l.forEach(function(t, n){ G.fillText(t, 0, 4 + (n - (li.l.length - 1) / 2) * vis); });
  if (o.stanje === 'krivo'){
    G.strokeStyle = 'rgba(62,124,177,.8)'; G.lineWidth = 2.5;
    for (var k2 = 0; k2 < 5; k2++){
      var kx = -48 + k2 * 24, ky = 40 + ((T * 2 + k2 * 11) % 26);
      G.beginPath(); G.moveTo(kx, ky); G.lineTo(kx - 2, ky + 7); G.stroke();
    }
  }
  G.restore();
}

function crtajRaka(r){
  var cx = r.x + r.w / 2, dno = r.y + r.h;
  G.save(); G.translate(cx, dno);
  if (!r.ziv){
    if (r.mrtav > 50) { G.restore(); return; }
    G.globalAlpha = 1 - r.mrtav / 50;
    G.translate(0, -r.mrtav * 0.6); G.scale(1, -1); G.translate(0, 20);
  }
  G.strokeStyle = INK; G.lineWidth = 2.5;
  var hod = r.ziv ? Math.sin(T * 0.4 + r.x * 0.1) * 3 : 0;
  for (var j = -1; j <= 1; j += 2) for (var n = 0; n < 3; n++){
    G.beginPath(); G.moveTo(j * (6 + n * 4), -8);
    G.lineTo(j * (14 + n * 5), -2 + (n % 2 ? hod : -hod)); G.lineTo(j * (16 + n * 5), 1); G.stroke();
  }
  G.beginPath(); G.moveTo(-6, -18); G.lineTo(-8, -28); G.moveTo(6, -18); G.lineTo(8, -28); G.stroke();
  G.fillStyle = '#E8623A';
  G.beginPath(); G.ellipse(0, -11, 19, 11, 0, 0, Math.PI * 2); G.fill(); G.stroke();
  var stis = r.ziv ? Math.abs(Math.sin(T * 0.12 + r.x)) * 0.6 : 0;
  [-1, 1].forEach(function(j){
    G.save(); G.translate(j * 23, -19);
    G.beginPath(); G.arc(0, 0, 7, j > 0 ? -Math.PI * .5 + stis : Math.PI * .5 + stis, j > 0 ? Math.PI * 1.3 - stis : Math.PI * 2.3 - stis);
    G.lineTo(0, 0); G.closePath(); G.fill(); G.stroke(); G.restore();
  });
  G.fillStyle = '#fff';
  [-8, 8].forEach(function(ex){ G.beginPath(); G.arc(ex, -30, 4, 0, 7); G.fill(); G.stroke(); });
  G.fillStyle = INK;
  var gl = r.vx > 0 ? 1.5 : -1.5;
  [-8, 8].forEach(function(ex){ G.beginPath(); G.arc(ex + gl, -30, 1.8, 0, 7); G.fill(); });
  if (r.penje){ G.fillStyle = INK; G.font = 'bold 12px system-ui'; G.textAlign = 'center'; G.fillText('↑', 0, -40); }
  G.restore();
}

function crtajLika(){
  var i = S.igrac, cx = i.x + i.w / 2, dno = i.y + i.h;
  var sk = 1, rot = 0;
  if (S.faza && S.faza.tip === 'ulaz'){ var u = Math.min(1, S.faza.t / 26); sk = 1 - u; rot = u * Math.PI * 3; }
  if (S.faza && S.faza.tip === 'izlaz'){ var v = Math.min(1, S.faza.t / 22); sk = v; rot = (1 - v) * -Math.PI * 3; }
  if (sk <= 0.02) return;
  G.save();
  G.translate(cx, dno - (1 - sk) * 30);
  if (!rot && i.salto > 0) rot = (1 - i.salto) * Math.PI * 2 * i.smjer;
  if (rot){ G.translate(0, -24); G.rotate(rot); G.translate(0, 24); }
  G.scale(sk * i.smjer, sk);
  if (S.nepov > 0 && Math.floor(T / 4) % 2) G.globalAlpha = 0.45;
  G.strokeStyle = INK; G.lineWidth = 3; G.lineCap = 'round'; G.lineJoin = 'round';
  var zam = i.natlu ? Math.sin(i.hod) * 0.7 : 0.5;
  /* noge */
  G.strokeStyle = INK; G.lineWidth = 5;
  G.beginPath(); G.moveTo(-4, -12); G.lineTo(-4 + Math.sin(zam) * 10, -1);
  G.moveTo(4, -12); G.lineTo(4 - Math.sin(zam) * 10, i.natlu ? -1 : -5); G.stroke();
  /* ruka iza */
  G.lineWidth = 4;
  G.beginPath(); G.moveTo(-2, -26); G.lineTo(-2 - Math.sin(zam) * 9, -15 - (i.natlu ? 0 : 10)); G.stroke();
  /* tijelo */
  G.lineWidth = 3;
  G.fillStyle = '#F4B942';
  G.beginPath(); G.roundRect ? G.roundRect(-11, -32, 22, 20, 6) : G.rect(-11, -32, 22, 20); G.fill(); G.stroke();
  G.fillStyle = '#3E7CB1'; G.fillRect(-10, -16, 20, 5); G.strokeRect(-10, -16, 20, 5);
  /* ruka ispred */
  G.lineWidth = 4;
  G.beginPath(); G.moveTo(3, -26); G.lineTo(3 + Math.sin(zam) * 9, -15 - (i.natlu ? 0 : 10)); G.stroke();
  /* glava */
  G.lineWidth = 3;
  G.fillStyle = '#F6C9A0';
  G.beginPath(); G.arc(1, -41, 10, 0, 7); G.fill(); G.stroke();
  G.fillStyle = '#2FA8A0';
  G.beginPath(); G.arc(1, -43, 10.5, Math.PI * 1.05, Math.PI * 1.95); G.closePath(); G.fill(); G.stroke();
  G.beginPath(); G.moveTo(8, -46); G.lineTo(17, -45); G.stroke();
  G.fillStyle = INK; G.beginPath(); G.arc(6, -40, 1.8, 0, 7); G.fill();
  G.restore();
}

function crtajTipke(){
  var t = tipkeRaspored(), aktivno = {l:false, r:false, j:skokBuf > 0};
  for (var id in prsti) aktivno[prsti[id]] = true;
  G.setTransform(SKALA, 0, 0, SKALA, 0, 0);
  function tipka(x, y, rx, ry, znak, upaljen, glavna){
    G.save();
    G.globalAlpha = upaljen ? 0.95 : 0.72;
    G.fillStyle = INK;
    G.beginPath(); G.ellipse(x, y + 4, rx, ry, 0, 0, 7); G.fill();
    G.fillStyle = upaljen ? '#F4B942' : (glavna ? '#FFE3A3' : '#FFFFFF');
    G.beginPath(); G.ellipse(x, y + (upaljen ? 3 : 0), rx, ry, 0, 0, 7); G.fill();
    G.strokeStyle = INK; G.lineWidth = 3; G.stroke();
    G.fillStyle = INK; G.textAlign = 'center'; G.textBaseline = 'middle';
    G.font = '800 ' + Math.round(ry * (glavna ? 0.5 : 0.8)) + 'px "Segoe UI",system-ui,sans-serif';
    G.fillText(znak, x, y + (upaljen ? 4 : 1));
    G.restore();
  }
  tipka(t.lx, t.y, t.R, t.R, '◀', aktivno.l);
  tipka(t.rx, t.y, t.R, t.R, '▶', aktivno.r);
  tipka(t.jx, t.y, t.R * 1.35, t.R, 'JUMP', aktivno.j, true);
}

/* ---------- kraj ---------- */
function pokreniBezKraja(){
  CL.zatvoriZastore();
  S.bez = true; S.radi = true; S.pauza = false; S.srca = 3; S.bezRazina = 0; S.faza = null;
  S.strana = 0; S.igrac.x = 80; S.igrac.y = TLO - 48; S.igrac.vx = S.igrac.vy = S.igrac.kx = 0;
  KAM = 0;
  postaviRakove(); novoPitanje(); osvjezi();
  CL.poruka('Endless mode — portals stop counting now.', 'dobro');
}
function poraz(){
  if (S.bez){
    return CL.kraj({
      naslov:'Game over',
      tekst:'In endless mode you went through <b>' + S.bezRazina + '</b> portals and flipped ' + S.gaziranih + ' crabs.',
      bodovi:50, maks:50,
      ponovno:pokreniBezKraja, beskonacno:pokreniBezKraja
    });
  }
  CL.kraj({
    naslov:'Game over',
    tekst:'You went through <b>' + S.razina + '</b> of ' + UKUPNO + ' portals — world ' + SVJETOVI[svijetIdx()].ime + '.',
    bodovi:Math.min(50, S.bodovi), maks:50,
    ponovno:function(){ novaIgra(); }
  });
}
function pobjeda(){
  S.radi = false;
  CL.kraj({
    naslov:'All three worlds!',
    tekst:'Thirty portals, both shores, and ' + S.gaziranih + ' crabs flipped on their backs.',
    bodovi:50, maks:50,
    ponovno:function(){ novaIgra(); },
    beskonacno:pokreniBezKraja
  });
