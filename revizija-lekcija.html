  });
  document.getElementById('bok').innerHTML = html;
}

/* ---------- fokus: jedna vježba, igra se, pa dalje ---------- */
function redFokusa(){
  var pojam = document.getElementById('trazi').value.trim().toLowerCase();
  return IGRE.filter(function(g){
    if(!prolaziFilter(g)) return false;
    if(pojam && trazilicaTekst(g).indexOf(pojam) < 0) return false;
    return true;
  });
}
function fokusPomak(smjer){
  var red = redFokusa();
  if(!red.length){ poruka('Nijedna vježba ne odgovara filtru.'); return; }
  var tren = IGRE[fokusI];
  var cilj = null;
  if(smjer > 0){
    for(var i = 0; i < red.length; i++){ if(red[i]._i > tren._i){ cilj = red[i]; break; } }
    if(!cilj){ poruka('Kraj reda — nema više vježbi u ovom filtru.'); return; }
  } else {
    for(var k = red.length - 1; k >= 0; k--){ if(red[k]._i < tren._i){ cilj = red[k]; break; } }
    if(!cilj){ poruka('Ovo je prva vježba u ovom filtru.'); return; }
  }
  fokusI = cilj._i;
  S.zadnjaVjezba = cilj._id; S.zadnjaCjelina = cilj._c; spremi();
  crtajFokus();
  document.getElementById('glavno').scrollTop = 0;
}
function crtajFokus(){
  IGRAC.zaustavi();
  var g = IGRE[fokusI];
  if(!g) return;
  trenutnaCjelina = g._c;
  var el = document.getElementById('glavno');
  var m = g.meta || {};
  var o = oc(g._id) || {};
  var c = CJELINE[g._c];

  var meta = [];
  if(m.prag)     meta.push('prag ' + m.prag + '%');
  if(m.trajanje) meta.push('sat ' + m.trajanje + ' s');
  if(m.stupci)   meta.push('stupci: ' + m.stupci);
  if(m.nastavci) meta.push('nastavci: ' + m.nastavci);
  meta.push((g.stavke || []).length + ' stavki');
  meta.push('sortkljuc ' + g.sortkljuc);

  el.innerHTML =
    '<div class="fokusOmot">' +
      '<div class="fokusGlava">' +
        '<span class="fokusPut">' + esc(c.ime) + ' · ' + esc(c.naslov) + ' · str ' + esc(g.stranica) + '</span>' +
        '<span class="znak f-' + esc(g.format) + '">' + esc(g.format) + '</span>' +
        '<span class="bod">' + esc(g.bodovi != null ? g.bodovi + ' bod.' : '') + '</span>' +
        '<span class="stanje ' + (o.status || 'neoc') + '">' +
          (o.status === 'prolaz' ? '✓ prolaz' : o.status === 'izbaci' ? '✕ izbačeno' : 'neocijenjeno') + '</span>' +
      '</div>' +
      '<div class="fokusGlava"><h2>' + esc(g.naslov || '(bez naslova)') + '</h2></div>' +
      (jeIzmijenjeno(g) ? '<div class="izmijenjeno">⚠ Ova je vježba u data.js mijenjana nakon što si je ocijenio — ocjena se odnosi na stariju verziju.</div>' : '') +
      (m.opis ? '<div class="fokusUputa">' + md(m.opis) + '</div>' : '') +
      '<div class="ploca" id="igraPloca"></div>' +
      '<div class="fokusAlat">' +
        '<button class="btn" data-fa="ponovi">↻ Ponovo (R)</button>' +
        '<span style="flex:1"></span>' +
        '<span class="metared">' + meta.map(function(x){ return '<span>' + esc(x) + '</span>'; }).join('') + '</span>' +
      '</div>' +
      (g._u.length ? '<div class="upoz">' + g._u.map(function(u){
          return '<b' + (u.tvrd ? ' class="tvrd"' : '') + '>⚠ ' + esc(u.t) + '</b>'; }).join('') + '</div>' : '') +
      (m.info ? '<details class="sklopivo"><summary>ℹ Info tekst prije igre</summary><div class="infobox" style="margin:10px 0 0">' + md(m.info) + '</div></details>' : '') +
      '<details class="sklopivo"><summary>📋 Sve stavke (' + (g.stavke || []).length + ') — statično, s odgovorima</summary><div>' +
        (m.tekst ? '<div class="pricaBox">' + md(m.tekst) + '</div>' : '') +
        stavkePrikaz(g) +
      '</div></details>' +
    '</div>';

  IGRAC.pokreni(g, document.getElementById('igraPloca'));
  osvjeziDonju();
  crtajBok();
}
function osvjeziDonju(){
  var g = IGRE[fokusI];
  if(!g) return;
  var o = oc(g._id) || {};
  var d = document.getElementById('donja');
  d.hidden = (pogled !== 'fokus');
  document.body.classList.toggle('fokus', pogled === 'fokus');
  if(d.hidden) return;
  d.querySelector('[data-f="prolaz"]').classList.toggle('on', o.status === 'prolaz');
  d.querySelector('[data-f="izbaci"]').classList.toggle('on', o.status === 'izbaci');
  var ta = document.getElementById('fokusBilj');
  if(document.activeElement !== ta){ ta.value = o.bilj || ''; }
  ta.classList.toggle('ima', !!(o.bilj || '').trim());
  var red = redFokusa();
  var mjesto = 0;
  for(var i = 0; i < red.length; i++){ if(red[i]._i <= g._i) mjesto++; }
  document.getElementById('fokusPoz').textContent =
    (red.length ? mjesto + '/' + red.length + ' u filtru' : 'izvan filtra') + ' · #' + (g._i + 1) + ' od ' + IGRE.length;
}

function crtajGlavno(){
  var el = document.getElementById('glavno');
  var pojam = document.getElementById('trazi').value.trim().toLowerCase();

  if(pogled === 'fokus'){ crtajFokus(); return; }
  document.getElementById('donja').hidden = true;
  document.body.classList.remove('fokus');
  IGRAC.zaustavi();
  if(pogled === 'popis'){ el.innerHTML = popisHTML(); vidljive = []; return; }

  var lista, zagl;
  if(pojam){
    lista = IGRE.filter(function(g){ return trazilicaTekst(g).indexOf(pojam) >= 0 && prolaziFilter(g); });
    zagl = '<div class="zaglavlje"><div><h1>Rezultati pretrage</h1>' +
           '<div class="sub">„' + esc(pojam) + '” — ' + lista.length + ' vježbi' +
           (lista.length > 150 ? ' (prikazano prvih 150)' : '') + '</div></div></div>';
    lista = lista.slice(0, 150);
  } else {
    var c = CJELINE[trenutnaCjelina];
    if(!c){ el.innerHTML = '<div class="prazno">Nema podataka.</div>'; return; }
    lista = c.igre.filter(prolaziFilter);
    var p = 0, x = 0;
    c.igre.forEach(function(g){ var o = oc(g._id) || {}; if(o.status === 'prolaz') p++; else if(o.status === 'izbaci') x++; });
    zagl = '<div class="zaglavlje"><div><h1>' + esc(c.ime) + ' — ' + esc(c.naslov) + '</h1>' +
      '<div class="sub">' + c.igre.length + ' vježbi · ✓ ' + p + ' · ✕ ' + x + ' · neocijenjeno ' + (c.igre.length - p - x) +
      (lista.length !== c.igre.length ? ' · <b>filtar prikazuje ' + lista.length + '</b>' : '') + '</div></div>' +
      '<div class="prek">' +
        '<button class="btn" data-svi="prolaz">✓ Prolaz cijeloj cjelini</button>' +
        '<button class="btn" data-prethodna>← Prethodna</button>' +
        '<button class="btn" data-sljedeca>Sljedeća →</button>' +
      '</div></div>';
  }

  el.innerHTML = zagl + (lista.length
    ? lista.map(kartica).join('')
    : '<div class="prazno">Nema vježbi koje odgovaraju filtru.</div>');
  vidljive = lista.map(function(g){ return g._id; });
  zarIdx = 0;
  oznaciZar(false);
}

function popisHTML(){
  var pojam = document.getElementById('trazi').value.trim().toLowerCase();
  var html = '<div class="popis"><div class="zaglavlje"><div><h1>Popis svih vježbi</h1>' +
             '<div class="sub">Klik na red otvara vježbu u pregledu.</div></div></div>' +
             '<table class="pop"><thead><tr><th>#</th><th>str</th><th>format</th><th>naslov</th>' +
             '<th>status</th><th>bilješka</th><th>⚠</th></tr></thead><tbody>';
  var zadnjaC = null, br = 0;
  IGRE.forEach(function(g){
    if(!prolaziFilter(g)) return;
    if(pojam && trazilicaTekst(g).indexOf(pojam) < 0) return;
    if(g._c !== zadnjaC){
      zadnjaC = g._c;
      var c = CJELINE[g._c];
      html += '<tr class="grupa"><td colspan="7">' + esc(c.ime) + ' — ' + esc(c.naslov) + '</td></tr>';
    }
    var o = oc(g._id) || {};
    br++;
    html += '<tr data-i="' + g._i + '">' +
      '<td style="color:#b3a999">' + (g._i + 1) + '</td>' +
      '<td>' + esc(g.stranica) + '</td>' +
      '<td><span class="znakm">' + esc(g.format) + '</span></td>' +
      '<td>' + esc(g.naslov || '') + '</td>' +
      '<td class="st-cell ' + (o.status === 'prolaz' ? 'p' : o.status === 'izbaci' ? 'x' : 'n') + '">' +
        (o.status === 'prolaz' ? '✓ prolaz' : o.status === 'izbaci' ? '✕ izbačeno' : '–') + '</td>' +
      '<td>' + esc((o.bilj || '').slice(0, 120)) + ((o.bilj || '').length > 120 ? '…' : '') + '</td>' +
      '<td>' + (g._u.length ? '<span class="znakm">' + g._u.length + '</span>' : '') + '</td>' +
    '</tr>';
  });
  html += '</tbody></table><div class="sub" style="margin:10px 0 0;color:var(--muted)">Prikazano ' + br + ' vježbi.</div></div>';
  return html;
}

function osvjeziBrojke(){
  var p = 0, x = 0, b = 0;
  IGRE.forEach(function(g){
    var o = oc(g._id) || {};
    if(o.status === 'prolaz') p++; else if(o.status === 'izbaci') x++;
    if(o.bilj) b++;
  });
  var u = IGRE.length;
  document.getElementById('brP').textContent = p;
  document.getElementById('brI').textContent = x;
  document.getElementById('brN').textContent = u - p - x;
  document.getElementById('brB').textContent = b;
  document.getElementById('brU').textContent = u;
  document.getElementById('trakaP').style.width = (u ? p / u * 100 : 0) + '%';
  document.getElementById('trakaI').style.width = (u ? x / u * 100 : 0) + '%';
}

function oznaciZar(pomakni){
  var karte = document.querySelectorAll('#glavno .karta');
  karte.forEach(function(k, i){ k.classList.toggle('zar', i === zarIdx); });
  if(pomakni && karte[zarIdx]) karte[zarIdx].scrollIntoView({ block:'start' });
}

function crtajSve(){
  crtajBok(); crtajGlavno(); osvjeziBrojke();
}

/* ═══════════════ 8. INTERAKCIJA ═══════════════ */
document.getElementById('bok').addEventListener('click', function(e){
  var b = e.target.closest('.lek');
  if(!b) return;
  trenutnaCjelina = +b.getAttribute('data-c');
  S.zadnjaCjelina = trenutnaCjelina; spremi();
  if(pogled === 'fokus'){
    var c = CJELINE[trenutnaCjelina];
    var cilj = c.igre.filter(prolaziFilter)[0] || c.igre[0];
    fokusI = cilj._i;
    S.zadnjaVjezba = cilj._id; spremi();
    crtajFokus();
  } else {
    if(pogled === 'popis') postaviMod('pregled');
    crtajSve();
  }
  document.getElementById('glavno').scrollTop = 0;
});

/* ---------- donja traka ---------- */
document.getElementById('donja').addEventListener('click', function(e){
  var b = e.target.closest('[data-f]');
  if(!b) return;
  var act = b.getAttribute('data-f'), g = IGRE[fokusI];
  if(!g) return;
  if(act === 'dalje'){ fokusPomak(1); return; }
  if(act === 'natrag'){ fokusPomak(-1); return; }
  var trenutni = (oc(g._id) || {}).status || '';
  if(act === 'ocisti') postaviOcjenu(g._id, null);
  else postaviOcjenu(g._id, trenutni === act ? null : act);
  /* prolaz vodi odmah dalje; izbacivanje ostaje da se stigne napisati bilješka */
  var novi = (oc(g._id) || {}).status;
  osvjeziDonju(); osvjeziBrojke(); crtajBok();
  var znak = document.querySelector('#glavno .stanje');
  if(znak){
    znak.className = 'stanje ' + (novi || 'neoc');
    znak.textContent = novi === 'prolaz' ? '✓ prolaz' : novi === 'izbaci' ? '✕ izbačeno' : 'neocijenjeno';
  }
  if(act === 'prolaz' && novi === 'prolaz') fokusPomak(1);
});
document.getElementById('fokusBilj').addEventListener('input', function(){
  var g = IGRE[fokusI];
  if(!g) return;
  postaviBilj(g._id, this.value);
  this.classList.toggle('ima', !!this.value.trim());
  clearTimeout(this._t);
  var self = this;
  self._t = setTimeout(function(){ osvjeziBrojke(); crtajBok(); }, 500);
});

/* ---------- način rada ---------- */
function postaviMod(m){
  pogled = m;
  document.getElementById('modIgraj').classList.toggle('aktiv', m === 'fokus');
  document.getElementById('modPregled').classList.toggle('aktiv', m === 'lekcija');
  document.getElementById('modPopis').classList.toggle('aktiv', m === 'popis');
}
document.getElementById('modIgraj').addEventListener('click', function(){
  postaviMod('fokus'); crtajGlavno(); document.getElementById('glavno').scrollTop = 0;
});
document.getElementById('modPregled').addEventListener('click', function(){
  postaviMod('lekcija'); crtajGlavno(); document.getElementById('glavno').scrollTop = 0;
});

document.getElementById('glavno').addEventListener('click', function(e){
  /* ponovno pokretanje igre */
  var pon = e.target.closest('[data-fa="ponovi"]');
  if(pon){ IGRAC.pokreni(IGRE[fokusI], document.getElementById('igraPloca')); return; }
  /* popis → skok na vježbu */
  var red = e.target.closest('tr[data-i]');
  if(red && pogled === 'popis'){
    otvoriVjezbu(+red.getAttribute('data-i'));
    return;
  }
  var prethodna = e.target.closest('[data-prethodna]');
  if(prethodna){ pomakniCjelinu(-1); return; }
  var sljedeca = e.target.closest('[data-sljedeca]');
  if(sljedeca){ pomakniCjelinu(1); return; }

  var svi = e.target.closest('[data-svi]');
  if(svi){
    var c = CJELINE[trenutnaCjelina];
    var neoc = c.igre.filter(function(g){ return !(oc(g._id) || {}).status; });
    if(!neoc.length){ poruka('Sve vježbe u ovoj cjelini već su ocijenjene.'); return; }
    if(!confirm('Označiti " prolaz" za ' + neoc.length + ' neocijenjenih vježbi u cjelini ' + c.ime + '?')) return;
    neoc.forEach(function(g){ postaviOcjenu(g._id, 'prolaz'); });
    crtajSve();
    poruka(neoc.length + ' vježbi označeno kao prolaz.');
    return;
  }

  var karta = e.target.closest('.karta');
  if(!karta) return;

  /* aktivna kartica */
  var karte = Array.prototype.slice.call(document.querySelectorAll('#glavno .karta'));
  zarIdx = karte.indexOf(karta);
  oznaciZar(false);

  var gumb = e.target.closest('[data-act]');
  if(gumb){
    var act = gumb.getAttribute('data-act');
    primijeni(karta, act === 'ocisti' ? null : act);
  }
});

document.getElementById('glavno').addEventListener('input', function(e){
  if(e.target.tagName !== 'TEXTAREA') return;
  var karta = e.target.closest('.karta');
  postaviBilj(karta.getAttribute('data-id'), e.target.value);
  e.target.classList.toggle('ima', !!e.target.value.trim());
  clearTimeout(e.target._t);
  e.target._t = setTimeout(function(){ osvjeziBrojke(); crtajBok(); }, 500);
});

function primijeni(karta, status){
  var id = karta.getAttribute('data-id');
  var trenutni = (oc(id) || {}).status || '';
  var novi = (trenutni === status) ? null : status;   /* ponovni klik poništava */
  postaviOcjenu(id, novi);

  karta.classList.remove('st-prolaz', 'st-izbaci');
  if(novi) karta.classList.add('st-' + novi);
  var znak = karta.querySelector('.stanje');
  znak.className = 'stanje ' + (novi || 'neoc');
  znak.textContent = novi === 'prolaz' ? '✓ prolaz' : novi === 'izbaci' ? '✕ izbačeno' : 'neocijenjeno';
  karta.querySelector('[data-act="prolaz"]').classList.toggle('on', novi === 'prolaz');
  karta.querySelector('[data-act="izbaci"]').classList.toggle('on', novi === 'izbaci');

  osvjeziBrojke(); crtajBok();
}

function otvoriVjezbu(i, uFokus){
  var g = IGRE[i];
  if(!g) return;
  trenutnaCjelina = g._c;
  S.zadnjaCjelina = trenutnaCjelina; S.zadnjaVjezba = g._id; spremi();
  if(uFokus !== false){
    fokusI = i;
    postaviMod('fokus');
    crtajFokus(); osvjeziBrojke();
    document.getElementById('glavno').scrollTop = 0;
    return;
  }
  document.getElementById('trazi').value = '';
  postaviMod('lekcija');
  crtajSve();
  var el = document.querySelector('#glavno .karta[data-id="' + g._id + '"]');
  if(el){
    var karte = Array.prototype.slice.call(document.querySelectorAll('#glavno .karta'));
    zarIdx = karte.indexOf(el);
    oznaciZar(true);
  } else {
    poruka('Vježba je skrivena trenutnim filtrom.');
  }
}

function pomakniCjelinu(smjer){
  var n = trenutnaCjelina + smjer;
  if(n < 0 || n >= CJELINE.length){ poruka(smjer > 0 ? 'Ovo je zadnja cjelina.' : 'Ovo je prva cjelina.'); return; }
  trenutnaCjelina = n;
  S.zadnjaCjelina = n; spremi();
  if(pogled === 'fokus'){
    var c = CJELINE[n];
    var cilj = c.igre.filter(prolaziFilter)[0] || c.igre[0];
    fokusI = cilj._i; S.zadnjaVjezba = cilj._id; spremi();
    crtajFokus();
  } else {
    crtajSve();
  }
  document.getElementById('glavno').scrollTop = 0;
}

(function(){
  var br = {};
  IGRE.forEach(function(g){ br[g.format] = (br[g.format] || 0) + 1; });
  var sel = document.getElementById('filterFormat');
  sel.innerHTML = '<option value="sve">svi formati</option>' +
    Object.keys(br).sort().map(function(f){
      return '<option value="' + esc(f) + '">' + esc(f) + ' (' + br[f] + ')</option>';
    }).join('');
})();
function filtarPromijenjen(){
  /* ako trenutna vježba ispadne iz filtra, skoči na prvu koja u njemu jest */
  if(pogled === 'fokus'){
    var red = redFokusa();
    if(red.length && !prolaziFilter(IGRE[fokusI])){
      var cilj = null;
      for(var i = 0; i < red.length; i++){ if(red[i]._i >= IGRE[fokusI]._i){ cilj = red[i]; break; } }
      cilj = cilj || red[0];
      fokusI = cilj._i;
      S.zadnjaVjezba = cilj._id; spremi();
    }
  }
  crtajSve();
}
document.getElementById('filterFormat').addEventListener('change', filtarPromijenjen);
document.getElementById('filter').addEventListener('change', filtarPromijenjen);
var trazTajmer = null;
document.getElementById('trazi').addEventListener('input', function(){
  clearTimeout(trazTajmer);
  trazTajmer = setTimeout(function(){ crtajBok(); crtajGlavno(); }, 220);
});
document.getElementById('modPopis').addEventListener('click', function(){
  postaviMod(pogled === 'popis' ? 'fokus' : 'popis');
  crtajGlavno();
  document.getElementById('glavno').scrollTop = 0;
});
document.getElementById('skoci').addEventListener('click', function(){
  var g = IGRE.find(function(g){ return !(oc(g._id) || {}).status; });
  if(!g){ poruka('Sve vježbe su ocijenjene. 🎉'); return; }
  otvoriVjezbu(g._i);
});

/* tipkovnica */
document.addEventListener('keydown', function(e){
  var u = e.target.tagName;
  var upolju = (u === 'TEXTAREA' || u === 'INPUT' || u === 'SELECT');
  if(e.key === 'Escape' && upolju){ e.target.blur(); return; }
  if(upolju || e.ctrlKey || e.metaKey || e.altKey) return;
  var k = e.key.toLowerCase();

  /* --- fokus (igranje) ima svoje tipke --- */
  if(pogled === 'fokus'){
    var d = document.getElementById('donja');
    if(e.key === 'ArrowRight' || e.key === 'Enter'){ e.preventDefault(); fokusPomak(1); return; }
    if(e.key === 'ArrowLeft'){ e.preventDefault(); fokusPomak(-1); return; }
    if(k === '1' || k === 'a'){ e.preventDefault(); d.querySelector('[data-f="prolaz"]').click(); return; }
    if(k === '2' || k === 'x'){ e.preventDefault(); d.querySelector('[data-f="izbaci"]').click(); return; }
    if(k === '0'){ e.preventDefault(); d.querySelector('[data-f="ocisti"]').click(); return; }
    if(k === 'b'){ e.preventDefault(); document.getElementById('fokusBilj').focus(); return; }
    if(k === 'r'){ e.preventDefault(); IGRAC.pokreni(IGRE[fokusI], document.getElementById('igraPloca')); return; }
    if(k === 'n'){ e.preventDefault(); pomakniCjelinu(1); return; }
    if(k === 'p'){ e.preventDefault(); pomakniCjelinu(-1); return; }
    return;
  }

  var karte = document.querySelectorAll('#glavno .karta');

  if(k === 'j' || e.key === 'ArrowDown'){ e.preventDefault(); if(zarIdx < karte.length - 1) zarIdx++; oznaciZar(true); }
  else if(k === 'k' || e.key === 'ArrowUp'){ e.preventDefault(); if(zarIdx > 0) zarIdx--; oznaciZar(true); }
  else if(k === 'n'){ pomakniCjelinu(1); }
  else if(k === 'p'){ pomakniCjelinu(-1); }
  else if(k === '1' || k === 'a'){ if(karte[zarIdx]) { primijeni(karte[zarIdx], 'prolaz'); dalje(karte); } }
  else if(k === '2' || k === 'x'){ if(karte[zarIdx]) { primijeni(karte[zarIdx], 'izbaci'); } }
  else if(k === '0'){ if(karte[zarIdx]) primijeni(karte[zarIdx], null); }
  else if(k === 'b'){
    e.preventDefault();
    if(karte[zarIdx]) karte[zarIdx].querySelector('textarea').focus();
  }
});
function dalje(karte){
  if(zarIdx < karte.length - 1){ zarIdx++; oznaciZar(true); }
}

/* ═══════════════ 9. IZVOZ ═══════════════ */
function datum(){
  var d = new Date(), p = function(n){ return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}
function vrijeme(){
  var d = new Date(), p = function(n){ return (n < 10 ? '0' : '') + n; };
  return datum() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function preuzmi(ime, sadrzaj, tip){
  try{
    var blob = new Blob(['﻿' + sadrzaj], { type: tip + ';charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = ime;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1500);
    poruka('Spremljeno: ' + ime);
  }catch(err){ alert('Preuzimanje nije uspjelo: ' + err.message); }
}
function sazetak(){
  var p = 0, x = 0, b = 0;
  IGRE.forEach(function(g){
    var o = oc(g._id) || {};
    if(o.status === 'prolaz') p++; else if(o.status === 'izbaci') x++;
    if(o.bilj) b++;
  });
  return { prolaz:p, izbaci:x, neoc:IGRE.length - p - x, bilj:b, ukupno:IGRE.length };
}

function izvozJSON(){
  var s = sazetak();
  var out = {
    alat: 'revizija-lekcija',
    verzija: 1,
    izvezeno: new Date().toISOString(),
    dataGenerirano: PODACI.generirano || null,
    sazetak: s,
    stavke: IGRE.map(function(g){
      var o = oc(g._id) || {};
      return {
        sortkljuc: g.sortkljuc, cjelina: g.cjelina, cjelinanaslov: g.cjelinanaslov,
        stranica: g.stranica, format: g.format, naslov: g.naslov,
        status: o.status || null, bilj: o.bilj || null,
        upozorenja: g._u.map(function(u){ return u.t; })
      };
    }),
    /* sirovo stanje za ponovni uvoz */
    stanje: S
  };
  preuzmi('revizija-' + datum() + '.json', JSON.stringify(out, null, 2), 'application/json');
}

function izvozCSV(){
  var red = function(a){
    return a.map(function(c){ return '"' + String(c == null ? '' : c).replace(/"/g,'""') + '"'; }).join(';');
  };
  var linije = [red(['#','cjelina','naslov cjeline','stranica','format','naslov','status','bilješka','upozorenja','sortkljuc'])];
  IGRE.forEach(function(g){
    var o = oc(g._id) || {};
    linije.push(red([g._i + 1, g.cjelina, g.cjelinanaslov, g.stranica, g.format, g.naslov,
      o.status === 'prolaz' ? 'prolaz' : o.status === 'izbaci' ? 'izbačeno' : 'neocijenjeno',
      o.bilj || '', g._u.map(function(u){ return u.t; }).join(' | '), g.sortkljuc]));
  });
  preuzmi('revizija-' + datum() + '.csv', linije.join('\r\n'), 'text/csv');
}

function izvozMD(){
  var s = sazetak(), t = [];
  t.push('# Revizija lekcija — Croland');
  t.push('');
  t.push('- Datum: **' + vrijeme() + '**');
  t.push('- data.js generiran: ' + (PODACI.generirano || 'nepoznato'));
  t.push('- Ukupno vježbi: **' + s.ukupno + '** — prolaz **' + s.prolaz + '**, izbačeno **' + s.izbaci +
         '**, neocijenjeno **' + s.neoc + '**, s bilješkom **' + s.bilj + '**');
  t.push('');
  CJELINE.forEach(function(c){
    var p = 0, x = 0;
    c.igre.forEach(function(g){ var o = oc(g._id) || {}; if(o.status === 'prolaz') p++; else if(o.status === 'izbaci') x++; });
    t.push('## ' + c.ime + ' — ' + c.naslov);
    t.push('');
    t.push('_' + c.igre.length + ' vježbi · prolaz ' + p + ' · izbačeno ' + x + ' · neocijenjeno ' + (c.igre.length - p - x) + '_');
    t.push('');
    t.push('| str | format | naslov | status | bilješka |');
    t.push('|---|---|---|---|---|');
    c.igre.forEach(function(g){
      var o = oc(g._id) || {};
      var st = o.status === 'prolaz' ? '✓ prolaz' : o.status === 'izbaci' ? '✕ IZBACITI' : '–';
      t.push('| ' + g.stranica + ' | ' + g.format + ' | ' + (g.naslov || '').replace(/\|/g,'\\|') +
             ' | ' + st + ' | ' + (o.bilj || '').replace(/\|/g,'\\|').replace(/\n/g,' ') + ' |');
    });
    t.push('');
  });

  var izb = IGRE.filter(function(g){ return (oc(g._id) || {}).status === 'izbaci'; });
  t.push('## Za izbacivanje (' + izb.length + ')');
  t.push('');
  if(!izb.length) t.push('_nijedna_');
  izb.forEach(function(g){
    var o = oc(g._id) || {};
    t.push('- **' + g.cjelina + ' · str ' + g.stranica + '** — ' + (g.naslov || '') + ' _(' + g.format + ', sortkljuc ' + g.sortkljuc + ')_' +
           (o.bilj ? '  \n  ' + o.bilj.replace(/\n/g,' ') : ''));
  });
  t.push('');

  var sb = IGRE.filter(function(g){ return (oc(g._id) || {}).bilj; });
  t.push('## Sve bilješke (' + sb.length + ')');
  t.push('');
  if(!sb.length) t.push('_nijedna_');
  sb.forEach(function(g){
    var o = oc(g._id) || {};
    t.push('- **' + g.cjelina + ' · str ' + g.stranica + ' — ' + (g.naslov || '') + '** ' +
           (o.status === 'izbaci' ? '`izbaciti`' : o.status === 'prolaz' ? '`prolaz`' : '`neocijenjeno`') +
           '  \n  ' + o.bilj.replace(/\n/g,' '));
  });
  t.push('');
  return t.join('\n');
}

var izvozIzbornik = document.getElementById('izvozIzbornik');
document.getElementById('izvoz').addEventListener('click', function(e){
  e.stopPropagation();
  izvozIzbornik.hidden = !izvozIzbornik.hidden;
});
document.addEventListener('click', function(e){
  if(!izvozIzbornik.hidden && !e.target.closest('.izbornikOmot')) izvozIzbornik.hidden = true;
});
izvozIzbornik.addEventListener('click', function(e){
  var b = e.target.closest('[data-izvoz]');
  if(!b) return;
  var sto = b.getAttribute('data-izvoz');
  izvozIzbornik.hidden = true;
  if(sto === 'html' || sto === 'sve') preuzmi('revizija-' + datum() + '.html', izvozHTML(), 'text/html');
  if(sto === 'md'   || sto === 'sve') preuzmi('revizija-' + datum() + '.md', izvozMD(), 'text/markdown');
  if(sto === 'csv'  || sto === 'sve') izvozCSV();
  if(sto === 'json' || sto === 'sve') izvozJSON();
});

document.getElementById('pomocGumb').addEventListener('click', function(){
  var k = document.getElementById('pomocKut');
  k.hidden = !k.hidden;
});

document.getElementById('uvoz').addEventListener('click', function(){ document.getElementById('uvozFile').click(); });
document.getElementById('uvozFile').addEventListener('change', function(e){
  var f = e.target.files && e.target.files[0];
  if(!f) return;
  var fr = new FileReader();
  fr.onload = function(){
    try{
      var d = JSON.parse(fr.result);
      var novo = (d && d.stanje && d.stanje.ocjene) ? d.stanje.ocjene
               : (d && d.ocjene) ? d.ocjene : null;
      if(!novo) throw new Error('Datoteka ne sadrži ocjene.');
      var kolko = Object.keys(novo).length;
      if(!confirm('Učitati ' + kolko + ' ocjena/bilješki? Trenutno stanje bit će zamijenjeno.')) return;
      S.ocjene = novo;
      spremi(); crtajSve();
      poruka('Učitano ' + kolko + ' zapisa.');
    }catch(err){ alert('Uvoz nije uspio: ' + err.message); }
  };
  fr.readAsText(f, 'utf-8');
  e.target.value = '';
});

window.addEventListener('beforeunload', function(e){
  if(!spremanjeRadi && Object.keys(S.ocjene).length){
    e.preventDefault(); e.returnValue = '';
  }
});
