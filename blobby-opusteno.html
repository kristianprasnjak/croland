<script>
(() => {
  const $ = id => document.getElementById(id);
  const scena = $('scena'), tijelo = $('tijelo'), koza = $('koza'), glava = $('glava'), sjena = $('sjena');
  const smanjeno = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f = n => n.toFixed(1), ogr = (v, a, b) => Math.max(a, Math.min(b, v));
  const glatko = (a, b, x) => { const u = ogr((x - a) / (b - a), 0, 1); return u * u * (3 - 2 * u); };

  // ---------- OPUŠTENO TIJELO (silueta prema Blobby9, visina prema originalu) ----------
  // =====================================================================
  //  TIJELO kao jedna cjelina: obris se mjeri kao udaljenost od središta
  //  u svakom smjeru. Ruke mogu samo "nabubriti" taj obris (glatki maksimum),
  //  pa nikad ne nastaju rupe ni duboke usjekline — koža ih popunjava.
  // =====================================================================
  // donji dio tijela malo sužen (glava ostaje ista)
  const OBRIS = [[-14.3, -140.0], [-22.6, -140.0], [-30.7, -139.0], [-38.9, -137.5], [-46.8, -135.2], [-54.5, -132.3], [-62.1, -128.9], [-69.3, -125.0], [-76.2, -120.4], [-82.6, -115.2], [-88.7, -109.7], [-94.4, -103.7], [-99.4, -97.1], [-103.9, -90.1], [-107.9, -82.9], [-111.5, -75.5], [-114.4, -67.7], [-117.0, -59.9], [-118.8, -51.8], [-120.1, -43.7], [-121.3, -35.5], [-122.6, -27.3], [-124.2, -19.3], [-126.7, -11.4], [-129.6, -3.7], [-133.6, 3.6], [-138.1, 10.5], [-143.3, 17.0], [-148.4, 23.5], [-152.9, 30.4], [-156.8, 37.7], [-159.6, 45.4], [-161.6, 53.5], [-162.5, 61.7], [-162.5, 69.9], [-161.2, 78.1], [-159.1, 86.1], [-156.0, 93.7], [-152.0, 101.0], [-146.8, 107.4], [-140.5, 112.8], [-133.7, 117.3], [-126.2, 120.8], [-118.2, 122.9], [-110.0, 124.1], [-101.8, 123.1], [-93.6, 122.5], [-85.3, 122.5], [-77.2, 124.0], [-69.5, 126.8], [-62.0, 130.3], [-54.5, 133.9], [-46.8, 136.8], [-38.9, 139.1], [-30.7, 140.0], [-22.4, 140.0], [-14.2, 139.8], [-6.1, 138.1], [1.8, 135.6], [9.5, 132.6], [16.8, 128.8], [23.8, 124.4], [30.9, 120.2], [38.3, 116.5], [46.1, 113.9], [54.3, 113.0], [62.6, 113.0], [70.9, 113.0], [79.1, 112.1], [87.1, 110.2], [94.9, 107.6], [102.3, 103.9], [109.1, 99.2], [115.2, 93.6], [120.4, 87.2], [124.6, 80.1], [128.0, 72.6], [130.6, 64.7], [132.2, 56.6], [132.5, 48.4], [132.3, 40.1], [131.1, 31.9], [128.8, 24.0], [125.6, 16.4], [121.4, 9.3], [116.3, 2.8], [110.8, -3.4], [105.1, -9.4], [99.1, -15.1], [93.6, -21.2], [89.0, -28.1], [85.2, -35.4], [82.1, -43.1], [79.8, -51.0], [78.0, -59.1], [75.9, -67.1], [73.4, -74.9], [70.3, -82.6], [66.3, -89.8], [61.9, -96.8], [57.1, -103.6], [51.8, -109.9], [45.8, -115.5], [39.3, -120.7], [32.5, -125.4], [25.3, -129.4], [17.8, -132.8], [10.1, -135.7], [2.1, -137.9], [-6.1, -138.9]].map(([x, y]) => [-15 + (x + 15) * (1 - 0.13 * glatko(-30, 120, y)), y]);
  const C = [-15, 15], DNO = 140, M = 180;
  const KUT = i => -Math.PI / 2 + (i / M) * 2 * Math.PI;   // od vrha, u smjeru kazaljke
  // osnovni polumjer opuštenog tijela u svakom smjeru (zraka iz središta)
  const R0 = Array.from({ length: M }, (_, i) => {
    const a = KUT(i), dx = Math.cos(a), dy = Math.sin(a); let best = 0;
    for (let j = 0; j < OBRIS.length; j++) {
      const p = OBRIS[j], q = OBRIS[(j + 1) % OBRIS.length];
      const ex = q[0] - p[0], ey = q[1] - p[1], wx = p[0] - C[0], wy = p[1] - C[1];
      const den = dx * ey - dy * ex; if (Math.abs(den) < 1e-9) continue;
      const t = (wx * ey - wy * ex) / den, u = (wx * dy - wy * dx) / den;
      if (t > 0 && u >= 0 && u <= 1) best = Math.max(best, t);
    }
    return best;
  });
  // pogled sprijeda: tijelo je simetrično oko svoje osi (x = -15)
  { const sim = R0.map((r, i) => (r + R0[(M - i) % M]) / 2); sim.forEach((r, i) => { R0[i] = r; }); }
  const smjerOd = p => Math.atan2(p[1] - C[1], p[0] - C[0]);
  const kutnaUdalj = (a, b) => { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };
  // tri brežuljka na dnu (smjerovi izmjereni iz obrisa)
  const BREZ = [43, 55, 67].map(j => smjerOd(OBRIS[j]));
  const smax = (a, b, k) => { const h = Math.max(k - Math.abs(a - b), 0) / k; return Math.max(a, b) + h * h * k * 0.25; };
  const R0u = a => { const x = ((a + Math.PI / 2) / (2 * Math.PI)) * M; const i = Math.floor(x), u = x - i; return R0[((i % M) + M) % M] * (1 - u) + R0[(((i + 1) % M) + M) % M] * u; };

  // RUKA = deblji kratki "valjak" od 3 kruga, ukorijenjen ispod kože.
  // rame: smjer iz središta (°, 0 = desno, + = dolje); kut: smjer ruke; duljina: koliko izlazi; debljina: polumjer.
  // Granice: ruka nikad ne smije biti tanka ni duga.
  const SPOJ = 24;   // koliko se mekano koža popunjava između ruke i tijela
  const RUKA_GRANICE = { debljina: [24, 32], duljina: [0, 92] };
  function rukaPolumjer(a, ruka) {
    const ps = ruka.rame * Math.PI / 180, ka = ruka.kut * Math.PI / 180;
    const rb = R0u(ps) - ruka.uvuceno;
    const B = [C[0] + Math.cos(ps) * rb, C[1] + Math.sin(ps) * rb];
    const dx = Math.cos(a), dy = Math.sin(a);
    let r = -1e9;
    for (const k of [0, 0.5, 1]) {
      const Q = [B[0] + Math.cos(ka) * ruka.duljina * k, B[1] + Math.sin(ka) * ruka.duljina * k];
      const qx = Q[0] - C[0], qy = Q[1] - C[1];
      const tp = qx * dx + qy * dy, dperp = Math.abs(qx * dy - qy * dx), rho = ruka.debljina * (k === 1 ? 0.96 : 1);
      const s = dperp / rho;
      const v = s < 1 ? tp + rho * Math.sqrt(1 - s * s) : tp - rho * (s - 1) * 1.6;
      r = smax(r, v, 6);
    }
    return r;
  }
  const zrcali = r => ({ ...r, rame: 180 - r.rame, kut: 180 - r.kut });

  // ---- spajanje tijela i ruku kao dvije kapi (glatki minimum udaljenosti) ----
  const smin = (a, b, k) => { const h = Math.max(k - Math.abs(a - b), 0) / k; return Math.min(a, b) - h * h * k * 0.25; };
  const KORAK = 5, GX0 = -260, GY0 = -255, GW = Math.ceil(520 / KORAK) + 1, GH = Math.ceil(450 / KORAK) + 1;
  const polje = new Float32Array(GW * GH);
  function udaljOdTijela(px, py, tijelo, rU) {
    let best = 1e9;
    for (let i = 0; i < tijelo.length; i++) {
      const a = tijelo[i], b = tijelo[(i + 1) % tijelo.length];
      const ex = b[0] - a[0], ey = b[1] - a[1], wx = px - a[0], wy = py - a[1];
      const t = Math.max(0, Math.min(1, (wx * ex + wy * ey) / (ex * ex + ey * ey)));
      const dx = wx - ex * t, dy = wy - ey * t, d = dx * dx + dy * dy;
      if (d < best) best = d;
    }
    const dd = Math.sqrt(best);
    const ang = Math.atan2(py - C[1], px - C[0]);
    return Math.hypot(px - C[0], py - C[1]) < rU(ang) ? -dd : dd;
  }
  function udaljOdRuke(px, py, ruka) {
    const ps = ruka.rame * Math.PI / 180, ka = ruka.kut * Math.PI / 180;
    const rb = R0u(ps) - ruka.uvuceno;
    const A = [C[0] + Math.cos(ps) * rb, C[1] + Math.sin(ps) * rb];
    const B = [A[0] + Math.cos(ka) * ruka.duljina, A[1] + Math.sin(ka) * ruka.duljina];
    const ex = B[0] - A[0], ey = B[1] - A[1], wx = px - A[0], wy = py - A[1];
    const L2 = ex * ex + ey * ey;
    const t = L2 > 0 ? Math.max(0, Math.min(1, (wx * ex + wy * ey) / L2)) : 0;
    return Math.hypot(wx - ex * t, wy - ey * t) - ruka.debljina * (1 - 0.06 * t);
  }
  function obrisIzPolja() {
    // marching squares -> najdulja zatvorena petlja
    const veze = new Map(), tocka = new Map();
    const kljucH = (i, j) => j * GW + i, kljucV = (i, j) => GW * GH + j * GW + i;
    const v = (i, j) => polje[j * GW + i];
    const tH = (i, j) => { const a = v(i, j), b = v(i + 1, j), u = a / (a - b); return [GX0 + (i + u) * KORAK, GY0 + j * KORAK]; };
    const tV = (i, j) => { const a = v(i, j), b = v(i, j + 1), u = a / (a - b); return [GX0 + i * KORAK, GY0 + (j + u) * KORAK]; };
    const spoji = (k1, p1, k2, p2) => {
      tocka.set(k1, p1); tocka.set(k2, p2);
      (veze.get(k1) || veze.set(k1, []).get(k1)).push(k2);
      (veze.get(k2) || veze.set(k2, []).get(k2)).push(k1);
    };
    for (let j = 0; j < GH - 1; j++) for (let i = 0; i < GW - 1; i++) {
      const a = v(i, j) < 0, b = v(i + 1, j) < 0, c = v(i + 1, j + 1) < 0, d = v(i, j + 1) < 0;
      const slucaj = (a ? 8 : 0) | (b ? 4 : 0) | (c ? 2 : 0) | (d ? 1 : 0);
      if (slucaj === 0 || slucaj === 15) continue;
      const G = [kljucH(i, j), () => tH(i, j)], D = [kljucV(i + 1, j), () => tV(i + 1, j)],
            Do = [kljucH(i, j + 1), () => tH(i, j + 1)], L = [kljucV(i, j), () => tV(i, j)];
      const par = (x, y) => spoji(x[0], x[1](), y[0], y[1]());
      switch (slucaj) {
        case 1: case 14: par(L, Do); break;
        case 2: case 13: par(Do, D); break;
        case 3: case 12: par(L, D); break;
        case 4: case 11: par(G, D); break;
        case 6: case 9:  par(G, Do); break;
        case 7: case 8:  par(L, G); break;
        case 5: par(L, G); par(Do, D); break;
        case 10: par(G, D); par(L, Do); break;
      }
    }
    let najbolja = [], vidjeno = new Set();
    for (const start of veze.keys()) {
      if (vidjeno.has(start)) continue;
      const petlja = []; let prev = null, cur = start;
      while (cur !== undefined && !vidjeno.has(cur)) {
        vidjeno.add(cur); petlja.push(tocka.get(cur));
        const n = veze.get(cur); const next = n[0] !== prev ? n[0] : n[1];
        prev = cur; cur = next;
      }
      if (petlja.length > najbolja.length) najbolja = petlja;
    }
    return najbolja;
  }

  // ---------- LICE ----------
  // =====================================================================
  //  LICE = nekoliko neovisnih "mišića"; izraz je samo njihova kombinacija.
  // =====================================================================
  const LICE = { oci: [[-30, -58], [36, -58]], obrve: [[-32, -94], [38, -94]], usta: [3, -24] };
  const NEUTRALNO = {
    otvL: 1, otvD: 1,          // gornji kapak: 1 = otvoreno, 0 = zatvoreno
    smijehL: 0.12, smijehD: 0.12, // donji kapak / obraz: 1 = oko postane ^
    kapak: 0,                  // nagib gornjeg kapka: + = odlučno (unutra niže), − = nježno
    zjenica: 1,                // veličina zjenice
    gledX: 0, gledY: 0,        // pogled koji traži izraz (dodaje se slobodnom pogledu)
    obrvaL: 0, obrvaD: 0,      // visina obrva (− = gore)
    obrvaNagib: 0,             // + = unutarnji krajevi gore (suosjećanje), − = dolje (odlučnost)
    osmijeh: 1, otvor: 0, sirina: 1, kosina: 0,
    rumenilo: 0,
  };
  const IZRAZI = {
    osmijeh:     { opis: 'osnovni, prijateljski' },
    veselo:      { opis: 'otvoren osmijeh', smijehL: 0.35, smijehD: 0.35, osmijeh: 1.1, otvor: 0.45, obrvaL: -4, obrvaD: -4 },
    smijeh:      { opis: 'smije se na sav glas', smijehL: 1, smijehD: 1, osmijeh: 1.15, otvor: 1, sirina: 1.1, obrvaL: -6, obrvaD: -6, rumenilo: 0.7 },
    namig:       { opis: 'zaigrano drzak', smijehD: 1, otvD: 0.85, obrvaD: 4, obrvaL: -8, osmijeh: 1.05, kosina: 0.6, smijehL: 0.2 },
    znatizelja:  { opis: 'jedna obrva gore', obrvaD: -13, obrvaL: 2, zjenica: 1.12, osmijeh: 0.5, otvor: 0.18, sirina: 0.7, kosina: 0.4, smijehL: 0.05, smijehD: 0.05 },
    iznenaden:   { opis: 'oho!', otvL: 1.12, otvD: 1.12, smijehL: 0, smijehD: 0, zjenica: 0.75, obrvaL: -15, obrvaD: -15, osmijeh: 0.25, otvor: 0.95, sirina: 0.5 },
    razmislja:   { opis: 'hmm…', gledX: 0.6, gledY: -0.75, obrvaL: -10, obrvaD: 2, osmijeh: 0.12, sirina: 0.55, kosina: -0.9, smijehL: 0.1, smijehD: 0.1, otvL: 0.95, otvD: 0.95 },
    ponosan:     { opis: 'zadovoljan sobom', smijehL: 1, smijehD: 1, osmijeh: 1.2, obrvaL: -3, obrvaD: -3, rumenilo: 0.6 },
    suosjecanje: { opis: 'nakon pogreške: nježan, nikad razočaran', obrvaNagib: 1, obrvaL: -3, obrvaD: -3, osmijeh: 0.6, sirina: 0.8, smijehL: 0.22, smijehD: 0.22, kapak: -0.5 },
    odlucan:     { opis: '"ajmo!"', obrvaNagib: -1, obrvaL: 3, obrvaD: 3, kapak: 0.5, smijehL: 0.25, smijehD: 0.25, osmijeh: 1, otvor: 0.35, sirina: 1.05, kosina: 0.25 },
    sramezljiv:  { opis: 'pohvaljen pa se srami', gledX: -0.6, gledY: 0.6, rumenilo: 1, osmijeh: 0.75, sirina: 0.6, smijehL: 0.4, smijehD: 0.4, obrvaNagib: 0.6 },
    ne_znam:     { opis: 'tko zna…', obrvaL: -10, obrvaD: -10, obrvaNagib: 0.7, osmijeh: 0.3, sirina: 0.75, kosina: -0.5 },
    pospan:      { opis: 'teški kapci', otvL: 0.5, otvD: 0.5, smijehL: 0, smijehD: 0, obrvaL: 3, obrvaD: 3, osmijeh: 0.45, sirina: 0.7 },

  // oko: krug ograničen gornjim kapkom (ravna crta) i donjim kapkom (luk koji se diže kod osmijeha)

  const GLAS = [{"naslov": "Lesson 1", "recenice": ["Welcome to your first real Croatian lesson!", "Here's a secret: you already speak some Croatian. *Hotel*, *banana*, *čokolada*, *restoran* — these are all Croatian words, and you just read them perfectly.", "By the end of this lesson you'll describe houses, cars, the sea and your coffee — in Croatian.", "To say anything about anything, Croatian needs just one little word: **je** (*is*).", "Notice what's missing? No *the*, no *a*. Croatian skips articles entirely. You're welcome.", "Bravo! You just built your first Croatian sentences — with no articles to worry about and spelling you can always trust."]}, {"naslov": "Vocabulary 1", "recenice": ["Your first Croatian flashcard deck — every word sounds exactly as it's written. Tap to reveal meaning & pronunciation.", "You just met them — now catch them! Tap the English meaning before the timer runs out.", "One word, one card. How the endings change is Grammar's job — here just learn the words."]}, {"naslov": "Grammar 1", "recenice": ["You've already *used* everything on this page — now let's name it.", "**Every noun has a gender.** You don't have to memorise it — the word's last letter almost always tells you.", "**One exception worth knowing.** *Auto* ends in **-o**, but it is masculine. There are only a handful like it."]}, {"naslov": "Practice 1", "recenice": ["Time to read real Croatian!"]}, {"naslov": "Lesson 2", "recenice": ["In Lesson 1 you described houses and coffee. Now it's time to talk about *people* — including yourself.", "One verb, six forms — and you already know one of them:", "Spot the pattern: *student* is a man, *studentica* is a woman. Same with *profesor/profesorica*, *doktor/doktorica*. Croatian loves this **-ica** ending.", "Odlično! You can now introduce yourself, describe people, and handle the most important verb in Croatian."]}, {"naslov": "Vocabulary 2", "recenice": ["Everything you need to talk about people, starting with yourself. Tap to reveal.", "The most important verb in Croatian.", "The final round mixes this lesson with everything from Lesson 1 — how much do you remember?"]}, {"naslov": "Grammar 2", "recenice": ["Here's the complete map of the verb you've been using — the most important verb in Croatian.", "When in doubt in Croatia: start with **vi** — locals will offer you *ti* quickly."]}, {"naslov": "Practice 2", "recenice": ["Four people introduce themselves. See how far you get before you tap EN."]}, {"naslov": "Lesson 3", "recenice": ["So far you can *describe* the world: the coffee is good, the day is beautiful. Now you'll make things *happen* in it.", "And notice something: you often don't even need *ja*. The verb ending already tells everyone who's doing it. Efficient, right?", "The ending is the name tag: **-m** = me, **-š** = you, no extra ending = he/she. It works the same for *piti* (pijem, piješ, pije) and *jesti* (jedem, jedeš, jede) — the middle changes a bit, but the endings never lie.", "Sjajno! You can now say what you and others are doing — and you've cracked the verb-ending code that runs the whole language."]}, {"naslov": "Vocabulary 3", "recenice": ["Nine verbs that cover most of your day. Tap to reveal."]}, {"naslov": "Grammar 3", "recenice": ["In Lesson 3 your ear learned the endings. Here's the system behind them.", "**Drop the pronoun:** the ending already says who. *Pijem sok.* = *Ja pijem sok.* — both correct, the short one more natural. Keep the pronoun only for emphasis: *JA pijem sok* (me, not you)."]}, {"naslov": "Practice 3", "recenice": ["A whole day of actions — see how much you catch on the first read."]}, {"naslov": "Lesson 4", "recenice": ["You can describe things, introduce people, and say what everyone's doing. But so far, your Croatian comes out one short sentence at a time.", "Today you get three tiny connector words — **i**, **a**, **ali** — and suddenly your sentences flow: *Tata kuha, a brat uči.* Dad cooks, and my brother studies.", "You'll practice them on the warmest topic there is: **obitelj** — the family.", "English uses \"and\" for the first two — Croatian is more precise. If the second part is a contrast-but-not-conflict, use **a**. If it's a real \"but\", use **ali**.", "Izvrsno! Your Croatian now flows in full, connected sentences — and you can talk about the whole family."]}, {"naslov": "Vocabulary 4", "recenice": ["Start with the people closest to you. Notice how many end in **-a** — Croatian family words are mostly short and warm."]}, {"naslov": "Grammar 4", "recenice": ["The test: if English \"and\" could be replaced by \"while/whereas\", Croatian wants **a**. If it's a twist, **ali**."]}, {"naslov": "Practice 4", "recenice": ["A family in one page. See if you can tell who does what."]}, {"naslov": "Lesson 5", "recenice": ["Today is a big day. You're going shopping at a Croatian market — and on the way, you'll unlock the thing Croatian is famous for: **cases**.", "Don't worry. Your first case changes exactly *one letter*. Watch:", "When a feminine word (ending in **-a**) becomes the *target* of an action — the thing you drink, buy, or love — its **-a** turns into **-u**. That's the whole rule. Let's go shopping.", "You just discovered it yourself: **-a → -u** when the word is on the receiving end of the action. Grammarians call this the *accusative case* — you can just call it the target form.", "Čestitamo! You just learned your first Croatian case — and survived. One letter changed, a whole grammar door opened."]}, {"naslov": "Vocabulary 5", "recenice": ["Every word here ends in **-a**, and every one of them turns that -a into **-u** the moment you drink it, eat it or buy it. Learn each one as a pair."]}, {"naslov": "Grammar 5", "recenice": ["**What a \"case\" is:** Croatian shows a word's *role* in the sentence by changing its ending."]}, {"naslov": "Practice 5", "recenice": ["Your accusative in action"]}, {"naslov": "Lesson 6", "recenice": ["Last lesson you mastered the *-a → -u* trick for feminine words. Today you take the accusative to the city — and discover something charming about Croatian: it treats *living beings* differently from *things*.", "Things stay the same. People and animals get **-a**. Let's catch that tram.", "Two quirks to meet today: *pas* squeezes into **psa** (*Gledam psa*), and *policajac* drops a letter: **policajca**.", "Bravo! You now handle the accusative for *everything* in the singular — things, food, people and pets."]}, {"naslov": "Vocabulary 6", "recenice": ["Living masculine nouns, each shown with its target form. Five of them squeeze a letter out on the way: **policajac → policajca**, **kupac → kupca**, **pas → psa**."]}, {"naslov": "Grammar 6", "recenice": ["Croatian likes to mark *who can be affected* by an action. Things can't care; beings can.", "This is why Lesson 3 felt easy: every object there was a \"no change\" word. Sneaky, right?"]}, {"naslov": "Practice 6", "recenice": ["City life, written the way Croatians actually write it."]}, {"naslov": "Lesson 7", "recenice": ["One coffee, one friend, one tram — so far, everything came one at a time. Today the world multiplies: *knjiga* becomes *knjige*, *učenik* becomes *učenici*, and verbs finally learn to say **we**, **you all** and **they**.", "We'll practice in the liveliest place possible: a Croatian school full of children and songs.", "One exception today: *dijete* → **djeca** (children). Some words are too important to follow rules.", "Sjajno! You can now talk about many things at once — and your verbs finally have their full present-tense family."]}, {"naslov": "Vocabulary 7", "recenice": ["Masculine nouns take **-i**. Watch the four where a **k** softens into **c** on the way: *učenik → učenici*."]}, {"naslov": "Grammar 7", "recenice": ["With this page your present tense is *complete* — all six persons — and nouns can finally come in groups.", "**The rebels.** Four words ignore everything above: *dijete → **djeca***, *brat → **braća***, *čovjek → **ljudi***, *riječ → **riječi***. Learn them as words, not rules."]}, {"naslov": "Practice 7", "recenice": ["A school day in the plural — classmates, books and all."]}, {"naslov": "Lesson 8", "recenice": ["Summer is coming — *ljeto dolazi!* Time to make plans: the sea, ice cream, swimming every day...", "The Croatian future is refreshingly simple: take a tiny helper word (**ću** — \"I will\"), add the verb's dictionary form, and you're done. *Plivat ću!* — I will swim! No new endings to learn — and you have already met the helper's negative twin, *neću*, back in Grammar 3.", "Recognize the rhythm? *ću–ćeš–će–ćemo–ćete–će* echoes *sam–si–je–smo–ste–su*.", "Odlično! Past lessons gave you the present; now the future is yours too. Your summer plans are officially in Croatian."]}, {"naslov": "Vocabulary 8", "recenice": ["Croatia in summer, in one deck. **more** is the sea itself; going *na more* is what everyone says for \"to the coast\"."]}, {"naslov": "Grammar 8", "recenice": ["Rule of thumb: the helper *never* stands first — it's shy, it always leans on another word."]}, {"naslov": "Practice 8", "recenice": ["Summer plans — the kind of message you'll get from a Croatian friend in June."]}, {"naslov": "Lesson 9", "recenice": ["Today's lesson is full of words you already know: *hobi, gitara, klub, trener, kapetan, gol...* Sport is international, and so is its vocabulary.", "The new bit: making things *yours*. **Moj** klub, **tvoja** gitara, **naš** trener. And yes — these little words dance with gender exactly like adjectives do. By now, that's your superpower.", "The familiar trio again — consonant / -a / -o(-e). You've done this dance twice already.", "Bravo! Things are officially *yours* now — your club, your guitar, your Croatian."]}, {"naslov": "Vocabulary 9", "recenice": ["Sport speaks Croatian with an accent you'll recognize instantly."]}, {"naslov": "Grammar 9", "recenice": ["The possessives are adjectives at heart — they agree with the *thing owned*, not the owner.", "English speakers: this is the one trap."]}, {"naslov": "Practice 9", "recenice": ["A club, a hobby, and a few people who take theirs seriously."]}, {"naslov": "Lesson 10", "recenice": ["You can describe, ask, plan and dream in Croatian. One thing is missing: telling stories. *What did you do yesterday?*", "Good news: the past tense recycles something you've known since Lesson 2 — the verb *biti*.", "Let's talk about yesterday.", "All three are fine — *sam* just always leans on the first word.", "ČESTITAMO! Lessons 1–10 complete — you're halfway through the course. You can now speak about the present, the future *and* the past. That's the full timeline of a language."]}, {"naslov": "Vocabulary 10", "recenice": ["Everything for telling stories about yesterday.", "The past participles — your storytelling toolkit."]}, {"naslov": "Grammar 10", "recenice": ["The participle shows the speaker's gender."]}, {"naslov": "Practice 10", "recenice": ["Your perfekt in the wild"]}, {"naslov": "Lesson 11", "recenice": ["So far you've mostly been *telling* — now you'll start *asking*. Today's mission: buy the perfect birthday present.", "Seven little question words and one magic particle — **li** — and every conversation opens up.", "And the friendly tag at the end: *Voliš glazbu, **zar ne**?* — You like music, *don't you*?", "Izvrsno! You can now ask about anything — who, what, where, when, why and how. Conversations are officially two-way."]}, {"naslov": "Vocabulary 11", "recenice": ["Everything you need to ask and wonder."]}, {"naslov": "Grammar 11", "recenice": ["No question word? Use **li** — glue it right after the verb."]}, {"naslov": "Practice 11", "recenice": ["A present arrives, and nobody will say who sent it."]}, {"naslov": "Lesson 12", "recenice": ["You've been suspiciously agreeable for eleven lessons. Time to fix that.", "Today you learn to refuse soup, reject onions and declare that you *never* drink milk. Croatian negation is delightfully simple — one little word, **ne**, placed right before the verb. Plus two special verbs with attitude. Let's say no!", "English teachers hate this. Croatian grammar requires it. Enjoy the freedom.", "Bravo! You can now refuse, deny and protest — politely and grammatically."]}, {"naslov": "Vocabulary 12", "recenice": ["The complete toolkit for saying no — plus adjectives and cognates."]}, {"naslov": "Grammar 12", "recenice": ["In Croatian, negatives stack — and they *must*."]}, {"naslov": "Practice 12", "recenice": ["A family of picky eaters. Nobody agrees about dinner."]}, {"naslov": "Lesson 13", "recenice": ["Since Lesson 5 you can say where you're *going*: *Idem u grad.* Today you learn where you *are*: *Ja sam **u gradu**.*", "One tiny ending — **-u** for most words, **-i** for feminine ones — and the whole city becomes describable: at the café, in the park, at the office on a Friday night (hopefully not).", "Same *u/na* logic as before: **u** = inside, **na** = on/at open places & events.", "Sjajno! You now know where you're going AND where you are — the city is fully yours."]}, {"naslov": "Vocabulary 13", "recenice": ["Your map of the town, with the \"being there\" form on every card."]}, {"naslov": "Grammar 13", "recenice": ["Same endings, two jobs — the ending tells you whether you've arrived."]}, {"naslov": "Practice 13", "recenice": ["Everyone is somewhere different, and it's Friday night."]}, {"naslov": "Lesson 14", "recenice": ["December in Croatia: presents for everyone! But who gets what? *Mami* a scarf, *bratu* a ball, *sestri* a guitar...", "Those endings — **-i** and **-u** — mark the *receiver*. It's the dative case, and good news: you've already seen both endings in the locative. Croatian recycles!", "Word order is flexible — the receiver can come first for emphasis: *Mami kupujem šal, a tati knjigu.*", "Divno! You can now give, send and bring things to anyone — Croatian generosity unlocked."]}, {"naslov": "Vocabulary 14", "recenice": ["Receivers with their dative form, plus the giving verbs."]}, {"naslov": "Grammar 14", "recenice": ["The dative marks the *receiver* — the person something goes to."]}, {"naslov": "Practice 14", "recenice": ["December, and everyone is buying something for someone."]}, {"naslov": "Lesson 15", "recenice": ["Friday night! You're going out — but *with whom* and *how*?", "Today's case is the instrumental — the case of company and means. It's the last case of this module, and arguably the most social one.", "Think of it as: the vehicle is your instrument. (That's literally why it's called the instrumental!)", "ČESTITAMO! Module C complete — you can ask, refuse, locate, give and accompany. That's five of Croatia's seven cases already under your belt."]}, {"naslov": "Vocabulary 15", "recenice": ["Friends, outings and ways to get there.", "Means of transport (no preposition!) and new verbs."]}, {"naslov": "Grammar 15", "recenice": ["The most common English-speaker mistake: \"idem s vlakom\" — you're not *accompanying* the train, you're *using* it. No s!", "Five down, two to go — you're past the hardest part."]}, {"naslov": "Practice 15", "recenice": ["A night out and a train ride, both in the instrumental."]}, {"naslov": "Lesson 16", "recenice": ["Whose house? Grandma's. Coffee without what? Without sugar. From where? From Zagreb.", "All three answers live in one case — the **genitive**, the case of *belonging, origin and absence*. It's the last big case of the course, and after dative and locative, its endings will feel like familiar territory.", "*Nema* + genitive says something's missing — one of the most Croatian phrases there is:", "Bravo! Belonging, origin and absence — the genitive completes your everyday case toolkit."]}, {"naslov": "Vocabulary 16", "recenice": ["Grandma's world, with the genitive on every card."]}, {"naslov": "Grammar 16", "recenice": ["The genitive answers **koga? / čega?** — and it's Croatia's busiest case.", "**Case toolkit — complete!** Six of seven — only the vocative remains, and you've been using it in dialogues all along."]}, {"naslov": "Practice 16", "recenice": ["Grandma's house, and the road that leads to the sea."]}, {"naslov": "Lesson 17", "recenice": ["Time to give orders — politely, of course. Recipes, directions, a bossy football coach: they all run on the **imperative**.", "Croatian commands are short and punchy: *Uzmi!* (take!), *Idi!* (go!), *Miješaj!* (mix!). Today you'll learn them the best way there is: by making pancakes.", "Odlično! You can now give directions, run a kitchen and coach a football team — all in Croatian."]}, {"naslov": "Vocabulary 17", "recenice": ["Commands for recipes and directions — plus the soft \"don't\"."]}, {"naslov": "Grammar 17", "recenice": ["**Familiar faces:** you've been obeying imperatives all course long: *Izvolite? Oprostite! Dobro došli!* — all commands in disguise."]}, {"naslov": "Practice 17", "recenice": ["A recipe, a set of directions, and a coach who shouts."]}, {"naslov": "Lesson 18", "recenice": ["Imagine: a million euros lands in your account. What *would* you do?", "Croatian dreams run on the **conditional**. The recipe is sweet and familiar: the past participle you know from Lesson 10 + a tiny new helper. Let's dream.", "Krasno! You can now dream, wish and order coffee like a true gentleman/lady: *Htio bih...*"]}, {"naslov": "Vocabulary 18", "recenice": ["For dreaming out loud."]}, {"naslov": "Grammar 18", "recenice": ["**The politeness machine:** the conditional is Croatian's \"please-mode\".", "You'll hear it — but write *bismo/biste*; every teacher will thank you."]}, {"naslov": "Practice 18", "recenice": ["A million euros, and a perfect day nobody has had yet."]}, {"naslov": "Lesson 19", "recenice": ["Here's Croatian's deepest secret, saved for near the end: almost every verb has a *twin*.", "One twin describes the *doing*, the other the *getting done*. English needs whole phrases for this — Croatian does it with a prefix. Once you see it, you'll see it everywhere.", "The tell-tale words: *cijeli dan / dugo / svaki dan* → process. *Napokon / odmah / za dvije minute* → done.", "Fantastično! You've cracked aspect — the concept that makes Slavic languages famous. You now hear the difference between *doing* and *done*."]}, {"naslov": "Vocabulary 19", "recenice": ["Verb twins and the time words that go with them."]}, {"naslov": "Grammar 19", "recenice": ["Every Croatian verb carries a built-in answer to one question: *is the action complete?*", "**The homework trap:** one prefix, very different conversation."]}, {"naslov": "Practice 19", "recenice": ["A letter that took all afternoon, and a mother who wants to know if it's finished."]}, {"naslov": "Lesson 20", "recenice": ["Twenty lessons ago, your first sentence was *Kava je dobra* — three words.", "The final ingredients: five little connectors and one word — *koji* — that glues whole thoughts together. Let's finish strong.", "You did it. Twenty lessons ago you knew *banana* and *hotel*. Now you can:"]}, {"naslov": "Vocabulary 20", "recenice": ["The vocabulary of memories — the last batch of the course!", "The final sprint of the course — tap the English meaning!"]}, {"naslov": "Grammar 20", "recenice": ["Connectors for big thoughts."]}, {"naslov": "Practice 20", "recenice": ["Your last text is someone remembering a summer. Read it slowly."]}];
  const PRAVILA = [

  // rečenica -> odsječci (obično / *kurziv* / **podebljano**) i čisti tekst
  function rastavi(md) {
    const seg = []; const re = /(\*\*[^*]+\*\*|\*[^*]+\*)/g; let zadnji = 0, m;
    while ((m = re.exec(md))) {
      if (m.index > zadnji) seg.push({ t: md.slice(zadnji, m.index) });
      const b = m[0].startsWith('**'); seg.push({ t: m[0].slice(b ? 2 : 1, b ? -2 : -1), b, i: !b });
      zadnji = m.index + m[0].length;
    }
    if (zadnji < md.length) seg.push({ t: md.slice(zadnji) });
    return seg;
  }
  // koja gluma ide uz rečenicu i kad (položaj u čistom tekstu)
  let zadnjaGestaBila = false;
  function rezija(md) {
    const cist = rastavi(md).map(x => x.t).join(''), cues = [];
    for (const P of PRAVILA) {
      const m = P.re.exec(cist.replace(/\*/g, '')); if (!m) continue;
      const pos = P.kada === 'odmah' ? 0 : P.kada === 'na_kraju' ? Math.max(0, cist.length - 2) : m.index;
      // najviše jedna gesta po oblačiću, i ne dvije za redom (osim pohvale i pozdrava)
      let gesta = P.gesta;
      if (gesta && zadnjaGestaBila && !/pohvala|pozdrav/.test(P.vrsta)) gesta = null;
      cues.push({ pos, izraz: P.izraz, gesta, vrsta: P.vrsta });
      if (P.poslije) cues.push({ pos: pos + 12, izraz: P.poslije });
      break;   // prva pogođena vrsta određuje glumu rečenice
    }
    if (!cues.length) cues.push({ pos: 0, izraz: 'osmijeh', vrsta: 'pripovijedanje' });
    zadnjaGestaBila = cues.some(c => c.gesta);
    return cues;
  }

  // ---- oblačić i ispis slovo po slovo ----

  // tekst se DODAJE kao novi odlomak; ništa što je već napisano ne nestaje
  function izgovori(md, cues, gotovo, ocisti) {
    const seg = rastavi(md); if (ocisti) oblacic.innerHTML = '';
    const p = document.createElement('p'); oblacic.appendChild(p);
    const elementi = seg.map(x => { const e = document.createElement(x.b ? 'b' : x.i ? 'i' : 'span'); p.appendChild(e); return e; });
    oblacic.classList.remove('prazan'); oblacicOtvoren = true;
    ispis = { seg, elementi, si: 0, ci: 0, pos: 0, sljedeci: performance.now() + 250, cues: cues.slice().sort((a, b) => a.pos - b.pos), gotovo };
    slobodno = false; oznaci();

  function korakIspisa(sad) {
    if (!ispis) return;
    while (ispis && sad >= ispis.sljedeci) {
      // gluma koja čeka ovaj položaj
      while (ispis.cues.length && ispis.cues[0].pos <= ispis.pos) {
        const c = ispis.cues.shift();
        if (c.izraz) osnovniIzraz = c.izraz;
        if (c.gesta) pokreni(c.gesta === 'pokazuje' && stranaOblacica < 0 ? 'pokazuje_lijevo' : c.gesta);
        oznaci();
      }
      const S = ispis.seg[ispis.si];
      if (!S) {                                     // kraj rečenice
        govori = false; govorOtvor = 0; const g = ispis.gotovo; ispis = null; if (g) g(); return;
      }
      if (ispis.ci === 0 && S.b) mikroOd = sad;     // naglašena riječ: podigne obrve
      const z = S.t[ispis.ci];
      ispis.elementi[ispis.si].textContent += z;
      ispis.ci++; ispis.pos++;
      if (ispis.ci >= S.t.length) { ispis.si++; ispis.ci = 0; }
      govori = true;
      // usta: samoglasnik otvori, suglasnik skoro zatvori, razmak i interpunkcija zatvore
      govorOtvor = SAMOGL.includes(z) ? 0.3 + Math.random() * 0.3 : /[a-zčćžšđ]/i.test(z) ? 0.1 : 0;
      ispis.sljedeci += /[.!?]/.test(z) ? 230 : /[,;:—]/.test(z) ? 120 : z === ' ' ? 14 : 22;
      if (/[.!?,;:—]/.test(z)) { govorOtvor = 0; }
    }
  }
  // dodir na oblačić: odmah ispiše ostatak (gluma koja je čekala — samo zadnji izraz, bez naknadnih gesta)
  oblacic.addEventListener('click', () => {
    if (!ispis) return;
    for (let i = ispis.si; i < ispis.seg.length; i++) ispis.elementi[i].textContent = ispis.seg[i].t;
    const zadnjiIzraz = ispis.cues.filter(c => c.izraz).pop(); if (zadnjiIzraz) { osnovniIzraz = zadnjiIzraz.izraz; oznaci(); }
    govori = false; govorOtvor = 0; const g = ispis.gotovo; ispis = null; if (g) g();
  });
  function zatvoriOblacic() { oblacic.classList.add('prazan'); oblacicOtvoren = false; }

  // ---- lekcija: čita svoje rečenice redom ----
  let red = null;
  function pustiRed(recenice, naKraju) {
    red = { recenice, i: 0, prva: true }; zadnjaGestaBila = false; sljedecaURedu(naKraju);
  }
  function sljedecaURedu(naKraju) {
    if (!red) return;
    if (red.i >= red.recenice.length) { red = null; setTimeout(() => { osnovniIzraz = 'osmijeh'; oznaci(); }, 1800); return; }   // tekst OSTAJE
    const md = red.recenice[red.i++], prva = red.prva; red.prva = false;
    izgovori(md, rezija(md), () => {
      // sljedeća rečenica kreće nakon kratke stanke; prethodne ostaju u oblačiću
      red && (red.timer = setTimeout(() => { if (red) { osnovniIzraz = 'osmijeh'; sljedecaURedu(naKraju); } }, 1100));
    }, prva);
  }
  function zaustavi() { if (red && red.timer) clearTimeout(red.timer); red = null; ispis = null; govori = false; }

  // gumbi režije
  const sel = document.createElement('select');
  GLAS.forEach((o, i) => { const op = document.createElement('option'); op.value = i; op.textContent = o.naslov + ' (' + o.recenice.length + ')'; sel.appendChild(op); });
  $('rezija').appendChild(sel);
  const gumbR = (t, fn) => { const b = document.createElement('button'); b.textContent = t; b.addEventListener('click', fn); $('rezija').appendChild(b); return b; };
  gumbR('▶ pročitaj', () => { zaustavi(); pustiRed(GLAS[+sel.value].recenice); });
  gumbR('■ stani', () => { zaustavi(); osnovniIzraz = 'osmijeh'; oznaci(); });
  gumbR('✕ očisti', () => { zaustavi(); oblacic.innerHTML = ''; zatvoriOblacic(); });
  gumbR('⇄ strana', () => { stranaOblacica *= -1; $('pozornica').classList.toggle('zdesna', stranaOblacica < 0); });
  for (const ime in DOGADAJI) {
    const b = document.createElement('button'); b.textContent = ime; $('dogadaji').appendChild(b);
    b.addEventListener('click', () => {
      zaustavi(); const D = DOGADAJI[ime];
      izgovori(D.tekst, D.glume.map(([pos, izraz, gesta]) => ({ pos, izraz, gesta })), () => setTimeout(() => { osnovniIzraz = 'osmijeh'; oznaci(); }, 2600), true);   // tekst ostaje
    });
  }

  // ---------- petlja ----------
  let zadnje = performance.now();
  function okvir(sad) {
    const dt = Math.min(0.05, (sad - zadnje) / 1000); zadnje = sad;
    const t = sad / 1000, amp = smanjeno ? 0.25 : 1;
    korakIspisa(sad);

    // opušteno disanje: polako, duboko
    const dah = amp * Math.sin(t * 1.1);                 // -1..1
    let ist = 1 + 0.012 * dah, sx = 1 - 0.009 * dah;   // udah: malo viši i uži
    const g = gesta(sad);
    const rukaD = { ...O, ...(g.D || {}) };
    const rukaL = zrcali({ ...O, ...(g.L || {}) });
    rukaD.rame += amp * 2 * Math.sin(t * 1.1 + 0.5); rukaL.rame -= amp * 2 * Math.sin(t * 1.1 + 1.7);
    // okret: sam ponekad pogleda u stranu; geste imaju svoj okret
    if (sad > sljedeciOkret) {
      const izbor = [0, 0, 0, -0.35, 0.35, -0.6, 0.6];
      ciljOkret = izbor[Math.floor(Math.random() * izbor.length)];
      sljedeciOkret = sad + 3500 + Math.random() * 4500;
    }
    if (govori || oblacicOtvoren) ciljOkret = 0.18 * stranaOblacica;
    const zeljeni = fiksniOkret !== null ? fiksniOkret : (g.aktivna ? g.okret + ciljOkret * 0.2 : ciljOkret);
    okret += (ogr(zeljeni, -1, 1) - okret) * (fiksniOkret !== null ? 1 : 1 - Math.exp(-dt * (g.aktivna ? 12 : 3)));
    // ruka na udaljenoj strani djelomično se skrije iza tijela
    const daleka = okret > 0 ? rukaL : rukaD, ao = Math.abs(okret);
    const mirna = 1 - ogr((daleka.duljina - 8) / 40, 0, 1);   // skriva se samo ruka u mirovanju
    daleka.uvuceno += 10 * ao * mirna; daleka.duljina *= 1 - 0.25 * ao * mirna;
    // koliko su ruke podignute (0..1): ruke vuku tijelo prema gore
    const gore = r => ogr(-Math.sin(r.kut * Math.PI / 180), 0, 1) * ogr((r.duljina - 8) / 70, 0, 1);
    const uD = gore(rukaD), uL = gore(rukaL);
    const lift = ogr(Math.max(uD, uL) * 0.65 + Math.min(uD, uL) * 0.35, 0, 1);
    ist *= 1 + 0.08 * lift; sx /= Math.sqrt(1 + 0.08 * lift);
    const gnj = g.gnjec || 0, nagib = g.nagib || 0, skok = g.skok || 0;
    ist *= 1 - gnj; sx /= Math.sqrt(1 - gnj);           // gnječenje / istezanje (volumen ostaje)
    for (const r of [rukaD, rukaL]) {
      r.debljina = ogr(r.debljina, ...RUKA_GRANICE.debljina); r.duljina = ogr(r.duljina, ...RUKA_GRANICE.duljina);
    }
    const bb = [amp * 2.5 * Math.sin(t * 0.9), amp * 2.5 * Math.sin(t * 0.9 + 2.1), amp * 2.5 * Math.sin(t * 0.9 + 4.2)];
    // osnovno tijelo (s brežuljcima) u polarnom obliku
    const RB = R0.map((r, i) => { const a = KUT(i); BREZ.forEach((ab, j) => { const d = kutnaUdalj(a, ab) / 0.11; r += bb[j] * Math.exp(-d * d / 2); }); return r; });
    const rU = ang => { const x = ((ang + Math.PI / 2) / (2 * Math.PI)) * M; const i = Math.floor(x), u = x - i; return RB[((i % M) + M) % M] * (1 - u) + RB[(((i + 1) % M) + M) % M] * u; };
    const tijeloPol = RB.map((r, i) => [C[0] + Math.cos(KUT(i)) * r, C[1] + Math.sin(KUT(i)) * r]);
    for (let j = 0; j < GH; j++) for (let i = 0; i < GW; i++) {
      const px = GX0 + i * KORAK, py = GY0 + j * KORAK;
      let dRD = udaljOdRuke(px, py, rukaD), dRL = udaljOdRuke(px, py, rukaL);
      let dd;
      if (Math.min(dRD, dRL) > 60) {           // daleko od ruku: dovoljna je gruba procjena
        const r = Math.hypot(px - C[0], py - C[1]) - rU(Math.atan2(py - C[1], px - C[0]));
        dd = Math.abs(r) > 25 ? r : udaljOdTijela(px, py, tijeloPol, rU);
      } else {
        dd = udaljOdTijela(px, py, tijeloPol, rU);
        dd = smin(dd, dRD, SPOJ); dd = smin(dd, dRL, SPOJ);
      }
      polje[j * GW + i] = dd;
    }
    const pts = obrisIzPolja().map(([x, y]) => [-15 + (x + 15) * sx + (okret * 10 + nagib) * glatko(DNO, -150, y), DNO - (DNO - y) * ist]);
    const NN = pts.length;
    let d = `M${f(pts[0][0])} ${f(pts[0][1])}`;
    for (let i = 0; i < NN; i++) {
      const p0 = pts[(i - 1 + NN) % NN], p1 = pts[i], p2 = pts[(i + 1) % NN], p3 = pts[(i + 2) % NN];
      d += `C${f(p1[0] + (p2[0] - p0[0]) / 6)} ${f(p1[1] + (p2[1] - p0[1]) / 6)} ${f(p2[0] - (p3[0] - p1[0]) / 6)} ${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])} ${f(p2[1])}`;
    }
    koza.setAttribute('d', d + 'Z');
    // lice diše zajedno s glavom
    glava.setAttribute('transform', `translate(${f(-15 * (1 - sx) + okret * 7 + nagib * 0.7)} ${f(DNO * (1 - ist))}) scale(${sx.toFixed(4)} ${ist.toFixed(4)})`);

    const visina = amp * 3 * Math.sin(t * 1.1 - 0.5) - 9 * lift - skok;
    tijelo.setAttribute('transform', `translate(0 ${f(visina)})`);
    sjena.setAttribute('rx', f(150 * (1 + visina / 200)));

    // pogled: prati pokazivač kad se miče, inače mirno gleda u tebe i ponekad skrene
    if (sad - pokVrijeme < 1500) { ciljGX = ogr(pokX / 260, -0.7, 0.7); ciljGY = ogr((pokY + 50) / 260, -0.6, 0.6); }
    else if (sad > sljedeciPogled) {
      const r = Math.random();
      if (r < 0.5) { ciljGX = 0; ciljGY = 0; } else { ciljGX = (Math.random() * 2 - 1) * 0.6; ciljGY = (Math.random() * 2 - 1) * 0.3; }
      sljedeciPogled = sad + 2500 + Math.random() * 3500;
    }
    // pogled skače brzo (kao pravo oko), ne klizi
    const k = 1 - Math.exp(-dt * 22); gx += (ciljGX - gx) * k; gy += (ciljGY - gy) * k;

    // koji izraz vrijedi sad: gesta ima prednost pred osnovnim
    const ime = (g.aktivna && g.izraz) || osnovniIzraz;
    if (ime !== zadnjiIzraz) {
      const a = IZRAZI[zadnjiIzraz], b = IZRAZI[ime];
      const razlika = Math.abs(a.otvL - b.otvL) + Math.abs(a.smijehL - b.smijehL) + Math.abs(a.obrvaL - b.obrvaL) / 10 + Math.abs(a.otvor - b.otvor);
      if (razlika > 0.6 && b.otvL > 0.5 && b.smijehL < 0.8 && !STAT_LICE) treptajOd = sad;   // kod velike promjene trepne
      zadnjiIzraz = ime;
    }
    const C2 = { ...IZRAZI[ime] };
    // sitni život lica: ponekad kratko podigne obrve
    if (!STAT_LICE && sad > sljedeciMikro) { mikroOd = sad; sljedeciMikro = sad + 4000 + Math.random() * 6000; }
    const mu = (sad - mikroOd) / 450;
    if (mu >= 0 && mu < 1 && !g.aktivna) { const v = Math.sin(mu * Math.PI); C2.obrvaL -= 5 * v; C2.obrvaD -= 5 * v; }
    if (govori) { C2.otvor = Math.max(C2.otvor * 0.5, govorOtvor); C2.sirina *= 0.92 + govorOtvor * 0.2; }
    for (const key in NEUTRALNO) {
      const brz = govori && (key === 'otvor' || key === 'sirina') ? 30 : BRZINA[key];
      F[key] += (C2[key] - F[key]) * (STAT_LICE ? 1 : 1 - Math.exp(-dt * brz));
    }

    if (sad > sljedeciTreptaj && !STAT_LICE) { treptajOd = sad; sljedeciTreptaj = sad + 2500 + Math.random() * 4000; }
    const tu = (sad - treptajOd) / 150, treptaj = tu >= 0 && tu < 1 ? 1 - Math.sin(tu * Math.PI) : 1;

    // pogled: slobodni (pokazivač / lutanje) + ono što izraz traži + okret tijela
    const imaPogled = IZRAZI[ime].gledX !== 0 || IZRAZI[ime].gledY !== 0;
    const gX = ogr((STAT_LICE ? 0 : imaPogled ? gx * 0.2 : gx) + F.gledX + okret * 0.5, -1, 1);
    const gY = ogr((STAT_LICE ? 0 : imaPogled ? gy * 0.2 : gy) + F.gledY, -1, 1);
    oko($('okoL'), 0, F.otvL * treptaj, F.smijehL, gX, gY);
    oko($('okoD'), 1, F.otvD * treptaj, F.smijehD, gX, gY);
    obrva($('obrvaL'), 0); obrva($('obrvaD'), 1);
    usta();
    // obrazi: rumenilo ispod očiju
    [$('obrazL'), $('obrazD')].forEach((el, i) => { const r = F.rumenilo; el.setAttribute('cx', LICE.oci[i][0] + (i ? 4 : -4)); el.setAttribute('cy', LICE.oci[i][1] + 30); el.setAttribute('rx', f(15 * Math.sqrt(r))); el.setAttribute('ry', f(8 * Math.sqrt(r))); el.setAttribute('opacity', f(ogr(r * 6, 0, 1))); });
    // kad se smije, obrazi dignu cijelo lice malo gore
    $('lice').setAttribute('transform', `translate(0 ${f(-3 * Math.max(F.smijehL, F.smijehD))})`);
    const L = LICE;
    okreniDio($('okoL'), L.oci[0][0]); okreniDio($('okoD'), L.oci[1][0]);
    okreniDio($('obrvaL'), L.obrve[0][0]); okreniDio($('obrvaD'), L.obrve[1][0]);
    okreniDio($('usta'), L.usta[0]);
    okreniDio($('obrazL'), L.oci[0][0]); okreniDio($('obrazD'), L.oci[1][0]);
    requestAnimationFrame(okvir);
  }
  requestAnimationFrame(okvir);
})();
