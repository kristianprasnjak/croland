<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<title>Pikselizacija slika</title>
<style>
  :root {
    --bg: #f4f2ee;
    --panel: #ffffff;
    --border: #ddd8d0;
    --text: #2a2724;
    --muted: #7a746c;
    --accent: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 17px;
    margin: 0;
    white-space: nowrap;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .controls label {
    font-size: 13px;
    color: var(--muted);
  }
  #res {
    width: 200px;
  }
  #resVal {
    font-variant-numeric: tabular-nums;
    min-width: 34px;
    display: inline-block;
    font-weight: 600;
  }
  #count {
    font-size: 13px;
    color: var(--muted);
    margin-left: auto;
  }
  main {
    padding: 20px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card canvas {
    width: 100%;
    aspect-ratio: 1 / 1;
    display: block;
    background: #eee;
    image-rendering: pixelated;
  }
  .card .name {
    font-size: 12px;
    padding: 6px 8px;
    text-align: center;
    color: var(--text);
    border-top: 1px solid var(--border);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
</style>
</head>
<body>
<header>
  <h1>Pikselizacija slika</h1>
  <div class="controls">
    <label for="res">Rezolucija (piksela po strani):</label>
    <input type="range" id="res" min="2" max="128" value="12" step="1">
    <span id="resVal">12</span>
  </div>
  <span id="count"></span>
</header>
<main>
  <div class="grid" id="grid"></div>
</main>

const grid = document.getElementById('grid');
const resInput = document.getElementById('res');
const resVal = document.getElementById('resVal');
const countEl = document.getElementById('count');

countEl.textContent = FILES.length + ' slika';

const items = FILES.map(file => {
  const card = document.createElement('div');
  card.className = 'card';

  const canvas = document.createElement('canvas');
  canvas.width = 200;
  canvas.height = 200;

  const nameEl = document.createElement('div');
  nameEl.className = 'name';
  nameEl.textContent = file.replace(/\.webp$/i, '');

  card.appendChild(canvas);
  card.appendChild(nameEl);
  grid.appendChild(card);

  const img = new Image();
  img.src = 'slike/' + encodeURIComponent(file);

  return { canvas, ctx: canvas.getContext('2d'), img, loaded: false };
});

items.forEach(item => {
  item.img.onload = () => {
    item.loaded = true;
    draw(item, parseInt(resInput.value, 10));
  };
  item.img.onerror = () => {
    item.ctx.fillStyle = '#eee';
    item.ctx.fillRect(0, 0, item.canvas.width, item.canvas.height);
    item.ctx.fillStyle = '#999';
    item.ctx.font = '12px sans-serif';
    item.ctx.textAlign = 'center';
    item.ctx.fillText('greška', item.canvas.width / 2, item.canvas.height / 2);
  };
});

function draw(item, steps) {
  if (!item.loaded) return;
  const { canvas, ctx, img } = item;
  const w = canvas.width, h = canvas.height;

  ctx.imageSmoothingEnabled = true;
  ctx.clearRect(0, 0, w, h);

  const off = document.createElement('canvas');
  off.width = steps;
  off.height = steps;
  const offCtx = off.getContext('2d');
  offCtx.imageSmoothingEnabled = true;
  offCtx.drawImage(img, 0, 0, steps, steps);

  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(off, 0, 0, steps, steps, 0, 0, w, h);
}

function redrawAll() {
  const steps = parseInt(resInput.value, 10);
  resVal.textContent = steps;
  items.forEach(item => draw(item, steps));
}

resInput.addEventListener('input', redrawAll);
redrawAll();
</script>
